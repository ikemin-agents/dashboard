  /* 投稿済み（全部済み）は最後の工程を真ん中へ送る（スマホ） */
  if (!dead && cur >= SV_STEPS.length) marks[marks.length - 1].focus = true;
  return { marks, curName, dead };
}
const markHTML = m => `<span class="mark ${m.cls}" title="${esc(m.tip)}">${m.gl}</span>`;
/* 広い画面の表の12列のマス */
const flowCellsHTML = it => stepMarks(it).marks.map(m => `<td class="st">${markHTML(m)}</td>`).join('');
/* スマホのカードの1行（印の下に名前）。横に動かせる。いまの工程は centerFlowRows が真ん中へ送る */
function flowRowHTML(it){
  const { marks, curName, dead } = stepMarks(it);
  return `<div class="prow${dead ? ' dead' : ''}" role="group" aria-label="工程 ${esc(curName)}">${marks.map((m, i) =>
    `<span class="ps"${m.focus ? ' data-focus="1"' : ''}>${markHTML(m)}<span class="pl${m.cur ? ' cur' : ''}${
      m.skip ? ' skip' : ''}">${stepLabelHTML(SV_STEPS[i])}</span></span>`).join('')}</div>`;
}
/* スマホのカードの工程の行を、いまの工程が真ん中に来るように送る（一覧を描いたとき・画面の幅が変わったとき）。
   表示されていない（広い画面で隠れている）行は幅が 0 なので何もしない */
function centerFlowRows(root){
  (root || document).querySelectorAll('.prow').forEach(r => {
    const c = r.querySelector('[data-focus]');
    if (!c || !r.clientWidth) return;
    r.scrollLeft = Math.max(0, c.offsetLeft - (r.clientWidth - c.offsetWidth) / 2);
  });
}

/* 見出しの窓（工程・ジャンル）の値と件数（#637）。値は番組の全行にある物だけ（工程は SF_STAGES の並び、
   ジャンルは五十音順）。件数は「番組全体で、自分の列以外の条件（文字の検索・もう一方の列）を当てた本数」で数える
   ——表示中の100件だけで数えると、ページを送るたびに数字が動いてしまう（前の工程のチップと同じ数え方）。
   母数は facets（stage_key / genre_label / search_text の3列だけ）から作る。
   仕分け待ちは既定に含める（没と違って生きているネタ）。没は既定では外す（listQuery・HF_TABLES の def） */
function stockFacetOpts(facets){
  const qs = state.stockQ.trim().toLowerCase(), f = state.stockF, all = facets || [];
  const rows = all.filter(r => !qs || String(r.search_text || '').includes(qs));
  const stOk = r => f.stage ? f.stage.includes(r.stage_key) : r.stage_key !== 'dropped';
  const gOk = r => !f.genre || f.genre.includes(r.genre_label);
  const count = (list, k) => list.reduce((m, r) => { m[r[k]] = (m[r[k]] || 0) + 1; return m; }, {});
  const sn = count(rows.filter(gOk), 'stage_key'), gn = count(rows.filter(stOk), 'genre_label');
  const stages = new Set(all.map(r => r.stage_key));
  const genres = [...new Set(all.map(r => r.genre_label))].sort((a, b) => String(a).localeCompare(String(b), 'ja'));
  return {
    stage: SF_STAGES.filter(o => stages.has(o.v)).map(o => ({ v: o.v, t: o.t, n: sn[o.v] || 0 })),
    genre: genres.map(g => ({ v: g, t: g, n: gn[g] || 0 }))
  };
}

/* 既定の並び順（#203・2026-08-11 オーナー指定 / #205 で【AI】修正中を追加）
   ① 承認待ち（あなたが動く番）→ ② 【AI】修正中（あなたの指摘をAIが対応中）→ ③ 進行中
   → ④ 投稿済み・予約中 → ⑤ ネタ案
   ネタ案は着手前で見るものが無いので最後に沈める。グループ内は ④ だけ「投稿日時の新しい順」
   （これから公開される予約が上・過去の投稿が下）、それ以外は滞留日数の降順（待たせている順）。
   ⚠️ この並べ替えは **DB 側（v_dashboard_list の sort_rank / sort_key2・M027）** にある
      （#215 Phase 2）。手元で並べ替えると「先に100件取ってから並べる」ことになり、
      承認待ちの動画が2ページ目に隠れて見逃す。列見出しクリックの並べ替えも同じ理由で
      DB へ渡している（listOrder / SORT_DB）。 */

/* ── 一覧のセクション（在庫とレビューの統合・オーナー要望 2026-08-19）────────────
   「あなたの番 →【AI】作業中 → 承認済み・投稿まで → 完了 → ネタ案 → 没」の順に見出しを立てて並べる。
   承認した動画が一覧から消えず【AI】作業中に残り続けるのが主目的（承認＝レビュー一覧から
   消える、だとどこへ行ったのか分からない）。完了・ネタ案・没は既定で畳み、件数だけ見せる。
   「承認済み・投稿まで」は投稿待ち（承認は済み・予約はまだ）と予約済み（YouTube に登録済み・公開
   時刻待ち）。以前は「完了」に投稿済みと混ざっていた（オーナー要望 2026-09-30「予約済みと投稿待ちは
   違うので、投稿されるまでは完了ではなく別のまとまりに」）。進行係が予約する番組（雑学・歯科）も、
   人が公開を決める番組（力わざ・からくり・検証）も同じここに入る。
   並びは DB 側の sort_rank（承認待ち→修正中→進行中→投稿済み→ネタ案）のまま見出しを差し込む。
   手元で並べ直すのは、承認待ちの中（直した版を先頭へ）と「承認済み・投稿まで」の中だけ（groupSections）。
   絞り込み・並べ替え中は順番の意味が変わるのでセクションを外し、素直な一覧にする。
   ⚠️ 作業中の記録がある動画（#637）は、承認待ちが残っていても【AI】作業中に入れる。DB の sort_rank も
   同じ扱い（記録がある行を【AI】作業中の位置に並べる）で、**二重に持っている**——どちらかを変えたら両方直す。
   承認待ちの件数（loadPending）も記録がある動画を数えない */
const SECTIONS = [
  /* 検証のタブも本編と同じ言葉（2026-09-29 オーナー決定・ACT_WORDS と同じ） */
  {key:'rv',   label:'あなたの番 — 承認待ち',      hint:'素材を見て、承認するか修正を依頼してください'},
  /* ネタの仕分け（#314）。台本の型カタログの3型に乗らずAIが起草を見送った案。
     AI は没にしないので、ここに溜まったものはオーナーが必ず1回見る */
  {key:'triage', label:'あなたの番 — ネタの仕分け',
   hint:'台本の型に乗らなかったネタです。切り口を変える／このまま作る／没 を選んでください'},
  {key:'ai',   label:AI_TAG + '作業中',            hint:'AIが自動で進めています（差し戻した分の直しもここ）'},
  /* 公開を人が決める番組（力わざ・からくり）と検証のタブでは、予約を待っているわけではないので
     言葉を替える（hintManual・secHeadInner）。どこが自動かは書かない（静的な HTML は誰でも読めるため） */
  {key:'wait', label:'承認済み・投稿まで',          hint:'予約か公開を待っています。あなたの操作は要りません',
   hintManual:'承認は済んでいます。公開の時期はまだ決まっていません'},
  {key:'done', label:'完了（投稿済み）',            fold:true},
  {key:'idea', label:'ネタ案（未着手）',            fold:true},
  {key:'drop', label:'没',                         fold:true}
];
/* 予約済み＝YouTube に登録済みで公開時刻を待っている。DB の工程は「投稿済」に入るが、まだ公開されていない */
const isResv = it => it.stage === 'posted' && it.pub_status === '予約済';
function sectionOf(it){
  if (it.stage === 'dropped') return 'drop';
  if (it.stage === 'triage')  return 'triage';  /* ネタの仕分け待ち（#314）。ゲートは持たない */
  /* 作業中の記録がある（#637）。承認待ちより優先する。投稿済み・予約済みは記録があっても動かさない
     （DB の並び 091 の「記録あり AND stage <> 'posted'」と同じ） */
  if (it._work && it.stage !== 'posted') return 'ai';
  if (it._rv) return 'rv';                    /* あなたの番。工程より優先する */
  if (it._rc) return 'ai';                    /* 差し戻しの直し中も AI の番 */
  if (it.stage === 'queue' || isResv(it)) return 'wait';
  if (it.stage === 'posted') return 'done';
  if (it.stage === 'idea') return 'idea';
  return 'ai';
}
/* 「承認済み・投稿まで」の並び（オーナー要望 2026-09-30）: 予約済みを公開の予定時刻の早い順、
   そのあとに投稿待ちを承認の古い順。承認の時刻が無い行（記録の無い古い動画）は工程が変わった時刻で代える。
   時刻が読めない行は後ろへ。同じ値どうしは DB が付けた並びのまま（Array#sort は安定） */
const tsOf = iso => { const t = Date.parse(iso || ''); return isNaN(t) ? Infinity : t; };
const waitKey = it => isResv(it)
  ? [0, tsOf(it.scheduled_at)]
  : [1, tsOf(it[GATE_COLUMN_FIELD.final] || it.status_changed_at)];
const waitCmp = (a, b) => { const x = waitKey(a), y = waitKey(b);
  return x[0] - y[0] || (x[1] === y[1] ? 0 : (x[1] < y[1] ? -1 : 1)); };
const sectionsOff = () => !!(state.stockSort || state.stockF.stage
  || state.stockF.genre || state.stockQ.trim());
const secOpen = s => !s.fold || !!state.secOpen[s.key];
function groupSections(rows){
  const g = {};
  rows.forEach(it => { const k = sectionOf(it); (g[k] = g[k] || []).push(it); });
  /* 承認待ちの中だけ「あなたの指摘を直した版」を先頭へ寄せる（オーナー要望 2026-09-02）。
     Array#sort は安定なので、札が同じもの同士は DB が付けた並び（滞留の長い順）のまま。 */
  if (g.rv) g.rv.sort((a, b) => (reworkOf(b) === 'human') - (reworkOf(a) === 'human'));
  if (g.wait) g.wait.sort(waitCmp);
  return SECTIONS.map(s => Object.assign({}, s, {rows: g[s.key] || []})).filter(s => s.rows.length);
}
/* 公開を人が決めるタブ（進行係を通らない番組と、検証のタブ）。offDispatcherItem と同じ見分け方 */
const manualPubTab = () => state.ch === PILOT_CH || STORAGE_ONLY_CH.has(state.ch);
/* 見出しの共通部分（表の行とスマホのカード見出しで同じ文言・同じ開閉状態を使う） */
function secHeadInner(s){
  const hint = (state.ch === PILOT_CH && s.hintPilot) ? s.hintPilot
    : (s.hintManual && manualPubTab()) ? s.hintManual : s.hint;
  return `<span class="sn">${s.fold ? `<span class="tri">${secOpen(s) ? '▾' : '▸'}</span>` : ''}${esc(s.label)}</span>
    <span class="n">${s.rows.length}件</span>${hint ? `<span class="hint">${esc(hint)}</span>` : ''}`;
}
const secAttrs = s => s.fold
  ? ` data-secfold="${s.key}" tabindex="0" role="button" aria-expanded="${secOpen(s)}"` : '';

/* ── 進捗マトリクスの列（オーナー要望 2026-09-03 / 同日の差し戻しを反映）────────
   状態・版・指摘をタイトルのマスから出して独立した列にした。ワッペンをタイトルの
   後ろに流し込むと、タイトルの長さでワッペンの位置がずれて読めない、が理由。
   w＝その列の固定幅。table-layout:fixed なので、ここに書いた幅がそのまま列幅になる
   （幅を書いていないタイトル列だけが残り幅を取る）。列幅が中身に左右されない＝
   区画がどれでもワッペンの左端と縦位置が揃う。
   flow は工程の12列の位置の目印（詳細画面の帯と同じ12個・#637）。見出しは2段で、上の段に「工程」の欄、
   その下に1列ずつ（mtxHead・mtxRow・mtxCols が flow を12列に開く）。幅を書かない工程の12列が残りを等分し、
   タイトルは幅を書かず、画面の幅に合わせて残りを取る。作業中の記録がある動画は、タイトルの下に
   「いまの工程」の1行（nowLineHTML。スマホのカード・詳細画面と同じ部品）を出す。
   td を丸ごと返すのは、投稿日時が値の有無で中身もツールチップも変わるため。
   sort:1 の列だけ見出しを押して並べ替えできる（キー名は SORT_DB と揃える）。 */
/* 表の投稿日時は列幅を詰めてあるので年と曜日を落とす（全文はツールチップに残す）。
   例: 2026-08-30(土) 18:00 → 08-30 18:00 */
const shortDT = s => String(s || '').replace(/^\d{4}-/, '').replace(/\([日月火水木金土]\)/, '');
/* 投稿日（予約済み＝公開の予定時刻・投稿済み＝公開した時刻。ほかは無し）。年だけ落として曜日は残す
   例: 2026-08-30(土) 18:00 → 08-30(土) 18:00 */
const stDate = it => isResv(it) ? it.resv : it.stage === 'posted' ? it.pub : null;
const stDateHTML = it => { const d = stDate(it);
  return d ? `<span class="stdt" title="${esc(d)} に${isResv(it) ? '公開予定' : '公開'}">${esc(d.replace(/^\d{4}-/, ''))}</span>` : ''; };
const MCOL = {
  seq:   {sort:1, w:'74px',        td: it => `<td class="seq">${esc(it.seq)}</td>`},
  /* hf＝見出しの右端に置く、列の無い絞り込み（ジャンル・#637） */
  title: {sort:1, hf:'genre', td: it => `<td class="ttl">${esc(it.title)}${nowLineHTML(it)}</td>`},
  state: {label:'ステータス', w:'108px', td: it => `<td class="bcol">${badgeHTML(stageBadge(it))}</td>`},
  /* 投稿日＝予約済みは公開の予定時刻、投稿済みは公開した時刻（stDateHTML）。ほかは空欄。どの番組も同じ形 */
  when:  {label:'投稿日', w:'136px', td: it => `<td>${stDateHTML(it)}</td>`},
  /* 版・直した指摘・ユーザー確認は承認待ちの行だけ。作業中の記録がある行（#637）は AI の番なので出さない */
  rev:   {label:'版',   w:'44px', thx:' nar', td: it => `<td class="num nar">${it._work ? '' : revNumHTML(it)}</td>`},
  src:   {label:'直した指摘', w:'120px', td: it => `<td class="bcol">${it._work ? '' : srcBadgeHTML(it)}</td>`},
  /* あなたがこの動画を見るのは何回目か（1回目・2回目…）。幅は見出し「ユーザー確認」（約 71px）が余白 6px ずつと少しの余裕を持って入る幅 */
  looks: {label:'ユーザー確認', w:'88px', thx:' num nar', td: it => `<td class="num nar">${it._work ? '' : looksHTML(it)}</td>`},
  open:  {label:'指摘', w:'56px', thx:' nar', td: it => `<td class="bcol nar">${openBadgeHTML(it)}</td>`},
  flow:  {label:'工程'},
  genre: {sort:1, w:'136px',        td: it => `<td><span class="genre">${esc(it.genreLabel)}</span></td>`},
  days:  {sort:1, w:'52px', thx:' num nar',
          td: it => `<td class="num nar">${it.days == null ? '' : it.days + '日'}</td>`},
  pub:   {label:'投稿日時', w:'120px',
          td: it => it.resv ? `<td title="${esc(it.resv)}"><span class="resv">🗓 ${esc(shortDT(it.resv))}</span></td>`
                  : it.pub  ? `<td title="${esc(it.pub)}">${esc(shortDT(it.pub))}</td>` : '<td></td>'},
  plays: {sort:1, w:'84px', thx:' num',
          td: it => `<td class="num">${it.plays == null ? '' : nf(it.plays)}</td>`},
  subs:  {sort:1, w:'78px', thx:' num',
          td: it => `<td class="num">${it.subs == null ? '' : (it.subs > 0 ? '+' : '') + it.subs}</td>`},
  ok:    {label:'承認', thx:' okcol', td: it => `<td class="okcol">${quickOkHTML(it)}</td>`}
};
/* 列は全区画で共通の1セット（オーナー差し戻し 2026-09-03）。区画ごとに列を変えると
   表を分けることになり、区画のあいだで列幅が揃わずワッペンの縦位置がずれる。
   値が無いマスは「—」を並べず空欄にする（読むものが減るほうが速い）。 */
/* ジャンルの列は外した（オーナー指示 2026-09-19・承認の判断に使わない。絞り込みのジャンル選択は残す） */
/* 投稿日時・再生数・登録者増も外した（同日・数字は分析タブで見る） */
/* 版・直した指摘・指摘も外した（#637・オーナー指摘「4列がごちゃごちゃして分かりにくい」）。承認待ちの行に残すのは
   「あなたが何回目に見るか」のユーザー確認の1列だけ。外した3列の幅はタイトルの列に回る。詳細画面の札はそのまま */
/* 並びは左から「いまどうなっているか」（ステータス・投稿日・滞留）→ 工程 → 「あなたがすること」（ユーザー確認・承認） */
const MCOLS    = ['seq','title','state','when','days','flow','looks','ok'];
/* 表の列の数（flow は工程の12列） */
const colCount = cols => cols.reduce((n, k) => n + (k === 'flow' ? SV_STEPS.length : 1), 0);

function colTH(k){
  const c = MCOL[k], w = c.w ? ` style="width:${c.w}"` : '';
  if (!c.sort) return `<th class="${(c.thx || '').trim()}"${w}>${esc(c.label || '')}</th>`;
  const s = state.stockSort, on = s && s.key === k;
  const lb = SORT_LABEL[k] + (on ? `<span class="ar">${s.dir === 'asc' ? '▲' : '▼'}</span>` : '');
  /* 列の無い絞り込み（ジャンル）は、その見出しの右端に置く（hf・#637。ルールの工程を本文の見出しの右端に置くのと同じ）。
     見出しの字を押すと並べ替え、右端のボタンを押すと絞り込みの窓 */
  return `<th class="sortable${c.thx || ''}" data-sort="${k}"${w}>${c.hf
    ? `<span class="thf"><span>${lb}</span>${hfBtn('stock', c.hf)}</span>` : lb}</th>`;
}
/* 列見出しは2段（#637）。上の段は工程の12列の上に「工程」の欄、下の段に列の名前（工程は帯の名前・長い2つは略・
   承認ポイントは ◆。マウスを載せると正式名）。
   右端の承認の列は表が横に送れる幅で右に貼り付くので、上の段でも別のマス（.okcol）にして一緒に貼り付ける。
   1つのマスにまとめると、送れる幅で工程の欄の薄い青の地が承認の列の上まで見え、下の行と右端がずれる（okLast） */
const okLast = cols => cols[cols.length - 1] === 'ok';
function mtxHead(cols){
  const ok = okLast(cols) ? 1 : 0;
  const gi = cols.indexOf('flow'), right = cols.length - gi - 1 - ok;
  return `<tr>${gi ? `<th class="pad" colspan="${gi}"></th>` : ''}<th class="grp" colspan="${SV_STEPS.length}">${hfBtn('stock', 'stage')}</th>${
      right ? `<th class="pad" colspan="${right}"></th>` : ''}${ok ? '<th class="pad okcol"></th>' : ''}</tr>
    <tr>${cols.map(k => k === 'flow'
      ? SV_STEPS.map(s => `<th class="st" title="${esc(s.name)}">${stepLabelHTML(s)}</th>`).join('')
      : colTH(k)).join('')}</tr>`;
}
const mtxRow = (it, cols) => `<tr data-vid="${it.id}" tabindex="0" class="${
    (it.stage === 'dropped' ? 'dropped ' : '') + stateCls(it)}">${
    cols.map(k => k === 'flow' ? flowCellsHTML(it) : MCOL[k].td(it)).join('')}</tr>`;
/* 列幅は <colgroup> で決める。table-layout:fixed は「最初の行のセル」の幅しか見ないが、最初の行は「工程」の欄
   （colspan）なので、2段目の th に書いた幅は無視されて全列が均等割りになる。col に書けば行の中身に関係なく効く。
   幅を書かない工程の12列が残りを等分する（表の最小幅で 1列 46px 以上を残す） */
const mtxCols = cols => `<colgroup>${cols.map(k => k === 'flow'
    ? SV_STEPS.map(() => '<col class="stcol">').join('')
    : `<col${MCOL[k].w ? ` style="width:${MCOL[k].w}"` : (k === 'ok' ? ' style="width:var(--okcol-w)"' : '')}>`).join('')}</colgroup>`;
/* 工程の欄の左端の位置（表の左端から・工程より左の列の幅の合計）と欄の幅。区画の帯の行は全列 colspan の1マスなので、
   この2つで同じ位置に工程の欄の地と罫線を描く（CSS の .mtx tbody tr.secrow td・#637） */
const flowBoxStyle = cols => {
  const gi = cols.indexOf('flow');
  if (gi < 0) return '';
  /* タイトルの列は画面の幅で変わるので、欄の位置は右端から測る（工程より右で、帯の行のマスに入る列の幅の合計）。
     承認の列は帯の行では別のマスなので数えない（secTR） */
  const right = cols.slice(gi + 1, okLast(cols) ? -1 : undefined).map(k => MCOL[k].w).filter(Boolean);
  return ` style="--flow-r:calc(${right.length ? right.join(' + ') : '0px'}); --flow-w:calc(${SV_STEPS.length} * var(--st-w))"`;
};
/* 見出しの行に data-hf＝表の名前（見出しを押して絞り込む・ルール・素材と同じ部品＝HF_TABLES の stock） */
const mtxTable = (cols, body) => `<table${flowBoxStyle(cols)}>${mtxCols(cols)}<thead data-hf="stock">${mtxHead(cols)}</thead><tbody>${body}</tbody></table>`;

/* err＝取れなかったときの理由。見出し（スマホは札）は残し、行の所にエラーを出す（#637。見出しで条件を変えて取り直せるように） */
function matrixTable(core, err){
  const rows = err ? [] : core.items;   /* 絞り込み・並べ替え・ページ切りは DB 側で済んでいる */
  const N = colCount(MCOLS);
  /* 区画の見出しは表の中の帯行（全列 colspan）。表も列見出しも必ず1つに保つ
     ＝どの区画の行でも列の縦位置が揃う（オーナー差し戻し 2026-09-03）。
     右端の承認の列だけは別のマス（.okcol）にして、表が横に送れる幅で行と一緒に右に貼り付ける
     （1つのマスだと、工程の欄の地が承認の列の上まで見えて行と右端がずれる・#637） */
  const ok = okLast(MCOLS);
  const secTR = s => `<tr class="secrow s-${s.key}${s.fold ? ' foldable' : ''}"${secAttrs(s)}>
      <td colspan="${ok ? N - 1 : N}">${secHeadInner(s)}</td>${ok ? '<td class="okcol"></td>' : ''}</tr>`;
  const body = err ? `<tr class="emptyrow"><td colspan="${N}">${errBox(err)}</td></tr>`
    : !rows.length
    ? `<tr class="emptyrow"><td colspan="${N}">条件に一致する動画はありません</td></tr>`
    : sectionsOff() ? rows.map(it => mtxRow(it, MCOLS)).join('')
    : groupSections(rows).map(s =>
        secTR(s) + (secOpen(s) ? s.rows.map(it => mtxRow(it, MCOLS)).join('') : '')).join('');

  return `<div class="tblwrap mtx xscroll${rows.length > 14 ? ' tall' : ''}">${
    mtxTable(MCOLS, body)}</div>${stockCards(rows, err)}`;
}

/* 狭幅（スマホ）用のカード表示。表と同じ rows から描画し CSS で出し分ける */
/* 記号は絵文字を使わず文字グリフにする（バッジの文字色がそのまま乗るので、
   同じ状態なら在庫カードでもレビュー一覧でも完全に同じ見え方になる） */
function stageBadge(it){
  if (it.stage === 'dropped') return {cls:'idea', gl:'○', text:'没'};
  /* ネタの仕分け待ち（#314）＝あなたが動く番なので承認待ちと同じ色（rv） */
  if (it.stage === 'triage')  return {cls:'rv',   gl:'●', text:'仕分け待ち'};
  /* 予約済みは「投稿済」と分ける（オーナー要望 2026-09-30）。言葉は工程の帯の状態の欄と同じ。
     予定時刻は投稿日の列（stDateHTML。スマホのカードは札の左）とツールチップに出す */
  if (isResv(it))             return {cls:'pubwait', gl:'●', text:'予約済み',
                                      tip: it.resv ? `${it.resv} に公開予定` : '公開時刻を待っています'};
  if (it.stage === 'posted')  return {cls:'done', gl:'✓', text:'投稿済み'};
  /* 作業中の記録がある動画（#637）は承認待ち・修正中の札より作業中を出す（sectionOf と同じ） */
  if (it._work)               return {cls:'work', gl:'●', text:'AI作業中', tip:AI_TAG + workTitle(it._work)};
  const st = stateBadgeOf(it);
  if (st) return st;
  if (it.stage === 'idea')    return {cls:'idea', gl:'○', text:'ネタ案'};
  /* 投稿待ちは誰も作業していない（公開時刻待ち）ので【AI】は付けない */
  if (it.stage === 'queue')   return {cls:'pubwait', gl:'●', text:'投稿待ち'};
  return {cls:'work', gl:'●', text:'AI作業中', tip:stageWorkTip(PSTAGES[displayIdx(it)], it)};
}
function stockCards(rows, err){
  const card = it => {
    const b = stageBadge(it);
    /* 作業中の記録がある行（#637）は札の代わりに「いまの工程」の1行を出す（承認ボタンも出さない）。
       広い画面の表と同じく、版・直した指摘・指摘の札は出さず、承認待ちだけ「ユーザー確認 N回目」を添える（#637） */
    const badges = it._work ? ''
      : `${stDateHTML(it)}${badgeHTML(b)}${looksHTML(it, true)}${quickOkHTML(it)}`;
    /* 予約済み・投稿済みの日付は札の左に出す（表の投稿日の列と同じ中身）。下段は再生数だけ */
    const extra = it.stage === 'posted'
      ? (it.plays != null ? `<span class="sx">▶ ${nf(it.plays)} 回再生</span>` : '')
      : (it.pub ? `<span class="sx">📅 ${esc(it.pub)}</span>` : '');
    return `<article class="scard${it.stage === 'dropped' ? ' dropped' : ''} ${stateCls(it)}" data-vid="${it.id}" tabindex="0">
      <div class="scard-top">
        <span class="scard-seq">${esc(it.seq)}</span>
        <span class="scard-ttl">${esc(it.title)}</span>
        <span class="scard-days${it.days >= 7 ? ' slow' : ''}">${it.days >= 7 ? '⏳ ' : ''}滞留 ${it.days == null ? '—' : it.days + '日'}</span>
      </div>
      ${badges ? `<div class="sbadges">${badges}</div>` : ''}
      ${nowLineHTML(it)}
      ${flowRowHTML(it)}
      ${extra ? `<div class="scard-extra">${extra}</div>` : ''}
    </article>`;
  };
  const secHead = s => `<div class="csechead s-${s.key}${s.fold ? ' foldable' : ''}"${secAttrs(s)}>${
    secHeadInner(s)}</div>`;
  const body = err ? errBox(err)
    : !rows.length
    ? `<div class="noitem">条件に一致する動画はありません</div>`
    : sectionsOff() ? rows.map(card).join('')
    : groupSections(rows).map(s => secHead(s) + (secOpen(s) ? s.rows.map(card).join('') : '')).join('');
  /* スマホは表の見出しが無いので、絞り込める見出し（工程・ジャンル）だけを札の形で先頭に並べる
     （ルール・素材の 640px 以下と同じ形・同じ窓・#637） */
  const hf = `<div class="lsthead sk" data-hf="stock">${Object.keys(SF_COLS).map(c => hfBtn('stock', c)).join('')}</div>`;
  return `<div class="stockcards">${hf}${body}</div>`;
}

/* 説明は2本持つ: .ex＝PC の全文 / .exs＝スマホ用の10字以内。スマホで説明を全部消すと
   記号の意味が分からなくなるため、短い方だけ残す（#440 低14）。
   見本は一覧の行の工程の印（stepMarks）と同じ印（#637）。いまの工程の色は詳細画面の帯も同じ（curTone） */
const MARK_LEGEND = `<div class="legend2">
  <b>工程</b>
  <span class="lg"><span class="mark done">✓</span>済み</span>
  <span class="lg"><span class="mark work">●</span>AI作業中<span class="ex">（AIが自動で進めています）</span><span class="exs">（AIが進行中）</span></span>
  <span class="lg"><span class="mark rc">↺</span>AI修正中<span class="ex">（あなたが出した指摘をAIが直しています）</span><span class="exs">（指摘を直し中）</span></span>
  <span class="lg"><span class="mark rcai">↺</span>作り直し中<span class="ex">（AIの審査で指摘が出たので直しています。あなたの操作は要りません）</span><span class="exs">（AIの指摘で直し中）</span></span>
  <span class="lg"><span class="mark rv">●</span>承認待ち<span class="ex">（あなたの番）</span><span class="exs">（あなたの番）</span></span>
  <span class="lg"><span class="mark pubwait">●</span>投稿待ち</span>
  <span class="lg"><span class="mark skip"></span>なし</span></div>`;

/* ゲートが「いまの版で」承認済みか。approved_*_at は初回承認の時刻で版を知らない（差し戻しで
   版が進んでも残る）ので、そのゲートが承認待ち（*_state === 'review'）なら承認済みとは見せない
   （BZ0051 で第2版の承認が第4版の「✓完成」に見えていた・2026-09-18） */
function gateApproved(it, g){
  return !!it[GATE_COLUMN_FIELD[g]] && it[g + '_state'] !== 'review';
}
/* ページ送り（#215 Phase 2）。並び順は DB 側（sort_rank）で付けているので、
   1ページ目に必ず「承認待ち（あなたの番）」が来る。 */
function pagerHTML(core){
  const pages = Math.max(1, Math.ceil(core.total / PAGE_SIZE));
  if (pages <= 1) return '';
  const p = core.page;
  return `<div class="pager">
    <button class="btn" id="pgprev"${p <= 0 ? ' disabled' : ''}>← 前へ</button>
    <span class="pginfo">${p + 1} / ${pages} ページ<span class="pgtot">（全 ${nf(core.total)}件）</span></span>
    <button class="btn" id="pgnext"${p >= pages - 1 ? ' disabled' : ''}>次へ →</button>
  </div>`;
}

async function renderStock(){
  const el = $('#view-stock');
  if (!state.ch) { el.innerHTML = `<div class="noitem">動画チャンネルがありません</div>`; return; }
  if (!store.facets[state.ch]) { el.innerHTML = loading(); }
  try {
    await loadFacets(state.ch);                        /* 見出しの絞り込みの窓の値と件数 */
    await loadPending(state.ch);                       /* 左ナビ・チャンネルタブの承認待ちバッジ用 */
  } catch (e) { el.innerHTML = errBox(e.message); return; }
  if (rfPop && rfPop.tb === 'stock') closeRfPop();   /* 画面を作り直すと窓も消える */

  /* 見出し（「動画の一覧」・番組名と件数）は出さない（#637・オーナー指摘）。番組は上のタブで選んでいて、
     承認待ち・仕分け待ちの件数もタブの数字で分かるため。その分を一覧に回す。
     絞り込みはルール・素材と同じ形（#637）: 表の上は文字の検索と件数だけ、工程・ジャンルは見出しを押して出る窓のチェック
     （スマホは一覧の先頭に札の形で並べる・stockCards）。並べ替えは今までどおり見出しを押す */
  el.innerHTML = `
      <div class="toolbar">
        <input type="search" id="stockq" placeholder="番号・タイトルで探す" aria-label="番号・タイトルで探す" value="${esc(state.stockQ)}">
        <span class="hits" id="stockhits"></span>
      </div>
      ${MARK_LEGEND}
      <div id="stocktable">${loading()}</div>`;

  await refreshStockTable();
}

/* 続けて絞り込みを変えたとき（窓のチェックを続けて押すなど）、後から押した分の結果だけを描く */
let stockSeq = 0;
async function refreshStockTable(){
  if (!$('#stocktable')) return;
  const my = ++stockSeq;
  const stale = () => my !== stockSeq || !$('#stocktable');   /* 後の取り直しが始まった・画面が変わった */
  /* 見出しの窓の値と本数は手元の母数から先に作る（DB の取り直しを待たない。開いている窓の本数もここで合わせる） */
  stockOpts = stockFacetOpts(store.facets[state.ch]);
  if (rfPop && rfPop.tb === 'stock') syncRfPopCounts();
  let core;
  try { core = await loadCore(state.ch); }
  catch (e) {
    /* 取れなかったときも見出し（スマホは札）は残し、行の所にエラーを出す（条件を変えて取り直せるように） */
    if (stale()) return;
    $('#stocktable').innerHTML = matrixTable(null, e.message);
    $('#stockhits').textContent = '';
    if (rfPop && rfPop.tb === 'stock') placeRfPop();
    return;
  }
  if (stale()) return;
  /* 札（この版は何の作り直しか）に要る記録を、承認待ちのぶんだけ先に取る。
     取れなくても一覧は出す＝札が出ないだけで従来どおり読める */
  try { await loadRework(core.items); } catch (_) { /* 札なしで続行 */ }
  if (stale()) return;

  $('#stocktable').innerHTML = matrixTable(core) + pagerHTML(core);
  centerFlowRows($('#stocktable'));                  /* スマホのカードの工程の行を、いまの工程が真ん中に来るように */
  $('#stockhits').textContent = core.total
    ? `全 ${core.total} 件中 ${core.from + 1}–${core.from + core.items.length} 件を表示`
    : '0 件';
  syncStickyOffsets();
  if (rfPop && rfPop.tb === 'stock') placeRfPop();   /* 窓を開いたまま描き直したとき、見出しの下に置き直す */
}

/* ── 作業中の動画の取り直し（#637）───────────────────────────────────────
   画面が見えているあいだ、作業中の記録がある動画が1本でもあれば1分ごとに取り直す（進み具合・残り時間・
   止まっているかも、を進めるため）。一覧は表示中のページを DB から取り直し、詳細を開いていればその動画の
   1行だけを取り直して、帯と「いまの工程」の1行だけを描き直す（動画の再生・書きかけの指摘には触らない）。
   取れなかった回は前の表示のまま。記録が1本も無くなったら止まる */
const WORK_POLL_MS = 60 * 1000;
let workPolledAt = Date.now(), workPolling = false;
const workOnScreen = () => state.detail != null
  ? !!(curItem && curItem._work)
  : (state.view === 'stock' && !!store.core[state.ch] && store.core[state.ch].items.some(it => it._work));
async function pollWork(){
  if (workPolling || !state.user || document.visibilityState !== 'visible') return;
  /* 前面に戻ったときの取り直しと重ならないよう、直前に取ってから半分（30秒）たっていない回は見送る */
  if (Date.now() - workPolledAt < WORK_POLL_MS / 2 || !workOnScreen()) return;
  workPolling = true; workPolledAt = Date.now();
  try { if (state.detail != null) await pollWorkDetail(); else await pollWorkList(); }
  catch (_) { /* 前の表示のまま（次の回にまた取る） */ }
  finally { workPolling = false; }
}
async function pollWorkList(){
  const ch = state.ch, old = store.core[ch];
  delete store.core[ch];
  /* 先に取ってから描き直す（取れない回に表を読み込みエラーで消さない） */
  try { await loadCore(ch); } catch (_) { if (!store.core[ch]) store.core[ch] = old; return; }
  try { await loadPending(ch, true); renderShell(); } catch (_) { /* 件数は前のまま */ }
  if (state.ch === ch && state.detail == null && $('#stocktable')) await refreshStockTable();
}
async function pollWorkDetail(){
  const id = state.detail, it = curItem;
  if (!it || it.id !== id) return;
  const rows = await q(sb.from('v_dashboard_list').select('*').eq('id', id).limit(1));
  if (state.detail !== id || curItem !== it || !rows.length) return;
  it._work = workOf(rows[0]);
  /* 制作方法（#637）は作業の途中で入ることがあるので、帯の描き直しに一緒に持ち込む */
  for (const k of ['production_method', 'production_method_name', 'production_method_skip']) it[k] = rows[0][k];
  paintWorkNow();
}
/* 開いている詳細の帯と「いまの工程」の1行のうち、中身が変わった所だけを描き直す（#637）。帯は変わったマス
   （いまの工程の2行目・進みの棒など）だけ、「いまの工程」の1行は中身が変わったときだけ差し替える。
   シーンの素材・台本・動画には触らない（以前は帯ごと・いまのシーンの画像ごと1分ごとに作り直していた） */
function paintWorkNow(){
  const dv = $('#view-detail');
  if (!dv || !curItem) return;
  const flowChanged = svPatchFlow(dv, curItem);
  let lineChanged = false;
  const slot = dv.querySelector('[data-sv-worknow]');
  if (slot) {
    const html = nowLineHTML(curItem);
    const tpl = document.createElement('template');
    tpl.innerHTML = html;                        /* 同じ書き方に直してから比べる（属性の引用符などの違いで描き直さない） */
    if (tpl.innerHTML !== slot.innerHTML) { slot.innerHTML = html; lineChanged = true; }
  }
  if (!flowChanged && !lineChanged) return;
  if (dv.querySelector('.sview')) svRelayout({ repaint: false, fit: flowChanged });
  else if (flowChanged) fitDflow();
}
setInterval(pollWork, WORK_POLL_MS);
document.addEventListener('visibilitychange', () => { if (!document.hidden) pollWork(); });

/* ══ 詳細ドロワー ═══════════════════════════════════════════════ */

/* メモ・没理由は改行なしの長い地の文で保存されていることが多い（リサーチ結果の丸写し等）。
   保存値はそのままに、表示時だけ句点で折り返して読めるようにする。既に改行が入っている
   文字列には触らない（書き手が意図的に整形しているため） */
function sentenceWrap(s){
  const t = String(s || '');
  if (t.includes('\n')) return t;
  return t.replace(/。(?!\s*$)/g, '。\n');
}
function timelineRows(it){
  const cur = displayIdx(it);
  const stamp = {
    1: gateApproved(it, 'script')     ? it.approved_script_at     : null,
    2: gateApproved(it, 'storyboard') ? it.approved_storyboard_at : null,
    4: gateApproved(it, 'final')      ? it.approved_final_at      : null,
    6: it.published_at || it.scheduled_at || it.posted_date
  };
  return PSTAGES.map((s, j) => {
    let dt = '—', cls = ' future', mk = 'todo';
    if (cur < 0) { dt = '—'; }
    else if (it.stage === 'posted' || j < cur) {
      mk = 'done'; cls = '';
      dt = fmtDate(stamp[j]) || '—';
    } else if (j === cur) {
      mk = it._rv ? 'rv' : (it._rc ? rcCls(it) : 'work'); cls = '';
      const since = fmtDate(it.status_changed_at);
      dt = (it._rv ? '承認待ち' : it._rc ? rcShort(it) : stageWorkTip(s, it)) + (since ? `（${since}〜）` : '');
    }
    return `<div class="row${cls}"><span class="mark ${mk}">${
      mk === 'done' ? '✓' : (mk === 'todo' ? '·' : (mk.startsWith('rc') ? '↺' : '●'))}</span>
      <span class="nm">${esc(stageName(s, it))}</span><span class="dt">${esc(dt)}</span></div>`;
  }).join('');
}

/* 畳んだ項目の共通の形（右列の下に並べる details）。既存の履歴の畳みと同じ作法に揃える */
const foldHTML = (label, body, sub) =>
  `<details class="dsec dsec-history dsec-mat"><summary class="dsum">${esc(label)}${
    sub ? `<span class="n">${esc(sub)}</span>` : ''}</summary>${body}</details>`;

/* ── 詳細（レビュー画面）の組み立て（#509 段1・見本 dashboard/review-mockup.html）──────
   並びは見本のとおり:
     ヘッダ1行 → PC は2列（左＝レビュー素材・右＝入力欄／あなたの指摘／畳んだ項目）→ 下端の固定バー。
   スマホは同じ順で縦1列になる（grid の列を1本にするだけ）。
   ⚠️ 送信の仕組み（approve_gate / request_changes / reject_video の呼び出し、版のずれで
   断られたときの描き直し、没の2段階）は動かしていない——置き場所だけを変えている。 */
function detailHTML(it){
  const m = chMeta(it.channel), cur = displayIdx(it);
  /* 作業中の記録があれば帯の工程の名前（#637） */
  const curName = it._work ? SV_STEPS[it._work.step].name
    : cur < 0 ? (it.stage === 'triage' ? '仕分け待ち' : '没') : stageName(PSTAGES[cur], it);
  const rvGate = it._rv || it._rc;
  const evs = threadOf(it.id);
  /* この画面には工程の帯が無いが、作業中の記録がある動画（#637）だけは帯とそのすぐ下の「いまの工程」の1行を
     出す（素材つきの画面と同じ部品）。02・03 の台本の承認などの見え方は変えない */
  const flow = it._work ? `<div class="dflow">${svFlowHTML(it)}
      <div class="sv-worknow" data-sv-worknow>${nowLineHTML(it)}</div></div>` : '';

  /* 履歴は2つに分ける（オーナー決定 2026-09-06）。「あなたの指摘」は全文のまま右列に出し、
     「AI の記録」は1件1行に畳んで下の畳みへ回す。時系列には混ぜない。
     ゲートが1つしか無い動画（02の完成だけ）では毎行に同じ札を出しても読み分けに使えない */
  const showGate = new Set(evs.map(e => e.gate)).size > 1;
  const you   = evs.length ? youHTML(evs, showGate, it) : '';
  const ailog = evs.length ? aiLogHTML(evs, it) : '';

  /* 承認待ちなら「決める枠」（ゲート名＋版・変えたこと・メモ・入力欄）と下端のバー。
     承認待ちでなければ現状を言う1行だけ。文言は差し戻しの出どころで分ける（M051）——
     あなたの指摘の直しなのか、AI審査が基準未達と見て作り直しているのかで、読む人のすることが違う */
  const decide = it._rv
    ? decideHTML(it, it._rv, changeLines(evs))
    : `<div class="decide">${it._rc
        ? (rcAiOnly(it)
            ? `<div class="dstate rcai">↺ AI審査の指摘で${esc(gateName(it._rc, it))}を作り直しています。あなたの操作は要りません。</div>`
            : `<div class="dstate rc">↺ あなたの指摘にAIが対応中です（${esc(gateName(it._rc, it))}）。直り次第、新しい版で出し直します。</div>`)
        : `<div class="dstate">● いまは「${esc(curName)}」の工程です。</div>`}</div>`;

  /* 左列＝いま見るべき素材（承認待ち／AI修正中のゲートのもの）。台本(.md)・絵コンテ(画像)・
     完成(mp4) のどれでも assetsHTML が同じ形で描く。素材が無いゲートでは左列を畳んで1列にする。
     進行係を通らない動画は承認ポイントに依らず動画の置き場1つを読む（空なら旧い置き場・#569）。
     data-gate は承認ポイント（承認・指摘に渡す）、data-dirs は読みに行く置き場の順番 */
  const dirsAttr = rvGate
    ? ` data-dirs="${esc(assetDirsOf(it, rvGate).join(','))}"` : '';
  const stage = rvGate ? `<div class="dstage">
      <div class="assets" data-assets="${esc(it.id + '|' + rvGate)}" data-ch="${esc(it.channel)}"
           data-seq="${esc(it.seq)}" data-gate="${esc(rvGate)}"${dirsAttr}>
        <div class="loadbox">素材を読み込み中…</div></div></div>` : '';

  /* ネタの仕分け（#314）。ゲートを持たないので決める枠とは排他 */
  const triage = it.stage === 'triage'
    ? `<div class="dsec">
        <div class="dstate rv">● <b>あなたの番</b>です。台本の型に乗らなかったので、AIは起草せずここへ回しました。</div>
        ${triagePanel(it)}</div>`
    : '';

  /* 畳んだ項目（既定は畳む）。並びは AI の記録 → 素材（絵コンテ・完成）→ 工程の履歴 → フック */
  const metrics = (it.plays != null || it.avg_view_rate_pct != null || it.subs != null)
    ? foldHTML(`数字${it.measured_date ? `（${fmtDate(it.measured_date) || it.measured_date} 計測）` : ''}`, `
      <div class="mgrid">
        <div class="m"><div class="k">再生数</div><div class="v">${it.plays == null ? '—' : nf(it.plays)}</div></div>
        <div class="m"><div class="k">平均視聴率</div><div class="v">${it.avg_view_rate_pct == null ? '—' : Number(it.avg_view_rate_pct).toFixed(1) + '%'}</div></div>
        <div class="m"><div class="k">登録者増</div><div class="v">${it.subs == null ? '—' : (it.subs > 0 ? '+' : '') + it.subs}</div></div>
      </div>
      ${it.youtube_url ? `<a class="ytlink" href="${esc(it.youtube_url)}" target="_blank" rel="noopener noreferrer">${esc(it.youtube_url)}</a>` : ''}`)
    : '';
  const dropped = it.stage === 'dropped'
    ? foldHTML('没にした理由', `<div class="hook">${esc(sentenceWrap(it.decision_note || it.note || '（記録なし）'))}</div>`)
    : '';
  const noteBlk = it.note
    ? foldHTML('メモ', `<div class="hook">${esc(sentenceWrap(it.note))}</div>`) : '';

  const folds = `<div class="folds">
    ${ailog}
    ${materialsHTML(it, rvGate)}
    ${foldHTML('工程の履歴', `<div class="tl">${timelineRows(it)}</div>
      <div class="dhint">日付は承認ポイント・公開時刻の実記録のみ表示（記録が無い工程は —）</div>`,
      cur < 0 ? '' : curName)}
    ${foldHTML('フック', `<div class="hook">${esc(it.hook || '（未設定）')}</div>`)}
    ${metrics}${dropped}${noteBlk}
  </div>`;

  return `<div class="dview${it._rv ? ' hasbar' : ''}" role="region" aria-label="${esc(it.title)} の詳細">
    <div class="dtop">
      <button class="dback" data-close="1" aria-label="一覧に戻る">← 一覧<span class="dback-l">に戻る</span></button>
      <span class="seqn">${esc(it.seq)}</span>
      <span class="ttl">${esc(it.title)}</span>
      <!-- 番組の札は出さない（番号の頭2文字で分かる・オーナー決定 2026-09-29）。この画面には工程の帯が
           無いので、工程と状態の札は残す -->
      <span class="tags">
        <span class="gbadge"><i style="background:${it._work ? 'var(--fix)' : it._rv ? 'var(--s1)'
          : (it.stage === 'posted' || it.stage === 'dropped') ? 'var(--done)' : 'var(--fix)'}"></i>${esc(curName)}</span>
        ${flagsHTML(it)}
      </span>
    </div>
    ${flow}
    <div class="dwrap${stage ? '' : ' solo'}">
      ${stage}
      <div class="dside">
        ${it.stage === 'triage' ? triage : decide}
        ${you}
        ${folds}
      </div>
    </div>
  </div>`;
}

/* ── 履歴付き詳細ビュー（#200）───────────────────────────────────
   在庫カード／レビュー項目クリックで #view-detail を全画面表示し history.pushState で
   履歴を積む。ブラウザの戻る（popstate）／画面内「戻る」ボタン（data-close→history.back）で
   一覧へ戻り、開いた時点のスクロール位置を復元する。URL は同一パス上のハッシュ #detail/… のみ。 */
const BASE_URL = () => location.pathname + location.search;
let _returnScroll = null;

/* 詳細ビューを実際に描画する（履歴は積まない・再描画や popstate から共用）。
   一覧に載っていない動画（別ページ・ディープリンク）でも開けるよう、動画1行と
   その動画のレビュー記録をここで取りに行く（#215 Phase 2 で非同期になった）。
   hint＝呼び手が既に持っている動画の行（直接リンクで番号から引いた行。同じ行を2回取りに行かない）。
   読み込みの順番（#637）: 動画1行・レビュー記録・いまの版・置き場の一覧を**同時に**頼む（以前は5回続けて待った）。
   素材つきの画面は、組み立てに要るもの（主画面の動画の署名・目録）がそろってから**1回で**組み上げる
   （高さ固定の並び・帯の幅合わせ・タップ入力の欄・前回までの指摘も同じ描画で）。目録の画像の署名だけは待たずに
   並べて取り、届いたら枠に画像を入れる（svFillUrls）。案のある動画は、案の目録を読むまで動画が決まらないので
   今までどおり骨組みを先に出す */
let openSeq = 0;                     /* 何回目の openDetail か（待つ間に次が始まったら、前の結果を捨てる） */
async function openDetail(vid, gate, hint){
  const id = Number(vid);
  const dv = $('#view-detail');
  const token = ++openSeq;
  state.detail = id;
  /* 描き直すたびにタップ入力は組み直す（下書きは localStorage から戻る・#509 段4） */
  tap = null; curItem = null; sv = null; svPreMade = null;
  document.body.classList.remove('sheetopen');
  document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
  dv.classList.add('active');
  document.body.classList.add('detail-open');
  document.body.style.overflow = '';
  /* 広い画面の高さ固定・スマホの1画面の印は、中身を描き替えるときに外す（書き込みのあとの描き直しで、
     前の画面が待つ間だけ崩れて見えないように）。読み込み中の箱に替えるときはここで外す */
  const dropLayout = () => document.body.classList.remove('sv-lock', 'sv-mobile', 'sv-pick1');
  if (!store.threads[id] || !store.byId.get(id)) { dv.innerHTML = loading(); dropLayout(); }

  /* 動画1行・レビュー記録・いまの版は互いに独立なので同時に頼む。置き場の一覧も、行が手元にあれば
     ここで先に頼む（承認ポイントはまだ確かめていないので一覧の行の値で見込む。外れたら確かめたあとに読むだけ） */
  const known = store.byId.get(id) || (hint && hint.id === id ? hint : null);
  if (known) prefetchAssets(known);
  let it, evs, curRev = null;
  try {
    const evP = loadThread(id), revP = loadCurRev(id);
    evP.catch(() => {});        /* 行が無かったときに、未処理の失敗にしない */
    it = known || await loadItem(id);
    if (it && !known) prefetchAssets(it);
    if (it) { evs = await evP; curRev = await revP; }
  } catch (e) { if (token === openSeq) dv.innerHTML = errBox(e.message); return; }
  if (token !== openSeq) return;               /* 待っている間に別の動画へ移った・同じ動画を開き直した */
  if (!it) { closeDetail(); return; }
  if (state.detail !== id) return;

  /* 入口（在庫／レビュー）に依らずレビューパネルが出るよう、保留ゲートを都度算出。
     いまの版を添えるのは、一覧と同じ基準で「古い版の提出」を承認待ちから外すため */
  annotate(it, evs, curRev);

  curItem = it;                 /* 素材は非同期で届くので、届いた時点の「何を見ているか」の控え */
  /* ── 完成の mp4 を見る画面だけ、見本の3区画の並びに差し替える（#519 段2/段3）──
     mp4 があるかは素材を読むまで分からないので、ここで先に読んで（結果は控えが効くので
     二度は取りに行かない）から組み立てを決める。取れなければ従来の画面のまま。 */
  const plan = await useSceneView(it);
  if (token !== openSeq) return;
  /* 案の無い画面は、主画面の動画・目録・時刻表をここでそろえる（待つのは、借りた通しの仮組みの署名と、
     先に取っていない版の目録・時刻表のときだけ）。目録で決まる帯（Blender だけか）も最初の描画で正しく出す */
  let pre = null;
  if (plan && plan.kind !== 'variant') {
    try { pre = await svPrepare(it, plan); } catch (_) { pre = null; }
    if (token !== openSeq) return;
  }
  if (pre) { svNoteMade(pre.madeKey, pre.mat); svPreMade = { id: it.id, key: pre.madeKey }; }
  dropLayout();
  dv.innerHTML = plan ? sceneDetailHTML(it, plan) : detailHTML(it);
  /* スマホの1画面の組み替え・広い画面の高さ固定・帯の幅合わせを、最初の描画で済ませる（#552・#637） */
  if (plan) svRelayout({ repaint: false });
  else fitDflow();              /* 作業中の記録がある動画の帯（#637）を幅に収める */
  syncStickyOffsets();         /* タブが隠れてヘッダーが低くなるので測り直す（戻るボタンの貼り付き位置） */
  window.scrollTo(0, 0);
  dv.querySelector('.dback')?.focus();
  if (plan) {
    /* 素材つきの画面の器は1つ。置き場は読んであるので、そのまま組み立てる（pre があれば待たずに同じ描画で） */
    const node = dv.querySelector('.assets[data-sv]');
    armScene(node, plan.files, pre).catch(() => {
      if (token !== openSeq) return;
      const s = dv.querySelector('[data-sv-finalslot]');
      if (s) s.textContent = '動画を読み込めませんでした';
      svTapOff(dv.querySelector('.sview'));
      checkForUpdate();
    });
    return;                     /* 新しい版の確認は、動画が読めたあと（armScene）。回線を動画と取り合わない */
  }
  mountAllAssets(dv);
  armLazyAssets(dv);            /* 畳んである素材は開かれた時点で読みに行く（#360） */
  checkForUpdate();             /* 詳細を開くときにも新しい版が出ていないか確かめる（#523） */
}
/* 詳細を開いた時点で、読みそうな置き場（一覧・署名・本文）を先に頼む（#637）。承認ポイントの見込みは一覧の行の値
   （ビューが同じ規則で計算した承認待ち・修正中）。useSceneView・detailHTML の器と同じ置き場の順番（assetDirsOf） */
function prefetchAssets(it){
  if (!it || it.stage === 'triage' || it.stage === 'dropped') return;
  const gate = it._rv || it._rc
    || (displayIdx(it) >= GATE_COL.final ? 'final' : (offDispatcherItem(it) ? 'storyboard' : null));
  if (!gate) return;
  loadAssetsFirst(it.channel, it.seq, assetDirsOf(it, gate)).catch(() => {});
}

/* この動画を「シーン素材つきの画面」で開くか（#519 段2 → #523 で絵コンテにも → #569）。
   ・見ている承認ポイントが完成か絵コンテ（仮組み＋静止画）であること（台本は従来の画面）
   ・主画面に出せる動画（決まりの名前の mp4・案・通しの仮組み）が置き場にあること
   ネタの仕分け・没は対象外。返すのは { gate:承認ポイント, dir:読む置き場, kind }。 */
async function useSceneView(it){
  if (!it || it.stage === 'triage' || it.stage === 'dropped') return null;
  const rv = it._rv || it._rc;
  const one = offDispatcherItem(it);
  /* いま見ている承認ポイント。状態を持っていなければ、完成まで進んでいる動画だけ対象。
     進行係を通らない動画は段階に関係なく1つの画面なので、状態が無くても置き場を見に行く
     （呼び名だけに使う承認ポイントは、完成まで進んでいれば完成・手前なら仮組み＋静止画・#569） */
  let gate = rv || (displayIdx(it) >= GATE_COL.final ? 'final' : null);
  if (!gate && one) gate = 'storyboard';
  if (gate !== 'final' && gate !== 'storyboard') return null;
  if (gate === 'final' && displayIdx(it) < GATE_COL.final) return null;
  /* 読む置き場（Storage のフォルダ）は承認ポイントと別に決める。全番組とも動画の置き場1つ →
     空なら旧い置き場（storyboard/）。**物が1つでもある最初の置き場で決める**（loadAssetsFirst と
     同じ条件）——新しい置き場に出せる動画が無いからといって旧い置き場の動画へ戻ると、新しい提出の
     承認ボタンと旧い素材が同じ画面に並ぶ（#569 の Codex レビュー指摘1） */
  /* 候補の置き場の一覧は同時に頼む（loadAssetsFirst・#637。詳細を開いた時点で先に頼んであれば、それを待つだけ） */
  try {
    const a = await loadAssetsFirst(it.channel, it.seq, assetDirsOf(it, gate));
    const files = a.files || [], dir = a.dir;
    if (!files.length) return null;
    /* 公開して保管庫へ移した動画は、置き場の動画（完成・案・通しの仮組み）を片付けてある（#602）。
       主画面に出す動画が無ければこの画面は使わず、従来の画面で YouTube を案内する（目録だけ残っていても
       通しの仮組みを借りない——借りる先も片付けてあり、壊れた枠になる） */
    if (ytUrlOf(it) && !svMainFile(files, dir, one)) return null;
    if (svVariants(files, one, dir).list.length) return { gate, dir, kind:'variant', files };
    if (svMainFile(files, dir, one))  return { gate, dir, kind:'video', files };
    const mat = sceneMaterials(files, '');
    if (mat && mat.ref_video_full) return { gate, dir, kind:'ref', files };
    return null;
  } catch (_) { return null; }
}

/* 素材つきでない詳細画面の帯（作業中の記録がある動画だけ・#637）を幅に収める。入りきらない幅（スマホ）では
   いまの工程が見える所まで帯を送る */
function fitDflow(){
  const root = document.querySelector('#view-detail .dflow');
  if (!root) return;
  svFitFlow(root);
  const cur = root.querySelector('.sv-step.cur'), box = root.querySelector('.sv-steps');
  if (cur && box && box.scrollWidth > box.clientWidth + 1) {
    const c = cur.getBoundingClientRect(), b = box.getBoundingClientRect();
    box.scrollLeft += (c.left - b.left) - (b.width - c.width) / 2;
  }
}

/* 一覧へ戻す（履歴は操作しない）。scrollY 指定があればそこへ、無ければ開いた時点へ復元 */
function closeDetail(scrollY){
  const wasOpen = state.detail != null;
  state.detail = null;
  openSeq++;                    /* 開いている途中の openDetail の結果を捨てる */
  tap = null; curItem = null; sv = null; svPreMade = null;
  document.body.classList.remove('sv-lock');
  document.body.classList.remove('sheetopen');
  document.body.classList.remove('sv-mobile', 'sv-pick1');
  const dv = $('#view-detail');
  dv.classList.remove('active');
  dv.innerHTML = '';
  document.body.classList.remove('detail-open');
  document.body.style.overflow = '';
  $('#view-' + state.view)?.classList.add('active');
  syncStickyOffsets();          /* タブが戻ってヘッダーが高くなるので測り直す */
  if (wasOpen) {
    const y = (scrollY != null) ? scrollY : _returnScroll;
    if (y != null) requestAnimationFrame(() => window.scrollTo(0, y));
  }
  _returnScroll = null;
}

/* クリック起点：現在のスクロールを一覧履歴に刻んでから詳細をプッシュ */
async function pushDetail(vid, gate){
  const y = window.scrollY;
  let it;
  try { it = await loadItem(Number(vid)); } catch { return; }
  if (!it) return;
  _returnScroll = y;
  const base = history.state || {};
  history.replaceState(Object.assign({}, base, { view: state.view, ch: state.ch, scrollY: _returnScroll }), '', BASE_URL());
  /* URL には**動画が属する番組**を書く（検証のタブは番組ではないので、そのままだと開き直せない） */
  const hash = `#detail/${encodeURIComponent(it.channel || state.ch)}/${encodeURIComponent(it.seq)}` +
    (gate ? '/' + encodeURIComponent(gate) : '');
  history.pushState({ detail: it.id, ch: state.ch, gate: gate || null, view: state.view }, '', hash);
  await openDetail(it.id, gate);
}

function parseHash(){
  const m = /^#detail\/([^/]+)\/([^/]+)(?:\/([^/]+))?$/.exec(location.hash || '');
  if (!m) return null;
  return { ch: decodeURIComponent(m[1]), seq: decodeURIComponent(m[2]),
           gate: m[3] ? decodeURIComponent(m[3]) : null };
}

/* 直リロード／ディープリンク（#detail/…）で開いたときの初期ルーティング。
   無効なハッシュはトップ（一覧）へ落とす。back で一覧へ戻れるよう履歴を [一覧, 詳細] に整える。
   ①initialRoute は行き先を確かめて番組のタブを選ぶだけ（一覧は呼び手が描く）②openInitialRoute が詳細を開く。
   呼び手（showApp）は**一覧を待たずに**②を始める（#637。以前は一覧を読み終えてから詳細を取りに行っていた） */
function initialRoute(){
  const r = parseHash();
  if (!r) return null;
  /* 検証だけの番組（#551）はタブを持たないので、検証タブを開いてからその番組の動画を引く */
  const pilotOnly = PILOT_ONLY_CH.has(r.ch);
  const known = pilotOnly ? pilotSlugs().includes(r.ch) : store.channels.some(c => c.slug === r.ch);
  if (!known) { history.replaceState({}, '', BASE_URL()); return null; }
  state.ch = pilotOnly ? PILOT_CH : r.ch;
  return r;
}
async function openInitialRoute(r){
  let it;
  /* 一覧のページに載っていない seq でも開けるよう、DB から直接1行引く */
  try { it = await loadItemBySeq(r.ch, r.seq); }
  catch { history.replaceState({}, '', BASE_URL()); return; }
  if (!it) { history.replaceState({}, '', BASE_URL()); return; }
  history.replaceState({ view: state.view, ch: state.ch, scrollY: 0 }, '', BASE_URL());
  history.pushState({ detail: it.id, ch: state.ch, gate: r.gate, view: state.view }, '',
    `#detail/${encodeURIComponent(r.ch)}/${encodeURIComponent(it.seq)}${r.gate ? '/' + encodeURIComponent(r.gate) : ''}`);
  _returnScroll = 0;
  await openDetail(it.id, r.gate, it);       /* 引いた行をそのまま使う（同じ行を2回取りに行かない） */
}

window.addEventListener('popstate', e => {
  const st = e.state || {};
  /* 一覧に載っていない動画でも openDetail が1行取りに行く（開けなければ閉じる） */
  if (st.detail != null && st.ch === state.ch) openDetail(st.detail, st.gate);
  else closeDetail(st.scrollY);
});

/* ══ ② レビュー ═════════════════════════════════════════════════ */

/* ── 素材の描画 ─────────────────────────────────────────────── */
const NO_ASSET = `<div class="noitem">まだ素材がありません
  <span class="s">制作が進むとここに入ります</span></div>`;
/* 公開済みの動画の YouTube の URL（無ければ null）。公開して保管庫へ移した動画は、この画面の置き場から
   動画のファイルを片付けてある（#602・画像と目録は残る）。置き場に動画が無いときは「まだ素材がありません」
   ではなく YouTube を案内する */
const ytUrlOf = it => (it && it.pub_status === '投稿済' && typeof it.youtube_url === 'string'
  && /^https:\/\/(www\.|m\.)?(youtube\.com|youtu\.be)\//.test(it.youtube_url)) ? it.youtube_url : null;
const ytGoneHTML = url => `<div class="noitem">公開済み・YouTube で見られます
  <span class="s"><a class="ytlink" href="${esc(url)}" target="_blank" rel="noopener noreferrer">YouTube で開く</a></span></div>`;

function assetHead(f){
  return `<div class="ahead"><span class="anm">${esc(f.name)}</span>
    ${f.size != null ? `<span class="asz">${esc(fmtSize(f.size))}</span>` : ''}
    ${f.url ? `<a class="alink" href="${esc(f.url)}" target="_blank" rel="noopener noreferrer">別タブで開く</a>` : ''}</div>`;
}

/* 台本(.md)向けの軽量 Markdown レンダラー。
   XSS対策: 本文は必ず esc() でエスケープしてから、既知パターンだけをタグ化する
   （生HTMLは一切通さない）。台本で使う記法（見出し/太字/箇条書き/番号/水平線/【見出し】）に限定。 */
function mdInline(s){
  return esc(s)
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    /* 斜体（*…*）。太字を先に消してから拾い、前後が空白の * は掛け算とみなして触らない */
    .replace(/(^|[^*\w])\*([^\s*][^*\n]*[^\s*]|[^\s*])\*(?!\*)/g, '$1<em>$2</em>')
    .replace(/(【[^】]+】)/g, '<strong class="mdtag">$1</strong>');
}
function mdToHTML(src){
  const lines = String(src == null ? '' : src).replace(/\r\n?/g, '\n').split('\n');
  let out = '', list = null;
  const closeList = () => { if (list) { out += `</${list}>`; list = null; } };
  for (const raw of lines) {
    const line = raw.replace(/\s+$/, '');
    if (!line.trim()) { closeList(); continue; }
    if (/^\s*([-*_]\s*){3,}$/.test(line)) { closeList(); out += '<hr>'; continue; }
    let m = /^(#{1,6})\s+(.*)$/.exec(line);
    if (m) { closeList(); const lv = m[1].length; out += `<h${lv} class="mdh mdh${lv}">${mdInline(m[2])}</h${lv}>`; continue; }
    m = /^\s*\d+[.)]\s+(.*)$/.exec(line);
    if (m) { if (list !== 'ol') { closeList(); out += '<ol>'; list = 'ol'; } out += `<li>${mdInline(m[1])}</li>`; continue; }
    m = /^\s*(?:[-*]\s+|・\s*)(.*)$/.exec(line);
    if (m) { if (list !== 'ul') { closeList(); out += '<ul>'; list = 'ul'; } out += `<li>${mdInline(m[1])}</li>`; continue; }
    closeList(); out += `<p>${mdInline(line)}</p>`;
  }
  closeList();
  return out;
}

/* ── 素材のバージョン（#209）──────────────────────────────────────
   差し戻して再提出するたび `…_v02.pdf` のように版が増え、古い版も Storage に残る
   （例: storyboard_v01.pdf / storyboard_v02.pdf / storyboard_v02_p01〜p17.jpg）。
   全部を縦に並べるとスマホで延々スクロールになるので、既定では最新版だけを開き、
   古い版は畳んで残す（消さない）。`_vNN` を持たないファイルは版の概念が無いので常に出す。 */
const assetVer = name => { const m = /_v(\d+)/i.exec(String(name)); return m ? m[1] : null; };
const verNum = v => Number(v);

function assetsHTML(files, tapMode){
  if (!files.length) return NO_ASSET;
  /* 版の一覧（新しい順）。同じ番号は表記のばらつき（v1/v01）を避けて数値で束ねる */
  const vs = [...new Set(files.map(f => assetVer(f.name)).filter(v => v != null))]
    .sort((a, b) => verNum(b) - verNum(a));
  if (!vs.length) return assetBlocksHTML(files, tapMode);  /* 版なし＝従来どおり全部表示 */

  const latest = vs[0];
  const isLatest = f => { const v = assetVer(f.name); return v == null || verNum(v) === verNum(latest); };
  /* 最新版は「その版のファイルすべて」（PDF＋ページ画像17枚など）をまとめて出す */
  const head = `<div class="verbar"><span class="vchip">v${esc(latest)}（最新）</span>${
    vs.length > 1 ? `<span class="vnote">以前の版は下に畳んであります</span>` : ''}</div>`;
  const olds = vs.slice(1).map(v => {
    const list = files.filter(f => verNum(assetVer(f.name)) === verNum(v));
    return `<details class="oldver">
      <summary class="dsum">以前の版（v${esc(v)}）<span class="n">（${list.length}件）</span></summary>
      <div class="assets">${assetBlocksHTML(list)}</div></details>`;
  }).join('');
  /* 自前の操作バー（タップ入力）は最新版の動画にだけ付ける。以前の版は見るだけ */
  return head + assetBlocksHTML(files.filter(isLatest), tapMode) + olds;
}

/* ── 動画の枠（#509 段1 → 段4 でタップ入力）───────────────────────────────
   tapMode が無ければブラウザ既定の操作バー（controls）のまま（台本・絵コンテ・以前の版）。
   'edit'（完成の承認待ち）と 'view'（見るだけ）では自前の操作バーに差し替える——既定の
   操作バーは画面の下半分のタップを吸ってしまい、「気になる場所を指す」ができないため。
   ⚠️ crossorigin はサムネイルの切り出し（canvas）に要るが、これを付けたせいで動画が
   読めなくなる取りこぼしがありうるので、armTap 側に「外して読み直す」退避を置いてある。 */
function videoBlockHTML(f, tapMode){
  if (!f.url) return `<div class="asset">${assetHead(f)}
    <div class="afiles">この動画の署名URLを取得できませんでした</div></div>`;
  if (!tapMode) return `<div class="asset">${assetHead(f)}
    <video class="avid" controls preload="metadata" playsinline src="${esc(f.url)}"></video></div>`;
  return `<div class="asset" data-tapvid="${esc(tapMode)}" data-vname="${esc(f.name)}">
    ${assetHead(f)}
    <div class="vidbox" data-vbox>
      <video preload="metadata" playsinline disablepictureinpicture crossorigin="anonymous"
             src="${esc(f.url)}"></video>
      <div class="hitlayer" data-hit></div>
      <div class="pin" data-pin hidden></div>
      ${tapMode === 'edit' ? `<div class="pickband" data-pickband hidden>
        <span>気になる場所をタップしてください</span>
        <button class="pbcancel" type="button" data-pickoff>やめる</button></div>` : ''}
    </div>
    <div class="ctrls">
      <button class="cbtn play" type="button" data-cbtn="play" aria-label="再生・一時停止">▶</button>
      <button class="cbtn" type="button" data-cbtn="back" aria-label="0.5秒もどる">−0.5s</button>
      <button class="cbtn" type="button" data-cbtn="fwd" aria-label="0.5秒すすむ">+0.5s</button>
      <div class="seek" data-seek role="slider" aria-label="再生位置" tabindex="0"
           aria-valuemin="0" aria-valuenow="0" aria-valuemax="100">
        <div class="tptrack"><div class="tpfill" data-fill></div></div>
        <div data-marks></div>
        <div class="knob" data-knob style="left:0"></div>
      </div>
      <span class="ctime" data-ctime>0:00 / 0:00</span>
      <button class="cbtn" type="button" data-cbtn="mute" aria-label="消音">🔊</button>
      <input class="cvol" type="range" data-cvol min="0" max="100" step="5" value="100" aria-label="音量">
    </div></div>`;
}

function assetBlocksHTML(files, tapMode){
  if (!files.length) return NO_ASSET;
  /* `…_p01.jpg` 形式は資料の「ページ」。サムネ格子ではなく
     縦スクロールのビューアで見せる（#203） */
  const pageNo = f => { const m = /_p(\d+)\.(?:jpe?g|png)$/i.exec(f.name); return m ? Number(m[1]) : null; };
  const pages = files.filter(f => f.kind === 'image' && pageNo(f) != null)
                     .sort((a, b) => pageNo(a) - pageNo(b));
  const imgs = files.filter(f => f.kind === 'image' && pageNo(f) == null);
  const rest = files.filter(f => f.kind !== 'image');

  const blocks = rest.map(f => {
    if (f.kind === 'text') {
      if (/\.md$/i.test(f.name) && f.text != null) {
        return `<div class="asset">${assetHead(f)}<div class="mdbody">${mdToHTML(f.text)}</div></div>`;
      }
      return `<div class="asset">${assetHead(f)}<pre class="atext">${
        f.text != null ? esc(f.text) : esc(f.err || '（本文が空です）')}</pre></div>`;
    }
    if (f.kind === 'video') return videoBlockHTML(f, tapMode);
    return null;
  }).filter(Boolean);

  const others = rest.filter(f => f.kind === 'file');
  if (others.length) {
    blocks.push(`<div class="asset"><div class="afiles">${others.map(f =>
      f.url ? `<a href="${esc(f.url)}" target="_blank" rel="noopener noreferrer">${esc(f.name)}</a>${
        f.size != null ? ` <span class="asz">${esc(fmtSize(f.size))}</span>` : ''}`
        : esc(f.name)).join('')}</div></div>`);
  }
  if (pages.length) {
    blocks.unshift(`<div class="asset">
      <div class="ahead"><span class="anm">資料 ${pages.length} ページ</span>
        <span class="asz">箱の中をスクロール・画像クリックで原寸</span></div>
      <div class="pageview">${pages.map((f, i) => f.url
        ? `<figure><a href="${esc(f.url)}" target="_blank" rel="noopener noreferrer">
             <img src="${esc(f.url)}" alt="${esc(f.name)}" loading="lazy" decoding="async"></a>
           <figcaption>${i + 1} / ${pages.length}</figcaption></figure>`
        : `<figure><figcaption>${esc(f.name)}（表示できませんでした）</figcaption></figure>`).join('')}</div></div>`);
  }
  if (imgs.length) {
    blocks.unshift(`<div class="asset">
      <div class="ahead"><span class="anm">画像 ${imgs.length} 点</span>
        <span class="asz">クリックで原寸表示</span></div>
      <div class="thumbs">${imgs.map(f => f.url
        ? `<a class="thumb" href="${esc(f.url)}" target="_blank" rel="noopener noreferrer" title="${esc(f.name)}">
             <img src="${esc(f.url)}" alt="${esc(f.name)}" loading="lazy"><span class="tnm">${esc(f.name)}</span></a>`
        : `<span class="thumb"><span class="tnm">${esc(f.name)}</span></span>`).join('')}</div></div>`);
  }
  return blocks.join('');
}

/* data-assets 付きの箱に非同期で素材を流し込む（再描画で箱が消えたら何もしない） */
async function mountAssets(node){
  if (!node) return;
  const { ch, seq, gate } = node.dataset;
  try {
    /* 読む置き場: data-dirs（候補の順番）→ data-dir（決め打ち）→ 承認ポイントのフォルダ（02・03・#569） */
    const a = node.dataset.dirs ? await loadAssetsFirst(ch, seq, node.dataset.dirs.split(','))
      : await loadAssets(ch, seq, node.dataset.dir || gate);
    if (!node.isConnected) return;
    /* 素材つきの画面は主画面の動画1本だけを組み立てる（#519 段2/段3 → #523 で絵コンテにも） */
    if (node.dataset.sv === '1') { await armScene(node, a.files); return; }
    /* 時刻表・素材の目録・案の索引（#519 / #523）は読む素材ではなく画面の裏方なので一覧に出さない。
       案のフォルダ（variants/…）は Storage の一覧がフォルダとして返すので、もともと載らない */
    const shown = a.files.filter(f => !RE_TIMELINE.test(f.name) && !RE_MATERIALS.test(f.name)
                                   && !RE_VARIANTS.test(f.name));
    /* 公開済みで置き場に動画が無い（公開のあと片付けた・#602）なら YouTube を案内する。残っている
       画像などはその下にそのまま出す */
    if (node.dataset.yt && !shown.some(f => f.kind === 'video')) {
      node.innerHTML = ytGoneHTML(node.dataset.yt) + (shown.length ? assetsHTML(shown, null) : '');
      return;
    }
    const tapMode = tapModeFor(node, shown);
    /* タップ入力はシーンの時刻表を使う。置き場は使う版だけ先に取ってあるので、残りもそろえる（#637） */
    const needT = tapMode === 'edit' && ensureAssetTexts(a.files, f => RE_TIMELINE.test(f.name || ''));
    if (needT) { await needT; if (!node.isConnected) return; }
    node.innerHTML = assetsHTML(shown, tapMode);
    if (tapMode) armTap(node, a.files, tapMode);
  } catch (e) {
    if (node.isConnected) node.innerHTML = `<div class="noitem">素材を読み込めませんでした
      <span class="s">${esc(e.message || String(e))}</span></div>`;
  }
}
/* data-lazy 付きは畳んだ折りたたみの中身。開かれるまで Storage を見に行かない（#360） */
const mountAllAssets = root =>
  (root || document).querySelectorAll('[data-assets]:not([data-lazy])').forEach(mountAssets);

/* ── 素材を「見るだけ」で開く折りたたみ（#360）────────────────────────
   レビュー節は承認待ち／【AI】修正中の動画にしか出ないので、そのままだと搬出済みの
   素材がどこからも見られない。詳細画面に見るだけの畳みを足して読めるようにする
   （承認・コメント・没は付けない＝書き込みの入口はレビュー節ひとつのまま）。
     ・レビュー節に出ているゲートはここへ出さない（同じ素材を2か所に並べない）
     ・その工程に到達した動画にだけ出す（到達前は Storage にまだ何も無い）
     ・中身は開いたときに初めて読みに行く（畳んだままなら通信しない）
   絵コンテの畳みは 2026-09-21 に外した（#525）——PDF を組む工程をやめ、開始フレームは
   完成のレビュー画面で見るようにしたので、開いても中身が無い。 */
const MATERIAL_FOLDS = [
  { gate:'final',      label:'完成した動画を見る' }
];
function materialsHTML(it, rvGate){
  const cur = displayIdx(it);
  if (cur < 0) return '';                 /* 没・ネタの仕分け待ちは工程の並びの外 */
  /* 進行係を通らない動画はレビュー節（左列）が既に動画の置き場1つを出している（#569）ので、
     同じ置き場を畳みにもう一度並べない */
  if (rvGate && offDispatcherItem(it)) return '';
  return MATERIAL_FOLDS
    .filter(g => g.gate !== rvGate && cur >= GATE_COL[g.gate])
    .map(g => {
      const key = it.id + '|view|' + g.gate;
      /* 公開済みなら YouTube の URL を持たせる（置き場に動画が無いときの案内・#602） */
      const yt = g.gate === 'final' ? ytUrlOf(it) : null;
      return `<details class="dsec dsec-history dsec-mat" data-lazyassets="1">
        <summary class="dsum">${esc(g.label)}</summary>
        <div class="dsum-body assets" data-assets="${esc(key)}" data-lazy="1"
             data-ch="${esc(it.channel)}" data-seq="${esc(it.seq)}" data-gate="${esc(g.gate)}"${
             yt ? ` data-yt="${esc(yt)}"` : ''}>
          <div class="loadbox">素材を読み込み中…</div></div></details>`;
    }).join('');
}
/* toggle は bubble しないので、畳みひとつずつに直接ぶら下げる（詳細を描き直すたびに呼ぶ） */
function armLazyAssets(root){
  (root || document).querySelectorAll('details[data-lazyassets]').forEach(d => {
    d.addEventListener('toggle', () => {
      if (!d.open) return;
      const box = d.querySelector('[data-assets][data-lazy]');
      if (!box) return;
      box.removeAttribute('data-lazy');    /* 二重読み込みを防ぐ（結果は loadAssets 側でキャッシュ） */
      mountAssets(box);
    });
  });
}

/* ══ 完成動画のタップ入力（#509 段4）══════════════════════════════════════════
   「完成」の承認待ちで mp4 を見ているときだけ出る。動画の気になる場所をタップすると、その
   再生位置とシーン名が入った入力シートが開き、定型の言葉＋一言で指摘を1件にする。送るのは
   修正依頼の受け口に添える `p_notes`（**形の正本は DB 側の検証関数**・画面はそれに合わせる）。
   **静止画は送らない**——サムネイルは画面の中で「どの指摘のことか」を見分けるためだけに作る。
   見た目と操作の正本は `dashboard/review-mockup.html`（オーナー承認済みの見本）。 */

/* 定型の言葉。2組をここ1か所に置く（画面の組み立てに直接書かない）。
   入口は「動画をタップして場所を指す」（picture）と「いまの画面にコメント」（whole）の2つだけ
   （オーナー決定 2026-09-20）。**音・ナレーションの入口は廃止**——絵の話も音の話も同じ
   「いまの画面」に書けるよう、whole の言葉に音のぶんを混ぜてある。 */
const NOTE_TAGS = {
  picture: ['文字が読めない', '動きが不自然', 'ナレーションとずれ', 'つなぎ目が変', '絵が弱い'],
  whole:   ['絵が弱い', 'テンポが遅い', 'つなぎ目が変', '話が分かりにくい',
            '読み間違い', '声が不自然', '間が長い', 'BGM・効果音', 'この場面は作り直し']
};
const NOTE_TAGS_ALL = [...new Set([...NOTE_TAGS.picture, ...NOTE_TAGS.whole])];
const NOTE_KIND_LABEL = {picture:'', whole:'▣ いまの画面 ・ '};
/* 廃止した種類（'audio'）が下書きや過去の指摘に残っていたら「いまの画面」として読む。
   **落とさない**——書いた本人には消える理由が無い（受け口は 'audio' を弾くので送る前に直す） */
const normKind = k => (k === 'picture' ? 'picture' : 'whole');
/* 受け口と同じ上限。送ってから断られないよう画面の側でも先に止める（正本は DB の検証関数） */
const NOTE_LIM = {items:50, tag:100, note:500, memo:2000, title:100};
/* 動画と同じフォルダに置かれるシーンの時刻表。内部ファイルなので素材の一覧には出さない */
const RE_TIMELINE = /^scenes_timeline_v(\d+)\.json$/i;
const TL_TOL = 1.0;        /* 表の尺と動画の尺がこれを超えて食い違ったら時刻表は使わない（秒） */
const TAP_DRAFT = 'dash.notes.v1.';   /* 送る前の下書きの置き場（動画＋ゲート＋版ごとに1つ） */

/* いま開いている動画（素材が非同期で届くので、届いた時点の「何を見ているか」をここから引く） */
let curItem = null;
/* 組み立て中の指摘ひとそろい。画面に1つしか出ないので1つだけ持つ */
let tap = null;

const fmtT = t => {
  if (!isFinite(t) || t < 0) t = 0;
  const m = Math.floor(t / 60), s = Math.floor(t % 60);
  return m + ':' + (s < 10 ? '0' : '') + s;
};
/* 0.1秒まで出す形（指摘のシートのコマ送り。0:47.0 のように読む） */
const fmtT1 = t => {
  if (!isFinite(t) || t < 0) t = 0;
  const m = Math.floor(t / 60), s = t % 60;
  return m + ':' + (s < 10 ? '0' : '') + s.toFixed(1);
};

/* この素材の箱をタップ入力にするか。完成の mp4 のときだけで、承認待ちの左列なら書ける
   （'edit'）、それ以外の場所（見るだけの畳み・承認待ちでない動画）は操作バーだけ（'view'） */
function tapModeFor(node, files){
  const gate = node.dataset.gate;
  /* タップ入力が使えるのは動画を見ている承認ポイント（完成・絵コンテ）だけ（#523） */
  if (gate !== 'final' && gate !== 'storyboard') return null;
  if (!files.some(f => f.kind === 'video' && f.url)) return null;
  const it = curItem;
  /* シーン素材つきの画面（#519）は左列の器を持たないので、その器も「書ける場所」として数える */
  const onStage = node.closest('.dstage') || node.dataset.sv === '1';
  return (onStage && it && it._rv === gate) ? 'edit' : 'view';
}

/* ── 自前の操作バー ──────────────────────────────────────────────────
   ブラウザ既定の操作バーは画面の下半分のタップを吸うので、再生・0.5秒送り・シーク・消音を
   自前で持つ。ピンの座標は「映像そのものの領域」に対する 0〜1 で、object-fit:contain の
   余白は除く（枠と動画の縦横比が違っても指した場所がずれない）。余白のタップは受け付けない。 */
function armVideoBar(el){
  const $$ = s => el.querySelector(s);
  const v = $$('video'), box = $$('[data-vbox]'), pin = $$('[data-pin]');
  const seek = $$('[data-seek]'), fill = $$('[data-fill]'), knob = $$('[data-knob]');
  const marks = $$('[data-marks]'), lbl = $$('[data-ctime]');
  const play = $$('[data-cbtn="play"]'), mute = $$('[data-cbtn="mute"]');
  const ctl = { el, video: v, box, pin, canvas: true };

  const dur = () => (v.duration && isFinite(v.duration)) ? v.duration : 0;
  const paint = () => {
    const p = dur() ? (v.currentTime / dur()) : 0;
    fill.style.width = (p * 100) + '%';
    knob.style.left = (p * 100) + '%';
    seek.setAttribute('aria-valuenow', String(Math.round(p * 100)));
    lbl.textContent = fmtT(v.currentTime) + ' / ' + fmtT(dur());
  };
  ctl.paint = paint;
  ctl.dur = dur;
  /* crossorigin はサムネイルの切り出しに要るが、これのせいで動画が読めなくなることがある。
     読めなかったら**外して読み直す**（そのぶんサムネイルは作れないので「画なし」になる） */
  v.addEventListener('error', () => {
    if (v.dataset.noco === '1') return;
    v.dataset.noco = '1'; ctl.canvas = false;
    const t = v.currentTime;
    v.removeAttribute('crossorigin');
    v.load();
    v.addEventListener('loadedmetadata', () => { try { v.currentTime = t; } catch (_) {} }, { once: true });
  });
  const syncPlay = () => { play.textContent = v.paused ? '▶' : '❚❚'; };
  const toggle = () => { if (v.paused) v.play().catch(() => {}); else v.pause(); };
  ctl.toggle = toggle;
  play.addEventListener('click', toggle);
  v.addEventListener('play', syncPlay);
  v.addEventListener('pause', syncPlay);
  /* **動画の上を押したら再生／一時停止**（ふつうの動画と同じ・オーナー指示 2026-09-20）。
     場所を指す指摘は入口のボタンから始める——受け手（armTap）が true を返した回だけ、
     その押しは「ピンを置く」ものとして使われ、再生には回さない */
  const hitEl = $$('[data-hit]');
  ctl.hitEl = hitEl;
  hitEl.addEventListener('click', e => {
    if (ctl.onHit && ctl.onHit(e)) return;
    toggle();
  });
  $$('[data-cbtn="back"]').addEventListener('click', () => { v.currentTime = Math.max(0, v.currentTime - 0.5); });
  $$('[data-cbtn="fwd"]').addEventListener('click', () => { v.currentTime = Math.min(dur(), v.currentTime + 0.5); });
  /* 音量（オーナー要望 2026-09-29）。決めた音量はこの端末に覚えておき、次に開いた動画にも効かせる。
     iPhone・iPad は端末の音量ボタンだけが効く作りなので、つまみを動かしても変わらない */
  const vol = $$('[data-cvol]');
  const paintVol = () => {
    const off = v.muted || v.volume === 0;
    mute.textContent = off ? '🔇' : '🔊';
    if (vol) vol.value = String(v.muted ? 0 : Math.round(v.volume * 100));
  };
  try {
    const kept = Number(localStorage.getItem('dash.volume'));
    if (isFinite(kept) && kept > 0 && kept <= 1) v.volume = kept;
  } catch (_) {}
  mute.addEventListener('click', () => { v.muted = !v.muted; paintVol(); });
  if (vol) vol.addEventListener('input', () => {
    const x = Math.min(1, Math.max(0, Number(vol.value) / 100));
    v.muted = x === 0;
    if (x > 0) { v.volume = x; try { localStorage.setItem('dash.volume', String(x)); } catch (_) {} }
    paintVol();
  });
  paintVol();
  v.addEventListener('timeupdate', paint);
  v.addEventListener('loadedmetadata', () => { paint(); ctl.onmeta && ctl.onmeta(); });

  const seekAt = e => {
    const r = seek.getBoundingClientRect();
    const p = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    v.currentTime = p * dur(); paint();
  };
  let seeking = false;
  seek.addEventListener('pointerdown', e => { seeking = true; seek.setPointerCapture(e.pointerId); seekAt(e); e.preventDefault(); });
  seek.addEventListener('pointermove', e => { if (seeking) seekAt(e); });
  seek.addEventListener('pointerup', e => { seeking = false; try { seek.releasePointerCapture(e.pointerId); } catch (_) {} });
  seek.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft')  { v.currentTime = Math.max(0, v.currentTime - 0.5); e.preventDefault(); }
    if (e.key === 'ArrowRight') { v.currentTime = Math.min(dur(), v.currentTime + 0.5); e.preventDefault(); }
  });
  /* 指摘の位置を目盛りの上に赤い印で置く（どこに何件あるかが一目で分かる） */
  ctl.marks = rows => {
    marks.textContent = '';
    for (const r of rows) {
      const d = document.createElement('div');
      d.className = 'tpmark';
      d.style.left = (dur() ? (r.t / dur() * 100) : 0) + '%';
      d.title = fmtT(r.t);
      marks.appendChild(d);
    }
  };
  /* 映像の実領域（余白を除いたところ）。読めないあいだは null */
  const area = () => {
    const r = v.getBoundingClientRect(), vw = v.videoWidth || 0, vh = v.videoHeight || 0;
    if (!vw || !vh || !r.width || !r.height) return null;
    const s = Math.min(r.width / vw, r.height / vh);
    return { r, w: vw * s, h: vh * s };
  };
  ctl.point = e => {
    const a = area();
    if (!a) return null;
    const x = (e.clientX - a.r.left - (a.r.width - a.w) / 2) / a.w;
    const y = (e.clientY - a.r.top  - (a.r.height - a.h) / 2) / a.h;
    return (x < 0 || x > 1 || y < 0 || y > 1) ? null : { x, y };
  };
  ctl.showPin = (x, y) => {
    const a = area(), b = box.getBoundingClientRect();
    if (!a || !b.width || !b.height) { pin.hidden = true; return; }
    const px = (a.r.left - b.left) + (a.r.width - a.w) / 2 + x * a.w;
    const py = (a.r.top  - b.top)  + (a.r.height - a.h) / 2 + y * a.h;
    pin.style.left = (px / b.width * 100) + '%';
    pin.style.top  = (py / b.height * 100) + '%';
    pin.hidden = false;
  };
  ctl.hidePin = () => { pin.hidden = true; };
  /* いまのコマを小さな JPEG に切り出す（画面に出すだけ・送らない）。
     crossorigin を外していたら canvas が汚れて読めないので、その場合は作らない */
  ctl.thumb = (x, y) => {
    if (!ctl.canvas) return null;
    try {
      const vw = v.videoWidth || 0, vh = v.videoHeight || 0;
      if (!vw || !vh) return null;
      const w = 180, h = Math.max(1, Math.round(w * vh / vw));
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const g = c.getContext('2d');
      g.drawImage(v, 0, 0, w, h);
      if (x != null) {
        g.beginPath();
        g.arc(x * w, y * h, Math.max(8, Math.round(w * 0.075)), 0, Math.PI * 2);
        g.lineWidth = Math.max(2, Math.round(w / 110));
        g.strokeStyle = '#ff3b30'; g.fillStyle = 'rgba(255,59,48,.22)';
        g.fill(); g.stroke();
      }
      return c.toDataURL('image/jpeg', 0.72);
    } catch (_) { ctl.canvas = false; return null; }
  };
  syncPlay(); paint();
  return ctl;
}

/* ── シーンの時刻表 ─────────────────────────────────────────────────
   動画と同じ版の表だけを使う。無い・読めない・尺が動画と 1.0 秒を超えて食い違うときは
   使わない（**推測した時刻表は指摘を別の場面に付けてしまう**）。使わないときは時刻だけ。 */
function tapTimeline(files, videoName){
  const m = /_v(\d+)\./i.exec(String(videoName || ''));
  const want = m ? Number(m[1]) : null;
  for (const f of files) {
    const t = RE_TIMELINE.exec(f.name || '');
    if (!t || f.text == null) continue;
    if (want != null && Number(t[1]) !== want) continue;
    try {
      const o = JSON.parse(f.text);
      const rows = (o && Array.isArray(o.scenes) ? o.scenes : [])
        .filter(s => s && s.start != null && s.end != null)
        .map(s => ({ n: Number(s.n), title: String(s.title == null ? '' : s.title),
                     start: Number(s.start), end: Number(s.end) }))
        .filter(s => isFinite(s.start) && isFinite(s.end));
      if (!rows.length) return null;
      return { duration: Number(o.duration) || null, scenes: rows };
    } catch (_) { return null; }
  }
  return null;
}
const tapScene = t => {
  const tl = tap && tap.tl;
  if (!tl) return null;
  return tl.scenes.find(s => t >= s.start && t < s.end) || tl.scenes[tl.scenes.length - 1] || null;
};
/* シートと一覧に出す「いつ・どこ」の1行 */
function tapWhere(kind, t, scene, title){
  const head = NOTE_KIND_LABEL[kind] || '';
  if (scene == null) return head ? head.replace(/\s*・\s*$/, '') : '';
  return head + svUnitN(scene) + (title ? '「' + title + '」' : '');
}

/* ── 下書き（送る前に画面を閉じても消えない）──────────────────────────────
   動画・ゲート・版をまとめた鍵で localStorage に持つ。**静止画は保存しない**（大きすぎる／
   送りもしない）ので、開き直したサムネイルは「画なし」になる。版が変われば古いぶんは捨てる。 */
const tapDraftKey = () => TAP_DRAFT + tap.key;
function tapDraftSave(){
  if (!tap) return;
  try {
    /* 何も書いていない状態を残さない（送ったあとに空の下書きが生き返って見える） */
    if (!tap.items.length && !tapMemoVal()) { localStorage.removeItem(tapDraftKey()); return; }
    localStorage.setItem(tapDraftKey(), JSON.stringify({
      v: 1, at: Date.now(), memo: tapMemoVal(),
      items: tap.items.map(r => ({ id:r.id, kind:normKind(r.kind), t:r.t, scene:r.scene,
        scene_title:r.scene_title, pin:r.pin, tag:r.tag, note:r.note, variant:r.variant || null }))
    }));
  } catch (_) {}                              /* 容量切れ・無効化は黙って諦める（入力は続く） */
}
function tapDraftLoad(){
  try {
    const mine = tapDraftKey(), pre = TAP_DRAFT + tap.vid + '|' + tap.gate + '|';
    for (let i = localStorage.length - 1; i >= 0; i--) {
      const k = localStorage.key(i);
      if (k && k.startsWith(pre) && k !== mine) localStorage.removeItem(k);
    }
    const o = JSON.parse(localStorage.getItem(mine) || 'null');
    return (o && o.v === 1 && Array.isArray(o.items)) ? o : null;
  } catch (_) { return null; }
}
function tapDraftDrop(){ try { localStorage.removeItem(tapDraftKey()); } catch (_) {} }

/* ── 右列の入力（シート・入口の行・指摘の一覧・メモ）────────────────────────

const tapEl = s => tap && tap.panel ? tap.panel.querySelector(s) : null;
const tapMemoVal = () => { const t = tapEl('[data-memo]'); return ((t && t.value) || '').trim(); };

/* 入力欄の文から、定型の言葉（札）と残りの一言を分ける（見本と同じ分け方） */
function tapSplit(v){
  let rest = v || '';
  const tags = [];
  for (const name of NOTE_TAGS_ALL) {
    if (rest.indexOf(name) >= 0) { tags.push(name); rest = rest.replace(name, ''); }
  }
  /* 改行は残す（複数行で書けるようにした・2026-09-23）。詰めるのは横の空白の連続だけ */
  rest = rest.replace(/[ \t]{2,}/g, ' ').replace(/\n{3,}/g, '\n\n').replace(/^[\s、。・,.]+/, '').trim();
  return { tag: tags.length ? tags.join('・') : null, note: rest };
}

function tapBuildTags(){
  const row = tapEl('[data-tagrow]');
  const input = tapEl('[data-snote]');
  row.textContent = '';
  for (const name of (NOTE_TAGS[normKind(tap.draft.kind)] || NOTE_TAGS.picture)) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'tagbtn'; b.textContent = name;
    b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', () => {
      /* 押した言葉を入力欄に入れる（もう一度押すと外す）。そのまま書き足せる */
      let v = input.value || '';
      if (v.indexOf(name) >= 0) v = v.replace(name, '').replace(/[ \t]{2,}/g, ' ').replace(/^\s+/, '');
      else v = (v && !/\s$/.test(v) ? v + ' ' : v) + name + ' ';
      input.value = v;
      tapSyncTags();
      input.focus({ preventScroll: true });
      try { input.setSelectionRange(v.length, v.length); } catch (_) {}
    });
    row.appendChild(b);
  }
}
function tapSyncTags(){
  const input = tapEl('[data-snote]'), v = (input && input.value) || '';
  tapEl('[data-tagrow]').querySelectorAll('.tagbtn').forEach(b =>
    b.setAttribute('aria-pressed', v.indexOf(b.textContent) >= 0 ? 'true' : 'false'));
  const add = tapEl('[data-tapact="add"]');
  const memo = tap.draft ? tap.draft.memo : null;
  if (add) {
    /* メモを直しているときだけは空でも押せる（空にして保存＝メモを消す） */
    add.disabled = memo === 'edit' ? false : !v.trim();
    add.textContent = memo === 'edit' ? 'メモを保存する'
      : memo ? 'メモに足す'
      : (tap.draft && tap.draft.editId ? 'この指摘を直す' : 'この指摘を足す');
  }
}
/* スマホの入力画面（#552 の続き）の「全体へのメモとして書く」まわりの見た目。
   切り替えは新しく書いているときだけ出す（直している指摘をメモへ移すと元が残る／
   メモを直しているときは最初からメモ） */
function tapSyncMemoMode(){
  const sheet = tapEl('[data-sheet]');
  if (!sheet || !tap.draft) return;
  const memo = tap.draft.memo || null;
  sheet.classList.toggle('memo-on', !!memo);
  const tog = tapEl('[data-smtog]');
  if (tog) tog.hidden = memo === 'edit' || !!tap.draft.editId;
  const b = tapEl('[data-tapact="memo-toggle"]');
  if (b) b.setAttribute('aria-pressed', String(!!memo));
  const hint = tapEl('[data-smhint]');
  if (hint) hint.textContent = memo === 'append' && tapMemoVal() ? 'いまのメモの後ろに足します' : '';
  const input = tapEl('[data-snote]');
  if (input) {
    input.maxLength = memo ? NOTE_LIM.memo : NOTE_LIM.note;
    input.setAttribute('aria-label', memo ? '全体へのメモ' : '指摘の一言');
  }
  tapSyncTags();
}
/* 入力画面の上の小さな静止画。止めた場面（場所を指していれば赤丸つき）を指摘の一覧の
   サムネと同じ仕組み（ctl.thumb）で切り出す。読めない動画では出さない */

  const img = tapEl('[data-sthumb]');
  if (!img || !tap || !tap.draft || !svMobileOn()) return;
  const d = tap.draft, pic = normKind(d.kind) === 'picture' && d.x != null;
  const src = d.memo ? null : tap.ctl.thumb(pic ? d.x : null, pic ? d.y : null);
  if (src) img.src = src; else img.removeAttribute('src');
  img.hidden = !src;
}
/* 指摘タブの中の「全体へのメモ」の1行（スマホ）。書いてあるときだけ出す */
function tapPaintMemo(){
  const row = tapEl('[data-mmemo]');
  if (!row) return;
  const v = tapMemoVal();
  row.hidden = !v;
  const t = tapEl('[data-mmemotxt]');
  if (t) t.textContent = v.replace(/\s+/g, ' ');

/* 足したあとの通知の後半。送るボタンの名前は本編と検証で違うので、画面の言葉に合わせる */
const tapNotSent = () => `（まだ送っていません。まとめて送るときは『${actWords(curItem).comment}』）`;
/* 「直す」で全体へのメモを入力画面で開く（スマホ） */
function tapOpenMemo(){
  if (!tap || tap.mode !== 'edit') return;

  tap.ctl.video.pause();
  tap.draft = { t: Math.round(tap.ctl.video.currentTime * 100) / 100, kind: 'whole', x: null, y: null,
                tag: null, note: '', editId: null, keep: null, memo: 'edit' };

}
/* 入力画面で書いたメモを全体へのメモの欄へ入れる。送る形は今までどおり notes.memo。
   'append'（新しく書いて切り替えた）は後ろに足す／'edit'（「直す」から開いた）は置き換える */
function tapSaveMemo(){
  const d = tap.draft, input = tapEl('[data-snote]'), m = tapEl('[data-memo]');
  if (!d || !m) return;
  const v = ((input && input.value) || '').trim();
  if (d.memo === 'append') {
    if (!v) return;
    m.value = (m.value.trim() ? m.value.replace(/\s+$/, '') + '\n' : '') + v;
  } else {
    m.value = v;
  }
  m.value = m.value.slice(0, NOTE_LIM.memo);
  tapCloseSheet();
  tapDraftSave();
  tapPaintMemo();
  tapSyncBar();
  toast(v ? '全体へのメモに入れました' + tapNotSent()
          : '全体へのメモを消しました');
}
const tapMobile = () => window.innerWidth < 900;
/* スマホ幅でシーン素材つきの承認画面を開いているか（#552 の1画面の作りが効いているとき） */
const svMobileOn = () => tapMobile() && !!document.querySelector('#view-detail .sview');
/* シートの「いつ・どこ」の1行。直しているときは元の指摘の場面・時刻をそのまま出す（#523 のレビュー指摘2） */
function tapSheetWhere(){
  const k = tap.draft.keep || null;
  const at = k ? k.t : tap.draft.t;
  const sc = k ? null : tapScene(tap.draft.t);
  tapEl('[data-sscene]').textContent = k
    ? tapWhere(normKind(tap.draft.kind), at, k.scene == null ? null : k.scene, k.scene_title || null)

}
function tapOpenSheet(){
