<!doctype html>
<!-- 制作ダッシュボード 本実装（Issue #191）。UI は dashboard/mockup.html 準拠、データは Supabase 実データ。
     書き込みは RPC（approve_gate＝承認・任意メモ / request_changes＝修正依頼）のみ・素材は非公開バケット review-assets の署名URL。 -->
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- サプライチェーン/XSS 対策（#191）: 外部スクリプト読込を 'self' に限定し（esm.sh 等を弾く）、
     データ通信先を Supabase 自プロジェクトに絞る。GitHub Pages は静的配信でレスポンス
     ヘッダを制御できないため CSP は meta で入れる。
     ※ frame-ancestors はブラウザ仕様上 <meta> では無効（レスポンスヘッダ限定）で、記載すると
        コンソールエラーになるだけで防御にもならないため入れない。クリックジャッキング防御は
        将来ヘッダ配信（X-Frame-Options 等）が可能になった時点で付与する想定。 -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'none';
  script-src 'self' 'unsafe-inline';
  style-src 'self' 'unsafe-inline';
  connect-src 'self' https://myavyqrzipfrofljmvkp.supabase.co;
  img-src 'self' data: https://myavyqrzipfrofljmvkp.supabase.co;
  media-src blob: https://myavyqrzipfrofljmvkp.supabase.co;
  font-src 'self' data:;
  base-uri 'none';
  form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>制作ダッシュボード</title>
<style>
/* ═══ トークン ═══════════════════════════════════════════════════ */
:root{
  color-scheme: light;
  --page:#f9f9f7; --surface-1:#fcfcfb; --surface-2:#f2f1ed; --surface-3:#eceae4;
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10); --border-2:rgba(11,11,11,.06);
  --shadow-1:0 1px 2px rgba(11,11,11,.04);
  --shadow-2:0 1px 2px rgba(11,11,11,.04), 0 8px 24px -8px rgba(11,11,11,.10);

  --s1:#2a78d6; --s1-tint:#e7f0fc;
  --s2:#eb6834; --s2-tint:#fdeee7;

  --good:#0ca30c; --good-tint:#e6f5e6;
  --warn:#fab219; --warn-tint:#fdf3dd;
  --crit:#d03b3b; --crit-tint:#faeaea;
  --up:#006300;

  /* 状態の色づかい（#205）: あなたの対応が必要=目立つ（--s2 オレンジ／--crit）／
     AI側の対応待ち=中間（青系）／終わった=沈む（--done グレー）。
     --fix は「あなたの指摘をAIが直している最中」＝作業中(--s1)と同じ青系だが、
     濃い青＋縁取り（作業中は塗りつぶし）で見分ける。--done は完了・投稿済・承認済み。 */
  --fix:#d97757;  --fix-tint:#fbeee9; --fix-ink:#9e4520;
  --done:#56544f; --done-tint:#e8e6df;
  /* tint 背景の上に載せる文字色（バッジは枠線を使わないぶん、文字色だけで AA 4.5 を確保する）。
     --s1 / --fix そのままだと tint 上で 3.8 / 2.6 しか出ないため、文字専用に濃い版を持つ */
  --s1-ink:#155ba9;

  --meter-track:#e2edfb; --meter-fill:#2a78d6;
  --stg1:#86b6ef; --stg2:#5598e7; --stg3:#2a78d6;
  --stg4:#256abf; --stg5:#1c5cab; --stg6:#8a8880;
  --stage-bg:#f3f7fd; --stage-bg-h:#e8f0fb; --stage-line:#d3e1f4;

  --fs-2xs:.6875rem; --fs-xs:.75rem; --fs-sm:.8125rem; --fs-md:.875rem;
  --fs-lg:1rem; --fs-xl:1.1875rem; --fs-hero:clamp(2rem,3.4vw,2.6rem);
  --lh-tight:1.35; --lh:1.6;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:24px; --sp-8:32px;
  --r-sm:7px; --r-md:10px; --r-lg:14px; --r-pill:999px;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --page:#0d0d0d; --surface-1:#1a1a19; --surface-2:#232322; --surface-3:#2b2b29;
    --ink:#ffffff; --ink-2:#c3c2b7; --muted:#918f88;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10); --border-2:rgba(255,255,255,.06);
    --shadow-1:none; --shadow-2:none;
    --s1:#3987e5; --s1-tint:#12233a;
    --s2:#d95926; --s2-tint:#34201a;
    --good-tint:#122b12; --warn-tint:#33290f; --crit-tint:#331616;
    --up:#0ca30c;
    --fix:#d97757;  --fix-tint:#33211a; --fix-ink:#ee9c7c;
    --done:#a8a69e; --done-tint:#2a2a28;
    --s1-ink:#79b0f2;
    --meter-track:#12243a; --meter-fill:#3987e5;
    --stg1:#b7d3f6; --stg2:#86b6ef; --stg3:#5598e7;
    --stg4:#2a78d6; --stg5:#256abf; --stg6:#8f8d86;
    --stage-bg:#141a23; --stage-bg-h:#1c2531; --stage-line:#26313f;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --page:#0d0d0d; --surface-1:#1a1a19; --surface-2:#232322; --surface-3:#2b2b29;
  --ink:#ffffff; --ink-2:#c3c2b7; --muted:#918f88;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10); --border-2:rgba(255,255,255,.06);
  --shadow-1:none; --shadow-2:none;
  --s1:#3987e5; --s1-tint:#12233a;
  --s2:#d95926; --s2-tint:#34201a;
  --good-tint:#122b12; --warn-tint:#33290f; --crit-tint:#331616;
  --up:#0ca30c;
  --fix:#d97757;  --fix-tint:#33211a; --fix-ink:#ee9c7c;
  --done:#a8a69e; --done-tint:#2a2a28;
  --s1-ink:#79b0f2;
  --meter-track:#12243a; --meter-fill:#3987e5;
  --stg1:#b7d3f6; --stg2:#86b6ef; --stg3:#5598e7;
  --stg4:#2a78d6; --stg5:#256abf; --stg6:#8f8d86;
  --stage-bg:#141a23; --stage-bg-h:#1c2531; --stage-line:#26313f;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--page); color:var(--ink); font-size:15px; line-height:var(--lh);
  font-family:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Yu Gothic UI","Noto Sans JP",Meiryo,sans-serif;
  -webkit-text-size-adjust:100%; -webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--s1); outline-offset:2px; border-radius:4px}
[hidden]{display:none!important}
.tnum{font-variant-numeric:tabular-nums}
.eyebrow{font-size:var(--fs-2xs); letter-spacing:.09em; text-transform:uppercase;
  color:var(--muted); font-weight:650}

/* ═══ ログイン ══════════════════════════════════════════════════ */
.loginwrap{min-height:100vh; display:grid; place-items:center; padding:var(--sp-5)}
.logincard{width:min(410px,100%); background:var(--surface-1); border:1px solid var(--border);
  border-radius:var(--r-lg); padding:var(--sp-8) var(--sp-6); box-shadow:var(--shadow-2)}
.logincard h1{font-size:var(--fs-xl); font-weight:700; margin:6px 0 4px}
.logincard p.sub{color:var(--ink-2); font-size:var(--fs-sm); margin:0 0 var(--sp-6)}
.fld{display:grid; gap:5px; margin-bottom:var(--sp-4)}
.fld label{font-size:var(--fs-2xs); color:var(--muted); font-weight:700; letter-spacing:.07em; text-transform:uppercase}
.fld input{font-family:inherit; font-size:var(--fs-md); border:1px solid var(--border);
  border-radius:var(--r-md); padding:10px 13px; background:var(--surface-1); color:var(--ink); width:100%}
.btn{font-family:inherit; font-size:var(--fs-sm); border-radius:var(--r-md); padding:9px 17px; cursor:pointer;
  border:1px solid var(--border); background:var(--surface-2); color:var(--ink); white-space:nowrap;
  transition:background .12s}
.btn:hover{background:var(--surface-3)}
/* 「コメントする」用（#205 オーナー指定）: 承認（塗り）ほど強調せず、
   素の白ボタンよりは存在感を出す。AI に渡る操作なので AI 側の色（--fix）の淡色 */
.btn.soft{background:var(--fix-tint); color:var(--fix-ink); border-color:var(--fix); font-weight:680}
.btn.soft:hover{background:var(--fix-tint); filter:brightness(.96)}
.btn.primary{background:var(--s1); border-color:transparent; color:#fff; font-weight:680}
.btn.primary:hover{filter:brightness(1.08)}
.btn.block{width:100%; padding:11px 17px; font-size:var(--fs-md)}
.btn[disabled]{opacity:.55; cursor:default}
.errbox{background:var(--crit-tint); border:1px solid var(--border-2); color:var(--ink);
  border-radius:var(--r-md); padding:10px 13px; font-size:var(--fs-sm); margin-bottom:var(--sp-4)}
.errbox b{color:var(--crit)}

/* ═══ ヘッダー ══════════════════════════════════════════════════ */
.topbar{position:sticky; top:0; z-index:40; background:var(--surface-1); border-bottom:1px solid var(--border)}
.topbar-in{max-width:min(2240px, 94vw); margin:0 auto; padding:var(--sp-3) var(--sp-5) 0}
.brandrow{display:flex; align-items:center; gap:var(--sp-3); flex-wrap:wrap}
.brand{font-size:var(--fs-lg); font-weight:680; letter-spacing:.005em; line-height:1.2; margin-right:auto}
/* サブタイトル「YOUTUBE PRODUCTION」は PC/スマホとも非表示（ヘッダーを詰める・#202） */
.brand small{display:none; font-size:var(--fs-2xs); font-weight:600; color:var(--muted);
  letter-spacing:.11em; text-transform:uppercase; margin-top:2px}
.syncchip{display:inline-flex; align-items:center; gap:6px; font-size:var(--fs-xs); color:var(--ink-2);
  border:1px solid var(--border); border-radius:var(--r-pill); padding:3px 11px; background:var(--surface-2)}
.syncdot{width:6px;height:6px;border-radius:var(--r-pill);background:var(--good)}
.syncdot.busy{background:var(--warn)}
.usermenu{position:relative}
.user{display:inline-flex; align-items:center; gap:7px; font-size:var(--fs-xs); color:var(--ink-2);
  border:1px solid var(--border); border-radius:var(--r-pill); padding:3px 12px 3px 4px; background:var(--surface-2);
  font-family:inherit; cursor:pointer}
.user:hover{background:var(--surface-3)}
.avatar{width:22px;height:22px;border-radius:var(--r-pill);background:var(--s1);color:#fff;
  display:grid;place-items:center;font-size:var(--fs-2xs);font-weight:700}
.menupop{position:absolute; right:0; top:calc(100% + 7px); z-index:60; background:var(--surface-1);
  border:1px solid var(--border); border-radius:var(--r-md); box-shadow:var(--shadow-2);
  padding:var(--sp-3); width:max-content; min-width:200px; display:grid; gap:var(--sp-2)}
.menupop .em{font-size:var(--fs-2xs); color:var(--muted); word-break:break-all}
.iconbtn{border:1px solid var(--border);background:var(--surface-2);color:var(--ink-2);
  border-radius:var(--r-pill);width:30px;height:30px;cursor:pointer;font-size:var(--fs-md);line-height:1;
  display:grid;place-items:center;transition:background .12s}
.iconbtn:hover{background:var(--surface-3); color:var(--ink)}
.iconbtn.spin{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.chtabs{display:flex; gap:var(--sp-1); margin-top:var(--sp-3); overflow-x:auto; scrollbar-width:none}
.chtabs::-webkit-scrollbar{display:none}
.chtab{flex:0 0 auto; display:inline-flex; align-items:center; gap:7px;
  border:1px solid transparent; border-bottom:none; background:transparent; color:var(--ink-2);
  border-radius:var(--r-md) var(--r-md) 0 0; padding:8px 15px; font-size:var(--fs-sm); font-family:inherit;
  cursor:pointer; position:relative; top:1px; transition:background .12s, color .12s}
.chtab:hover{background:var(--surface-2); color:var(--ink)}
.chtab .cdot{width:9px;height:9px;border-radius:3px;flex:0 0 auto}
.chtab[aria-selected="true"]{background:var(--surface-2); color:var(--ink); font-weight:650;
  border-color:var(--border-2); box-shadow:inset 0 2px 0 0 var(--chac)}
body[data-chindep="1"] .chtabs{opacity:.5; pointer-events:none}

/* ═══ ナビ ══════════════════════════════════════════════════════ */
.nav{background:var(--surface-1); border-top:1px solid var(--border-2)}
.nav-in{max-width:min(2240px, 94vw); margin:0 auto; padding:0 var(--sp-5); display:flex; gap:var(--sp-1)}
.navbtn{appearance:none; border:none; background:transparent; font-family:inherit; font-size:var(--fs-md);
  color:var(--ink-2); padding:12px 14px 10px; cursor:pointer; border-bottom:2px solid transparent;
  display:inline-flex; align-items:center; gap:7px; transition:color .12s; position:relative}
.navbtn:hover{color:var(--ink)}
.navbtn[aria-selected="true"]{color:var(--ink); font-weight:680; border-bottom-color:var(--ink)}
.navbtn .ni{font-size:var(--fs-lg); line-height:1}
.navbtn .badge{background:var(--warn-tint); color:var(--ink); border:1px solid var(--border);
  border-radius:var(--r-pill); font-size:var(--fs-2xs); padding:0 6px; font-weight:700; line-height:1.5}

/* ═══ レイアウト ════════════════════════════════════════════════ */
main{max-width:min(2240px, 94vw); margin:0 auto; padding:var(--sp-6) var(--sp-5) 88px; min-width:0}
.view{display:none; min-width:0}
.view.active{display:block}
.pagehead{margin-bottom:var(--sp-5)}
.pagehead h1{font-size:var(--fs-xl); font-weight:700; margin:3px 0 4px; letter-spacing:-.005em;
  line-height:var(--lh-tight); display:flex; align-items:center; gap:9px; flex-wrap:wrap}
/* 説明サブテキストは全画面（PC/スマホ）で非表示・一覧を上へ（#202） */
.pagehead p{display:none; color:var(--ink-2); font-size:var(--fs-sm); margin:0; max-width:88ch}
.sectionhead{display:flex; align-items:baseline; gap:var(--sp-3); margin:var(--sp-8) 0 var(--sp-3); flex-wrap:wrap}
.sectionhead h2{font-size:var(--fs-md); font-weight:680; margin:0; letter-spacing:.005em}
.sectionhead .hint{display:none; font-size:var(--fs-xs); color:var(--muted)}
.sectionhead .spacer{margin-left:auto}
.card{background:var(--surface-1); border:1px solid var(--border); border-radius:var(--r-lg);
  padding:var(--sp-5); box-shadow:var(--shadow-2); min-width:0}
.stack{display:grid; gap:var(--sp-4); min-width:0}
.stack>*, .kpis>*, .rvlist>*, .runs>*{min-width:0}
.note{display:flex; gap:9px; align-items:flex-start; background:var(--surface-2); border:1px solid var(--border-2);
  border-radius:var(--r-md); padding:10px 13px; font-size:var(--fs-sm); color:var(--ink-2); margin-bottom:var(--sp-4)}
.note b{color:var(--ink); font-weight:650}
.loadbox{color:var(--muted); font-size:var(--fs-sm); padding:var(--sp-8); text-align:center;
  border:1px dashed var(--border); border-radius:var(--r-lg)}
.noitem{color:var(--ink-2); font-size:var(--fs-sm); padding:var(--sp-6); text-align:center;
  border:1px dashed var(--border); border-radius:var(--r-lg)}
.noitem .s{display:block; color:var(--muted); font-size:var(--fs-xs); margin-top:6px}

/* ═══ 表 ════════════════════════════════════════════════════════ */
.tblwrap{overflow:auto; border:1px solid var(--border); border-radius:var(--r-md);
  background:var(--surface-1); min-width:0; box-shadow:var(--shadow-1)}
.tblwrap.tall{max-height:60vh}
table{border-collapse:separate; border-spacing:0; width:100%; font-size:var(--fs-sm)}
th,td{text-align:left; padding:9px 14px; border-bottom:1px solid var(--border-2); white-space:nowrap;
  vertical-align:middle}
thead th{position:sticky; top:0; z-index:2; background:var(--surface-2); color:var(--muted);
  font-size:var(--fs-2xs); font-weight:700; letter-spacing:.07em; text-transform:uppercase;
  padding-top:8px; padding-bottom:8px; border-bottom:1px solid var(--border)}
td.num,th.num{text-align:right; font-variant-numeric:tabular-nums}
tbody tr:last-child td{border-bottom:none}
tbody tr{transition:background .1s}
tbody tr:hover td{background:var(--surface-2)}
.sw{width:9px;height:9px;border-radius:3px;display:inline-block;vertical-align:0;margin-right:7px}
td.seq{font-weight:700; font-size:var(--fs-xs); color:var(--muted); font-variant-numeric:tabular-nums}
td.ttl{white-space:normal; min-width:250px; max-width:400px; line-height:1.45}
.gates{display:inline-flex; gap:4px; flex-wrap:nowrap}
.genre{display:inline-block; font-size:var(--fs-2xs); color:var(--ink-2); background:var(--surface-2);
  border:1px solid var(--border-2); border-radius:var(--r-sm); padding:1px 8px; white-space:nowrap}
td.dim{color:var(--muted)}

.chips{display:flex; flex-wrap:wrap; gap:6px; margin:0 0 var(--sp-3)}
.chipf{display:inline-flex; align-items:center; gap:7px; font-family:inherit; font-size:var(--fs-xs);
  border:1px solid var(--border); background:var(--surface-1); color:var(--ink-2);
  border-radius:var(--r-pill); padding:5px 13px; cursor:pointer; transition:background .12s, color .12s}
.chipf:hover{background:var(--surface-2); color:var(--ink)}
.chipf .sw{margin:0}
.chipf .n{font-variant-numeric:tabular-nums; font-weight:700; color:var(--ink)}
.chipf[aria-pressed="true"]{background:var(--ink); border-color:var(--ink); color:var(--page); font-weight:650}
.chipf[aria-pressed="true"] .n{color:var(--page)}
.chipf[disabled]{opacity:.4; cursor:default}
.chipf[disabled]:hover{background:var(--surface-1); color:var(--ink-2)}

.toolbar{display:flex; gap:var(--sp-2); align-items:center; flex-wrap:wrap; margin:0 0 var(--sp-2)}
.toolbar input[type="search"],.toolbar select{font-family:inherit; font-size:var(--fs-xs);
  border:1px solid var(--border); border-radius:var(--r-md); padding:7px 12px;
  background:var(--surface-1); color:var(--ink); min-width:0}
.toolbar input[type="search"]{flex:0 1 250px}
.toolbar select{flex:0 0 auto}
.cond{font-size:var(--fs-2xs); color:var(--ink-2); display:inline-flex; align-items:center;
  gap:6px; flex-wrap:wrap}
.cond b{color:var(--ink); font-weight:680}
.toolbar .btn{padding:7px 14px; font-size:var(--fs-xs)}
.hits{font-size:var(--fs-2xs); color:var(--muted); font-variant-numeric:tabular-nums; margin-left:auto}

/* 絞り込みの折りたたみ（PC・スマホ共通で既定は畳み・#202）＋常時見える要約バー */
.filterbar{display:flex; align-items:center; gap:var(--sp-2); flex-wrap:wrap; margin:0 0 var(--sp-2)}
.filterbox{display:none}
.filterbox.open{display:block}
.filtoggle{display:inline-flex; align-items:center; gap:6px; font-family:inherit; font-size:var(--fs-xs);
  border:1px solid var(--border); background:var(--surface-2); color:var(--ink); border-radius:var(--r-pill);
  padding:6px 14px; cursor:pointer; transition:background .12s}
.filtoggle:hover{background:var(--surface-3)}
.filtoggle .fcaret{font-size:10px; transition:transform .15s}
.filtoggle[aria-expanded="true"] .fcaret{transform:rotate(180deg)}

.legend2{display:flex; gap:var(--sp-4); flex-wrap:wrap; font-size:var(--fs-2xs); color:var(--ink-2);
  align-items:center; margin:0 0 var(--sp-2); padding:7px 12px; border-radius:var(--r-md);
  background:var(--stage-bg); border:1px solid var(--stage-line)}
.legend2 .lg{display:inline-flex; align-items:center; gap:6px}
.legend2 b{color:var(--ink); font-weight:680; letter-spacing:.04em}

.mtx table{min-width:1060px}
.mtx th.st,.mtx td.st{width:40px; text-align:center; padding-left:2px; padding-right:2px;
  background:var(--stage-bg)}
/* 工程の列見出しは 10px では読めない（オーナー指摘 #206）ので本文並みの 12.5px にする。
   7列ぶんの幅は 1文字ずつ詰める（letter-spacing:-.02em）＋左右パディング 2px で吸収し、
   横スクロールを出さない。最長は「絵コンテ」「投稿待ち」の4文字＝約 52px。 */
.mtx thead th.st{letter-spacing:-.02em; text-transform:none; font-size:12.5px; color:var(--ink);
  background:var(--stage-bg-h); font-weight:700}
.mtx th.st.first,.mtx td.st.first{border-left:1px solid var(--stage-line)}
.mtx th.st.last,.mtx td.st.last{border-right:1px solid var(--stage-line)}
.mtx tbody tr:hover td.st{background:var(--stage-bg-h)}
/* 列グループ名も 10px では読めないので 11.5px（下の工程名 12.5px より一段小さく階層を保つ）。
   colspan=7（合計 約295px）に対して2文字なので幅の圧迫はない */
.mtx thead th.grp{background:var(--stage-bg-h); text-align:center; color:var(--ink);
  letter-spacing:.14em; font-size:11.5px; border-left:1px solid var(--stage-line);
  border-right:1px solid var(--stage-line); padding:5px 0}
.mtx thead th.pad{background:var(--surface-2); padding:5px 0}
.mark{display:inline-block; width:19px; height:19px; line-height:19px; border-radius:var(--r-pill);
  font-size:11px; text-align:center; font-variant-numeric:normal}
/* 完了は沈める（グレー）／AIが動いている工程は Claude のオレンジ（塗り＝作業中・
   縁取り＝あなたの指摘を修正中）／あなたの承認待ちは青の塗り（#205）。
   色で「誰のボールか」が分かる: オレンジ=AI・青=あなた・グレー=終わり */
.mark.done{color:var(--done); background:var(--done-tint); font-weight:700}
.mark.work{background:var(--fix); color:#fff; font-weight:700}
.mark.rv{background:var(--s1); color:#fff; font-weight:700}
.mark.rc{color:var(--fix-ink); background:var(--fix-tint); font-weight:700;
  box-shadow:inset 0 0 0 1.5px var(--fix)}
.mark.todo{color:var(--axis)}
.mtx tr.dropped td{color:var(--muted)}
.mtx tbody tr{cursor:pointer}
.mtx th.sortable{cursor:pointer; user-select:none}
.mtx th.sortable:hover{color:var(--ink)}
.mtx th .ar{font-size:9px; margin-left:3px; color:var(--ink)}
.mtx th:first-child,.mtx td:first-child{position:sticky; left:0; z-index:1;
  background:var(--surface-1); box-shadow:1px 0 0 var(--border-2)}
.mtx thead th:first-child{background:var(--surface-2); z-index:3}
.mtx tbody tr:hover td:first-child{background:var(--surface-2)}
/* 行の左端に状態の色帯（#205）。一覧に戻ったとき「どれが自分の番／どれがコメント済みか」を
   スクロールしながら色だけで拾えるようにする。sticky 1列目の区切り影と重ねて出す */
.mtx tbody tr.st-rv td:first-child{box-shadow:inset 3px 0 0 var(--s1), 1px 0 0 var(--border-2)}
.mtx tbody tr.st-rc td:first-child,
.mtx tbody tr.st-open td:first-child{box-shadow:inset 3px 0 0 var(--fix), 1px 0 0 var(--border-2)}
/* ── 状態バッジ（唯一のコンポーネント・#205）────────────────────────
   在庫の表／在庫カード／レビュー一覧／詳細で同じ .sbadge を使う。状態は「tint 背景＋文字色」
   だけで表し、枠線・リングは使わない（枠線あり/なしが混ざると同じ行で大きさが揃わないため）。
   寸法は全種類共通: fs-sm / padding 4px 13px / 角丸ピル / gap 5px。 */
.sbadges,.flags{display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.flags{display:inline-flex; vertical-align:middle}
td.ttl .flags{margin-left:8px}
.sbadge{display:inline-flex; align-items:center; gap:5px; font-size:var(--fs-sm); font-weight:700;
  border:none; border-radius:var(--r-pill); padding:4px 13px; white-space:nowrap; line-height:1.35;
  background:var(--surface-2); color:var(--ink-2)}
.sbadge.work,.sbadge.rc,.sbadge.open{background:var(--fix-tint); color:var(--fix-ink)}
.sbadge.rv{background:var(--s1-tint); color:var(--s1-ink)}
.sbadge.done{background:var(--done-tint); color:var(--done)}
.sbadge.idea{background:var(--surface-2); color:var(--ink-2)}
/* 進捗マトリクスはページ全体でスクロール（内部縦スクロール廃止・#204）。max-height/overflow を外して
   全高表示し、2段の列見出しを position:sticky でサイトヘッダー（.topbar＝トップバー＋ナビ）直下に固定。
   横は PC幅(≥1100px)なら表(min 1060px)が収まるので overflow:visible。収まらない中間幅のみ横コンテナ
   スクロールを許容（ページ横スクロールは出さない）。--stickytop / --mtxrow1 は JS が実測して設定。 */
.tblwrap.mtx{overflow:visible; max-height:none}
.mtx thead tr:first-child th{top:var(--stickytop, 0px)}
.mtx thead tr:nth-child(2) th{top:calc(var(--stickytop, 0px) + var(--mtxrow1, 24px))}
@media (max-width:1099.98px){ .tblwrap.mtx{overflow-x:auto} }
.emptyrow td{text-align:center; color:var(--muted); padding:26px; cursor:default}
.emptyrow:hover td{background:transparent!important}

/* ═══ 在庫カード（スマホ狭幅で表の代わりに表示） ═══════════════════ */
/* フル幅リスト行（LINE/メール風・端から端まで。カード枠/影/角丸/隙間なし・区切りは細線1本） */
.stockcards{display:none; grid-template-columns:1fr}
.scard{background:var(--surface-1); border-bottom:1px solid var(--border);
  padding:var(--sp-3) var(--sp-4); display:grid; gap:8px; cursor:pointer}
.scard:hover{background:var(--surface-2)}
.scard.dropped{opacity:.65}
/* 行頭の色帯＝状態（PC の表と同じ割り当て・#205） */
.scard.st-rv{box-shadow:inset 3px 0 0 var(--s1)}
.scard.st-rc,.scard.st-open{box-shadow:inset 3px 0 0 var(--fix)}
/* 1行目は「seq＋タイトル」（右端に滞留日数）。最初に目に入るのが何の動画かになるよう、
   バッジ群はタイトルの下＝2行目に置く（#205 オーナー指定）。タイトルが折り返しても
   滞留日数は align-items:baseline で1行目の右上に残る */
.scard-top{display:flex; align-items:baseline; gap:8px}
.scard-seq{flex:0 0 auto; font-size:var(--fs-2xs); font-weight:700; color:var(--muted);
  letter-spacing:.04em; font-variant-numeric:tabular-nums}
.scard-days{flex:0 0 auto; margin-left:auto; font-size:var(--fs-2xs); color:var(--muted);
  font-variant-numeric:tabular-nums; white-space:nowrap}
.scard-days.slow{color:var(--warn); font-weight:680}
.scard-ttl{flex:1 1 auto; min-width:0; font-size:var(--fs-md); line-height:1.45; font-weight:600}
.dotrow{display:grid; grid-template-columns:repeat(7,1fr); gap:3px; align-items:start}
.pstep{display:flex; flex-direction:column; align-items:center; gap:3px; min-width:0}
.dot{width:22px; height:22px; line-height:22px; text-align:center; border-radius:var(--r-pill);
  font-size:11px; flex:0 0 auto; font-variant-numeric:normal}
.dot.done{color:var(--done); background:var(--done-tint); font-weight:700}
.dot.work{background:var(--fix); color:#fff; font-weight:700}
.dot.rv{background:var(--s1); color:#fff; font-weight:700}
.dot.rc{color:var(--fix-ink); background:var(--fix-tint); font-weight:700;
  box-shadow:inset 0 0 0 1.5px var(--fix)}
.dot.todo{color:var(--axis); background:var(--surface-2)}
.plbl{font-size:9px; line-height:1.15; color:var(--muted); text-align:center; white-space:nowrap;
  letter-spacing:-.03em; max-width:100%; overflow:hidden; text-overflow:ellipsis}
.plbl.cur{color:var(--ink); font-weight:700}
.scard-extra{font-size:var(--fs-xs); color:var(--ink-2); font-variant-numeric:tabular-nums}
@media (max-width:640px){
  .tblwrap.mtx{display:none}
  /* main は max-width:94vw（左右3vwの余白）なので、これを外さないと負マージンでも
     画面端には届かない。スマホでは main/footer を全幅にしたうえで左右パディングを
     打ち消して、在庫カードもレビュー一覧も端から端まで使う（#205） */
  main,footer{max-width:100%}
  .stockcards{display:grid; margin-left:calc(-1 * var(--sp-3)); margin-right:calc(-1 * var(--sp-3));
    border-top:1px solid var(--border)}
  /* ⚠️ レビュー（.rvlist/.rvitem）・稼働（.runs/.run）の同等ルールはここには書かない。
     それらの基本定義がこのブロックより後ろにあり、同じ詳細度なので上書きされてしまう
     （実際それで角丸・影が残っていた）。スタイルシート末尾の専用ブロックに置く（#205） */
}

/* ═══ 詳細ビュー（履歴付き全画面遷移・#200） ══════════════════════ */
.dview{max-width:100%; margin:0 auto; animation:detailin .18s ease-out}

/* ═══ 詳細を広い画面で2カラムに（#203）
   左＝メタ情報（フック／工程タイムライン／メトリクス／メモ）・右＝レビュー（素材＋履歴＋入力）。
   横幅を「1行を長くする」のではなく「情報を並べる」ことに使う。本文の行長は .cmt .txt の
   max-width で 74ch に抑える（読み物は45〜75文字/行を超えると視線の戻りで読みにくくなる） ═══ */
@media (min-width:1240px){
  /* レビュー中の動画だけ2カラム（レビュー節が無い動画は従来どおり1カラムで詰める）。
     行スパンではなく「左列を1つのラッパにまとめて2要素を横に並べる」形にする
     （grid-row の span で伸ばすと空の暗黙行ぶんカード下部が大きく空く） */
  .dbody:has(.dsec-review){display:grid; grid-template-columns:minmax(340px,470px) minmax(0,1fr);
    gap:var(--sp-4) var(--sp-8); align-items:start}
  .dbody:has(.dsec-review) > .dsec-review{border-top:none!important; padding-top:0!important; margin-bottom:0}
  /* メモ・没理由は横に長い地の文なので、狭い左列に押し込めず上段で全幅に使う */
  .dbody:has(.dsec-review) > .dsec-note{grid-column:1 / -1}
  /* レビュー節が無い動画は1カラム。全幅に伸ばすと行が長くなりすぎるので上限を置く */
  .dbody:not(:has(.dsec-review)){max-width:980px}
}
@keyframes detailin{from{transform:translateY(8px);opacity:.5}to{transform:none;opacity:1}}
.backbtn{display:inline-flex; align-items:center; gap:6px; font-family:inherit; font-size:var(--fs-sm);
  border:1px solid var(--border); background:var(--surface-2); color:var(--ink); border-radius:var(--r-pill);
  padding:8px 16px; cursor:pointer; margin-bottom:var(--sp-4); transition:background .12s}
.backbtn:hover{background:var(--surface-3)}
/* overflow:hidden は付けない（#205）: 祖先がスクロールコンテナになると子孫の position:sticky が
   ビューポートに貼り付かなくなり、承認バーのスクロール追従が死ぬ。角の処理は .dhead 側の
   border-radius で行う（.dbody 側は背景を持たないのでカードの角丸をはみ出さない） */
.dcard{background:var(--surface-1); border:1px solid var(--border); border-radius:var(--r-lg);
  box-shadow:var(--shadow-2)}
.dhead{display:flex; align-items:flex-start; gap:var(--sp-3); padding:var(--sp-4) var(--sp-5);
  border-bottom:1px solid var(--border); background:var(--surface-1);
  border-radius:var(--r-lg) var(--r-lg) 0 0}
.dhead .seqn{font-size:var(--fs-2xs); font-weight:700; color:var(--muted); font-variant-numeric:tabular-nums}
.dhead h3{margin:2px 0 0; font-size:var(--fs-lg); font-weight:700; line-height:var(--lh-tight)}
.dhead .meta{display:flex; gap:7px; flex-wrap:wrap; margin-top:8px; align-items:center}
/* 詳細ヘッダーは小さいチップが並ぶ行なので、その行の中で揃うようバッジも同寸法に落とす
   （「同じ行に並ぶものは同じ大きさ」。一覧の行・カードでは既定サイズのまま） */
.dhead .meta .sbadge{font-size:var(--fs-2xs); padding:2px 9px; gap:4px}
.dbody{padding:var(--sp-4) var(--sp-5) var(--sp-8)}
.dsec{margin-bottom:var(--sp-5)}
.dsec h4{font-size:var(--fs-2xs); font-weight:700; color:var(--muted); letter-spacing:.09em;
  text-transform:uppercase; margin:0 0 var(--sp-2)}
.hook{background:var(--surface-2); border:1px solid var(--border-2); border-radius:var(--r-md);
  padding:11px 13px; font-size:var(--fs-sm); line-height:1.7; white-space:pre-wrap}
.tl{display:grid; gap:0}
.tl .row{display:flex; align-items:center; gap:10px; padding:7px 2px; border-bottom:1px solid var(--border-2);
  font-size:var(--fs-sm)}
.tl .row:last-child{border-bottom:none}
.tl .nm{flex:1 1 auto}
.tl .dt{color:var(--ink-2); font-size:var(--fs-xs); font-variant-numeric:tabular-nums}
.tl .row.future .nm,.tl .row.future .dt{color:var(--muted)}
.mgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:var(--sp-2)}
.mgrid .m{background:var(--surface-2); border:1px solid var(--border-2); border-radius:var(--r-md); padding:10px 12px}
.mgrid .m .k{font-size:var(--fs-2xs); color:var(--muted)}
.mgrid .m .v{font-size:var(--fs-lg); font-weight:700; font-variant-numeric:tabular-nums; line-height:1.3}
.ytlink{display:inline-block; margin-top:var(--sp-2); font-size:var(--fs-xs); color:var(--s1);
  word-break:break-all}
.dhint{font-size:var(--fs-2xs); color:var(--muted); margin-top:6px}
/* 詳細のレビュー状態バー（あなたの番／AIの番を1行で明示） */
.dstate{display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:var(--fs-sm);
  border-radius:var(--r-md); padding:8px 12px; margin:0 0 var(--sp-3); line-height:1.55}
.dstate.rv{background:var(--s1-tint); color:var(--ink)}
.dstate.rc{background:var(--fix-tint); color:var(--ink)}
.dstate b{font-weight:700}
/* 詳細ビュー表示中は一覧ナビ／チャンネルタブを隠して全画面に見せる */
body.detail-open .chtabs, body.detail-open .nav{display:none}
@media (max-width:680px){
  .dhead{padding:var(--sp-3) var(--sp-4)}
  /* 下は詰める（#205 オーナー指摘: ボツボタンの下に空白が余る）。
     承認バーが sticky で最後に来るので、その下に余白を残す必要がない */
  .dbody{padding:var(--sp-3) var(--sp-4) 0}
  .mgrid{grid-template-columns:repeat(2,1fr)}
  body.detail-open main{padding-bottom:0}
}
/* ── スマホ: 詳細も画面端まで（#205）──────────────────────────────
   一覧（.stockcards）と同じく main の左右パディングを消して端から端まで使う。
   カード／囲みは左右の枠線と角丸を落として全幅に伸ばし、地の文だけ縁に貼り付かないよう
   最小の内側パディング（--dpad）を残す。 */
@media (max-width:640px){
  :root{--dpad:11px}
  /* main は max-width:94vw（左右3vwの余白）なので、詳細表示中だけ解除しないと端に届かない */
  body.detail-open main{max-width:none; padding-left:0; padding-right:0}
  .dview{max-width:none}
  .backbtn{margin-left:var(--dpad)}
  .dcard{border-radius:0; border-left-width:0; border-right-width:0}
  .dhead{padding-left:var(--dpad); padding-right:var(--dpad)}
  .dbody{padding-left:0; padding-right:0}
  .dbody .hook,.dbody .asset,.dbody .wbox,.dbody .abox,
  .dbody .noitem,.dbody .loadbox,.dbody .dstate{
    border-radius:0; border-left-width:0; border-right-width:0}
  .dbody .dsec>h4,.dbody .blk>h4,.dbody .tl .row,.dbody .dhint,
  .dbody .ytlink,.dbody .thread,.dbody .dstate,.dbody .rjbox{
    padding-left:var(--dpad); padding-right:var(--dpad)}
  .dbody .rjbox{margin-left:0; margin-right:0}
  .dbody .mgrid .m{border-radius:0}
  .dcard,.dhead{border-radius:0}
  /* 承認は画面下端のバー（#205）。畳んでいる間は「1行ぶん」に収めて素材が読める高さを残し、
     押したときだけメモ欄と注意書きが上に開く（＝2段階は維持） */
  .dbody .abox{bottom:0; margin-top:var(--sp-5); padding:10px var(--dpad);
    padding-bottom:calc(10px + env(safe-area-inset-bottom));
    border-bottom-width:0; max-height:min(72vh, 560px);
    box-shadow:0 -7px 20px rgba(0,0,0,.20)}
  .dbody .abox .ainfo{display:none}
  .dbody .abox .arow>[data-act="approve-open"]{flex:1 1 100%; padding-top:11px; padding-bottom:11px}
  .dbody .abox .apanel{border-top:none; padding-top:0}
}
tr.dropped td{color:var(--muted)}

.seg{display:inline-flex; border:1px solid var(--border); border-radius:var(--r-md); overflow:hidden;
  background:var(--surface-2)}
.seg button{appearance:none; border:none; background:transparent; font-family:inherit; font-size:var(--fs-xs);
  color:var(--ink-2); padding:6px 15px; cursor:pointer; transition:background .12s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface-1); color:var(--ink); font-weight:680;
  box-shadow:inset 0 0 0 1px var(--border)}

/* ═══ カンバン ══════════════════════════════════════════════════ */
.kanban{display:grid; grid-auto-flow:column; grid-auto-columns:minmax(186px,1fr);
  gap:var(--sp-2); overflow-x:auto; padding-bottom:var(--sp-2)}
.col{background:var(--surface-2); border:1px solid var(--border-2); border-radius:var(--r-md); padding:9px;
  display:flex; flex-direction:column; gap:var(--sp-2); min-height:120px}
.colhead{display:flex; align-items:baseline; gap:var(--sp-2); padding:2px 3px 7px; border-bottom:1px solid var(--border)}
.colhead .nm{font-size:var(--fs-xs); font-weight:680; color:var(--ink-2); margin-right:auto}
.colhead .ct{font-size:1.3rem; font-weight:680; line-height:1}
.vcard{background:var(--surface-1); border:1px solid var(--border-2); border-radius:var(--r-sm);
  padding:9px 10px; display:grid; gap:6px; box-shadow:var(--shadow-1)}
.vcard .top{display:flex; align-items:baseline; gap:var(--sp-2)}
.vcard .seq{font-size:var(--fs-2xs); font-weight:700; letter-spacing:.04em; color:var(--muted); font-variant-numeric:tabular-nums}
.vcard .ttl{font-size:var(--fs-sm); line-height:1.45}
.vcard .meta{display:flex; flex-wrap:wrap; gap:4px; align-items:center}
.gate{font-size:var(--fs-2xs); border-radius:5px; padding:1px 6px; border:1px solid var(--border);
  color:var(--muted); white-space:nowrap}
.gate.on{background:var(--done-tint); border-color:transparent; color:var(--done); font-weight:680}
.days{font-size:var(--fs-2xs); color:var(--muted); margin-left:auto; font-variant-numeric:tabular-nums; white-space:nowrap}
.days.slow{color:var(--ink); background:var(--warn-tint); border-radius:5px; padding:1px 6px}
.resv{font-size:var(--fs-2xs); background:var(--warn-tint); border-radius:5px; padding:1px 7px;
  color:var(--ink); font-variant-numeric:tabular-nums; white-space:nowrap}
/* カンバンのカードは小さいチップの集合という別の密度なので寸法は据え置き。ただし枠線は使わず
   tint＋文字色（.resv と同じ作り）に揃える・色は一覧のバッジと同じ割り当て */
.rvflag{font-size:var(--fs-2xs); background:var(--s1-tint); border:none;
  border-radius:5px; padding:1px 7px; color:var(--s1-ink); font-weight:680; white-space:nowrap}
.rcflag{font-size:var(--fs-2xs); background:var(--fix-tint); border:none;
  border-radius:5px; padding:1px 7px; color:var(--fix-ink); font-weight:680; white-space:nowrap}
.more{font-size:var(--fs-xs); color:var(--ink-2); text-align:center; padding:7px;
  border:1px dashed var(--border); border-radius:var(--r-sm)}
.empty{font-size:var(--fs-xs); color:var(--muted); text-align:center; padding:16px 6px}
details.dropped-fold{margin-top:var(--sp-3); border:1px solid var(--border); border-radius:var(--r-md);
  background:var(--surface-1); padding:0 var(--sp-4)}
details.dropped-fold summary{cursor:pointer; padding:12px 0; font-size:var(--fs-sm); color:var(--ink-2);
  list-style:none; display:flex; align-items:center; gap:var(--sp-2)}
details.dropped-fold summary::-webkit-details-marker{display:none}
details.dropped-fold summary .tri{transition:transform .15s}
details.dropped-fold[open] summary .tri{transform:rotate(90deg)}
details.dropped-fold .body{padding:0 0 var(--sp-4); font-size:var(--fs-sm); color:var(--ink-2)}
details.dropped-fold .row{display:flex; gap:9px; align-items:baseline; padding:7px 0; border-top:1px solid var(--border-2)}
details.dropped-fold .row .seq{font-size:var(--fs-2xs); font-weight:700; color:var(--muted); font-variant-numeric:tabular-nums}
.reason{font-size:var(--fs-2xs); color:var(--muted); margin-left:auto}

/* ═══ レビュー ══════════════════════════════════════════════════ */
.rvlist{display:grid; gap:var(--sp-2)}
.rvitem{background:var(--surface-1); border:1px solid var(--border); border-radius:var(--r-lg);
  overflow:hidden; box-shadow:var(--shadow-2); transition:border-color .12s}
.rvitem:hover{border-color:var(--axis)}
/* 左端の色帯で「あなたの番＝承認待ち（青）／AIの番＝作業中・修正中（オレンジ）」を分ける（#205） */
.rvitem.is-rv{border-left:3px solid var(--s1)}
.rvitem.is-rc{border-left:3px solid var(--fix)}
/* 在庫カードと同じ構成（#205）: 1行目=seq＋タイトル（右端に待ち日数）／2行目=状態バッジ。
   広い画面では flex-wrap で1行に収まり、狭い画面ではバッジが2行目へ落ちる */
.rvhead{width:100%; text-align:left; background:transparent; border:none; font-family:inherit;
  padding:14px var(--sp-4); display:flex; gap:8px var(--sp-3); align-items:center; flex-wrap:wrap;
  cursor:pointer; color:inherit}
.rvtop{display:flex; align-items:baseline; gap:10px; flex:1 1 340px; min-width:0}
.rvhead:hover{background:var(--surface-2)}
.chip{display:inline-flex; align-items:center; gap:5px; font-size:var(--fs-2xs); border-radius:var(--r-pill);
  padding:2px 9px; border:1px solid var(--border); white-space:nowrap}
.chip .cdot{width:8px;height:8px;border-radius:2px}
.rvhead .ttl{font-size:var(--fs-md); font-weight:600; flex:1 1 auto; min-width:0; line-height:1.45}
.rvhead .seq{flex:0 0 auto; font-size:var(--fs-2xs); font-weight:700; color:var(--muted);
  font-variant-numeric:tabular-nums}
.gbadge{font-size:var(--fs-2xs); font-weight:680; border-radius:var(--r-pill); padding:2px 9px; white-space:nowrap;
  background:var(--surface-2); border:1px solid var(--border); color:var(--ink);
  display:inline-flex; align-items:center; gap:5px}
.gbadge i{width:8px; height:8px; border-radius:2px; flex:0 0 auto}
.wait{font-size:var(--fs-xs); color:var(--ink-2); white-space:nowrap; font-variant-numeric:tabular-nums;
  display:inline-flex; align-items:center; gap:4px}
.rvtop .wait{flex:0 0 auto; margin-left:auto}
.rvhead .caret{flex:0 0 auto; margin-left:auto}
.wait.slow{background:var(--warn-tint); border-radius:var(--r-sm); padding:1px 9px; color:var(--ink)}
.caret{color:var(--muted); font-size:var(--fs-xs); transition:transform .15s}
.rvitem.open .caret{transform:rotate(90deg)}
.rvbody{display:none; padding:0 var(--sp-4) var(--sp-4); border-top:1px solid var(--border-2)}
.rvitem.open .rvbody{display:block}
.blk{margin-top:var(--sp-4)}
.blk h4{font-size:var(--fs-2xs); font-weight:700; color:var(--muted); letter-spacing:.09em;
  text-transform:uppercase; margin:0 0 var(--sp-2)}
/* ── レビュー履歴（常設セクション・折りたたみ・#207）──────────────────
   details/summary で JS 無しに開閉する。見出しは他の .dsec h4 と同じ体裁に揃え、
   ▸ の向きだけで開閉が分かるようにする。基本定義（.dsec h4）より後ろに置くこと */
.dsec-history{border:1px solid var(--border-2); border-radius:var(--r-md);
  background:var(--surface-1); padding:var(--sp-3)}
.dsum{font-size:var(--fs-2xs); font-weight:700; color:var(--muted); letter-spacing:.09em;
  text-transform:uppercase; display:flex; align-items:center; gap:7px; cursor:pointer;
  list-style:none; -webkit-user-select:none; user-select:none}
.dsum::-webkit-details-marker{display:none}
.dsum::before{content:'▸'; font-size:11px; color:var(--ink-2); line-height:1;
  transition:transform .15s}
.dsec-history[open]>.dsum::before{transform:rotate(90deg)}
.dsum:hover{color:var(--ink-2)}
.dsum:focus-visible{outline:2px solid var(--s1); outline-offset:3px; border-radius:var(--r-sm)}
.dsum .n{letter-spacing:.03em; color:var(--ink-2); font-weight:700}
.dsec-history[open]>.dsum{margin-bottom:var(--sp-3)}
/* どのゲート（台本／絵コンテ／完成）の発言かを1本の時系列の中で見分ける印 */
.gatechip{font-size:var(--fs-2xs); border-radius:5px; padding:0 7px; font-weight:680;
  border:1px solid var(--border-2); background:var(--surface-1); color:var(--ink-2)}
.thread{display:grid; gap:var(--sp-2)}
.cmt{display:flex; gap:9px}
.cmt .av{width:26px;height:26px;border-radius:var(--r-pill);flex:0 0 auto;display:grid;place-items:center;
  font-size:var(--fs-2xs);font-weight:700;color:#fff}
.cmt.ai .av{background:var(--stg4)}
/* AI（ai:*）は Claude 公式アイコン画像（角丸オレンジ+白バースト・#204）。画像自身が背景と角丸を持つので
   丸クリップせず角丸のまま・object-fit:cover でアバター枠(26px)に収める（白背景/内側リングは不要） */
.cmt .av.aiav,.cmt.ai .av.aiav{background:transparent; box-shadow:none; padding:0;
  border-radius:var(--r-sm); object-fit:cover; display:block}
.cmt .bub{background:var(--surface-2); border:1px solid var(--border-2); border-radius:var(--r-md);
  padding:9px 12px; flex:1 1 auto; min-width:0; max-width:92ch}
.cmt .who{font-size:var(--fs-2xs); color:var(--muted); margin-bottom:2px;
  display:flex; gap:6px; align-items:center; flex-wrap:wrap}
.cmt .who b{color:var(--ink-2); font-weight:680}
.cmt .txt{font-size:var(--fs-md); line-height:1.75; white-space:pre-wrap; word-break:break-word}
.kindchip{font-size:var(--fs-2xs); border-radius:5px; padding:0 7px; border:1px solid var(--border-2);
  background:var(--surface-1); color:var(--ink-2)}
/* 承認＝終わったイベントなので沈める。修正依頼＝AIが直す番なのでオレンジ、
   レビュー依頼＝あなたが見る番なので青、却下（没）だけ --crit を残す */
.kindchip.approve{background:var(--done-tint); color:var(--done); border-color:transparent; font-weight:680}
.kindchip.request_changes{background:var(--fix-tint); color:var(--fix-ink); border-color:transparent; font-weight:680}
.kindchip.reject{background:var(--crit-tint); color:var(--crit); border-color:transparent; font-weight:680}
.kindchip.request_review{background:var(--s1-tint); color:var(--ink); border-color:transparent}
.aichip{font-size:var(--fs-2xs); border-radius:5px; padding:0 7px; background:var(--s1-tint);
  color:var(--ink); border:1px solid var(--border-2)}
/* 指摘の対応状況: 未対応（open）は AI が対応する番なのでオレンジ、対応済み／対応しないは沈める */
.resolved{font-size:var(--fs-2xs); border-radius:5px; padding:1px 8px; margin-top:6px;
  display:inline-block; white-space:pre-wrap; word-break:break-word; font-weight:680}
.resolved.open{color:var(--fix-ink); background:var(--fix-tint)}
.resolved.closed{color:var(--done); background:var(--done-tint)}
/* ── 書き込み: コメントと承認は別ブロック（#205）────────────────────
   誤タップ防止のため「テキストエリア＋コメントする」と「承認」を完全に分ける。
   承認は 1段目（承認ボタン）→ 2段目（メモ欄＋注意書き＋確定ボタン）の2段階で、
   1タップでは絶対に確定しない。 */
.wbox{margin-top:var(--sp-3); border:1px solid var(--border); border-radius:var(--r-md);
  padding:var(--sp-3); background:var(--surface-2); display:grid; gap:var(--sp-2)}
.wbox .wh{font-size:var(--fs-2xs); font-weight:700; color:var(--muted); letter-spacing:.09em;
  text-transform:uppercase; margin:0}
.wbox .wta{font-family:inherit; font-size:var(--fs-sm); line-height:1.65; width:100%; display:block;
  border:1px solid var(--border); border-radius:var(--r-sm); padding:9px 11px;
  background:var(--surface-1); color:var(--ink); resize:vertical; min-height:68px}
.wbox .wta:disabled{opacity:.6}
/* ヒントが折り返してもボタンは右端に置く（#205 オーナー指定） */
.wact{display:flex; gap:var(--sp-2); align-items:center; flex-wrap:wrap; justify-content:flex-end}
.wact .whint{font-size:var(--fs-2xs); color:var(--muted); margin-right:auto}
.wmsg{font-size:var(--fs-xs); border-radius:var(--r-sm); padding:7px 11px; line-height:1.6;
  background:var(--good-tint); color:var(--ink)}
.wmsg.err{background:var(--crit-tint)}

/* 承認ブロックはレビュー節の下端にスクロール追従させる（#205 オーナー要望）。
   絵コンテや素材を最後までスクロールしたその場で承認できる。コメント欄は追従させない
   （常時出すと素材が読めなくなるため）。追従で指の届く位置に来るぶん誤タップ耐性が要るので、
   1段目（このボタン）→ 2段目（メモ＋注意＋確定）の2段階は維持する。 */
.abox{position:sticky; bottom:var(--sp-3); z-index:30;
  max-height:calc(100vh - 92px); overflow-y:auto; overscroll-behavior:contain;
  margin-top:var(--sp-6); border:1px solid var(--border); border-radius:var(--r-md);
  padding:var(--sp-4); background:var(--surface-1); display:grid; gap:var(--sp-2); justify-items:start;
  box-shadow:var(--shadow-2), 0 -2px 14px rgba(0,0,0,.10)}
/* 畳んでいる間は1行のバー（追従中に画面を覆わないため）。開くと下にメモ欄が伸びる */
.abox .arow{display:flex; align-items:center; gap:var(--sp-3); flex-wrap:wrap; width:100%}
.abox .ainfo{display:grid; gap:1px; margin-right:auto; min-width:0}
.abox .ahd{font-size:var(--fs-2xs); font-weight:700; color:var(--muted); letter-spacing:.09em;
  text-transform:uppercase}
.abox .atx{margin:0; font-size:var(--fs-sm); color:var(--ink-2); line-height:1.5}
.abox .apanel{display:grid; gap:var(--sp-2); width:100%; margin-top:2px;
  border-top:1px dashed var(--border); padding-top:var(--sp-3)}
.abox .acaution{background:var(--warn-tint); border:1px solid var(--border-2); border-radius:var(--r-md);
  padding:10px 12px; font-size:var(--fs-sm); color:var(--ink); line-height:1.65}
.abox .alb{font-size:var(--fs-2xs); color:var(--muted); font-weight:700; letter-spacing:.07em;
  text-transform:uppercase}
.abox .ata{font-family:inherit; font-size:var(--fs-sm); line-height:1.65; width:100%; display:block;
  border:1px solid var(--border); border-radius:var(--r-sm); padding:9px 11px;
  background:var(--surface-1); color:var(--ink); resize:vertical; min-height:52px}
.abox .ata:disabled{opacity:.6}
.abox .anote,.rjbox .anote{font-size:var(--fs-2xs); color:var(--muted); line-height:1.55}
.abox .aact,.rjbox .aact{display:flex; gap:var(--sp-2); justify-content:flex-end; flex-wrap:wrap}

/* ── ネタごと没（#205）───────────────────────────────────────────
   承認・コメントから離した最下段に置き、意図的に目立たせない（赤で塗ると
   かえって押したくなる）。開くまでは地味なアウトラインのボタン1つだけ。
   sticky にはしない＝スクロール中に指の下に来ることがない。 */
.rjbox{margin-top:var(--sp-4); padding-top:var(--sp-3); border-top:1px dashed var(--border);
  display:grid; gap:var(--sp-2); justify-items:start}
.rjbox .rjopen{font-size:var(--fs-xs); color:var(--muted); background:transparent;
  border:1px solid var(--border); padding:7px 14px}
.rjbox .rjopen:hover{background:var(--surface-2); color:var(--ink)}
.rjbox .rjpanel{display:grid; gap:var(--sp-2); width:100%; margin-top:2px}
.rjbox .rjwarn{background:var(--surface-2); border:1px solid var(--border); border-radius:var(--r-md);
  padding:10px 12px; font-size:var(--fs-sm); color:var(--ink-2); line-height:1.65}
.rjbox .rjwarn b{color:var(--ink); font-weight:700}
.rjbox .alb{font-size:var(--fs-2xs); color:var(--muted); font-weight:700; letter-spacing:.07em;
  text-transform:uppercase}
.rjbox .rta{font-family:inherit; font-size:var(--fs-sm); line-height:1.65; width:100%; display:block;
  border:1px solid var(--border); border-radius:var(--r-sm); padding:9px 11px;
  background:var(--surface-1); color:var(--ink); resize:vertical; min-height:52px}
.rjbox .rta:disabled{opacity:.6}
/* 破壊的操作は「塗り」ではなく文字と枠だけ赤にする（目立たせすぎない） */
.btn.danger{background:transparent; border-color:var(--crit); color:var(--crit); font-weight:680}
.btn.danger:hover:not([disabled]){background:var(--crit-tint)}

/* ── レビュー素材（Storage: review-assets） ── */
.assets{display:grid; gap:var(--sp-2)}
.asset{border:1px solid var(--border-2); border-radius:var(--r-md); background:var(--surface-2); overflow:hidden}
.ahead{display:flex; gap:var(--sp-2); align-items:baseline; padding:7px 11px; border-bottom:1px solid var(--border-2)}
.ahead .anm{font-size:var(--fs-xs); font-weight:680; word-break:break-all}
.ahead .asz{font-size:var(--fs-2xs); color:var(--muted)}
.ahead .alink{margin-left:auto; font-size:var(--fs-2xs); color:var(--s1); white-space:nowrap}
.atext{margin:0; padding:11px 13px; font-size:var(--fs-xs); line-height:1.8; white-space:pre-wrap;
  word-break:break-word; max-height:340px; overflow:auto; background:var(--surface-1); color:var(--ink)}
.mdbody{padding:12px 15px; font-size:var(--fs-sm); line-height:1.75; background:var(--surface-1);
  color:var(--ink); max-height:420px; overflow:auto; overflow-wrap:anywhere}
.mdbody>*:first-child{margin-top:0}
.mdbody>*:last-child{margin-bottom:0}
.mdbody p{margin:0 0 .6em}
.mdbody .mdh{font-weight:700; line-height:var(--lh-tight); margin:1.1em 0 .45em}
.mdbody .mdh1{font-size:var(--fs-lg)}
.mdbody .mdh2{font-size:var(--fs-md); padding-bottom:4px; border-bottom:1px solid var(--border-2)}
.mdbody .mdh3,.mdbody .mdh4,.mdbody .mdh5,.mdbody .mdh6{font-size:var(--fs-md); color:var(--ink-2)}
.mdbody ul,.mdbody ol{margin:.35em 0 .75em; padding-left:1.5em}
.mdbody li{margin:.18em 0}
.mdbody strong{font-weight:700}
.mdbody strong.mdtag{color:var(--s1)}
.mdbody hr{border:none; border-top:1px solid var(--border); margin:1em 0}
.thumbs{display:grid; grid-template-columns:repeat(auto-fill,minmax(94px,1fr)); gap:var(--sp-2);
  padding:11px 12px; background:var(--surface-1)}

/* ページ画像ビューア（#203）: 絵コンテのように「読む」素材は 94px のサムネでは判読できないので、
   PDF を捲る感覚に近い縦スクロールの箱にする。箱の中だけがスクロールするので、
   17ページあってもレビュー履歴や入力欄が下へ押し出されない */
.pageview{max-height:min(78vh, 980px); overflow-y:auto; overscroll-behavior:contain;
  background:var(--surface-1); padding:11px 12px; display:grid; gap:var(--sp-3);
  grid-template-columns:repeat(auto-fill, minmax(280px, 1fr))}
.pageview figure{margin:0; width:100%}
.pageview img{width:100%; height:auto; display:block; border:1px solid var(--border-2);
  border-radius:var(--r-sm); background:#111}
.pageview figcaption{font-size:var(--fs-2xs); color:var(--muted); text-align:right; margin-top:3px}
.thumb{display:block; text-decoration:none; color:inherit}
.thumb img{width:100%; aspect-ratio:9/16; object-fit:cover; display:block;
  border:1px solid var(--border-2); border-radius:var(--r-sm); background:var(--surface-3)}
.thumb .tnm{display:block; font-size:var(--fs-2xs); color:var(--muted); margin-top:4px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.avid{width:100%; max-width:250px; aspect-ratio:9/16; display:block; margin:11px 12px;
  border-radius:var(--r-sm); background:#000}
.afiles{display:grid; gap:6px; padding:10px 12px; font-size:var(--fs-xs); background:var(--surface-1)}
.afiles a{color:var(--s1); word-break:break-all}

/* ═══ 稼働 ══════════════════════════════════════════════════════ */
.now{display:flex; gap:var(--sp-3); align-items:center; flex-wrap:wrap}
.pulse{width:10px;height:10px;border-radius:var(--r-pill);background:var(--muted);flex:0 0 auto}
.pulse.live{background:var(--good)}
.runs{display:grid; gap:var(--sp-2); margin-top:var(--sp-4)}
.run{background:var(--surface-1); border:1px solid var(--border); border-radius:var(--r-lg);
  padding:var(--sp-4); box-shadow:var(--shadow-2)}
.run.err{border-left:3px solid var(--crit)}
.run.ok{border-left:3px solid var(--done)}
.run.run-{border-left:3px solid var(--axis)}
.runhead{display:flex; gap:var(--sp-3); align-items:center; flex-wrap:wrap; margin-bottom:10px}
.runhead .when{font-size:var(--fs-md); font-weight:680; font-variant-numeric:tabular-nums}
.runhead .dur{font-size:var(--fs-2xs); color:var(--muted); font-variant-numeric:tabular-nums}
.runhead .kind{font-size:var(--fs-2xs); color:var(--ink-2); border:1px solid var(--border-2);
  border-radius:5px; padding:1px 8px; background:var(--surface-2)}
.stat{display:inline-flex; align-items:center; gap:5px; font-size:var(--fs-2xs); font-weight:700;
  border-radius:var(--r-sm); padding:2px 10px; margin-left:auto}
.stat.ok{background:var(--done-tint); color:var(--done)}
.stat.err{background:var(--crit-tint); color:var(--crit)}
.stat.run{background:var(--surface-2); color:var(--ink-2)}
.runsummary{font-size:var(--fs-sm); color:var(--ink-2); margin-bottom:8px; white-space:pre-wrap}
.lanerow{display:flex; gap:5px; align-items:center; flex-wrap:wrap; font-size:var(--fs-2xs);
  color:var(--ink-2); margin-bottom:6px}
.lane{border:1px solid var(--border-2); border-radius:5px; padding:1px 7px; font-variant-numeric:tabular-nums;
  background:var(--surface-2); white-space:nowrap}
.lane.low{background:var(--warn-tint); color:var(--ink)}
.acts{display:grid; gap:0; margin:var(--sp-3) 0 0; padding:0; list-style:none}
.acts li{display:flex; gap:9px; align-items:baseline; font-size:var(--fs-sm);
  border-top:1px solid var(--border-2); padding:8px 0}
.acts li .mk{color:var(--muted); font-size:var(--fs-2xs); flex:0 0 auto}
.acts li.bad .mk{color:var(--crit)}
.acts li.warn .mk{color:var(--warn)}
.acts li.common{color:var(--ink-2)}
.acts li .tm{color:var(--muted); font-size:var(--fs-2xs); font-variant-numeric:tabular-nums; flex:0 0 auto}
.acts li .bd{white-space:pre-wrap; word-break:break-word}
.acts .cq{font-size:var(--fs-2xs); flex:0 0 auto; border-radius:5px; padding:0 6px;
  border:1px solid var(--border-2); color:var(--ink-2)}

/* ═══ 分析 ══════════════════════════════════════════════════════ */
.kpis{display:grid; grid-template-columns:1.5fr 1fr 1fr 1fr; gap:var(--sp-2)}
.kpi{background:var(--surface-1); border:1px solid var(--border); border-radius:var(--r-lg);
  padding:var(--sp-4) var(--sp-5); box-shadow:var(--shadow-2)}
.kpi .lb{font-size:var(--fs-xs); color:var(--ink-2); margin-bottom:6px}
.kpi .vl{font-size:1.7rem; font-weight:680; line-height:1.1; letter-spacing:-.015em}
.kpi.hero{border-top:3px solid var(--chac)}
.kpi.hero .vl{font-size:var(--fs-hero)}
.kpi .dl{font-size:var(--fs-2xs); color:var(--ink-2); margin-top:6px; display:inline-flex; align-items:center; gap:5px}
.kpi .dl .up{color:var(--up); font-weight:700}
.spark{position:relative}
.spark svg{display:block; overflow:visible}
.sparkcap{font-size:var(--fs-xs); color:var(--ink-2); margin-top:10px; font-variant-numeric:tabular-nums}
.sparkcap b{color:var(--ink); font-weight:680}
.meterblk{display:grid; gap:6px; margin-top:var(--sp-4)}
.meterblk .mh{display:flex; align-items:baseline; gap:9px; font-size:var(--fs-sm); max-width:560px}
.meterblk .mh .nm{font-weight:680}
.meterblk .mh .pc{margin-left:auto; font-variant-numeric:tabular-nums; font-weight:700}
.track{height:9px; border-radius:var(--r-pill); background:var(--meter-track); overflow:hidden;
  max-width:560px; box-shadow:inset 0 0 0 1px var(--border-2)}
.track .fill{height:100%; background:var(--meter-fill); border-radius:var(--r-pill); min-width:5px}
.meterblk .cond{font-size:var(--fs-2xs); color:var(--ink-2); font-variant-numeric:tabular-nums}
.perftbl table{min-width:820px}
.substats{display:flex; flex-wrap:wrap; gap:var(--sp-3) var(--sp-6); margin:2px 0 var(--sp-2)}
.substat{display:flex; flex-direction:column; gap:2px}

/* 新版の通知バー（#205）。GitHub Pages の10分キャッシュで古い版を掴んだときに出る */
#newver{position:fixed; z-index:96; left:50%; bottom:92px; transform:translateX(-50%);

  width:max-content; max-width:min(430px, calc(100vw - 32px)); box-shadow:0 8px 28px rgba(0,0,0,.28)}

/* ═══ スマホ: 上部chrome削減・凡例1行（#201/#202。一覧を上から大きく）
   ※ 説明サブテキスト非表示・ブランドサブタイトル非表示・フィルタ折りたたみは
      base CSS で全画面に適用済み（#202）。ここはスマホ固有の圧縮だけ残す ═══ */
@media (max-width:640px){
  /* eyebrow を畳み、見出しを圧縮して一覧を上へ（PC は eyebrow/h1 を残す） */
  .pagehead{margin-bottom:var(--sp-3)}
  .pagehead .eyebrow{display:none}
  .pagehead h1{font-size:var(--fs-lg); margin:0}
  .sectionhead{margin-bottom:var(--sp-2)}

  .legend2{gap:12px; padding:2px 0; border:none; background:transparent; margin-bottom:var(--sp-2)}
  .legend2 .ex{display:none}
  .legend2 .mark{width:15px; height:15px; line-height:15px; font-size:10px}
}
/* ═══ スマホ: 在庫・レビュー・稼働の3タブを同じ「左右いっぱいの表」に揃える（#205）
   基準は在庫カード（.stockcards の行）: 角丸なし・影なし・画面端まで・区切りは細線1本・
   左端に状態の色帯・行の内側余白は 12px 16px。
   ⚠️ 置き場所に意味がある: .rvitem / .run の基本定義（角丸・影つきカード）はこの
      ブロックより前にあり詳細度も同じなので、前方のメディアクエリに書くと後勝ちで
      上書きされて効かない。必ず基本定義より後ろ＝ここに置くこと ═══ */
@media (max-width:640px){
  /* リスト本体: main の左右パディングを打ち消して画面端まで。行間の隙間は無くす */
  .rvlist,.runs{gap:0; margin-left:calc(-1 * var(--sp-3)); margin-right:calc(-1 * var(--sp-3))}
  .rvlist{border-top:1px solid var(--border)}
  /* 行: カードの角丸・影・左右の枠線を外し、下線1本だけの表の行にする。
     状態の色帯（.rvitem.is-rv / .run.ok 等）は詳細度が高いので 3px のまま残る */
  .rvitem,.run{border-radius:0; border-width:0 0 1px 0; box-shadow:none}
  .rvhead{padding:var(--sp-3) var(--sp-4)}
  .rvhead .chip{display:none}   /* チャンネルは見出しに出ているので行からは省く */
  .run{padding:var(--sp-3) var(--sp-4)}
  /* 稼働タブ: 上の説明バナーと現況も囲みを外し、下の実行ログと地続きの1枚に見せる */
  .note,.card.now{margin-left:calc(-1 * var(--sp-3)); margin-right:calc(-1 * var(--sp-3));
    border-radius:0; border-width:0 0 1px 0; box-shadow:none}
  .note{margin-bottom:0}
  .card.now{padding:var(--sp-3) var(--sp-4)}
  .runs{margin-top:0}
}
/* ═══ スマホ: レビュー履歴も詳細の他ブロックと同じ「端まで1枚」に揃える（#207）
   ⚠️ .dsec-history の基本定義（枠線・角丸・内側余白）はスタイルシートの前方にあり
      詳細度も同じなので、詳細ビューのスマホ用ブロック（max-width:640px・前方）ではなく
      必ずここ＝基本定義より後ろに置く。中身の .thread は既存の共通ルールで
      左右 --dpad が付くため、囲み側の左右パディングは 0 にして二重にしない ═══ */
@media (max-width:640px){
  .dbody .dsec-history{border-radius:0; border-left-width:0; border-right-width:0;
    padding-left:0; padding-right:0}
  .dbody .dsec-history>.dsum{padding-left:var(--dpad); padding-right:var(--dpad)}
}
/* ═══ PC（広い画面）だけ本文フォントを少し大きく（#203）
   root を 16→17px にして rem ベースの --fs-* を一律 +約1px。スマホ層(≤680px)は
   別メディアクエリで既に確定済み・ここは min-width:681px に隔離するので不変 ═══ */
@media (min-width:681px){

}
/* 広い画面ではもう一段上げる（#203・2026-08-11 オーナー要望）。--sp-* は px なので
   余白は変わらず文字だけがスケールする */
@media (min-width:1240px){

}
@media (min-width:1700px){
  html{font-size:19px}
  body{font-size:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script type="module">
import { createClient } from './vendor/supabase-js.esm.min.js';

const SUPABASE_URL = 'https://myavyqrzipfrofljmvkp.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_kt1UwIe3IUrpojqMcspieQ_zOopvk_C';
const sb = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: false }
});

/* ══ 定義 ═══════════════════════════════════════════════════════ */
const CH_ICON = {'buzz-zatsugaku':'🌏', 'dental':'🦷'};
const ACCENTS = ['var(--s1)','var(--s2)','var(--stg5)','var(--warn)','var(--good)'];
const TINTS   = ['var(--s1-tint)','var(--s2-tint)','var(--stage-bg)','var(--warn-tint)','var(--good-tint)'];
/* チャンネル別の承認ゲート（DB に列が無いため UI 側の定義。既定は3ゲート） */
const CH_GATES = {'buzz-zatsugaku':['storyboard','final'], 'dental':['script','storyboard','final']};
const GATE_LABEL = {script:'台本', storyboard:'絵コンテ', final:'完成'};
const GATE_COL = {script:1, storyboard:2, final:4};

const RE_VID = /\.(mp4|mov|webm|m4v)$/i;

const GATE_CAUTION = {storyboard:'承認すると映像生成（課金）へ進みます。'};

/* 表示上の7工程（videos.status からの写像）。
     name  = 列見出し・タイムラインの工程名（体言）
     short = 在庫カードのドット下ラベル（幅の制約があるので短縮のまま）
     work  = その工程を進行中のときのバッジ文言（「台本中」のような不自然な略を避ける・#205） */
const PSTAGES = [
  {key:'idea',   name:'ネタ案',   short:'案',       work:'ネタ検討中'},
  {key:'script', name:'台本',     short:'台本',     work:'台本作成中'},
  {key:'board',  name:'絵コンテ', short:'絵コンテ', work:'絵コンテ作成中'},
  {key:'video',  name:'映像',     short:'映像',     work:'映像作成中'},
  {key:'edit',   name:'編集',     short:'編集',     work:'編集中'},
  {key:'queue',  name:'投稿待ち', short:'待ち',     work:'投稿待ち'},
  {key:'posted', name:'投稿済',   short:'済',       work:'投稿済'}
];
/* AI が作業している状態は【AI】を付け、人間（オーナー）の番には付けない（#205 オーナー指定）。
   接頭辞の有無だけで「誰のボールか」が分かるようにする。色（オレンジ=AI / 青=あなた）と二重化 */
const AI_TAG = '【AI】';
/* デプロイ時刻。deploy-page.sh が PUT 直前に置換する（ローカルでは未置換のまま）。
   フッター表示と新版検知（checkForUpdate）の両方がこの値を見る */
const BUILT_AT = '8/12 23:42';
/* カンバン列＝DB status そのもの */
const STATUS_COLS = [
  {st:'案',        sw:'--stg1'}, {st:'台本作成中', sw:'--stg2'},
  {st:'素材制作中', sw:'--stg3'}, {st:'編集中',    sw:'--stg4'},
  {st:'投稿待ち',   sw:'--stg5'}, {st:'投稿済',    sw:'--stg6'}
];
const SORT_ORDER = ['queue','edit','video','board','script','idea','posted','dropped'];
const SORT_LABEL = {seq:'seq', title:'タイトル', genre:'ジャンル', days:'滞留', plays:'再生数', subs:'登録者増'};
const LANE_NAMES = ['案','台本','素材','編集','投稿待ち'];
const MONETIZE = [
  {nm:'早期アクセス（ファンファンディング）', subs:500,  plays:3000000},
  {nm:'広告収益（YPP 本加入）',              subs:1000, plays:10000000}
];

/* ══ ユーティリティ ═════════════════════════════════════════════ */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = n => Number(n || 0).toLocaleString('ja-JP');
const DAY = 86400000;

const partsOf = (d, opt) => {
  const o = {};
  for (const p of new Intl.DateTimeFormat('ja-JP', Object.assign({timeZone:'Asia/Tokyo'}, opt)).formatToParts(d)) o[p.type] = p.value;
  return o;
};
const DT_OPT = {year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hourCycle:'h23'};
/* JST の曜日1文字（日月火水木金土） */
const jstWD = d => partsOf(d, {weekday:'short'}).weekday;
function fmtDT(iso){
  if (!iso) return null;
  const d = new Date(iso); if (isNaN(d)) return null;
  const p = partsOf(d, DT_OPT);
  return `${p.year}-${p.month}-${p.day}(${jstWD(d)}) ${p.hour}:${p.minute}`;
}
function fmtDate(iso){
  if (!iso) return null;
  const d = new Date(iso); if (isNaN(d)) return null;
  const p = partsOf(d, {year:'numeric', month:'2-digit', day:'2-digit'});
  return `${p.year}-${p.month}-${p.day}(${jstWD(d)})`;
}
function fmtTime(iso){
  if (!iso) return '';
  const d = new Date(iso); if (isNaN(d)) return '';
  const p = partsOf(d, {hour:'2-digit', minute:'2-digit', hourCycle:'h23'});
  return `${p.hour}:${p.minute}`;
}
function fmtMD(iso){
  if (!iso) return '';
  const d = new Date(iso); if (isNaN(d)) return '';
  const p = partsOf(d, {month:'numeric', day:'numeric'});
  return `${p.month}/${p.day}`;
}
function daysSince(iso){
  if (!iso) return null;
  const d = new Date(iso); if (isNaN(d)) return null;
  return Math.max(0, Math.floor((Date.now() - d.getTime()) / DAY));
}
function jstDateStr(offsetDays){
  const d = new Date(Date.now() + (offsetDays || 0) * DAY);
  const p = partsOf(d, {year:'numeric', month:'2-digit', day:'2-digit'});
  return `${p.year}-${p.month}-${p.day}`;
}
function durText(a, b){
  if (!a || !b) return null;
  const ms = new Date(b) - new Date(a);
  if (!(ms >= 0)) return null;
  const m = Math.round(ms / 60000);
  return m < 60 ? `${m}分` : `${Math.floor(m/60)}時間${m%60}分`;
}
function displayNameOf(email){
  const local = String(email || '').split('@')[0].toLowerCase();
  if (/(kohnosuke|kounosuke|sugaya|konosuke)/.test(local)) return 'kohnosuke';
  if (/(koike|ikemin|ikego)/.test(local)) return 'koike';
  return local || 'user';
}
async function q(builder){
  const { data, error } = await builder;
  if (error) throw new Error(error.message || String(error));
  return data || [];
}

/* ══ 状態 ═══════════════════════════════════════════════════════ */
const state = {
  user:null, me:null, ch:null, view:'stock', stockView:'table', stockFilter:null,
  stockQ:'', stockGenre:'', stockSort:null, detail:null, open:null, tblOpen:false,
  filtersOpen:false, busy:false, lastSync:null
};
const store = { channels:[], accounts:[], reviews:null, core:{}, ops:null, analytics:{}, assets:{} };
const resetStockFilters = () => { state.stockFilter=null; state.stockQ=''; state.stockGenre=''; state.stockSort=null; };
const VIEWS = [
  {key:'stock',     icon:'🗂', label:'在庫'},
  {key:'review',    icon:'📝', label:'レビュー', badge:() => pendingList(state.ch).length},
  {key:'analytics', icon:'📈', label:'分析'},
  /* 稼働（夜間ジョブ）はチャンネル横断の運用ログ。全チャンネル可のユーザーだけに出す */
  {key:'ops',       icon:'🌙', label:'稼働', chIndep:true, fullOnly:true}
];
/* ── 権限（#208）─────────────────────────────────────────────────
   state.me は dashboard_me() RPC の戻り値（{display_name, channels, full_access}）。
   ⚠️ ここでの出し分けは UX のためだけで、防御ではない。実際の遮断は RLS と
      承認系 RPC がサーバ側で行う（許可外チャンネルは 0 行・書き込みは 42501）。
   RPC が取れなかったとき（旧DB・通信失敗）は全チャンネル可として扱う。制限あり
   ユーザーがこの経路に落ちても、見えるのは RLS で 0 行になった空の画面だけ。 */
const fullAccess = () => !state.me || state.me.full_access !== false;
const visibleViews = () => VIEWS.filter(v => !v.fullOnly || fullAccess());
const chMeta = slug => {
  const i = store.channels.findIndex(c => c.slug === slug);
  return { icon: CH_ICON[slug] || '🎬', accent: ACCENTS[i % ACCENTS.length] || 'var(--s1)',
           tint: TINTS[i % TINTS.length] || 'var(--surface-2)',
           name: (store.channels[i] || {}).name || slug,
           gates: CH_GATES[slug] || ['script','storyboard','final'] };
};

/* ══ データ取得 ═════════════════════════════════════════════════ */
async function loadBootstrap(){
  const [chs, accs] = await Promise.all([
    q(sb.from('channels').select('slug,name,project_dir,publish_time_jst,status').order('slug')),
    q(sb.from('accounts').select('slug,channel,platform,handle,url,is_primary,kpi_media_key,status'))
  ]);
  store.accounts = accs;
  /* 動画チャンネル＝YouTube アカウントを持つ稼働中チャンネル */
  store.channels = chs.filter(c => c.status !== 'closed'
    && accs.some(a => a.channel === c.slug && a.platform === 'youtube'));
  if (!state.ch || !store.channels.some(c => c.slug === state.ch)) {
    state.ch = store.channels.length ? store.channels[0].slug : null;
  }
}

async function loadReviews(){
  if (store.reviews) return;
  store.reviews = await q(sb.from('review_events')
    .select('id,video_id,gate,author,kind,body,score,resolution_status,resolved_by,resolution_note,resolved_at,created_at')
    .order('created_at', { ascending: true }).limit(3000));
}

function stageOf(r){
  switch (r.status) {
    case '案':        return 'idea';
    case '台本作成中': return 'script';
    case '素材制作中': return r.approved_storyboard_at ? 'video' : 'board';
    case '編集中':     return 'edit';
    case '投稿待ち':   return 'queue';
    case '投稿済':     return 'posted';
    case '没':        return 'dropped';
    default:          return 'idea';
  }
}

async function loadCore(ch){
  await loadReviews();
  if (store.core[ch]) return store.core[ch];
  const rows = await q(sb.from('v_video_stock').select('*').eq('channel', ch));
  const items = rows.map(r => {
    const it = Object.assign({}, r);
    it.genreLabel = r.genre || '未分類';
    it.stage = stageOf(r);
    it.days = daysSince(r.status_changed_at);
    it.plays = r.views;
    it.subs = r.subscribers_gained;
    it.resv = r.pub_status === '予約済' ? fmtDT(r.scheduled_at) : null;
    it.pub  = fmtDT(r.published_at) || fmtDate(r.posted_date);
    return it;
  });
  store.core[ch] = { items, byId: new Map(items.map(i => [i.id, i])) };
  return store.core[ch];
}

/* ── ゲートの状態（#205）─────────────────────────────────────────
   video×gate ごとに「最後に状態を決めたイベント」で決まる2状態。
     review  = 承認待ち（AIが提出済み・あなたの番）
     changes = 【AI】修正中（あなたがコメントを出した・AIの番）
   approve / reject が来たら解消。判定は毎回 review_events から作り直す＝
   夜間 stock keeper が resolution_status を閉じれば UI 側は何もせず追随する。 */
/* 状態を決めるイベント（これ以外の kind は現在の状態に影響しない） */
const STATE_KINDS = ['request_review', 'request_changes', 'approve', 'reject'];
/* a のほうが b より新しいか。同時刻なら id の大きい方を後とみなす（連番のため） */
const evNewer = (a, b) => {
  const ta = +new Date(a.created_at), tb = +new Date(b.created_at);
  return ta !== tb ? ta > tb : (a.id || 0) > (b.id || 0);
};
/* video×gate ごとの現在の状態。
   **配列の並び順に依存しない**（#215 Phase 1・2026-08-12）: 以前は store.reviews を頭から
   舐めて「最後に出てきたイベント」を現在の状態としていたため、取得クエリの .order() が
   唯一の順序保証になっていた。そこを触ると *エラーを出さずに古い状態を表示し続ける* という
   気づきにくい壊れ方をするので、created_at の比較で最新を選ぶ方式に変えた。 */
function gateStateMap(){
  const last = new Map();
  for (const e of (store.reviews || [])) {
    if (!STATE_KINDS.includes(e.kind)) continue;
    const k = e.video_id + '|' + e.gate;
    const prev = last.get(k);
    if (!prev || evNewer(e, prev)) last.set(k, e);
  }
  const m = new Map();
  for (const [k, e] of last) {
    /* approve / reject が最新なら状態は解消済み＝Map に入れない */
    if (e.kind === 'request_review')       m.set(k, { video_id:e.video_id, gate:e.gate, st:'review',  at:e.created_at });
    else if (e.kind === 'request_changes') m.set(k, { video_id:e.video_id, gate:e.gate, st:'changes', at:e.created_at });
  }
  return m;
}
const gateStatesOf = st => {
  const m = new Map();
  for (const [k, v] of gateStateMap()) if (v.st === st) m.set(k, v);
  return m;
};
/* 承認待ち = request_review の後に同 video×gate のコメント／approve／reject が無いもの */
const pendingMap = () => gateStatesOf('review');
/* 未対応の指摘（review_events.resolution_status='open'）を video 単位で数える */
function openCountMap(){
  const m = new Map();
  for (const e of (store.reviews || [])) {
    if (e.resolution_status === 'open') m.set(e.video_id, (m.get(e.video_id) || 0) + 1);
  }
  return m;
}
function gateList(ch, st){
  const core = store.core[ch];
  if (!core) return [];
  const open = openCountMap();
  const out = [];
  for (const p of gateStatesOf(st).values()) {
    const it = core.byId.get(p.video_id);
    /* 没にした動画はレビュー待ち・修正依頼のどちらのキューにも出さない
       （承認/却下を打たずに没にすると request_review が残り、承認待ちとして居座るため・#203） */
    if (it && it.stage !== 'dropped') {
      out.push({ item: it, gate: p.gate, at: p.at, wait: daysSince(p.at), open: open.get(p.video_id) || 0 });
    }
  }
  return out.sort((a, b) => new Date(a.at) - new Date(b.at));
}
const pendingList = ch => gateList(ch, 'review');
const changesList = ch => gateList(ch, 'changes');

/* 一覧・詳細が使う状態注釈を DB の現値から付け直す（UI 側に状態は持たない）。
   _rv=承認待ちのゲート / _rc=【AI】修正中のゲート / _open=未対応の指摘件数 */
function annotate(items){
  const rv = new Map(), rc = new Map();
  for (const p of gateStateMap().values()) (p.st === 'review' ? rv : rc).set(p.video_id, p.gate);
  const open = openCountMap();
  items.forEach(it => {
    const drop = it.stage === 'dropped';
    it._rv   = drop ? null : (rv.get(it.id) || null);
    it._rc   = drop ? null : (rc.get(it.id) || null);
    it._open = drop ? 0    : (open.get(it.id) || 0);
  });
  return items;
}
/* レビュー記録はゲートで切らず動画単位で持つ（#207）。台本→絵コンテ→完成を1本の時系列で
   読ませるため。どのゲートの発言かは表示側でチップにして示す。 */
function threadOf(videoId){
  return (store.reviews || []).filter(e => e.video_id === videoId)
    .slice().sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
}

/* ══ レビュー素材（Storage） ═════════════════════════════════════
   非公開バケット review-assets。ログイン中のユーザーは Storage の RLS で
   SELECT できる（ポリシーが無い＝一覧が 0 件なので「素材未搬出」表示になる）。
   各ファイルは有効期限つき署名URLにしてから表示する。                        */
const assetPath = (ch, seq, gate) => `${ch}/${seq}/${gate}`;
const assetKind = name => RE_IMG.test(name) ? 'image'
  : RE_VID.test(name) ? 'video' : (RE_TXT.test(name) ? 'text' : 'file');
function fmtSize(b){
  if (b == null) return '';
  if (b < 1024) return b + ' B';
  if (b < 1024 * 1024) return (b / 1024).toFixed(0) + ' KB';
  return (b / 1024 / 1024).toFixed(1) + ' MB';
}

async function loadAssets(ch, seq, gate){
  const key = assetPath(ch, seq, gate);
  const hit = store.assets[key];
  if (hit && Date.now() - hit.at < ASSET_CACHE) return hit;

  const { data, error } = await sb.storage.from(ASSET_BUCKET)
    .list(key, { limit: 100, sortBy: { column: 'name', order: 'asc' } });
  if (error) throw new Error(error.message || String(error));

  /* フォルダは id=null、空フォルダ維持用のダミーは除く */
  const files = (data || []).filter(f => f && f.id && f.name !== '.emptyFolderPlaceholder');
  const out = await Promise.all(files.map(async f => {
    const path = `${key}/${f.name}`;
    const rec = { name:f.name, path, kind:assetKind(f.name),
                  size:(f.metadata && f.metadata.size) != null ? f.metadata.size : null,
                  url:null, text:null, err:null };
    const { data: s } = await sb.storage.from(ASSET_BUCKET).createSignedUrl(path, ASSET_TTL);
    rec.url = s ? s.signedUrl : null;
    if (rec.kind === 'text') {
      const { data: blob, error: dErr } = await sb.storage.from(ASSET_BUCKET).download(path);
      if (dErr || !blob) rec.err = 'テキストを読み込めませんでした';
      else {
        const t = await blob.text();
        rec.text = t.length > ASSET_MAX_TEXT ? t.slice(0, ASSET_MAX_TEXT) + '\n\n…（以降は省略。別タブで全文を開けます）' : t;
      }
    }
    return rec;
  }));
  const res = { files: out, at: Date.now() };
  store.assets[key] = res;
  return res;
}

async function loadOps(){
  if (store.ops) return store.ops;
  const runs = await q(sb.from('agent_runs').select('*').order('started_at', { ascending: false }).limit(20));
  let events = [];

    events = await q(sb.from('agent_run_events').select('*')
      .in('run_id', runs.map(r => r.id)).order('at', { ascending: true }));

  store.ops = { runs, events };
  return store.ops;
}

async function loadAnalytics(ch){

  const primary = store.accounts.find(a => a.channel === ch && a.platform === 'youtube' && a.is_primary);

    .eq('channel', ch).eq('platform', 'youtube'));

}

/* ══ シェル ═════════════════════════════════════════════════════ */
