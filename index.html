      <td class="num">${v.avg_view_rate_pct == null ? '—' : Number(v.avg_view_rate_pct).toFixed(1) + '%'}</td>
      <td class="num">${v.hook_awr == null ? '—' : Number(v.hook_awr).toFixed(2)}</td>
      <td class="num">${v.engaged_rate_pct == null ? '—' : Number(v.engaged_rate_pct).toFixed(1) + '%'}</td>
      <td class="num">${v.subscribers_gained == null ? '—' : (v.subscribers_gained > 0 ? '+' : '') + v.subscribers_gained}</td></tr>`).join('')
    : `<tr class="emptyrow"><td colspan="8">投稿済の動画がありません</td></tr>`;

  el.innerHTML = `
    <div class="pagehead">
      <div class="eyebrow">分析</div>
      <h1>${m.icon} ${esc(m.name)}</h1>
      <p>v_publications（主口・YouTube）と daily_kpi から集計。指標は daily-log ルーチン（毎朝 6:00）で更新されます。</p>
    </div>
    <div class="kpis">${tiles}</div>
    <div class="stack" style="margin-top:var(--sp-4)">
      ${subsCard}
      ${playsCard}
      ${monet}
      ${compCard}
      ${hookCard}
      <div class="card">
        <div class="sectionhead" style="margin:0 0 var(--sp-2)"><h2>動画別の成績</h2><span class="hint">公開が新しい順・最大12件・値なしは —</span></div>
        <div class="tblwrap perftbl"><table>
          <thead><tr><th>seq</th><th>タイトル</th><th>公開日</th><th class="num">再生数</th>
            <th class="num">完全視聴率</th><th class="num">フック維持率</th><th class="num">エンゲージ率</th><th class="num">登録者増</th></tr></thead>
          <tbody>${rows}</tbody></table></div>
      </div>
      ${velocityCard}
      ${hookTypeCard}
    </div>`;
  drawSpark();
}

function drawSpark(){
  const wrap = $('#spark');
  if (!wrap || !wrap.clientWidth || !sparkSeries) return;
  const W = Math.max(260, Math.round(wrap.clientWidth));
  const H = W < 460 ? 96 : 150;
  wrap.innerHTML = sparkline(sparkSeries.values, chMeta(state.ch).accent, W, H, '登録者数の推移');
  bindSpark(sparkSeries, W, H);
}

/* ══ ④ 稼働 ════════════════════════════════════════════════════ */
function laneChips(lanes){
  if (!lanes || typeof lanes !== 'object') return '';
  return Object.keys(lanes).map(slug => {
    const m = chMeta(slug), v = lanes[slug];
    const cells = Array.isArray(v)
      ? v.map((n, i) => ({ nm: LANE_NAMES[i] || ('L' + (i + 1)), n, low: (i === 0 && n < 15) || (i === 4 && n < 2) }))
      : Object.keys(v || {}).map(k => ({ nm: k, n: v[k], low: false }));
    return `<div class="lanerow"><span class="chip"><span class="cdot" style="background:${m.accent}"></span>${m.icon} ${esc(m.name)}</span>${
      cells.map(c => `<span class="lane ${c.low ? 'low' : ''}">${c.low ? '⚠ ' : ''}${esc(c.nm)} ${esc(c.n)}</span>`).join('')}</div>`;
  }).join('');
}

async function renderOps(){
  const el = $('#view-ops');
  if (!store.ops) el.innerHTML = loading();
  let ops;
  try { ops = await loadOps(); }
  catch (e) { el.innerHTML = errBox(e.message); return; }

  const running = ops.runs.find(r => !r.finished_at);
  const runs = ops.runs.length ? ops.runs.map(r => {
    const evs = ops.events.filter(e => e.run_id === r.id);
    const cls = r.ok === true ? 'ok' : (r.ok === false ? 'err' : 'run-');
    const statCls = r.ok === true ? 'ok' : (r.ok === false ? 'err' : 'run');
    const statTxt = r.ok === true ? '✓ 正常終了' : (r.ok === false ? '✕ エラー' : '● 実行中');
    const dur = durText(r.started_at, r.finished_at);
    const acts = evs.map(e => {
      const m = e.channel ? chMeta(e.channel) : null;
      const tag = m ? `<span class="cq" style="background:${m.tint}" title="${esc(m.name)}">${m.icon}</span>`
                    : `<span class="cq">共通</span>`;
      const sev = e.severity === 'error' ? 'bad' : (e.severity === 'warn' ? 'warn' : '');
      const mk = e.severity === 'error' ? '✕' : (e.severity === 'warn' ? '⚠' : '✓');
      return `<li class="${sev}">${tag}<span class="mk">${mk}</span><span class="tm">${esc(fmtDT(e.at) ? fmtDT(e.at).slice(11) : '')}</span><span class="bd">${esc(e.body)}</span></li>`;
    }).join('');
    return `<article class="run ${cls}">
      <div class="runhead"><span class="when">${esc(fmtDT(r.started_at) || '—')}</span>
        <span class="kind">${esc(r.kind)}</span>
        ${dur ? `<span class="dur">所要 ${esc(dur)}</span>` : ''}
        <span class="stat ${statCls}">${statTxt}</span></div>
      ${r.summary ? `<div class="runsummary">${esc(r.summary)}</div>` : ''}
      ${laneChips(r.lanes)}
      ${evs.length ? `<ul class="acts">${acts}</ul>` : ''}</article>`;
  }).join('') : `<div class="noitem">まだ実行記録がありません
    <span class="s">初回: 毎日 02:00 の stock keeper（PC 起動中のみ実行）</span></div>`;

  el.innerHTML = `
    <div class="pagehead">
      <div class="eyebrow">稼働</div>
      <h1>🌙 夜間エージェント</h1>
      <p>agent_runs / agent_run_events の実行記録（新しい順に最大20件）。</p>
    </div>
    <div class="note"><span>🌐</span><div><b>この画面は全チャンネル共通です。</b>
      夜間ジョブは 1 回の実行で全チャンネルをまとめて処理するため、上のチャンネルタブの選択は反映されません。</div></div>
    <div class="card now">
      <span class="pulse ${running ? 'live' : ''}"></span>
      <div><b>${running ? `実行中: ${esc(running.kind)}（${esc(fmtDT(running.started_at) || '')} 開始）` : 'いま進行中のジョブはありません'}</b>
        <div style="font-size:var(--fs-xs);color:var(--ink-2)">次回実行 毎日 02:00 JST・PC 起動中のみ実行</div></div>
    </div>
    <div class="runs">${runs}</div>`;
}

/* ══ ツールチップ ═══════════════════════════════════════════════ */
const tip = $('#tip');
function showTip(html, x, y){
  tip.innerHTML = html; tip.classList.add('on');
  const r = tip.getBoundingClientRect();
  tip.style.left = Math.max(8, Math.min(x - r.width / 2, window.innerWidth - r.width - 8)) + 'px';
  tip.style.top = Math.max(8, y - r.height - 12) + 'px';
}
const hideTip = () => tip.classList.remove('on');

function bindSpark(series, W, H){
  const wrap = $('#spark'); if (!wrap) return;
  const svg = wrap.querySelector('svg'); if (!svg) return;
  const data = series.values;
  const hov = svg.querySelector('.hov'), hl = svg.querySelector('.hl'), hd = svg.querySelector('.hd');
  const P = 10, min = Math.min(...data), max = Math.max(...data), span = (max - min) || 1;
  const X = i => P + (W - 2 * P) * (data.length === 1 ? 0.5 : i / (data.length - 1));
  const Y = v => H - P - (H - 2 * P) * ((v - min) / span);
  const move = e => {
    const r = svg.getBoundingClientRect();
    const px = ((e.touches ? e.touches[0].clientX : e.clientX) - r.left) / r.width * W;
    const step = (W - 2 * P) / Math.max(1, data.length - 1);
    const i = Math.max(0, Math.min(data.length - 1, Math.round((px - P) / step)));
    hov.style.display = '';
    hl.setAttribute('x1', X(i)); hl.setAttribute('x2', X(i));
    hd.setAttribute('cx', X(i)); hd.setAttribute('cy', Y(data[i]));
    showTip(`${esc(series.labels[i] || '')}　<b>${nf(data[i])}</b> ${esc(series.unit)}`,
      r.left + X(i) / W * r.width, r.top + Y(data[i]) / H * r.height);
  };
  const out = () => { hov.style.display = 'none'; hideTip(); };
  svg.addEventListener('mousemove', move);
  svg.addEventListener('mouseleave', out);
  svg.addEventListener('touchstart', move, { passive: true });
  svg.addEventListener('touchmove', move, { passive: true });
  svg.addEventListener('touchend', out);
}

/* ══ 確認ダイアログ ═════════════════════════════════════════════ */
function confirmDialog(o){
  return new Promise(resolve => {
    const el = $('#cfm');
    el.innerHTML = `<div class="cfmscrim" data-cfm="0"></div>
      <div class="cfmcard" role="dialog" aria-modal="true" aria-labelledby="cfmttl">
        <h3 id="cfmttl">${esc(o.title)}</h3>
        ${o.bodyHTML || ''}
        ${o.warn ? `<div class="cfmwarn">⚠ ${esc(o.warn)}</div>` : ''}
        <div class="cfmact">
          <button class="btn" data-cfm="0">キャンセル</button>
          <button class="btn primary" data-cfm="1">${esc(o.ok || 'OK')}</button>
        </div></div>`;
    el.hidden = false;
    const done = v => {
      el.hidden = true; el.innerHTML = '';
      el.removeEventListener('click', onClick);
      document.removeEventListener('keydown', onKey, true);
      resolve(v);
    };
    const onClick = e => { const b = e.target.closest('[data-cfm]'); if (b) done(b.dataset.cfm === '1'); };
    const onKey = e => { if (e.key === 'Escape') { e.stopPropagation(); done(false); } };
    el.addEventListener('click', onClick);
    document.addEventListener('keydown', onKey, true);
    setTimeout(() => el.querySelector('.btn.primary')?.focus(), 0);
  });
}

let toastT;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 3000);
}

/* ══ 描画オーケストレーション ═══════════════════════════════════ */
async function render(){
  renderShell();
  state.busy = true; renderShell();
  try {
    if (state.view === 'stock')          await renderStock();
    else if (state.view === 'review')    await renderReview();
    else if (state.view === 'analytics') await renderAnalytics();
    else if (state.view === 'ops')       await renderOps();
    state.lastSync = new Date().toISOString();
  } catch (e) {
    $('#view-' + state.view).innerHTML = errBox(e.message);
  } finally {
    state.busy = false;
    renderShell();
  }
}

async function reloadAll(){
  store.reviews = null; store.core = {}; store.ops = null; store.analytics = {}; store.assets = {};
  state.busy = true; renderShell();
  try { await loadBootstrap(); } catch (e) { toast('再読み込みに失敗: ' + e.message); }
  await render();
  toast('最新のデータを読み込みました');
}

/* ══ イベント ═══════════════════════════════════════════════════ */
document.addEventListener('click', e => {
  /* 書き込み（コメント・承認）は他のハンドラより先に拾う */
  const wbtn = e.target.closest('[data-act]');
  if (wbtn) {
    const box = wbtn.closest('[data-wbox]');
    if (box) (wbtn.dataset.act === 'approve' ? submitApprove : submitRequestChanges)(box, wbtn.dataset.key);
    return;
  }

  if (e.target.closest('[data-close]')) { closeDetail(); return; }

  const chBtn = e.target.closest('.chtab[data-ch]');
  if (chBtn) { state.ch = chBtn.dataset.ch; state.open = null; closeDetail(); resetStockFilters(); render(); return; }

  const navBtn = e.target.closest('.navbtn[data-view]');
  if (navBtn) { state.view = navBtn.dataset.view; render(); window.scrollTo({ top: 0 }); return; }

  const segBtn = e.target.closest('[data-stockview]');
  if (segBtn) { state.stockView = segBtn.dataset.stockview; renderStock(); return; }

  const chipBtn = e.target.closest('.chipf:not([disabled])');
  if (chipBtn) {
    const k = chipBtn.dataset.filter || null;
    state.stockFilter = (state.stockFilter === k) ? null : k;
    refreshStockTable(); return;
  }
  if (e.target.closest('#stockreset')) { resetStockFilters(); renderStock(); return; }

  const sortTh = e.target.closest('.mtx th.sortable');
  if (sortTh) {
    const k = sortTh.dataset.sort, s = state.stockSort;
    state.stockSort = (s && s.key === k)
      ? (s.dir === 'asc' ? { key: k, dir: 'desc' } : null)
      : { key: k, dir: 'asc' };
    refreshStockTable(); return;
  }

  const row = e.target.closest('.mtx tbody tr[data-vid]');
  if (row) { openDetail(row.dataset.vid); return; }

  const rvHead = e.target.closest('.rvhead');
  if (rvHead) {
    const id = rvHead.closest('.rv').dataset.rv;
    state.open = state.open === id ? null : id; renderReview(); return;
  }

  if (e.target.closest('#tbltoggle')) {
    state.tblOpen = !state.tblOpen;
    $('#minitbl').classList.toggle('show', state.tblOpen);
    $('#tbltoggle').textContent = state.tblOpen ? '表を閉じる' : '表で見る';
    return;
  }
  if (e.target.closest('#reloadbtn')) { if (!state.busy) reloadAll(); return; }
  if (e.target.closest('#themebtn')) {
    const cur = document.documentElement.dataset.theme;
    const dark = cur ? cur === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = dark ? 'light' : 'dark';
    render(); return;
  }
  const ub = e.target.closest('#userbtn');
  if (ub) {
    const pop = $('#menupop'); pop.hidden = !pop.hidden;
    ub.setAttribute('aria-expanded', String(!pop.hidden)); return;
  }
  if (e.target.closest('#logoutbtn')) { signOut(); return; }
  if (!e.target.closest('.usermenu')) { $('#menupop').hidden = true; $('#userbtn')?.setAttribute('aria-expanded', 'false'); }
});
document.addEventListener('input', e => {
  if (e.target.id === 'stockq') { state.stockQ = e.target.value; refreshStockTable(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'stockgenre') { state.stockGenre = e.target.value; refreshStockTable(); }
});
document.addEventListener('keydown', e => {
  if (e.target.classList && e.target.classList.contains('wta') && e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
    const box = e.target.closest('[data-wbox]');
    if (box) { e.preventDefault(); submitRequestChanges(box, box.dataset.wbox); }
    return;
  }
  if (e.key === 'Escape' && state.detail) { closeDetail(); return; }
  const row = e.target.closest && e.target.closest('.mtx tbody tr[data-vid]');
  if (row && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openDetail(row.dataset.vid); }
});
window.addEventListener('scroll', hideTip, { passive: true });
let rzT; window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(drawSpark, 120); });

/* ══ 認証 ═══════════════════════════════════════════════════════ */
$('#loginform').addEventListener('submit', async ev => {
  ev.preventDefault();
  const btn = $('#loginbtn');
  btn.disabled = true; btn.textContent = 'ログイン中…';
  $('#loginerr').innerHTML = '';
  const { error } = await sb.auth.signInWithPassword({
    email: $('#email').value.trim(), password: $('#password').value
  });
  btn.disabled = false; btn.textContent = 'ログイン';
  if (error) {
    $('#loginerr').innerHTML = `<div class="errbox"><b>ログインできません</b><br>${esc(error.message)}</div>`;
    return;
  }
  $('#password').value = '';
});

async function signOut(){
  await sb.auth.signOut();
  store.reviews = null; store.core = {}; store.ops = null; store.analytics = {}; store.assets = {};
  store.channels = []; store.accounts = [];
  state.user = null;
  showLogin();
}

function setDisplayName(name){
  $('#username').textContent = name;
  $('#useravatar').textContent = name.slice(0, 2);
}

function showLogin(){
  $('#app').hidden = true;
  $('#login').hidden = false;
  $('#menupop').hidden = true;
  closeDetail();
  document.title = '制作ダッシュボード — ログイン';
}

async function showApp(user){
  state.user = user;
  setDisplayName(displayNameOf(user.email));
  $('#useremail').textContent = user.email || '';
  $('#login').hidden = true;
  $('#app').hidden = false;
  document.title = '制作ダッシュボード';
  state.busy = true; renderShell();
  /* 表示名の正本は dashboard_users.display_name（RPC）。未適用ならメール由来の推定を使う */
  try {
    const { data } = await sb.rpc('dashboard_display_name');
    if (data) setDisplayName(String(data));
  } catch (_) { /* フォールバック済み */ }
  try { await loadBootstrap(); }
  catch (e) {
    state.busy = false; renderShell();
    $('#view-' + state.view).innerHTML = errBox(e.message);
    return;
  }
  await render();
}

sb.auth.onAuthStateChange((event, session) => {
  if (event === 'SIGNED_IN' && session && !state.user) showApp(session.user);
  else if (event === 'SIGNED_OUT') showLogin();
});

const { data: { session } } = await sb.auth.getSession();
if (session && session.user) await showApp(session.user);
else showLogin();
</script>
