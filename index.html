  out.madeKey = svMadeKeyOf(it.id, null, null, out.mainLabel, files, out.videoName);
  return out;
}
/* 動画が読めたあと（読めなかったとき・5秒たったときも）に1回だけ fn を呼ぶ（#637）。新しい版の確認は
   ページを丸ごと取り直すので、開いた直後の動画の読み込みと回線を取り合わないよう後に回す */
function afterVideo(v, fn){
  let done = false;
  const go = () => { if (!done) { done = true; fn(); } };
  if (!v || v.readyState >= 2) { go(); return; }
  v.addEventListener('loadeddata', go, { once: true });
  v.addEventListener('error', go, { once: true });
  setTimeout(go, 5000);
}

/* 主画面に出せる動画（{承認ポイント}_v{NN}.mp4）がまだ無く、目録の「通しの参照動画」を
   主画面に借りている状態か（オーナー決定 2026-09-21）。借りているときは**見た目の位置だけ**
   入れ替えて、借りた通しを「参照動画」の列に、左（本来の動画の位置）を「素材なし」の面にする。
   ⚠️ ショットごとの参照動画がある回は入れ替えない——右の列はそちらが使うので潰さない。
   `hasRefVideo` が決まるのは尺の照合のあと（apply）なので、決まるまでは今までどおりの並び。 */
const svBorrowed = () => !!(sv && sv.mainLabel && sv.hasRefVideo === false);
/* 主画面の動画の見出し（目録の label を借りていないとき）。02・03 は「完成の動画」。
   進行係を通らない動画は置き場が1つで、主画面は承認ポイントに依らず「作った映像」なので
   「映像」と書く（「仮組み＋静止画の動画」「絵コンテの動画」は意味が取れない・#569） */
const svMainTitle = (it, gate) => offDispatcherItem(it) ? '映像' : gateName(gate, it) + 'の動画';

/* 動画2本の枠の見出し。借りている状態では左右の見出しも入れ替える（中身と同じ順に読めるように） */
function svPaintMainHead(){
  if (!sv) return;
  const label = sv.mainLabel || svMainTitle(sv.it, sv.gate);
  const borrow = svBorrowed();
  /* 借りているときの左の見出し。「絵コンテの動画」は意味が取れない（オーナー指摘 2026-09-22）——
     ここに入るのは、これから作る映像なので「映像」と書く */
  const emptyTtl = '映像';
  const stage = sv.q('[data-sv-stage]');
  if (stage) { if (borrow) stage.dataset.borrow = '1'; else delete stage.dataset.borrow; }
  /* 左の見出し: 借りているときは「参照動画」、主画面の動画があり通しの仮組みを右に出す回は「映像」
     （「絵コンテの動画」は意味が取れない・オーナー指摘 2026-09-22/23）。02・03 の完成は今までどおり */
  const mainTtl = borrow ? '参照動画' : ((sv.mat && sv.mat.ref_video_full) ? emptyTtl : label);
  /* 字が変わるときだけ書き換える（組み立てと長さが届いたときに同じ字を書き直さない・#637） */
  setText(sv.q('[data-sv-mainttl]'), mainTtl);
  setText(sv.q('[data-sv-segmain]'), mainTtl);
  setText(sv.q('[data-sv-refttl]'), borrow ? emptyTtl : '参照動画');
  setText(sv.q('[data-sv-segref]'), borrow ? emptyTtl : '参照動画');
  const sub = sv.q('[data-sv-finallbl]');
  /* 借りているときの添え字は目録の label（例「Blender の仮組み（通し）」）。ふだんはファイル名 */
  setText(sub, borrow ? label : String(sv.videoName || '').replace(/\.[^.]+$/, ''));
}

/* ── 同じ検証の複数の案（#523）────────────────────────────────────
   索引があれば①の見出し行にタブを出す。切り替えると映像・素材・時刻表・台本が入れ替わり、
   指摘の一覧・メモ・下端バーは共通のまま残る（どの案を見て書いたかは指摘1件ごとに持つ）。 */
function svBuildVariantTabs(){
  const box = sv.q('[data-sv-vtabs]');
  if (!box) return;
  box.textContent = '';
  if (!sv.variants.length) { box.hidden = true; return; }
  for (const v of sv.variants) {
    const bad = sv.badVariants.has(v.key);
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'vtab' + (bad ? ' none' : ''); b.setAttribute('role', 'tab');
    /* 読めない案は押せない見た目にして「素材なし」と分かるようにする（#523 のレビュー指摘5） */
    const full = v.label + (bad ? '（素材なし）' : '');
    /* スマホの上の帯は狭いので、括弧の前（「案A」）だけを出す（#604 E6。XP9001 では2つの案の名前で
       題名が幅0になり、2つ目のタブが切れて帯が画面からはみ出していた）。括弧の中の説明は広い画面と
       ツールチップで読める。文字は1つのまとまり（.vt）に入れる——タブは縦並びの箱なので、
       2つに分けたままだと上下に積まれる */
    const cut = full.indexOf('（');
    const short = cut > 0 ? full.slice(0, cut) : full;
    const vt = document.createElement('span'); vt.className = 'vt';
    const vs = document.createElement('span'); vs.textContent = short;
    const vx = document.createElement('span'); vx.className = 'vx'; vx.textContent = full.slice(short.length);
    vt.append(vs, vx); b.appendChild(vt);
    b.dataset.label = full;            /* 太字の幅を先に取る（CSS の .vtab::after）。選んでもタブが横にずれない */
    b.dataset.short = short;           /* スマホで出す短い名前の太字の幅 */
    if (short !== full) b.title = full;
    b.dataset.vkey = v.key;
    b.disabled = bad;
    b.setAttribute('aria-selected', String(v.key === sv.variant));
    if (!bad) b.addEventListener('click', () => svSwitchVariant(v.key));
    box.appendChild(b);
  }
  box.hidden = false;
}
/* 案を切り替えたあとの再生位置。同じ秒を保ち、尺が違ってはみ出すときは**同じ番号**の頭へ。
   番号は連番とは限らないので、添字ではなく番号で引く（…31, 32, 34…）。 */
function svKeepTime(keep, d, scenes){
  const t = Number(keep && keep.t);
  if (isFinite(t) && d && t <= d - 0.05) return t;
  const s = (scenes || []).find(x => x.n === (keep && keep.n));
  return s ? s.start + 0.05 : 0;
}
async function svSwitchVariant(key){
  if (!sv || key === sv.variant) return;
  const v = sv.variants.find(x => x.key === key);
  if (!v || !sv.ctl || sv.badVariants.has(key)) return;
  /* ⚠️ 読み込みを待つあいだに、別の動画を開いたり別の案を押したりされうる。
     待つ前に「どの画面の・何回目の切り替えか」を控え、戻ってきたら一致を確かめる。
     一致しなければ**黙って捨てる**——古い結果でいまの画面を上書きしない（#523 のレビュー指摘1） */
  const mine = sv, token = ++mine.switchSeq;
  const stale = () => sv !== mine || mine.switchSeq !== token || !mine.root.isConnected;
  const keep = { t: sv.ctl.video.currentTime, n: sv.curN };
  svStopBoth();
  const src = await svSource(mine.ch, mine.seq, mine.dir, mine.files, v, mine.variantsVer, mine.latest);
  if (stale()) return;
  if (!src.videoUrl) {
    mine.badVariants.add(key);
    svBuildVariantTabs();
    toast('この案の素材はまだありません');
    return;
  }
  const box = sv.q('[data-sv-vtabs]');
  if (box) box.querySelectorAll('.vtab').forEach(b =>
    b.setAttribute('aria-selected', String(b.dataset.vkey === key)));
  /* 見た範囲は案ごとに持つ（切り替えで入れ替え、戻れば戻る・#523 のレビュー指摘7） */
  sv.watchedBy[sv.variant || ''] = sv.watched;
  sv.variant = key;
  sv.watched = sv.watchedBy[key] || (sv.watchedBy[key] = []);
  if (tap) { tap.variant = key; tap.asset = src.videoName || null; }
  sv.matRaw = src.mat; sv.urls = src.urls; sv.mainLabel = src.mainLabel;
  sv.urlsPending = false; sv.urlsGen++;     /* 組み立てた直後の画像の差し込み（まだなら）は捨てる・#637 */
  sv.videoName = src.videoName;
  sv.tlRaw = null;                 /* 案ごとの時刻は目録が持つ（動画と同じ版の時刻表は引かない） */
  sv.manual = false; sv.manualN = null; sv.curN = null;
  sv.seekAfterLoad = keep;         /* 同じ秒を保つ。尺が短くてはみ出すときは同じ番号の頭へ */
  svPaintMainHead();
  svPaintFlow();                   /* 案ごとに作り方が違いうる（Blender だけか）ので帯も描き直す */
  sv.ctl.video.src = src.videoUrl;
  sv.ctl.video.load();             /* メタデータが届いた時点で apply() がもう一度走る */
}

/* ── 素材が届いてから組み立てる ─────────────────────────────────────
   pre＝組み立てる前にそろえた「見せるもの」（案の無い画面・svPrepare）。あれば**ここから先は待たずに**最後まで
   組み上げる（openDetail が描いた骨組みと同じ描画に入る＝描き変わって見えない・#637）。目録の画像の署名が
   まだなら（pre.urlsP）、枠だけ先に置き、届いたら画像を入れる（svFillUrls） */
async function armScene(node, files, pre){
  const root = document.querySelector('#view-detail .sview');
  if (!root || !node || !node.isConnected) return;
  const q = s => root.querySelector(s);
  const ch = node.dataset.ch, seq = node.dataset.seq, gate = node.dataset.gate;
  /* gate＝承認ポイント（承認・指摘・版に使う）、dir＝置き場（Storage のフォルダ・#569）。
     02・03 は同じもの。進行係を通らない動画は置き場が1つなので別になりうる */
  const dir = node.dataset.dir || gate;
  const latest = offDispatcherItem(curItem);
  const fail = msg => {
    const s = q('[data-sv-finalslot]'); if (s) s.textContent = msg;
    svTapOff(root);               /* 先に出したタップ入力の欄を、動画が無いので自由記述へ戻す */
    checkForUpdate();
  };

  /* 案があれば**読める最初の案**を開く。読めなかった案は控えておいてタブを押せなくする。
     全部読めなければ索引が無いのと同じ扱いへ退避する（#523 のレビュー指摘5） */
  const vx = svVariants(files, latest, dir);
  const bad = new Set();
  let variants = vx.list, variant = null, src = (pre && !vx.list.length) ? pre : null;
  if (!src) {
    for (const v of variants) {
      const s = await svSource(ch, seq, dir, files, v, vx.ver, latest);
      if (!root.isConnected || !node.isConnected) return;
      if (s.videoUrl) { src = s; variant = v.key; break; }
      bad.add(v.key);
    }
    if (!src) {
      if (variants.length) { variants = []; bad.clear(); }   /* 索引なしと同じ扱いへ退避 */
      src = await svSource(ch, seq, dir, files, null, null, latest);
      if (!root.isConnected || !node.isConnected) return;
    }
    /* 時刻表は動画と同じ版だけ（置き場は使う版だけ先に取ってある。合わなければここで取る・#637） */
    const needT = ensureVerTexts(files, RE_TIMELINE, src.videoName, true);
    if (needT) { await needT; if (!root.isConnected || !node.isConnected) return; }
  }
  if (!src.videoUrl) { fail('動画を読み込めませんでした'); return; }

  /* 主画面の動画1本だけを組み立てる（この器は隠したまま、中の枠を①へ移して使う） */
  const mode = tapModeFor(node, [{ kind:'video', url: src.videoUrl }]) || 'view';
  node.innerHTML = videoBlockHTML({ name: src.videoName, url: src.videoUrl, kind:'video', size:null }, mode);
  const ctl = armTap(node, files, mode);
  const el = node.querySelector('[data-tapvid]');
  const vbox = el ? el.querySelector('[data-vbox]') : null;
  const ctrls = el ? el.querySelector('.ctrls') : null;
  if (!vbox || !ctrls || !ctl) { fail('動画を読み込めませんでした'); return; }

  /* 動画の枠と操作バーを見本の置き場所へ移す（armVideoBar は要素を掴んでいるので移動しても動く）。
     場所を指すモードの帯はこの移動で [data-tapvid] の外に出るため、探す起点を付け替える */
  const slot = q('[data-sv-finalslot]');
  slot.parentNode.replaceChild(vbox, slot);
  ctrls.parentNode && q('[data-sv-ctrls]').appendChild(ctrls);
  ctl.el = q('[data-sv-stage]');
  if (tap) tap.ctl.el = ctl.el;

  sv = { root, q, it: curItem, ctl, mode, ch, seq, gate, dir, latest, files,
         variants, variant, variantsVer: vx.ver, badVariants: bad, switchSeq: 0,
         watchedBy: {},
         refvid: q('[data-sv-refvid]'), refSrc: null, refLoadOK: true, refIdx: 0,
         matRaw: src.mat, tlRaw: tapTimeline(files, src.videoName), mainLabel: src.mainLabel,
         videoName: src.videoName, seekAfterLoad: null,
         unit: (src.mat && src.mat.unit) || 'シーン',
         mat: null, tl: null, scenes: [], urls: src.urls, urlsPending: true, urlsGen: 0,
         curN: null, manualN: null, manual: false,
         scriptRows: [], scriptHold: 0, scriptAuto: false, prevRows: [],
         lboxList: [], lboxI: 0, prev: [], watched: [], booted: false };
  sv.watchedBy[sv.variant || ''] = sv.watched;   /* 見た範囲は案ごと（#523 のレビュー指摘7） */
  if (tap) tap.variant = sv.variant;
  sv.prev = svPrevNotes(sv.it, threadOf(sv.it.id), gate);
  svPaintMainHead();
  svBuildVariantTabs();
  svPaintFlow();
  /* 目録の画像（台本のサムネ・いまのシーンの素材）と参照動画は、枠だけ先に置き、主画面の動画が読み始めてから
     （長さが届いたら。読めない・1.5秒たったときも）入れる。署名がまだならそれも待つ。枠は作り直さない（svFillUrls）。
     画像を先に頼むと、同じ置き場への同時の接続を画像が先に取り、動画の読み込みが遅れる（#637 で実測: 2回目に開いた
     とき長さが届くまで 160ms → 300ms） */
  {
    const mine = sv, gen = sv.urlsGen, v = ctl.video;
    const metaP = new Promise(res => {
      if (v.readyState >= 1) { res(); return; }
      v.addEventListener('loadedmetadata', res, { once: true });
      v.addEventListener('error', res, { once: true });
      setTimeout(res, 1500);
    });
    Promise.all([src.urlsP || src.urls, metaP]).then(([urls]) => {
      if (sv !== mine || !mine.root.isConnected || mine.urlsGen !== gen) return;   /* 案を切り替えた・閉じた */
      mine.urls = urls || {}; mine.urlsPending = false;
      svFillUrls();
    });
  }

  /* 尺の突き合わせ（1.0 秒を超えて違えば素材表も時刻表も使わない）はメタデータが届いてから。
     組み立てたその場でも1回通す（長さが分からないあいだは目録・時刻表を使う・#637）。長さが届いたときに使う
     目録・時刻表が同じなら、台本・素材・指摘は作り直さず、長さの字だけを直す（以前は長さが届くまで台本も素材も
     出さず、届いてから全部を作っていた） */
  const prevMeta = ctl.onmeta;
  const apply = () => {
    const d = ctl.dur();
    const okDur = o => !(o && o.duration != null && d && Math.abs(o.duration - d) > TL_TOL);
    const mat = (sv.matRaw && okDur(sv.matRaw)) ? sv.matRaw : null;
    const tl  = (sv.tlRaw && okDur(sv.tlRaw)) ? sv.tlRaw : null;
    const same = sv.booted && !sv.seekAfterLoad && sv.mat === mat && sv.tl === tl;
    sv.mat = mat; sv.tl = tl;
    sv.scenes = sv.mat ? sv.mat.scenes : (sv.tl ? sv.tl.scenes : []);
    /* 単位の呼び名は目録から。使わないと決めた目録の呼び名は引かない（既定の「シーン」に戻す） */
    sv.unit = (sv.mat && sv.mat.unit) || 'シーン';
    setText(q('[data-sv-colhd]'), 'いまの' + svUnit() + 'の素材');
    /* 指摘に添えるシーン名も同じ表から引く（素材表があればそちらを使う）。尺を照合できてから（長さが届く前に足した
       指摘に、あとで使わないと決めた目録のシーンが残らないように・#637 の Codex レビュー指摘2） */
    if (tap && ctl.video.readyState >= 1) tap.tl = sv.mat ? { duration: sv.mat.duration, scenes: sv.mat.scenes } : sv.tl;
    /* 参照動画の列は常に出す。「この動画に1本でもあるか」は面の言葉を分けるためだけに使う */
    sv.hasRefVideo = sv.scenes.some(s => (s.ref_videos || []).length);
    /* 借りている状態かが決まるのはここ（ショットごとの参照動画の有無を見てから）。
       見出しと並びをここでもう一度描き直す */
    svPaintMainHead();
    const sw = q('[data-sv-switch]'); if (sw.hidden) sw.hidden = false;
    setText(q('[data-sv-facts]'), (d ? fmtT(d) : '—')
      + (sv.scenes.length ? ' ・ ' + svUnit() + ' ' + sv.scenes.length
                          : ' ・ ' + svUnit() + 'の区切りは不明'));
    if (!same) {
      svBuildScript();
      /* 台本は畳まない。スマホは台本のタブを押したときだけ出る（#552。以前はスマホだけ畳んでいた） */
      if (!sv.booted) q('.sv-script').classList.remove('closed');
      /* 案を切り替えた直後は、同じ秒に合わせる。尺が短くてはみ出すときは同じ番号の頭へ（#523） */
      if (sv.seekAfterLoad) {
        const keep = sv.seekAfterLoad; sv.seekAfterLoad = null;
        try { ctl.video.currentTime = svKeepTime(keep, d, sv.scenes); } catch (_) {}
        ctl.paint();
      }
      svSyncScene(true);
      /* 単位の呼び名が決まるのはここなので、それを使う一覧はここで描き直す（#523） */
      svBuildPrev();
      if (tap && tap.mode === 'edit') tapPaint();
    }
    svPaintWatch();
    svPaintBar();
    if (!same) svRelayout({ repaint: false });   /* いまのシーンの素材は svSyncScene が描いたばかり */
    sv.booted = true;
  };
  sv.apply = apply;               /* 案を切り替えたときも同じ組み立てをもう一度通す（#523） */
  ctl.onmeta = () => { if (prevMeta) prevMeta(); apply(); };

  /* 台本を手で読み返している間は追従を止める */
  const sbox = q('[data-sv-scriptlist]');
  const hold = () => { sv.scriptHold = Date.now(); };
  for (const ev of ['wheel', 'pointerdown', 'touchmove', 'keydown']) sbox.addEventListener(ev, hold, { passive: true });
  sbox.addEventListener('scroll', () => { if (!sv.scriptAuto) hold(); }, { passive: true });

  /* 完成動画が親。参照動画は再生・停止・シークに付いていく */
  const v = ctl.video;
  for (const ev of ['play', 'pause', 'seeked', 'timeupdate']) v.addEventListener(ev, svLinkRef);
  v.addEventListener('timeupdate', () => {
    sv.manual = false;
    svSyncScene();
    if (v.paused || v.seeking) return;
    const i = Math.floor(v.currentTime);
    if (!sv.watched[i]) { sv.watched[i] = true; svPaintWatch(); }
  });
  v.addEventListener('seeked', () => { sv.manual = false; svSyncScene(); });
  sv.refvid.addEventListener('loadedmetadata', svLinkRef);
  sv.refvid.addEventListener('canplay', svLinkRef);
  sv.refvid.addEventListener('error', () => { if (sv.refSrc) { sv.refLoadOK = false; svPaintRefFace(); } });
  /* 参照動画の上を押しても2本いっしょに再生／一時停止 */
  sv.refvid.parentNode.addEventListener('click', () => { if (sv.refSrc) ctl.toggle(); });

  /* スマホの指摘のタブを手で読み返している間は、いまのシーンへ勝手に戻さない（台本と同じ） */
  const nhold = () => { if (sv) sv.notesHold = Date.now(); };
  for (const pane of [q('.decide [data-tapbox]'), q('.sv-sec.sc')]) {
    if (!pane) continue;
    for (const ev of ['wheel', 'touchmove']) pane.addEventListener(ev, nhold, { passive: true });
  }
  /* 動画の枠の大きさが変わったら（タブの開閉・入力欄・キーボード）、書いている指摘の印を
     置き直す。印は枠に対する割合で置くので、枠の縦横比が変わるとずれる。スマホだけ（#552） */
  if (window.ResizeObserver) new ResizeObserver(() => {
    if (!tapMobile() || !tap || !tap.ctl) return;
    if (tap.draft && tap.draft.x != null) tap.ctl.showPin(tap.draft.x, tap.draft.y);
    else if (!tap.draft) tap.ctl.hidePin();
  }).observe(vbox);

  /* 押す先はすべてこの器の中なので、引き当ては1か所にまとめる */
  root.addEventListener('click', e => {
    /* スマホの「…」の中身は、外を押したら閉じる */
    const menu = q('[data-sv-mmenu]');
    if (menu && !menu.hidden && !e.target.closest('[data-sv-mmenu],[data-svact="more"]')) {
      menu.hidden = true;
      q('[data-svact="more"]')?.setAttribute('aria-expanded', 'false');
    }
    const b = e.target.closest('[data-svact]');
    if (!b || !sv) return;
    const a = b.dataset.svact, stage = q('[data-sv-stage]');
    /* ── スマホの1画面だけのボタン（#552）── */
    if (a === 'mtab') { svSetTab(root.dataset.mtab === b.dataset.mtab ? '' : b.dataset.mtab); return; }
    if (a === 'more') {
      if (menu) { menu.hidden = !menu.hidden; b.setAttribute('aria-expanded', String(!menu.hidden)); }
      return;
    }
    if (a === 'kill') {
      /* 「没にする」は今までの没のボタンをそのまま押す（理由の欄 → 確定の2段階は変えない） */
      if (menu) menu.hidden = true;
      q('[data-svact="more"]')?.setAttribute('aria-expanded', 'false');
      q('.dbar [data-act="reject-open"]')?.click();
      return;
    }
    /* 「＋ 指摘」→ 段1「場所を選ぶ」（動画を止める）。もう一度押すと降りる（#552 の続き） */
    if (a === 'bubble') {
      if (!tap || tap.mode !== 'edit') return;
      if (tap.draft) tapCloseSheet(); else if (tap.picking) tapPickOff(); else tapPickOn();
      return;
    }
    /* 段1の「場所なしで書く」＝いまの画面への指摘として段2へ ／「やめる」 */
    if (a === 'pick-whole') { if (tap && tap.mode === 'edit') tapStart('whole', null); return; }
    if (a === 'pick-cancel') { tapPickOff(); return; }
    if (a === 'view-final' || a === 'view-ref') {
      const wantRef = a === 'view-ref';
      svStopBoth();
      stage.dataset.view = wantRef ? 'ref' : 'final';
      q('[data-svact="view-final"]').setAttribute('aria-pressed', String(!wantRef));
      q('[data-sv-segref]').setAttribute('aria-pressed', String(wantRef));
    } else if (a === 'cmp') {
      const on = stage.dataset.cmp !== 'on';
      svStopBoth();
      stage.dataset.cmp = on ? 'on' : 'off';
      b.setAttribute('aria-pressed', String(on));
    } else if (a === 'tab-mat' || a === 'tab-script') {
      const mat = a === 'tab-mat';
      stage.dataset.mat = mat ? 'mat' : 'script';
      q('[data-svact="tab-mat"]').setAttribute('aria-pressed', String(mat));
      q('[data-svact="tab-script"]').setAttribute('aria-pressed', String(!mat));
      if (!mat) svPaintScript();
    }
    else if (a === 'lbox-prev')  { e.stopPropagation(); svStepLbox(-1); }
    else if (a === 'lbox-next')  { e.stopPropagation(); svStepLbox(1); }
    else if (a === 'lbox-close') { e.stopPropagation(); svCloseLbox(); }
    /* 台本の畳みはスマホだけ（広い画面では見出しを押しても何も起きない）。
       ⚠️ details を使わないのは、ブラウザが中身を1枚の箱で包むため——欄の高さが決まっていても
       中の一覧が縮まず、台本が①の下端をはみ出す（2026-09-21 実測） */
    else if (a === 'script-toggle' && window.innerWidth < 900) {
      q('.sv-script').classList.toggle('closed');
    }
  });
  q('[data-sv-lbox]').addEventListener('click', e => { if (e.target === q('[data-sv-lbox]')) svCloseLbox(); });

  if (!node.hidden) node.hidden = true;
  apply();                        /* 台本・素材・前回までの指摘・高さの計算まで、この場で組み上げる（#637） */
  afterVideo(ctl.video, checkForUpdate);   /* 新しい版の確認は動画が読めたあと（#523 → #637） */
}
/* 先に出しておいたタップ入力の欄を、自由記述に戻す（動画を組み立てられなかったとき・#637） */
function svTapOff(root){
  const box = root && root.querySelector('.decide [data-wbox]');
  if (!box || !box.classList.contains('tapon')) return;
  tap = null;
  box.querySelectorAll('[data-freefix]').forEach(n => { n.hidden = false; });
  box.classList.remove('tapon');
  const p = box.querySelector('[data-tapbox]');
  if (p) p.hidden = true;
}

/* ── いま決めること（オーナー決定 2026-09-06 → 並びは 2026-09-20 に見本へ・#509 段1）──────
   右列の先頭に置く枠。中身は**ゲート名＋版**／**この版で変えたこと**／メモ／
   **修正を依頼するときの入力欄（自由記述）**。「承認をお願いします」「決めてほしいこと」
   「そのほか」といった定型文と、動画の番号・素材の置き場は画面に出さない。
   3つのボタン（没にする・修正を依頼・承認）は下端の固定バー（.dbar）に1列で並べる。
   誤タップ防止（#205）:
     ・没は2段階（バーのボタンで理由の欄が開き、理由が空のあいだ確定ボタンを押せない）
     ・修正の依頼は「入力欄に書いてから押す」（空のまま押しても送らず、入力欄に案内を出す）
     ・承認は1タップだが、押したあと数秒は「取り消す」で無かったことにできる（2026-08-20）
   ⚠️ この4つ（.abox / .wbox / .rjbox / .dbar）は必ず同じ .decide の直下に置く——
   バーのボタンは自分の外にある囲みを .decide 経由で引き当てる（actBox / writeGroup）。 */
/* ── 下端のボタンの言葉（#523）──────────────────────────────────────
   **呼ぶ受け口は本編とまったく同じ**。言葉も本編と同じにそろえた（オーナー決定 2026-09-29
   「承認、とかの同じ文言にしてほしい」。#523 で検証用だけ「この方向でOK／指摘を送る／この案はやめる」に
   替えていたのをやめた）。検証用の動画で変わるのは、進む先の注意書きを出さないことだけ。 */
const isPilotItem = it => !!(it && isPilotSeq(it.seq));
const ACT_WORDS = {
  normal: { approve: g => `${g}を承認`, approved:'承認済み', comment:'修正を依頼',
            commentN: n => `修正を依頼（${n}件）`, reject:'没にする' }
};
ACT_WORDS.pilot = ACT_WORDS.normal;
const actWords = it => isPilotItem(it) ? ACT_WORDS.pilot : ACT_WORDS.normal;

/* tapOn＝タップ入力の欄を最初から出しておく（素材つきの承認画面・#637。動画を組み立てたときに自由記述から
   差し替わって見えないように。動画を組み立てられなければ svTapOff が自由記述へ戻す） */
function decideHTML(it, gate, changes, barFacts, plain, tapOn){
  const key = it.id + '|' + gate;
  const ff = tapOn ? ' hidden' : '';
  const gname = gateName(gate, it);
  const w = actWords(it), pilot = isPilotItem(it);
  /* 検証用の動画は先の工程が決まっていないので、進む先の注意書きは出さない（#523） */
  const caution = pilot ? null : (GATE_CAUTION[gate] || null);
  const pid = `ap-${it.id}-${gate}`;
  const rid = `rj-${it.id}-${gate}`;
  const sub = latestSub(threadOf(it.id));
  const ver = subRevLabel(sub);
  /* plain＝内部の言葉を画面に出さない画面（シーン素材つきの承認画面）。申し送りは残すが、
     中に混ざる内部の識別子（resolution-v1 のような括弧書き）は落とす */
  const measure = (sub ? measureNote(sub.body) : []).map(s => plain ? plainWords(s) : s).filter(Boolean);
  return `<div class="decide">
    <div class="abox" data-abox="${esc(key)}">
      <div class="dcg">${esc(gname)}${ver ? ' ' + esc(ver) : ''}</div>
      ${changes.length ? `<div class="dcchg"><span class="k">変更</span>${
        changes.length === 1 ? esc(changes[0])
          : `<ul>${changes.map(c => `<li>${esc(c)}</li>`).join('')}</ul>`}</div>` : ''}
      ${measure.length ? `<div class="acaution">⚠ 基準に届かないまま出しています：${
        esc(measure.join('／'))}</div>` : ''}
      ${caution ? `<div class="acaution">⚠ ${esc(caution)}</div>` : ''}
      <details class="afold"><summary class="dsum">承認にメモを付ける（任意）</summary>
        <textarea class="ata" id="${pid}-note" rows="2" aria-label="承認メモ（任意）"
          placeholder="残したいメモがあれば入力（空欄のままで構いません）"></textarea></details>
      <div class="wmsg" data-slot="approve" hidden></div>
    </div>
    <div class="wbox fixbox${tapOn ? ' tapon' : ''}" data-wbox="${esc(key)}">
      <h4 class="wh" data-freefix${ff}>${pilot ? '気になった点を送るとき' : '修正を依頼するとき'}</h4>
      <textarea class="wta" data-freefix${ff} rows="3" aria-label="直してほしい点"
        placeholder="直してほしい点を入力（Ctrl + Enter で送信）"></textarea>
      ${plain ? '<div class="svrefnote" data-sv-refnote hidden>参照画像は ①② の番号で書けます</div>' : ''}
      ${tapPanelHTML(it, tapOn)}
      <div class="wmsg" data-slot="comment" hidden></div>
      <div class="wact" data-freefix${ff}>
        <span class="whint">${pilot
          ? `書いてから下の「${esc(w.comment)}」を押すと、記録に残ります（制作は自動では動きません）`
          : '書いてから下の「修正を依頼」を押すと、AI が直して新しい版で出し直します'}</span>
      </div></div>
    <div class="rjbox" data-rjbox="${esc(key)}">
      <div class="rjpanel" id="${rid}" hidden>
        <div class="rjwarn">${pilot
          ? `⚠ この案を<b>やめる</b>と記録します。直せば使えそうなら、上の入力欄に書いて「${esc(w.comment)}」で伝えてください。取り消しはダッシュボードからはできません。`
          : '⚠ この動画の制作を止めて<b>ネタごと没</b>にします。表現を直したいだけなら、上の入力欄に書いて「修正を依頼」で伝えてください。没の取り消しはダッシュボードからはできません。'}</div>
        <label class="alb" for="${rid}-reason">${pilot ? 'やめる理由（必須）' : '没にする理由（必須）'}</label>
        <textarea class="rta" id="${rid}-reason" rows="2" aria-label="${pilot ? 'やめる理由（必須）' : '没にする理由（必須）'}"
          placeholder="${pilot ? '例: この作り方では形が崩れる／別の案のほうが良い' : '例: 検証できないネタだった／類似動画が伸びていない'}"></textarea>
        <div class="anote">理由は記録され、${pilot ? '次に同じ作り方を試すときに参照されます。' : '同じネタが再び提案されたときに参照されます。'}</div>
        <div class="wmsg" data-slot="reject" hidden></div>
        <div class="aact">
          <button class="btn" data-act="reject-cancel">キャンセル</button>
          <button class="btn danger" data-act="reject-confirm" data-key="${esc(key)}" disabled>${
            pilot ? 'この理由でやめる' : 'この理由で没にする'}</button>
        </div>
      </div></div>
    <div class="dbar" data-dbar="${esc(key)}">
      ${barFacts || ''}
      ${plain ? `<button class="btn sv-mmore sv-m-only" type="button" data-svact="more" aria-haspopup="true"
        aria-expanded="false" aria-label="そのほかの操作">…</button>
      <div class="sv-mmenu sv-m-only" data-sv-mmenu hidden>
        <button type="button" data-svact="kill">${esc(w.reject)}</button></div>
      <button class="btn sv-mcmt sv-m-only" type="button" data-svact="bubble">＋ 指摘</button>` : ''}
      <button class="btn kill" data-act="reject-open" data-key="${esc(key)}"
        aria-expanded="false" aria-controls="${rid}">${esc(w.reject)}</button>
      <button class="btn soft" data-act="comment" data-key="${esc(key)}">${esc(w.comment)}</button>
      <button class="btn primary" data-act="approve-quick" data-key="${esc(key)}"
        data-label="${esc(w.approve(gname))}" data-donelabel="${esc(w.approved)}">${esc(w.approve(gname))}</button>
    </div></div>`;
}

/* 画面に出す文から**内部の言葉**を落とす（#519 のシーン素材つきの承認画面だけで使う）。
   言い換えの対応表は持たないので、**内部の識別子や英語の判定語が混ざった括弧書きは丸ごと外す**
   （`（final-validate）` `（should / pass の判定は mid_decay_pct）` など）。英字が3文字以上
   続く中身を「内部の言葉」とみなす。数字と単位だけの括弧書き（`（目安 1.8）`）は残す。
   地の文に裸で混ざった `resolution-v1` の形も外す。 */
function plainWords(s){
  return String(s == null ? '' : s)
    .replace(/[（(][^（()）]*[A-Za-z]{3,}[^（()）]*[）)]/g, '')
    .replace(/(^|[\s、。・])[A-Za-z][A-Za-z0-9._-]*-v\d+(?=$|[\s、。・])/g, '$1')
    .replace(/\s{2,}/g, ' ')
    .replace(/\s*([、。])\s*/g, '$1')
    .trim();
}

/* ── ネタの仕分けパネル（#314）──────────────────────────────────────
   台本の型カタログ（3型）に乗らずAIが起草を見送った案に対して、オーナーが
   「切り口を変える／このまま作る／没」を返す。前2つは triage_idea() RPC、
   没は既存の没パネル（reject_video・M023）をそのまま使い回す＝没の作法を
   1か所に集めておく（ゲートは台本より前の判断なので 'script' 固定）。
   囲みは wbox / rjbox の規約に乗せる（wboxBusy / wboxMsg がこの2つを探すため）。 */
function triagePanel(it){
  const rid = `rj-${it.id}-script`;
  const key = `${it.id}|script`;
  const why = it.decision_note
    ? `<div class="dsec dsec-note"><h4>AIが起草を見送った理由</h4>
        <div class="hook">${esc(sentenceWrap(it.decision_note))}</div></div>` : '';
  return `${why}
    <div class="wbox" data-wbox="${esc(key)}">
      <h4 class="wh">どうしますか</h4>
      <textarea class="wta" rows="2" aria-label="仕分けのメモ（任意）"
        placeholder="切り口の指示や、このまま作ってよい理由があれば入力（空欄でも構いません）"></textarea>
      <div class="wmsg" data-slot="comment" hidden></div>
      <div class="wact">
        <span class="whint">${it.approved_script_at
          ? 'この回は台本まで作ってあります。「このまま作る」なら台本以降の工程から再開し、「切り口を変える」なら台本から作り直します'
          : 'どちらを選んでもネタ案に戻り、次の夜にAIが拾います'}</span>
        <button class="btn soft" data-act="triage-retype" data-key="${esc(key)}"
          data-label="切り口を変える">切り口を変えて作り直す</button>
        <button class="btn primary" data-act="triage-produce" data-key="${esc(key)}"
          data-label="このまま作る">型を外してこのまま作る</button>
      </div></div>
    <div class="rjbox" data-rjbox="${esc(key)}">
      <button class="btn rjopen" data-act="reject-open" data-key="${esc(key)}"
        aria-expanded="false" aria-controls="${rid}">このネタを没にする</button>
      <div class="rjpanel" id="${rid}" hidden>
        <div class="rjwarn">⚠ このネタを<b>没</b>にします。切り口を変えれば使えそうなら、
          上の「切り口を変えて作り直す」を選んでください。没の取り消しはダッシュボードからはできません。</div>
        <label class="alb" for="${rid}-reason">没にする理由（必須）</label>
        <textarea class="rta" id="${rid}-reason" rows="2" aria-label="没にする理由（必須）"
          placeholder="例: 出典が取れない／どの型にも直しようがない"></textarea>
        <div class="anote">理由は記録され、同じネタが再び提案されたときに参照されます。</div>
        <div class="wmsg" data-slot="reject" hidden></div>
        <div class="aact">
          <button class="btn" data-act="reject-cancel">キャンセル</button>
          <button class="btn danger" data-act="reject-confirm" data-key="${esc(key)}" disabled>この理由で没にする</button>
        </div>
      </div></div>`;
}

/* 仕分けの「切り口を変える」「このまま作る」を送る。どちらも案に戻す（#314）。
   メモは任意（没だけ理由必須で、そちらは submitReject が担う） */
async function submitTriage(box, key, action){
  const vid = Number(String(key).split('|')[0]);
  const ta  = box.querySelector('.wta');
  const note = ((ta && ta.value) || '').trim();
  const act = action === 'retype' ? 'triage-retype' : 'triage-produce';

  wboxMsg(box, '', false, 'comment');
  wboxBusy(box, true, act);
  const { data, error } = await sb.rpc('triage_idea',
    { p_video_id: vid, p_action: action, p_note: note || null });
  if (error) { wboxBusy(box, false, act); wboxMsg(box, rpcErrText(error, 'triage'), true, 'comment'); return; }
  if (ta) ta.value = '';
  const skipped = !!(data && data.skipped), resumed = !!(data && data.resumed);
  await refreshAfterWrite(true);
  toast(skipped ? 'この動画はすでに仕分け済みです'
      : action === 'retype' ? '切り口を変えて作り直すよう記録しました'
      : resumed             ? '型を外して作ります。台本以降の工程から再開します'
                            : '型を外して作ってよいと記録しました');
}

/* RPC の例外はそのまま出さず、SQLSTATE から日本語の案内に置き換える */
/* 自由記述の修正依頼が版のずれで断られたとき（P0003）の言葉（#604 検収）。この経路は画面を自動では
   描き直さず、書いた文を欄に残す——rpcErrText の「この画面は自動で新しくなります」は言わず、
   文を写してから読み込み直すよう案内する（読み込み直すと欄は空になる） */
function staleCommentText(error){
  const raw = String((error && error.message) || '');
  const cur = raw.match(/いまの版は第(\d+)版/);
  const why = cur ? `いま第${cur[1]}版を作り直しています`
    : /より新しい版/.test(raw) ? '見ていたものより新しい版が出ています'
    : 'どの版への指摘かを確かめられませんでした';
  return `${why}。送れなかった文はこの欄に残してあります。文を写してから画面を読み込み直してください（読み込み直すと欄は空になります）`;
}
function rpcErrText(error, act){
  const code = error && error.code;
  const raw  = String((error && error.message) || '');
  if (code === '42501' || /permission denied/i.test(raw))
    return 'このアカウントには書き込み権限がありません（ダッシュボードの許可リストを確認してください）';
  if (code === 'P0002' || /video not found/i.test(raw))
    return '対象の動画が見つかりませんでした。再読み込みしてからやり直してください';
  /* 承認が断られる理由は3つあり、次にすることが違うので文言を分ける。
     3つとも同じ P0003 で返る（画面がその場で取り直す仕掛けを共有するため）ので、
     見分けは DB が付けてくる日本語の本文で行う（074）。
     ①作り直しの最中だった: 待つしかない ②見ていた版より新しい提出が来た: 新しい方を見て押し直す
     ③どの版に付けるか分からなかった: 読み込み直せば直る */
  if (code === 'P0003' || /stale review/i.test(raw)) {
    /* 文言は「次にすること」で分ける。承認だけでなく修正の依頼もこの経路を通る（#509 段4） */
    const apv = act === 'approve';
    const cur = raw.match(/いまの版は第(\d+)版/);
    if (cur) return `いま第${cur[1]}版を作り直しています。出来上がるまでお待ちください（この画面は自動で新しくなります）`;
    if (/より新しい版/.test(raw))
      return `見ていたものより新しい版が出来ています。新しい方を見てから${
        apv ? '承認' : 'もう一度指摘'}してください（この画面は自動で新しくなります）`;
    return `どの版${apv ? 'に承認するか' : 'への指摘か'}を確かめられませんでした。画面を新しくしてからもう一度お試しください`;
  }
  if (code === '22001' || /too long/i.test(raw))
    return '本文が長すぎます（4000文字以内で入力してください）';
  /* 予約済み・投稿済みの動画は没にできない（reject_video の 55000・M023） */
  if (code === '55000' || /already scheduled or published/i.test(raw))
    return '予約済み・投稿済みの動画は没にできません（先に予約の取り消し／公開の取り下げをしてください）';
  if (code === '22023')
    return /reason is empty/i.test(raw)  ? '没にする理由を入力してください'
         : /body is empty/i.test(raw)    ? 'コメントを入力してください'
         /* 指摘の形が受け口の決まりに合わなかった（件数・文字数の上限、欠けた項目など） */
         : /invalid notes/i.test(raw)    ? '指摘の中身を受け付けてもらえませんでした。件数や文字数を減らすか、画面を新しくしてやり直してください'
         /* triage_idea の action 不正（#314）。ボタン以外から呼ばれたときだけ出る */
         : /invalid action/i.test(raw)   ? '操作の指定が不正です。画面を再読み込みしてやり直してください'
                                         : '対象の承認ポイントが不正です。画面を再読み込みしてやり直してください';
  if (/JWT|token is expired|invalid claim/i.test(raw))
    return 'ログインの有効期限が切れました。再度ログインしてください';
  if (/fetch|network|Failed to send/i.test(raw))
    return '通信に失敗しました。接続を確認して再度お試しください';
  return act === 'approve' ? '承認できませんでした。時間をおいて再度お試しください'
       : act === 'reject'    ? '没にできませんでした。時間をおいて再度お試しください'
       : act === 'triage'    ? '仕分けを記録できませんでした。時間をおいて再度お試しください'
                             : 'コメントを送信できませんでした。時間をおいて再度お試しください';
}

/* コメント欄（.wbox）・承認欄（.abox）・没欄（.rjbox）・下端の固定バー（.dbar）は
   別ブロックだが、二重送信ガードはまとめてかける（どれか送信中は全部の操作を止める）。
   詳細の決める枠は .decide が器、ネタの仕分け（#314）は器を持たないので親要素で束ねる */
const decideGroup = box => box.closest('.decide') || box.parentElement;
function writeGroup(box){
  const p = decideGroup(box);
  const found = p ? [...p.querySelectorAll('[data-wbox],[data-abox],[data-rjbox],[data-dbar]')] : [];
  return found.length ? found : [box];
}
/* 下端のバーのボタンは囲みの外にあるので、同じ決める枠の中から相手の囲みを引く（#509 段1）。
   囲みの中のボタン（キャンセル・確定）は従来どおり自分の囲みを返す */
function actBox(btn, act){
  const inBox = btn.closest('[data-wbox],[data-abox],[data-rjbox]');
  if (inBox) return inBox;
  const g = btn.closest('.decide');
  if (!g) return null;
  return g.querySelector(
    /^reject-/.test(act) ? '[data-rjbox]' : (act === 'comment') ? '[data-wbox]' : '[data-abox]');
}
function wboxBusy(box, busy, label){
  const boxes = writeGroup(box);
  boxes.forEach(b => {
    b.dataset.busy = busy ? '1' : '0';
    b.querySelectorAll('button').forEach(btn => { btn.disabled = busy; });
    b.querySelectorAll('.wta,.ata,.rta,.memo,.noteinput').forEach(ta => { ta.disabled = busy; });
  });
  const btn = label && boxes.map(b => b.querySelector(`[data-act="${label}"]`)).find(Boolean);
  if (btn) {
    if (busy) { btn.dataset.lbl = btn.textContent; btn.textContent = '送信中…'; }
    else if (btn.dataset.lbl) { btn.textContent = btn.dataset.lbl; delete btn.dataset.lbl; }
  }
  /* 没の確定は理由が入っているときだけ押せる（busy 解除で不用意に有効化しない） */
  if (!busy) boxes.forEach(syncRejectReady);
}
/* 没の確定ボタンの活性を理由の入力状態に同期する */
function syncRejectReady(box){
  const btn = box.querySelector('[data-act="reject-confirm"]');
  const ta  = box.querySelector('.rta');
  if (btn && ta) btn.disabled = !ta.value.trim();
}
function wboxMsg(box, text, isErr, slot){
  const key = slot || 'comment';
  const boxes = writeGroup(box);
  boxes.forEach(b => b.querySelectorAll('.wmsg').forEach(m => {
    if (m.dataset.slot !== key) { m.textContent = ''; m.hidden = true; }
  }));
  const m = boxes.map(b => b.querySelector(`.wmsg[data-slot="${key}"]`)).find(Boolean);
  if (!m) return;
  m.className = 'wmsg' + (isErr ? ' err' : '');
  m.textContent = text || '';
  m.hidden = !text;
}

/* 没の2段階目を開く／閉じる。1段目のボタンが囲みの中（ネタの仕分け）なら開いている間は隠して
   押し先を1つに絞る。下端の固定バーにあるとき（レビュー画面）は隠さず、もう一度押すと閉じる */
const rejectOpenBtn = box => (decideGroup(box) || box).querySelector('[data-act="reject-open"]');
function toggleRejectPanel(box){
  const panel = box.querySelector('.rjpanel');
  if (panel && !panel.hidden) closeRejectPanel(box); else openRejectPanel(box);
}
function openRejectPanel(box){
  if (box.dataset.busy === '1') return;
  const panel = box.querySelector('.rjpanel'), btn = rejectOpenBtn(box);
  if (!panel) return;
  wboxMsg(box, '', false, 'reject');
  panel.hidden = false;
  if (btn) { if (box.contains(btn)) btn.hidden = true; btn.setAttribute('aria-expanded', 'true'); }
  syncRejectReady(box);
  panel.scrollIntoView({ block: 'nearest' });
  panel.querySelector('.rta')?.focus();
}
function closeRejectPanel(box){
  if (box.dataset.busy === '1') return;
  const panel = box.querySelector('.rjpanel'), btn = rejectOpenBtn(box);
  if (panel) {
    panel.hidden = true;
    const ta = panel.querySelector('.rta'); if (ta) ta.value = '';
  }
  wboxMsg(box, '', false, 'reject');
  syncRejectReady(box);
  if (btn) { btn.hidden = false; btn.setAttribute('aria-expanded', 'false'); btn.focus(); }
}

/* 書き込み後は取り直して描き直す。一覧の状態バッジ・並び順・指摘件数は
   v_dashboard_list（M027）が review_events から作っているので、コメント1件でも
   一覧が変わりうる＝動画側のキャッシュはまとめて捨てる（#215 Phase 2）。 */
async function refreshAfterWrite(approved){
  clearVideoCaches();
  store.assets = {};
  if (approved) store.analytics = {};
  const keep = state.detail;
  await render();
  if (keep) await openDetail(keep);     /* 開けなければ openDetail が閉じる */
}

/* コメント（RPC は従来どおり request_changes。指摘は resolution_status='open' で記録される） */
async function submitComment(box, key){
  if (box.dataset.busy === '1') return;
  const [vid, gate] = key.split('|');
  const ta = box.querySelector('.wta');
  const body = ((ta && ta.value) || '').trim();
  /* 空のまま「修正を依頼」を押しても送らない（下端のバーの誤タップよけ）。
     入力欄は画面の上の方にあることがあるので、案内と一緒にそこまで送る */
  if (!body) {
    wboxMsg(box, '直してほしい点を入力してください', true, 'comment');
    if (ta) { ta.scrollIntoView({ block: 'center' }); ta.focus(); }
    return;
  }
  wboxMsg(box, '', false, 'comment');
  wboxBusy(box, true, 'comment');
  /* 見ていた提出物の版（画面を開いた時点の値）を添える。裏で新しい版が提出されていたら DB が P0003 で
     断る——渡さないと照合されず、見ていない新しい版に修正依頼が付いた（#604 E9。タップ入力の
     送信 submitTapChanges と承認 approveNow は前から渡している） */
  let error = null;
  try {
    ({ error } = await sb.rpc('request_changes',
      { p_video_id: Number(vid), p_gate: gate, p_body: body,
        p_expected_revision: submittedRevOf(vid, gate) }));
  } catch (e) {
    error = { code: null, message: String((e && e.message) || e) };
  }
  if (error) {
    wboxBusy(box, false, 'comment');
    /* **どんな失敗でも、入力欄と書いた文はそのまま残す**（#604 検収）。古い版だと断られたときも
       自動では描き直さない——描き直しが通信で落ちると入力欄ごと消え、新しい版で入力の方式が
       タップ入力に変わると、戻した文は隠れた欄に入って送り直せなかった。案内だけ出す */
    wboxMsg(box, error.code === 'P0003' ? staleCommentText(error) : rpcErrText(error, 'comment'), true, 'comment');
    return;
  }
  ta.value = '';
  const pilot = isPilotItem(store.byId.get(Number(vid)));
  await refreshAfterWrite(false);
  toast(pilot ? '指摘を送りました' : '修正を依頼しました');
}

/* 承認の2段階目（確定）。パネルが開いていないときは絶対に実行しない＝1タップでは通らない */
/* ── 1クリック承認（オーナー要望 2026-08-20）─────────────────────────────
   一覧の行からも詳細のボタンからも、押した1回で承認まで通す。押した瞬間は DB へ
   書かず、数秒の猶予をおいてから書く（その間は「取り消す」で無かったことにできる）。
   詳細でメモを開いて書いてあれば、その内容を添えて承認する。 */
/* 動画の id から行を引く（承認ポイントの呼び名を決めるため・#569）。一覧の索引に無ければ開いている動画 */
const itemOfVid = vid => store.byId.get(Number(vid))
  || (curItem && curItem.id === Number(vid) ? curItem : null);
async function approveNow(vid, gate, note, rev){
  const gname = gateName(gate, itemOfVid(vid));
  const pilot = isPilotItem(store.byId.get(Number(vid)));
  /* 見ていた提出物の版（押した時点の値）を添える。裏で新しい版が提出されていたら DB が P0003 で断る（073・#502） */
  const { data, error } = await sb.rpc('approve_gate',
    { p_video_id: Number(vid), p_gate: gate, p_note: note || null,
      p_expected_revision: rev });
  outboxDrop(vid, gate);                          /* 返事が来たので控えは要らない（通っても断られても） */
  if (error) {
    markApproved(vid, gate, false);              /* ボタンを押せる状態に戻す */
    toast(rpcErrText(error, 'approve'));
    /* 古い版を見ていた: **その場で取り直して描き直す**（#506 高1）。版の記憶だけ捨てて画面を
       そのままにすると、もう一度押したとき版が空で送られ、DB の照合を素通りして
       見ていない新しい版に承認が付く */
    if (error.code === 'P0003') await refreshAfterWrite(false);
    return;
  }
  /* ⚠️ ここで画面を作り直さない（オーナー指定 2026-08-20）。一覧を描き直すと
     スクロールが先頭へ戻ってしまい、続けて承認するときに毎回探し直しになるため。
     代わりに「押した行のボタンだけ」を承認済みに変え、手元の記憶（キャッシュ）を捨てて
     次にこの画面を描き直すとき（タブ切替・再読み込み・⟳）に新しい状態で出るようにする。 */
  store.core = {}; store.facets = {}; store.byId = new Map();
  store.assets = {}; store.analytics = {};
  delete store.threads[Number(vid)];
  /* 承認待ちバッジだけは今すぐ正しくする（この1件を減らす。一覧は触らない）。
     ⚠️ **記録されなかった承認では減らさない**（#572）。同じ版に人の承認が既にあると、受け口は何も
     記録せず already_approved を返す。そのあと同じ版で出し直された動画は、一覧のビューでは
     承認待ちのまま残る——手元だけ減らすと DB と食い違い、タブの数字が消えた（KR0001・KR0002 で
     「身近なからくり」の数字が消えた・2026-09-30 09:02）。どちらの場合も、最後に全番組の件数を
     DB から取り直してタブを描き直す（一覧は触らない＝スクロールは戻らない） */
  const p = store.pending[state.ch];
  if (!(data && data.already_approved) && p && Array.isArray(p.rv)) {
    p.rv = p.rv.filter(r => !(r.item && r.item.id === Number(vid) && r.gate === gate));
  }
  markApproved(vid, gate, true);
  renderShell();
  loadPendingAll(true);
  const revTxt = data && data.target_revision ? `第${data.target_revision}版の` : '';
  toast((data && data.already_approved) ? `${revTxt}${gname}は既に承認済みです` : `${revTxt}${gname}を承認しました`);
}
/* 承認した動画のボタンを、画面を作り直さずにその場で書き換える（表の行・スマホのカード・詳細） */
function markApproved(vid, gate, done){
  document.querySelectorAll(`[data-act="approve-quick"][data-key="${vid}|${gate}"]`).forEach(b => {
    b.disabled = done;
    b.textContent = done ? (b.dataset.donelabel || '承認済み') : (b.dataset.label || '承認');
  });
}
function quickApprove(key, btn){
  const [vidS, gate] = String(key).split('|');
  const gname = gateName(gate, itemOfVid(vidS));
  const w = actWords(store.byId.get(Number(vidS)));
  /* 指摘を書いたまま承認を押したら1回だけ聞く。押し間違いなら戻れるし、
     わざと「送らずに承認」したい回もあるので止めはしない（#509 段4） */
  /* スマホの1画面（#552）は下の帯から1タップで届くので、**毎回1回だけ**確かめる。
     指摘が残っていればその件数、承認の注意書きがあればそれも同じ確認に書く */
  if (btn && btn.closest('.sview') && tapMobile()) {
    const n = tapActive(key) ? tap.items.length : 0;
    const cau = [...document.querySelectorAll('#view-detail .acaution')]
      .map(c => c.textContent.trim()).filter(Boolean).join('\n');
    const msg = (n ? `指摘が ${n} 件残っています。送らずに「${w.approve(gname)}」にしますか`
                   : `「${w.approve(gname)}」にしますか`) + (cau ? '\n\n' + cau : '');
    if (!window.confirm(msg)) return;
  }
  else if (tapActive(key) && tap.items.length
      && !window.confirm(`指摘が ${tap.items.length} 件残っています。送らずに「${w.approve(gname)}」にしますか`)) return;
  /* 詳細のメモ欄（同じ動画・同じゲートのもの）に書いてあれば添える。
     承認ボタンは下端の固定バー＝承認欄の外にあるので、決める枠（.decide）ごしに引く */
  const box = btn && (btn.closest('[data-abox]')
    || (btn.closest('.decide') || document).querySelector('[data-abox]'));
  const ta = box && box.querySelector('.ata');
  const note = ((ta && ta.value) || '').trim();
  if (btn) { btn.disabled = true; btn.textContent = w.approved; }
  const rev = submittedRevOf(vidS, gate);
  const oit = store.byId.get(Number(vidS)) || curItem || {};
  outboxPut({ vid: Number(vidS), gate, note, rev, uid: state.user && state.user.id,
              seq: oit.seq || null, ch: oit.channel || null, at: Date.now() });
  approveNow(vidS, gate, note, rev);
}

/* 没の2段階目（確定）。パネルが開いていて理由が入っているときだけ実行する。
   videos.status が変わるので core も含めて取り直す（refreshAfterWrite(true)）。 */
async function submitReject(box, key){
  if (box.dataset.busy === '1') return;
  const panel = box.querySelector('.rjpanel');
  if (!panel || panel.hidden) return;
  const [vidS, gate] = key.split('|');
  const vid = Number(vidS);
  const pilot = isPilotItem(store.byId.get(vid));
  const ta = panel.querySelector('.rta');
  const reason = ((ta && ta.value) || '').trim();
  if (!reason) { wboxMsg(box, pilot ? 'やめる理由を入力してください' : '没にする理由を入力してください', true, 'reject'); if (ta) ta.focus(); return; }

  wboxMsg(box, '', false, 'reject');
  wboxBusy(box, true, 'reject-confirm');
  const { data, error } = await sb.rpc('reject_video',
    { p_video_id: vid, p_gate: gate, p_reason: reason });
  if (error) { wboxBusy(box, false, 'reject-confirm'); wboxMsg(box, rpcErrText(error, 'reject'), true, 'reject'); return; }
  if (ta) ta.value = '';
  const already = !!(data && data.already_dropped);
  await refreshAfterWrite(true);
  toast(already ? 'この動画はすでに没になっています' : '没にしました');
}

/* ── コメント本文の1行要約（#266 / 2026-09-06）─────────────────────────
   AI の記録は1件1行に畳むので、Markdown の記法（見出し・箇条書き・太字）を落として
   地の文にしてから切り詰める。人の指摘は畳まず全文をそのまま出す。 */
function cmtPreview(src, n){
  const t = String(src || '').replace(/\r\n?/g, '\n')
    .replace(/^\s*#{1,6}\s+/gm, '')                   /* 見出しの # */
    .replace(/^\s*([-*_]\s*){3,}\s*$/gm, '')          /* 水平線 */
    .replace(/^\s*(?:[-*]\s+|・\s*|\d+[.)]\s+)/gm, '')/* 箇条書き・番号 */
    .replace(/\*\*([^*]+)\*\*/g, '$1')                /* 太字 */
    .replace(/\s+/g, ' ').trim();
  return t.length > n ? t.slice(0, n) + '…' : t;
}

/* ── AI の記録の1行要約（オーナー要望 2026-09-02）────────────────────────────
   AI の指摘は JSON で保存されている。**そのまま画面に出さない**——出どころ・直す内容の
   先頭1件・件数・対応結果だけを1行にたたむ。読めない JSON はその旨だけ出す。 */
const AI_UNREADABLE = '（内容を読めない記録）';
/* JSON なら中身・JSON でなければ null・壊れていれば false */
function aiJSON(body){
  const s = String(body || '').trim();
  if (!s.startsWith('{')) return null;
  try { const o = JSON.parse(s); return (o && typeof o === 'object') ? o : false; }
  catch (_) { return false; }
}
/* 1行に収める（スマホ幅で2行を超えると畳んだ意味が無くなる） */
const clip = (s, n) => { const t = String(s || '').replace(/\s+/g, ' ').trim(); return t.length > n ? t.slice(0, n) + '…' : t; };
function aiChangesLine(e){
  const o = aiJSON(e.body);
  if (o === false) return AI_UNREADABLE;
  const role = aiRoleOf(e.author);
  const head = (o && o.source === 'final-validate') || role === '機械測定'
    ? '機械測定' : (role ? `AI審査（${role}）` : 'AI審査');
  let what = '';
  if (o) {
    const items = Array.isArray(o.items) ? o.items : [];
    const first = items.length ? clip(items[0].fix || items[0].note, 60) : '';
    what = first || clip(o.summary, 60);
    if (first && items.length > 1) what += `ほか${items.length - 1}件`;
  } else {
    what = cmtPreview(e.body, 60);
  }
  const note = clip(e.resolution_note, 40);
  const done = e.resolution_status && e.resolution_status !== 'open' && note ? ` → ${note}` : '';
  return `${head}: ${what || '指摘あり'}${done}`;
}
/* 提出コメントの1行目に入っている版（「完成 v02｜承認をお願いします」） */
const subVer = body => {
  const m = /\bv(\d{1,3})\b/i.exec(String(body || '').split('\n')[0] || '');
  return m ? 'v' + m[1] : '';
};
function aiSummaryLine(e, it){
  const g = e.gate ? gateName(e.gate, it) : '—';
  if (e.kind === 'request_changes') return aiChangesLine(e);
  if (e.kind === 'approve')  { const r = aiRoleOf(e.author); return `承認印（${g}${r ? '・' + r : ''}）`; }
  if (e.kind === 'request_review') {
    const v = e.revision != null ? 'v' + String(e.revision).padStart(2, '0') : subVer(e.body);
    return `提出（${g}${v ? ' ' + v : ''}）`;
  }
  const t = cmtPreview(e.body, 80);
  if (e.kind === 'reject') return `却下（${g}）${t ? '：' + t : ''}`;
  return t || '（本文なし）';
}

/* 提出コメントの「## 前回からの変更」節だけを抜く（見出しから次の見出しの手前まで）。
   何が変わった版なのかは畳みの外に出す＝開かなくても読める（オーナー要望 2026-09-02） */
const secRe = name => new RegExp(`(?:^|\\n)[ \\t]*#{1,6}[ \\t]*${name}[ \\t]*\\n([\\s\\S]*?)(?=\\n[ \\t]*#{1,6}[ \\t]|$)`);
const CHG_RE = secRe('前回からの変更');
const MEAS_RE = secRe('基準未満のまま提出したもの');
function bodySection(body, re){
  const m = re.exec(String(body || '').replace(/\r\n?/g, '\n'));
  return m ? m[1].trim() : '';
}
const changeNote = body => bodySection(body, CHG_RE);
/* 機械測定が基準未満のまま出した回だけ本文に載る申し送り（無ければ空）。**黙って出さない**
   ためのものなので、承認の枠の中で注意書きとして先に読ませる（畳みの中に埋めない） */
const measureNote = body => bodySection(body, MEAS_RE).split('\n')
  .map(s => s.replace(/^\s*[-*・]\s*/, '').trim()).filter(Boolean);
/* ── この版で変えたこと（オーナー決定 2026-09-06）──────────────────────────
   承認の画面でオーナーが読むのは「前の版から何が変わったか」だけ。指摘の引用も
   「→ 対応:」の前置きも要らない、と決まった（引用は下の「あなたの指摘」に全文があるため）。

   取り方は2段構え。①現行の提出（最新の request_review）と同じ版で片づいた差し戻しの
   `resolution_note`（「第N版で対応（…）」）から包みを外した中身。人の差し戻しも AI の
   差し戻し（機械測定・審査）も同じ扱いにする。②それが1件も取れないときだけ、提出本文の
   「## 前回からの変更」節から前置きを外した残りを使う（旧い版の本文にも効かせるため）。
   初回の提出（v01）で何も取れなければ、変更の行そのものを出さない。 */
function latestSub(evs){
  let sub = null;
  for (const e of (evs || [])) if (e.kind === 'request_review' && (!sub || evNewer(e, sub))) sub = e;
  return sub;
}
/* 提出の版。記録の revision が正、無ければ本文1行目の「v02」で代用する */
const subRevNum = sub => {
  if (!sub) return null;
  if (sub.revision != null && sub.revision !== '') return Number(sub.revision);
  const v = subVer(sub.body);
  return v ? Number(v.slice(1)) : null;
};

};
/* 「第2版で対応（S10 を作り直し）」→ { rev:2, text:'S10 を作り直し' }。包みが無ければ rev:null */
function rezCore(note){
  const s = String(note || '').replace(/\s+/g, ' ').trim();
  const m = /^第\s*(\d{1,3})\s*版で対応[（(]([\s\S]*)[）)]$/.exec(s);
  return m ? { rev: Number(m[1]), text: m[2].trim() } : { rev: null, text: s };
}
/* ②の受け皿: 提出本文の「## 前回からの変更」から「あなたの指摘: … → 対応: 」を外す */
function chgFromBody(body){
  return changeNote(body).split('\n')
    .map(s => s.replace(/^\s*[-*・]\s*/, '').trim())
    .filter(Boolean)
    .map(s => s.replace(/^[\s\S]*→\s*(?:対応|直した内容)\s*[:：]\s*/, '').trim())
    .filter(Boolean);
}
function changeLines(events){
  const evs = events || [];
  const sub = latestSub(evs);
  if (!sub) return [];
  const rev = subRevNum(sub);
  /* この提出より前の、版がひとつ前までの提出＝作り直しの起点（同じ版の出し直しは跨ぐ） */
  let anchor = null;
  for (const e of evs) {
    if (e.kind !== 'request_review' || !evNewer(sub, e)) continue;
    if (rev != null && !(Number(e.revision) < rev)) continue;
    if (!anchor || evNewer(e, anchor)) anchor = e;
  }
  const picked = [];
  for (const e of evs) {
    if (e.kind !== 'request_changes' || !e.resolved_at) continue;
    const c = rezCore(e.resolution_note);
    const ok = c.rev != null
      ? (rev == null || c.rev === rev)                       /* 「第N版で対応」の N で決める */
      : (rev != null && e.revision != null
          ? Number(e.revision) <= rev - 1                    /* 包みが無ければ版で決める */
          : (evNewer(sub, e) && (!anchor || evNewer(e, anchor))));
    if (ok) picked.push({ e, c });
  }
  picked.sort((a, b) => evNewer(a.e, b.e) ? 1 : -1);
  /* 同じ作り直しで片づいた差し戻しは、人のぶんも AI のぶんも同じ対応の記録を持つ。
     同じ文を何行も並べない（重複は落とす） */
  const lines = [...new Set(picked
    .map(({ e, c }) => c.text || (isAiAuthor(e.author) ? aiChangesLine(e) : ''))
    .filter(Boolean))];
  return lines.length ? lines : chgFromBody(sub.body);
}

/* ── 履歴は2節に分ける（オーナー決定 2026-09-06）──────────────────────────

function niceTicks(min, max, target){

  const raw = (max - min) / Math.max(1, target);
  const p = Math.pow(10, Math.floor(Math.log10(raw)));

  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;

/* 日付の並びの両端だけを dateTicks に渡す（横軸の規則を全グラフで同じにする） */
const spanTicks = (d0, d1, plotW) => {
  const p = partsOf(new Date(d0 * DAY), {year:'numeric', month:'2-digit', day:'2-digit'});
  const t0 = `${p.year}-${p.month}-${p.day}`;
  return dateTicks([{ d:d0, t:t0 }, { d:d1, t:jstAdd(t0, d1 - d0) }], plotW);
};

/* 薄い横グリッド線＋縦軸ラベル＋横軸の目盛り。グラフ本体より必ず後ろに沈める */
function axesSvg(g){
  let s = '';
  g.yTicks.forEach(v => {
    const y = g.Y(v);
    if (y < g.y0 - 0.6 || y > g.y0 + g.plotH + 0.6) return;
    s += `<line x1="${g.x0}" y1="${y.toFixed(1)}" x2="${(g.x0 + g.plotW).toFixed(1)}" y2="${y.toFixed(1)}"
        stroke-width="1" vector-effect="non-scaling-stroke" style="stroke:var(--grid)"/>`
      + `<text x="${g.x0 - 7}" y="${(y + 3.4).toFixed(1)}" text-anchor="end" font-size="9.5"
        font-family="system-ui,sans-serif" style="fill:var(--muted)">${esc(g.yFmt(v))}</text>`;
  });
  const by = g.y0 + g.plotH;
  s += `<line x1="${g.x0}" y1="${by.toFixed(1)}" x2="${(g.x0 + g.plotW).toFixed(1)}" y2="${by.toFixed(1)}"
      stroke-width="1" vector-effect="non-scaling-stroke" style="stroke:var(--axis)"/>`;
  (g.xTicks || []).forEach(t => {
    const x = g.X(t.v), tl = t.lb ? 4 : 2;
    s += `<line x1="${x.toFixed(1)}" y1="${by.toFixed(1)}" x2="${x.toFixed(1)}" y2="${(by + tl).toFixed(1)}"
        stroke-width="1" vector-effect="non-scaling-stroke" style="stroke:var(--axis)"/>`;
    if (!t.lb) return;
    s += g.xRot
      ? `<text transform="translate(${x.toFixed(1)} ${(by + 8).toFixed(1)}) rotate(-45)" text-anchor="end" font-size="9.5"
        font-family="system-ui,sans-serif" style="fill:var(--muted)">${esc(t.lb)}</text>`
      : `<text x="${x.toFixed(1)}" y="${(by + 16).toFixed(1)}" text-anchor="${
          x > g.x0 + g.plotW - 24 ? 'end' : 'middle'}" font-size="11"
        font-family="system-ui,sans-serif" style="fill:var(--muted)">${esc(t.lb)}</text>`;
  });
  return s;
}
/* 縦軸の単位（人・回・%）を軸の頭に小さく置く */
const unitSvg = (x, y, u) => u ? `<text x="${x}" y="${y}" text-anchor="start" font-size="9.5"
  font-family="system-ui,sans-serif" style="fill:var(--muted)">${esc(u)}</text>` : '';

/* 上だけ角丸の棒（下端は必ずゼロ線に着ける） */
function barPath(x, y, w, h, r){
  r = Math.max(0, Math.min(r, w / 2, h));
  return `M${x.toFixed(1)} ${(y + h).toFixed(1)} L${x.toFixed(1)} ${(y + r).toFixed(1)}
    Q${x.toFixed(1)} ${y.toFixed(1)} ${(x + r).toFixed(1)} ${y.toFixed(1)}
    L${(x + w - r).toFixed(1)} ${y.toFixed(1)} Q${(x + w).toFixed(1)} ${y.toFixed(1)} ${(x + w).toFixed(1)} ${(y + r).toFixed(1)}
    L${(x + w).toFixed(1)} ${(y + h).toFixed(1)} Z`;
}
/* ホバーの十字線と印。チャンネルの数だけ印を置く（同じ日の全チャンネルを同時に示す） */
const HOVER_G = colors => `<g class="hov" style="display:none">
    <line class="hl" stroke-width="1" vector-effect="non-scaling-stroke" style="stroke:var(--axis)"/>
    ${colors.map(c => `<circle class="hd" r="4.5" stroke-width="2" vector-effect="non-scaling-stroke"
      style="fill:${c};stroke:var(--surface-1)"/>`).join('')}
  </g>`;

/* ── 折れ線（登録者の推移）チャンネルを重ねて描く ─────────────────
   series = [{ch, name, color, rows:[{t, d, v}]}]（rows は日付の昇順） */
function lineChart(series, W, opt){
  const PL = 46, PR = 14, PT = 21;
  const plotW = Math.max(20, W - PL - PR);
  const all = series.reduce((s, x) => s.concat(x.rows), []);
  const ds = all.map(r => r.d);
  let d0 = Math.min(...ds), d1 = Math.max(...ds);
  if (d1 === d0) { d0 -= 1; d1 += 1; }
  const xt = spanTicks(d0, d1, plotW);
  /* 縦は大きめに取り、目盛りは8本ほど。横に伸びるだけで傾きが読めない、との指摘（2026-09-04） */
  const PB = xt.pb, H = (opt.H || (W < 420 ? 260 : 380)) + (PB - 26);
  const plotH = Math.max(20, H - PT - PB);
  /* 縦軸の範囲は「軸を合わせる」チャンネル（opt.axis）の値だけから決める。他のチャンネルは
     薄い線で残し、範囲の外に出た部分は描画領域で切る（案②・2026-09-04）。軸の指定が無ければ全体 */
  const main = series.find(x => x.ch === opt.axis) || null;
  const vs = (main ? main.rows : all).map(r => r.v);
  const yr = niceTicks(opt.yFrom0 ? 0 : Math.min(...vs), Math.max(...vs), W < 420 ? 6 : 8);
  const X = d => PL + plotW * ((d - d0) / (d1 - d0));
  const Y = v => PT + plotH - plotH * ((v - yr.lo) / ((yr.hi - yr.lo) || 1));
  const g = { x0:PL, y0:PT, plotW, plotH, X, Y, yTicks:yr.ticks, xTicks:xt.ticks, xRot:xt.rot, yFmt:axNum };
  const clipId = 'clip-' + (opt.id || 'line');
  /* 面の塗りは1チャンネルのときだけ（重ねると濁って線が読めなくなる） */
  const solo = series.length === 1;
  const body = series.map(s => {
    if (!s.rows.length) return '';
    const faint = main && s.ch !== main.ch;
    const line = s.rows.map((r, i) => `${i ? 'L' : 'M'}${X(r.d).toFixed(1)} ${Y(r.v).toFixed(1)}`).join(' ');
    const last = s.rows[s.rows.length - 1];
    const area = solo ? `<path d="${line} L${X(last.d).toFixed(1)} ${(PT + plotH).toFixed(1)}
      L${X(s.rows[0].d).toFixed(1)} ${(PT + plotH).toFixed(1)} Z" style="fill:${s.color};opacity:.09"/>` : '';
    return `<g clip-path="url(#${clipId})" style="opacity:${faint ? .3 : 1}">${area}<path d="${line}" stroke-width="${faint ? 1.5 : 2}" stroke-linejoin="round" stroke-linecap="round"
        vector-effect="non-scaling-stroke" style="fill:none;stroke:${s.color}"/>
      <circle cx="${X(last.d).toFixed(1)}" cy="${Y(last.v).toFixed(1)}" r="${faint ? 3 : 4}" stroke-width="2"
        vector-effect="non-scaling-stroke" style="fill:${s.color};stroke:var(--surface-1)"/></g>`;
  }).join('');
  const html = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img"
      aria-label="${esc(opt.label || '')}。${series.length}チャンネル。${main ? `縦軸は${esc(main.name)}の範囲。` : ''}">
    <defs><clipPath id="${clipId}"><rect x="${PL - 6}" y="${PT - 6}" width="${plotW + 12}" height="${plotH + 8}"/></clipPath></defs>
    ${axesSvg(g)}${unitSvg(2, PT - 9, opt.unit)}
    ${body}
    ${HOVER_G(series.map(s => s.color)).replace('<line class="hl"', `<line class="hl" y1="${PT - 4}" y2="${PT + plotH}"`)}
    <rect x="0" y="0" width="${W}" height="${H}" fill="transparent" style="cursor:crosshair"/>
  </svg>`;
  /* ホバー: 同じ日の全チャンネルを1つの吹き出しにまとめる */
  const days = [...new Set(ds)].sort((a, b) => a - b);
  const pts = days.map(d => {
    const hit = series.map(s => s.rows.find(r => r.d === d) || null);
    const first = hit.find(Boolean);
    const lines = series.map((s, i) => hit[i]
      ? `${chSw(s.color)}${esc(s.name)}　<b>${nf(hit[i].v)}</b> ${esc(opt.unit || '')}`
      : `${chSw(s.color)}${esc(s.name)}　—`).join('<br>');
    return { x:X(d), y: first ? Y(first.v) : PT + plotH,
             ys: hit.map(r => r ? Y(r.v) : null),
             html:`${esc(fmtMDW((first ? first.t : '2000-01-01') + 'T00:00:00+09:00'))}<br>${lines}` };
  });
  return { html, pts };
}

/* ── 再生数の推移: 上段＝1日の増分（棒）／下段＝累計（折れ線）───────────
   1つの絵に2つの縦軸を入れない（読み違いのもと）。単位の違う2つは上下の段に分け、
   横軸（日付）だけを共有する。棒はチャンネルごとに同じ日の中で横並び（積み上げない）。
   series = [{ch, name, color, rows:[{t, d, inc, cum}]}] */
function playsChart(series, W, opt){
  const PL = 46, PR = 14, PT = 21, GAP = 33;
  const plotW = Math.max(20, W - PL - PR);
  const all = series.reduce((s, x) => s.concat(x.rows), []);
  const ds = all.map(r => r.d);
  let d0 = Math.min(...ds), d1 = Math.max(...ds);
  if (d1 === d0) { d0 -= 1; d1 += 1; }
  const xt = spanTicks(d0, d1, plotW);
  const PB = xt.pb, H = (W < 420 ? 320 : 430) + (PB - 26);
  const hTop = Math.max(24, Math.round((H - PT - GAP - PB) * 0.55));
  const hBot = Math.max(20, H - PT - GAP - PB - hTop);
  const yTop = PT, yBot = PT + hTop + GAP;
  const X = d => PL + plotW * ((d - d0) / (d1 - d0));
  /* 縦軸の範囲は「軸を合わせる」チャンネル（opt.axis）の値だけから決める（案②・2026-09-04） */
  const main = series.find(x => x.ch === opt.axis) || null;
  const base = main ? main.rows : all;
  const incs = base.map(r => r.inc).filter(v => v != null);
  const cums = base.map(r => r.cum);
  const ir = niceTicks(0, Math.max(1, ...incs), W < 420 ? 4 : 6);
  const cr = niceTicks(Math.min(...cums), Math.max(...cums), W < 420 ? 4 : 6);
  const Yi = v => yTop + hTop - hTop * ((v - ir.lo) / ((ir.hi - ir.lo) || 1));
  const Yc = v => yBot + hBot - hBot * ((v - cr.lo) / ((cr.hi - cr.lo) || 1));
  const n = Math.max(1, series.length);
  const days = [...new Set(ds)].sort((a, b) => a - b);
  /* 同じ日の中に n 本を横並びにする（棒どうしは 1.5px の隙間で分ける） */
  const gw = Math.max(2.4, Math.min(22, plotW / Math.max(1, days.length) - 2.5));
  const bw = Math.max(1.2, (gw - (n - 1) * 1.5) / n);
  const faintOf = s => main && s.ch !== main.ch;
  const bars = series.map((s, i) => `<g clip-path="url(#clip-plays-top)" style="opacity:${faintOf(s) ? .3 : .9}">` + s.rows.map(r => r.inc == null ? '' :
    `<path d="${barPath(X(r.d) - gw / 2 + i * (bw + 1.5), Yi(r.inc), bw, (yTop + hTop) - Yi(r.inc), 3)}"
       style="fill:${s.color}"/>`).join('') + '</g>').join('');
  const clines = series.map(s => s.rows.length
    ? `<g clip-path="url(#clip-plays-bot)" style="opacity:${faintOf(s) ? .3 : 1}"><path d="${s.rows.map((r, i) => `${i ? 'L' : 'M'}${X(r.d).toFixed(1)} ${Yc(r.cum).toFixed(1)}`).join(' ')}"
        stroke-width="${faintOf(s) ? 1.5 : 2}" stroke-linejoin="round" stroke-linecap="round"
        vector-effect="non-scaling-stroke" style="fill:none;stroke:${s.color}"/></g>` : '').join('');
  const gTop = { x0:PL, y0:yTop, plotW, plotH:hTop, X, Y:Yi, yTicks:ir.ticks, xTicks:[], yFmt:axNum };
  const gBot = { x0:PL, y0:yBot, plotW, plotH:hBot, X, Y:Yc, yTicks:cr.ticks, xTicks:xt.ticks, xRot:xt.rot, yFmt:axNum };
  const html = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img"
      aria-label="再生数の推移。上段は1日の増分、下段は累計。${series.length}チャンネル。${main ? `縦軸は${esc(main.name)}の範囲。` : ''}">
    <defs><clipPath id="clip-plays-top"><rect x="${PL - 6}" y="${yTop - 6}" width="${plotW + 12}" height="${hTop + 6}"/></clipPath>
      <clipPath id="clip-plays-bot"><rect x="${PL - 6}" y="${yBot - 6}" width="${plotW + 12}" height="${hBot + 8}"/></clipPath></defs>
    ${axesSvg(gTop)}${unitSvg(2, yTop - 9, '回／日')}
    ${bars}
    ${axesSvg(gBot)}${unitSvg(2, yBot - 9, '累計 回')}
    ${clines}
    ${HOVER_G(series.map(s => s.color)).replace('<line class="hl"', `<line class="hl" y1="${yTop - 4}" y2="${yBot + hBot}"`)}
    <rect x="0" y="0" width="${W}" height="${H}" fill="transparent" style="cursor:crosshair"/>
  </svg>`;
  const pts = days.map(d => {
    const hit = series.map(s => s.rows.find(r => r.d === d) || null);
    const first = hit.find(Boolean);
    const lines = series.map((s, i) => hit[i]
      ? `${chSw(s.color)}${esc(s.name)}　この日 <b>${hit[i].inc == null ? '—' : '+' + nf(hit[i].inc)}</b> 回　／　累計 <b>${nf(hit[i].cum)}</b> 回`
      : `${chSw(s.color)}${esc(s.name)}　—`).join('<br>');
    return { x:X(d), y: first ? Yc(first.cum) : yBot + hBot,
             ys: hit.map(r => r ? Yc(r.cum) : null),
             html:`${esc(fmtMDW((first ? first.t : '2000-01-01') + 'T00:00:00+09:00'))}<br>${lines}` };
  });
  return { html, pts };
}

/* ── 公開順に見る平均視聴率（横軸＝公開日の実日付・縦軸＝%）─────────
   点の色＝チャンネル、目安に到達＝塗りつぶし／未達＝白抜き。
   ⚠️ 目安を当てない動画（items[].goal が false・02 の E系）は点を塗りつぶしにし、
      その動画しか映っていないときは破線も描かず、縦軸の範囲にも閾値を混ぜない。
   items = [{d, at, v, seq, title, name, color, goal}] */
function scatterChart(items, W, opt){
  const PL = 46, PR = 14, PT = 21;
  const plotW = Math.max(20, W - PL - PR);
  const ds = items.map(i => i.d);
  let d0 = Math.min(...ds), d1 = Math.max(...ds);
  if (d1 === d0) { d0 -= 1; d1 += 1; }
  /* 横軸は推移グラフと同じ規則（毎日の目盛り・MM/DD(曜)・幅で斜め／間引き）に統一する */
  const xt = spanTicks(d0, d1, plotW);
  const PB = xt.pb, H = (W < 420 ? 250 : 320) + (PB - 26);
  const plotH = Math.max(20, H - PT - PB);
  const vs = items.map(i => i.v);
  const useThr = items.some(i => i.goal);        /* 1本でも対象の動画があれば線を出す */
  const ext = useThr ? [opt.thr] : [];
  const yr = niceTicks(Math.min(...ext, ...vs), Math.max(...ext, ...vs), W < 420 ? 5 : 7);
  const X = d => PL + plotW * ((d - d0) / (d1 - d0));
  const Y = v => PT + plotH - plotH * ((v - yr.lo) / ((yr.hi - yr.lo) || 1));
  const g = { x0:PL, y0:PT, plotW, plotH, X, Y, yTicks:yr.ticks, xTicks:xt.ticks, xRot:xt.rot, yFmt:v => String(Math.round(v)) };
  const ty = Y(opt.thr);
  const thr = !useThr ? '' : `<line x1="${PL}" y1="${ty.toFixed(1)}" x2="${(PL + plotW).toFixed(1)}" y2="${ty.toFixed(1)}"
      stroke-width="1.5" stroke-dasharray="4 3" vector-effect="non-scaling-stroke" style="stroke:var(--crit)"/>
    <text x="${(PL + plotW).toFixed(1)}" y="${(ty - 5).toFixed(1)}" text-anchor="end" font-size="9.5" font-weight="700"
      font-family="system-ui,sans-serif" style="fill:var(--crit)">目安 ${opt.thr}%</text>`;
  const dots = items.map(i => {
    const hit = i.goal ? i.v >= opt.thr : true;   /* 対象外は白抜きにしない（判定していない） */
    return `<circle cx="${X(i.d).toFixed(1)}" cy="${Y(i.v).toFixed(1)}" r="4.5" stroke-width="2"
      vector-effect="non-scaling-stroke"
      style="fill:${hit ? i.color : 'var(--surface-1)'};stroke:${hit ? 'var(--surface-1)' : i.color}"/>`;
  }).join('');
  const html = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img"
      aria-label="公開順に見る平均視聴率。${items.length}本。${useThr ? `目安${opt.thr}%。` : ''}">
    ${axesSvg(g)}${unitSvg(2, PT - 9, '%')}${thr}${dots}
    <rect x="0" y="0" width="${W}" height="${H}" fill="transparent" style="cursor:crosshair"/>
  </svg>`;
  const pts = items.map(i => ({ x:X(i.d), y:Y(i.v),
    html:`${chSw(i.color)}${esc(i.name)}<br><b>${esc(i.seq)}</b> ${esc(i.title)}<br>${esc(fmtMDW(i.at))}　平均視聴率 <b>${i.v.toFixed(1)}</b>%` }));
  return { html, pts, mode:'xy' };
}

/* ── ヒストグラム（チャンネルごとに同じ区分で横並び・積み上げない）─────
   棒の色＝チャンネル。目安に到達した区分は塗りつぶし、未達は白抜き（輪郭だけ）。
   ⚠️ groups[].goal が false の系列は棒を全部塗りつぶしにし、全部が false なら破線も描かず、
      横軸の範囲にも閾値を混ぜない。目安は全チャンネルに当てるので、false になるのは
      **目安を持たない指標（序盤の離脱・ANA_SCALE 側）と、判定する値が1本も無い系列（02 の E系だけ）**。
      凡例の「塗りつぶし＝到達」は目安のある指標だけに出すこと（#505）。
      塗り分けは区分（棒）の位置で決まるので、判定する値と外す値が同じ系列に混ざると、外す値も入った区分の塗りになる。
   groups = [{ch, name, color, values, goal}]（values は欠測を除いてある） */
function histogram(groups, cfg, W, H){
  const { thr, step, dir, fmt, unit } = cfg;
  const all = groups.reduce((s, g) => s.concat(g.values), []);
  const useThr = groups.some(g => g.goal);
  const dmin = Math.min(...all), dmax = Math.max(...all);
  const lo = Math.min(...(useThr ? [thr] : []), Math.floor(dmin / step + 1e-9) * step);
  const hi = Math.max(...(useThr ? [thr] : []), Math.ceil(dmax / step - 1e-9) * step);
  const nb = Math.max(1, Math.round((hi - lo) / step));
  const binsOf = vals => {
    const b = new Array(nb).fill(0);
    vals.forEach(v => { let i = Math.floor((v - lo) / step + 1e-9); i = Math.min(nb - 1, Math.max(0, i)); b[i]++; });
    return b;
  };
  const gb = groups.map(g => binsOf(g.values));
  const maxc = Math.max(1, ...gb.map(b => Math.max(...b)));
  const PL = 26, PR = 10, PT = 24, PB = 26;
  const plotW = Math.max(20, W - PL - PR), plotH = Math.max(20, H - PT - PB);
  const baseY = PT + plotH, slot = plotW / nb;
  const X = v => PL + plotW * ((v - lo) / ((hi - lo) || 1));
  const yr = niceTicks(0, maxc, 2);
  const Y = c => baseY - plotH * ((c - yr.lo) / ((yr.hi - yr.lo) || 1));
  const g = { x0:PL, y0:PT, plotW, plotH, X, Y, yTicks:yr.ticks, xTicks:[], yFmt:v => String(Math.round(v)) };
  const n = Math.max(1, groups.length);
  /* 区分の中を n 本に割る。区分どうしは 3px、チャンネルどうしは 1.5px あける */
  const inner = Math.max(2, slot - 3);
  const bw = Math.max(1.2, (inner - (n - 1) * 1.5) / n);
  const showNum = bw >= 13;
  let bars = '';
  for (let i = 0; i < nb; i++){
    const binLo = lo + step * i, binHi = binLo + step;
    const inGoal = dir > 0 ? binLo >= thr - 1e-9 : binHi <= thr + 1e-9;
    groups.forEach((grp, k) => {
      const hit = grp.goal ? inGoal : true;      /* 対象外は白抜きにしない（判定していない） */
      const c = gb[k][i];
      if (!c) return;
      const bx = PL + slot * i + 1.5 + k * (bw + 1.5);
      const by = Y(c), bh = Math.max(3, baseY - by);
      bars += `<g><path d="${barPath(bx, baseY - bh, bw, bh, 3)}" stroke-width="1.5"
          vector-effect="non-scaling-stroke"
          style="fill:${hit ? grp.color : 'var(--surface-1)'};opacity:${hit ? '.9' : '1'};stroke:${hit ? 'none' : grp.color}">
          <title>${esc(grp.name)} ${fmt(binLo)}〜${fmt(binHi)}${unit}: ${c}本</title></path>`
        + (showNum ? `<text x="${(bx + bw / 2).toFixed(1)}" y="${(baseY - bh - 5).toFixed(1)}" text-anchor="middle"
          font-size="10" font-weight="700" font-family="system-ui,sans-serif" style="fill:var(--ink-2)">${c}</text>` : '')
        + `</g>`;
    });
  }
  const stride = Math.max(1, Math.ceil(nb / Math.max(2, Math.floor(plotW / 42))));
  let ticks = '';
  for (let i = 0; i <= nb; i++){
    const edge = lo + step * i, tx = X(edge);
    ticks += `<line x1="${tx.toFixed(1)}" y1="${baseY}" x2="${tx.toFixed(1)}" y2="${baseY + 3}"
      stroke-width="1" vector-effect="non-scaling-stroke" style="stroke:var(--axis)"/>`;
    if (i % stride === 0 || i === nb)
      ticks += `<text x="${tx.toFixed(1)}" y="${baseY + 15}" text-anchor="middle" font-size="9.5"
        font-family="system-ui,sans-serif" style="fill:var(--muted)">${fmt(edge)}</text>`;
  }
  const txr = X(thr);
  const thrLine = !useThr ? '' : `<line x1="${txr.toFixed(1)}" y1="${PT - 9}" x2="${txr.toFixed(1)}" y2="${baseY}"
      stroke-width="1.5" stroke-dasharray="4 3" vector-effect="non-scaling-stroke" style="stroke:var(--crit)"/>
    <text x="${txr.toFixed(1)}" y="${PT - 12}" text-anchor="middle" font-size="9.5" font-weight="700"
      font-family="system-ui,sans-serif" style="fill:var(--crit)">目安 ${fmt(thr)}${unit}</text>`;
  const html = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img"
      aria-label="分布。${useThr ? `目安 ${fmt(thr)}${unit}。` : ''}${all.length}本。">
    ${axesSvg(g)}${unitSvg(1, PT - 8, '本')}${bars}${ticks}${thrLine}
  </svg>`;
  return { html, pts:[] };
}

const anaRangeLabel = () => state.anaRange ? `直近${state.anaRange}日` : '記録の全部';

/* 到達までの見込み。伸びが0以下なら見込みは出さない（言い切らない）。
   ⚠️ 伸びがごく小さいと見込みが何百年にもなり、数字として意味を持たない
   （「約3,240.8年」が実際に出ていた・#536 低）。PACE_MAX_YEARS を超えたら
   年数を出さず「このペースでは見通せません」に落とす。 */
const PACE_MAX_YEARS = 10;
function paceLine(name, now, goal, gain30, unit){
  if (now >= goal) return `${name}は目標に到達しています。`;
  if (gain30 == null) return `${name}の直近30日の伸びは、まだ記録が足りず出せません。`;
  if (gain30 <= 0) return `${name}は直近30日は増えていないため見込みは出せません。`;
  const months = (goal - now) / gain30;
  const head = `${name}は直近30日で+${nf(Math.round(gain30))}${unit}。`;
  if (months / 12 > PACE_MAX_YEARS) return `${head}このペースでは${nf(goal)}${unit}までの見通しは出せません。`;
  const span = months >= 24 ? `約${(months / 12).toFixed(1)}年` : `約${Math.max(1, Math.round(months))}か月`;
  return `${head}このペースなら${nf(goal)}${unit}まで${span}。`;
}

/* 千再生あたり登録（登録者増 ÷ 再生数 × 1000）。再生0・欠測は出さない */
function subsPerK(p){
  const v = numOrNull(p.views), s = numOrNull(p.subscribers_gained);
  return (v && v > 0 && s != null) ? s / v * 1000 : null;
}

const PERF_COLS = [
  {k:'ch',    lb:'チャンネル', cls:'', tip:'どのチャンネルの動画か'},
  {k:'seq',   lb:'番号',   cls:'seq', tip:'動画の番号'},
  {k:'title', lb:'タイトル', cls:'ttl', tip:'公開時のタイトル'},
  {k:'published_at', lb:'公開日', cls:'dim', tip:'YouTube に公開された日'},
  {k:'views', lb:'再生数', cls:'num', tip:'これまでの再生回数の合計'},
  {k:'avg_view_rate_pct', lb:'平均視聴率', cls:'num', tip:ANA_DEF.rate},
