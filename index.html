.systbl tr.chgroup td{background:var(--stage-bg); color:var(--ink); font-weight:700;
  font-size:var(--fs-xs); letter-spacing:.03em; padding:7px 14px; border-bottom:1px solid var(--stage-line)}
.systbl tr.chgroup:hover td{background:var(--stage-bg)}
.systbl tr.chgroup:first-child td{border-top:none}
.sysnotes{margin:var(--sp-3) 0 0; padding-left:1.25em; font-size:var(--fs-2xs); color:var(--ink-2); line-height:1.7}

/* ═══ 分析 ══════════════════════════════════════════════════════ */
.spark{position:relative}
.spark svg{display:block; overflow:visible}
.sparkcap{font-size:var(--fs-xs); color:var(--ink-2); margin-top:10px; font-variant-numeric:tabular-nums}
.sparkcap b{color:var(--ink); font-weight:680}
.meterblk{display:grid; gap:6px; margin-top:var(--sp-4)}
.meterblk .mh{display:flex; align-items:baseline; gap:9px; font-size:var(--fs-sm); max-width:560px}
.meterblk .mh .nm{font-weight:680}
.meterblk .mh .pc{margin-left:auto; font-variant-numeric:tabular-nums; font-weight:700}
.track{height:9px; border-radius:var(--r-pill); background:var(--meter-track); overflow:hidden;
  max-width:560px; box-shadow:inset 0 0 0 1px var(--border-2)}
.track .fill{height:100%; background:var(--meter-fill); border-radius:var(--r-pill); min-width:5px}
.meterblk .cond{font-size:var(--fs-2xs); color:var(--ink-2); font-variant-numeric:tabular-nums}
.perftbl table{min-width:1000px}
.distwrap{overflow-x:auto; margin-top:var(--sp-2)}
.dist{min-width:340px}
.dist svg{display:block}
.distlegend{display:flex; gap:var(--sp-4); flex-wrap:wrap; font-size:var(--fs-2xs); color:var(--ink-2); margin-top:8px; font-variant-numeric:tabular-nums}
.distlegend i{display:inline-block; width:10px; height:10px; border-radius:2px; vertical-align:-1px; margin-right:5px}
.tbltoggle{background:transparent; border:none; font-family:inherit; font-size:var(--fs-2xs); color:var(--ink-2);
  cursor:pointer; padding:4px 0; text-decoration:underline; text-underline-offset:3px}
.minitbl{display:none; margin-top:10px; max-width:300px}
.minitbl.show{display:block}

/* ── 凡例（チャンネルの色＝押すと表示のオン／オフ・2026-09-04）────────
   色はチャンネル専用にしてあるので、押していない状態は色を抜いた白抜きで表す。 */
.chlegend{display:flex; flex-wrap:wrap; align-items:center; gap:var(--sp-2); margin:0 0 var(--sp-3)}
.chchip{display:inline-flex; align-items:center; gap:8px; cursor:pointer; font-family:inherit;
  font-size:var(--fs-sm); font-weight:650; color:var(--ink); background:var(--surface-1);
  border:1px solid var(--border); border-radius:var(--r-pill); padding:6px 14px; white-space:nowrap}
.chchip:hover{background:var(--surface-2)}
.chchip i{width:11px; height:11px; border-radius:3px; flex:0 0 auto; background:var(--chac);
  box-shadow:inset 0 0 0 1.5px var(--chac)}
.chchip[aria-pressed="false"]{color:var(--muted); background:transparent; border-style:dashed}
.chchip[aria-pressed="false"] i{background:transparent}
.chlegend .hint{font-size:var(--fs-2xs); color:var(--muted); font-weight:400}
/* チャンネルの現在地: 大分類ごとの小さな表を横に並べる。指標名の下に期間・目安を薄字で、
   数字の下の補足（計測済 N 本など）は .sub で1行。幅が足りなければ表が次の段に折り返す */
.nowgrid{display:grid; grid-template-columns:repeat(auto-fit, minmax(340px, 1fr)); gap:var(--sp-3)}
.nowblk{border:1px solid var(--border); border-radius:var(--r-md); overflow:hidden; background:var(--surface-1); min-width:0}
.nowblk table{width:100%; table-layout:auto}
.nowblk th, .nowblk td{padding:7px 10px}
.nowblk thead th{position:static; font-size:var(--fs-2xs); letter-spacing:.05em; text-transform:none; color:var(--ink);
  background:var(--surface-2); border-bottom:1px solid var(--border)}
.nowblk thead th.num{font-size:var(--fs-sm)}
.nowblk tbody th.lb{text-align:left; font-weight:680; color:var(--ink); white-space:normal; vertical-align:top; line-height:1.3}
.nowblk th.lb .subm{display:block; font-size:var(--fs-2xs); color:var(--muted); font-weight:400; white-space:normal; line-height:1.35; margin-top:2px}
.nowblk td.num{vertical-align:top; font-weight:600; white-space:nowrap}
.nowblk td .sub{display:block; font-size:var(--fs-2xs); color:var(--muted); font-weight:400; margin-top:2px; white-space:normal; line-height:1.35}
@media (max-width:640px){
  .nowgrid{grid-template-columns:1fr}
  .nowblk td .sub{white-space:normal}
  .nowblk td .sub.subw{display:none}   /* 「登録者 433/500・再生 74万/300万」は幅が足りないので畳む */
}
.chcell{display:inline-flex; align-items:center; gap:2px; white-space:nowrap}
/* 視聴の質: チャンネルごとの小さな表（旧 .substats の置き換え） */
.qtbl{font-size:var(--fs-2xs); margin:6px 0 2px}
.qtbl th,.qtbl td{padding:3px 8px 3px 0; border-bottom:none; white-space:nowrap}
.qtbl thead th{position:static; background:transparent; color:var(--muted); font-size:var(--fs-2xs);
  letter-spacing:.03em; text-transform:none; font-weight:600; padding-bottom:1px}
.qtbl td{color:var(--ink); font-variant-numeric:tabular-nums}
.qtbl tbody tr:hover td{background:transparent}
.qtbl td:first-child{font-weight:650}
/* 収益化の予実: チャンネルごとにひとかたまり */
.monetch + .monetch{margin-top:var(--sp-5); padding-top:var(--sp-4); border-top:1px solid var(--border-2)}
.monethd{font-size:var(--fs-sm); font-weight:680; display:flex; align-items:center; gap:2px}

/* ── 分析タブのレイアウト（2026-09-03 作り直し / 09-04 横断化）──────
   PC は2列。表・分布・全件テーブルなど横幅の要るものは .span2 で2列ぶんを使う。 */
.anagrid{display:grid; grid-template-columns:1fr 1fr; gap:var(--sp-4); margin-top:var(--sp-3)}
.anagrid>*{min-width:0}
.anagrid .span2{grid-column:1 / -1}
.anahead{display:flex; align-items:center; gap:var(--sp-3); flex-wrap:wrap; margin-top:var(--sp-4)}
.anahead .chips{margin:0}
.anarange{font-size:var(--fs-2xs); color:var(--muted)}
.anarange.axlbl{margin-left:var(--sp-3)}
.rgbtn .axsw{width:9px; height:9px; border-radius:3px; background:var(--chac); flex:0 0 auto}
/* グラフは幅が決まってから中身を描く（drawSpark）。高さは SVG 側が決める */
.chartwrap{position:relative; margin-top:var(--sp-2); min-width:0}
.chartwrap svg{display:block; width:100%; height:auto; overflow:visible}
/* 軸の説明と指標の1行定義。グラフの上に必ず置く */
.axnote{font-size:var(--fs-2xs); color:var(--muted); margin:0 0 4px; line-height:1.6}
/* 軸の説明をタイトルの横に置く（縦の場所をグラフに回す・2026-09-04）。.hint は全画面で隠す約束なので別クラス */
.sectionhead .axh{font-size:var(--fs-2xs); color:var(--muted); line-height:1.5; flex:1 1 320px; min-width:0}
.defline{font-size:var(--fs-xs); color:var(--ink-2); margin:0 0 4px; line-height:1.6}
/* 視聴の質（4つの分布） */
.qgrid{display:grid; grid-template-columns:1fr 1fr; gap:var(--sp-5) var(--sp-6)}
.qgrid>*{min-width:0}
.qblk h3{font-size:var(--fs-sm); font-weight:680; margin:0 0 3px; display:flex; align-items:baseline;
  gap:8px; flex-wrap:wrap}
.qblk h3 .goal{font-size:var(--fs-2xs); font-weight:600; color:var(--muted)}
/* 収益化の到達見込み */
.meterblk .pace{font-size:var(--fs-2xs); color:var(--ink-2); line-height:1.6; max-width:560px}
/* 公開後7日の初速（横棒）。SVG ではなく素の要素なので幅にそのまま追従する */
.hbars{display:grid; gap:5px; margin-top:var(--sp-2); max-height:340px; overflow-y:auto}
.hbar{display:grid; grid-template-columns:minmax(96px,1.1fr) minmax(60px,2fr) auto; align-items:center;
  gap:9px; font-size:var(--fs-xs)}
.hbar .hlb{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink-2)}
.hbar .hlb b{color:var(--ink); font-weight:700; font-variant-numeric:tabular-nums}
.hbar .htrack{height:11px; border-radius:var(--r-pill); background:var(--surface-2);
  box-shadow:inset 0 0 0 1px var(--border-2); overflow:hidden}
.hbar .hfill{display:block; height:100%; border-radius:var(--r-pill)}
.hbar .hval{font-variant-numeric:tabular-nums; font-weight:680; text-align:right; min-width:56px}
.hbar .hval.dim{font-weight:500; color:var(--muted)}
/* 動画別の成績: 並べ替えできる列見出しと、目安を割った値 */
th.sortable{cursor:pointer; user-select:none}
th.sortable:hover{color:var(--ink)}
th.sortable.on{color:var(--ink)}
td.num.under{color:var(--crit)}
.perftbl td.wrap, .guide td.wrap{white-space:normal; min-width:220px; line-height:1.5}
/* 指標の読み方（既定で閉じる） */
details.guide{padding:var(--sp-4) var(--sp-5)}
details.guide>summary{cursor:pointer; font-size:var(--fs-md); font-weight:680; list-style:none}
details.guide>summary::-webkit-details-marker{display:none}
details.guide>summary::before{content:'▸ '; color:var(--muted)}
details.guide[open]>summary::before{content:'▾ '}
details.guide[open]>summary{margin-bottom:var(--sp-3)}
details.guide .axnote{margin-top:var(--sp-2)}
.minitbl.wide{max-width:420px}
@media (max-width:980px){
  .anagrid{grid-template-columns:1fr}
  .qgrid{grid-template-columns:1fr}
}
@media (max-width:640px){
  .chlegend .hint{flex:1 0 100%}
  .hbar{grid-template-columns:minmax(80px,1fr) minmax(40px,1.2fr) auto; font-size:var(--fs-2xs)}
  .hbar .hval{min-width:44px}
}

/* ═══ ツールチップ / トースト ═══════════════════════════════════ */
#tip{position:fixed; z-index:90; pointer-events:none; opacity:0; transition:opacity .1s;
  background:var(--surface-1); border:1px solid var(--border); border-radius:var(--r-sm); padding:6px 11px;
  font-size:var(--fs-xs); box-shadow:0 4px 14px rgba(0,0,0,.18); font-variant-numeric:tabular-nums;
  white-space:nowrap; color:var(--ink)}
#tip.on{opacity:1}
/* 新版の通知バー（#205）。GitHub Pages の10分キャッシュで古い版を掴んだときに出る */
#newver{position:fixed; z-index:96; left:50%; bottom:92px; transform:translateX(-50%);
  display:flex; align-items:center; gap:10px; white-space:nowrap;
  background:var(--fix); color:#fff; font-size:var(--fs-xs); font-weight:680;
  padding:9px 14px; border-radius:var(--r-pill); box-shadow:0 8px 28px rgba(0,0,0,.28)}
#newver button{font-family:inherit; font-size:var(--fs-xs); font-weight:700; cursor:pointer;
  background:#fff; color:var(--fix); border:none; border-radius:var(--r-pill); padding:5px 12px}
#toast{position:fixed; z-index:95; left:50%; bottom:92px; transform:translate(-50%,14px);
  background:var(--ink); color:var(--page); border-radius:var(--r-md); padding:12px 20px; font-size:var(--fs-sm);
  opacity:0; pointer-events:none; transition:opacity .18s, transform .18s; text-align:center;
  width:max-content; max-width:min(430px, calc(100vw - 32px)); box-shadow:0 8px 28px rgba(0,0,0,.28)}
#toast.on{opacity:1; transform:translate(-50%,0); pointer-events:auto}
/* 「取り消す」つきトースト（1クリック承認の猶予・2026-08-20） */
#toast .undo{margin-left:12px; font-family:inherit; font-size:var(--fs-xs); font-weight:700;
  cursor:pointer; background:var(--page); color:var(--ink); border:none;
  border-radius:var(--r-pill); padding:5px 13px}

/* フッターは1行に収める（#205 オーナー指摘: やけに長い・空白が多い）。
   下の余白はスマホの固定タブバーを避ける最小限だけ残す */
footer{max-width:none; margin:0 auto; padding:var(--sp-3) var(--sp-5) var(--sp-4);
  color:var(--muted); font-size:var(--fs-2xs); border-top:1px solid var(--border-2);
  letter-spacing:.02em; line-height:1.7}

@media (max-width:980px){
  .kpis{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:680px){
  body{font-size:14.5px}
  main{padding:var(--sp-4) var(--sp-3) 104px}
  .topbar-in{padding:10px var(--sp-3) 0}
  .nav-in{padding:0}
  .brand{font-size:var(--fs-md); line-height:1.15}
  .chrow{margin-top:var(--sp-2); gap:var(--sp-1)}
  /* チャンネルは「いま見ているものだけ」を出し、押して切り替える（オーナー要望 2026-08-20） */
  .chtabs{display:none}
  .chpickwrap{display:block}
  /* 狭い画面でも共通画面（稼働・システム）はチャンネルタブの右に置く（オーナー指定 2026-08-20）。
     チャンネル名の場所を残すため、この2つは記号だけにして文字を畳む（読み上げと長押しの
     ためのラベルは title / aria-label に残す）。チャンネル側は詰めて横スクロールで逃がす */
  .chtab{padding:8px 10px; gap:5px}
  /* 色の点は省く（記号と、選択中タブ上端の色帯でチャンネルは判る）。名前の場所を優先する */
  .chtab .cdot{display:none}
  .chtab.sys{padding:8px 9px; font-size:var(--fs-md)}
  .chtab.sys .lbl{display:none}
  /* いま開いている共通画面だけは名前を出す（どこにいるかが分かる）。この状態では
     チャンネルタブは沈んでいて選べないので、その場所を借りても困らない */
  .chtab.sys[aria-selected="true"]{font-size:var(--fs-sm)}
  .chtab.sys[aria-selected="true"] .lbl{display:inline}
  .syncchip{display:none}
  /* 下の固定タブバーが無い（＝制作1つだけ）ときは、その分の余白も取らない */
  body[data-solonav="1"] main{padding-bottom:var(--sp-6)}
  body[data-solonav="1"] footer{padding-bottom:var(--sp-4)}
  body[data-solonav="1"] #toast{bottom:16px}
  .nav{position:fixed; bottom:0; left:0; right:0; top:auto; border-top:1px solid var(--border);
    border-bottom:none; background:var(--surface-1); z-index:50; padding-bottom:env(safe-area-inset-bottom)}
  /* タブ数は権限で変わる（制限ありユーザーは「稼働」が出ない・#208 / #249 でシステムが増えた）。
     固定列数にすると人によって右端が余る／はみ出すので、あるぶんだけ等分する */
  .nav-in{display:grid; grid-auto-flow:column; grid-auto-columns:minmax(0,1fr)}
  .navbtn{flex-direction:column; gap:3px; font-size:var(--fs-2xs); padding:9px 2px 8px; border-bottom:none;
    border-top:2px solid transparent; justify-content:center}
  .navbtn[aria-selected="true"]{border-bottom-color:transparent; border-top-color:var(--ink)}
  .navbtn .ni{font-size:1.15rem}
  .navbtn .badge{position:absolute; transform:translate(12px,-9px)}
  .tblwrap.tall{max-height:none}
  #toast{bottom:78px}
  footer{padding-bottom:72px}   /* 固定タブバー(≈64px)を避ける最小限 */
}
/* ═══ スマホ: 上部chrome削減・凡例1行（#201/#202。一覧を上から大きく）
   ※ 説明サブテキスト非表示・ブランドサブタイトル非表示・フィルタ折りたたみは
      base CSS で全画面に適用済み（#202）。ここはスマホ固有の圧縮だけ残す ═══ */
@media (max-width:640px){
  /* eyebrow を畳み、見出しを圧縮して一覧を上へ（PC は eyebrow/h1 を残す） */
  .pagehead{margin-bottom:var(--sp-3)}
  .pagehead .eyebrow{display:none}
  .pagehead h1{font-size:var(--fs-lg); margin:0}
  .sectionhead{margin-bottom:var(--sp-2)}
  /* 工程凡例を1行の極小に（囲みを外し・括弧書きを隠す・マークを縮小） */
  .legend2{gap:10px; padding:2px 0; border:none; background:transparent; margin-bottom:var(--sp-2)}
  .legend2 .ex{display:none}
  .legend2 .exs{display:inline; color:var(--muted)}
  .legend2 .mark{width:15px; height:15px; line-height:15px; font-size:10px}
}
/* ═══ スマホ: 在庫・レビュー・稼働の3タブを同じ「左右いっぱいの表」に揃える（#205）
   基準は在庫カード（.stockcards の行）: 角丸なし・影なし・画面端まで・区切りは細線1本・
   左端に状態の色帯・行の内側余白は 12px 16px。
   ⚠️ 置き場所に意味がある: .run の基本定義（角丸・影つきカード）はこのブロックより
      前にあり詳細度も同じなので、前方のメディアクエリに書くと後勝ちで上書きされて
      効かない。必ず基本定義より後ろ＝ここに置くこと ═══ */
@media (max-width:640px){
  /* リスト本体: main の左右パディングを打ち消して画面端まで。行間の隙間は無くす */
  .runs{gap:0; margin-left:calc(-1 * var(--sp-3)); margin-right:calc(-1 * var(--sp-3))}
  /* 行: カードの角丸・影・左右の枠線を外し、下線1本だけの表の行にする。
     状態の色帯（.run.ok 等）は詳細度が高いので 3px のまま残る */
  .run{border-radius:0; border-width:0 0 1px 0; box-shadow:none}
  .run{padding:var(--sp-3) var(--sp-4)}
  /* 説明バナーは囲みを外し、下の実行ログと地続きの1枚に見せる */
  .note{margin-left:calc(-1 * var(--sp-3)); margin-right:calc(-1 * var(--sp-3));
    border-radius:0; border-width:0 0 1px 0; box-shadow:none; margin-bottom:0}
  .runs{margin-top:0}
  /* 折りたたみ節は左右の余白を詰め、中の実行ログは節の内側余白ぶん外へ出して端まで使う */
  details.opsec{padding-left:var(--sp-4); padding-right:var(--sp-4)}
  details.opsec>.runs{margin-left:calc(-1 * var(--sp-4)); margin-right:calc(-1 * var(--sp-4))}
}
/* ═══ スマホの詳細まわりの微調整（#207 / #266 / #509 段1）══════════════════
   ⚠️ .dsec-history / .cmt .bub の基本定義はスタイルシートの前方にあり詳細度も同じなので、
      上書きは必ずここ＝基本定義より後ろに置く。
   2026-09-20 に詳細を1枚の器（.dview に --dpad の余白）へ組み替えたので、囲みごとに
   左右の枠線を落とす「端まで1枚」の指定は不要になった（余白は器が持つ）。 ═══ */
@media (max-width:640px){
  /* ── 入力欄をタップしたときに画面が動くのを止める（オーナー要望 2026-08-20）──────
     iPhone は「文字が16pxより小さい入力欄」に合わせて自動で拡大する。これが
     タップした瞬間に画面がグイッと動く正体なので、スマホでは入力欄だけ16pxにする
     （拡大が起きなければ、戻るときの揺れも起きない）。 */
  .wbox .wta,.abox .ata,.rjbox .rta,.toolbar input[type="search"],.toolbar select,.fld input{
    font-size:16px}
  /* ブラウザが入力欄を見せようとして画面を送るとき、下端のバーのぶん余白を残す */
  .wbox .wta{scroll-margin-bottom:calc(var(--dbar-h) + 52px)}
  /* 吹き出しは狭い画面では幅いっぱいに使う（92ch の上限は横長の画面のためのもの） */
  .dside .cmt .bub{max-width:none}
}
/* ═══ PC（広い画面）だけ本文フォントを少し大きく（#203）
   root を 16→17px にして rem ベースの --fs-* を一律 +約1px。スマホ層(≤680px)は
   別メディアクエリで既に確定済み・ここは min-width:681px に隔離するので不変 ═══ */
@media (min-width:681px){
  html{font-size:17px}
  body{font-size:16px}
}
/* 広い画面ではもう一段上げる（#203・2026-08-11 オーナー要望）。--sp-* は px なので
   余白は変わらず文字だけがスケールする */
@media (min-width:1240px){
  html{font-size:18px}
  body{font-size:17px}
}
@media (min-width:1700px){
  html{font-size:19px}
  body{font-size:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<!-- ═══ ログイン ═══ -->
<div id="login" class="loginwrap" hidden>
  <form class="logincard" id="loginform" autocomplete="on">
    <div class="eyebrow">YouTube Production</div>
    <h1>制作ダッシュボード</h1>
    <p class="sub">許可されたアカウントでログインしてください。</p>
    <div id="loginerr"></div>
    <div class="fld">
      <label for="email">メールアドレス</label>
      <input type="email" id="email" name="email" autocomplete="username" required>
    </div>
    <div class="fld">
      <label for="password">パスワード</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
    </div>
    <button class="btn primary block" type="submit" id="loginbtn">ログイン</button>
  </form>
</div>

<!-- ═══ アプリ ═══ -->
<div id="app" hidden>
<header class="topbar">
  <div class="topbar-in">

const SORT_DB = {

  plays:{col:'views'}, subs:{col:'subscribers_gained'}

const likeEsc = s => String(s).toLowerCase().replace(/[\\%_]/g, '\\$&');

   検索・絞り込みの対象になる（手元の100件だけを絞ると取りこぼす）。 */
function listQuery(ch, opts){
  let qb = sb.from('v_dashboard_list').select('*', opts).eq('channel', ch);
  const qs = state.stockQ.trim();
  if (qs) qb = qb.ilike('search_text', '%' + likeEsc(qs) + '%');
  if (state.stockGenre) qb = qb.eq('genre_label', state.stockGenre);
  if (state.stockFilter) qb = qb.eq('stage_key', state.stockFilter);
  else                   qb = qb.neq('stage_key', 'dropped');   /* 既定では没を混ぜない */
  return qb;
}

function listOrder(qb){
  const s = state.stockSort;
  if (!s) return qb.order('sort_rank').order('sort_key2', { nullsFirst:false }).order('id');
  const m = SORT_DB[s.key] || SORT_DB.seq;
  const asc = s.dir === 'asc';
  /* 値が無い行は「いちばん小さい」扱い（旧 JS が null を -1 とみなしていたのと同じ） */
  return qb.order(m.col, { ascending: m.invert ? !asc : asc, nullsFirst: asc }).order('id');
}

function mapRow(r){

  it._rv   = r.rv_gate || null;

    .range(from, from + PAGE_SIZE - 1);

  const items = (data || []).map(mapRow);
  const total = count == null ? items.length : count;
  /* 絞り込みを変えて最終ページが消えたときは、いちばん後ろのページへ寄せて取り直す */
  if (!items.length && total > 0 && state.stockPage > 0 && !retried) {
    state.stockPage = Math.max(0, Math.ceil(total / PAGE_SIZE) - 1);
    return loadCore(ch, true);
  }
  store.core[ch] = { items, byId: new Map(items.map(i => [i.id, i])),
                     key, page: state.stockPage, from, total };
  return store.core[ch];
}

/* 絞り込みUIの母数（工程チップの件数・ジャンル候補）。1動画あたり短い3列だけを
   チャンネル全行ぶん取る。ページを送っても数字が動かないようにするための問い合わせで、
   一覧本体（重い行）とは別経路。 */
async function loadFacets(ch){
  if (store.facets[ch]) return store.facets[ch];
  store.facets[ch] = await q(sb.from('v_dashboard_list')
    .select('stage_key,genre_label,search_text').eq('channel', ch));
  return store.facets[ch];
}

/* 承認待ち・【AI】修正中の一覧（レビュータブ＋左ナビのバッジ）。
   ページングとは独立に「状態を持つ行」だけを引く＝在庫が増えても件数は増えない。
   1本の動画で複数ゲートが同時に状態を持つ場合も取りこぼさないよう、ゲート別の
   状態列（script_state / storyboard_state / final_state）から行を展開する。 */
async function loadPending(ch){
  if (store.pending[ch]) return store.pending[ch];
  const items = (await q(sb.from('v_dashboard_list').select('*')
    .eq('channel', ch).eq('has_gate_state', true))).map(mapRow);
  const rv = [], rc = [];
  for (const it of items) {
    for (const g of ['script', 'storyboard', 'final']) {
      const st = it[g + '_state'];
      if (!st) continue;
      const at = it[g + '_state_at'];
      (st === 'review' ? rv : rc).push({ item: it, gate: g, at, wait: daysSince(at), open: it._open });
    }
  }
  /* ネタの仕分け待ち（#314）はゲートを持たないので上の展開に乗らない。左ナビのバッジは
     「あなたが動く番」の総数を出したいので、別に1本だけ数える（件数だけ・行は引かない）。 */
  const { count: triageN } = await sb.from('v_dashboard_list')
    .select('id', { count: 'exact', head: true }).eq('channel', ch).eq('stage_key', 'triage');

  const byAt = (a, b) => new Date(a.at) - new Date(b.at);
  store.pending[ch] = { rv: rv.sort(byAt), rc: rc.sort(byAt), triage: triageN || 0 };
  return store.pending[ch];
}
const pendingList = ch => ((store.pending[ch] || {}).rv) || [];
const triageCount = ch => ((store.pending[ch] || {}).triage) || 0;
const changesList = ch => ((store.pending[ch] || {}).rc) || [];

/* 一覧に載っていない動画（別ページ・レビュータブ経由・ディープリンク）も開けるよう、
   索引に無ければ1行だけ取りに行く */
async function loadItem(id){
  const hit = store.byId.get(id);
  if (hit) return hit;
  const rows = await q(sb.from('v_dashboard_list').select('*').eq('id', id).limit(1));
  return rows.length ? mapRow(rows[0]) : null;
}
async function loadItemBySeq(ch, seq){
  for (const it of store.byId.values()) {
    if (it.channel === ch && String(it.seq) === String(seq)) return it;
  }
  const rows = await q(sb.from('v_dashboard_list').select('*')
    .eq('channel', ch).eq('seq', seq).limit(1));

/* レビュー記録は「開いた動画のぶんだけ」取る（#215 Phase 2）。全件先読み（旧
   loadReviews の .limit(3000)）をやめたので、件数が増えても上限に静かに当たらない。 */
const RE_COLS = 'id,video_id,gate,author,kind,body,score,resolution_status,' +
                'resolved_by,resolution_note,resolved_at,revision,created_at';
/* 「その列はまだ無い」型の断り方（PostgREST は 42703 のこともスキーマ写しの取り違えのこともある） */
const noSuchColumn = err => {
  const s = ((err && err.code) || '') + ' ' + String((err && (err.message || err.hint)) || '');
  return /\b42703\b/.test(s) || /\bPGRST(100|200|202|204)\b/.test(s)
      || /does not exist|not find the .* column|unknown column/i.test(s);
};
async function loadThread(videoId){
  if (store.threads[videoId]) return store.threads[videoId];
  const get = cols => sb.from('review_events').select(cols)
    .eq('video_id', videoId).order('created_at', { ascending: true });
  /* 構造化された指摘（notes）はまだ列が無い DB でも動く——列なしで断られたら抜いて引き直す。
     ここで諦めると詳細画面がまるごと出なくなるので、退避は必ず持たせる（#509 段4） */
  let { data, error } = await get(RE_COLS + ',notes');
  if (error && noSuchColumn(error)) ({ data, error } = await get(RE_COLS));
  if (error) throw new Error(error.message || String(error));
  store.threads[videoId] = data || [];
  return store.threads[videoId];
}

/* いまの版の番号を DB に聞く（一覧のビューが古い版の提出を除くのに使っているのと同じ窓口）。
   画面は版の表そのものを読めないので、番号だけを返すこの窓口を通す。覚えずに毎回聞くのは、
   詳細を開き直したときに必ず最新で判定するため（1件ぶんの軽い問い合わせ）。
   答えが得られなければ null を返し、呼び出し側は従来どおりレビュー記録から代用する。 */
async function loadCurRev(videoId){
  try {
    const { data, error } = await sb.rpc('dashboard_current_revision', { p_video_id: Number(videoId) });
    if (error) return null;
    return data == null ? null : Number(data);
  } catch (_) { return null; }
}

/* ── ゲートの状態（#205）─────────────────────────────────────────
   video×gate ごとに「最後に状態を決めたイベント」で決まる2状態。
     review  = 承認待ち（AIが提出済み・あなたの番）
     changes = 【AI】修正中（あなたがコメントを出した・AIの番）
   approve / reject が来たら解消。判定は毎回 review_events から作り直す＝
   差し戻し対応係が resolution_status を閉じれば UI 側は何もせず追随する
   （2026-08-28 まではこれを夜間の在庫番がやっていた）。 */
/* 状態を決めるイベント（これ以外の kind は現在の状態に影響しない） */
const STATE_KINDS = ['request_review', 'request_changes', 'approve', 'reject'];
/* a のほうが b より新しいか。同時刻なら id の大きい方を後とみなす（連番のため） */
const evNewer = (a, b) => {
  const ta = +new Date(a.created_at), tb = +new Date(b.created_at);
  return ta !== tb ? ta > tb : (a.id || 0) > (b.id || 0);
};
/* video×gate ごとの現在の状態。引数は「その動画のレビュー記録」（#215 Phase 2 で
   全件配列から動画単位に縮小した。一覧側の状態はビュー M027 が同じ規則で計算する）。
   **配列の並び順に依存しない**（#215 Phase 1・2026-08-12）: 以前は頭から舐めて
   「最後に出てきたイベント」を現在の状態としていたため、取得クエリの .order() が
   唯一の順序保証になっていた。そこを触ると *エラーを出さずに古い状態を表示し続ける* という
   気づきにくい壊れ方をするので、created_at の比較で最新を選ぶ方式に変えた。 */
function gateStateMap(events, curRev){
  const last = new Map();
  /* ビュー（060/068）と同じ除外: 解決済みの差し戻しは「直し中」と読まない、古い版の提出は
     「承認待ち」と読まない。現行版 curRev は DB に聞いた値を使う（loadCurRev）。
     聞けなかったときだけ、記録の中でいちばん大きい版で代用する——代用だと作り直しの最中
     （版は上がったがレビュー記録はまだ前の版まで）に古い提出を承認待ちと読んでしまう。 */
  const maxRev = curRev != null ? Number(curRev)
                                : Math.max(0, ...(events || []).map(e => Number(e.revision) || 0));
  for (const e of (events || [])) {
    if (!STATE_KINDS.includes(e.kind)) continue;
    if (e.kind === 'request_changes' && e.resolved_at) continue;
    if (e.kind === 'request_review' && e.revision != null && Number(e.revision) < maxRev) continue;
    const k = e.video_id + '|' + e.gate;
    const prev = last.get(k);
    if (!prev || evNewer(e, prev)) last.set(k, e);
  }
  const m = new Map();
  for (const [k, e] of last) {
    /* approve / reject が最新なら状態は解消済み＝Map に入れない */
    if (e.kind === 'request_review')       m.set(k, { video_id:e.video_id, gate:e.gate, st:'review',  at:e.created_at });
    else if (e.kind === 'request_changes') m.set(k, { video_id:e.video_id, gate:e.gate, st:'changes', at:e.created_at });
  }
  return m;
}

/* 発言者が審査AIか（review_events.author の語彙は koike / kohnosuke / ai:* に
   閉じているので、ai: で始まらなければ人間・M017 の CHECK）。DB 側（M051）が
   `author IN ('koike','kohnosuke')` で数えているのと同じ集合になる。 */
const isAiAuthor = a => String(a || '').startsWith('ai:');

/* 画面に出す AI の呼び名（用語集の「Claude係」の名前）。記録に残る英字の名前をそのまま
   見せると何をした相手か分からないので、対応表を1か所に置く。表に無い相手は名前を出さない。 */
const AI_ROLE_JA = {
  'video-script-write':'台本係', 'video-script-clarity':'台本チェック係',
  'video-check-compliance':'コンプラチェック係', 'content-compliance-reviewer':'コンプラチェック係',
  'video-storyboard-design':'絵コンテ設計係', 'video-storyboard-build':'絵コンテを組む係',
  'video-check-spec':'spec審査係', 'video-check-storyboard':'絵コンテ審査係',
  'video-frame-reviewer':'絵コンテ審査係', 'video-check-final':'完成審査係',
  'video-final-reviewer':'完成審査係', 'video-rework':'差し戻し対応係',
  'video-topic-refill':'ネタ補充係', 'final-validate':'機械測定', 'dispatcher':'進行係',
  'youtube-step':'作業係（旧）', 'youtube-stock-keeper':'夜間の在庫番（旧）', 'youtube-produce':'制作の進行',
  'main-session':'制作の進行', 'backfill':'記録の後追い'
};
const aiRoleOf = a => AI_ROLE_JA[String(a || '').replace(/^ai:/, '')] || null;

/* ── この版は何の作り直しか（オーナー要望 2026-09-02）────────────────────────
   一覧で「自分の指摘を直した版」と「そうでない版」の区別が付かない、という困りごとへの答え。
   現行版の提出（最新の request_review）の前に片付いた差し戻しの出どころで決める。
   ⚠️ 提出の1つ前で切ってはいけない——同じ版を何度も出し直した記録が実在するので、
      いちばん新しい「片付いた差し戻し」から遡って、その前の提出までを1回の作り直しとみなす。 */
function reworkSrcOf(events){
  const evs = events || [];
  const done = e => e.kind === 'request_changes' && e.resolution_status && e.resolution_status !== 'open';
  let sub = null;
  for (const e of evs) if (e.kind === 'request_review' && (!sub || evNewer(e, sub))) sub = e;
  if (!sub) return null;
  let last = null;                                   /* この提出より前に片付いた最新の差し戻し */
  for (const e of evs) if (done(e) && evNewer(sub, e) && (!last || evNewer(e, last))) last = e;
  if (!last) return null;                            /* 1件も無い＝初回の提出 */
  let anchor = null;                                 /* その差し戻しの1つ前の提出＝作り直しの起点 */
  for (const e of evs) if (e.kind === 'request_review' && evNewer(last, e) && (!anchor || evNewer(e, anchor))) anchor = e;
  const batch = evs.filter(e => done(e) && evNewer(sub, e) && (!anchor || evNewer(e, anchor)));
  return batch.some(e => !isAiAuthor(e.author)) ? 'human' : 'ai';
}
/* 札は動画ごとに1回だけ計算して覚える（一覧は review_events を持っていないため） */
const reworkOf = it => store.rework[it.id] || null;
/* 承認待ちの動画のぶんだけ、札に要る最小の列をまとめて1回引く。本文は要らないので取らない
   （履歴の本文まで取ると一覧が重くなる）。詳細を開いた動画は annotate が実データで上書きする。 */
async function loadRework(items){
  const ids = (items || []).filter(i => i._rv && !(i.id in store.rework)).map(i => i.id);
  if (!ids.length) return;
  for (const id of ids) store.rework[id] = null;     /* 取れなかったときに何度も引き直さない */
  const rows = await q(sb.from('review_events')
    .select('id,video_id,gate,kind,revision,author,resolution_status,created_at')
    .in('video_id', ids).order('created_at', { ascending: true }));
  const by = new Map();
  for (const r of rows) { const a = by.get(r.video_id); if (a) a.push(r); else by.set(r.video_id, [r]); }
  for (const id of ids) {
    const evs = by.get(id) || [];
    store.rework[id] = reworkSrcOf(evs); rememberSubmitted(id, evs);
    const it = (items || []).find(i => i.id === id), cur = it ? it._rv + '|' + submittedRevOf(id, it._rv) : '';
    const seen = new Set(evs.filter(e => !isAiAuthor(e.author) && (e.kind === 'approve' || e.kind === 'request_changes'))
      .map(e => e.gate + '|' + (e.revision == null ? 1 : e.revision)));
    seen.delete(cur);
    store.looks[id] = seen.size + 1;
  }
}
/* 画面に出ている提出物の版（ゲートごとの最後の request_review の版）を覚える。承認するとき
   DB へ渡し、押した瞬間に裏で新しい版が提出されていたら断ってもらう（073・#502）。
   表示された時点の値を渡すのが要点なので、押す直前に引き直さない */
function rememberSubmitted(vid, events){
  const m = {};
  /* 版の押印が入る前の古い提出は版が空。DB 側も空を第1版として扱うので、画面も 1 として
     覚える——空のまま送ると承認が「版を名乗らない」扱いになり、何度読み直しても断られる */
  for (const e of events || []) if (e.kind === 'request_review') m[e.gate] = e.revision == null ? 1 : Number(e.revision);
  store.rvRev[Number(vid)] = m;
}
const submittedRevOf = (vid, gate) => {
  const m = store.rvRev[Number(vid)];
  return m && m[gate] != null ? m[gate] : null;
};

/* 差し戻しの出どころ（DB 側 v_dashboard_list.rc_src と同じ規則・M051）。
   ①そのゲートに載っている未対応（open）の修正依頼の著者集合で決める
   ②1件も無ければ、状態を決めた最新の修正依頼の著者で決める */
function rcSrcOf(gate, events){
  const evs = (events || []).filter(e => e.gate === gate && e.kind === 'request_changes');
  let last = null;
  for (const e of evs) if (!last || evNewer(e, last)) last = e;
  const open = evs.filter(e => e.resolution_status === 'open');
  const set = open.length ? open : (last ? [last] : []);
  const h = set.some(e => !isAiAuthor(e.author)), a = set.some(e => isAiAuthor(e.author));
  return h && a ? 'both' : h ? 'human' : (a ? 'ai' : null);
}

/* 詳細ビュー用の状態注釈。一覧の _rv/_rc/_open はビュー（M027・M051）由来だが、詳細は
   開いた瞬間にその動画のレビュー記録を取り直すので、そちらで上書きする（判定規則は
   ビューと同じ）。_rv=承認待ちのゲート / _rc=直し中のゲート / _open=未対応の指摘件数
   （_openH=あなたの指摘 / _openAi=AI審査の指摘）/ _rcSrc=差し戻しの出どころ。
   没にした動画はどちらのキューにも出さない（#203） */
function annotate(it, events, curRev){
  let rv = null, rc = null;
  for (const p of gateStateMap(events, curRev).values()) { if (p.st === 'review') rv = p.gate; else rc = p.gate; }
  const drop = it.stage === 'dropped';
  const open = drop ? [] : (events || []).filter(e => e.resolution_status === 'open');
  it._rv    = drop ? null : rv;
  it._rc    = drop ? null : rc;
  it._open  = open.length;
  it._openH = open.filter(e => !isAiAuthor(e.author)).length;
  it._openAi= open.filter(e =>  isAiAuthor(e.author)).length;
  it._rcSrc = it._rc ? rcSrcOf(it._rc, events) : null;
  store.rework[it.id] = reworkSrcOf(events);   /* 一覧の札を実データで上書きする */
  rememberSubmitted(it.id, events);
  return it;
}
/* レビュー記録はゲートで切らず動画単位で持つ（#207）。台本→絵コンテ→完成を1本の時系列で
   読ませるため。どのゲートの発言かは表示側でチップにして示す。 */
function threadOf(videoId){
  return (store.threads[videoId] || []).slice()
    .sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
}

/* ══ レビュー素材（Storage） ═════════════════════════════════════
   非公開バケット review-assets。ログイン中のユーザーは Storage の RLS で
   SELECT できる（ポリシーが無い＝一覧が 0 件なので「素材未搬出」表示になる）。
   各ファイルは有効期限つき署名URLにしてから表示する。                        */
const assetPath = (ch, seq, gate) => `${ch}/${seq}/${gate}`;
const assetKind = name => RE_IMG.test(name) ? 'image'
  : RE_VID.test(name) ? 'video' : (RE_TXT.test(name) ? 'text' : 'file');
function fmtSize(b){
  if (b == null) return '';
  if (b < 1024) return b + ' B';
  if (b < 1024 * 1024) return (b / 1024).toFixed(0) + ' KB';
  return (b / 1024 / 1024).toFixed(1) + ' MB';
}

async function loadAssets(ch, seq, gate){
  const key = assetPath(ch, seq, gate);
  const hit = store.assets[key];
  if (hit && Date.now() - hit.at < ASSET_CACHE) return hit;

  const { data, error } = await sb.storage.from(ASSET_BUCKET)
    .list(key, { limit: 100, sortBy: { column: 'name', order: 'asc' } });
  if (error) throw new Error(error.message || String(error));

  /* フォルダは id=null、空フォルダ維持用のダミーは除く */
  const files = (data || []).filter(f => f && f.id && f.name !== '.emptyFolderPlaceholder');
  const out = await Promise.all(files.map(async f => {
    const path = `${key}/${f.name}`;
    const rec = { name:f.name, path, kind:assetKind(f.name),
                  size:(f.metadata && f.metadata.size) != null ? f.metadata.size : null,
                  url:null, text:null, err:null };
    const { data: s } = await sb.storage.from(ASSET_BUCKET).createSignedUrl(path, ASSET_TTL);
    rec.url = s ? s.signedUrl : null;
    if (rec.kind === 'text') {
      const { data: blob, error: dErr } = await sb.storage.from(ASSET_BUCKET).download(path);
      if (dErr || !blob) rec.err = 'テキストを読み込めませんでした';
      else {
        const t = await blob.text();
        rec.text = t.length > ASSET_MAX_TEXT ? t.slice(0, ASSET_MAX_TEXT) + '\n\n…（以降は省略。別タブで全文を開けます）' : t;
      }
    }
    return rec;
  }));
  const res = { files: out, at: Date.now() };
  store.assets[key] = res;
  return res;
}

async function loadOps(){
  if (store.ops) return store.ops;
  const runs = await q(sb.from('agent_runs').select('*').order('started_at', { ascending: false }).limit(20));
  let events = [];
  if (runs.length) {
    events = await q(sb.from('agent_run_events').select('*')
      .in('run_id', runs.map(r => r.id)).order('at', { ascending: true }));
  }
  store.ops = { runs, events };
  return store.ops;
}

/* システムビュー（#249）の表示素材。system_docs（M029）は2行しかないチャンネル横断の
   表で、中身はリポジトリ内の正本（routines-backup の scheduled-tasks.json・
   dashboard/sync-system-docs.py 内 STATIC_ENTRIES/OVERVIEW_ITEMS）を同スクリプトが
   写したもの（旧 flow-map.html の iframe 表示は本ダッシュボードに一本化して廃止・8/19）。
   ⚠️ 公開 GitHub Pages の静的HTMLには埋めない＝ログイン後にここで初めて取りに行く。 */
async function loadSystem(){
  if (store.system) return store.system;
  const rows = await q(sb.from('system_docs').select('key,title,format,content,updated_at'));
  const by = {};
  for (const r of rows) by[r.key] = r;
  store.system = by;
  return store.system;
}

/* ── gen-farm（実家の GPU 生成機）の待ち行列（M033）──────────────────────────
   数字の正本は generation_jobs（発注台帳）。コマンドラインの genfarm-status
   （00-config/tools/genfarm-status/）と同じ表・同じ数え方を読む＝二重管理を作らない。
   引くのは2本だけ:
     open   … まだ手元に無いジョブ（materialized_at が空 かつ 発注中／実行中／生成済み）
     recent … 見込み時間の較正に使う直近の実測（終わったジョブの所要時間）
   30秒だけキャッシュする（システムタブを開き直すたびに叩かないため）。 */
const GF_OPEN_STATUS = ['submitting', 'in_flight', 'done'];
/* コレクターが生成機の履歴から後追いで記録したジョブ（source が pipeline 以外）は、
   誰も受け取りに行かないので「できあがり」が終了状態。これを未回収に数えると
   「受け取り待ち」が永久に減らず、詰まりの警告が鳴りっぱなしになる（#278）。
   この除き方は genfarm-status（EXCLUDE_COLLECTED_DONE）と揃えること。 */
const gfCollected = r => r.source && r.source !== 'pipeline' && r.status === 'done';
const GF_KIND_LABEL = {h3_video:'H3映像', flux_image:'FLUX画像', unknown:'不明'};
const GF_FALLBACK_SEC = {h3_video:223, flux_image:76, unknown:200};
/* 「できあがったのに手元へ降りていない」を詰まりと疑うまでの分数。**数えはじめは
   できあがった時刻**（finished_at）で、発注時刻ではない。生成が全部終わるまで回収しない
   作りなので、数分〜十数分の待ちは正常な合間。赤い警告はここを超えたときだけ出す
   （オーナー指定 2026-08-28: 20分。コマンドラインの genfarm-status は 10分のまま）。 */
const GF_STALE_DONE_MIN = 20;
const GF_TTL_MS = 30000;

async function loadGenfarm(force){
  if (!force && store.genfarm && Date.now() - store.genfarm.at < GF_TTL_MS) return store.genfarm;
  const [openAll, recent] = await Promise.all([
    q(sb.from('generation_jobs')
        .select('id,kind,channel,video_id,episode_seq,artifact_key,status,purpose,source,submitted_at,started_at,finished_at,updated_at,estimated_sec')
        .is('materialized_at', null).in('status', GF_OPEN_STATUS)
        .order('submitted_at', { ascending: true }).limit(200)),
    q(sb.from('generation_jobs').select('kind,estimated_sec,started_at,finished_at')
        .not('finished_at', 'is', null).not('started_at', 'is', null)
        .order('finished_at', { ascending: false }).limit(150))
  ]);
  const open = openAll.filter(r => !gfCollected(r));
  /* どの動画のぶんかを出すためにタイトルを引く（動画として登録済みのものだけ。
     試作・練習のエピソードは videos に行が無いので番号だけで出す） */
  const ids = [...new Set(open.map(r => r.video_id).filter(Boolean))];
  const titles = {};
  if (ids.length) {
    try {
      (await q(sb.from('v_dashboard_list').select('id,seq,title,channel').in('id', ids)))
        .forEach(r => { titles[r.id] = r; });
    } catch (_) { /* 取れなくても番号だけで出せる */ }
  }
  store.genfarm = { open, recent, titles, at: Date.now() };
  return store.genfarm;
}

async function loadAnalytics(ch){
  if (store.analytics[ch]) return store.analytics[ch];
  const primary = store.accounts.find(a => a.channel === ch && a.platform === 'youtube' && a.is_primary);
  /* 期間の絞り込みは画面側でやる（行数が小さいので全部取ってから切る）。
     PostgREST の既定は1000行なので、記録が伸びても切れないよう上限を明示する。 */
  const kpi = primary && primary.kpi_media_key
    ? await q(sb.from('daily_kpi').select('date,follower_actual,new_subscribers')
        .eq('media', primary.kpi_media_key).order('date', { ascending: true }).limit(5000))
    : [];
  const pubs = await q(sb.from('v_publications')
    .select('id,seq,effective_title,status,views,likes,avg_view_rate_pct,subscribers_gained,hook_awr,end_awr,early_loss_pct,engaged_rate_pct,published_at,scheduled_at,url,platform,is_primary,channel')
    .eq('channel', ch).eq('platform', 'youtube'));
  /* ジャンルは v_publications に無いので一覧のビューから引く（目安を当てる範囲の判定だけに
     使う）。読めなくても分析は出る＝ジャンル無しとして扱う */
  try {
    const gm = {};
    (await q(sb.from('v_dashboard_list').select('seq,genre').eq('channel', ch)) || [])
      .forEach(r => { gm[r.seq] = r.genre; });
    pubs.forEach(p => { p.genre = gm[p.seq] || null; });
  } catch (_) {}
  const primaryPubs = pubs.filter(p => p.is_primary);
  let daily = [];
  if (primaryPubs.length) {
    daily = await q(sb.from('publication_metrics_daily').select('date,views,publication_id')
      .in('publication_id', primaryPubs.map(p => p.id)).order('date', { ascending: true }).limit(20000));
  }
  store.analytics[ch] = { kpi, pubs: primaryPubs, daily, mediaKey: primary ? primary.kpi_media_key : null };
  return store.analytics[ch];
}
/* 分析タブは見えるチャンネル全部を1画面に重ねる（2026-09-04）。チャンネルごとの取得を
   並列で回して束ねるだけ（1本ぶんの取得と結果はまったく同じもの）。束ねたものは
   ANA_ALL のキーで持つ（チャンネルごとのキャッシュもそのまま残る）。 */
const ANA_ALL = '__all__';
async function loadAnalyticsAll(){
  if (store.analytics[ANA_ALL]) return store.analytics[ANA_ALL];
  const slugs = store.channels.map(c => c.slug);
  const got = await Promise.all(slugs.map(s => loadAnalytics(s)));
  const out = {};
  slugs.forEach((s, i) => { out[s] = got[i]; });
  store.analytics[ANA_ALL] = out;
  return out;
}
/* ══ シェル ═════════════════════════════════════════════════════ */
function renderShell(){
  /* 見えないビューを選んだ状態が残らないようにする（権限が変わった場合の保険・#208） */
  const views = visibleViews();
  if (!views.some(v => v.key === state.view)) state.view = views[0].key;

  /* いま見ているのがチャンネル共通の画面か（＝チャンネルタブが「戻り道」になる） */
  const indepNow = !!(views.find(x => x.key === state.view) || {}).chIndep;
  /* 下ナビを隠すとき（残るのが「制作」1つだけのとき）は、「あなたの番」の件数を
     チャンネルタブ側へ移す。数え方は下ナビのバッジとまったく同じ（いまのチャンネルぶん）。 */
  const stockV = views.find(x => x.key === 'stock');
  const soloNav = views.filter(x => !x.chIndep).length <= 1;
  const stockN = (soloNav && stockV && stockV.badge) ? stockV.badge() : 0;
  const stockBadge = stockN ? `<span class="badge">${stockN}</span>` : '';
  $('#chtabs').innerHTML = store.channels.map(c => {
    const m = chMeta(c.slug), on = state.ch === c.slug;
    return `<button class="chtab" role="tab" aria-selected="${on && !indepNow}" data-ch="${esc(c.slug)}"
       style="--chac:${m.accent}" title="${esc(c.name)}${indepNow ? 'の制作へ戻る' : ''}">
      <span class="cdot" style="background:${m.accent}"></span>${m.icon} ${esc(c.name)}${on ? stockBadge : ''}</button>`;
  }).join('') || `<span class="chtab" aria-hidden="true">チャンネルなし</span>`;

  /* スマホ用: いま見ているチャンネルだけを出し、押すと他が開く（オーナー要望 2026-08-20）。
     開閉は details/summary に任せる（JS を持たない＝選ぶと再描画で自然に閉じる）。 */
  const curCh = store.channels.find(c => c.slug === state.ch);
  const others = store.channels.filter(c => c.slug !== state.ch);
  $('#chpick').innerHTML = !curCh ? '' : (() => {
    const m = chMeta(curCh.slug);
    /* 名前を押す＝そのチャンネルの制作へ（共通画面からの戻り道）、▾ を押す＝他の候補を開く */
    return `<details class="chpick"><summary class="chcur" style="--chac:${m.accent}">
        <span class="chgo" data-ch="${esc(curCh.slug)}">
          <span class="cdot" style="background:${m.accent}"></span>${m.icon} ${esc(curCh.name)}</span>
        ${stockBadge}
        ${others.length ? '<span class="tri" aria-label="ほかのチャンネルを選ぶ">▾</span>' : ''}</summary>
      ${others.length ? `<div class="chmenu">${others.map(c => {
        const om = chMeta(c.slug);
        return `<button class="chitem" data-ch="${esc(c.slug)}">
          <span class="cdot" style="background:${om.accent}"></span>${om.icon} ${esc(c.name)}</button>`;
      }).join('')}</div>` : ''}</details>`;
  })();

  /* チャンネルに依存しない画面（稼働・システム）はチャンネルタブの右へ（オーナー要望 2026-08-19）。
     下のナビはそのチャンネルの中の画面（制作・分析）だけにして、2つの軸を混ぜない。
     ⚠️ スマホだけは逆にする: 画面が狭いとチャンネル名が読めなくなるので、共通画面は
     従来どおり下の固定タブバーに置く。両方に描いて CSS で出し分ける（画面幅の判定を
     JS に持たせると回転・リサイズのたびに描き直しが要るため）。 */
  $('#systabs').innerHTML = views.filter(v => v.chIndep).map(v =>
    `<button class="chtab sys" role="tab" aria-selected="${state.view === v.key}" data-view="${v.key}"
       title="${esc(v.label)}" aria-label="${esc(v.label)}">
      <span class="cdot" style="background:var(--axis)"></span>${v.icon}<span class="lbl">${v.label}</span></button>`).join('');

  $('#nav').innerHTML = views.map(v => {
    const on = state.view === v.key, n = v.badge ? v.badge() : 0;
    return `<button class="navbtn${v.chIndep ? ' indep' : ''}" role="tab" aria-selected="${on}" data-view="${v.key}">
      <span class="ni" aria-hidden="true">${v.icon}</span>${v.label}${n ? `<span class="badge">${n}</span>` : ''}</button>`;
  }).join('');

  const v = views.find(x => x.key === state.view);
  document.body.dataset.chindep = v && v.chIndep ? '1' : '0';
  /* チャンネル共通の画面は広い画面でもスマホでもチャンネルタブの右に出るので、下ナビに
     残るのはそのチャンネルの中の画面だけ。それが1つ（制作）しか無いなら押す先が無いので隠す。
     「あなたの番」の件数は上のチャンネルタブへ移してある。 */
  document.body.dataset.solonav = soloNav ? '1' : '0';
  document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
  /* 詳細ビューが開いている間は #view-detail を優先表示（一覧は隠す） */
  if (state.detail != null) {
    $('#view-detail').classList.add('active');
    document.body.classList.add('detail-open');
  } else {
    $('#view-' + state.view).classList.add('active');
    document.body.classList.remove('detail-open');
  }

  $('#syncdot').className = 'syncdot' + (state.busy ? ' busy' : '');
  $('#synctext').textContent = state.busy ? '読み込み中…'
    : (state.lastSync ? '最終読込 ' + fmtDT(state.lastSync) : '未読込');
  $('#reloadbtn').classList.toggle('spin', state.busy);
  $('#footer').textContent = `制作ダッシュボード ・ 更新 ${BUILT_AT}`;
}

/* ══ 新版の検知（#205）════════════════════════════════════════════
   GitHub Pages は HTML に Cache-Control: max-age=600 を返すため、デプロイ直後に
   開くと最大10分は古い版が表示される（プライベートモードでも同じ）。設定では
   変えられないので、ページ側で「自分自身を no-store で取り直してビルド時刻を
   比べる」ことで気づけるようにする。違っていればバナーを出して再読込を促す。 */
async function checkForUpdate(){
  if (BUILT_AT === '9/20 11:02') return;          /* ローカルで開いた未デプロイ版 */
  try {
    const res  = await fetch(location.pathname + '?_=' + Date.now(), { cache:'no-store' });
    if (!res.ok) return;
    const text = await res.text();
    const m    = text.match(/const BUILT_AT = '([^']*)'/);
    if (!m || m[1] === BUILT_AT || m[1] === '9/20 11:02') return;
    const bar = document.createElement('div');
    bar.id = 'newver';
    bar.innerHTML = `新しい版があります（${esc(m[1])}）<button type="button">再読み込み</button>`;
    bar.querySelector('button').onclick = () => location.reload();
    document.body.appendChild(bar);
  } catch { /* 通信できないときは黙って諦める（本流を止めない） */ }
}

const errBox = msg => `<div class="errbox"><b>読み込みエラー</b><br>${esc(msg)}</div>`;
const loading = () => `<div class="loadbox">読み込み中…</div>`;

/* ══ ① 在庫 ════════════════════════════════════════════════════ */
function displayIdx(it){
  /* 没とネタの仕分け待ち（#314）は工程の並びの外。-1 ＝ どの工程にも到達していない */
  if (it.stage === 'dropped' || it.stage === 'triage') return -1;
  let i = Math.max(0, PSTAGES.findIndex(s => s.key === it.stage));
  const rv = it._rv || it._rc;          /* 【AI】修正中もそのゲートの工程で止まっている */
  if (rv && GATE_COL[rv] > i) i = GATE_COL[rv];
  return i;
}
/* 一覧の行／カードに付ける状態クラス（左端の色帯）と状態バッジ。
   バッジは在庫の表・在庫カード・レビュー一覧・詳細で必ずこの2つの関数から作る（表記も寸法も1か所） */
const stateCls = it => (it._rv || it.stage === 'triage') ? 'st-rv'
  : (it._rc ? 'st-rc' : (it._open ? 'st-open' : ''));
/* tip＝ツールチップ（title 属性）。列に出す文言は短く固定し、詳しい説明はこちらへ逃がす */
const badgeHTML = b => b ? `<span class="sbadge ${b.cls}"${b.tip ? ` title="${esc(b.tip)}"` : ''}>${
  b.gl ? b.gl + ' ' : ''}${esc(b.text)}</span>` : '';
/* ── 差し戻しの直し中は「誰の指摘が起点か」で見せ方を分ける（M051）────────
   あなた（＋歯科医監修）の指摘が入っているものは今までどおりオレンジで目立たせ、
   AI審査だけが起点のもの（基準に届かず作り直しているだけ）は無彩色に落とす。
   文言は必ずこの2つの関数を通す＝表記のゆれを1か所に閉じる。 */
const rcAiOnly = it => it._rcSrc === 'ai';
const rcText  = it => rcAiOnly(it) ? `AI審査で${GATE_LABEL[it._rc]}作り直し中`
                                   : `${AI_TAG}${GATE_LABEL[it._rc]}修正対応中`;
/* 列に出す短い文言（オーナー要望 2026-09-03）。長い説明は tip（ツールチップ）に回す */
const rcShort = it => rcAiOnly(it) ? '作り直し中' : 'AI修正中';
const rcCls   = it => rcAiOnly(it) ? 'rcai' : 'rc';
/* 未対応の指摘の内訳（M051）。b=true なら件数を太字にする（吹き出し用）、
   false なら title 属性に入れられる素のテキスト。0件の側は出さない。 */
const openSplit = (it, b) => {
  const w = n => b ? `<b>${n}件</b>` : `${n}件`;
  return [it._openH  ? `あなたの指摘 ${w(it._openH)}`  : '',
          it._openAi ? `AI審査 ${w(it._openAi)}` : ''].filter(Boolean).join('・');
};
/* ゲート名（完成／台本／絵コンテ）は工程7マスを見れば分かるので状態の文言には入れない。
   知りたいときのためにツールチップには今までどおり全文を残す。 */
const stateBadgeOf = it =>
    it._rv ? {cls:'rv', gl:'●', text:'承認待ち', tip:`${GATE_LABEL[it._rv]}承認待ち（あなたの番）`}
  : it._rc ? {cls:rcCls(it), gl:'↺', text:rcShort(it), tip:rcText(it)} : null;
const openBadgeHTML = it => it._open
  ? `<span class="sbadge open" title="未対応の指摘 ${esc(openSplit(it, false) || it._open + '件')}">💬 ${it._open}</span>` : '';
/* 「この版は何の作り直しか」の札（オーナー要望 2026-09-02）。承認するかどうかを決める場面
   でしか意味が無いので、承認待ちの動画にだけ出す。初回の提出は札なし。 */
const REWORK_BADGE = {
  human: {cls:'rwh',  gl:'↻', text:'あなたの指摘', tip:'あなたの指摘を直して出し直した版'},
  ai:    {cls:'rwai', gl:'↻', text:'AIの指摘',   tip:'AI の点検で出た指摘を直して出し直した版（あなたの指摘は関係していない）'}
};
/* 差し戻しが1件も無い＝初回の提出。表の「版」列だけは空欄にせず「初版」と書く
   （空欄だと「取れなかった」のか「初版」なのか読めない）。
   版の番号（v1・v2…）は、承認待ちの提出物の版（loadRework が覚えた rvRev＝承認のとき DB へ渡すのと
   同じ値）を頭に付ける（オーナー要望 2026-09-19）。版はあなたの指摘でも AI の自己修正でも1つ進む。
   番号が取れない古い記録は由来だけを出す。 */
const FIRST_BADGE = {cls:'idea', gl:'', text:'初回', tip:'差し戻しのない最初の提出'};
const reworkBadgeHTML = it => it._rv ? badgeHTML(REWORK_BADGE[reworkOf(it)]) : '';
/* 承認待ちの行に出す3つ（オーナー要望 2026-09-19）。直すのは毎回 AI なので「AIが修正」では何も
   伝わらない。要るのは ①版の番号 ②今回**誰の指摘**を直した版か ③**あなたが見るのは何回目**か */
const revNumHTML = it => {
  const n = it._rv ? submittedRevOf(it.id, it._rv) : null;
  if (!it._rv) return '';
  return n != null ? `<span class="revnum" title="第${n}版（あなたの指摘でも AI の指摘でも、直すたびに1つ進む）">v${n}</span>`
    : '<span title="版の番号が記録に無い（古い提出）">—</span>';
};
const srcBadgeHTML = it => it._rv ? badgeHTML(REWORK_BADGE[reworkOf(it)] || FIRST_BADGE) : '';
const looksHTML = it => {
  const n = it._rv ? store.looks[it.id] : null;
  return n ? `<span title="あなたがこの動画を見るのは${n}回目（これまでに承認か修正依頼をした回数＋今回）">${n}回目</span>` : '';
};
function flagsHTML(it){
  const h = badgeHTML(stateBadgeOf(it)) + reworkBadgeHTML(it) + openBadgeHTML(it);
  return h ? `<span class="flags">${h}</span>` : '';
}
/* 承認待ちの行には、その場で通せるボタンを出す（オーナー要望 2026-08-20）。
   コメント無しの承認が普通なので、1タップで承認まで行く（数秒だけ取り消せる） */
const quickOkHTML = it => it._rv
  ? `<button class="okbtn" data-act="approve-quick" data-key="${it.id}|${esc(it._rv)}"
      data-label="承認" title="${esc(GATE_LABEL[it._rv] || it._rv)}を承認">承認</button>` : '';
const pKeyOf = it => (it.stage === 'dropped' || it.stage === 'triage')
  ? it.stage : PSTAGES[displayIdx(it)].key;

function progressCells(it){
  const cur = displayIdx(it), done = it.stage === 'posted';
  return PSTAGES.map((s, j) => {
    const pos = j === 0 ? ' first' : (j === PSTAGES.length - 1 ? ' last' : '');
    let cls = 'todo', gl = '·', tt = `${s.name} 未到達`;
    if (cur < 0) { cls = 'todo'; gl = '·'; tt = `${s.name}（没）`; }
    else if (done || j < cur) { cls = 'done'; gl = '✓'; tt = `${s.name} 完了`; }
    else if (j === cur) {
      if (it._rv)      { cls = 'rv'; gl = '●'; tt = `${GATE_LABEL[it._rv]}承認待ち（あなたの番）`; }
      else if (it._rc) { cls = rcCls(it); gl = '↺'; tt = rcText(it); }
      else             { cls = 'work'; gl = '●'; tt = `${AI_TAG}${s.work}`; }
    }
    return `<td class="st${pos}"><span class="mark ${cls}" title="${esc(tt)}">${gl}</span></td>`;
  }).join('');
}

/* 工程チップの件数は「チャンネル全体（検索・ジャンル絞り込みを反映）」で数える。
   表示中の100件だけで数えると、ページを送るたびに数字が動いてしまう。
   母数は facets（stage_key / genre_label / search_text の3列だけ）から作る。 */
function filterChips(facets){
  const qs = state.stockQ.trim().toLowerCase(), g = state.stockGenre;
  const rows = (facets || []).filter(f =>
    (!qs || String(f.search_text || '').includes(qs)) && (!g || f.genre_label === g));
  const cnt = {};
  let dropped = 0, triage = 0;
  rows.forEach(f => {
    if (f.stage_key === 'dropped') dropped++;
    else if (f.stage_key === 'triage') triage++;   /* ネタの仕分け待ち（#314） */
    else cnt[f.stage_key] = (cnt[f.stage_key] || 0) + 1;
  });
  /* 仕分け待ちは「すべて」に含める（没と違って生きているネタ）。工程チップは
     PSTAGES の外なので、没と同じく末尾に別立てで出す */
  const all = [{key:null, name:'すべて', n:rows.length - dropped}]
    .concat(PSTAGES.map(s => ({key:s.key, name:s.name, n:cnt[s.key] || 0})))
    .concat([{key:'triage', name:'仕分け', n:triage}, {key:'dropped', name:'没', n:dropped}]);
  return `<div class="chips" role="group" aria-label="工程で絞り込み">${all.map(c => {
    const on = state.stockFilter === c.key, dis = c.key && !c.n ? ' disabled' : '';
    return `<button class="chipf" data-filter="${c.key === null ? '' : c.key}" aria-pressed="${on}"${dis}>${
      c.name}<span class="n">${c.n}</span></button>`;
  }).join('')}</div>`;
}

/* 既定の並び順（#203・2026-08-11 オーナー指定 / #205 で【AI】修正中を追加）
   ① 承認待ち（あなたが動く番）→ ② 【AI】修正中（あなたの指摘をAIが対応中）→ ③ 進行中
   → ④ 投稿済み・予約中 → ⑤ ネタ案
   ネタ案は着手前で見るものが無いので最後に沈める。グループ内は ④ だけ「投稿日時の新しい順」
   （これから公開される予約が上・過去の投稿が下）、それ以外は滞留日数の降順（待たせている順）。
   ⚠️ この並べ替えは **DB 側（v_dashboard_list の sort_rank / sort_key2・M027）** にある
      （#215 Phase 2）。手元で並べ替えると「先に100件取ってから並べる」ことになり、
      承認待ちの動画が2ページ目に隠れて見逃す。列見出しクリックの並べ替えも同じ理由で
      DB へ渡している（listOrder / SORT_DB）。 */

/* ── 一覧のセクション（在庫とレビューの統合・オーナー要望 2026-08-19）────────────
   「あなたの番 →【AI】作業中 → 完了 → ネタ案 → 没」の順に見出しを立てて並べる。
   承認した動画が一覧から消えず【AI】作業中に残り続けるのが主目的（承認＝レビュー一覧から
   消える、だとどこへ行ったのか分からない）。下3つは既定で畳み、件数だけ見せる。
   並びは DB 側の sort_rank（承認待ち→修正中→進行中→投稿済み→ネタ案）そのままなので、
   ここでは見出しを差し込むだけで並べ替えはしない。
   絞り込み・並べ替え中は順番の意味が変わるのでセクションを外し、素直な一覧にする。 */
const SECTIONS = [
  {key:'rv',   label:'あなたの番 — 承認待ち',      hint:'素材を見て、承認するか修正を依頼してください'},
  /* ネタの仕分け（#314）。台本の型カタログの3型に乗らずAIが起草を見送った案。
     AI は没にしないので、ここに溜まったものはオーナーが必ず1回見る */
  {key:'triage', label:'あなたの番 — ネタの仕分け',
   hint:'台本の型に乗らなかったネタです。切り口を変える／このまま作る／没 を選んでください'},
  {key:'ai',   label:AI_TAG + '作業中',            hint:'AIが自動で進めています（差し戻した分の直しもここ）'},
  {key:'done', label:'完了（予約済み・投稿済み）',  fold:true},
  {key:'idea', label:'ネタ案（未着手）',            fold:true},
  {key:'drop', label:'没',                         fold:true}
];
function sectionOf(it){
  if (it.stage === 'dropped') return 'drop';
  if (it.stage === 'triage')  return 'triage';  /* ネタの仕分け待ち（#314）。ゲートは持たない */
  if (it._rv) return 'rv';                    /* あなたの番。工程より優先する */
  if (it._rc) return 'ai';                    /* 差し戻しの直し中も AI の番 */
  if (it.stage === 'posted' || it.stage === 'queue') return 'done';
  if (it.stage === 'idea') return 'idea';
  return 'ai';
}
const sectionsOff = () => !!(state.stockSort || state.stockFilter
  || state.stockQ.trim() || state.stockGenre);
const secOpen = s => !s.fold || !!state.secOpen[s.key];
function groupSections(rows){
  const g = {};
  rows.forEach(it => { const k = sectionOf(it); (g[k] = g[k] || []).push(it); });
  /* 承認待ちの中だけ「あなたの指摘を直した版」を先頭へ寄せる（オーナー要望 2026-09-02）。
     Array#sort は安定なので、札が同じもの同士は DB が付けた並び（滞留の長い順）のまま。 */
  if (g.rv) g.rv.sort((a, b) => (reworkOf(b) === 'human') - (reworkOf(a) === 'human'));
  return SECTIONS.map(s => Object.assign({}, s, {rows: g[s.key] || []})).filter(s => s.rows.length);
}
/* 見出しの共通部分（表の行とスマホのカード見出しで同じ文言・同じ開閉状態を使う） */
function secHeadInner(s){
  return `<span class="sn">${s.fold ? `<span class="tri">${secOpen(s) ? '▾' : '▸'}</span>` : ''}${esc(s.label)}</span>
    <span class="n">${s.rows.length}件</span>${s.hint ? `<span class="hint">${esc(s.hint)}</span>` : ''}`;
}
const secAttrs = s => s.fold
  ? ` data-secfold="${s.key}" tabindex="0" role="button" aria-expanded="${secOpen(s)}"` : '';

/* ── 進捗マトリクスの列（オーナー要望 2026-09-03 / 同日の差し戻しを反映）────────
   状態・版・指摘をタイトルのマスから出して独立した列にした。ワッペンをタイトルの
   後ろに流し込むと、タイトルの長さでワッペンの位置がずれて読めない、が理由。
   w＝その列の固定幅。table-layout:fixed なので、ここに書いた幅がそのまま列幅になる
   （幅を書いていないタイトル列だけが残り幅を取る）。列幅が中身に左右されない＝
   区画がどれでもワッペンの左端と縦位置が揃う。
   '@' は工程7マスの位置を指す目印（列見出しの「工程」もここに掛かる）。
   td を丸ごと返すのは、投稿日時が値の有無で中身もツールチップも変わるため。
   sort:1 の列だけ見出しを押して並べ替えできる（キー名は SORT_DB と揃える）。 */
/* 表の投稿日時は列幅を詰めてあるので年と曜日を落とす（全文はツールチップに残す）。
   例: 2026-08-30(土) 18:00 → 08-30 18:00 */
const shortDT = s => String(s || '').replace(/^\d{4}-/, '').replace(/\([日月火水木金土]\)/, '');
const MCOL = {
  seq:   {sort:1, w:'78px',        td: it => `<td class="seq">${esc(it.seq)}</td>`},
  title: {sort:1,                  td: it => `<td class="ttl">${esc(it.title)}</td>`},
  state: {label:'状態', w:'112px', td: it => `<td class="bcol">${badgeHTML(stageBadge(it))}</td>`},
  rev:   {label:'版',   w:'52px',  td: it => `<td class="num">${revNumHTML(it)}</td>`},
  src:   {label:'直した指摘', w:'128px', td: it => `<td class="bcol">${srcBadgeHTML(it)}</td>`},
  looks: {label:'確認', w:'70px', td: it => `<td class="num">${looksHTML(it)}</td>`},
  open:  {label:'指摘', w:'62px',  td: it => `<td class="bcol">${openBadgeHTML(it)}</td>`},
  genre: {sort:1, w:'136px',        td: it => `<td><span class="genre">${esc(it.genreLabel)}</span></td>`},
  days:  {sort:1, w:'56px', thx:' num',
          td: it => `<td class="num">${it.days == null ? '' : it.days + '日'}</td>`},
  pub:   {label:'投稿日時', w:'120px',
          td: it => it.resv ? `<td title="${esc(it.resv)}"><span class="resv">🗓 ${esc(shortDT(it.resv))}</span></td>`
                  : it.pub  ? `<td title="${esc(it.pub)}">${esc(shortDT(it.pub))}</td>` : '<td></td>'},
  plays: {sort:1, w:'84px', thx:' num',
          td: it => `<td class="num">${it.plays == null ? '' : nf(it.plays)}</td>`},
  subs:  {sort:1, w:'78px', thx:' num',
          td: it => `<td class="num">${it.subs == null ? '' : (it.subs > 0 ? '+' : '') + it.subs}</td>`},
  ok:    {label:'承認', thx:' okcol', td: it => `<td class="okcol">${quickOkHTML(it)}</td>`}
};
/* 列は全区画で共通の1セット（オーナー差し戻し 2026-09-03）。区画ごとに列を変えると
   表を分けることになり、区画のあいだで列幅が揃わずワッペンの縦位置がずれる。
   値が無いマスは「—」を並べず空欄にする（読むものが減るほうが速い）。
   '@' は工程7マスの位置を指す目印。 */
/* ジャンルの列は外した（オーナー指示 2026-09-19・承認の判断に使わない。絞り込みのジャンル選択は残す） */
/* 投稿日時・再生数・登録者増も外した（同日・数字は分析タブで見る） */
const MCOLS    = ['seq','title','state','rev','src','looks','open','@','days','ok'];
const colCount = cols => cols.length - 1 + PSTAGES.length;

function colTH(k){
  const c = MCOL[k], w = c.w ? ` style="width:${c.w}"` : '';
  if (!c.sort) return `<th class="${(c.thx || '').trim()}"${w}>${esc(c.label || '')}</th>`;
  const s = state.stockSort, on = s && s.key === k;
  return `<th class="sortable${c.thx || ''}" data-sort="${k}"${w}>${SORT_LABEL[k]}${
    on ? `<span class="ar">${s.dir === 'asc' ? '▲' : '▼'}</span>` : ''}</th>`;
}
function mtxHead(cols){
  const gi = cols.indexOf('@'), right = cols.length - gi - 1;
  return `<tr>${gi ? `<th class="pad" colspan="${gi}"></th>` : ''}<th class="grp" colspan="${
      PSTAGES.length}">工程</th>${right ? `<th class="pad" colspan="${right}"></th>` : ''}</tr>
    <tr>${cols.map(k => k === '@'
      ? PSTAGES.map((s, j) => `<th class="st${j === 0 ? ' first' : (j === PSTAGES.length - 1 ? ' last' : '')}" title="${s.name}">${s.short}</th>`).join('')
      : colTH(k)).join('')}</tr>`;
}
const mtxRow = (it, cols) => `<tr data-vid="${it.id}" tabindex="0" class="${
    (it.stage === 'dropped' ? 'dropped ' : '') + stateCls(it)}">${
    cols.map(k => k === '@' ? progressCells(it) : MCOL[k].td(it)).join('')}</tr>`;
/* 列幅は <colgroup> で決める。table-layout:fixed は「最初の行のセル」の幅しか見ないが、
   最初の行は「工程」の帯（colspan）なので、2行目の th に書いた幅は無視されて全列が
   均等割りになり、工程7マスが横に広がっていた（オーナー指摘 2026-09-04）。
   col に幅を書けば行の中身に関係なく効く。幅を書かないタイトル列が残りを取る。 */
const mtxCols = cols => `<colgroup>${cols.map(k => k === '@'
    ? PSTAGES.map(() => '<col style="width:46px">').join('')
    : `<col${MCOL[k].w ? ` style="width:${MCOL[k].w}"` : (k === 'ok' ? ' style="width:76px"' : '')}>`).join('')}</colgroup>`;
const mtxTable = (cols, body) => `<table>${mtxCols(cols)}<thead>${mtxHead(cols)}</thead><tbody>${body}</tbody></table>`;

function matrixTable(core){
  const rows = core.items;         /* 絞り込み・並べ替え・ページ切りは DB 側で済んでいる */
  const N = colCount(MCOLS);
  /* 区画の見出しは表の中の帯行（全列 colspan）。表も列見出しも必ず1つに保つ
     ＝どの区画の行でも列の縦位置が揃う（オーナー差し戻し 2026-09-03）。 */
  const secTR = s => `<tr class="secrow s-${s.key}${s.fold ? ' foldable' : ''}"${secAttrs(s)}>
      <td colspan="${N}">${secHeadInner(s)}</td></tr>`;
  const body = !rows.length
    ? `<tr class="emptyrow"><td colspan="${N}">条件に一致する動画はありません</td></tr>`
    : sectionsOff() ? rows.map(it => mtxRow(it, MCOLS)).join('')
    : groupSections(rows).map(s =>
        secTR(s) + (secOpen(s) ? s.rows.map(it => mtxRow(it, MCOLS)).join('') : '')).join('');

  return `<div class="tblwrap mtx xscroll${rows.length > 14 ? ' tall' : ''}">${
    mtxTable(MCOLS, body)}</div>${stockCards(rows)}`;
}

/* 狭幅（スマホ）用のカード表示。表と同じ rows から描画し CSS で出し分ける */
/* 記号は絵文字を使わず文字グリフにする（バッジの文字色がそのまま乗るので、
   同じ状態なら在庫カードでもレビュー一覧でも完全に同じ見え方になる） */
function stageBadge(it){
  if (it.stage === 'dropped') return {cls:'idea', gl:'○', text:'没'};
  /* ネタの仕分け待ち（#314）＝あなたが動く番なので承認待ちと同じ色（rv） */
  if (it.stage === 'triage')  return {cls:'rv',   gl:'●', text:'仕分け待ち'};
  if (it.stage === 'posted')  return {cls:'done', gl:'✓', text:'投稿済'};
  const st = stateBadgeOf(it);
  if (st) return st;
  if (it.stage === 'idea')    return {cls:'idea', gl:'○', text:'ネタ案'};
  /* 投稿待ちは誰も作業していない（公開時刻待ち）ので【AI】は付けない */
  if (it.stage === 'queue')   return {cls:'work', gl:'●', text:'投稿待ち'};
  return {cls:'work', gl:'●', text:'AI作業中', tip:`${AI_TAG}${PSTAGES[displayIdx(it)].work}`};
}
function progressDots(it){
  const cur = displayIdx(it), done = it.stage === 'posted';
  const curLabel = cur < 0 ? (it.stage === 'triage' ? '仕分け待ち' : '没') : PSTAGES[cur].name;
  return `<div class="dotrow" role="img" aria-label="工程 ${esc(curLabel)}">` + PSTAGES.map((s, j) => {
    let cls = 'todo', gl = '·';
    if (cur >= 0 && (done || j < cur)) { cls = 'done'; gl = '✓'; }
    else if (cur >= 0 && j === cur) {
      cls = it._rv ? 'rv' : (it._rc ? rcCls(it) : 'work'); gl = it._rc && !it._rv ? '↺' : '●';
    }
    const here = cur >= 0 && j === cur;
    return `<span class="pstep"><span class="dot ${cls}" title="${esc(s.name)}">${gl}</span>` +
      `<span class="plbl${here ? ' cur' : ''}">${esc(s.short)}</span></span>`;
  }).join('') + `</div>`;
}
function stockCards(rows){
  const card = it => {
    const b = stageBadge(it);
    const extra = it.stage === 'posted'
      ? (it.plays != null ? `<span class="sx">▶ ${nf(it.plays)} 回再生</span>` : '')
      : (it.resv ? `<span class="sx">🗓 ${esc(it.resv)}</span>`
        : (it.pub ? `<span class="sx">📅 ${esc(it.pub)}</span>` : ''));
    return `<article class="scard${it.stage === 'dropped' ? ' dropped' : ''} ${stateCls(it)}" data-vid="${it.id}" tabindex="0">
      <div class="scard-top">
        <span class="scard-seq">${esc(it.seq)}</span>
        <span class="scard-ttl">${esc(it.title)}</span>
        <span class="scard-days${it.days >= 7 ? ' slow' : ''}">${it.days >= 7 ? '⏳ ' : ''}滞留 ${it.days == null ? '—' : it.days + '日'}</span>
      </div>
      <div class="sbadges">${badgeHTML(b)}${reworkBadgeHTML(it)}${openBadgeHTML(it)}${quickOkHTML(it)}</div>
      ${progressDots(it)}
      ${extra ? `<div class="scard-extra">${extra}</div>` : ''}
    </article>`;
  };
  const secHead = s => `<div class="csechead s-${s.key}${s.fold ? ' foldable' : ''}"${secAttrs(s)}>${
    secHeadInner(s)}</div>`;
  const body = !rows.length
    ? `<div class="noitem">条件に一致する動画はありません</div>`
    : sectionsOff() ? rows.map(card).join('')
    : groupSections(rows).map(s => secHead(s) + (secOpen(s) ? s.rows.map(card).join('') : '')).join('');
  return `<div class="stockcards">${body}</div>`;
}

/* 説明は2本持つ: .ex＝PC の全文 / .exs＝スマホ用の10字以内。スマホで説明を全部消すと
   記号の意味が分からなくなるため、短い方だけ残す（#440 低14） */
const MARK_LEGEND = `<div class="legend2">
  <b>工程</b>
  <span class="lg"><span class="mark done">✓</span>完了</span>
  <span class="lg"><span class="mark work">●</span>AI作業中<span class="ex">（AIが自動で進めています）</span><span class="exs">（AIが進行中）</span></span>
  <span class="lg"><span class="mark rc">↺</span>AI修正中<span class="ex">（あなたが出した指摘をAIが直しています）</span><span class="exs">（指摘を直し中）</span></span>
  <span class="lg"><span class="mark rcai">↺</span>作り直し中<span class="ex">（AIの審査で指摘が出たので直しています。あなたの操作は要りません）</span><span class="exs">（AIの指摘で直し中）</span></span>
  <span class="lg"><span class="mark rv">●</span>承認待ち<span class="ex">（あなたの番）</span><span class="exs">（あなたの番）</span></span>
  <span class="lg"><span class="mark todo">·</span>未到達</span></div>`;

/* ゲートが「いまの版で」承認済みか。approved_*_at は初回承認の時刻で版を知らない（差し戻しで
   版が進んでも残る）ので、そのゲートが承認待ち（*_state === 'review'）なら承認済みとは見せない
   （BZ0051 で第2版の承認が第4版の「✓完成」に見えていた・2026-09-18） */
function gateApproved(it, g){
  return !!it[GATE_COLUMN_FIELD[g]] && it[g + '_state'] !== 'review';
}
function gateChips(it, slug){
  return chMeta(slug).gates.map(g => {
    const on = gateApproved(it, g);
    return `<span class="gate ${on ? 'on' : ''}">${on ? '✓ ' : ''}${GATE_LABEL[g]}</span>`;
  }).join('');
}

/* ページ送り（#215 Phase 2）。並び順は DB 側（sort_rank）で付けているので、
   1ページ目に必ず「承認待ち（あなたの番）」が来る。 */
function pagerHTML(core){
  const pages = Math.max(1, Math.ceil(core.total / PAGE_SIZE));
  if (pages <= 1) return '';
  const p = core.page;
  return `<div class="pager">
    <button class="btn" id="pgprev"${p <= 0 ? ' disabled' : ''}>← 前へ</button>
    <span class="pginfo">${p + 1} / ${pages} ページ<span class="pgtot">（全 ${nf(core.total)}件）</span></span>
    <button class="btn" id="pgnext"${p >= pages - 1 ? ' disabled' : ''}>次へ →</button>
  </div>`;
}

async function renderStock(){
  const el = $('#view-stock');
  if (!state.ch) { el.innerHTML = `<div class="noitem">動画チャンネルがありません</div>`; return; }
  const m = chMeta(state.ch);
  if (!store.facets[state.ch]) { el.innerHTML = loading(); }
  let facets;
  try {
    facets = await loadFacets(state.ch);
    await loadPending(state.ch);                       /* 左ナビの承認待ちバッジ用 */
  } catch (e) { el.innerHTML = errBox(e.message); return; }

  const droppedN = facets.filter(f => f.stage_key === 'dropped').length;
  const triageN  = facets.filter(f => f.stage_key === 'triage').length;   /* ネタの仕分け待ち（#314） */
  const active = facets.length - droppedN;
  const rvN = pendingList(state.ch).length;
  const genres = [...new Set(facets.filter(f => f.stage_key !== 'dropped').map(f => f.genre_label))]
    .sort((a, b) => a.localeCompare(b, 'ja'));

  el.innerHTML = `
    <div class="pagehead">
      <div class="eyebrow">制作</div>
      <h1>${m.icon} ${esc(m.name)}${rvN ? `<span style="font-size:var(--fs-sm);font-weight:400;color:var(--muted)">承認待ち ${rvN}件</span>` : ''}${
        triageN ? `<span style="font-size:var(--fs-sm);font-weight:400;color:var(--muted)">仕分け待ち ${triageN}件</span>` : ''}</h1>
      <p>仕掛かり ${active}本・没 ${droppedN}本。上から「あなたの番（承認待ち → ネタの仕分け）→${AI_TAG}作業中 → 完了」の順に並びます。行（スマホはカード）をクリックすると素材とレビュー履歴が開き、その場でコメント・承認ができます。表は ${PAGE_SIZE} 件ずつ表示します。</p>
    </div>
    <div class="sectionhead" style="margin-top:0">
      <h2>進捗マトリクス</h2>
      <span class="hint">${sectionsOff() ? '絞り込み・並べ替え中はセクションを外して一覧で出しています'
        : '承認したものは【AI】作業中に残ります'}</span>
    </div>
      <div class="filterbar">
        <button class="filtoggle" id="filtoggle" aria-expanded="${state.filtersOpen}" aria-controls="filterbox">絞り込み <span class="fcaret">▾</span></button>
        <span class="cond" id="stockcond"></span>
        <span class="hits" id="stockhits"></span>
      </div>
      <div class="filterbox${state.filtersOpen ? ' open' : ''}" id="filterbox">
        <div class="toolbar">
          <input type="search" id="stockq" placeholder="SEQ・タイトルで検索" aria-label="SEQ・タイトルで検索" value="${esc(state.stockQ)}">
          <select id="stockgenre" aria-label="ジャンルで絞り込み">
            <option value="">ジャンル: すべて</option>
            ${genres.map(g => `<option value="${esc(g)}" ${state.stockGenre === g ? 'selected' : ''}>${esc(g)}</option>`).join('')}
          </select>
          <button class="btn" id="stockreset">リセット</button>
        </div>
        <div id="stockchips"></div>
      </div>
      ${MARK_LEGEND}
      <div id="stocktable">${loading()}</div>`;

  await refreshStockTable();
}

async function refreshStockTable(){
  if (!$('#stocktable')) return;
  let core;
  try { core = await loadCore(state.ch); }
  catch (e) { $('#stocktable').innerHTML = errBox(e.message); return; }
  if (!$('#stocktable')) return;                     /* 待っている間に画面が変わった */
  /* 札（この版は何の作り直しか）に要る記録を、承認待ちのぶんだけ先に取る。
     取れなくても一覧は出す＝札が出ないだけで従来どおり読める */
  try { await loadRework(core.items); } catch (_) { /* 札なしで続行 */ }
  if (!$('#stocktable')) return;

  $('#stockchips').innerHTML = filterChips(store.facets[state.ch]);
  $('#stocktable').innerHTML = matrixTable(core) + pagerHTML(core);

  const conds = [];
  if (state.stockFilter) {
    /* PSTAGES の外にある特別扱い（没・ネタの仕分け待ち・#314）は find が空を返すので、
       ここで名前を決めてから触る（s.name を直接読むと落ちる） */
    const sName = state.stockFilter === 'dropped' ? '没'
      : state.stockFilter === 'triage' ? '仕分け待ち'
      : (PSTAGES.find(x => x.key === state.stockFilter) || {}).name;
    conds.push(`工程=<b>${esc(sName || state.stockFilter)}</b>`);
  }
  if (state.stockGenre) conds.push(`ジャンル=<b>${esc(state.stockGenre)}</b>`);
  if (state.stockQ.trim()) conds.push(`検索=<b>${esc(state.stockQ.trim())}</b>`);
  if (state.stockSort) conds.push(`並び=<b>${SORT_LABEL[state.stockSort.key]} ${state.stockSort.dir === 'asc' ? '昇順' : '降順'}</b>`);
  $('#stockcond').innerHTML = conds.length ? '絞り込み中: ' + conds.join(' ・ ') : '';
  $('#stockhits').textContent = core.total
    ? `全 ${core.total} 件中 ${core.from + 1}–${core.from + core.items.length} 件を表示`
    : '0 件';
  syncStickyOffsets();
}

/* メモ・没理由は改行なしの長い地の文で保存されていることが多い（リサーチ結果の丸写し等）。
   保存値はそのままに、表示時だけ句点で折り返して読めるようにする。既に改行が入っている
   文字列には触らない（書き手が意図的に整形しているため） */
function sentenceWrap(s){
  const t = String(s || '');
  if (t.includes('\n')) return t;
  return t.replace(/。(?!\s*$)/g, '。\n');
}
function timelineRows(it){
  const cur = displayIdx(it);
  const stamp = {
    1: gateApproved(it, 'script')     ? it.approved_script_at     : null,
    2: gateApproved(it, 'storyboard') ? it.approved_storyboard_at : null,
    4: gateApproved(it, 'final')      ? it.approved_final_at      : null,
    6: it.published_at || it.scheduled_at || it.posted_date
  };
  return PSTAGES.map((s, j) => {
    let dt = '—', cls = ' future', mk = 'todo';
    if (cur < 0) { dt = '—'; }
    else if (it.stage === 'posted' || j < cur) {
      mk = 'done'; cls = '';
      dt = fmtDate(stamp[j]) || '—';
    } else if (j === cur) {
      mk = it._rv ? 'rv' : (it._rc ? rcCls(it) : 'work'); cls = '';
      const since = fmtDate(it.status_changed_at);
      dt = (it._rv ? '承認待ち' : it._rc ? rcShort(it) : `${AI_TAG}${s.work}`) + (since ? `（${since}〜）` : '');
    }
    return `<div class="row${cls}"><span class="mark ${mk}">${
      mk === 'done' ? '✓' : (mk === 'todo' ? '·' : (mk.startsWith('rc') ? '↺' : '●'))}</span>
      <span class="nm">${s.name}</span><span class="dt">${esc(dt)}</span></div>`;
  }).join('');
}

/* 畳んだ項目の共通の形（右列の下に並べる details）。既存の履歴の畳みと同じ作法に揃える */
const foldHTML = (label, body, sub) =>
  `<details class="dsec dsec-history dsec-mat"><summary class="dsum">${esc(label)}${
    sub ? `<span class="n">${esc(sub)}</span>` : ''}</summary>${body}</details>`;

/* ── 詳細（レビュー画面）の組み立て（#509 段1・見本 dashboard/review-mockup.html）──────
   並びは見本のとおり:
     ヘッダ1行 → PC は2列（左＝レビュー素材・右＝入力欄／あなたの指摘／畳んだ項目）→ 下端の固定バー。
   スマホは同じ順で縦1列になる（grid の列を1本にするだけ）。
   ⚠️ 送信の仕組み（approve_gate / request_changes / reject_video の呼び出し、版のずれで
   断られたときの描き直し、没の2段階）は動かしていない——置き場所だけを変えている。 */
function detailHTML(it){
  const m = chMeta(it.channel), cur = displayIdx(it);
  const curName = cur < 0 ? (it.stage === 'triage' ? '仕分け待ち' : '没') : PSTAGES[cur].name;
  const rvGate = it._rv || it._rc;
  const evs = threadOf(it.id);

  /* 履歴は2つに分ける（オーナー決定 2026-09-06）。「あなたの指摘」は全文のまま右列に出し、
     「AI の記録」は1件1行に畳んで下の畳みへ回す。時系列には混ぜない。
     ゲートが1つしか無い動画（02の完成だけ）では毎行に同じ札を出しても読み分けに使えない */
  const showGate = new Set(evs.map(e => e.gate)).size > 1;
  const you   = evs.length ? youHTML(evs, showGate, it) : '';
  const ailog = evs.length ? aiLogHTML(evs) : '';

  /* 承認待ちなら「決める枠」（ゲート名＋版・変えたこと・メモ・入力欄）と下端のバー。
     承認待ちでなければ現状を言う1行だけ。文言は差し戻しの出どころで分ける（M051）——
     あなたの指摘の直しなのか、AI審査が基準未達と見て作り直しているのかで、読む人のすることが違う */
  const decide = it._rv
    ? decideHTML(it, it._rv, changeLines(evs))
    : `<div class="decide">${it._rc
        ? (rcAiOnly(it)
            ? `<div class="dstate rcai">↺ AI審査の指摘で${GATE_LABEL[it._rc]}を作り直しています。あなたの操作は要りません。</div>`
            : `<div class="dstate rc">↺ あなたの指摘にAIが対応中です（${GATE_LABEL[it._rc]}）。直り次第、新しい版で出し直します。</div>`)
        : `<div class="dstate">● いまは「${esc(curName)}」の工程です。</div>`}</div>`;

  /* 左列＝いま見るべき素材（承認待ち／AI修正中のゲートのもの）。台本(.md)・絵コンテ(画像)・
     完成(mp4) のどれでも assetsHTML が同じ形で描く。素材が無いゲートでは左列を畳んで1列にする */
  const stage = rvGate ? `<div class="dstage">
      <div class="assets" data-assets="${esc(it.id + '|' + rvGate)}" data-ch="${esc(it.channel)}"
           data-seq="${esc(it.seq)}" data-gate="${esc(rvGate)}">
        <div class="loadbox">素材を読み込み中…</div></div></div>` : '';

  /* ネタの仕分け（#314）。ゲートを持たないので決める枠とは排他 */
  const triage = it.stage === 'triage'
    ? `<div class="dsec">
        <div class="dstate rv">● <b>あなたの番</b>です。台本の型に乗らなかったので、AIは起草せずここへ回しました。</div>
        ${triagePanel(it)}</div>`
    : '';

  /* 畳んだ項目（既定は畳む）。並びは AI の記録 → 素材（絵コンテ・完成）→ 工程の履歴 → フック */
  const metrics = (it.plays != null || it.avg_view_rate_pct != null || it.subs != null)
    ? foldHTML(`数字${it.measured_date ? `（${fmtDate(it.measured_date) || it.measured_date} 計測）` : ''}`, `
      <div class="mgrid">
        <div class="m"><div class="k">再生数</div><div class="v">${it.plays == null ? '—' : nf(it.plays)}</div></div>
        <div class="m"><div class="k">平均視聴率</div><div class="v">${it.avg_view_rate_pct == null ? '—' : Number(it.avg_view_rate_pct).toFixed(1) + '%'}</div></div>
        <div class="m"><div class="k">登録者増</div><div class="v">${it.subs == null ? '—' : (it.subs > 0 ? '+' : '') + it.subs}</div></div>
      </div>
      ${it.youtube_url ? `<a class="ytlink" href="${esc(it.youtube_url)}" target="_blank" rel="noopener noreferrer">${esc(it.youtube_url)}</a>` : ''}`)
    : '';
  const dropped = it.stage === 'dropped'
    ? foldHTML('没にした理由', `<div class="hook">${esc(sentenceWrap(it.decision_note || it.note || '（記録なし）'))}</div>`)
    : '';
  const noteBlk = it.note
    ? foldHTML('メモ', `<div class="hook">${esc(sentenceWrap(it.note))}</div>`) : '';

  const folds = `<div class="folds">
    ${ailog}
    ${materialsHTML(it, rvGate)}
    ${foldHTML('工程の履歴', `<div class="tl">${timelineRows(it)}</div>
      <div class="dhint">日付は承認ポイント・公開時刻の実記録のみ表示（記録が無い工程は —）</div>`,
      cur < 0 ? '' : curName)}
    ${foldHTML('フック', `<div class="hook">${esc(it.hook || '（未設定）')}</div>`)}
    ${metrics}${dropped}${noteBlk}
  </div>`;

  return `<div class="dview${it._rv ? ' hasbar' : ''}" role="region" aria-label="${esc(it.title)} の詳細">
    <div class="dtop">
      <button class="dback" data-close="1" aria-label="一覧に戻る">← 一覧</button>
      <span class="seqn">${esc(it.seq)}</span>
      <span class="ttl">${esc(it.title)}</span>
      <span class="tags">
        <span class="chip"><span class="cdot" style="background:${m.accent}"></span>${m.icon} ${esc(m.name)}</span>
        <span class="gbadge"><i style="background:${it._rv ? 'var(--s1)'
          : (it.stage === 'posted' || it.stage === 'dropped') ? 'var(--done)' : 'var(--fix)'}"></i>${esc(curName)}</span>
        ${flagsHTML(it)}
      </span>
    </div>
    <div class="dwrap${stage ? '' : ' solo'}">
      ${stage}
      <div class="dside">
        ${it.stage === 'triage' ? triage : decide}
        ${you}
        ${folds}
      </div>
    </div>
  </div>`;
}

/* ── 履歴付き詳細ビュー（#200）───────────────────────────────────
   在庫カード／レビュー項目クリックで #view-detail を全画面表示し history.pushState で
   履歴を積む。ブラウザの戻る（popstate）／画面内「戻る」ボタン（data-close→history.back）で
   一覧へ戻り、開いた時点のスクロール位置を復元する。URL は同一パス上のハッシュ #detail/… のみ。 */
const BASE_URL = () => location.pathname + location.search;
let _returnScroll = null;

/* 詳細ビューを実際に描画する（履歴は積まない・再描画や popstate から共用）。
   一覧に載っていない動画（別ページ・ディープリンク）でも開けるよう、動画1行と
   その動画のレビュー記録をここで取りに行く（#215 Phase 2 で非同期になった）。 */
async function openDetail(vid, gate){
  const id = Number(vid);
  const dv = $('#view-detail');
  state.detail = id;
  /* 描き直すたびにタップ入力は組み直す（下書きは localStorage から戻る・#509 段4） */
  tap = null; curItem = null;
  document.body.classList.remove('sheetopen');
  document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
  dv.classList.add('active');
  document.body.classList.add('detail-open');
  document.body.style.overflow = '';
  if (!store.threads[id] || !store.byId.get(id)) dv.innerHTML = loading();

  let it, evs, curRev = null;
  try {
    it = await loadItem(id);
    if (it) { evs = await loadThread(id); curRev = await loadCurRev(id); }
  } catch (e) { dv.innerHTML = errBox(e.message); return; }
  if (!it) { closeDetail(); return; }
  if (state.detail !== id) return;             /* 待っている間に別の動画へ移った */

  /* 入口（在庫／レビュー）に依らずレビューパネルが出るよう、保留ゲートを都度算出。
     いまの版を添えるのは、一覧と同じ基準で「古い版の提出」を承認待ちから外すため */
  annotate(it, evs, curRev);

  curItem = it;                 /* 素材は非同期で届くので、届いた時点の「何を見ているか」の控え */
  dv.innerHTML = detailHTML(it);
  syncStickyOffsets();          /* タブが隠れてヘッダーが低くなるので測り直す（戻るボタンの貼り付き位置） */
  window.scrollTo(0, 0);
  dv.querySelector('.dback')?.focus();
  mountAllAssets(dv);
  armLazyAssets(dv);            /* 畳んである素材は開かれた時点で読みに行く（#360） */
}

/* 一覧へ戻す（履歴は操作しない）。scrollY 指定があればそこへ、無ければ開いた時点へ復元 */
function closeDetail(scrollY){
  const wasOpen = state.detail != null;
  state.detail = null;
  tap = null; curItem = null;
  document.body.classList.remove('sheetopen');
  const dv = $('#view-detail');
  dv.classList.remove('active');
  dv.innerHTML = '';
  document.body.classList.remove('detail-open');
  document.body.style.overflow = '';
  $('#view-' + state.view)?.classList.add('active');
  syncStickyOffsets();          /* タブが戻ってヘッダーが高くなるので測り直す */
  if (wasOpen) {
    const y = (scrollY != null) ? scrollY : _returnScroll;
    if (y != null) requestAnimationFrame(() => window.scrollTo(0, y));
  }
  _returnScroll = null;
}

/* クリック起点：現在のスクロールを一覧履歴に刻んでから詳細をプッシュ */
async function pushDetail(vid, gate){
  const y = window.scrollY;
  let it;
  try { it = await loadItem(Number(vid)); } catch { return; }
  if (!it) return;
  _returnScroll = y;
  const base = history.state || {};
  history.replaceState(Object.assign({}, base, { view: state.view, ch: state.ch, scrollY: _returnScroll }), '', BASE_URL());
  const hash = `#detail/${encodeURIComponent(state.ch)}/${encodeURIComponent(it.seq)}` +
    (gate ? '/' + encodeURIComponent(gate) : '');
  history.pushState({ detail: it.id, ch: state.ch, gate: gate || null, view: state.view }, '', hash);
  await openDetail(it.id, gate);
}

function parseHash(){
  const m = /^#detail\/([^/]+)\/([^/]+)(?:\/([^/]+))?$/.exec(location.hash || '');
  if (!m) return null;
  return { ch: decodeURIComponent(m[1]), seq: decodeURIComponent(m[2]),
           gate: m[3] ? decodeURIComponent(m[3]) : null };
}

/* 直リロード／ディープリンク（#detail/…）で開いたときの初期ルーティング。
   無効なハッシュはトップ（一覧）へ落とす。back で一覧へ戻れるよう履歴を [一覧, 詳細] に整える。 */
async function applyInitialRoute(){
  const r = parseHash();
  if (!r) return;
  if (!store.channels.some(c => c.slug === r.ch)) { history.replaceState({}, '', BASE_URL()); return; }
  let it;
  try {
    if (r.ch !== state.ch) { state.ch = r.ch; await render(); }
    /* 一覧のページに載っていない seq でも開けるよう、DB から直接1行引く */
    it = await loadItemBySeq(state.ch, r.seq);
  } catch { history.replaceState({}, '', BASE_URL()); return; }
  if (!it) { history.replaceState({}, '', BASE_URL()); return; }
  history.replaceState({ view: state.view, ch: state.ch, scrollY: 0 }, '', BASE_URL());
  history.pushState({ detail: it.id, ch: state.ch, gate: r.gate, view: state.view }, '',
    `#detail/${encodeURIComponent(state.ch)}/${encodeURIComponent(it.seq)}${r.gate ? '/' + encodeURIComponent(r.gate) : ''}`);
  _returnScroll = 0;
  await openDetail(it.id, r.gate);
}

window.addEventListener('popstate', e => {
  const st = e.state || {};
  /* 一覧に載っていない動画でも openDetail が1行取りに行く（開けなければ閉じる） */
  if (st.detail != null && st.ch === state.ch) openDetail(st.detail, st.gate);
  else closeDetail(st.scrollY);
});
