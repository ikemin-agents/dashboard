  : k === 'ch' ? (p._chName || '')
  : k === 'title' ? (p.effective_title || '')
  : k === 'seq' ? String(p.seq || '')
  : k === 'published_at' ? (p.published_at ? new Date(p.published_at).getTime() : null)
  : numOrNull(p[k]);

/* 1チャンネルぶんの集計。画面のどの区画もここで出した値だけを読む */
function anaStats(a){
  const mean = arr => arr.length ? arr.reduce((s, v) => s + v, 0) / arr.length : null;
  const backAt = (arr, days) => {
    const key = jstDateStr(-days), hit = arr.find(r => r.t >= key);
    return (hit && arr.length > 1) ? hit : null;
  };
  const subsAll = a.kpi.filter(r => r.follower_actual != null)
    .map(r => ({ t:r.date, d:dayNum(r.date), v:Number(r.follower_actual) }));
  const latestSubs = subsAll.length ? subsAll[subsAll.length - 1].v : null;
  const s7 = backAt(subsAll, 7), s30 = backAt(subsAll, 30);

  /* 再生数（投稿ごとの累積を日ごとに足し上げる） */
  const byDate = new Map();
  a.daily.forEach(d => byDate.set(d.date, (byDate.get(d.date) || 0) + (Number(d.views) || 0)));
  const cumAll = [...byDate.keys()].sort().map(t => ({ t, d:dayNum(t), cum:byDate.get(t) }));
  cumAll.forEach((r, i) => { r.inc = i ? Math.max(0, r.cum - cumAll[i - 1].cum) : null; });
  const latestCum = cumAll.length ? cumAll[cumAll.length - 1].cum : null;
  const c7 = backAt(cumAll, 7), c30 = backAt(cumAll, 30);

  const posted = a.pubs.filter(p => p.status === '投稿済');
  const totalViews = posted.reduce((s, p) => s + (Number(p.views) || 0), 0);
  const vals = k => posted.map(p => numOrNull(p[k])).filter(v => v != null);
  /* 目安の対象になる動画だけ（02 の E系を除く）。到達本数の分母・分子はこちらで数える */
  const goalPosted = posted.filter(goalVid);
  const gvals = k => goalPosted.map(p => numOrNull(p[k])).filter(v => v != null);
  const rates = vals('avg_view_rate_pct');
  /* 直近7日＝今日を含む暦の7日間（公開日は日本時間の日付で数える） */
  const wkFrom = jstDateStr(-6), wkTo = jstDateStr(0);
  const pubDay = p => { const q = partsOf(new Date(p.published_at), {year:'numeric', month:'2-digit', day:'2-digit'}); return `${q.year}-${q.month}-${q.day}`; };
  const postedDated = posted.filter(p => p.published_at);
  const lastPub = postedDated.reduce((m, p) => (!m || new Date(p.published_at) > new Date(m.published_at)) ? p : m, null);

  /* 投稿ごとの日次記録（公開後7日の初速に使う） */
  const recs = new Map();
  a.daily.forEach(d => {
    if (!recs.has(d.publication_id)) recs.set(d.publication_id, []);
    recs.get(d.publication_id).push(d);
  });
  recs.forEach(arr => arr.sort((x, y) => x.date < y.date ? -1 : 1));

  return {
    subsAll, cumAll, posted, totalViews, recs,
    latestSubs, latestCum,
    subsDelta: (latestSubs != null && s7) ? latestSubs - s7.v : null,
    subsGain30: (latestSubs != null && s30) ? latestSubs - s30.v : null,
    viewsDelta: (latestCum != null && c7) ? latestCum - c7.cum : null,
    viewsGain30: (latestCum != null && c30) ? latestCum - c30.cum : null,
    rates, hooks: vals('hook_awr'), ends: vals('end_awr'), losses: vals('early_loss_pct'),
    gRates: gvals('avg_view_rate_pct'), gHooks: gvals('hook_awr'),
    gEnds: gvals('end_awr'), gLosses: gvals('early_loss_pct'),
    avgRate: mean(rates), hookAvg: mean(vals('hook_awr')),
    rateHit: gvals('avg_view_rate_pct').filter(v => v >= ANA_GOAL.rate.thr).length,
    subsLatestT: subsAll.length ? subsAll[subsAll.length - 1].t : null, s7t: s7 ? s7.t : null, s30t: s30 ? s30.t : null,
    cumLatestT: latestCum != null ? cumAll[cumAll.length - 1].t : null, c7t: c7 ? c7.t : null, c30t: c30 ? c30.t : null,
    wkFrom, wkTo,
    weekPosts: postedDated.filter(p => pubDay(p) >= wkFrom).length,
    lastPub
  };
}

async function renderAnalytics(){
  const el = $('#view-analytics');
  if (!store.channels.length) { el.innerHTML = `<div class="noitem">動画チャンネルがありません</div>`; return; }
  if (!store.analytics[ANA_ALL]) el.innerHTML = loading();
  let A;
  try { A = await loadAnalyticsAll(); }
  catch (e) { el.innerHTML = errBox(e.message); return; }
  chartReg = [];

  const from = state.anaRange ? jstDateStr(-state.anaRange) : '0000-01-01';
  const mean = arr => arr.length ? arr.reduce((s, v) => s + v, 0) / arr.length : null;
  const sers = anaSeries();                       /* 凡例でオンのチャンネル */
  const ST = {};
  store.channels.forEach(c => { ST[c.slug] = anaStats(A[c.slug] || { kpi:[], pubs:[], daily:[] }); });

  /* ── 凡例（押すと表示のオン／オフ）────────────────────────── */
  const legend = `<div class="chlegend">${store.channels.map(c => {
      const m = chMeta(c.slug), on = !state.anaOff[c.slug];
      return `<button class="chchip" data-anach="${esc(c.slug)}" aria-pressed="${on}" style="--chac:${m.accent}">
        <i></i>${m.icon} ${esc(m.name)}</button>`;
    }).join('')}
    <span class="hint">押すと表示を消せます・グラフの縦軸は表示中でいちばん大きいチャンネルに合わせます</span></div>`;

  /* ── ① チャンネルの現在地 ───────────────────────────────────
     行＝指標（大分類ごとに見出し行）・列＝チャンネル の縦持ち。横持ちは列が15本になり
     PC でも 1,955px で収まらなかった（2026-09-04）。各行に「いつからいつまで」「目安」を明記する。
     期間の札は**表示中のチャンネルすべて**の記録から出す（#538）。開設日が違えば記録の
     長さも違うので、先頭の1本だけを見ると、他のチャンネルの増え方を別の期間のものとして
     読んでしまう。 */
  const md = t => t ? fmtMDW(t + 'T00:00:00+09:00') : '—';
  const st0 = sers.length ? ST[sers[0].ch] : null;
  const stAll = sers.map(s => ST[s.ch]).filter(Boolean);
  const pick = f => stAll.map(f).filter(Boolean);
  const minT = ts => ts.length ? ts.reduce((a, b) => a < b ? a : b) : null;
  const maxT = ts => ts.length ? ts.reduce((a, b) => a > b ? a : b) : null;
  /* いつからいつまで — 表示中のチャンネルで最も早い開始と最も遅い終わり */
  const span = (fa, fb) => {
    const a = minT(pick(fa)), b = maxT(pick(fb));
    return (a && b) ? `${md(a)} → ${md(b)}` : '記録が2日分たまると出ます';
  };
  /* 行の名前は「表示中のチャンネルが全部 30日ぶんの記録を持つ」ときだけ直近30日と名乗る
     （#536 低 → #538）。記録が 08/24 から 09/04 の11日しか無いのに「直近30日」と書くと、
     増え方を30日のものとして読んでしまう。足りないときは実際にある日数を名前にする
     （チャンネルで長さが違う日は「11〜30日」のように幅で出す）。 */
  const gainLb = (fa, fb) => {
    const ns = stAll.map(st => (fa(st) && fb(st)) ? dayNum(fb(st)) - dayNum(fa(st)) + 1 : null)
                    .filter(n => n != null).map(n => Math.min(30, n));
    if (!ns.length || ns.every(n => n >= 30)) return '直近30日';
    const lo = Math.min(...ns), hi = Math.max(...ns);
    return `記録のある期間（${lo === hi ? lo : `${lo}〜${hi}`}日）`;
  };
  const delta = (v, unit) => v == null ? '—' : `${v >= 0 ? '+' : ''}${nf(v)} ${unit}`;
  /* 登録者の記録が1つも無い番組（投稿先が未定の番組など）は、0% ではなく「—」にする（現在地の「いま」と同じ・#604 A10） */
  const mnOf = (st, t) => {
    if (st.latestSubs == null) return '—';
    const p1 =Math.min(1, (st.latestSubs || 0) / t.subs), p2 = Math.min(1, st.totalViews / t.plays);
    const pct = Math.min(p1, p2) * 100;
    return `${pct.toFixed(pct < 1 ? 2 : 1)}%<span class="sub subw">登録者 ${nf(st.latestSubs || 0)}/${nf(t.subs)}・再生 ${axNum(st.totalViews)}/${axNum(t.plays)}</span>`;
  };
  /* 行の定義。cell(st) がチャンネル1つぶんのセル HTML を返す */
  const GROUPS = [
    { nm:'登録者', rows:[
      { lb:'いま', note:`${md(maxT(pick(st => st.subsLatestT)))} の朝の実数`, cell: st => st.latestSubs == null ? '—' : `${nf(st.latestSubs)} 人` },
      { lb:'先週比', note: span(st => st.s7t, st => st.subsLatestT), cell: st => delta(st.subsDelta, '人') },
      { lb: gainLb(st => st.s30t, st => st.subsLatestT),
        note: span(st => st.s30t, st => st.subsLatestT), cell: st => delta(st.subsGain30, '人') }
    ]},
    { nm:'再生数', rows:[
      { lb:'累計', note:'投稿済の動画の合計', cell: st => `${nf(st.totalViews)} 回` },
      { lb:'先週比', note: span(st => st.c7t, st => st.cumLatestT), cell: st => delta(st.viewsDelta, '回') },
      { lb: gainLb(st => st.c30t, st => st.cumLatestT),
        note: span(st => st.c30t, st => st.cumLatestT), cell: st => delta(st.viewsGain30, '回') }
    ]},
    { nm:'視聴の質', rows:[
      { lb:'平均視聴率', note:`計測できた動画の平均・目安 ${goalTxt('rate')}（仮の値）`, cell: st => st.avgRate == null ? '—' : `${st.avgRate.toFixed(1)}%<span class="sub">計測済 ${st.rates.length}/${st.posted.length} 本</span>` },
      { lb:`${goalTxt('rate')}に到達`, note:'平均視聴率が目安を超えた本数（仮の値）',
        cell: st => st.gRates.length ? `${st.rateHit} 本<span class="sub">${Math.round(st.rateHit / st.gRates.length * 100)}%</span>` : '—' },
      { lb:'冒頭の維持', note:`計測できた動画の平均・目安 ${goalTxt('hook')}（仮の値）`, cell: st => st.hookAvg == null ? '—' : st.hookAvg.toFixed(2) }
    ]},
    { nm:'投稿', rows:[
      { lb:'直近7日', note: st0 ? `${md(st0.wkFrom)} 〜 ${md(st0.wkTo)}（今日を含む7日間）` : '—', cell: st => `${st.weekPosts} 本` },
      { lb:'投稿済', note:'これまでの合計', cell: st => `${st.posted.length} 本` },
      { lb:'最新の公開', note:'日付と動画の番号', cell: st => st.lastPub ? `${esc(fmtMDW(st.lastPub.published_at))}<span class="sub">${esc(st.lastPub.seq)}</span>` : '—' }
    ]},
    { nm:'収益化までの達成率', rows:[
      { lb:'早期アクセス', note:'登録者 500 と再生 300万・低い方', cell: st => mnOf(st, MONETIZE[0]) },
      { lb:'広告収益', note:'登録者 1,000 と再生 1,000万・低い方', cell: st => mnOf(st, MONETIZE[1]) }
    ]}
  ];
  /* 大分類ごとに小さな表を1つずつ作り、横に並べる（幅いっぱいに使って縦を短く・2026-09-04）。
     各表: 見出し帯＝大分類名＋チャンネルの色チップ、行＝指標（名前の下に期間・目安）、列＝チャンネル */
  const nowBlocks = sers.length ? GROUPS.map(g => `<div class="nowblk"><table>
      <thead><tr><th>${esc(g.nm)}</th>${sers.map(s => `<th class="num" title="${esc(s.name)}"><span class="chcell">${chSw(s.color)}${s.icon}</span></th>`).join('')}</tr></thead>
      <tbody>${g.rows.map(r => `<tr><th class="lb">${esc(r.lb)}<span class="subm">${esc(r.note)}</span></th>${
        sers.map(s => `<td class="num">${r.cell(ST[s.ch], s.ch)}</td>`).join('')}</tr>`).join('')}</tbody>
    </table></div>`).join('')
    : `<div class="noitem">表示するチャンネルがありません</div>`;
  const nowCard = `<div class="card span2">
      <div class="sectionhead" style="margin:0 0 var(--sp-2)"><h2>チャンネルの現在地</h2>
        <span class="axh">登録者と再生数は毎朝6時に取り込んだ実数。視聴の質は計測できた動画だけの値。収益化は2条件（登録者・再生数）の達成率のうち低い方。列の色チップ＝チャンネル（${sers.map(s => `${s.icon} ${esc(s.name)}`).join('・')}）</span></div>
      <div class="nowgrid">${nowBlocks}</div>
    </div>`;

  /* ── 期間切替（登録者・再生数の2つのグラフで共有）───────────── */
  const ranges = [{v:30, lb:'30日'}, {v:90, lb:'90日'}, {v:0, lb:'全部'}];
  const rangeBtns = `<div class="chips rangebtns">${ranges.map(r =>
    `<button class="rgbtn" data-anarange="${r.v}" aria-pressed="${state.anaRange === r.v}">${r.lb}</button>`).join('')}</div>`;
  /* 縦軸を合わせるチャンネル（案②・オーナー決定 2026-09-04）。表示中のチャンネルから選ぶ。
     選んだものが消えていたら先頭に戻す。1チャンネルならボタンは出さない */
  /* 縦軸は**表示中でいちばん数が大きいチャンネル**に自動で合わせる（オーナー決定 2026-09-29 16:58）。
     合わせる先を選ぶチップの段はなくした——小さいチャンネルを見たいときは、大きいチャンネルを
     凡例のチップで消せば縦軸がそちらに合う。グラフごとに決める（登録者と再生数で大小が違いうる） */
  const axisOf = (list, key) => {
    let best = null, bv = -Infinity;
    for (const x of list) { const v = Math.max(...x.rows.map(r => Number(r[key]) || 0)); if (v > bv) { bv = v; best = x.ch; } }
    return best;
  };

  /* ── ② 登録者の推移（チャンネルを重ねる）───────────────────── */
  const subsSer = sers.map(s => ({ ...s, rows: ST[s.ch].subsAll.filter(r => r.t >= from) }))
    .filter(s => s.rows.length >= 2);
  let subsCard;
  if (subsSer.length) {
    chartReg.push({ sel:'#c-subs', build: W => lineChart(subsSer, W, {unit:'人', label:'登録者の推移', id:'subs', axis:axisOf(subsSer, 'v')}) });
    const days = [...new Set(subsSer.reduce((a2, s) => a2.concat(s.rows.map(r => r.t)), []))].sort();
    const step = Math.max(1, Math.ceil(days.length / 8));
    const pick = days.filter((_, i, arr) => i === 0 || i === arr.length - 1 || i % step === 0);
    const mini = `<div class="tblwrap"><table><thead><tr><th>日付</th>${
      subsSer.map(s => `<th class="num">${chSw(s.color)}${esc(s.name)}</th>`).join('')}</tr></thead><tbody>${
      pick.map(t => `<tr><td>${esc(fmtDate(t) || t)}</td>${subsSer.map(s => {
        const r = s.rows.find(x => x.t === t);
        return `<td class="num">${r ? nf(r.v) : '—'}</td>`;
      }).join('')}</tr>`).join('')}</tbody></table></div>`;
    const caps = subsSer.map(s => {
      const f = s.rows[0], l = s.rows[s.rows.length - 1], d = l.v - f.v;
      return `<div>${chSw(s.color)}${esc(s.name)}　${esc(fmtDate(f.t) || f.t)} <b>${nf(f.v)}</b> → ${esc(fmtDate(l.t) || l.t)} <b>${nf(l.v)}</b>（<span style="color:var(--up);font-weight:700">${d >= 0 ? '+' : ''}${nf(d)}</span>）</div>`;
    }).join('');
    subsCard = `<div class="card">
        <div class="sectionhead" style="margin:0 0 var(--sp-2)"><h2>登録者の推移</h2>
          <span class="axh">横軸＝日付・縦軸＝登録者数（人）。点にふれるとその日の数が出ます</span></div>
        <div class="chartwrap" id="c-subs"></div>
        <div class="sparkcap">${caps}</div>
        <button class="tbltoggle" data-tbl="subs">${state.anaTbl.subs ? '表を閉じる' : '表で見る'}</button>
        <div class="minitbl wide ${state.anaTbl.subs ? 'show' : ''}" data-tbl="subs">${mini}</div>
      </div>`;
  } else {
    subsCard = `<div class="card">
        <div class="sectionhead" style="margin:0 0 var(--sp-2)"><h2>登録者の推移</h2></div>
        <div class="noitem">データ蓄積待ち<span class="s">登録者数の記録が2日分たまると推移を描きます</span></div>
      </div>`;
  }

  /* ── ② 再生数の推移 ────────────────────────────────────────── */
  const cumSer = sers.map(s => ({ ...s, rows: ST[s.ch].cumAll.filter(r => r.t >= from) }))
    .filter(s => s.rows.length >= 2);
  let playsCard;
  if (cumSer.length) {
    chartReg.push({ sel:'#c-plays', build: W => playsChart(cumSer, W, {axis:axisOf(cumSer, 'cum')}) });
    const days = [...new Set(cumSer.reduce((a2, s) => a2.concat(s.rows.map(r => r.t)), []))].sort();
    const step = Math.max(1, Math.ceil(days.length / 8));
    const pick = days.filter((_, i, arr) => i === 0 || i === arr.length - 1 || i % step === 0);
    const mini = `<div class="tblwrap"><table><thead><tr><th>日付</th>${
      cumSer.map(s => `<th class="num" colspan="2">${chSw(s.color)}${esc(s.name)}</th>`).join('')}</tr>
      <tr><th></th>${cumSer.map(() => `<th class="num">この日</th><th class="num">累計</th>`).join('')}</tr></thead><tbody>${
      pick.map(t => `<tr><td>${esc(fmtDate(t) || t)}</td>${cumSer.map(s => {
        const r = s.rows.find(x => x.t === t);
        return `<td class="num">${r && r.inc != null ? '+' + nf(r.inc) : '—'}</td><td class="num">${r ? nf(r.cum) : '—'}</td>`;
      }).join('')}</tr>`).join('')}</tbody></table></div>`;
    playsCard = `<div class="card">
        <div class="sectionhead" style="margin:0 0 var(--sp-2)"><h2>再生数の推移</h2>
          <span class="axh">上段＝1日にどれだけ再生されたか（回／日・同じ日のチャンネルは横に並べています）・下段＝それまでの合計（累計 回）。横軸はどちらも日付</span></div>
        <div class="chartwrap" id="c-plays"></div>
        <button class="tbltoggle" data-tbl="plays">${state.anaTbl.plays ? '表を閉じる' : '表で見る'}</button>
        <div class="minitbl wide ${state.anaTbl.plays ? 'show' : ''}" data-tbl="plays">${mini}</div>
      </div>`;
  } else {
    playsCard = `<div class="card">
        <div class="sectionhead" style="margin:0 0 var(--sp-2)"><h2>再生数の推移</h2></div>
        <div class="noitem">データ蓄積待ち<span class="s">再生数の記録が2日分たまると推移を描きます</span></div>
      </div>`;
  }

  /* ── ③ 公開順に見る平均視聴率 ──────────────────────────────── */
  const scat = sers.reduce((acc, s) => acc.concat(
    ST[s.ch].posted.filter(p => p.published_at && numOrNull(p.avg_view_rate_pct) != null)
      .map(p => ({ d: Math.round(new Date(p.published_at).getTime() / DAY), at:p.published_at,
                   v:Number(p.avg_view_rate_pct), seq:p.seq, name:s.name, color:s.color,
                   goal:goalVid(p), title:(p.effective_title || '').slice(0, 40) }))), [])
    .sort((x, y) => x.d - y.d);
  let scatCard;
  if (scat.length) {
    chartReg.push({ sel:'#c-scatter', build: W => scatterChart(scat, W, {thr:ANA_GOAL.rate.thr}) });
    scatCard = `<div class="card span2">
      <div class="sectionhead" style="margin:0 0 var(--sp-2)"><h2>公開順に見る平均視聴率</h2>
        <span class="axh">${esc(ANA_DEF.rate)}。横軸＝公開日・縦軸＝平均視聴率（%）。1つの点が動画1本。点にふれるとチャンネル名・番号・タイトルが出ます</span></div>
      <div class="chartwrap" id="c-scatter"></div>
      <div class="distlegend">${sers.map(s => `<span>${chSw(s.color)}${esc(s.name)}</span>`).join('')}
        ${scat.some(i => i.goal) ? `<span><i class="sw" style="background:var(--ink-2)"></i>塗りつぶし＝${goalTxt('rate')}に到達</span>
        <span><i class="sw" style="background:transparent;box-shadow:inset 0 0 0 2px var(--ink-2)"></i>白抜き＝未達</span>
        <span style="color:var(--crit)">┈ ${goalTxt('rate')}の線</span>` : ''}</div>
      <p class="axnote">${esc(ANA_GOAL_SCOPE)}。${esc(ANA_GOAL_NG_TXT)}（点は塗りつぶしで出しています）</p>
    </div>`;
  } else {
    scatCard = `<div class="card span2">
      <div class="sectionhead" style="margin:0 0 var(--sp-2)"><h2>公開順に見る平均視聴率</h2></div>
      <div class="noitem">計測できた動画がまだありません</div></div>`;
  }

  /* ── ④ 視聴の質（4つの分布・チャンネルごとに同じ区分で横並び）───── */
  const qBlock = (id, title, key, pick, gpick, big) => {
    /* 目安を持たない指標（序盤の離脱）は ANA_SCALE の表示設定だけで描く */
    const hasGoal = !!ANA_GOAL[key];
    const cfg = ANA_GOAL[key] || ANA_SCALE[key];
    /* values＝棒に積む全部の値 / gvalues＝目安に照らして数える値（02 の E系を除く）。
       判定する値が1本も無い系列（02 の E系だけ）は goal を立てない＝線も軸への閾値も白抜きも出さない */
    const groups = sers.map(s => ({ ...s, values: pick(ST[s.ch]), gvalues: gpick(ST[s.ch]) }))
      .map(g => ({ ...g, goal: hasGoal && g.gvalues.length > 0 }))
      .filter(g => g.values.length);
    const goalTxt = !hasGoal ? '' : (cfg.dir > 0 ? `${cfg.fmt(cfg.thr)}${cfg.unit}以上` : `${cfg.fmt(cfg.thr)}${cfg.unit}以下`);
    const head = `<h3>${esc(title)}${hasGoal ? `<span class="goal">目安 ${goalTxt}</span>` : ''}</h3>
      <p class="defline">${esc(ANA_DEF[key])}</p>`;
    if (!groups.length) return `<div class="qblk${big ? ' big' : ''}">${head}
      <div class="noitem">計測できた動画がまだありません</div></div>`;
    chartReg.push({ sel:'#' + id, build: W => histogram(groups, cfg, W, big ? 190 : 158) });
    const tbl = `<table class="qtbl"><thead><tr><th>チャンネル</th><th>平均</th><th>目安に到達</th><th>計測済</th></tr></thead><tbody>${
      groups.map(g => {
        const hit = g.gvalues.filter(v => cfg.dir > 0 ? v >= cfg.thr : v <= cfg.thr).length;
        return `<tr><td>${chSw(g.color)}${esc(g.name)}</td>
          <td>${cfg.fmt(mean(g.values))}${cfg.unit}</td>
          <td>${(g.goal && g.gvalues.length) ? `${hit} 本（${Math.round(hit / g.gvalues.length * 100)}%）` : '—'}</td>
          <td>${g.values.length} / ${ST[g.ch].posted.length} 本</td></tr>`;
      }).join('')}</tbody></table>`;
    return `<div class="qblk${big ? ' big' : ''}">${head}
      <p class="axnote">横軸＝${esc(title)}の区分（幅${cfg.fmt(cfg.step)}${cfg.unit}）・縦軸＝その区分に入る動画の本数</p>
      ${tbl}
      <div class="chartwrap" id="${id}"></div>
      ${groups.some(g => g.goal) ? `<div class="distlegend"><span><i class="sw" style="background:var(--ink-2)"></i>塗りつぶし＝目安に到達</span>
        <span><i class="sw" style="background:transparent;box-shadow:inset 0 0 0 2px var(--ink-2)"></i>白抜き＝未達</span>
        <span style="color:var(--crit)">┊ 目安の線</span></div>
      <p class="axnote">${esc(ANA_GOAL_SCOPE)}</p>`
      : hasGoal ? `<p class="axnote">${esc(ANA_GOAL_SCOPE)}。${esc(ANA_GOAL_NG_TXT)}（映っているのがその回だけなので、線を引かず塗りつぶしで出しています）</p>`
      : `<p class="axnote">この指標には目安の線を置いていません（単独では良し悪しを言えないため）</p>`}
    </div>`;
  };
  const qualCard = `<div class="card span2">
      <div class="sectionhead" style="margin:0 0 var(--sp-2)"><h2>視聴の質</h2></div>
      <p class="axnote">棒の色＝チャンネル。同じ区分の棒は横に並べています（積み上げていません）</p>
      <div class="qgrid">
        ${qBlock('c-h-rate', '平均視聴率', 'rate', st => st.rates, st => st.gRates, true)}
        ${qBlock('c-h-hook', '冒頭の維持', 'hook', st => st.hooks, st => st.gHooks, true)}
        ${qBlock('c-h-end', '末尾の維持', 'end', st => st.ends, st => st.gEnds, false)}
        ${qBlock('c-h-loss', '序盤の離脱', 'loss', st => st.losses, st => st.gLosses, false)}
      </div>
    </div>`;

  /* ── ⑤ 収益化の予実（チャンネルごとにメーター2本）──────────── */
  const monet = `<div class="card"><div class="sectionhead" style="margin:0 0 var(--sp-2)"><h2>収益化の予実</h2></div>
    <p class="axnote">2つの条件（登録者・再生数）の両方を満たすと収益化。達成率は低い方の条件で出しています</p>
    ${sers.map(s => {
      const st = ST[s.ch], subsNow = st.latestSubs || 0;
      /* 登録者の記録が無い番組はメーターを出さない（0/500 と並ぶと、始まっているのに伸びていないように見える） */
      if (st.latestSubs == null) {
        return `<div class="monetch"><div class="monethd">${chSw(s.color)}${s.icon} ${esc(s.name)}</div>
          <div class="noitem">まだ数字がありません<span class="s">登録者の記録が始まると出ます</span></div></div>`;
      }
      return `<div class="monetch"><div class="monethd">${chSw(s.color)}${s.icon} ${esc(s.name)}</div>
        ${MONETIZE.map(t => {
          const p1 = Math.min(1, subsNow / t.subs), p2 = Math.min(1, st.totalViews / t.plays), p = Math.min(p1, p2);
          return `<div class="meterblk">
            <div class="mh"><span class="nm">${esc(t.nm)}</span><span class="pc">${(p * 100).toFixed(1)}%</span></div>
            <div class="track"><div class="fill" style="width:${Math.max(p * 100, 0.6).toFixed(2)}%;background:${s.color}"></div></div>
            <div class="cond">登録者 ${nf(subsNow)} / ${nf(t.subs)}（${(p1 * 100).toFixed(1)}%）　・　再生 ${nf(st.totalViews)} / ${nf(t.plays)}（${(p2 * 100).toFixed(2)}%）</div>
            <div class="pace">${esc(paceLine('登録者', subsNow, t.subs, st.subsGain30, '人'))}</div>
            <div class="pace">${esc(paceLine('再生', st.totalViews, t.plays, st.viewsGain30, '回'))}</div>
          </div>`;
        }).join('')}</div>`;
    }).join('') || `<div class="noitem">表示するチャンネルがありません</div>`}</div>`;

  /* ── ⑥ 公開後7日の初速（チャンネル混在・新しい順）──────────────
     日次の記録は毎朝6時の1点なので「公開日+7日以降で最初に取れた記録の再生数」を初速とする。
     記録が公開日より後から始まっている古い動画は、7日目の値が作れないので出さない。 */
  const today = jstDateStr(0);
  const velo = [];
  sers.forEach(s => {
    const st = ST[s.ch];
    st.posted.filter(p => p.published_at).forEach(p => {
      const q0 = partsOf(new Date(p.published_at), {year:'numeric', month:'2-digit', day:'2-digit'});
      const pdStr = `${q0.year}-${q0.month}-${q0.day}`;
      const target = jstAdd(pdStr, 7);
      const arr = st.recs.get(p.id) || [];
      if (!arr.length || arr[0].date > jstAdd(pdStr, 1)) return;   /* 記録が公開に間に合っていない古い動画 */
      const hit = arr.find(r => r.date >= target);
      if (hit) velo.push({ p, s, at:p.published_at, v:Number(hit.views) || 0 });
      else if (today < target) velo.push({ p, s, at:p.published_at, v:null });
    });
  });
  velo.sort((x, y) => new Date(y.at) - new Date(x.at));
  const veloMax = Math.max(1, ...velo.map(x => x.v || 0));
  const veloCard = `<div class="card">
      <div class="sectionhead" style="margin:0 0 var(--sp-2)"><h2>公開後7日の初速</h2></div>
      <p class="axnote">公開から7日たった時点の再生数。チャンネルを混ぜて新しい動画が上。棒の色＝チャンネル・長さは中でいちばん多い動画との比べ方</p>
      ${velo.length ? `<div class="hbars">${velo.map(x => `<div class="hbar">
          <span class="hlb">${chSw(x.s.color)}<b>${esc(x.p.seq)}</b> ${esc((x.p.effective_title || '').slice(0, 22))}</span>
          <span class="htrack">${x.v == null ? '' : `<span class="hfill" style="width:${Math.max(1.5, x.v / veloMax * 100).toFixed(1)}%;background:${x.s.color}"></span>`}</span>
          <span class="hval${x.v == null ? ' dim' : ''}">${x.v == null ? '7日未満' : nf(x.v)}</span>
        </div>`).join('')}</div>`
      : `<div class="noitem">まだ出せる動画がありません<span class="s">公開の日から日次の記録がそろっている動画が、公開7日を過ぎると出ます</span></div>`}
    </div>`;

  /* ── ⑦ 動画別の成績（全チャンネルを1つの表に・列見出しで並べ替え）── */
  const allPosted = sers.reduce((acc, s) => acc.concat(
    ST[s.ch].posted.map(p => ({ ...p, _chName:s.name, _chColor:s.color }))), []);
  const sk = state.anaSort || {k:'published_at', dir:-1};
  const perf = allPosted.slice().sort((x, y) => {
    const a1 = perfVal(x, sk.k), b1 = perfVal(y, sk.k);
    if (a1 == null && b1 == null) return 0;
    if (a1 == null) return 1;          /* 値なしは常に下 */
    if (b1 == null) return -1;
    if (typeof a1 === 'string') return sk.dir * a1.localeCompare(b1, 'ja');
    return sk.dir * (a1 - b1);
  });
  /* 赤字（目安を割った値）は全チャンネルに付ける（02 の E系を除く）。序盤の離脱は単独では良し悪しを
     言えない指標なので、どのチャンネルでも色を付けない（正本 scene-taxonomy.md §2-1b） */
  const bad = (v, k, p) => v != null && goalVid(p) && v < ANA_GOAL[k].thr;
  const cell = (v, k, fmt, p) => `<td class="num${bad(v, k, p) ? ' under' : ''}">${v == null ? '—' : fmt(v)}</td>`;
  const rows = perf.length ? perf.map(p => {
    const spk = subsPerK(p);
    return `<tr>
      <td><span class="chcell">${chSw(p._chColor)}${esc(p._chName)}</span></td>
      <td class="seq">${esc(p.seq)}</td><td class="ttl">${esc(p.effective_title)}</td>
      <td class="dim">${esc(fmtDate(p.published_at) || '—')}</td>
      <td class="num">${p.views == null ? '—' : nf(p.views)}</td>
      ${cell(numOrNull(p.avg_view_rate_pct), 'rate', v => v.toFixed(1) + '%', p)}
      ${cell(numOrNull(p.hook_awr), 'hook', v => v.toFixed(2), p)}
      ${cell(numOrNull(p.end_awr), 'end', v => v.toFixed(2), p)}
      <td class="num">${p.early_loss_pct == null ? '—' : Number(p.early_loss_pct).toFixed(1) + '%'}</td>
      <td class="num">${p.engaged_rate_pct == null ? '—' : Number(p.engaged_rate_pct).toFixed(1) + '%'}</td>
      <td class="num">${p.subscribers_gained == null ? '—' : (p.subscribers_gained > 0 ? '+' : '') + p.subscribers_gained}</td>
      <td class="num">${spk == null ? '—' : spk.toFixed(1)}</td></tr>`;
  }).join('') : `<tr class="emptyrow"><td colspan="12">投稿済の動画がありません</td></tr>`;
  const heads = PERF_COLS.map(c => {
    const on = sk.k === c.k;
    return `<th class="${c.cls === 'num' ? 'num ' : ''}sortable${on ? ' on' : ''}" data-anasort="${c.k}"
      title="${esc(c.tip)}" aria-sort="${on ? (sk.dir < 0 ? 'descending' : 'ascending') : 'none'}">${c.lb}${on ? (sk.dir < 0 ? ' ▾' : ' ▴') : ''}</th>`;
  }).join('');
  const perfCard = `<div class="card span2">
      <div class="sectionhead" style="margin:0 0 var(--sp-2)"><h2>動画別の成績</h2></div>
      <p class="axnote">上の凡例でチャンネルを絞り込めます。列の名前を押すと並べ替わります。赤い字は目安を割った値（平均視聴率 ${goalTxt('rate')}未満・冒頭の維持 ${goalTxt('hook')}未満・末尾の維持 ${goalTxt('end')}未満）です。${esc(ANA_GOAL_SCOPE)}。${esc(ANA_GOAL_NG_TXT)}（赤い字も付けません）。序盤の離脱は単独では良し悪しを言えないので色を付けません。値がないものは —</p>
      <div class="tblwrap perftbl xscroll"><table>
        <thead><tr>${heads}</tr></thead><tbody>${rows}</tbody></table></div>
    </div>`;

  /* ── ⑧ 指標の読み方 ────────────────────────────────────────── */
  const guide = `<details class="card span2 guide">
      <summary>指標の読み方</summary>
      <div class="tblwrap"><table>
        <thead><tr><th>言葉</th><th>意味</th><th>目安</th></tr></thead><tbody>
        <tr><td>平均視聴率</td><td class="wrap">${esc(ANA_DEF.rate)}</td><td>${goalTxt('rate')}以上</td></tr>
        <tr><td>冒頭の維持</td><td class="wrap">${esc(ANA_DEF.hook)}</td><td>${goalTxt('hook')}以上</td></tr>
        <tr><td>末尾の維持</td><td class="wrap">${esc(ANA_DEF.end)}</td><td>${goalTxt('end')}以上</td></tr>
        <tr><td>序盤の離脱</td><td class="wrap">${esc(ANA_DEF.loss)}</td><td>—（単独の目安は置かない・診断用）</td></tr>
        <tr><td>エンゲージ率</td><td class="wrap">${esc(ANA_DEF.eng)}</td><td>高いほど良い</td></tr>
        <tr><td>千再生あたり登録</td><td class="wrap">${esc(ANA_DEF.spk)}</td><td>高いほど良い</td></tr>
        <tr><td>登録者数</td><td class="wrap">チャンネル登録者の実数</td><td>—</td></tr>
        <tr><td>再生数</td><td class="wrap">動画が再生された回数。累計はそれまでの合計</td><td>—</td></tr>
        </tbody></table></div>
      <p class="axnote">数字はすべて毎朝6時に更新しています。計測できた動画だけを集計に入れています。色はチャンネルを表し、<b>目安のある指標では</b>塗りつぶし／白抜きが目安に到達したかどうかを表します（目安を置いていない序盤の離脱は全部塗りつぶし）</p>
      <p class="axnote">${esc(ANA_GOAL_SCOPE)}。${esc(ANA_GOAL_NG_TXT)}</p>
    </details>`;

  el.innerHTML = `
    <div class="pagehead">
      <div class="eyebrow">分析</div>
      <h1>📈 チャンネル横断の成績</h1>
      <p>公開済みの動画とチャンネルの数字を毎朝6時に取り込んで集計しています。</p>
    </div>
    ${legend}
    <div class="anahead">${rangeBtns}<span class="anarange">推移のグラフは${esc(anaRangeLabel())}</span></div>
    <div class="anagrid">
      ${nowCard}
      ${subsCard}
      ${playsCard}
      ${scatCard}
      ${qualCard}
      ${monet}
      ${veloCard}
      ${perfCard}
      ${guide}
    </div>`;
  drawSpark();
}

/* 「YYYY-MM-DD」に日を足す（JST の暦日で数える） */
function jstAdd(dstr, days){
  const t = new Date(dstr + 'T00:00:00+09:00').getTime() + days * DAY;
  const p = partsOf(new Date(t), {year:'numeric', month:'2-digit', day:'2-digit'});
  return `${p.year}-${p.month}-${p.day}`;
}

/* 登録済みのグラフを、いまの実寸の幅で描き直す（初回描画とリサイズの両方から呼ぶ） */
function drawSpark(){
  chartReg.forEach(c => {
    const wrap = $(c.sel);
    if (!wrap) return;
    const W = Math.round(wrap.clientWidth || 0);
    if (W < 40) return;
    let r;
    try { r = c.build(Math.max(240, W)); }
    catch (_) { return; }   /* 1つのグラフの失敗で画面全体を壊さない */
    wrap.innerHTML = r.html;
    bindHover(wrap, r.pts, r.mode);
  });
}
/* ══ ④ 決まりの一覧・Blender素材の一覧（#574・オーナー決定 2026-09-29）═══════════════
   読むだけの2画面（旧「運営」タブの代わり）。本文は DB のビューから**ログイン後にだけ**読む
   （公開ページには書かない）。絞り込みは画面の中でする（行は百件ほどで、全部取ってから絞る）。
     決まり … v_production_rules_current（080）。いま有効な版だけ
     素材   … v_production_assets。ビューが無い・読めないときは「素材なし」を出して止まらない
   行は <details> で、押すと中身が開く。開いている行は絞り込みを変えても開いたまま（下の rulesOpen / assetsOpen） */
const RULE_KINDS = ['規則', '方針', '知見', '仮説'];
/* 種類ごとの行の色（CSS の .rl.k-*）。ここに無い種類は色を付けない */
const RULE_KIND_CLS = {'規則':'k-rule', '方針':'k-policy', '知見':'k-insight', '仮説':'k-hypo'};
const RULE_STRENGTHS = ['必須', '推奨', '参考'];
const ASSET_KINDS = ['材質', '部品', '景色', '動きの型', '強調', '検査'];
const rulesOpen = new Set(), assetsOpen = new Set();
document.addEventListener('toggle', e => {
  const d = e.target;
  if (!d || !d.dataset) return;
  if (d.dataset.rno) (d.open ? rulesOpen.add(d.dataset.rno) : rulesOpen.delete(d.dataset.rno));
  else if (d.dataset.akey) (d.open ? assetsOpen.add(d.dataset.akey) : assetsOpen.delete(d.dataset.akey));
}, true);
const chName = slug => store.chNames[slug] || slug;
/* 番組の短い呼び名と並び順（登録簿の順。無い番組は後ろ） */
const chShort = slug => CH_SHORT[slug] || chName(slug);
const CH_RANK = Object.keys(CH_SHORT);
const chRank = slug => { const i = CH_RANK.indexOf(slug); return i < 0 ? CH_RANK.length : i; };
const byChRank = (a, b) => chRank(a) - chRank(b) || String(a).localeCompare(String(b));
const KV_NONE = '<span class="none">なし</span>';
/* 見出しと中身の並び（中身は HTML。空は「なし」） */
const kvHTML = rows => `<dl class="kv">${rows.map(([k, v]) =>
  `<dt>${esc(k)}</dt><dd>${v == null || v === '' ? KV_NONE : v}</dd>`).join('')}</dl>`;
const kvText = s => (s == null || String(s).trim() === '') ? '' : esc(s);

async function loadRules(){
  if (store.rules) return store.rules;
  store.rules = await q(sb.from('v_production_rules_current')
    .select('rule_no,version,kind,strength,all_channels,channels,stages,subject,body,applies_when,exceptions,pass_criteria,check_method,judged_by,examples,basis,change_reason,created_at')
    .order('rule_no', { ascending: true }));
  return store.rules;
}
/* 見出しを押して絞り込む列（#572・オーナー 2026-09-30 17:25「エクセルみたいにヘッダー部分を押すとフィルター」）。
   キーは state.rulesF のキー、値は見出しの言葉。押すとその列の値の一覧がチェックつきの窓で出る（全部チェック＝絞らない） */
const RF_COLS = {kind:'種類', strength:'強さ', ch:'番組', subject:'対象', stage:'工程'};
/* Blender素材の一覧も同じ形で絞る（#572・オーナー 2026-09-30 20:30「こっちも同じフィルターにしてほしい」）。キーは state.assetsF のキー */
const AF_COLS = {kind:'種類', ch:'番組', seq:'使った動画'};
let rulesOpts = {};   /* 列ごとの値の一覧 {v, t}（renderRules が行と番組の登録簿から作る） */
let assetsOpts = {};  /* 同じく素材の列ごとの値の一覧（renderAssets が行から作る） */
/* 見出しを押して絞る表（ルール・素材・動画の一覧で窓・印・閉じ方を共用）。view＝窓を置く画面（一覧の外）、list＝一覧、
   cols＝押せる列、f＝絞り込みの状態、opts＝列ごとの値の一覧、paint＝一覧の描き直し。見出しの行に data-hf＝表の名前を付ける。
   def＝列の既定の選び（null の状態でチェックが付く値）。無ければ全部の値（＝全部チェックで絞らない） */
const HF_TABLES = {
  rules:  { view: '#view-rules',  list: '#rulelist',  cols: RF_COLS, f: () => state.rulesF,  opts: () => rulesOpts,  paint: () => paintRules() },
  assets: { view: '#view-assets', list: '#assetlist', cols: AF_COLS, f: () => state.assetsF, opts: () => assetsOpts, paint: () => paintAssets() },
  /* 動画の一覧（#637）。絞り込みは DB 側（listQuery）なので、描き直しは1ページ目から取り直す（件数とページ切りも DB の数）。
     工程の既定は没を除く全部（今までどおり没は既定では出さない）。没にチェックを足すと没も出る */
  stock:  { view: '#view-stock',  list: '#stocktable', cols: SF_COLS, f: () => state.stockF,  opts: () => stockOpts,
            def: col => col === 'stage' ? (stockOpts.stage || []).filter(o => o.v !== 'dropped').map(o => o.v) : null,
            paint: () => { state.stockPage = 0; refreshStockTable(); } }
};
let rfPop = null;     /* 窓を開いている表と列 {tb, col}。閉じているときは null */
function ruleHits(){
  const f = state.rulesF, w = f.q.trim().toLowerCase();
  const text = r => [r.rule_no, r.subject, r.body, r.applies_when, r.exceptions, r.pass_criteria, r.check_method,
    ...(((r.basis || {}).owner_quotes) || []).map(x => x && x.text)].filter(v => v != null).join('\n').toLowerCase();
  const has = (sel, v) => !sel || sel.includes(v);
  /* 番組を選んだときは「選んだ番組のどれかを含む行」と「全番組の行（channels が空）」の両方を出す。
     チェックを全部外した列は1行も残さない */
  return (store.rules || []).filter(r =>
    (!f.ch || (f.ch.length > 0 && (r.all_channels || !(r.channels || []).length || r.channels.some(c => f.ch.includes(c)))))
    && (!f.stage || (r.stages || []).some(s => f.stage.includes(s)))
    && has(f.kind, r.kind)
    && has(f.strength, r.strength)
    && has(f.subject, r.subject)
    && (!w || text(r).includes(w)));
}
function ruleExamples(ex){
  const part = (arr, lb) => (Array.isArray(arr) ? arr : []).map(x => `<li><span class="exk">${lb}</span> ${
    esc(x && x.path)}${x && x.note ? `<span class="exn"> — ${esc(x.note)}</span>` : ''}</li>`).join('');
  const li = part(ex && ex.good, '良い例') + part(ex && ex.bad, '悪い例');
  return li ? `<ul class="exl">${li}</ul>` : '';
}
/* 根拠はオーナーの発言（原文と日時）と由来の動画だけ出す。記録の覚え書き（note）は作る側の内部の話なので出さない */
function ruleBasis(b){
  const qs = (((b || {}).owner_quotes) || []).map(x => `<li>「${esc(x && x.text)}」<span class="exn"> ${
    esc(fmtDT(x && x.said_at) || '')}</span></li>`).join('');
  const vids = ((b || {}).videos || []).length ? `<div class="exn">由来の動画 ${esc(b.videos.join('・'))}</div>` : '';
  return (qs ? `<ul class="exl">${qs}</ul>` : '<span class="none">オーナーの発言なし</span>') + vids;
}
/* 行の番組を登録簿の順で。全番組の行（channels が空）は null */
function ruleChList(r){
  const chs = r.channels || [];
  return (r.all_channels || !chs.length) ? null : [...chs].sort(byChRank);
}
/* 番組の列（899px 以下）と開いた中身。全番組は「全部」、ほかは短い呼び名を「・」でつなぐ
   （絞り込みの選択肢と同じ言葉。名前の途中では折り返さない） */
function ruleChHTML(r){
  const l = ruleChList(r);
  return l ? l.map(s => `<span>${esc(chShort(s))}</span>`).join('・<wbr>') : '全部';
}
/* 番組の列（900px 以上）。見出しの下の段と同じ順の欄に、当てはまる番組だけ ✓（全番組の行は全部の欄） */
function ruleChMarks(r){
  const l = ruleChList(r);
  return CH_RANK.map(s => `<span>${!l || l.includes(s) ? '✓' : ''}</span>`).join('');
}
/* 列の間の縦の線（900px 以上・#572）。見出しの行と各行の末尾に5本置き、CSS が2〜6列目の左に並べる（:nth-of-type で
   数えるので、見出しの行と行の中には、ほかに <i> を置かない）。899px 以下は隠す */
const RL_VL = '<i class="vl" aria-hidden="true"></i>'.repeat(5);
function ruleRowHTML(r){
  const no = String(r.rule_no);
  const judge = [kvText(r.check_method), r.judged_by ? '見る係: ' + esc(r.judged_by) : ''].filter(Boolean).join('\n');
  const ver = `第${esc(r.version)}版 ${esc(fmtDate(r.created_at) || '')}`
    + (r.change_reason ? `\n変更の理由: ${esc(r.change_reason)}` : '');
  const kc = RULE_KIND_CLS[r.kind], chl = ruleChList(r);
  return `<details class="rl${kc ? ' ' + kc : ''}" data-rno="${esc(no)}"${rulesOpen.has(no) ? ' open' : ''}>
    <summary class="rlrow"><span class="no">${esc(no)}</span>
      <span class="tagk kd">${esc(r.kind)}</span>
      <span class="tagk${r.strength === '必須' ? ' must' : ''}">${esc(r.strength)}</span>
      <span class="chs">${ruleChHTML(r)}</span><span class="chm" aria-hidden="true">${ruleChMarks(r)}</span>
      <span class="sb">${esc(r.subject)}</span><span class="bd">${esc(r.body)}</span>
      <span class="caret" aria-hidden="true">▸</span>${RL_VL}</summary>
    <div class="lstbody">${kvHTML([
      ['番組', chl ? esc(chl.map(chShort).join('・')) : '全部'],
      ['工程', esc((r.stages || []).join('・'))],
      ['当てはまる条件', kvText(r.applies_when)],
      ['例外', kvText(r.exceptions)],
      ['合格の条件', kvText(r.pass_criteria)],
      ['判定のしかた', judge],
      ['手本', ruleExamples(r.examples)],
      ['根拠', ruleBasis(r.basis)],
      ['版', ver]])}</div></details>`;
}
async function renderRules(){
  const el = $('#view-rules');
  if (rfPop && rfPop.tb === 'rules') closeRfPop();   /* 画面を作り直すと窓も消える */
  if (!store.rules) el.innerHTML = loading();
  let rows;
  try { rows = await loadRules(); } catch (e) { el.innerHTML = errBox(e.message); return; }
  const f = state.rulesF;
  const seen = (get) => { const s = new Set(); rows.forEach(r => [].concat(get(r) || []).forEach(v => s.add(v))); return s; };
  const stages = seen(r => r.stages), kinds = seen(r => r.kind),
        strs = seen(r => r.strength), subs = [...seen(r => r.subject)];
  const opt = v => ({ v, t: v });
  /* 決まった並び（known）のうち行にある値を先に、並びに無い値は後ろに */
  const ordered = (known, s) => [...known.filter(v => s.has(v)), ...[...s].filter(v => !known.includes(v))];
  /* 番組の値は番組の登録簿（動画の番組の一覧）から作る。行に出てこない番組も選べる（全番組の行が出る）。
     言葉と並びは番組の列と同じ（短い呼び名・登録簿の順） */
  rulesOpts = {
    ch: [...(store.pilotChannels || store.channels || [])].sort((a, b) => byChRank(a.slug, b.slug))
      .map(c => ({ v: c.slug, t: chShort(c.slug) })),
    stage: ordered(SV_STEPS.map(s => s.name), stages).map(opt),
    kind: ordered(RULE_KINDS, kinds).map(opt),
    strength: ordered(RULE_STRENGTHS, strs).map(opt),
    subject: subs.map(opt)
  };
  el.innerHTML = `
    <div class="pagehead"><div class="eyebrow">ルール</div><h1>📏 動画制作ルールDB</h1></div>
    <div class="toolbar">
      <input type="search" id="rulesq" placeholder="文字で探す" aria-label="文字で探す" value="${esc(f.q)}">
      <span class="hits" id="ruleshits"></span>
    </div>
    <div class="lst" id="rulelist"></div>`;
  paintRules();
}
function paintRules(){
  const box = $('#rulelist');
  if (!box) return;
  const hits = ruleHits(), f = state.rulesF;
  $('#ruleshits').textContent = hits.length + '件';
  const hf = col => hfBtn('rules', col);
  /* 番組の見出しは2段（900px 以上）と1つ（899px 以下）の両方を置き、幅で片方だけ出す。
     2段の下の段は、タブと同じ番組の絵文字の下に短い呼び名（番組で絞っているときは、外した番組を薄く） */
  box.style.setProperty('--chn', CH_RANK.length);
  box.innerHTML = `<div class="lsthead rl" data-hf="rules"><span class="hno">番号</span><span>${hf('kind')}</span><span>${hf('strength')}</span>`
    + `<span class="hch"><span class="hchg">${hf('ch')}</span><span class="hchm" data-rfcol="ch" aria-hidden="true">${CH_RANK.map(s =>
        `<span${f.ch && !f.ch.includes(s) ? ' class="off"' : ''}><span class="ic">${esc(CH_ICON[s] || '')}</span>`
        + `<span class="nm">${esc(chShort(s))}</span></span>`).join('')}</span></span>`
    + `<span class="hch1">${hf('ch')}</span><span>${hf('subject')}</span>`
    + `<span class="hbd"><span class="hbdt">本文</span>${hf('stage')}</span><span class="hend"></span>${RL_VL}</div>`
    + (hits.length ? hits.map(ruleRowHTML).join('')
       : `<div class="lstnone">${(store.rules || []).length ? '当てはまるルールはありません' : 'ルールなし'}</div>`);
}
/* ── 見出しの絞り込みの窓（ルール・素材で共用・#572）─────────────────────────
   窓は一覧の外（表の画面 view の直下）に置き、見出しの行のすぐ下に出す。チェックを変えるとその場で絞る。
   外を押すか Esc で閉じる。一覧の中（行など）を押したときは閉じるだけで、その行は開かない */
/* 絞り込める見出しのボタン。▾ は押せる印、絞っている列は ●。窓を開いている列は押した形（aria-expanded） */
function hfBtn(tb, col){
  const T = HF_TABLES[tb], on = !!T.f()[col];
  return `<button type="button" class="hf${on ? ' on' : ''}" data-rfcol="${col}" aria-haspopup="dialog"`
    + ` aria-expanded="${!!rfPop && rfPop.tb === tb && rfPop.col === col}">${esc(T.cols[col])}`
    + `<span class="fm" aria-hidden="true">${on ? '●' : '▾'}</span></button>`;
}
/* いま見えている、その列の見出しのボタン（ルールの番組は 900px 以上と 899px 以下で別のボタン。
   動画の一覧は広い画面の表の見出しと、スマホの一覧の先頭の札で別のボタン） */
const rfBtn = (tb, col) => [...document.querySelectorAll(`${HF_TABLES[tb].list} [data-hf="${tb}"] button[data-rfcol="${col}"]`)]
  .find(b => b.getClientRects().length);
/* 列の全部の値と、既定の選び（null の状態でチェックが付く値）と、いまチェックが付いている値 */
const hfAll = (tb, col) => (HF_TABLES[tb].opts()[col] || []).map(o => o.v);
const hfDef = (tb, col) => (HF_TABLES[tb].def && HF_TABLES[tb].def(col)) || hfAll(tb, col);
const hfOn = (tb, col) => HF_TABLES[tb].f()[col] || hfDef(tb, col);
/* 窓の上のボタン: 既定の値（def が無ければ全部の値）に全部チェックが付いていれば「すべて外す」、1つでも外れていれば
   「すべて選ぶ」。「すべて選ぶ」は既定に戻す（動画の一覧の工程は没を除く全部＝前のリセットと同じ。ルール・素材は全部の値で前と同じ） */
const hfAllOn = (tb, col) => { const on = hfOn(tb, col); return hfDef(tb, col).every(v => on.includes(v)); };
/* 開いている窓の本数を、いまの値の一覧に合わせて書き直す（動画の一覧の本数は、ほかの列と文字の検索の条件で変わる） */
function syncRfPopCounts(){
  const pop = $('#rfpop');
  if (!pop || !rfPop) return;
  const opts = HF_TABLES[rfPop.tb].opts()[rfPop.col] || [];
  pop.querySelectorAll('.rflist label').forEach(l => {
    const i = l.querySelector('input'), n = l.querySelector('.rfn'), o = i && opts.find(x => x.v === i.value);
    if (n && o && o.n != null) setText(n, nf(o.n));
  });
}
function rfPopHTML(tb, col){
  const T = HF_TABLES[tb], on = hfOn(tb, col);
  /* 件数（n）のある値は右端に件数を添える（動画の一覧の工程・ジャンル。前の工程のチップの件数と同じ数え方） */
  return `<button type="button" class="rfall" data-rfall>${hfAllOn(tb, col) ? 'すべて外す' : 'すべて選ぶ'}</button>`
    + `<div class="rflist">${(T.opts()[col] || []).map(o => `<label><input type="checkbox" value="${esc(o.v)}"${
      on.includes(o.v) ? ' checked' : ''}><span>${esc(o.t)}</span>${
      o.n != null ? `<span class="rfn">${nf(o.n)}</span>` : ''}</label>`).join('')}</div>`;
}
function placeRfPop(){
  const T = rfPop && HF_TABLES[rfPop.tb], pop = $('#rfpop');
  if (!T || !pop) return;
  const view = $(T.view), b = rfBtn(rfPop.tb, rfPop.col), head = b && b.closest('[data-hf]');
  if (!view || !head || !b) return;
  const v = view.getBoundingClientRect(), a = (b.closest('.hch') || b).getBoundingClientRect();
  /* 見出しの下端。動画の一覧の表の見出しは th が画面の上に貼り付く（thead の箱は元の位置のまま）ので、2段目の th の下端で測る */
  const cells = head.tagName === 'THEAD' ? [...head.querySelectorAll('tr:last-child > th')] : [];
  const bottom = cells.length ? Math.max(...cells.map(c => c.getBoundingClientRect().bottom)) : head.getBoundingClientRect().bottom;
  pop.style.top = Math.round(bottom - v.top + 4) + 'px';
  pop.style.left = Math.round(Math.max(0, Math.min(a.left - v.left, v.width - pop.offsetWidth))) + 'px';
}
function openRfPop(tb, col){
  closeRfPop();
  const T = HF_TABLES[tb], view = T && $(T.view);
  if (!view || !T.cols[col] || !rfBtn(tb, col)) return;
  rfPop = { tb, col };
  const pop = document.createElement('div');
  pop.id = 'rfpop'; pop.className = 'rfpop';
  pop.setAttribute('role', 'dialog'); pop.setAttribute('aria-label', T.cols[col]);
  pop.innerHTML = rfPopHTML(tb, col);
  view.appendChild(pop);
  document.querySelectorAll(`${T.list} [data-hf="${tb}"] button[data-rfcol="${col}"]`).forEach(b => b.setAttribute('aria-expanded', 'true'));
  placeRfPop();
  pop.querySelector('input')?.focus({ preventScroll: true });
}
function closeRfPop(refocus){
  const cur = rfPop;
  rfPop = null;
  $('#rfpop')?.remove();
  document.querySelectorAll('[data-hf] button[aria-expanded="true"]').forEach(b => b.setAttribute('aria-expanded', 'false'));
  if (refocus && cur) rfBtn(cur.tb, cur.col)?.focus();
}
/* 列の絞り込みを入れて一覧を描き直す。sel は残す値の配列（null＝既定に戻す）。既定の選び（def が無ければ全部の値）と
   同じになったら絞らない扱い（null） */
function setHF(tb, col, sel){
  const T = HF_TABLES[tb], f = T.f(), def = hfDef(tb, col);
  const pick = sel ? hfAll(tb, col).filter(v => sel.includes(v)) : def;
  f[col] = (pick.length === def.length && def.every(v => pick.includes(v))) ? null : pick;
  T.paint();
  const pop = $('#rfpop');
  if (!pop || !rfPop || rfPop.tb !== tb || rfPop.col !== col) return;
  const on = hfOn(tb, col);
  pop.querySelector('[data-rfall]').textContent = hfAllOn(tb, col) ? 'すべて外す' : 'すべて選ぶ';
  pop.querySelectorAll('input[type="checkbox"]').forEach(i => { i.checked = on.includes(i.value); });
}
/* 外を押したら閉じるのは pointerdown で拾う（iPhone は押せない所を押しても click を送らないため）。
   一覧の中（表の画面の中）を押して閉じたときは、そのあとに続く click（行を開く・見本を大きく見る）を1回だけ食べる */
let rfEatUntil = 0, rfEatView = '';
document.addEventListener('pointerdown', e => {
  rfEatUntil = 0;
  const t = e.target;
  if (!rfPop || !t || !t.closest || t.closest('#rfpop') || t.closest('[data-hf] [data-rfcol]')) return;
  const view = HF_TABLES[rfPop.tb].view;
  closeRfPop();
  if (t.closest(view)) { rfEatUntil = Date.now() + 1000; rfEatView = view; }
}, true);
document.addEventListener('click', e => {
  const t = e.target;
  if (!t || !t.closest) return;
  if (rfEatUntil) {
    const eat = Date.now() < rfEatUntil && t.closest(rfEatView);
    rfEatUntil = 0;
    if (eat) { e.preventDefault(); e.stopPropagation(); return; }
  }
  const hb = t.closest('[data-hf] [data-rfcol]');
  if (hb) {
    const tb = hb.closest('[data-hf]').dataset.hf, col = hb.dataset.rfcol;
    if (rfPop && rfPop.tb === tb && rfPop.col === col) closeRfPop(); else openRfPop(tb, col);
    /* 動画の一覧のジャンルはタイトルの見出し（押すと並べ替え）の中にあるので、ここで止めて並べ替えを走らせない */
    e.stopPropagation();
    return;
  }
  if (!rfPop) return;
  if (t.closest('#rfpop')) {
    if (t.closest('[data-rfall]')) setHF(rfPop.tb, rfPop.col, hfAllOn(rfPop.tb, rfPop.col) ? [] : null);
    return;
  }
  /* pointerdown を伴わない押し方（キーボードで行を開く等）も、外なら同じように閉じる */
  const inView = !!t.closest(HF_TABLES[rfPop.tb].view);
  closeRfPop();
  if (inView) { e.preventDefault(); e.stopPropagation(); }
}, true);
document.addEventListener('change', e => {
  if (!rfPop || !e.target.closest || !e.target.closest('#rfpop')) return;
  setHF(rfPop.tb, rfPop.col, [...document.querySelectorAll('#rfpop .rflist input:checked')].map(i => i.value));
});
document.addEventListener('keydown', e => {
  if (rfPop && e.key === 'Escape') { e.preventDefault(); closeRfPop(true); }
});

/* 素材の並び: 棚にある物 → 棚から外した物（下の方へ・#594）。その中で種類の並び → 名前 */
function assetCmp(a, b){
  const ki = k => { const i = ASSET_KINDS.indexOf(k); return i < 0 ? 99 : i; };
  return (a.retired_at ? 1 : 0) - (b.retired_at ? 1 : 0) || ki(a.kind) - ki(b.kind)
    || String(a.name_ja || '').localeCompare(String(b.name_ja || ''), 'ja');

async function loadProdAssets(){
  if (store.prodAssets && Date.now() - store.prodAssets.at < ASSET_CACHE) return store.prodAssets;
  let rows = [];
  try {
    rows = await q(sb.from('v_production_assets')
      .select('asset_key,name_ja,kind,call,sample_image,source,note,updated_at,used_in,retired_at,retired_reason'));
  } catch (e) {
    console.warn('[dashboard] Blender素材の一覧を読めませんでした:', e.message);   /* 画面は「素材なし」 */

  rows.sort(assetCmp);
  /* 見本の絵は非公開の置き場にあるので、まとめて署名URLにする（1時間で切れるのは他の素材と同じ） */
  const urls = {}, paths = [...new Set(rows.map(r => r.sample_image).filter(Boolean))];
  if (paths.length) {
    try {
      const { data } = await sb.storage.from(ASSET_BUCKET).createSignedUrls(paths, ASSET_TTL);
      (data || []).forEach((r, i) => { if (r && r.signedUrl) urls[r.path || paths[i]] = r.signedUrl; });
    } catch (_) { /* 取れなければ「素材なし」の面になるだけ */ }

const usedOf = r => (Array.isArray(r.used_in) ? r.used_in : []).filter(u => u && u.seq);
/* 使った動画の番号（重なりなし・番号の順）と、その番組（番号の頭2文字から・登録簿の順） */
const usedSeqs = r => [...new Set(usedOf(r).map(u => String(u.seq)))].sort((a, b) => a.localeCompare(b));
const seqCh = seq => { const p = String(seq || '').slice(0, 2).toUpperCase(); return SEQ_CH[p] || p; };
const usedChs = r => [...new Set(usedSeqs(r).map(seqCh))].sort(byChRank);
/* 絞り込みの列ごとの行の値。使った動画が無い素材は、番組・使った動画とも ''（窓では「なし」） */
function assetVals(r, col){
  if (col === 'kind') return [r.kind || ''];
  const v = col === 'ch' ? usedChs(r) : usedSeqs(r);
  return v.length ? v : [''];
}
/* チェックの付いた値のどれかに当てはまる行だけ（列の間は「かつ」）。チェックを全部外した列は1行も残さない */
function assetHits(){
  const f = state.assetsF;
  return ((store.prodAssets || {}).rows || []).filter(r =>
    Object.keys(AF_COLS).every(col => !f[col] || assetVals(r, col).some(v => f[col].includes(v))));
}
/* 出典とライセンス（081 の source）。{made_from:{type, from, license}（切り出した元）,
   external:[{name, page, license, authors[]}]（外から取ってきた物）, photos:[{title, url, license, author}]（見比べた写真）}
   を1件1行に並べる。どれにも当たらない形はそのまま文字で出す。
   オーナーが読む画面なので、フォルダのパス（/ を含む括弧）と、ライセンスの末尾の括弧書き
   （「自作（リポジトリの中だけで使う）」→「自作」）は出さない。データはそのまま */
const srcNoPath = t => String(t == null ? '' : t).replace(/\s*[（(][^（）()]*\/[^（）()]*[）)]/g, '').trim();
const srcNoNote = t => String(t == null ? '' : t).replace(/\s*[（(][^（）()]*[）)]\s*$/, '').trim();
function assetSource(s){
  if (s == null || s === '') return '';
  const list = (typeof s === 'object' && !Array.isArray(s) && ('made_from' in s || 'external' in s || 'photos' in s))
    ? [].concat(s.made_from ? [s.made_from] : [], s.external || [],
                (s.photos || []).map(p => Object.assign({ pre: '見比べた写真' }, p)))
    : (Array.isArray(s) ? s : [s]);
  return list.length ? `<ul class="exl">${list.map(x => {
    if (!x || typeof x !== 'object') return `<li>${esc(x)}</li>`;
    const from = srcNoPath(x.from || x.name || x.title || x.type || '');
    const who = [].concat(x.authors || [], x.author ? [x.author] : []).join('・');
    const lic = srcNoNote(x.license);
    const url = String(x.url || x.page || '');
    if (!from && !lic && !url) return `<li>${esc(JSON.stringify(x))}</li>`;
    return `<li>${x.pre ? `<span class="exk">${esc(x.pre)}</span> ` : ''}${esc(from)}${
      who ? `<span class="exn"> ・ ${esc(who)}</span>` : ''}${lic ? `<span class="exn"> ・ ${esc(lic)}</span>` : ''}${
      /^https?:\/\//.test(url) ? ` <a href="${esc(url)}" target="_blank" rel="noopener noreferrer">出典 ↗</a>` : ''}</li>`;
  }).join('')}</ul>` : '';
}
/* 使った動画とショット。shots はショットの番号（承認画面の目録の n と同じ）。空は動画全体で使った物 */
function assetUsed(used){
  return used.length ? `<ul class="exl">${used.map(u => `<li><b>${esc(u.seq)}</b> ${esc(u.title || '')}<div class="exn">${
    (u.shots || []).length ? 'ショット ' + esc(u.shots.join('・')) : '動画全体'}</div></li>`).join('')}</ul>` : '';
}
/* 呼び方（081 の call）。{functions:[{function, signature, doc}]（最初が主な呼び口）, …} の関数ごとに
   呼び方の1行と説明を出す。それ以外の形はそのまま文字で出す */
function assetCall(c){
  if (c && typeof c === 'object' && !Array.isArray(c) && Array.isArray(c.functions)) c = c.functions;
  const list = Array.isArray(c) ? c : (c == null || c === '') ? [] : [c];
  return list.map(x => (x && typeof x === 'object' && (x.signature || x.function))
    ? `<pre class="code">${esc(x.signature || x.function)}</pre>${x.doc ? `<div class="exn pre">${esc(x.doc)}</div>` : ''}`
    : `<pre class="code">${esc(typeof x === 'string' ? x : JSON.stringify(x, null, 1))}</pre>`).join('');
}
/* 一覧の行に出す説明（#572・オーナー 2026-09-30 20:30「名前だけでなく、どういう内容なのかもう少し一覧側で」）。
   開いたときに「呼び方」の下に出る説明文のうち、最初の関数（主な呼び口）の説明の1行目。最初の関数に説明が無ければ、
   説明のある次の関数の1行目。説明が次の行へ続くのに1行目が文の途中（「・」「、」など）で終わるときは「…」を付ける。
   長さは CSS で2行に切る（超えたら「…」） */
function assetDesc(c){
  if (c && typeof c === 'object' && !Array.isArray(c) && Array.isArray(c.functions)) c = c.functions;
  for (const x of (Array.isArray(c) ? c : [])) {
    const lines = String((x && typeof x === 'object' && x.doc) || '').split('\n').map(s => s.trim()).filter(Boolean);
    if (!lines.length) continue;
    const l = lines[0];
    return lines.length > 1 && !/[。．.）)」』]$/.test(l) ? l.replace(/[・、,，:：\s]+$/, '') + '…' : l;
  }
  return '';
}
/* 列の間の縦の線（900px 以上・#572）。見出しの行と各行の末尾に4本（見本｜名前｜種類｜番組｜使った動画 の間）。

function assetRowHTML(r, urls){

  const joinNw = list => list.map(s => `<span>${esc(s)}</span>`).join('・<wbr>');
  /* 棚から外した素材（#594）は名前の横に言葉の札（色だけで分けない）。開くと外した日と理由 */
  const retired = !!r.retired_at;
  return `<details class="al${retired ? ' retired' : ''}" data-akey="${esc(key)}"${assetsOpen.has(key) ? ' open' : ''}>
    <summary class="alrow">${thumb}<span class="nmc"><span class="nm">${esc(name)}${

      <span class="meta"><span class="tagk">${esc(r.kind || '—')}</span>
        <span class="ach">${chs.length ? joinNw(chs.map(chShort)) : '—'}</span>
        <span class="cnt"><span>${used.length}本</span>${seqs.length ? `<span class="sq">${joinNw(seqs)}</span>` : ''}</span></span>
      <span class="caret" aria-hidden="true">▸</span>${AL_VL}</summary>
    <div class="lstbody">${kvHTML([
      ...(retired ? [['棚から外した日と理由', kvText([fmtDate(r.retired_at), r.retired_reason].filter(Boolean).join(' ・ '))]] : []),
      ['出典とライセンス', assetSource(r.source)],

async function renderAssets(){

/* ══ ツールチップ ═══════════════════════════════════════════════ */
const tip = $('#tip');
function showTip(html, x, y){
  tip.innerHTML = html; tip.classList.add('on');
  const r = tip.getBoundingClientRect();
  tip.style.left = Math.max(8, Math.min(x - r.width / 2, window.innerWidth - r.width - 8)) + 'px';
  tip.style.top = Math.max(8, y - r.height - 12) + 'px';
}
const hideTip = () => tip.classList.remove('on');

/* グラフのホバー（十字線＋吹き出し）。pts は SVG 座標の点の並びで、
   {x, y, html} を持つ。mode='xy' は散布図（いちばん近い点）、既定は横方向でいちばん近い点。
   ホバーの受け皿は SVG 全面の透明な矩形なので、点そのものより広く当たる。 */
function bindHover(wrap, pts, mode){
  if (!wrap || !pts || !pts.length) return;
  const svg = wrap.querySelector('svg'); if (!svg) return;
  const vb = svg.viewBox.baseVal, W = vb.width, H = vb.height;
  if (!W || !H) return;
  const hov = svg.querySelector('.hov');
  const hl = hov && hov.querySelector('.hl');
  /* 印はチャンネルの数だけある。点が {ys:[…]} を持っていれば全チャンネルぶんを同時に置く
     （持っていなければ先頭の1つだけを使う＝散布図など1系列のグラフ） */
  const hds = hov ? [...hov.querySelectorAll('.hd')] : [];
  const move = e => {
    const r = svg.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    const px = (t.clientX - r.left) / r.width * W, py = (t.clientY - r.top) / r.height * H;
    let best = pts[0], bd = Infinity;
    for (const p of pts) {
      const d = mode === 'xy' ? Math.hypot(p.x - px, p.y - py) : Math.abs(p.x - px);
      if (d < bd) { bd = d; best = p; }
    }
    if (hov) {
      hov.style.display = '';
      if (hl) { hl.setAttribute('x1', best.x); hl.setAttribute('x2', best.x); }
      hds.forEach((hd, i) => {
        const y = best.ys ? best.ys[i] : (i === 0 ? best.y : null);
        if (y == null) { hd.style.display = 'none'; return; }
        hd.style.display = '';
        hd.setAttribute('cx', best.x); hd.setAttribute('cy', y);
      });
    }
    showTip(best.html, r.left + best.x / W * r.width, r.top + best.y / H * r.height);
  };
  const out = () => { if (hov) hov.style.display = 'none'; hideTip(); };
  svg.addEventListener('mousemove', move);
  svg.addEventListener('mouseleave', out);
  svg.addEventListener('touchstart', move, { passive: true });
  svg.addEventListener('touchmove', move, { passive: true });
  svg.addEventListener('touchend', out);
}

/* ── 1クリック承認（オーナー要望 2026-08-20 → 2026-09-23 に猶予を廃止）──────────────
   承認は押した瞬間に DB へ書く。以前は6秒の「取り消す」猶予を置いていたが、その間に
   再読み込みすると承認が記録されない（BZ0052）ので、猶予ごとやめた（オーナー決定 2026-09-23）。
   ページが消える間際に送った分は keepalive で届け、届かなかった分は承認の控え（下）が
   次に開いたとき送り直す */
window.addEventListener('pagehide', () => { leaving = true; });

/* ── 承認の控え ─────────────────────────────────────────────────────
   押した承認は、DB から返事が来るまでこのブラウザに控えておく。猶予中や送信中に
   再読み込み・タブを閉じる等でページが消えても、次にダッシュボードを開いたとき送り直す。
   版（見ていた提出物）も押した時点の値を控えるので、裏で新しい版が出ていれば DB が断る */
const APPROVE_OUTBOX = 'dash.approveOutbox';
const OUTBOX_TTL_MS = 12 * 3600 * 1000;
function outboxRead(){
  try { const a = JSON.parse(localStorage.getItem(APPROVE_OUTBOX) || '[]'); return Array.isArray(a) ? a : []; }
  catch (_) { return []; }
}
function outboxWrite(a){
  try { a.length ? localStorage.setItem(APPROVE_OUTBOX, JSON.stringify(a)) : localStorage.removeItem(APPROVE_OUTBOX); }
  catch (_) { /* 控えが使えないブラウザでも承認そのものは通る */ }
}
const sameApprove = (x, vid, gate) => x.vid === Number(vid) && x.gate === gate;
function outboxPut(e){ outboxWrite(outboxRead().filter(x => !sameApprove(x, e.vid, e.gate)).concat([e])); }
function outboxDrop(vid, gate){ outboxWrite(outboxRead().filter(x => !sameApprove(x, vid, gate))); }
async function replayApproveOutbox(){
  const list = outboxRead();
  if (!list.length || !state.user) return;
  const msgs = [];
  for (const e of list) {
    if (e.uid !== state.user.id || !(Date.now() - e.at < OUTBOX_TTL_MS)) { outboxDrop(e.vid, e.gate); continue; }
    const { data, error } = await sb.rpc('approve_gate',
      { p_video_id: e.vid, p_gate: e.gate, p_note: e.note || null, p_expected_revision: e.rev });
    outboxDrop(e.vid, e.gate);
    const who = e.seq || `#${e.vid}`, gname = gateName(e.gate, { seq: e.seq, channel: e.ch });
    if (error) msgs.push(`前回押した ${who} の${gname}は記録できませんでした: ${rpcErrText(error, 'approve')}`);
    else if (!(data && data.already_approved)) msgs.push(`前回押した ${who} の${gname}の承認を記録しました`);
  }
  if (msgs.length) toast(msgs.join(' ／ '));
}

      else if (act === 'reject-cancel')   closeRejectPanel(box);
      else if (act === 'reject-confirm')  submitReject(box, wbtn.dataset.key);
      else if (act === 'triage-retype')   submitTriage(box, wbtn.dataset.key, 'retype');
      else if (act === 'triage-produce')  submitTriage(box, wbtn.dataset.key, 'produce');
    }
    return;
  }

  /* 過去の指摘（同じ版のもの）を押したら、左列の動画をその時刻へ動かしてピンを出す（#509 段4） */
  const jrow = e.target.closest('[data-njump]');
  if (jrow && tap) {
    const p = (jrow.dataset.npin || '').split(',').map(Number);
    tapGoto(Number(jrow.dataset.njump), p.length === 2 && isFinite(p[0]) ? { x:p[0], y:p[1] } : null);
    return;
  }

  /* 詳細内の「戻る／閉じる」は履歴を戻す（popstate で一覧へ復帰・経路を一本化） */
  if (e.target.closest('[data-close]')) { history.back(); return; }

  /* Blender素材の一覧: 見本の絵を押したら大きく見る（行の中にあるので、行の開閉は止める） */
  const plb = e.target.closest('[data-plbox]');
  if (plb) { e.preventDefault(); openPlbox(plb.dataset.plbox, plb.dataset.plcap); return; }
  if (e.target.closest('[data-plbox-close]') || e.target.id === 'plbox') { closePlbox(); return; }
  /* ルール・素材・動画の一覧の絞り込みは見出しの窓（上の HF_TABLES の近く） */

  /* チャンネル名そのものを押したときは、開閉ではなく切り替えとして扱う（2026-08-20） */
  const goBtn = e.target.closest('.chgo[data-ch]');
  if (goBtn) e.preventDefault();
  const chBtn = e.target.closest('.chtab[data-ch], .chitem[data-ch], .chgo[data-ch]');
  if (chBtn) {
    state.ch = chBtn.dataset.ch; state.open = null; closeDetail(); resetStockFilters();
    /* チャンネル共通の画面（稼働・システム）から押したときは、そのチャンネルの制作へ戻す。
       戻り道が無いと「押しても何も起きない」ように見える（2026-08-20 オーナー指摘） */
    const cur = VIEWS.find(v => v.key === state.view);
    if (cur && cur.chIndep) state.view = 'stock';
    saveUI(); render(); return;
  }

  /* 画面の切り替え。下のナビ（制作・分析）と、チャンネルタブ右の共通タブ（稼働・システム）の両方 */
  const navBtn = e.target.closest('.navbtn[data-view], .chtab[data-view]');
  if (navBtn) { state.view = navBtn.dataset.view; saveUI(); render(); window.scrollTo({ top: 0 }); return; }

  /* 一覧の畳んだセクション（完了・ネタ案・没）の開閉 */
  const secBtn = e.target.closest('[data-secfold]');
  if (secBtn) {
    const k = secBtn.dataset.secfold;
    state.secOpen[k] = !state.secOpen[k];
    refreshStockTable(); return;
  }

  const sortTh = e.target.closest('.mtx th.sortable');
  if (sortTh) {
    const k = sortTh.dataset.sort, s = state.stockSort;
    state.stockSort = (s && s.key === k)
      ? (s.dir === 'asc' ? { key: k, dir: 'desc' } : null)
      : { key: k, dir: 'asc' };
    state.stockPage = 0;
    refreshStockTable(); return;
  }

  /* ページ送り（#215 Phase 2）。並べ替えは DB 側なので、ページを跨いでも順番は正しい */
  if (e.target.closest('#pgprev')) {
    if (state.stockPage > 0) { state.stockPage--; refreshStockTable(); window.scrollTo({ top: 0 }); }
    return;
  }
  if (e.target.closest('#pgnext')) {
    const c = store.core[state.ch];
    if (c && (state.stockPage + 1) * PAGE_SIZE < c.total) {
      state.stockPage++; refreshStockTable(); window.scrollTo({ top: 0 });
    }
    return;
  }

  const row = e.target.closest('.mtx tbody tr[data-vid], .scard[data-vid]');
  if (row) { pushDetail(row.dataset.vid); return; }

  /* 分析タブ「表で見る」（グラフごとに data-tbl で開閉を持つ） */
  const tgl = e.target.closest('.tbltoggle');
  if (tgl) {
    const k = tgl.dataset.tbl;
    state.anaTbl[k] = !state.anaTbl[k];
    const box = document.querySelector('.minitbl[data-tbl="' + k + '"]');
    if (box) box.classList.toggle('show', state.anaTbl[k]);
    tgl.textContent = state.anaTbl[k] ? '表を閉じる' : '表で見る';
    return;
  }
  /* 分析タブ 凡例チップ（チャンネルの表示オン／オフ）。全部消すと何も読めなくなるので、
     残り1つになったチップの消灯だけは受け付けない */
  const chc = e.target.closest('[data-anach]');
  if (chc) {
    const k = chc.dataset.anach, next = Object.assign({}, state.anaOff);
    next[k] = !next[k];
    if (store.channels.some(c => !next[c.slug])) { state.anaOff = next; renderAnalytics(); }
    return;
  }
  /* 分析タブ 推移グラフの期間切替（30日／90日／全部） */
  const rb = e.target.closest('[data-anarange]');
  if (rb) { state.anaRange = Number(rb.dataset.anarange); renderAnalytics(); return; }
  const ab = e.target.closest('[data-anaaxis]');
  if (ab) { state.anaAxis = ab.dataset.anaaxis; renderAnalytics(); return; }
  /* 分析タブ 動画別の成績の並べ替え（同じ列をもう一度押すと昇順・降順が入れ替わる） */
  const sh = e.target.closest('th[data-anasort]');
  if (sh) {
    const k = sh.dataset.anasort, cur = state.anaSort || {k:'published_at', dir:-1};
    state.anaSort = { k, dir: cur.k === k ? -cur.dir : (k === 'seq' || k === 'title' ? 1 : -1) };
    renderAnalytics(); return;
  }
  if (e.target.closest('#reloadbtn')) { if (!state.busy) reloadAll(); return; }
  if (e.target.closest('#themebtn')) {
    const cur = document.documentElement.dataset.theme;
    const dark = cur ? cur === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = dark ? 'light' : 'dark';
    render(); return;
  }
  const ub = e.target.closest('#userbtn');
  if (ub) {
    const pop = $('#menupop'); pop.hidden = !pop.hidden;
    ub.setAttribute('aria-expanded', String(!pop.hidden)); return;
  }
  if (e.target.closest('#logoutbtn')) { signOut(); return; }
  if (!e.target.closest('.usermenu')) { $('#menupop').hidden = true; $('#userbtn')?.setAttribute('aria-expanded', 'false'); }
});
/* 検索は DB へ問い合わせるので、打鍵ごとには投げない（打ち終わりを少し待つ） */
let stockQTimer = null;
document.addEventListener('input', e => {
  if (e.target.id === 'stockq') {
    state.stockQ = e.target.value; state.stockPage = 0;
    clearTimeout(stockQTimer);
    stockQTimer = setTimeout(refreshStockTable, 250);
    return;
  }
  /* 決まりの一覧の文字の検索は画面の中で絞るだけ（DB へは問い合わせない） */
  if (e.target.id === 'rulesq') { state.rulesF.q = e.target.value; paintRules(); return; }
  /* 没の確定ボタンは理由が入るまで押せない（#205） */
  if (e.target.classList && e.target.classList.contains('rta')) {
    const box = e.target.closest('[data-rjbox]');
    if (box) syncRejectReady(box);
    return;
  }
  /* 下端のバーの「修正を依頼」は常に色つきで、入力欄に文字があるあいだだけ濃くする（#509 段1） */
  if (e.target.classList && e.target.classList.contains('wta')) {
    const g = e.target.closest('.decide');
    if (g) g.querySelector('.dbar [data-act="comment"]')?.classList.toggle('on', !!e.target.value.trim());
  }
});
document.addEventListener('keydown', e => {
  /* 素材の見本を大きく見ているあいだは Esc で閉じる（ほかの操作より先に受ける） */
  if (plboxOpen()) { if (e.key === 'Escape') { closePlbox(); e.preventDefault(); } return; }
  /* Ctrl + Enter はコメント欄だけ。承認メモ（.ata）では発火させない（誤送信防止・#205） */
  if (e.target.classList && e.target.classList.contains('wta') && e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
    const box = e.target.closest('[data-wbox]');
    if (box) { e.preventDefault(); submitComment(box, box.dataset.wbox); }
    return;
  }
  /* 大きく表示しているあいだは、←→ で画像送り・Esc で閉じる（ほかの操作より先に受ける・#519） */
  if (svLboxOpen()) {
    if (e.key === 'ArrowLeft')  { svStepLbox(-1); e.preventDefault(); return; }
    if (e.key === 'ArrowRight') { svStepLbox(1);  e.preventDefault(); return; }
    if (e.key === 'Escape')     { svCloseLbox();  e.preventDefault(); return; }
    return;
  }
  /* 動画の上でのスペース＝再生／一時停止（ふつうの動画と同じ・#509 段4）。
     文字を打っている最中と、ボタン・リンクの上（スペースが押す操作になる）では効かせない */
  if ((e.key === ' ' || e.code === 'Space') && state.detail
      && !(e.target.closest && e.target.closest('input,textarea,select,button,a,summary,[contenteditable]'))) {
    /* シーン素材つきの画面では動画の枠を①へ移してあるので、そちらも探す（#519） */
    const v = $('#view-detail [data-tapvid] video, #view-detail .sv-screen.final video');
    if (v) { e.preventDefault(); if (v.paused) v.play().catch(() => {}); else v.pause(); return; }
  }
  /* Esc は近いものから閉じる: 入力シート → 場所を指すモード → 詳細（一覧へ戻る） */
  if (e.key === 'Escape' && state.detail) {
    if (tap && tap.draft)   { tapCloseSheet(); return; }
    if (tapPicking())       { tapPickOff();    return; }
    history.back(); return;
  }
  const sec = e.target.closest && e.target.closest('[data-secfold]');
  if (sec && (e.key === 'Enter' || e.key === ' ')) {
    e.preventDefault();
    state.secOpen[sec.dataset.secfold] = !state.secOpen[sec.dataset.secfold];
    refreshStockTable(); return;
  }
  const row = e.target.closest && e.target.closest('.mtx tbody tr[data-vid], .scard[data-vid]');
  if (row && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); pushDetail(row.dataset.vid, row.dataset.gate); }
});
window.addEventListener('scroll', hideTip, { passive: true });
/* スマホの承認画面の高さを「いま見えている範囲」に合わせ続ける（キーボードの出入り・#552）。
   間引かない——キーボードが出る間に遅れると、入力欄がキーボードの裏に一瞬隠れる */
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', () => svSyncVV());
  window.visualViewport.addEventListener('scroll', () => svSyncVV());
}
let rzT; window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { drawSpark(); syncStickyOffsets(); tapRelayout(); svRelayout(); fitDflow(); }, 120); });
/* 広い画面からスマホの幅に変わってカードが出たときだけ、工程の行をいまの工程へ送り直す（#637）。
   ふつうの resize では送らない（スマホはページを縦に送るだけで resize が起き、横に動かした位置が戻ってしまう） */
try { window.matchMedia('(max-width:640px)').addEventListener('change', e => { if (e.matches) centerFlowRows($('#stocktable')); }); }
catch (_) { /* 古いブラウザ。開き直せば真ん中に来る */ }
/* 幅が変わるとシートの出し方（せり上がり／その場）とピンの置き場所が変わる（#509 段4） */
function tapRelayout(){
  if (!tap || tap.mode !== 'edit' || !tap.panel) return;
  const sheet = tapEl('[data-sheet]');
  if (sheet && !sheet.hidden) {
    sheet.classList.toggle('float', tapMobile());
    document.body.classList.toggle('sheetopen', tapMobile());
  }
  document.body.classList.toggle('sv-pick1', !!tap.picking && svMobileOn());
  if (tap.draft && tap.draft.x != null) tap.ctl.showPin(tap.draft.x, tap.draft.y);
}

/* ══ 認証 ═══════════════════════════════════════════════════════ */
$('#loginform').addEventListener('submit', async ev => {
  ev.preventDefault();
  const btn = $('#loginbtn');
  btn.disabled = true; btn.textContent = 'ログイン中…';
  $('#loginerr').innerHTML = '';
  const { data, error } = await sb.auth.signInWithPassword({
    email: $('#email').value.trim(), password: $('#password').value
  });
  btn.disabled = false; btn.textContent = 'ログイン';
  if (error) {
    $('#loginerr').innerHTML = `<div class="errbox"><b>ログインできません</b><br>${esc(error.message)}</div>`;
    return;
  }
  $('#password').value = '';
  /* 成功したら onAuthStateChange の発火順を待たず、その場で確実にダッシュボードへ遷移（#204）。
     onAuthStateChange 側と二重に呼ばれても showApp は冪等（先頭ガード）なので描画は1回に収束する。 */
  if (data && data.session) showApp(data.session.user);
});

async function signOut(){
  await sb.auth.signOut();
  clearVideoCaches(); store.analytics = {}; store.assets = {}; store.rules = null; store.prodAssets = null;
  store.channels = []; store.pilotChannels = []; store.accounts = [];
  state.user = null; state.me = null; state.ch = null; state.view = 'stock'; state.stockPage = 0;
  showLogin();
}

function setDisplayName(name){
  $('#username').textContent = name;
  $('#useravatar').textContent = name.slice(0, 2);
}

function showLogin(){
  $('#app').hidden = true;
  $('#login').hidden = false;
  $('#menupop').hidden = true;
  closeDetail();
  if (location.hash) history.replaceState({}, '', location.pathname + location.search);
  document.title = '制作ダッシュボード — ログイン';
}

async function showApp(user){
  /* ログイン成功（submit）と onAuthStateChange(SIGNED_IN) の両経路から呼ばれうるため冪等化（#204）。
     既に同一ユーザーで初期化済みなら二重に bootstrap/描画しない。ログイン失敗時はここに来ない。 */
  if (state.user && state.user.id === user.id) return;
  state.user = user;
  setDisplayName(displayNameOf(user.email));
  $('#useremail').textContent = user.email || '';
  $('#login').hidden = true;
  $('#app').hidden = false;
  document.title = '制作ダッシュボード';
  state.busy = true; renderShell();
  /* 表示名と許可チャンネルの正本は dashboard_users（RPC dashboard_me・#208）。
     取れなければ表示名だけの旧RPC → それも駄目ならメール由来の推定にフォールバックする。
     ここで得る権限はタブの出し分け（UX）に使うだけで、遮断は RLS / RPC が行う。 */
  state.me = null;
  try {
    const { data } = await sb.rpc('dashboard_me');
    if (data) {
      state.me = data;
      if (data.display_name) setDisplayName(String(data.display_name));
    }
  } catch (_) { /* 024 未適用の DB ではここに来る */ }
  if (!state.me) {
    try {
      const { data } = await sb.rpc('dashboard_display_name');
      if (data) setDisplayName(String(data));
    } catch (_) { /* フォールバック済み */ }
  }
  /* 前回ページが消えて送り損ねた承認を、一覧を読む前に送り直す（読んだ一覧に結果が載るように） */
  try { await replayApproveOutbox(); } catch (_) { /* 控えの送り直しで画面を止めない */ }
  try { await loadBootstrap(); }
  catch (e) {
    state.busy = false; renderShell();
    $('#view-' + state.view).innerHTML = errBox(e.message);
    return;
  }
  /* #detail/… 付きで直接開かれた場合は該当詳細へ（無効ならトップに落ちる）。詳細は一覧を待たずに取りに行き、
     一覧（その番組のタブ）は裏で描く（#637。描き終えても詳細を開いている間は詳細のまま＝renderShell） */
  const route = initialRoute();
  const listP = render();
  if (route) await openInitialRoute(route);
  await listP;
}

sb.auth.onAuthStateChange((event, session) => {
  if (event === 'SIGNED_IN' && session && !state.user) showApp(session.user);
  else if (event === 'SIGNED_OUT') { state.user = null; showLogin(); }
});

const { data: { session } } = await sb.auth.getSession();
if (session && session.user) await showApp(session.user);
else showLogin();

/* 新版が出ていないか確認する（await しない＝表示を待たせない）。
   ログイン画面のままでも古い版なら意味がないので、認証状態に関係なく走らせる。
   直接リンクで詳細を開いたときは、詳細の側が動画を読めたあとに確かめる（動画と回線を取り合わない・#637） */
if (state.detail == null) checkForUpdate();
</script>
