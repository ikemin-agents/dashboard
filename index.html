  {k:'early_loss_pct', lb:'冒頭の離脱', cls:'num', tip:ANA_DEF.loss},
  {k:'engaged_rate_pct', lb:'エンゲージ率', cls:'num', tip:ANA_DEF.eng},
  {k:'subscribers_gained', lb:'登録者増', cls:'num', tip:'この動画から増えた登録者の数'},
  {k:'spk', lb:'千再生あたり登録', cls:'num', tip:ANA_DEF.spk}
];
const perfVal = (p, k) => k === 'spk' ? subsPerK(p)
  : k === 'ch' ? (p._chName || '')
  : k === 'title' ? (p.effective_title || '')
  : k === 'seq' ? String(p.seq || '')
  : k === 'published_at' ? (p.published_at ? new Date(p.published_at).getTime() : null)
  : numOrNull(p[k]);

/* 1チャンネルぶんの集計。画面のどの区画もここで出した値だけを読む */
function anaStats(a){
  const mean = arr => arr.length ? arr.reduce((s, v) => s + v, 0) / arr.length : null;
  const backAt = (arr, days) => {
    const key = jstDateStr(-days), hit = arr.find(r => r.t >= key);
    return (hit && arr.length > 1) ? hit : null;
  };
  const subsAll = a.kpi.filter(r => r.follower_actual != null)
    .map(r => ({ t:r.date, d:dayNum(r.date), v:Number(r.follower_actual) }));
  const latestSubs = subsAll.length ? subsAll[subsAll.length - 1].v : null;
  const s7 = backAt(subsAll, 7), s30 = backAt(subsAll, 30);

  /* 再生数（投稿ごとの累積を日ごとに足し上げる） */
  const byDate = new Map();
  a.daily.forEach(d => byDate.set(d.date, (byDate.get(d.date) || 0) + (Number(d.views) || 0)));
  const cumAll = [...byDate.keys()].sort().map(t => ({ t, d:dayNum(t), cum:byDate.get(t) }));
  cumAll.forEach((r, i) => { r.inc = i ? Math.max(0, r.cum - cumAll[i - 1].cum) : null; });
  const latestCum = cumAll.length ? cumAll[cumAll.length - 1].cum : null;
  const c7 = backAt(cumAll, 7), c30 = backAt(cumAll, 30);

  const posted = a.pubs.filter(p => p.status === '投稿済');
  const totalViews = posted.reduce((s, p) => s + (Number(p.views) || 0), 0);
  const vals = k => posted.map(p => numOrNull(p[k])).filter(v => v != null);
  /* 目安の対象になる動画だけ（02 の通常雑学）。到達本数の分母・分子はこちらで数える */
  const goalPosted = posted.filter(goalVid);
  const gvals = k => goalPosted.map(p => numOrNull(p[k])).filter(v => v != null);
  const rates = vals('avg_view_rate_pct');
  /* 直近7日＝今日を含む暦の7日間（公開日は日本時間の日付で数える） */
  const wkFrom = jstDateStr(-6), wkTo = jstDateStr(0);
  const pubDay = p => { const q = partsOf(new Date(p.published_at), {year:'numeric', month:'2-digit', day:'2-digit'}); return `${q.year}-${q.month}-${q.day}`; };
  const postedDated = posted.filter(p => p.published_at);
  const lastPub = postedDated.reduce((m, p) => (!m || new Date(p.published_at) > new Date(m.published_at)) ? p : m, null);

  /* 投稿ごとの日次記録（公開後7日の初速に使う） */
  const recs = new Map();
  a.daily.forEach(d => {
    if (!recs.has(d.publication_id)) recs.set(d.publication_id, []);
    recs.get(d.publication_id).push(d);
  });
  recs.forEach(arr => arr.sort((x, y) => x.date < y.date ? -1 : 1));

  return {
    subsAll, cumAll, posted, totalViews, recs,
    latestSubs, latestCum,
    subsDelta: (latestSubs != null && s7) ? latestSubs - s7.v : null,
    subsGain30: (latestSubs != null && s30) ? latestSubs - s30.v : null,
    viewsDelta: (latestCum != null && c7) ? latestCum - c7.cum : null,
    viewsGain30: (latestCum != null && c30) ? latestCum - c30.cum : null,
    rates, hooks: vals('hook_awr'), ends: vals('end_awr'), losses: vals('early_loss_pct'),
    gRates: gvals('avg_view_rate_pct'), gHooks: gvals('hook_awr'),
    gEnds: gvals('end_awr'), gLosses: gvals('early_loss_pct'),
    avgRate: mean(rates), hookAvg: mean(vals('hook_awr')),
    rateHit: gvals('avg_view_rate_pct').filter(v => v >= ANA_GOAL.rate.thr).length,
    subsLatestT: subsAll.length ? subsAll[subsAll.length - 1].t : null, s7t: s7 ? s7.t : null, s30t: s30 ? s30.t : null,
    cumLatestT: latestCum != null ? cumAll[cumAll.length - 1].t : null, c7t: c7 ? c7.t : null, c30t: c30 ? c30.t : null,
    wkFrom, wkTo,
    weekPosts: postedDated.filter(p => pubDay(p) >= wkFrom).length,
    lastPub
  };
}

async function renderAnalytics(){
  const el = $('#view-analytics');
  if (!store.channels.length) { el.innerHTML = `<div class="noitem">動画チャンネルがありません</div>`; return; }
  if (!store.analytics[ANA_ALL]) el.innerHTML = loading();
  let A;
  try { A = await loadAnalyticsAll(); }
  catch (e) { el.innerHTML = errBox(e.message); return; }
  chartReg = [];

  const from = state.anaRange ? jstDateStr(-state.anaRange) : '0000-01-01';
  const mean = arr => arr.length ? arr.reduce((s, v) => s + v, 0) / arr.length : null;
  const sers = anaSeries();                       /* 凡例でオンのチャンネル */
  const ST = {};
  store.channels.forEach(c => { ST[c.slug] = anaStats(A[c.slug] || { kpi:[], pubs:[], daily:[] }); });

  /* ── 凡例（押すと表示のオン／オフ）────────────────────────── */
  const legend = `<div class="chlegend">${store.channels.map(c => {
      const m = chMeta(c.slug), on = !state.anaOff[c.slug];
      return `<button class="chchip" data-anach="${esc(c.slug)}" aria-pressed="${on}" style="--chac:${m.accent}">
        <i></i>${m.icon} ${esc(m.name)}</button>`;
    }).join('')}
    <span class="hint">チップを押すとそのチャンネルの表示を消せます・塗りつぶし＝目安に到達／白抜き＝未達（${esc(ANA_GOAL_SCOPE)}）</span></div>`;

  /* ── ① チャンネルの現在地 ───────────────────────────────────
     行＝指標（大分類ごとに見出し行）・列＝チャンネル の縦持ち。横持ちは列が15本になり
     PC でも 1,955px で収まらなかった（2026-09-04）。各行に「いつからいつまで」「目安」を明記する。
     期間は最初のチャンネルの記録日から取る（全チャンネル同じ朝に取り込むので一致する）。 */
  const md = t => t ? fmtMDW(t + 'T00:00:00+09:00') : '—';
  const st0 = sers.length ? ST[sers[0].ch] : null;
  const span = (a, b) => (a && b) ? `${md(a)} → ${md(b)}` : '記録が2日分たまると出ます';
  const delta = (v, unit) => v == null ? '—' : `${v >= 0 ? '+' : ''}${nf(v)} ${unit}`;
  const mnOf = (st, t) => {
    const p1 = Math.min(1, (st.latestSubs || 0) / t.subs), p2 = Math.min(1, st.totalViews / t.plays);
    const pct = Math.min(p1, p2) * 100;
    return `${pct.toFixed(pct < 1 ? 2 : 1)}%<span class="sub subw">登録者 ${nf(st.latestSubs || 0)}/${nf(t.subs)}・再生 ${axNum(st.totalViews)}/${axNum(t.plays)}</span>`;
  };
  /* 行の定義。cell(st) がチャンネル1つぶんのセル HTML を返す */
  const GROUPS = [
    { nm:'登録者', rows:[
      { lb:'いま', note:`${st0 ? md(st0.subsLatestT) : '—'} の朝の実数`, cell: st => st.latestSubs == null ? '—' : `${nf(st.latestSubs)} 人` },
      { lb:'先週比', note: st0 ? span(st0.s7t, st0.subsLatestT) : '—', cell: st => delta(st.subsDelta, '人') },
      { lb:'直近30日', note: st0 ? span(st0.s30t, st0.subsLatestT) : '—', cell: st => delta(st.subsGain30, '人') }
    ]},
    { nm:'再生数', rows:[
      { lb:'累計', note:'投稿済の動画の合計', cell: st => `${nf(st.totalViews)} 回` },
      { lb:'先週比', note: st0 ? span(st0.c7t, st0.cumLatestT) : '—', cell: st => delta(st.viewsDelta, '回') },
      { lb:'直近30日', note: st0 ? span(st0.c30t, st0.cumLatestT) : '—', cell: st => delta(st.viewsGain30, '回') }
    ]},
    { nm:'視聴の質', rows:[
      { lb:'平均視聴率', note:`計測できた動画の平均・目安 ${goalTxt('rate')}（02 の基準）`, cell: st => st.avgRate == null ? '—' : `${st.avgRate.toFixed(1)}%<span class="sub">計測済 ${st.rates.length}/${st.posted.length} 本</span>` },
      { lb:`${goalTxt('rate')}に到達`, note:'平均視聴率が目安を超えた本数（02 の基準）',
        cell: (st, ch) => (goalCh(ch) && st.gRates.length) ? `${st.rateHit} 本<span class="sub">${Math.round(st.rateHit / st.gRates.length * 100)}%</span>` : '—' },
      { lb:'冒頭の維持', note:`計測できた動画の平均・目安 ${goalTxt('hook')}（02 の基準）`, cell: st => st.hookAvg == null ? '—' : st.hookAvg.toFixed(2) }
    ]},
    { nm:'投稿', rows:[
      { lb:'直近7日', note: st0 ? `${md(st0.wkFrom)} 〜 ${md(st0.wkTo)}（今日を含む7日間）` : '—', cell: st => `${st.weekPosts} 本` },
      { lb:'投稿済', note:'これまでの合計', cell: st => `${st.posted.length} 本` },

    ]},
    { nm:'収益化までの達成率', rows:[
      { lb:'早期アクセス', note:'登録者 500 と再生 300万・低い方', cell: st => mnOf(st, MONETIZE[0]) },
      { lb:'広告収益', note:'登録者 1,000 と再生 1,000万・低い方', cell: st => mnOf(st, MONETIZE[1]) }
    ]}
  ];
  /* 大分類ごとに小さな表を1つずつ作り、横に並べる（幅いっぱいに使って縦を短く・2026-09-04）。
     各表: 見出し帯＝大分類名＋チャンネルの色チップ、行＝指標（名前の下に期間・目安）、列＝チャンネル */
  const nowBlocks = sers.length ? GROUPS.map(g => `<div class="nowblk"><table>
      <thead><tr><th>${esc(g.nm)}</th>${sers.map(s => `<th class="num" title="${esc(s.name)}"><span class="chcell">${chSw(s.color)}${s.icon}</span></th>`).join('')}</tr></thead>
      <tbody>${g.rows.map(r => `<tr><th class="lb">${esc(r.lb)}<span class="subm">${esc(r.note)}</span></th>${
        sers.map(s => `<td class="num">${r.cell(ST[s.ch], s.ch)}</td>`).join('')}</tr>`).join('')}</tbody>
    </table></div>`).join('')
    : `<div class="noitem">表示するチャンネルがありません</div>`;
  const nowCard = `<div class="card span2">
      <div class="sectionhead" style="margin:0 0 var(--sp-2)"><h2>チャンネルの現在地</h2>
        <span class="axh">登録者と再生数は毎朝6時に取り込んだ実数。視聴の質は計測できた動画だけの値。収益化は2条件（登録者・再生数）の達成率のうち低い方。列の色チップ＝チャンネル（${sers.map(s => `${s.icon} ${esc(s.name)}`).join('・')}）</span></div>
      <div class="nowgrid">${nowBlocks}</div>
    </div>`;

  /* ── 期間切替（登録者・再生数の2つのグラフで共有）───────────── */
  const ranges = [{v:30, lb:'30日'}, {v:90, lb:'90日'}, {v:0, lb:'全部'}];
  const rangeBtns = `<div class="chips rangebtns">${ranges.map(r =>
    `<button class="rgbtn" data-anarange="${r.v}" aria-pressed="${state.anaRange === r.v}">${r.lb}</button>`).join('')}</div>`;
  /* 縦軸を合わせるチャンネル（案②・オーナー決定 2026-09-04）。表示中のチャンネルから選ぶ。
     選んだものが消えていたら先頭に戻す。1チャンネルならボタンは出さない */
  const axisCh = (sers.find(x => x.ch === state.anaAxis) || sers[0] || {}).ch || null;
  const axisBtns = sers.length > 1 ? `<span class="anarange axlbl">縦軸を合わせる</span><div class="chips rangebtns">${sers.map(x =>
    `<button class="rgbtn" data-anaaxis="${esc(x.ch)}" aria-pressed="${x.ch === axisCh}" style="--chac:${x.color}"><i class="axsw"></i>${x.icon} ${esc(x.name)}</button>`).join('')}</div>` : '';

  /* ── ② 登録者の推移（チャンネルを重ねる）───────────────────── */
  const subsSer = sers.map(s => ({ ...s, rows: ST[s.ch].subsAll.filter(r => r.t >= from) }))
    .filter(s => s.rows.length >= 2);
  let subsCard;
  if (subsSer.length) {
    chartReg.push({ sel:'#c-subs', build: W => lineChart(subsSer, W, {unit:'人', label:'登録者の推移', id:'subs', axis:axisCh}) });
    const days = [...new Set(subsSer.reduce((a2, s) => a2.concat(s.rows.map(r => r.t)), []))].sort();

    const pick = days.filter((_, i, arr) => i === 0 || i === arr.length - 1 || i % step === 0);
    const mini = `<div class="tblwrap"><table><thead><tr><th>日付</th>${
      subsSer.map(s => `<th class="num">${chSw(s.color)}${esc(s.name)}</th>`).join('')}</tr></thead><tbody>${
      pick.map(t => `<tr><td>${esc(fmtDate(t) || t)}</td>${subsSer.map(s => {
        const r = s.rows.find(x => x.t === t);
        return `<td class="num">${r ? nf(r.v) : '—'}</td>`;
      }).join('')}</tr>`).join('')}</tbody></table></div>`;
    const caps = subsSer.map(s => {
      const f = s.rows[0], l = s.rows[s.rows.length - 1], d = l.v - f.v;
      return `<div>${chSw(s.color)}${esc(s.name)}　${esc(fmtDate(f.t) || f.t)} <b>${nf(f.v)}</b> → ${esc(fmtDate(l.t) || l.t)} <b>${nf(l.v)}</b>（<span style="color:var(--up);font-weight:700">${d >= 0 ? '+' : ''}${nf(d)}</span>）</div>`;
    }).join('');
    subsCard = `<div class="card">
        <div class="sectionhead" style="margin:0 0 var(--sp-2)"><h2>登録者の推移</h2>
          <span class="axh">横軸＝日付・縦軸＝登録者数（人）。縦軸の範囲は上で選んだチャンネルに合わせ、他のチャンネルは薄い線。点にふれるとその日の全チャンネルの数が出ます</span></div>
        <div class="chartwrap" id="c-subs"></div>
        <div class="sparkcap">${caps}</div>
        <button class="tbltoggle" data-tbl="subs">${state.anaTbl.subs ? '表を閉じる' : '表で見る'}</button>
        <div class="minitbl wide ${state.anaTbl.subs ? 'show' : ''}" data-tbl="subs">${mini}</div>
      </div>`;
  } else {

      </div>`;
  }

  /* ── ② 再生数の推移 ────────────────────────────────────────── */
  const cumSer = sers.map(s => ({ ...s, rows: ST[s.ch].cumAll.filter(r => r.t >= from) }))

  if (cumSer.length) {

      }).join('')}</tr>`).join('')}</tbody></table></div>`;
    playsCard = `<div class="card">
        <div class="sectionhead" style="margin:0 0 var(--sp-2)"><h2>再生数の推移</h2>
          <span class="axh">上段＝1日にどれだけ再生されたか（回／日・同じ日のチャンネルは横に並べています）・下段＝それまでの合計（累計 回）。横軸はどちらも日付。縦軸の範囲は上で選んだチャンネルに合わせ、他は薄く</span></div>
        <div class="chartwrap" id="c-plays"></div>
        <button class="tbltoggle" data-tbl="plays">${state.anaTbl.plays ? '表を閉じる' : '表で見る'}</button>
        <div class="minitbl wide ${state.anaTbl.plays ? 'show' : ''}" data-tbl="plays">${mini}</div>
      </div>`;
  } else {
    playsCard = `<div class="card">
        <div class="sectionhead" style="margin:0 0 var(--sp-2)"><h2>再生数の推移</h2></div>
        <div class="noitem">データ蓄積待ち<span class="s">再生数の記録が2日分たまると推移を描きます</span></div>

  }

      .map(p => ({ d: Math.round(new Date(p.published_at).getTime() / DAY), at:p.published_at,
                   v:Number(p.avg_view_rate_pct), seq:p.seq, name:s.name, color:s.color,
                   goal:goalVid(p), title:(p.effective_title || '').slice(0, 40) }))), [])
    .sort((x, y) => x.d - y.d);
  let scatCard;
  if (scat.length) {
    chartReg.push({ sel:'#c-scatter', build: W => scatterChart(scat, W, {thr:ANA_GOAL.rate.thr}) });

      <div class="sectionhead" style="margin:0 0 var(--sp-2)"><h2>公開順に見る平均視聴率</h2>
        <span class="axh">${esc(ANA_DEF.rate)}。横軸＝公開日・縦軸＝平均視聴率（%）。1つの点が動画1本。点にふれるとチャンネル名・番号・タイトルが出ます</span></div>
      <div class="chartwrap" id="c-scatter"></div>
      <div class="distlegend">${sers.map(s => `<span>${chSw(s.color)}${esc(s.name)}</span>`).join('')}
        <span><i class="sw" style="background:var(--ink-2)"></i>塗りつぶし＝${goalTxt('rate')}に到達</span>
        <span><i class="sw" style="background:transparent;box-shadow:inset 0 0 0 2px var(--ink-2)"></i>白抜き＝未達</span>
        <span style="color:var(--crit)">┈ ${goalTxt('rate')}の線</span></div>
      <p class="axnote">${esc(ANA_GOAL_SCOPE)}。線の対象外のチャンネルは点を全部塗りつぶしで出しています</p>
    </div>`;
  } else {
    scatCard = `<div class="card span2">
      <div class="sectionhead" style="margin:0 0 var(--sp-2)"><h2>公開順に見る平均視聴率</h2></div>
      <div class="noitem">計測できた動画がまだありません</div></div>`;
  }

  /* ── ④ 視聴の質（4つの分布・チャンネルごとに同じ区分で横並び）───── */
  const qBlock = (id, title, key, pick, gpick, big) => {
    const cfg = ANA_GOAL[key];
    /* values＝棒に積む全部の値 / gvalues＝目安に照らして数える値（02 の通常雑学だけ） */
    const groups = sers.map(s => ({ ...s, goal:goalCh(s.ch), values: pick(ST[s.ch]), gvalues: gpick(ST[s.ch]) }))
      .filter(g => g.values.length);
    const goalTxt = cfg.dir > 0 ? `${cfg.fmt(cfg.thr)}${cfg.unit}以上` : `${cfg.fmt(cfg.thr)}${cfg.unit}以下`;
    const head = `<h3>${esc(title)}<span class="goal">目安 ${goalTxt}</span></h3>
      <p class="defline">${esc(ANA_DEF[key])}</p>`;
    if (!groups.length) return `<div class="qblk${big ? ' big' : ''}">${head}
      <div class="noitem">計測できた動画がまだありません</div></div>`;
    chartReg.push({ sel:'#' + id, build: W => histogram(groups, cfg, W, big ? 190 : 158) });
    const tbl = `<table class="qtbl"><thead><tr><th>チャンネル</th><th>平均</th><th>目安に到達</th><th>計測済</th></tr></thead><tbody>${

/* 「YYYY-MM-DD」に日を足す（JST の暦日で数える） */
function jstAdd(dstr, days){
  const t = new Date(dstr + 'T00:00:00+09:00').getTime() + days * DAY;
  const p = partsOf(new Date(t), {year:'numeric', month:'2-digit', day:'2-digit'});
  return `${p.year}-${p.month}-${p.day}`;
}

/* 登録済みのグラフを、いまの実寸の幅で描き直す（初回描画とリサイズの両方から呼ぶ） */
function drawSpark(){
  chartReg.forEach(c => {
    const wrap = $(c.sel);
    if (!wrap) return;
    const W = Math.round(wrap.clientWidth || 0);
    if (W < 40) return;
    let r;
    try { r = c.build(Math.max(240, W)); }
    catch (_) { return; }   /* 1つのグラフの失敗で画面全体を壊さない */
    wrap.innerHTML = r.html;
    bindHover(wrap, r.pts, r.mode);
  });
}

function laneChips(lanes){
  if (!lanes || typeof lanes !== 'object') return '';
  return Object.keys(lanes).map(slug => {
    const m = chMeta(slug), v = lanes[slug];
    const cells = Array.isArray(v)
      ? v.map((n, i) => ({ nm: LANE_NAMES[i] || ('L' + (i + 1)), n, low: (i === 0 && n < 15) || (i === 4 && n < 2) }))
      : Object.keys(v || {}).map(k => ({ nm: k, n: v[k], low: false }));
    return `<div class="lanerow"><span class="chip"><span class="cdot" style="background:${m.accent}"></span>${m.icon} ${esc(m.name)}</span>${
      cells.map(c => `<span class="lane ${c.low ? 'low' : ''}">${c.low ? '⚠ ' : ''}${esc(c.nm)} ${esc(c.n)}</span>`).join('')}</div>`;
  }).join('');
}

/* 時間軸の並べ方: entries は既にバックエンド側で時系列ソート済みなので、その順番に

function timeToMinutes(hhmm){
  const m = /^(\d{1,2}):(\d{2})$/.exec(String(hhmm || '').trim());
  return m ? (+m[1]) * 60 + (+m[2]) : null;
}

function buildTimelinePins(entries, numOf){
  const raw = [];
  const alwaysOnByChannel = {};   // 特定の時刻を持たない常時稼働タスク（例: 5分間隔ポーラー）
  entries.forEach(e => {
    const channel = CHANNEL_ORDER.includes(e.channel) ? e.channel : 'other';
    if (e.time) {
      // parse_cron は同一cronが複数時刻にマッチすると "06:00 / 06:30" のように束ねて返す
      String(e.time).split('/').forEach(part => {
        const min = timeToMinutes(part);
        if (min != null) raw.push({e, min, num: numOf.get(e), channel});
      });
    } else if (e.interval_min) {
      (alwaysOnByChannel[channel] = alwaysOnByChannel[channel] || []).push({e, num: numOf.get(e)});
    }
  });
  raw.sort((a, b) => a.min - b.min);

  // 段は帯（チャンネル）ごとに独立して振る＝同じ帯の中だけ重なりを避ければよい
  const laneCounters = {};
  raw.forEach(p => {
    p.lane = laneCounters[p.channel] || 0;
    laneCounters[p.channel] = p.lane + 1;
  });

  // 帯は軸線に近い側（下）から積む。読み順を表と同じ「YouTube→X→その他」を上にしたいので
  // 逆順（その他→X→YouTube）に積む。該当タスクが無い帯は作らない（高さ0で場所を取らない）。
  // 常時稼働タスクがある帯は、通常のピンの上にさらに黒帯ぶんの高さを足す
  // （bottom基準: pad→通常ピン→隙間→常時稼働の黒帯→pad の順に積む）。
  const bandLayout = {};
  let cursor = 0;
  [...CHANNEL_ORDER].reverse().forEach(ch => {
    const laneCount = laneCounters[ch] || 0;
    const always = alwaysOnByChannel[ch] || [];
    if (!laneCount && !always.length) return;
    const pinsInnerH = laneCount > 0 ? (laneCount - 1) * TL_ROW_H + TL_PIN : 0;
    const alwaysInnerH = always.length ? always.length * TL_ALWAYS_H + (always.length - 1) * 4 : 0;
    const midGap = (laneCount > 0 && always.length) ? TL_BAND_PAD : 0;
    const innerH = pinsInnerH + midGap + alwaysInnerH;
    const bandH = innerH + TL_BAND_PAD * 2;
    bandLayout[ch] = {
      bottom: cursor, height: bandH,
      innerBottom: cursor + TL_BAND_PAD,
      alwaysBottom: cursor + TL_BAND_PAD + pinsInnerH + midGap,
    };
    cursor += bandH + TL_BAND_GAP;
  });
  const totalHeight = Math.max(TL_PIN, cursor - TL_BAND_GAP);

  return {pins: raw, alwaysOnByChannel, bandLayout, totalHeight};
}

function parseDoc(doc){
  if (!doc) return null;
  try { return JSON.parse(doc.content); } catch { return null; }
}

/* 定時タスクの時刻表。畳んだ節を返す（月に一度見るかどうかの情報なので既定は閉じる） */

  const d = parseDoc(doc);
  if (!d || !Array.isArray(d.entries)) return `<details class="opsec">

  const runnerLabel = {};
  (d.runners || []).forEach(r => { runnerLabel[r.key] = r.label; });

  // 番号は entries の並び順（=バックエンドで時系列ソート済み）にそのまま採番する
  const numOf = new Map();
  d.entries.forEach((e, i) => numOf.set(e, i + 1));

  const {pins, alwaysOnByChannel, bandLayout, totalHeight} = buildTimelinePins(d.entries, numOf);

  const pinsHtml = pins.map(p => {

    const L = bandLayout[p.channel];

    const body = flip ? label + badge : badge + label;
    return `<span class="tlrow${off ? ' off' : ''}" style="${pos}; bottom:${bottom}px">${body}</span>
      <i class="tlstem${off ? ' off' : ''}" style="left:${leftPct.toFixed(2)}%; height:${bottom}px"></i>`;

  // 分類は縦位置（レーン）と区切り線だけで表す。背景色は使わない（色は実行主体のため・

  const chBandsHtml = CHANNEL_ORDER.map(ch => {
    const L = bandLayout[ch];
    return L ? `<div class="tlchband ${ch}" style="bottom:${L.bottom}px; height:${L.height}px"></div>` : '';
  }).join('');

  const sidebarHtml = CHANNEL_ORDER.map(ch => {
    const L = bandLayout[ch];

    return `<div class="tlcard ${ch}" style="bottom:${L.bottom}px; height:${L.height}px">
      <span class="tlcardtitle">${esc(CHANNEL_LABEL[ch] || ch)}</span>

  }).join('');

  const ticksHtml = TL_HOUR_TICKS.map(h =>
    `<div class="tltick" style="left:${(h / 24 * 100).toFixed(2)}%"><i></i><b>${h}</b></div>`).join('');

  // 常時稼働（5分間隔など）は特定の時刻を持たないので点は打たず、該当する帯の一番上に
  // 黒帯として全幅で出す（オーナー指摘: 独立したバナーではなく帯の中に置きたい・8/18）。
  const alwaysHtml = CHANNEL_ORDER.map(ch => {
    const L = bandLayout[ch];
    const list = alwaysOnByChannel[ch] || [];
    if (!L || !list.length) return '';
    return list.map((a, i) => {
      const title = a.e.title_ja || a.e.id;
      const off = a.e.enabled === false;   /* 止めてあるものは「常時稼働」と言わない */
      const bottom = L.alwaysBottom + i * (TL_ALWAYS_H + 4);
      const tip = `${off ? (a.e.status || '停止中') : (a.e.when || '')}　${title}`;
      const cls = RUNNER_CLS[a.e.runner] || 'poller';   /* 枠線と丸バッジを実行主体の色に揃える */
      return `<div class="tlalways ${cls}${off ? ' off' : ''}" style="bottom:${bottom}px; height:${TL_ALWAYS_H}px">
        <span class="tlpin ${cls}" title="${esc(tip)}">${a.num}</span>

                    : `${esc(a.e.when || '')}で常時稼働・${esc(title)}`}</span></div>`;
    }).join('');
  }).join('');

  const timelineHtml = `
    <div class="tltrack">
      <div class="tlsidebar" style="height:${totalHeight}px">${sidebarHtml}</div>
      <div class="tlouter"><div class="timeline">
        <div class="tlpins" style="height:${totalHeight}px">${chBandsHtml}${alwaysHtml}${pinsHtml}</div>
        <div class="tlaxis">${ticksHtml}</div>
        <div class="tlaxistitle">時刻（24時間・当日）</div>
      </div></div>
    </div>`;

  // 表は「どの領域(YouTube制作／X運用／その他)の仕事か」で区切って読めるようにする。
  // 各領域の中は entries の時系列順のまま（採番はグループ化の前後で変わらない）。
  const rowHtml = e => {
    const off = e.enabled === false;
    const cls = RUNNER_CLS[e.runner] || 'routine';
    return `<tr${off ? ' class="off"' : ''}>
      <td class="no"><span class="tlpin ${cls}">${numOf.get(e)}</span></td>
      <td class="when">${esc(e.when || '—')}</td>
      <td class="what">
        <span class="nm">${esc(e.title_ja || e.id)}</span>
        <span class="runner ${cls}">${esc(runnerLabel[e.runner] || e.runner)}</span>
        ${e.status && e.status !== '運用中' ? `<span class="sysflag">${esc(e.status)}</span>` : ''}
        ${e.description ? `<span class="ds">${esc(e.description)}</span>` : ''}</td></tr>`;
  };
  const rows = CHANNEL_ORDER.map(ch => {
    const group = d.entries.filter(e => (e.channel || 'other') === ch);
    if (!group.length) return '';
    return `<tr class="chgroup"><td colspan="3">${esc(CHANNEL_LABEL[ch] || ch)}</td></tr>${group.map(rowHtml).join('')}`;
  }).join('') || `<tr class="emptyrow"><td colspan="3">登録された定時タスクがありません</td></tr>`;

  const legend = (d.runners || []).map(r =>
    `<span class="lg"><span class="runner ${RUNNER_CLS[r.key] || 'routine'}">${esc(r.label)}</span>${esc(r.note || '')}</span>`).join('');
  const notes = (d.notes || []).map(n => `<li>${esc(n)}</li>`).join('');

  return `<details class="opsec">
    <summary>⏰ ${esc(doc.title || '定時タスク')}<span class="s">${esc(d.timezone || '')}
      ・${esc(fmtDT(doc.updated_at) || '')} 同期</span></summary>
    ${legend ? `<div class="syslegend">${legend}</div>` : ''}
    ${timelineHtml}
    <div class="tblwrap systbl"><table>
      <thead><tr><th class="no"></th><th class="when">時刻</th><th>内容</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    ${notes ? `<ul class="sysnotes">${notes}</ul>` : ''}</details>`;
}

/* ══ gen-farm のいま（システムタブの先頭・オーナー要望 2026-08-19）══════════════
   「実家の生成機に何本たまっていて、いつ終わるか」を1枚で見せる。数え方は
   コマンドラインの genfarm-status（00-config/tools/genfarm-status/）と同じ:
     ・待ち行列＝まだ手元に無いジョブ（materialized_at が空／発注中・実行中・生成済み）
     ・完了見込み＝1件ずつ順に処理される前提で、残り時間を積み上げた概算
     ・「できあがったのに手元へ降りていない」が長く続いたら詰まりを疑う（2026-08-19 の障害と
       同じ形）。数えはじめはできあがった時刻で、しきい値は GF_STALE_DONE_MIN
   見込み時間は、発注時に記録した見込み秒（estimated_sec）が近い実測で較正する。
   実測が無い種類は既定値（H3映像 223秒／FLUX画像 76秒）に落とす。 */
const GF_MAX_SANE_SEC = 6 * 3600;
function gfEstimator(recent){
  const byKind = {}, calib = {};
  (recent || []).forEach(m => {
    const dur = (new Date(m.finished_at) - new Date(m.started_at)) / 1000;
    if (!(dur > 0 && dur < GF_MAX_SANE_SEC)) return;
    const k = m.kind || 'unknown';
    (byKind[k] = byKind[k] || []).push(dur);
    const e = Number(m.estimated_sec);
    if (e > 0) (calib[k] = calib[k] || []).push([e, dur]);
  });
  const mean = a => a.reduce((s, v) => s + v, 0) / a.length;
  return (kind, hint) => {
    const pairs = calib[kind] || [];
    if (hint > 0 && pairs.length) {
      const same = pairs.filter(p => Math.abs(p[0] - hint) <= hint * 0.10).map(p => p[1]);
      if (same.length) return mean(same);
      const near = pairs.reduce((b, p) => Math.abs(p[0] - hint) < Math.abs(b[0] - hint) ? p : b);
      return mean(pairs.filter(p => p[0] === near[0]).map(p => p[1])) * hint / near[0];
    }
    if ((byKind[kind] || []).length) return mean(byKind[kind]);
    return hint > 0 ? hint : (GF_FALLBACK_SEC[kind] || 200);
  };
}
/* 時刻の文字列 → ミリ秒。空・壊れた値は null（起点の取り違えを黙って通さない） */
function gfMs(v){ const t = v ? Date.parse(v) : NaN; return isFinite(t) ? t : null; }
/* できあがった時刻＝ status が done になった時刻。生成機が記録する finished_at が正で、
   古い記録で欠けていれば更新時刻・発注時刻の順に落とす。 */
function gfDoneAt(r){ return gfMs(r.finished_at) || gfMs(r.updated_at) || gfMs(r.submitted_at); }
/* 経過の起点の言い方。オーナーに見せる言葉はこの2つだけに絞る（同じものを別名で呼ばない）:
   作りはじめてから … 生成機が実際に手を付けてからの時間
   発注から         … まだ手を付けたか分からないので、投げてからの時間で代用している */
const GF_FROM_LABEL = {make:'作りはじめてから', order:'発注から'};
function gfState(gf){
  const est = gfEstimator(gf.recent), now = Date.now();
  const open = gf.open || [];
  /* 生成機は1件ずつしか作らない。DB が持っているのは「投げたところまで」なので、
     投げた分（in_flight）のうち**いちばん早く投げた1件だけ**を「作成中」とみなし、
     残りは生成機の中で順番待ちとして扱う（先入れ先出しなので実態とほぼ一致する）。
     オーナー指摘 2026-08-20「なぜ両方実行中なのか」への対応。 */
  const runningId = (open.find(r => r.status === 'in_flight') || {}).id;
  /* 作成中の1件が「作りはじめた時刻」の求め方（オーナー指摘 2026-08-28: 発注からの経過だと
     大げさに見える）。生成機は1件ずつ順に作るので、**直前の1本ができあがった時刻＝次の1本を
     作りはじめた時刻**（実測でミリ秒まで一致する）。処理開始時刻（started_at）は終わってから
     しか入らないので、待っているあいだはこの繰り上がりがいちばん正確な起点になる。
     どちらも取れなければ発注時刻に落とし、そのときは「発注から」と名乗って超過は主張しない。 */
  const prevDone = open.filter(r => r.status === 'done').map(gfDoneAt).filter(Boolean);
  const lastDoneAt = prevDone.length ? Math.max(...prevDone) : null;
  let cursor = 0;
  const jobs = open.map(r => {
    const kind = r.kind || 'unknown';
    const e = est(kind, Number(r.estimated_sec) || 0);
    const isRunning = r.id === runningId;
    const sub = gfMs(r.submitted_at);
    let from = null, fromKind = null;
    if (isRunning) {
      const started = gfMs(r.started_at);
      if (started) { from = started; fromKind = 'make'; }
      else if (lastDoneAt && sub && lastDoneAt > sub) { from = lastDoneAt; fromKind = 'make'; }
      else { from = sub; fromKind = 'order'; }
    }
    const elapsed = from ? (now - from) / 1000 : null;
    const remaining = r.status === 'done' ? 0
      : (isRunning && elapsed != null) ? Math.max(0, e - elapsed) : e;
    cursor += remaining;
    const state = r.status === 'done' ? 'ready'
      : isRunning ? 'running'
      : r.status === 'in_flight' ? 'queued' : 'todo';
    /* 見込みを何分超えたか。**作りはじめた時刻が取れているときだけ**数える。発注起点の
       経過は順番待ちの時間を含むので、そこから超過を名乗ると嘘になる（オーナー指摘の型）。 */
    const overBy = (isRunning && fromKind === 'make' && elapsed != null && elapsed > e)
      ? elapsed - e : null;
    return { r, kind, state, est: e, elapsed, fromKind, overBy, remaining,
             age: (r.status === 'done' ? (now - gfDoneAt(r)) : (now - sub)) / 1000,
             eta: r.status === 'done' ? null : now + cursor * 1000 };
  });
  const by = st => jobs.filter(j => j.state === st);
  return { jobs, now, running: by('running'), queued: by('queued'), todo: by('todo'),
           stale: by('ready'), allDoneAt: cursor > 0 ? now + cursor * 1000 : null };
}
/* 秒 → 「3分20秒」「1時間5分」。1分未満は秒だけ（進行中の経過が動いて見える） */
function gfDur(sec){
  if (sec == null || !isFinite(sec)) return '—';
  const s = Math.max(0, Math.round(sec));
  if (s < 60) return `${s}秒`;
  const m = Math.round(s / 60);
  return m < 60 ? `${m}分` : `${Math.floor(m / 60)}時間${m % 60}分`;
}
const gfClock = ms => ms == null ? '—' : fmtTime(new Date(ms).toISOString());

/* ── 「どの企画の・どの動画の・何を作っているか」を出すための言い換え ───────────
   動画の番号の頭2文字で企画が分かる（BZ=世界のバズ雑学／DT=歯科医番長／
   RW=人類の力わざ。2026-08-25 の付け替え後の体系）。ただし 9000 番台は本編ではなく
   試作・検証なので、頭2文字より番号を優先してそちらの札を出す。
   付け替え前の旧番号（D007・K001・R001・071 など）の記録もまだ残っているので、
   下段のフォールバックで拾う。
   動画として登録済みならチャンネルとタイトルが引けるのでそちらを優先し、
   試作・練習のものは番号だけで出す。 */
const EP_PILOT = {icon: '🧪', name: '試作・検証'};
const EP_HINT = [
  {re: /^BZ/i,  icon: '🌏', name: '世界のバズ雑学'},
  {re: /^DT/i,  icon: '🦷', name: '歯科医番長'},
  {re: /^RW/i,  icon: '🏗', name: '人類の力わざ'},
  /* ── ここから下は旧番号（2026-08-25 の付け替え前）。過去の記録のためだけに残す ── */
  {re: /^D\d/i, icon: '🦷', name: '歯科医番長'},
  {re: /^K\d/i, icon: '🏗', name: '人類の力わざ'},
  {re: /^R\d/i, icon: '🧪', name: '試作・検証'},
  {re: /^\d/,   icon: '🌏', name: '世界のバズ雑学'}
];
/* 番号（末尾の3〜4桁）が 9000 以上なら試作・検証。BZ9006・RW9001 のように
   企画の頭2文字が付いていても本編ではないので、企画名では出さない。 */
function epHint(seq){
  const s = String(seq || '');
  const num = /(\d{3,4})$/.exec(s);
  if (num && Number(num[1]) >= 9000) return EP_PILOT;
  return EP_HINT.find(h => h.re.test(s)) || null;
}
function gfWhose(r, titles){
  const t = (titles || {})[r.video_id];
  if (r.channel && store.channels.some(c => c.slug === r.channel)) {
    const m = chMeta(r.channel);
    return { icon: m.icon, name: m.name, title: (t && t.title) || '' };
  }
  const hit = epHint(r.episode_seq);
  return { icon: hit ? hit.icon : '🎬', name: hit ? hit.name : 'その他',
           title: (t && t.title) || '' };
}
/* 何を作っているか。scene05 → シーン5の映像 / S02a・S02b → シーン2の開始・終了フレーム */
function gfPart(j){
  const k = String(j.r.artifact_key || '');
  let m = /^scene0*(\d+)/i.exec(k);
  if (m) return `シーン${Number(m[1])}の映像`;
  m = /^S0*(\d+)([ab])?/i.exec(k);
  if (m) return `シーン${Number(m[1])}の${m[2] === 'b' ? '終了フレーム' : '開始フレーム'}`;
  return j.kind === 'h3_video' ? 'シーンの映像' : 'フレームの絵';
}
const GF_STATE_LABEL = {running:'作成中', queued:'生成機で順番待ち', todo:'待ち', ready:'できあがり'};
/* 1件の右端に出す時刻・経過。**起点を必ず名乗る**（オーナー指摘 2026-08-28: どこから
   数えた時間か分からないと大げさに見える）。できあがったものは「できあがりから」。 */
function gfWhen(j){
  if (j.state === 'running') {
    const head = `${GF_FROM_LABEL[j.fromKind] || ''}${gfDur(j.elapsed)}`;
    if (j.overBy > 0) return `${head}・見込み+${gfDur(j.overBy)}`;
    /* 発注起点の経過には順番待ちが混ざっているので、そこから「残り」も「まもなく」も
       言えない（言うと嘘になる）。起点と経過だけを出して、時刻は束の見込みに任せる。 */
    if (j.fromKind !== 'make') return head;
    return `${head}・${j.remaining > 0 ? `残り${gfDur(j.remaining)}` : 'まもなく'}`;
  }
  if (j.state === 'ready') return `できあがりから${gfDur(j.age)}`;
  return `${gfClock(j.eta)}ごろ`;
}

/* エピソード（動画1本）ごとに束ねる。畳んだ状態で「どこまで進んだか」「いつ揃うか」を
   見せるので、束ねる時点で進捗と状態の札まで決めておく。
   分母は「いまこの動画で待っている数」。手元へ降りた（回収済みの）ぶんは発注台帳の
   引き方からして入っていないので、そこは数えない。 */
const GF_UNIT = {h3_video:'映像', flux_image:'フレーム'};
function gfGroups(s, titles){
  const map = new Map();
  s.jobs.forEach(j => {
    const key = `${j.r.channel || ''}|${j.r.episode_seq || '—'}`;
    if (!map.has(key)) map.set(key, { key, seq: j.r.episode_seq || '—', who: gfWhose(j.r, titles),
                                      videoId: j.r.video_id || null, jobs: [] });
    map.get(key).jobs.push(j);
  });
  return [...map.values()].map(g => {
    const n = st => g.jobs.filter(j => j.state === st).length;
    const eta = g.jobs.reduce((mx, j) => Math.max(mx, j.eta || 0), 0);
    const kinds = [...new Set(g.jobs.map(j => j.kind))];
    const run = g.jobs.find(j => j.state === 'running');
    const ready = n('ready');
    const making = n('running') + n('queued') + n('todo');
    /* 見込みを超えて作り続けている1件があれば、それをいちばん強い札にする。
       **どれだけ超えたかを札に書く**（オーナー要望 2026-08-28: 超過とだけ出ても量が分からない）。
       超過を名乗れるのは作りはじめた時刻が取れているときだけ（gfState の overBy を参照）。 */
    const over = run && run.overBy > 0 ? run.overBy : null;
    const late = !!over;
    /* できあがりと生成中が混ざっている束は、畳んだままでも内訳が読めるようにする */
    const mix = (ready && making)
      ? `できあがり${ready}本は受け取り待ち・${making}本は生成中` : '';
    return Object.assign(g, {
      running: n('running'), queued: n('queued') + n('todo'), ready,
      eta: eta || null, late, over, mix,
      /* 受け取り待ちの最長経過（できあがりからの時間）。詰まりの判定に使う */
      readyAge: ready ? Math.max(...g.jobs.filter(j => j.state === 'ready').map(j => j.age)) : null,
      unit: kinds.length === 1 ? (GF_UNIT[kinds[0]] || '素材') : '素材',
      done: ready, total: g.jobs.length,
      badge: late ? {t:`見込み超過 +${gfDur(over)}`, c:'late'}
           : run ? {t:'制作中', c:'run'}
           : ready === g.jobs.length ? {t:'受け取り待ち', c:'ready'}
           : {t:'待ち', c:''}
    });
  });
}

/* 開いている束を覚えておく。カードは1分ごとに丸ごと描き直すので、覚えていないと
   開いたそばから閉じてしまう。キーはチャンネル＋動画の番号。
   toggle は泡立たない仕様なので捕捉フェーズ（第3引数 true）で拾う。 */
const gfOpen = new Set();
document.addEventListener('toggle', e => {
  const d = e.target;
  if (!d || !d.classList || !d.classList.contains('gfgrp')) return;
  if (d.open) gfOpen.add(d.dataset.gfkey); else gfOpen.delete(d.dataset.gfkey);
}, true);

function genfarmCard(gf){
  const s = gfState(gf);
  const titles = gf.titles || {};
  const stuck = s.stale.filter(j => j.age > GF_STALE_DONE_MIN * 60);
  const waitN = s.queued.length + s.todo.length;

  /* いちばん大きく出す1行。詰まりの疑い＞作成中＞順番待ち＞回収待ち＞空き の順で強い方を出す。
     **できあがりを待っているだけの状態を赤くしない**（オーナー指摘 2026-08-28: 生成が全部
     終わるまで回収しない作りなので、合間の待ちは正常）。赤は GF_STALE_DONE_MIN を超えたときだけ。 */
  const cur = s.running[0];
  const curWho = cur ? gfWhose(cur.r, titles) : null;
  const readyMax = s.stale.length ? Math.max(...s.stale.map(j => j.age)) : null;
  const head = stuck.length
    ? {cls:'bad', mark:'⚠', text:`できあがったのに手元へ降りてきていません（${stuck.length}件・できあがりから最長${gfDur(readyMax)}）`}
    : cur
      ? {cls:'run', mark:'●', text:`制作中 — ${esc(curWho.icon + ' ' + curWho.name)} ${
          esc(cur.r.episode_seq || '')}${curWho.title ? ' ' + esc(curWho.title) : ''} の${esc(gfPart(cur))}`}
      : waitN
        ? {cls:'warn', mark:'●', text:`${waitN}件が順番待ち（まだ動き出していません）`}
        : s.stale.length
          ? {cls:'info', mark:'●', text:`回収待ち ${s.stale.length}件（生成の合間にまとめて受け取ります）`}
          : {cls:'ok', mark:'✓', text:'空いています（待ちはありません）'};

  /* 数字3つ。**経過は必ず起点を名乗る**（発注からなのか、作りはじめてからなのか）。 */
  const tiles = [
    {k:'作成中', v:s.running.length,
     s:cur ? `${GF_FROM_LABEL[cur.fromKind] || ''}${gfDur(cur.elapsed)}${
         cur.overBy > 0 ? `（見込み+${gfDur(cur.overBy)}）` : ''}` : '—'},
    {k:'順番待ち', v:waitN,
     s:s.allDoneAt ? `${cur && cur.overBy > 0 ? '再見積り ' : ''}${gfClock(s.allDoneAt)} ごろ全部そろう`
       : '—'},
    {k:'受け取り待ち', v:s.stale.length,
     s:s.stale.length ? `できあがりから最長${gfDur(readyMax)}` : '—'}
  ].map(t => `<div class="gfm"><div class="k">${esc(t.k)}</div><div class="v">${t.v}</div>
      <div class="s">${esc(t.s)}</div></div>`).join('');

  /* 動画ごとに束ねる。既定は畳んだ状態で、押すと中のシーンが開く（オーナー要望 2026-08-27:
     シーン別の行が全部並ぶと縦に長く、行そのものには情報がほとんど無い）。
     畳んだまま読めるのは「進捗」と「全部そろう時刻」と「状態の札」の3つ。 */
  const groups = gfGroups(s, titles).map(g => {
    /* 1件は「何を作っているか」と「いつ」の2列だけ。状態はまとめて見出しに出すので
       ここには繰り返さない（オーナー指摘 2026-08-20: 同じことが2か所に出て分かりづらい） */
    const rows = g.jobs.map(j => `<div class="gfjob is-${esc(j.state)}">
        <span class="wt">${esc(gfPart(j))}</span>
        <span class="tm">${esc(gfWhen(j))}</span></div>`).join('');
    /* 動画として登録済みなら、開いたときだけ詳細（素材とレビューの記録）への口を出す。
       カード本体を押すと開閉するようになったので、見出しからの遷移はここへ分けた */
    const go = g.videoId
      ? `<div class="gfgo"><button type="button" data-gfvid="${esc(g.videoId)}"
           >この動画の記録を見る ›</button></div>` : '';
    /* 見込みを超えているあいだの時刻は「当初の見込み」ではなく引き直した見積り。
       同じ見た目で意味が変わらないよう「再見積り」と名乗る（オーナー要望 2026-08-28）。 */
    const etaWord = g.total > 1 ? 'ごろ 全部そろう' : 'ごろ できあがる';
    const eta = g.eta
      ? `<span class="et${g.late ? ' late' : ''}">${g.late
           ? '<span class="u2">再見積り</span>' : ''}${esc(gfClock(g.eta))}<span
           class="u">${etaWord}</span></span>`
      : `<span class="et"><span class="u">${g.readyAge != null
           ? `できあがりから${esc(gfDur(g.readyAge))}・手元に降りるのを待っています`
           : '手元に降りるのを待っています'}</span></span>`;
    return `<details class="gfgrp" data-gfkey="${esc(g.key)}"${gfOpen.has(g.key) ? ' open' : ''}>
      <summary class="gfghead">
        <span class="g1">
          <span class="who">${esc(g.who.icon)} ${esc(g.who.name)}</span>
          <span class="seq">${esc(g.seq)}</span></span>
        <span class="n ${g.badge.c}">${esc(g.badge.t)}</span>
        <span class="ttl">${esc(g.who.title)}</span>
        <span class="caret" aria-hidden="true">▾</span>
        <span class="gfbig">
          <span class="pg" title="できあがった数 ／ この動画で待っている数"><span
            class="u">${esc(g.unit)}</span>${g.done}<span class="d">/${g.total}</span></span>
          ${eta}</span>
        ${g.mix ? `<span class="sub">${esc(g.mix)}</span>` : ''}</summary>
      <div class="gfjobs">${rows}</div>${go}</details>`;
  }).join('');

  return `<section class="card gfcard">
    <div class="sectionhead" style="margin:0 0 var(--sp-3)"><h2>🖥 gen-farm（実家の生成機）のいま</h2>
      <span class="hint">${gf.at ? `${esc(gfClock(gf.at))} 時点` : ''}</span></div>
    <div class="gfhead ${head.cls}"><span class="mk">${head.mark}</span><span>${head.text}</span></div>
    <div class="gfmetrics">${tiles}</div>
    ${s.jobs.length ? `<div class="gfgroups">${groups}</div>`
      : `<div class="noitem">待っている生成はありません</div>`}
    ${stuck.length ? `<div class="note" style="margin:var(--sp-3) 0 0"><span>⚠</span><div>生成機の中では
      出来上がっているのに、<b>できあがりから${esc(gfDur(readyMax))}</b>のあいだ手元のパソコンへ
      降りてきていません。<b>その動画の生成をやり直す</b>と回収されます。</div></div>` : ''}
  </section>`;
}

/* ══ 自動運転のいま（#330・オーナー要望 2026-08-24）═══════════════════════════
   「承認を押したのに生成機が動かない」とき、理由を3択に分解して見せる:
   本当に暇 ／ 裏でAIが考え中 ／ 進行係が落ちている。今までは全部同じに見えたので、
   オーナーは次の承認を押して様子を見る探り運転になっていた。

   データは既存の権限のまま読む（DB 変更なし）:
     ・進行係の心拍   … system_heartbeat（誰でも読める・5分ごとに更新される1行。
                        2026-08-28 からレビュー見張りに代わって進行係が打つ）
     ・実行中のAI     … agent_runs の未終了行＋最新の途中経過（全チャンネル可ユーザー限定。
                        読めないユーザーではこの行だけ静かに消える）
     ・発注待ちの承認 … 絵コンテ承認済みなのに、承認より新しい発注記録が無い動画 */
const AUTO_TTL_MS = 60000;
/* 「いま動いている」側の言い方。ここに無い種類は下の記録側の対応表（RUN_KIND_JA）に
   落として拾うので、新しい種類は原則あちらに足すだけでよい（制作の工程 dispatcher-* は
   全部あちらにある）。 */
const AUTO_RUN_JA = {
  'daily-log':'日次ログ同期', 'x-reply':'Xのリプ投稿', 'x-post-publish':'Xの投稿',
  'x-post-propose':'Xのネタ提案', 'weekly-review':'週次レビュー'};
async function loadAutomationNow(force){
  if (!force && store.autonow && Date.now() - store.autonow.at < AUTO_TTL_MS) return store.autonow;
  const out = { beat: null, runs: [], runNotes: {}, waiting: [], at: Date.now() };
  try {
    out.beat = (await q(sb.from('system_heartbeat').select('beat_at,source').limit(1)))[0] || null;
  } catch (_) {}
  try {
    const cut = new Date(Date.now() - 2 * 3600e3).toISOString();   /* 心拍の切れた残骸は見せない */
    out.runs = (await q(sb.from('agent_runs').select('id,kind,channel,started_at,heartbeat_at')
      .is('finished_at', null).gte('heartbeat_at', cut)
      .order('id', { ascending: false }).limit(3))) || [];
    if (out.runs.length) {
      const evs = await q(sb.from('agent_run_events').select('run_id,body')
        .in('run_id', out.runs.map(r => r.id)).order('id', { ascending: false }).limit(10));
      (evs || []).forEach(e => { if (!(e.run_id in out.runNotes)) out.runNotes[e.run_id] = e.body; });
    }
  } catch (_) {}   /* 全チャンネル可ユーザー以外は読めない＝0件のまま */
  try {
    const vids = (await q(sb.from('v_dashboard_list')
      .select('seq,title,approved_storyboard_at').eq('channel', state.ch)
      .eq('status', '素材制作中').not('approved_storyboard_at', 'is', null))) || [];
    if (vids.length) {
      const oldest = vids.map(v => v.approved_storyboard_at).sort()[0];
      const jobs = (await q(sb.from('generation_jobs').select('episode_seq,created_at')
        .in('episode_seq', vids.map(v => v.seq)).gte('created_at', oldest))) || [];
      const latest = {};
      jobs.forEach(j => {
        if (!latest[j.episode_seq] || latest[j.episode_seq] < j.created_at)
          latest[j.episode_seq] = j.created_at;
      });
      out.waiting = vids.filter(v => !latest[v.seq] || latest[v.seq] < v.approved_storyboard_at);
    }
  } catch (_) {}
  store.autonow = out;
  return out;
}
function automationCard(an){
  const mins = ts => Math.max(0, Math.round((Date.now() - new Date(ts)) / 60000));
  /* 心拍。進行係は5分ごとに打つので、15分空いたら「落ちているかも」と言い切る
     （2026-08-28 にレビュー見張りから進行係へ引き継いだ・打ち手は system_heartbeat.source） */
  let beat;
  if (!an.beat) {
    beat = `<div class="gfhead warn"><span class="mk">–</span><span>進行係の心拍を読み込めませんでした</span></div>`;
  } else {
    const m = mins(an.beat.beat_at);
    beat = m < 15
      ? `<div class="gfhead ok"><span class="mk">●</span><span>進行係: 稼働中（最終確認 ${m}分前）</span></div>`
      : `<div class="gfhead bad"><span class="mk">⚠</span><span>進行係: <b>${m}分間 音沙汰がありません</b> — 止まっているかもしれません（自動の復旧を待っても直らなければ PC を確認）</span></div>`;
  }
  const runs = an.runs.map(r => {
    const what = AUTO_RUN_JA[r.kind] || RUN_KIND_JA[r.kind] || r.kind;
    const note = an.runNotes[r.id]
      ? ` — ${esc(String(an.runNotes[r.id]).slice(0, 80))}` : '';
    return `<div style="display:flex;gap:8px;align-items:baseline;font-size:var(--fs-sm)">
      <span>↻</span><div>${AI_TAG}作業中: <b>${esc(what)}</b>
      （${esc(fmtDT(r.started_at) || '')} 開始）${note}</div></div>`;
  }).join('');
  const waiting = an.waiting.length
    ? `<div style="display:flex;gap:8px;align-items:baseline;font-size:var(--fs-sm)">
        <span>●</span><div>発注待ちの承認: <b>${an.waiting.length}件</b>
        （${esc(an.waiting.map(v => v.seq).join('・'))}）— 5分以内に進行係が生成機へ送ります</div></div>`
    : '';
  const idle = !runs && !waiting
    ? `<div class="noitem">いま動いている自動の作業はありません（承認・差し戻しを押せば5分以内に拾います）</div>` : '';
  return `<section class="card gfcard">
    <div class="sectionhead" style="margin:0 0 var(--sp-3)"><h2>🤖 自動運転のいま</h2>
      <span class="hint">生成機が空でも、下に${AI_TAG}作業中が出ていれば裏で進んでいます</span></div>
    ${beat}
    ${runs || waiting ? `<div class="stack" style="gap:6px;margin-top:var(--sp-3)">${runs}${waiting}</div>` : idle}
  </section>`;
}

/* ── gen-farm カードの自動更新（オーナー指定 2026-08-20: 1分おき・見ている間だけ）──────
   条件を絞って無駄打ちしない: システムタブを開いていて、かつブラウザのタブが手前に
   ある間だけ取りに行く（裏に回している間は止める。戻ってきたら即1回取り直す）。
   描き直すのはカードの中だけ（#gfslot）＝ページ全体を再描画しないのでスクロール位置も動かない。 */
const GF_AUTO_MS = 60000;
let gfTimer = null;
function stopGenfarmAuto(){ if (gfTimer) { clearInterval(gfTimer); gfTimer = null; } }
function startGenfarmAuto(){
  stopGenfarmAuto();
  gfTimer = setInterval(refreshGenfarmCard, GF_AUTO_MS);
}
async function refreshGenfarmCard(){
  const slot = $('#gfslot');
  /* 画面が変わった／タブが裏に回った／ログアウトした ならこの回は何もしない */
  if (!slot || state.view !== 'admin' || document.hidden || !state.user
      || state.detail != null) return;      /* 詳細を開いている間は取りに行かない */
  let gf;
  try { gf = await loadGenfarm(true); }
  catch (_) { return; }                 /* 一時的に読めなくても前の表示を残す */
  if (!$('#gfslot') || state.view !== 'admin') return;   /* 待っている間に画面が変わった */
  $('#gfslot').innerHTML = genfarmCard(gf);
  /* 自動運転のカードも同じ1分周期で取り直す（#330。失敗しても前の表示を残す） */
  try {
    const an = await loadAutomationNow(true);
    if ($('#autoslot') && state.view === 'admin') $('#autoslot').innerHTML = automationCard(an);
  } catch (_) {}
}
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && state.view === 'admin') refreshGenfarmCard();
});

/* ── 費用（#321）───────────────────────────────────────────────
   手元PCのステータスパネルが30分ごとに書いた値を読むだけ。**PCが落ちている間は
   更新されない**ので、必ず「いつ時点の値か」を添える。
   配色は手元パネルと同じ約束: 緑→赤＝使い切ると困るもの / 琥珀＝お金。 */
const COST_TTL_MS = 60000;

async function loadCost(force){
  if (!force && store.cost && Date.now() - store.cost.at < COST_TTL_MS) return store.cost;
  const pick = kind => q(sb.from('usage_snapshots').select('captured_at,payload')
    .eq('kind', kind).order('captured_at', { ascending: false }).limit(1));
  const [ai, bill] = await Promise.all([pick('ai_usage'), pick('billing')]);
  store.cost = { at: Date.now(), ai: ai[0] || null, billing: bill[0] || null };
  return store.cost;
}

function costAgo(iso){
  if (!iso) return '—';
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 90) return 'たった今';
  if (s < 3600) return Math.round(s / 60) + '分前';
  if (s < 86400) return Math.round(s / 3600) + '時間前';
  return Math.round(s / 86400) + '日前';
}
const costUsd = n => '$' + Number(n ?? 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const costYen = n => '¥' + Math.round(Number(n ?? 0)).toLocaleString('ja-JP');
/* ⚠ 色は**このダッシュボードに定義がある変数**を使うこと。存在しない名前（--bad 等）を書くと
   background が無効になり、バーが透明になって「100%なのに何も出ない」になる（2026-08-24 に発生）。
   ここは手元パネルと同じ約束（緑→黄→橙→赤＝使い切ると困るもの）。 */
const costLvl = p => p >= 95 ? '#d03b3b' : p >= 80 ? '#ec835a' : p >= 50 ? '#fab219' : '#0ca30c';

function costMeter(label, pct, right, color, sub){
  if (pct == null) {

    <div class="cm-v">${esc(right)}</div></div>` + (sub ? `<div class="cm-s">${esc(sub)}</div>` : '');
}

function costView(d){

  const stale = stamp && (Date.now() - new Date(stamp).getTime()) > 3 * 3600 * 1000;

  let html = `<style>

    .cm{display:grid;grid-template-columns:88px 1fr 50px;gap:9px;align-items:center;padding:3px 0}
    .cm-k{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .cm-t{height:7px;border-radius:4px;background:rgba(127,127,127,.18);position:relative;overflow:hidden}
    .cm-t i{display:block;height:100%;border-radius:4px}
    .cm-t u{position:absolute;inset:0;background:repeating-linear-gradient(to right,
      transparent 0 calc(10% - 1px),rgba(127,127,127,.45) calc(10% - 1px) 10%)}
    .cm-v{text-align:right;font-size:12px;font-variant-numeric:tabular-nums}
    .cm-s{font-size:10.5px;color:var(--muted);margin:0 0 6px 97px}
    .cost-kv{display:flex;justify-content:space-between;align-items:center;padding:7px 9px;
      margin:8px -3px 0;border-radius:8px;background:rgba(127,127,127,.09)}
    .cost-kv b{font-size:13px}
    .cost-kv .amt{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
    .cost-hero{font-size:31px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin:2px 0 3px}
    .cost-hero small{font-size:14px;font-weight:500;color:var(--muted);margin-left:7px}
    .cost-item{display:grid;grid-template-columns:1fr 70px;gap:9px;font-size:11.5px;padding:3px 0}
    .cost-item .c{text-align:right;font-variant-numeric:tabular-nums}
    .cost-bd{margin:5px 0 2px 12px;padding-left:12px;border-left:2px solid var(--line)}
  </style>
  <p class="cost-note${stale ? ' stale' : ''}">
    ${stamp ? `${esc(costAgo(stamp))}の値（${esc(fmtDT(stamp))}）` : 'まだ記録がありません'}
    ${stale ? ' ・ 自宅PCが止まっている間は更新されません' : ''}
  </p><div class="cost-wrap">`;

  /* AI残量 */
  html += `<div class="cost-card"><h3>AI残量</h3>`;
  if (!ai) html += `<div class="cost-note">まだ記録がありません</div>`;
  else {
    const jp = { claude: 'Claude', codex: 'Codex', grok: 'Grok' };
    /* ⚠ 保存先が JSONB なので**キーの順序は保たれない**（短い順→辞書順になり grok が先頭に来る）。
       手元のパネルと同じ並びに揃える（オーナー指摘 2026-08-24） */
    const ORDER = ['claude', 'codex', 'grok'];
    const rank = k => { const i = ORDER.indexOf(k); return i < 0 ? 99 : i; };
    /* Claude は複数アカウントを並べる（#319）。1つしか無ければ従来どおり1件 */
    const rows = [];
    for (const [k, p] of Object.entries(ai.providers || {}).sort((a, b) => rank(a[0]) - rank(b[0]))) {
      if (k === 'claude' && Array.isArray(p.accounts) && p.accounts.length) p.accounts.forEach(a => rows.push([k, a]));
      else rows.push([k, p]);
    }
    const multiClaude = rows.filter(r => r[0] === 'claude').length > 1;

    for (const [k, p] of rows) {
      const who = (k === 'claude' && p.email && multiClaude)
        ? ` <span style="font-weight:400;opacity:.75">${esc(String(p.email).split('@')[0])}</span>` : '';
      html += `<div class="cost-prov">${jp[k] || k}${who}<span>${esc(p.plan || '')}</span></div>`;
      if (!p.ok) { html += `<div class="cm-s" style="margin-left:0">取得できませんでした</div>`; continue; }
      for (const w of p.windows || []) {
        if (w.percent == null) { html += costMeter(w.label, null, '', '', p.note || '使用率を取得できません'); continue; }
        const pc = Math.round(w.percent);
        html += costMeter(w.label, pc, pc + '%', costLvl(pc),
          w.resets_at ? 'リセット ' + fmtDT(w.resets_at) : '');
      }
      /* Grok の製品別の内訳（統合請求で追加） */
      if (p.products && p.products.length)
        html += `<div class="cm-s" style="margin-left:0">内訳 ${esc(p.products.map(x => `${x.name} ${x.percent}%`).join(' · '))}</div>`;
      /* 追加クレジット（枠超過分を従量で買う設定。無効なら「無効」と出す・オーナー指定） */
      if (k === 'claude') {
        const c = p.credit;
        html += `<div class="cm-s" style="margin-left:0">追加クレジット ` + (
          c ? `${esc(costUsd(c.used ?? 0))} / ${esc(costUsd(c.limit ?? 0))}`
              + `（${Math.round(c.percent ?? 0)}%）　残り ${esc(costUsd(c.remaining ?? 0))}`
            : (p.extra_usage ? '有効（まだ使っていません）' : '無効')) + `</div>`;
      }
    }
  }
  html += `</div>`;

  /* 今月の請求 */
  html += `<div class="cost-card"><h3>今月の請求</h3>`;
  if (!bill) html += `<div class="cost-note">まだ記録がありません</div>`;
  else {
    const fal = bill.fal || {}, gcp = bill.gcp || {}, el = bill.elevenlabs || {};
    const falNow = (fal.this_month || {}).total, gcpNow = gcp.ok ? (gcp.this_month || {}).total : null;
    html += `<div class="cost-hero">${esc(costUsd((falNow || 0) + (gcpNow || 0)))}<small>USD</small></div>
      <p class="cost-note">fal.ai${gcp.ok ? ' ＋ Google Cloud' : ''} の合計</p>`;
    if (fal.ok) {
      html += `<div class="cost-kv"><b>fal.ai</b><span class="amt">${esc(costUsd(falNow))}</span></div>
        <div class="cost-bd">`;
      for (const i of ((fal.this_month || {}).items || []).slice(0, 5))
        html += `<div class="cost-item"><div>${esc(String(i.name).replace(/^fal-ai\//, ''))}</div>
          <div class="c">${esc(costUsd(i.cost))}</div></div>`;
      html += `</div>`;
      if (fal.balance != null)
        html += `<div class="cm-s" style="margin-left:12px;${fal.balance < 20 ? 'color:#ec835a' : ''}">
          ${fal.balance < 20 ? '⚠ ' : ''}残高 ${esc(costUsd(fal.balance))}（前払い式）</div>`;
    }
    if (gcp.ok) {
      const jpy = (gcp.this_month || {}).total_local;
      html += `<div class="cost-kv"><b>Google Cloud</b><span class="amt">${esc(costUsd(gcpNow))}
        ${jpy != null && gcp.currency === 'JPY' ? `<small style="font-size:11px;font-weight:400;opacity:.7">${esc(costYen(jpy))}</small>` : ''}</span></div>
        <div class="cost-bd">`;
      for (const i of ((gcp.this_month || {}).items || []).slice(0, 4))
        html += `<div class="cost-item"><div>${esc(i.name)}</div>
          <div class="c">${esc(i.cost_local != null && gcp.currency === 'JPY' ? costYen(i.cost_local) : costUsd(i.cost))}</div></div>`;
      html += `</div>`;
    } else {
      html += `<div class="cost-kv"><b>Google Cloud</b><span class="cm-s" style="margin:0">${esc(gcp.pending ? '書き出し待ち' : '取得できません')}</span></div>`;
    }
    if (el.ok) {
      html += `<div class="cost-kv"><b>ElevenLabs</b><span class="cm-s" style="margin:0">月額固定（${esc(el.tier || '')}）</span></div>`;
      html += costMeter('音声の文字数', el.percent, (el.percent ?? 0) + '%', costLvl(el.percent ?? 0),
        `${Number(el.used || 0).toLocaleString('ja-JP')} / ${Number(el.limit || 0).toLocaleString('ja-JP')} 字`);
    }
  }
  html += `</div></div>`;
  return html;
}



/* ══ ④ 運営 ═══════════════════════════════════════════════════
   稼働・システム・費用を1つに畳んだ横断タブ（オーナー決定 2026-08-24）。
   並びは「いま → お金 → 記録 → 調べる」。常に開いているのは「いま」だけで、下の3つは畳む。
   ただし異常・残量僅少のときは畳んだ節が自分から開く（見てほしいものは隠さない）。 */

/* 実行記録（旧「稼働」タブ・旧見出し「自動で動いた記録」）。1件の状態を4つに畳む。ok は「最後まで走ったか」しか
   表さないので、業務上の注意（⚠ 付きの要約）は別に拾う。
   「いま実行中」の1枚はここには出さない — 同じ agent_runs の走っている行を、上の
   「自動運転のいま」がすでに出しているため（3タブ時代は同じものを2か所に出していた）。
   絞り込みは「上のカードが実際に出した行」だけを外す形にする（2026-08-26 修正: それまで
   コメントだけで実装が無く、二重に出ていた）。上が拾わなかった走行中の行——心拍が
   切れて久しい残骸など——はここに残す。「途中で止まった」と見せたいのはこちらのため。 */
function recordSection(ops, an){
  const shownNow = new Set(((an && an.runs) || []).map(r => r.id));
  if (shownNow.size) ops = { ...ops, runs: ops.runs.filter(r => !shownNow.has(r.id)) };
  const stateOf = r => {
    const stale = r.ok == null && r.started_at
      && (Date.now() - new Date(r.started_at).getTime()) > STALE_RUN_MS;
    if (r.ok === false || stale) return {key:'err', cls:'err', txt: r.ok === false ? '✕ エラー' : '✕ 途中で止まった'};
    if (r.ok == null) return {key:'run', cls:'run', txt:'● 実行中'};
    return String(r.summary || '').includes('⚠')
      ? {key:'warn', cls:'warn', txt:'⚠ 注意あり'} : {key:'ok', cls:'ok', txt:'✓ 正常終了'};
  };
  const states = ops.runs.map(stateOf);
  const nErr  = states.filter(s => s.key === 'err').length;
  const nWarn = states.filter(s => s.key === 'warn').length;
  const head = !ops.runs.length ? {cls:'', text:'— まだ記録がありません'}
    : nErr  ? {cls:'bad',  text:`✕ 直近${ops.runs.length}件のうち ${nErr}件でエラー`}
    : nWarn ? {cls:'warn', text:`⚠ 直近${ops.runs.length}件のうち ${nWarn}件に注意あり`}
    : {cls:'', text:`✓ 直近${ops.runs.length}件はすべて正常`};

  const runs = ops.runs.map((r, i) => {
    const st = states[i];
    const evs = ops.events.filter(e => e.run_id === r.id);
    const dur = durText(r.started_at, r.finished_at);
    const acts = evs.map(e => {
      const m = e.channel ? chMeta(e.channel) : null;
      const tag = m ? `<span class="cq" style="background:${m.tint}" title="${esc(m.name)}">${m.icon}</span>`
                    : `<span class="cq">共通</span>`;
      const sev = e.severity === 'error' ? 'bad' : (e.severity === 'warn' ? 'warn' : '');
      const mk = e.severity === 'error' ? '✕' : (e.severity === 'warn' ? '⚠' : '✓');
      return `<li class="${sev}">${tag}<span class="mk">${mk}</span><span class="tm">${esc(fmtTime(e.at))}</span><span class="bd">${esc(e.body)}</span></li>`;
    }).join('');
    /* 異常があったものだけ最初から開いておく（見てほしいものを隠さない） */
    const open = st.key === 'err' || st.key === 'warn' || st.key === 'run';
    return `<details class="run ${st.cls === 'run' ? 'run-' : st.cls}"${open ? ' open' : ''}>
      <summary class="runhead"><span class="tri">▸</span>
        <span class="when">${esc(fmtDT(r.started_at) || '—')}</span>
        <span class="kind">${esc(RUN_KIND_JA[r.kind] || r.kind)}</span>
        ${dur ? `<span class="dur">所要 ${esc(dur)}</span>` : ''}
        <span class="stat ${st.cls}">${st.txt}</span></summary>
      <div class="runbody">
        ${r.summary ? `<div class="runsummary">${esc(r.summary)}</div>` : ''}
        ${laneChips(r.lanes)}
        ${evs.length ? `<ul class="acts">${acts}</ul>`
          : `<div class="dhint">この回の細かい記録は残っていません</div>`}
      </div></details>`;
  }).join('');

  return `<details class="opsec"${(nErr || nWarn) ? ' open' : ''}>
    <summary>🌙 実行記録<span class="s ${head.cls}">${esc(head.text)}</span></summary>
    <p class="opsnote">動画の制作やXの投稿など、自動で走った仕事の結果です。
      行を押すと中身が見られます（異常があった回は最初から開いています）。</p>
    ${ops.runs.length ? `<div class="runs">${runs}</div>`
      : `<div class="noitem">まだ記録がありません</div>`}</details>`;
}

/* お金（旧「費用」タブ）。畳んだままでも「今月いくら」が見えるようにし、
   目立たせるのは尽きそうなときだけ（前払い残高が少ない・AI残量が残りわずか・値が古い）。 */
function moneySection(d){
  const ai = d.ai && d.ai.payload, bill = d.billing && d.billing.payload;
  const stamp = [d.ai && d.ai.captured_at, d.billing && d.billing.captured_at].filter(Boolean).sort().pop();
  const stale = stamp && (Date.now() - new Date(stamp).getTime()) > 3 * 3600 * 1000;

  let total = null;
  if (bill) {
    const fal = bill.fal || {}, gcp = bill.gcp || {};
    const f = (fal.this_month || {}).total, g = gcp.ok ? (gcp.this_month || {}).total : null;
    if (f != null || g != null) total = (f || 0) + (g || 0);
  }
  let hot = 0;
  if (ai) for (const pv of Object.values(ai.providers || {}))
    for (const w of (pv.windows || [])) if (w.percent != null && w.percent >= 90) hot++;
  const lowBal = bill && bill.fal && bill.fal.balance != null && bill.fal.balance < 20;

  let cls = '', note = '';
  if (lowBal)     { cls = 'bad';  note = ' ・ ⚠ fal.ai の残高が少なくなっています'; }
  else if (hot)   { cls = 'warn'; note = ` ・ ⚠ 残りわずかなAIの枠が${hot}件`; }
  else if (stale) { cls = 'warn'; note = ' ・ 自宅PCが止まっていて値が古いままです'; }

  const sum = (total == null ? 'まだ記録がありません' : `今月 ${costUsd(total)}`) + note;
  return `<details class="opsec"${cls ? ' open' : ''}>
    <summary>💰 今月の請求とAI残量<span class="s ${cls}">${esc(sum)}</span></summary>
    ${costView(d)}</details>`;
}

/* ══ ツールチップ ═══════════════════════════════════════════════ */
const tip = $('#tip');
function showTip(html, x, y){
  tip.innerHTML = html; tip.classList.add('on');
  const r = tip.getBoundingClientRect();
  tip.style.left = Math.max(8, Math.min(x - r.width / 2, window.innerWidth - r.width - 8)) + 'px';
  tip.style.top = Math.max(8, y - r.height - 12) + 'px';
}
const hideTip = () => tip.classList.remove('on');

/* グラフのホバー（十字線＋吹き出し）。pts は SVG 座標の点の並びで、
   {x, y, html} を持つ。mode='xy' は散布図（いちばん近い点）、既定は横方向でいちばん近い点。
   ホバーの受け皿は SVG 全面の透明な矩形なので、点そのものより広く当たる。 */
function bindHover(wrap, pts, mode){
  if (!wrap || !pts || !pts.length) return;
  const svg = wrap.querySelector('svg'); if (!svg) return;
  const vb = svg.viewBox.baseVal, W = vb.width, H = vb.height;
  if (!W || !H) return;
  const hov = svg.querySelector('.hov');
  const hl = hov && hov.querySelector('.hl');
  /* 印はチャンネルの数だけある。点が {ys:[…]} を持っていれば全チャンネルぶんを同時に置く
     （持っていなければ先頭の1つだけを使う＝散布図など1系列のグラフ） */
  const hds = hov ? [...hov.querySelectorAll('.hd')] : [];
  const move = e => {
    const r = svg.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    const px = (t.clientX - r.left) / r.width * W, py = (t.clientY - r.top) / r.height * H;
    let best = pts[0], bd = Infinity;
    for (const p of pts) {
      const d = mode === 'xy' ? Math.hypot(p.x - px, p.y - py) : Math.abs(p.x - px);
      if (d < bd) { bd = d; best = p; }
    }
    if (hov) {
      hov.style.display = '';
      if (hl) { hl.setAttribute('x1', best.x); hl.setAttribute('x2', best.x); }
      hds.forEach((hd, i) => {
        const y = best.ys ? best.ys[i] : (i === 0 ? best.y : null);
        if (y == null) { hd.style.display = 'none'; return; }
        hd.style.display = '';
        hd.setAttribute('cx', best.x); hd.setAttribute('cy', y);
      });
    }
    showTip(best.html, r.left + best.x / W * r.width, r.top + best.y / H * r.height);
  };
  const out = () => { if (hov) hov.style.display = 'none'; hideTip(); };
  svg.addEventListener('mousemove', move);
  svg.addEventListener('mouseleave', out);
  svg.addEventListener('touchstart', move, { passive: true });
  svg.addEventListener('touchmove', move, { passive: true });
  svg.addEventListener('touchend', out);
}

let toastT;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 3000);
}

/* ── 1クリック承認と「取り消し」の猶予（オーナー要望 2026-08-20）──────────────────
   承認は1タップで通るようにしたい。ただし承認は取り消せない操作なので、押した瞬間に
   DB へ書かず、数秒の猶予をおいてから書く（その間は「取り消す」で無かったことにできる）。
   確認ダイアログを挟むより速く、誤タップも救える。
   猶予中にページを離れる／別の書き込みをするときは、待たずにその場で確定する。 */
const UNDO_MS = 6000;
let pendingAct = null;      /* {commit, timer} — 猶予中の1件だけ持つ */
function flushPendingAct(){
  if (!pendingAct) return;
  clearTimeout(pendingAct.timer);
  const run = pendingAct.commit; pendingAct = null;
  hideToast(); run();
}
function actWithUndo(msg, commit, onUndo){
  flushPendingAct();
  const timer = setTimeout(() => { pendingAct = null; hideToast(); commit(); }, UNDO_MS);
  pendingAct = { commit, timer };
  toastUndo(msg, () => {
    if (!pendingAct) return;            /* すでに確定していたら何もしない */
    clearTimeout(pendingAct.timer); pendingAct = null; hideToast();
    if (onUndo) onUndo();
    toast('取り消しました');
  });
}
function hideToast(){ clearTimeout(toastT); $('#toast').classList.remove('on'); }
function toastUndo(msg, undo){
  const t = $('#toast');
  t.innerHTML = '';
  t.appendChild(document.createTextNode(msg));
  const b = document.createElement('button');
  b.className = 'undo'; b.textContent = '取り消す';
  b.addEventListener('click', undo);
  t.appendChild(b);
  t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), UNDO_MS);
}
/* ページを閉じる・裏に回すときは待たずに確定する（押したのに記録されない、を防ぐ） */
window.addEventListener('pagehide', flushPendingAct);
document.addEventListener('visibilitychange', () => { if (document.hidden) flushPendingAct(); });

/* ══ 描画オーケストレーション ═══════════════════════════════════ */
/* 進捗マトリクスのページスクロール用: サイトヘッダー(.topbar＝トップバー＋ナビ)の実高さと
   マトリクス2段ヘッダーの1段目高さを実測し CSS 変数へ反映（sticky thead の top オフセット・#204）。 */
function syncStickyOffsets(){
  const tb = document.querySelector('.topbar');
  if (tb) document.documentElement.style.setProperty('--stickytop', tb.offsetHeight + 'px');
  const grp = document.querySelector('.mtx thead tr:first-child');
  if (grp) document.documentElement.style.setProperty('--mtxrow1', grp.offsetHeight + 'px');
}

async function render(){
  renderShell();
  stopGenfarmAuto();          /* 画面を離れたら gen-farm の自動更新は止める（開いた画面が付け直す） */
  state.busy = true; renderShell();
  try {
    if (state.view === 'stock')          await renderStock();
    else if (state.view === 'analytics') await renderAnalytics();
    else if (state.view === 'admin')     await renderAdmin();
    state.lastSync = new Date().toISOString();
  } catch (e) {
    $('#view-' + state.view).innerHTML = errBox(e.message);
  } finally {
    state.busy = false;
    renderShell();
    syncStickyOffsets();
  }
}

async function reloadAll(){
  clearVideoCaches(); store.ops = null; store.analytics = {}; store.assets = {}; store.system = null;
  store.cost = null; store.autonow = null;   /* 運営タブ（お金・自動運転のいま） */
  store.genfarm = null;         /* gen-farm の待ち行列は30秒キャッシュ。⟳ では必ず取り直す */
  state.busy = true; renderShell();
  try { await loadBootstrap(); } catch (e) { toast('再読み込みに失敗: ' + e.message); }
  await render();
  toast('最新のデータを読み込みました');
}

/* ══ イベント ═══════════════════════════════════════════════════ */
document.addEventListener('click', e => {
  /* 書き込み（コメント・承認）は他のハンドラより先に拾う */
  const wbtn = e.target.closest('[data-act]');
  if (wbtn) {
    const act = wbtn.dataset.act;
    /* 承認は一覧の行にもボタンがある（囲みの外なので box 判定より先に処理する） */
    if (act === 'approve-quick') { quickApprove(wbtn.dataset.key, wbtn); return; }
    /* 下端の固定バーのボタンは囲みの外にあるので、決める枠ごしに相手の囲みを引く（#509 段1） */
    const box = actBox(wbtn, act);
    if (box) {
      /* 完成のタップ入力が動いていれば構造化した指摘を送る。それ以外は従来の自由記述 */
      if (act === 'comment')              (tapActive(wbtn.dataset.key) ? submitTapChanges : submitComment)(box, wbtn.dataset.key);
      else if (act === 'reject-open')     toggleRejectPanel(box);
      else if (act === 'reject-cancel')   closeRejectPanel(box);
      else if (act === 'reject-confirm')  submitReject(box, wbtn.dataset.key);
      else if (act === 'triage-retype')   submitTriage(box, wbtn.dataset.key, 'retype');
      else if (act === 'triage-produce')  submitTriage(box, wbtn.dataset.key, 'produce');
    }
    return;
  }

  /* 過去の指摘（同じ版のもの）を押したら、左列の動画をその時刻へ動かしてピンを出す（#509 段4） */
  const jrow = e.target.closest('[data-njump]');
  if (jrow && tap) {
    const p = (jrow.dataset.npin || '').split(',').map(Number);
    tapGoto(Number(jrow.dataset.njump), p.length === 2 && isFinite(p[0]) ? { x:p[0], y:p[1] } : null);
    return;
  }

  /* 詳細内の「戻る／閉じる」は履歴を戻す（popstate で一覧へ復帰・経路を一本化） */
  if (e.target.closest('[data-close]')) { history.back(); return; }

  /* チャンネル名そのものを押したときは、開閉ではなく切り替えとして扱う（2026-08-20） */
  const goBtn = e.target.closest('.chgo[data-ch]');
  if (goBtn) e.preventDefault();
  const chBtn = e.target.closest('.chtab[data-ch], .chitem[data-ch], .chgo[data-ch]');
  if (chBtn) {
    state.ch = chBtn.dataset.ch; state.open = null; closeDetail(); resetStockFilters();
    /* チャンネル共通の画面（稼働・システム）から押したときは、そのチャンネルの制作へ戻す。
       戻り道が無いと「押しても何も起きない」ように見える（2026-08-20 オーナー指摘） */
    const cur = VIEWS.find(v => v.key === state.view);
    if (cur && cur.chIndep) state.view = 'stock';
    saveUI(); render(); return;
  }

  /* 画面の切り替え。下のナビ（制作・分析）と、チャンネルタブ右の共通タブ（稼働・システム）の両方 */
  const navBtn = e.target.closest('.navbtn[data-view], .chtab[data-view]');
  if (navBtn) { state.view = navBtn.dataset.view; saveUI(); render(); window.scrollTo({ top: 0 }); return; }

  /* 一覧の畳んだセクション（完了・ネタ案・没）の開閉 */
  const secBtn = e.target.closest('[data-secfold]');
  if (secBtn) {
    const k = secBtn.dataset.secfold;
    state.secOpen[k] = !state.secOpen[k];
    refreshStockTable(); return;
  }




  const filT = e.target.closest('#filtoggle');
  if (filT) {
    state.filtersOpen = !state.filtersOpen;
    $('#filterbox').classList.toggle('open', state.filtersOpen);
    filT.setAttribute('aria-expanded', String(state.filtersOpen));
    return;
  }

  const chipBtn = e.target.closest('.chipf:not([disabled])');
  if (chipBtn) {
    const k = chipBtn.dataset.filter || null;
    state.stockFilter = (state.stockFilter === k) ? null : k;
    state.stockPage = 0;                 /* 条件を変えたら1ページ目から */
    refreshStockTable(); return;
  }
  if (e.target.closest('#stockreset')) { resetStockFilters(); renderStock(); return; }

  const sortTh = e.target.closest('.mtx th.sortable');
  if (sortTh) {
    const k = sortTh.dataset.sort, s = state.stockSort;
    state.stockSort = (s && s.key === k)
      ? (s.dir === 'asc' ? { key: k, dir: 'desc' } : null)
      : { key: k, dir: 'asc' };
    state.stockPage = 0;
    refreshStockTable(); return;
  }

  /* ページ送り（#215 Phase 2）。並べ替えは DB 側なので、ページを跨いでも順番は正しい */
  if (e.target.closest('#pgprev')) {
    if (state.stockPage > 0) { state.stockPage--; refreshStockTable(); window.scrollTo({ top: 0 }); }
    return;
  }
  if (e.target.closest('#pgnext')) {
    const c = store.core[state.ch];
    if (c && (state.stockPage + 1) * PAGE_SIZE < c.total) {
      state.stockPage++; refreshStockTable(); window.scrollTo({ top: 0 });
    }
    return;
  }

  /* gen-farm の動画カードを押したら、その動画の詳細（素材とレビューの記録）を開く */
  const gfRow = e.target.closest('[data-gfvid]');
  if (gfRow) { pushDetail(gfRow.dataset.gfvid); return; }

  const row = e.target.closest('.mtx tbody tr[data-vid], .scard[data-vid]');
  if (row) { pushDetail(row.dataset.vid); return; }

  /* 分析タブ「表で見る」（グラフごとに data-tbl で開閉を持つ） */
  const tgl = e.target.closest('.tbltoggle');
  if (tgl) {
    const k = tgl.dataset.tbl;
    state.anaTbl[k] = !state.anaTbl[k];
    const box = document.querySelector('.minitbl[data-tbl="' + k + '"]');
    if (box) box.classList.toggle('show', state.anaTbl[k]);
    tgl.textContent = state.anaTbl[k] ? '表を閉じる' : '表で見る';
    return;
  }
  /* 分析タブ 凡例チップ（チャンネルの表示オン／オフ）。全部消すと何も読めなくなるので、
     残り1つになったチップの消灯だけは受け付けない */
  const chc = e.target.closest('[data-anach]');
  if (chc) {
    const k = chc.dataset.anach, next = Object.assign({}, state.anaOff);
    next[k] = !next[k];
    if (store.channels.some(c => !next[c.slug])) { state.anaOff = next; renderAnalytics(); }
    return;
  }
  /* 分析タブ 推移グラフの期間切替（30日／90日／全部） */
  const rb = e.target.closest('[data-anarange]');
  if (rb) { state.anaRange = Number(rb.dataset.anarange); renderAnalytics(); return; }
  const ab = e.target.closest('[data-anaaxis]');
  if (ab) { state.anaAxis = ab.dataset.anaaxis; renderAnalytics(); return; }
  /* 分析タブ 動画別の成績の並べ替え（同じ列をもう一度押すと昇順・降順が入れ替わる） */
  const sh = e.target.closest('th[data-anasort]');
  if (sh) {
    const k = sh.dataset.anasort, cur = state.anaSort || {k:'published_at', dir:-1};
    state.anaSort = { k, dir: cur.k === k ? -cur.dir : (k === 'seq' || k === 'title' ? 1 : -1) };
    renderAnalytics(); return;
  }
  if (e.target.closest('#reloadbtn')) { if (!state.busy) reloadAll(); return; }
  if (e.target.closest('#themebtn')) {
    const cur = document.documentElement.dataset.theme;
    const dark = cur ? cur === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = dark ? 'light' : 'dark';
    render(); return;
  }
  const ub = e.target.closest('#userbtn');
  if (ub) {
    const pop = $('#menupop'); pop.hidden = !pop.hidden;
    ub.setAttribute('aria-expanded', String(!pop.hidden)); return;
  }
  if (e.target.closest('#logoutbtn')) { signOut(); return; }
  if (!e.target.closest('.usermenu')) { $('#menupop').hidden = true; $('#userbtn')?.setAttribute('aria-expanded', 'false'); }
});
/* 検索は DB へ問い合わせるので、打鍵ごとには投げない（打ち終わりを少し待つ） */
let stockQTimer = null;
document.addEventListener('input', e => {
  if (e.target.id === 'stockq') {
    state.stockQ = e.target.value; state.stockPage = 0;
    clearTimeout(stockQTimer);
    stockQTimer = setTimeout(refreshStockTable, 250);
    return;
  }
  /* 没の確定ボタンは理由が入るまで押せない（#205） */
  if (e.target.classList && e.target.classList.contains('rta')) {
    const box = e.target.closest('[data-rjbox]');
    if (box) syncRejectReady(box);
    return;
  }
  /* 下端のバーの「修正を依頼」は常に色つきで、入力欄に文字があるあいだだけ濃くする（#509 段1） */
  if (e.target.classList && e.target.classList.contains('wta')) {
    const g = e.target.closest('.decide');
    if (g) g.querySelector('.dbar [data-act="comment"]')?.classList.toggle('on', !!e.target.value.trim());
  }
});
document.addEventListener('change', e => {
  if (e.target.id === 'stockgenre') {
    state.stockGenre = e.target.value; state.stockPage = 0; refreshStockTable();
  }
});
document.addEventListener('keydown', e => {
  /* Ctrl + Enter はコメント欄だけ。承認メモ（.ata）では発火させない（誤送信防止・#205） */
  if (e.target.classList && e.target.classList.contains('wta') && e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
    const box = e.target.closest('[data-wbox]');
    if (box) { e.preventDefault(); submitComment(box, box.dataset.wbox); }
    return;
  }
  if (e.key === 'Escape' && state.detail) { history.back(); return; }
  const sec = e.target.closest && e.target.closest('[data-secfold]');
  if (sec && (e.key === 'Enter' || e.key === ' ')) {
    e.preventDefault();
    state.secOpen[sec.dataset.secfold] = !state.secOpen[sec.dataset.secfold];
    refreshStockTable(); return;
  }
  const gfRow = e.target.closest && e.target.closest('[data-gfvid]');
  if (gfRow && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); pushDetail(gfRow.dataset.gfvid); return; }
  const row = e.target.closest && e.target.closest('.mtx tbody tr[data-vid], .scard[data-vid]');
  if (row && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); pushDetail(row.dataset.vid, row.dataset.gate); }
});
window.addEventListener('scroll', hideTip, { passive: true });
let rzT; window.addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { drawSpark(); syncStickyOffsets(); tapRelayout(); }, 120); });
/* 幅が変わるとシートの出し方（せり上がり／その場）とピンの置き場所が変わる（#509 段4） */
function tapRelayout(){
  if (!tap || tap.mode !== 'edit' || !tap.panel) return;
  const sheet = tapEl('[data-sheet]');
  if (sheet && !sheet.hidden) {
    sheet.classList.toggle('float', tapMobile());
    document.body.classList.toggle('sheetopen', tapMobile());
  }
  if (tap.draft && tap.draft.x != null) tap.ctl.showPin(tap.draft.x, tap.draft.y);
}

/* ══ 認証 ═══════════════════════════════════════════════════════ */
$('#loginform').addEventListener('submit', async ev => {
  ev.preventDefault();
  const btn = $('#loginbtn');
  btn.disabled = true; btn.textContent = 'ログイン中…';
  $('#loginerr').innerHTML = '';
  const { data, error } = await sb.auth.signInWithPassword({
    email: $('#email').value.trim(), password: $('#password').value
  });
  btn.disabled = false; btn.textContent = 'ログイン';
  if (error) {
    $('#loginerr').innerHTML = `<div class="errbox"><b>ログインできません</b><br>${esc(error.message)}</div>`;
    return;
  }
  $('#password').value = '';
  /* 成功したら onAuthStateChange の発火順を待たず、その場で確実にダッシュボードへ遷移（#204）。
     onAuthStateChange 側と二重に呼ばれても showApp は冪等（先頭ガード）なので描画は1回に収束する。 */
  if (data && data.session) showApp(data.session.user);
});

async function signOut(){
  await sb.auth.signOut();
  clearVideoCaches(); store.ops = null; store.analytics = {}; store.assets = {}; store.system = null;
  store.cost = null;   /* 費用（#321） */
  store.channels = []; store.accounts = [];
  state.user = null; state.me = null; state.ch = null; state.view = 'stock'; state.stockPage = 0;
  showLogin();
}

function setDisplayName(name){
  $('#username').textContent = name;
  $('#useravatar').textContent = name.slice(0, 2);
}

function showLogin(){
  $('#app').hidden = true;
  $('#login').hidden = false;
  $('#menupop').hidden = true;
  stopGenfarmAuto();
  closeDetail();
  if (location.hash) history.replaceState({}, '', location.pathname + location.search);
  document.title = '制作ダッシュボード — ログイン';
}

async function showApp(user){
  /* ログイン成功（submit）と onAuthStateChange(SIGNED_IN) の両経路から呼ばれうるため冪等化（#204）。
     既に同一ユーザーで初期化済みなら二重に bootstrap/描画しない。ログイン失敗時はここに来ない。 */
  if (state.user && state.user.id === user.id) return;
  state.user = user;
  setDisplayName(displayNameOf(user.email));
  $('#useremail').textContent = user.email || '';
  $('#login').hidden = true;
  $('#app').hidden = false;
  document.title = '制作ダッシュボード';
  state.busy = true; renderShell();
  /* 表示名と許可チャンネルの正本は dashboard_users（RPC dashboard_me・#208）。
     取れなければ表示名だけの旧RPC → それも駄目ならメール由来の推定にフォールバックする。
     ここで得る権限はタブの出し分け（UX）に使うだけで、遮断は RLS / RPC が行う。 */
  state.me = null;
  try {
    const { data } = await sb.rpc('dashboard_me');
    if (data) {
      state.me = data;
      if (data.display_name) setDisplayName(String(data.display_name));
    }
  } catch (_) { /* 024 未適用の DB ではここに来る */ }
  if (!state.me) {
    try {
      const { data } = await sb.rpc('dashboard_display_name');
      if (data) setDisplayName(String(data));
    } catch (_) { /* フォールバック済み */ }
  }
  try { await loadBootstrap(); }
  catch (e) {
    state.busy = false; renderShell();
    $('#view-' + state.view).innerHTML = errBox(e.message);
    return;
  }
  await render();
  /* #detail/… 付きで直接開かれた場合は該当詳細へ（無効ならトップに落ちる） */
  await applyInitialRoute();
}

sb.auth.onAuthStateChange((event, session) => {
  if (event === 'SIGNED_IN' && session && !state.user) showApp(session.user);
  else if (event === 'SIGNED_OUT') { state.user = null; showLogin(); }
});

const { data: { session } } = await sb.auth.getSession();
if (session && session.user) await showApp(session.user);
else showLogin();

/* 新版が出ていないか確認する（await しない＝表示を待たせない）。
   ログイン画面のままでも古い版なら意味がないので、認証状態に関係なく走らせる */
checkForUpdate();
</script>
