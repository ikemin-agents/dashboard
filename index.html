  it._open = r.open_feedback_count || 0;
  /* 指摘の内訳と差し戻しの出どころ（M051）。未適用の DB では列そのものが返らない＝
     0 / null になり、従来どおり「あなたの指摘」扱いで描画される（壊れずに退行するだけ） */
  it._openH  = r.open_feedback_count_human || 0;
  it._openAi = r.open_feedback_count_ai    || 0;
  it._rcSrc  = r.rc_src || null;
  /* いまの作業の記録（#637）。列がまだ無い DB では undefined＝記録なしと同じ */
  it._work = workOf(r);
  store.byId.set(it.id, it);
  return it;
}

const coreKey = ch => [ch, state.stockQ.trim(), JSON.stringify(state.stockF),
  state.stockSort ? state.stockSort.key + ':' + state.stockSort.dir : '', state.stockPage].join('|');
async function loadCore(ch, retried){
  const key = coreKey(ch);
  const hit = store.core[ch];
  if (hit && hit.key === key) return hit;
  /* 見出しの窓でチェックを全部外した列があれば、問い合わせずに0件 */
  if (Object.values(state.stockF).some(v => v && !v.length)) {
    store.core[ch] = { items: [], byId: new Map(), key, page: state.stockPage, from: 0, total: 0 };
    return store.core[ch];
  }
  const from = state.stockPage * PAGE_SIZE;
  const { data, error, count } = await listOrder(listQuery(ch, { count:'exact' }))
    .range(from, from + PAGE_SIZE - 1);
  if (error) throw new Error(error.message || String(error));
  const items = (data || []).filter(r => inScope(ch, r.seq)).map(mapRow);
  const total = count == null ? items.length : count;
  /* 絞り込みを変えて最終ページが消えたときは、いちばん後ろのページへ寄せて取り直す */
  if (!items.length && total > 0 && state.stockPage > 0 && !retried) {
    state.stockPage = Math.max(0, Math.ceil(total / PAGE_SIZE) - 1);
    return loadCore(ch, true);
  }
  const res = { items, byId: new Map(items.map(i => [i.id, i])), key, page: state.stockPage, from, total };
  /* 待っている間に条件が変わったら（窓のチェックを続けて押したとき）、古い結果で控えを上書きしない */
  if (coreKey(ch) === key) store.core[ch] = res;
  return res;
}

/* 見出しの絞り込みの窓の母数（工程・ジャンルの値と件数）。1動画あたり短い3列だけを
   チャンネル全行ぶん取る。ページを送っても数字が動かないようにするための問い合わせで、
   一覧本体（重い行）とは別経路。 */
async function loadFacets(ch){
  if (store.facets[ch]) return store.facets[ch];
  store.facets[ch] = await q(scopeCh(sb.from('v_dashboard_list')
    .select('stage_key,genre_label,search_text'), ch));
  return store.facets[ch];
}

/* 承認待ち・【AI】修正中の一覧（レビュータブ＋左ナビのバッジ）。
   ページングとは独立に「状態を持つ行」だけを引く＝在庫が増えても件数は増えない。
   1本の動画で複数ゲートが同時に状態を持つ場合も取りこぼさないよう、ゲート別の
   状態列（script_state / storyboard_state / final_state）から行を展開する。
   ⚠️ 数えるのは**その番組がいま使う承認ポイントだけ**（`chMeta(ch).gates`＝DB の
   channels.human_gates が正本・画面の他の場所と同じ）。廃止した承認ポイントの
   状態が古い行に残っており、素通しで展開すると見出しとバッジの件数が表の本数より
   多くなる（歯科で「承認待ち 70件」・表は26本／#536 中3）。検証のタブは番組を
   またぐので、その動画が属する番組の承認ポイントで絞る。
   force … 手元に控えがあっても DB から取り直す（承認のあと・#572。下の loadPendingAll） */
async function loadPending(ch, force){
  if (!force && store.pending[ch]) return store.pending[ch];
  const items = (await q(scopeCh(sb.from('v_dashboard_list').select('*'), ch)
    .eq('has_gate_state', true))).filter(r => inScope(ch, r.seq)).map(mapRow);
  const rv = [], rc = [], sbCheck = [];
  for (const it of items) {
    const gates = chMeta(it.channel || ch).gates || [];
    for (const g of ['script', 'storyboard', 'final']) {
      if (!gates.includes(g)) continue;
      const st = it[g + '_state'];
      if (!st) continue;
      /* 作業中の記録がある動画は「【AI】作業中」に出すので、承認待ちの件数に数えない（#637・sectionOf と同じ考え） */
      if (st === 'review' && it._work) continue;
      /* 追い越された「仮組み＋静止画」の承認待ちは数えない（#569）。行だけで決まらない動画は
         下でレビュー記録を引いて確かめる */
      if (st === 'review' && g === 'storyboard' && offDispatcherItem(it)) {
        if (sbSupersededRow(it)) continue;
        sbCheck.push(it.id);
      }
      const at = it[g + '_state_at'];
      (st === 'review' ? rv : rc).push({ item: it, gate: g, at, wait: daysSince(at), open: it._open });
    }
  }
  if (sbCheck.length) {
    try {
      const evs = await q(sb.from('review_events').select('id,video_id,gate,kind,revision,created_at')
        .in('video_id', sbCheck));
      const gone = new Set(sbCheck.filter(id => {
        const t = sbSupersededEvents(evs.filter(e => e.video_id === id));
        if (t != null) store.sbGone[id] = t;
        return t != null;
      }));
      for (let i = rv.length - 1; i >= 0; i--) {
        if (rv[i].gate === 'storyboard' && gone.has(rv[i].item.id)) rv.splice(i, 1);
      }
      for (const it of items) if (gone.has(it.id) && it._rv === 'storyboard') it._rv = null;
    } catch (_) { /* 引けなければ行の判定のまま（数が1つ多く出るだけ） */ }
  }
  /* ネタの仕分け待ち（#314）はゲートを持たないので上の展開に乗らない。左ナビのバッジは
     「あなたが動く番」の総数を出したいので、別に1本だけ数える（件数だけ・行は引かない）。 */
  const { count: triageN } = await scopeCh(sb.from('v_dashboard_list')
    .select('id', { count: 'exact', head: true }), ch).eq('stage_key', 'triage');

  const byAt = (a, b) => new Date(a.at) - new Date(b.at);
  store.pending[ch] = { rv: rv.sort(byAt), rc: rc.sort(byAt), triage: triageN || 0 };
  return store.pending[ch];
}
const pendingList = ch => ((store.pending[ch] || {}).rv) || [];
const triageCount = ch => ((store.pending[ch] || {}).triage) || 0;
/* 承認待ちの「動画の本数」（#552 の続き・オーナー承認 2026-09-25）。rv は動画×承認ポイントで
   展開してあるので、1本の動画が2か所で承認待ちだと2行になる（RW9004 で検証タブが3・表は2行）。
   件数（タブ・下ナビのバッジ）は動画の id の重複を除いて数える。表に出す行は rv のまま。 */
const pendingCount = ch => new Set(pendingList(ch).map(r => r.item && r.item.id)).size;
/* 全チャンネルタブのバッジ用（オーナー要望 2026-09-23）。いま見ている番組の表を描き終えた
   あとに裏で呼ぶ——他の番組ぶんは表を待たせない。番組ごとに2本（状態を持つ行＋仕分けの
   件数）なので、番組4つで最大8本。取り終えたらタブだけ描き直す。失敗しても表には
   影響しないので握りつぶす（バッジが出ないだけ）。
   force … 控えのある番組も含めて全部を DB から取り直す（承認のあと・#572）。取り直すあいだは
   前の数字を出したままにし、届いた番組から置き換える（先に消すとバッジが一瞬消えるため） */
async function loadPendingAll(force){
  const todo = chTabList().map(c => c.slug).filter(slug => force || !store.pending[slug]);
  if (!todo.length) return;
  await Promise.all(todo.map(slug => loadPending(slug, force).catch(() => null)));
  renderShell();
}

/* 一覧に載っていない動画（別ページ・レビュータブ経由・ディープリンク）も開けるよう、
   索引に無ければ1行だけ取りに行く */
async function loadItem(id){
  const hit = store.byId.get(id);
  if (hit) return hit;
  const rows = await q(sb.from('v_dashboard_list').select('*').eq('id', id).limit(1));
  return rows.length ? mapRow(rows[0]) : null;
}
async function loadItemBySeq(ch, seq){
  for (const it of store.byId.values()) {
    if (it.channel === ch && String(it.seq) === String(seq)) return it;
  }
  const rows = await q(sb.from('v_dashboard_list').select('*')
    .eq('channel', ch).eq('seq', seq).limit(1));
  return rows.length ? mapRow(rows[0]) : null;
}

/* レビュー記録は「開いた動画のぶんだけ」取る（#215 Phase 2）。全件先読み（旧
   loadReviews の .limit(3000)）をやめたので、件数が増えても上限に静かに当たらない。 */
const RE_COLS = 'id,video_id,gate,author,kind,body,score,resolution_status,' +
                'resolved_by,resolution_note,resolved_at,revision,created_at';
/* 「その列はまだ無い」型の断り方（PostgREST は 42703 のこともスキーマ写しの取り違えのこともある） */
const noSuchColumn = err => {
  const s = ((err && err.code) || '') + ' ' + String((err && (err.message || err.hint)) || '');
  return /\b42703\b/.test(s) || /\bPGRST(100|200|202|204)\b/.test(s)
      || /does not exist|not find the .* column|unknown column/i.test(s);
};
async function loadThread(videoId){
  if (store.threads[videoId]) return store.threads[videoId];
  const get = cols => sb.from('review_events').select(cols)
    .eq('video_id', videoId).order('created_at', { ascending: true });
  /* 構造化された指摘（notes）はまだ列が無い DB でも動く——列なしで断られたら抜いて引き直す。
     ここで諦めると詳細画面がまるごと出なくなるので、退避は必ず持たせる（#509 段4） */
  let { data, error } = await get(RE_COLS + ',notes');
  if (error && noSuchColumn(error)) ({ data, error } = await get(RE_COLS));
  if (error) throw new Error(error.message || String(error));
  store.threads[videoId] = data || [];
  return store.threads[videoId];
}

/* いまの版の番号を DB に聞く（一覧のビューが古い版の提出を除くのに使っているのと同じ窓口）。
   画面は版の表そのものを読めないので、番号だけを返すこの窓口を通す。覚えずに毎回聞くのは、
   詳細を開き直したときに必ず最新で判定するため（1件ぶんの軽い問い合わせ）。
   答えが得られなければ null を返し、呼び出し側は従来どおりレビュー記録から代用する。 */
async function loadCurRev(videoId){
  try {
    const { data, error } = await sb.rpc('dashboard_current_revision', { p_video_id: Number(videoId) });
    if (error) return null;
    return data == null ? null : Number(data);
  } catch (_) { return null; }
}

/* ── ゲートの状態（#205）─────────────────────────────────────────
   video×gate ごとに「最後に状態を決めたイベント」で決まる2状態。
     review  = 承認待ち（AIが提出済み・あなたの番）
     changes = 【AI】修正中（あなたがコメントを出した・AIの番）
   approve / reject が来たら解消。判定は毎回 review_events から作り直す＝
   差し戻し対応係が resolution_status を閉じれば UI 側は何もせず追随する
   （2026-08-28 まではこれを夜間の在庫番がやっていた）。 */
/* 状態を決めるイベント（これ以外の kind は現在の状態に影響しない） */
const STATE_KINDS = ['request_review', 'request_changes', 'approve', 'reject'];
/* a のほうが b より新しいか。同時刻なら id の大きい方を後とみなす（連番のため） */
const evNewer = (a, b) => {
  const ta = +new Date(a.created_at), tb = +new Date(b.created_at);
  return ta !== tb ? ta > tb : (a.id || 0) > (b.id || 0);
};
/* video×gate ごとの現在の状態。引数は「その動画のレビュー記録」（#215 Phase 2 で
   全件配列から動画単位に縮小した。一覧側の状態はビュー M027 が同じ規則で計算する）。
   **配列の並び順に依存しない**（#215 Phase 1・2026-08-12）: 以前は頭から舐めて
   「最後に出てきたイベント」を現在の状態としていたため、取得クエリの .order() が
   唯一の順序保証になっていた。そこを触ると *エラーを出さずに古い状態を表示し続ける* という
   気づきにくい壊れ方をするので、created_at の比較で最新を選ぶ方式に変えた。 */
function gateStateMap(events, curRev){
  const last = new Map();
  /* ビュー（060/068）と同じ除外: 解決済みの差し戻しは「直し中」と読まない、古い版の提出は
     「承認待ち」と読まない。現行版 curRev は DB に聞いた値を使う（loadCurRev）。
     聞けなかったときだけ、記録の中でいちばん大きい版で代用する——代用だと作り直しの最中
     （版は上がったがレビュー記録はまだ前の版まで）に古い提出を承認待ちと読んでしまう。 */
  const maxRev = curRev != null ? Number(curRev)
                                : Math.max(0, ...(events || []).map(e => Number(e.revision) || 0));
  for (const e of (events || [])) {
    if (!STATE_KINDS.includes(e.kind)) continue;
    if (e.kind === 'request_changes' && e.resolved_at) continue;
    if (e.kind === 'request_review' && e.revision != null && Number(e.revision) < maxRev) continue;
    const k = e.video_id + '|' + e.gate;
    const prev = last.get(k);
    if (!prev || evNewer(e, prev)) last.set(k, e);
  }
  const m = new Map();
  for (const [k, e] of last) {
    /* approve / reject が最新なら状態は解消済み＝Map に入れない */
    if (e.kind === 'request_review')       m.set(k, { video_id:e.video_id, gate:e.gate, st:'review',  at:e.created_at });
    else if (e.kind === 'request_changes') m.set(k, { video_id:e.video_id, gate:e.gate, st:'changes', at:e.created_at });
  }
  return m;
}

/* ── 追い越された「仮組み＋静止画」の承認待ち（#569・進行係を通らない動画だけ）──────────
   置き場が動画ごとに1つになり、どちらの承認ポイントを開いても同じ画面・同じ素材が出る。
   そのため「仮組み＋静止画」の提出のあとに**完成が動いた**（提出・修正の依頼・承認・没の
   どれかが後から付いた）動画では、手前の承認待ちを表に残さない——残すと、承認済みの完成より
   前の段階として一覧の「承認待ち」に並び続ける（RW9004 で実発生・2026-09-29）。
   ⚠️ DB（一覧のビュー）は変えていない。ビューの rv_gate / storyboard_state は今までどおり
   storyboard を返すので、**画面の側で読み替える**。並び順（ビューの sort_rank）だけは承認待ちの
   位置に残る。02・03 は対象外（何も変えない）。 */
/* 一覧の行だけで分かる範囲。完成の状態の時刻・完成の最初の承認の時刻が、仮組み＋静止画の
   提出より後なら追い越し。レビュー記録で確かめ済み（store.sbGone）の提出もここで効かせる */
function sbSupersededRow(r){
  if (!offDispatcherItem(r) || r.storyboard_state !== 'review') return false;
  const at = +new Date(r.storyboard_state_at);
  if (!isFinite(at)) return false;
  const t = x => { const v = x ? +new Date(x) : 0; return isFinite(v) ? v : 0; };
  if (Math.max(r.final_state ? t(r.final_state_at) : 0, t(r.approved_final_at)) > at) return true;
  const memo = store.sbGone[r.id];
  return memo != null && memo >= at;
}
/* レビュー記録で確かめる（完成の承認は最初の1回しか行に残らないので、2回目以降はこちらで拾う）。
   追い越されていれば、その「仮組み＋静止画」の提出の時刻（ms）を返す。いなければ null */
function sbSupersededEvents(events){
  let sbE = null, fin = null;
  for (const e of (events || [])) {
    if (!STATE_KINDS.includes(e.kind)) continue;
    if (e.gate === 'storyboard' && e.kind === 'request_review') { if (!sbE || evNewer(e, sbE)) sbE = e; }
    else if (e.gate === 'final') { if (!fin || evNewer(e, fin)) fin = e; }
  }
  /* 古い版の完成の記録が後から付いても、新しい版の仮組み＋静止画の承認待ちは隠さない */
  const rev = e => Number(e.revision == null ? 1 : e.revision);
  return (sbE && fin && evNewer(fin, sbE) && rev(fin) >= rev(sbE)) ? +new Date(sbE.created_at) : null;
}

/* 発言者が審査AIか（review_events.author の語彙は koike / kohnosuke / ai:* に
   閉じているので、ai: で始まらなければ人間・M017 の CHECK）。DB 側（M051）が
   `author IN ('koike','kohnosuke')` で数えているのと同じ集合になる。 */
const isAiAuthor = a => String(a || '').startsWith('ai:');

/* 画面に出す AI の呼び名。記録に残る英字の名前をそのまま
   見せると何をした相手か分からないので、対応表を1か所に置く。表に無い相手は名前を出さない。 */
const AI_ROLE_JA = {
  'video-script-write':'台本係', 'video-script-clarity':'台本チェック係',
  'video-check-compliance':'コンプラチェック係', 'content-compliance-reviewer':'コンプラチェック係',
  'video-storyboard-design':'シーン割り係', 'video-storyboard-build':'静止画をまとめる係',
  'video-check-spec':'spec審査係', 'video-check-storyboard':'静止画審査係',
  'video-frame-reviewer':'静止画審査係', 'video-check-final':'完成審査係',
  'video-final-reviewer':'完成審査係', 'video-rework':'差し戻し対応係',
  'video-topic-refill':'ネタ補充係', 'final-validate':'機械測定', 'dispatcher':'進行係',
  'youtube-step':'作業係（旧）', 'youtube-stock-keeper':'夜間の在庫番（旧）', 'youtube-produce':'制作の進行',
  'main-session':'制作の進行', 'backfill':'記録の後追い'
};
const aiRoleOf = a => AI_ROLE_JA[String(a || '').replace(/^ai:/, '')] || null;

/* ── この版は何の作り直しか（オーナー要望 2026-09-02）────────────────────────
   一覧で「自分の指摘を直した版」と「そうでない版」の区別が付かない、という困りごとへの答え。
   現行版の提出（最新の request_review）の前に片付いた差し戻しの出どころで決める。
   ⚠️ 提出の1つ前で切ってはいけない——同じ版を何度も出し直した記録が実在するので、
      いちばん新しい「片付いた差し戻し」から遡って、その前の提出までを1回の作り直しとみなす。 */
function reworkSrcOf(events){
  const evs = events || [];
  const done = e => e.kind === 'request_changes' && e.resolution_status && e.resolution_status !== 'open';
  let sub = null;
  for (const e of evs) if (e.kind === 'request_review' && (!sub || evNewer(e, sub))) sub = e;
  if (!sub) return null;
  let last = null;                                   /* この提出より前に片付いた最新の差し戻し */
  for (const e of evs) if (done(e) && evNewer(sub, e) && (!last || evNewer(e, last))) last = e;
  if (!last) return null;                            /* 1件も無い＝初回の提出 */
  let anchor = null;                                 /* その差し戻しの1つ前の提出＝作り直しの起点 */
  for (const e of evs) if (e.kind === 'request_review' && evNewer(last, e) && (!anchor || evNewer(e, anchor))) anchor = e;
  const batch = evs.filter(e => done(e) && evNewer(sub, e) && (!anchor || evNewer(e, anchor)));
  return batch.some(e => !isAiAuthor(e.author)) ? 'human' : 'ai';
}
/* 札は動画ごとに1回だけ計算して覚える（一覧は review_events を持っていないため） */
const reworkOf = it => store.rework[it.id] || null;
/* 承認待ちの動画のぶんだけ、札に要る最小の列をまとめて1回引く。本文は要らないので取らない
   （履歴の本文まで取ると一覧が重くなる）。詳細を開いた動画は annotate が実データで上書きする。 */
async function loadRework(items){
  const ids = (items || []).filter(i => i._rv && !(i.id in store.rework)).map(i => i.id);
  if (!ids.length) return;
  for (const id of ids) store.rework[id] = null;     /* 取れなかったときに何度も引き直さない */
  const rows = await q(sb.from('review_events')
    .select('id,video_id,gate,kind,revision,author,resolution_status,created_at')
    .in('video_id', ids).order('created_at', { ascending: true }));
  const by = new Map();
  for (const r of rows) { const a = by.get(r.video_id); if (a) a.push(r); else by.set(r.video_id, [r]); }
  for (const id of ids) {
    const evs = by.get(id) || [];
    store.rework[id] = reworkSrcOf(evs);
    /* 開いている詳細の動画の版は、詳細が自分で取った記録（annotate）のまま——直接リンクでは一覧を裏で描くので、
       一覧の記録が詳細を描いたあとに届くと、画面に出ていない版を承認・修正依頼に渡してしまう（#637 の Codex レビュー指摘1） */
    if (Number(id) !== state.detail) rememberSubmitted(id, evs);
    const it = (items || []).find(i => i.id === id);
    /* 行だけでは決められなかった追い越し（#569）をレビュー記録で確かめて、表に出す前に外す */
    if (it && it._rv === 'storyboard' && offDispatcherItem(it)) {
      const gone = sbSupersededEvents(evs);
      if (gone != null) { store.sbGone[id] = gone; it._rv = null; }
    }
    const cur = it ? it._rv + '|' + submittedRevOf(id, it._rv) : '';
    const seen = new Set(evs.filter(e => !isAiAuthor(e.author) && (e.kind === 'approve' || e.kind === 'request_changes'))
      .map(e => e.gate + '|' + (e.revision == null ? 1 : e.revision)));
    seen.delete(cur);
    store.looks[id] = seen.size + 1;
  }
}
/* 画面に出ている提出物の版（ゲートごとの最後の request_review の版）を覚える。承認するとき
   DB へ渡し、押した瞬間に裏で新しい版が提出されていたら断ってもらう（073・#502）。
   表示された時点の値を渡すのが要点なので、押す直前に引き直さない */
function rememberSubmitted(vid, events){
  const m = {};
  /* 版の押印が入る前の古い提出は版が空。DB 側も空を第1版として扱うので、画面も 1 として
     覚える——空のまま送ると承認が「版を名乗らない」扱いになり、何度読み直しても断られる */
  for (const e of events || []) if (e.kind === 'request_review') m[e.gate] = e.revision == null ? 1 : Number(e.revision);
  store.rvRev[Number(vid)] = m;
}
const submittedRevOf = (vid, gate) => {
  const m = store.rvRev[Number(vid)];
  return m && m[gate] != null ? m[gate] : null;
};

/* 差し戻しの出どころ（DB 側 v_dashboard_list.rc_src と同じ規則・M051）。
   ①そのゲートに載っている未対応（open）の修正依頼の著者集合で決める
   ②1件も無ければ、状態を決めた最新の修正依頼の著者で決める */
function rcSrcOf(gate, events){
  const evs = (events || []).filter(e => e.gate === gate && e.kind === 'request_changes');
  let last = null;
  for (const e of evs) if (!last || evNewer(e, last)) last = e;
  const open = evs.filter(e => e.resolution_status === 'open');
  const set = open.length ? open : (last ? [last] : []);
  const h = set.some(e => !isAiAuthor(e.author)), a = set.some(e => isAiAuthor(e.author));
  return h && a ? 'both' : h ? 'human' : (a ? 'ai' : null);
}

/* 詳細ビュー用の状態注釈。一覧の _rv/_rc/_open はビュー（M027・M051）由来だが、詳細は
   開いた瞬間にその動画のレビュー記録を取り直すので、そちらで上書きする（判定規則は
   ビューと同じ）。_rv=承認待ちのゲート / _rc=直し中のゲート / _open=未対応の指摘件数
   （_openH=あなたの指摘 / _openAi=AI審査の指摘）/ _rcSrc=差し戻しの出どころ。
   没にした動画はどちらのキューにも出さない（#203） */
function annotate(it, events, curRev){
  let rv = null, rc = null;
  /* 完成の動きに追い越された「仮組み＋静止画」の承認待ちは数えない（#569・進行係を通らない動画だけ） */
  const gone = offDispatcherItem(it) ? sbSupersededEvents(events) : null;
  if (gone != null) store.sbGone[it.id] = gone;
  for (const p of gateStateMap(events, curRev).values()) {
    if (p.st === 'review') { if (!(gone != null && p.gate === 'storyboard')) rv = p.gate; }
    else rc = p.gate;
  }
  const drop = it.stage === 'dropped';
  const open = drop ? [] : (events || []).filter(e => e.resolution_status === 'open');
  it._rv    = drop ? null : rv;
  it._rc    = drop ? null : rc;
  it._open  = open.length;
  it._openH = open.filter(e => !isAiAuthor(e.author)).length;
  it._openAi= open.filter(e =>  isAiAuthor(e.author)).length;
  it._rcSrc = it._rc ? rcSrcOf(it._rc, events) : null;
  store.rework[it.id] = reworkSrcOf(events);   /* 一覧の札を実データで上書きする */
  rememberSubmitted(it.id, events);
  return it;
}
/* レビュー記録はゲートで切らず動画単位で持つ（#207）。台本→絵コンテ→完成を1本の時系列で
   読ませるため。どのゲートの発言かは表示側でチップにして示す。 */
function threadOf(videoId){
  return (store.threads[videoId] || []).slice()
    .sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
}

/* ══ レビュー素材（Storage） ═════════════════════════════════════
   非公開バケット review-assets。ログイン中のユーザーは Storage の RLS で
   SELECT できる（ポリシーが無い＝一覧が 0 件なので「素材未搬出」表示になる）。
   各ファイルは有効期限つき署名URLにしてから表示する。                        */
/* 3つめはフォルダ名（置き場）。02・03 は承認ポイントの名前と同じ。進行係を通らない動画は
   承認ポイントに依らず ONE_DIR（旧い提出だけ storyboard/ に残る・#569）——**承認ポイントと
   置き場を取り違えない**（承認・指摘に渡すのは承認ポイント、ここへ渡すのは置き場） */
const assetPath = (ch, seq, dir) => `${ch}/${seq}/${dir}`;
const assetKind = name => RE_IMG.test(name) ? 'image'
  : RE_VID.test(name) ? 'video' : (RE_TXT.test(name) ? 'text' : 'file');
function fmtSize(b){
  if (b == null) return '';
  if (b < 1024) return b + ' B';
  if (b < 1024 * 1024) return (b / 1024).toFixed(0) + ' KB';
  return (b / 1024 / 1024).toFixed(1) + ' MB';
}

/* 読み込みの順番（#637・詳細画面を開くのが遅く、開いたあとも描き変わって見えたため）:
     ・置き場の一覧は、取りに行っている途中の約束も控える。詳細を開いた時点で先に頼み（openDetail の
       prefetchAssets）、あとから組み立てる側は同じ約束を待つ＝同じ置き場を2回取りに行かない
     ・署名は置き場の全部のファイルを1回の問い合わせでまとめて出す（以前はファイル1つずつ）。署名を待たずに
       本文（台本・目録・時刻表）も同時に取る
     ・画面の裏方の json（目録・時刻表・案の索引）は**使う版だけ**先に取る（assetTextWanted）。ほかの版は後回しの
       印（lazy）を付け、要る画面だけが ensureAssetTexts で取る。台本などの人が読む文は今までどおり全部
   控え（一覧・署名）は store.assets と同じ寿命: 書き込み・読み込み直しで store.assets を捨てたら、こちらも使わない */
const assetLists = new Map();        /* 置き場 → { box: その時の store.assets, at, p: ファイルの並びの約束 } */
const assetFly = new Map();          /* 置き場 → { box, p: 中身（署名・本文）を作っている途中の約束 } */
function listAssetDir(key){
  const c = assetLists.get(key);
  if (c && c.box === store.assets && Date.now() - c.at < ASSET_CACHE) return c.p;
  const p = sb.storage.from(ASSET_BUCKET)
    .list(key, { limit: 100, sortBy: { column: 'name', order: 'asc' } })
    .then(({ data, error }) => {
      if (error) throw new Error(error.message || String(error));
      /* フォルダは id=null、空フォルダ維持用のダミーは除く */
      return (data || []).filter(f => f && f.id && f.name !== '.emptyFolderPlaceholder');
    });
  const ent = { box: store.assets, at: Date.now(), p };
  assetLists.set(key, ent);
  p.catch(() => { if (assetLists.get(key) === ent) assetLists.delete(key); });   /* 失敗は控えない（次に取り直す） */
  return p;
}
/* 署名URLの控え（#637）。有効期限（1時間）より短い 50分（ASSET_CACHE）だけ使い回す——開き直すたびに同じ画像の
   署名を取り直さない。書き込み・読み込み直しで store.assets を捨てたら、こちらも捨てる */
let signBox = null, signMap = new Map();
const signCache = () => { if (signBox !== store.assets) { signBox = store.assets; signMap = new Map(); } return signMap; };
/* 控えに全部あればその署名（パス → URL）、1つでも無ければ null（待たずに使えるかの判定） */
function signedHit(paths){
  const cache = signCache(), now = Date.now(), out = {};
  for (const p of paths) {
    const c = cache.get(p);
    if (!c || now - c.at >= ASSET_CACHE) return null;
    out[p] = c.url;
  }
  return out;
}
/* パスの並びをまとめて署名する（控えに無いものだけを1回で）。返すのは パス → URL（取れなかったものは入らない）。
   失敗しても投げない（取れなかった素材は「素材なし」の面になるだけ） */
async function signPaths(paths){
  const cache = signCache(), now = Date.now(), out = {};
  const miss = [];
  for (const p of new Set((paths || []).filter(Boolean))) {
    const c = cache.get(p);
    if (c && now - c.at < ASSET_CACHE) out[p] = c.url; else miss.push(p);
  }
  if (!miss.length) return out;
  const put = (p, u) => { if (p && u) { out[p] = u; cache.set(p, { url: u, at: now }); } };
  const want = new Set(miss);
  let ok = false;
  try {
    const { data, error } = await sb.storage.from(ASSET_BUCKET).createSignedUrls(miss, ASSET_TTL);
    if (!error && Array.isArray(data)) {
      ok = true;
      /* 返ってくる path で突き合わせる（並び順に頼らない＝素材が入れ違わない）。path が無い応答だけ添字で受ける */
      data.forEach((r, i) => { if (r && r.signedUrl && !r.error) put(want.has(r.path) ? r.path : miss[i], r.signedUrl); });
    }
  } catch (_) { /* 下で1つずつ出し直す */ }
  if (!ok) {
    /* まとめて出す窓口が断ったときだけ、今までどおり1つずつ出す */
    await Promise.all(miss.map(async p => {
      try { const { data: s } = await sb.storage.from(ASSET_BUCKET).createSignedUrl(p, ASSET_TTL); put(p, s && s.signedUrl); }
      catch (_) { /* その素材は「素材なし」 */ }
    }));
  }
  return out;
}
/* テキストの本文を1つ取る（失敗は rec.err に書く。投げない） */
async function fetchAssetText(rec){
  try {
    const { data: blob, error } = await sb.storage.from(ASSET_BUCKET).download(rec.path);
    if (error || !blob) { rec.err = 'テキストを読み込めませんでした'; return; }
    const t = await blob.text();
    /* 切るのは人が読むテキストだけ。json は画面が中身を解釈する表（素材の目録・時刻表・
       案の索引）なので切らない——切ると JSON として読めず、素材が1つも出なくなる
       （ショット41本の目録が上限を超えて実発生・2026-09-21） */
    rec.text = (t.length > ASSET_MAX_TEXT && !/\.json$/i.test(rec.name)) ? t.slice(0, ASSET_MAX_TEXT) + '\n\n…（以降は省略。別タブで全文を開けます）' : t;
    rec.err = null;
  } catch (_) { rec.err = 'テキストを読み込めませんでした'; }
  finally { rec.lazy = false; }
}
/* 先に取る本文の選び方。画面の裏方の json（目録・時刻表・案の索引）は、それぞれのいちばん新しい版と、主画面に
   出しうる動画（置き場の名前の動画のいちばん新しい版。final/ は名前が合わなければ最後の動画）の版だけ。
   ⚠️ 目録の選び方（svMainFile の「いちばん新しい版」・sceneMaterials の「動画と同じ版／無ければいちばん新しい版」）と
   案の索引（svVariants の「いちばん新しい版」）は、いちばん新しい版の本文を持っている前提なので、それは必ず先に取る。
   版の無い名前の動画のときは時刻表を全部取る（tapTimeline は先頭の版を使う）。それ以外の文（台本など）は全部 */
function assetTextWanted(recs, dir){
  const fam = n => RE_MATERIALS.test(n) ? 'm' : RE_TIMELINE.test(n) ? 't' : RE_VARIANTS.test(n) ? 'v' : null;
  const vOf = n => { const m = /_v(\d+)\.json$/i.exec(n); return m ? Number(m[1]) : null; };
  const newest = { m: -1, t: -1, v: -1 };
  for (const r of recs) { const k = fam(r.name); if (k) newest[k] = Math.max(newest[k], vOf(r.name)); }
  const re = new RegExp('^' + dir + '_v(\\d+)\\.[A-Za-z0-9]+$', 'i');
  let mv = -1, lastVid = null;
  for (const r of recs) {
    if (r.kind !== 'video') continue;
    lastVid = r;
    const m = re.exec(r.name);
    if (m && Number(m[1]) > mv) mv = Number(m[1]);
  }
  const loose = mv < 0 && dir === 'final' && lastVid ? lastVid.name : null;
  const vm = loose ? /_v(\d+)\./i.exec(loose) : null;
  const vidVer = mv >= 0 ? mv : (vm ? Number(vm[1]) : null);
  const allTl = !!loose && !vm;
  return r => {
    const k = fam(r.name);
    if (!k) return true;
    const v = vOf(r.name);
    if (k === 'v') return v === newest.v;
    if (k === 't' && allTl) return true;
    return v === newest[k] || (vidVer != null && v === vidVer);
  };
}
/* 置き場の中身を作る: 全部のファイルの署名（1回）と、先に取る本文を同時に取る */
async function buildAssets(key, files){
  const dir = key.split('/').pop();
  const recs = files.map(f => ({ name:f.name, path:`${key}/${f.name}`, kind:assetKind(f.name),
    size:(f.metadata && f.metadata.size) != null ? f.metadata.size : null, url:null, text:null, err:null }));
  const want = assetTextWanted(recs, dir);
  const texts = [];
  for (const r of recs) {
    if (r.kind !== 'text') continue;
    if (want(r)) texts.push(fetchAssetText(r));
    else r.lazy = true;                /* 使う版でない目録・時刻表（要る画面が ensureAssetTexts で取る） */
  }
  const sign = signPaths(recs.map(r => r.path)).then(m => { for (const r of recs) r.url = m[r.path] || null; });
  await Promise.all([sign, ...texts]);
  return recs;
}
/* 後回しにした本文のうち pred に合うものを取る。取るものが無ければ null（呼び手は待たない＝その場で組み立てを続ける） */
function ensureAssetTexts(files, pred){
  const todo = (files || []).filter(r => r && r.lazy && pred(r));
  if (!todo.length) return null;
  return Promise.all(todo.map(r => r.textP || (r.textP = fetchAssetText(r))));
}
/* 動画の名前の版に合う目録・時刻表（re）の本文を手元にそろえる。名前に版が無いとき、all なら全部（時刻表は先頭の版を
   使うため）、そうでなければ何もしない（目録は「いちばん新しい版」を使うので、もう手元にある） */
function ensureVerTexts(files, re, name, all){
  const m = /_v(\d+)\./i.exec(String(name || ''));
  const want = m ? Number(m[1]) : null;
  if (want == null && !all) return null;
  return ensureAssetTexts(files, r => { const t = re.exec(r.name || ''); return !!t && (want == null || Number(t[1]) === want); });
}

async function loadAssets(ch, seq, dir){
  const key = assetPath(ch, seq, dir);
  const hit = store.assets[key];
  if (hit && Date.now() - hit.at < ASSET_CACHE) return hit;
  const fly = assetFly.get(key);
  if (fly && fly.box === store.assets) return fly.p;
  const box = store.assets;
  const p = (async () => {
    const out = await buildAssets(key, await listAssetDir(key));
    const res = { files: out, at: Date.now() };
    if (store.assets === box) store.assets[key] = res;     /* 待つ間に控えが捨てられていたら書き戻さない */
    return res;
  })();
  assetFly.set(key, { box, p });
  p.catch(() => {}).finally(() => { const f = assetFly.get(key); if (f && f.p === p) assetFly.delete(key); });
  return p;
}
/* 置き場の候補（assetDirsOf）を順に見て、ファイルが1つでもある最初の置き場を返す（#569 の
   後方互換: 新しい置き場が空のときだけ旧い置き場を読む）。どれも空なら最後の候補の空の結果。
   一覧は全部の候補を同時に頼む（新しい置き場が空と分かってから旧い置き場を頼むと、2回待つ・#637）。
   署名と本文を取るのは、選んだ置き場だけ */
async function loadAssetsFirst(ch, seq, dirs){
  const lists = dirs.map(d => {
    const hit = store.assets[assetPath(ch, seq, d)];
    if (hit && Date.now() - hit.at < ASSET_CACHE) return Promise.resolve(hit.files || []);
    return listAssetDir(assetPath(ch, seq, d));
  });
  lists.forEach(l => l.catch(() => {}));    /* 順番が来る前に失敗した候補を、未処理の失敗にしない */
  let d = dirs[dirs.length - 1];
  for (let i = 0; i < dirs.length; i++) {
    if ((await lists[i]).length) { d = dirs[i]; break; }
  }
  const a = await loadAssets(ch, seq, d);
  return { dir: d, files: a.files || [], at: a.at };
}

async function loadAnalytics(ch){
  if (store.analytics[ch]) return store.analytics[ch];
  const primary = store.accounts.find(a => a.channel === ch && a.platform === 'youtube' && a.is_primary);
  /* 期間の絞り込みは画面側でやる（行数が小さいので全部取ってから切る）。
     PostgREST の既定は1000行なので、記録が伸びても切れないよう上限を明示する。 */
  const kpi = primary && primary.kpi_media_key
    ? await q(sb.from('daily_kpi').select('date,follower_actual,new_subscribers')
        .eq('media', primary.kpi_media_key).order('date', { ascending: true }).limit(5000))
    : [];
  const pubs = await q(sb.from('v_publications')
    .select('id,seq,effective_title,status,views,likes,avg_view_rate_pct,subscribers_gained,hook_awr,end_awr,early_loss_pct,engaged_rate_pct,published_at,scheduled_at,url,platform,is_primary,channel')
    .eq('channel', ch).eq('platform', 'youtube'));
  /* ジャンルは v_publications に無いので一覧のビューから引く（目安を当てる範囲の判定だけに
     使う）。読めなくても分析は出る＝ジャンル無しとして扱う */
  try {
    const gm = {};
    (await q(sb.from('v_dashboard_list').select('seq,genre').eq('channel', ch)) || [])
      .forEach(r => { gm[r.seq] = r.genre; });
    pubs.forEach(p => { p.genre = gm[p.seq] || null; });
  } catch (_) {}
  const primaryPubs = pubs.filter(p => p.is_primary);
  /* 1回の問い合わせで返るのは 1,000行まで（サーバー側の上限。limit を大きく書いても増えない）。
     日付の古い順に取るので、行が 1,000 を超えると**新しい日が欠けて推移が途中で止まる**
     （世界のバズ雑学は 2,589行あり 09/04 で止まっていた・オーナー指摘 2026-09-29）。
     1,000行ずつ最後まで取る。並びを一意にするため動画の id も並べ替えに入れる */
  let daily = [];
  if (primaryPubs.length) {
    const ids = primaryPubs.map(p => p.id), PAGE = 1000;
    for (let from = 0; from < 200000; from += PAGE) {
      const part = await q(sb.from('publication_metrics_daily').select('date,views,publication_id')
        .in('publication_id', ids).order('date', { ascending: true })
        .order('publication_id', { ascending: true }).range(from, from + PAGE - 1));
      daily = daily.concat(part || []);
      if (!part || part.length < PAGE) break;
    }
  }
  store.analytics[ch] = { kpi, pubs: primaryPubs, daily, mediaKey: primary ? primary.kpi_media_key : null };
  return store.analytics[ch];
}
/* 分析タブは見えるチャンネル全部を1画面に重ねる（2026-09-04）。チャンネルごとの取得を
   並列で回して束ねるだけ（1本ぶんの取得と結果はまったく同じもの）。束ねたものは
   ANA_ALL のキーで持つ（チャンネルごとのキャッシュもそのまま残る）。 */
const ANA_ALL = '__all__';
async function loadAnalyticsAll(){
  if (store.analytics[ANA_ALL]) return store.analytics[ANA_ALL];
  const slugs = store.channels.map(c => c.slug);
  const got = await Promise.all(slugs.map(s => loadAnalytics(s)));
  const out = {};
  slugs.forEach((s, i) => { out[s] = got[i]; });
  store.analytics[ANA_ALL] = out;
  return out;
}
/* ══ シェル ═════════════════════════════════════════════════════ */
/* チャンネルタブに並べるもの＝番組の並び ＋（検証用の動画があれば）最後に「検証」 */
function chTabList(){
  const list = store.channels.map(c => ({ slug: c.slug, name: c.name }));
  if (hasPilot()) list.push({ slug: PILOT_CH, name: PILOT_META.name });
  return list;
}
function renderShell(){
  /* 見えないビューを選んだ状態が残らないようにする（権限が変わった場合の保険・#208） */
  const views = visibleViews();
  if (!views.some(v => v.key === state.view)) state.view = views[0].key;

  /* いま見ているのがチャンネル共通の画面か（＝チャンネルタブが「戻り道」になる） */
  const indepNow = !!(views.find(x => x.key === state.view) || {}).chIndep;
  /* 下ナビを隠すとき（残るのが「制作」1つだけのとき）は、「あなたの番」の件数を

  const soloNav = views.filter(x => !x.chIndep).length <= 1;
  const chBadge = slug => {
    if (!(soloNav && stockV)) return '';
    const n = pendingCount(slug) + triageCount(slug);
    return n ? `<span class="badge">${n}</span>` : '';
  };
  const stockBadge = chBadge(state.ch);
  /* 検証用の動画があるときだけ、チャンネルの並びの最後に「検証」を足す（#523）。
     1本も見えない閲覧者には出さない（押しても空の画面しか出ないため） */
  const chList = chTabList();
  $('#chtabs').innerHTML = chList.map(c => {
    const m = chMeta(c.slug), on = state.ch === c.slug;
    return `<button class="chtab" role="tab" aria-selected="${on && !indepNow}" data-ch="${esc(c.slug)}"
       style="--chac:${m.accent}" title="${esc(c.name)}${indepNow ? 'の制作へ戻る' : ''}">
      <span class="cdot" style="background:${m.accent}"></span>${m.icon} ${esc(c.name)}${chBadge(c.slug)}</button>`;
  }).join('') || `<span class="chtab" aria-hidden="true">チャンネルなし</span>`;

  /* スマホ用: いま見ているチャンネルだけを出し、押すと他が開く（オーナー要望 2026-08-20）。
     開閉は details/summary に任せる（JS を持たない＝選ぶと再描画で自然に閉じる）。 */
  const curCh = chList.find(c => c.slug === state.ch);
  const others = chList.filter(c => c.slug !== state.ch);
  $('#chpick').innerHTML = !curCh ? '' : (() => {
    const m = chMeta(curCh.slug);
    /* 名前を押す＝そのチャンネルの制作へ（共通画面からの戻り道）、▾ を押す＝他の候補を開く */
    return `<details class="chpick"><summary class="chcur" style="--chac:${m.accent}">
        <span class="chgo" data-ch="${esc(curCh.slug)}">
          <span class="cdot" style="background:${m.accent}"></span>${m.icon} ${esc(curCh.name)}</span>
        ${stockBadge}
        ${others.length ? '<span class="tri" aria-label="ほかのチャンネルを選ぶ">▾</span>' : ''}</summary>
      ${others.length ? `<div class="chmenu">${others.map(c => {
        const om = chMeta(c.slug);
        return `<button class="chitem" data-ch="${esc(c.slug)}">
          <span class="cdot" style="background:${om.accent}"></span>${om.icon} ${esc(c.name)}${chBadge(c.slug)}</button>`;
      }).join('')}</div>` : ''}</details>`;
  })();

  /* チャンネルに依存しない画面（稼働・システム）はチャンネルタブの右へ（オーナー要望 2026-08-19）。
     下のナビはそのチャンネルの中の画面（制作・分析）だけにして、2つの軸を混ぜない。
     ⚠️ スマホだけは逆にする: 画面が狭いとチャンネル名が読めなくなるので、共通画面は
     従来どおり下の固定タブバーに置く。両方に描いて CSS で出し分ける（画面幅の判定を
     JS に持たせると回転・リサイズのたびに描き直しが要るため）。 */
  $('#systabs').innerHTML = views.filter(v => v.chIndep).map(v =>
    `<button class="chtab sys" role="tab" aria-selected="${state.view === v.key}" data-view="${v.key}"
       title="${esc(v.label)}" aria-label="${esc(v.label)}">
      <span class="cdot" style="background:var(--axis)"></span>${v.icon}<span class="lbl">${v.label}</span></button>`).join('');

  $('#nav').innerHTML = views.map(v => {
    const on = state.view === v.key, n = v.badge ? v.badge() : 0;
    return `<button class="navbtn${v.chIndep ? ' indep' : ''}" role="tab" aria-selected="${on}" data-view="${v.key}">
      <span class="ni" aria-hidden="true">${v.icon}</span>${v.label}${n ? `<span class="badge">${n}</span>` : ''}</button>`;

  const v = views.find(x => x.key === state.view);
  document.body.dataset.chindep = v && v.chIndep ? '1' : '0';
  /* チャンネル共通の画面は広い画面でもスマホでもチャンネルタブの右に出るので、下ナビに
     残るのはそのチャンネルの中の画面だけ。それが1つ（制作）しか無いなら押す先が無いので隠す。
     「あなたの番」の件数は上のチャンネルタブへ移してある。 */
  document.body.dataset.solonav = soloNav ? '1' : '0';
  document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
  /* 詳細ビューが開いている間は #view-detail を優先表示（一覧は隠す） */
  if (state.detail != null) {
    $('#view-detail').classList.add('active');
    document.body.classList.add('detail-open');
  } else {
    $('#view-' + state.view).classList.add('active');
    document.body.classList.remove('detail-open');
  }

  $('#syncdot').className = 'syncdot' + (state.busy ? ' busy' : '');
  $('#synctext').textContent = state.busy ? '読み込み中…'
    : (state.lastSync ? '最終読込 ' + fmtDT(state.lastSync) : '未読込');
  $('#reloadbtn').classList.toggle('spin', state.busy);
  /* 手元で開いた未公開の版は時刻を出さない（置換前の印をそのまま見せない・README の約束） */
  $('#footer').textContent = '制作ダッシュボード'
    + (builtLocal(BUILT_AT) ? '' : ` ・ 更新 ${BUILT_AT}`);
}

/* ══ 新版の検知（#205）════════════════════════════════════════════
   GitHub Pages は HTML に Cache-Control: max-age=600 を返すため、デプロイ直後に
   開くと最大10分は古い版が表示される（プライベートモードでも同じ）。設定では
   変えられないので、ページ側で「自分自身を no-store で取り直してビルド時刻を
   比べる」ことで気づけるようにする。違っていればバナーを出して再読込を促す。 */
/* 起動時の1回だけでは、画面を開いたまま何時間も置いたときに気づけない（#523）。
   5分おき・タブが前面に戻ったとき・詳細を開くときにも確かめる。
   ⚠️ **勝手に読み込み直さない**——指摘を書いている最中に画面が作り直されると手が止まる。
   知らせるだけにして、書きかけが残ることを文言に添える（下書きは端末に控えてある）。 */
const NEWVER_EVERY = 5 * 60 * 1000;
const NEWVER_MIN_GAP = 30 * 1000;
let _verAt = 0, _verBusy = false;
async function checkForUpdate(){
  if (builtLocal(BUILT_AT)) return;                 /* 手元で開いた未公開の版 */
  if (_verBusy || document.getElementById('newver')) return;
  if (Date.now() - _verAt < NEWVER_MIN_GAP) return;
  _verBusy = true; _verAt = Date.now();
  try {
    const res  = await fetch(location.pathname + '?_=' + Date.now(), { cache:'no-store' });
    if (!res.ok) return;
    const text = await res.text();
    const m    = text.match(/const BUILT_AT = '([^']*)'/);
    if (!m || m[1] === BUILT_AT || builtLocal(m[1])) return;
    if (document.getElementById('newver')) return;
    const bar = document.createElement('div');
    bar.id = 'newver';
    bar.innerHTML = `新しい版があります（${esc(m[1])}）<button type="button">読み込み直す</button>
      <span class="s">書きかけの指摘は端末に控えてあるので、読み込み直しても残ります</span>`;
    bar.querySelector('button').onclick = () => location.reload();
    document.body.appendChild(bar);
  } catch { /* 通信できないときは黙って諦める（本流を止めない） */ }
  finally { _verBusy = false; }
}
setInterval(checkForUpdate, NEWVER_EVERY);
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkForUpdate(); });

/* ══ ① 在庫 ════════════════════════════════════════════════════ */

/* 一覧の行／カードに付ける状態クラス（左端の色帯）と状態バッジ。
