}

/* ── gen-farm（実家の GPU 生成機）の待ち行列（M033）──────────────────────────
   数字の正本は generation_jobs（発注台帳）。コマンドラインの genfarm-status
   （00-config/tools/genfarm-status/）と同じ表・同じ数え方を読む＝二重管理を作らない。
   引くのは2本だけ:
     open   … まだ手元に無いジョブ（materialized_at が空 かつ 発注中／実行中／生成済み）
     recent … 見込み時間の較正に使う直近の実測（終わったジョブの所要時間）
   30秒だけキャッシュする（システムタブを開き直すたびに叩かないため）。 */
const GF_OPEN_STATUS = ['submitting', 'in_flight', 'done'];
const GF_KIND_LABEL = {h3_video:'H3映像', flux_image:'FLUX画像', unknown:'不明'};
const GF_STATUS_LABEL = {submitting:'発注中', in_flight:'実行中', done:'生成済み・未回収'};
const GF_FALLBACK_SEC = {h3_video:223, flux_image:76, unknown:200};
const GF_STALE_DONE_MIN = 10;      /* 「生成済み・未回収」が続くと詰まりを疑う分数 */
const GF_TTL_MS = 30000;

async function loadGenfarm(force){
  if (!force && store.genfarm && Date.now() - store.genfarm.at < GF_TTL_MS) return store.genfarm;
  const [open, recent] = await Promise.all([
    q(sb.from('generation_jobs')
        .select('id,kind,channel,episode_seq,artifact_key,status,purpose,source,submitted_at,started_at,estimated_sec')
        .is('materialized_at', null).in('status', GF_OPEN_STATUS)
        .order('submitted_at', { ascending: true }).limit(200)),
    q(sb.from('generation_jobs').select('kind,estimated_sec,started_at,finished_at')
        .not('finished_at', 'is', null).not('started_at', 'is', null)
        .order('finished_at', { ascending: false }).limit(150))
  ]);
  store.genfarm = { open, recent, at: Date.now() };
  return store.genfarm;
}

async function loadAnalytics(ch){
  if (store.analytics[ch]) return store.analytics[ch];
  const primary = store.accounts.find(a => a.channel === ch && a.platform === 'youtube' && a.is_primary);
  const since = jstDateStr(-30);
  const kpi = primary && primary.kpi_media_key
    ? await q(sb.from('daily_kpi').select('date,follower_actual,new_subscribers')
        .eq('media', primary.kpi_media_key).gte('date', since).order('date', { ascending: true }))
    : [];
  const pubs = await q(sb.from('v_publications')
    .select('id,seq,effective_title,status,views,likes,avg_view_rate_pct,subscribers_gained,hook_awr,end_awr,early_loss_pct,engaged_rate_pct,published_at,scheduled_at,url,platform,is_primary,channel')
    .eq('channel', ch).eq('platform', 'youtube'));
  const primaryPubs = pubs.filter(p => p.is_primary);
  let daily = [];
  if (primaryPubs.length) {
    daily = await q(sb.from('publication_metrics_daily').select('date,views,publication_id')
      .in('publication_id', primaryPubs.map(p => p.id)).gte('date', since).order('date', { ascending: true }));
  }
  store.analytics[ch] = { kpi, pubs: primaryPubs, daily, mediaKey: primary ? primary.kpi_media_key : null };
  return store.analytics[ch];
}

/* ══ シェル ═════════════════════════════════════════════════════ */
function renderShell(){
  /* 見えないビューを選んだ状態が残らないようにする（権限が変わった場合の保険・#208） */
  const views = visibleViews();
  if (!views.some(v => v.key === state.view)) state.view = views[0].key;

  /* いま見ているのがチャンネル共通の画面か（＝チャンネルタブが「戻り道」になる） */
  const indepNow = !!(views.find(x => x.key === state.view) || {}).chIndep;
  $('#chtabs').innerHTML = store.channels.map(c => {
    const m = chMeta(c.slug), on = state.ch === c.slug;
    return `<button class="chtab" role="tab" aria-selected="${on && !indepNow}" data-ch="${esc(c.slug)}"
       style="--chac:${m.accent}" title="${esc(c.name)}${indepNow ? 'の制作へ戻る' : ''}">
      <span class="cdot" style="background:${m.accent}"></span>${m.icon} ${esc(c.name)}</button>`;
  }).join('') || `<span class="chtab" aria-hidden="true">チャンネルなし</span>`;

  /* チャンネルに依存しない画面（稼働・システム）はチャンネルタブの右へ（オーナー要望 2026-08-19）。
     下のナビはそのチャンネルの中の画面（制作・分析）だけにして、2つの軸を混ぜない。
     ⚠️ スマホだけは逆にする: 画面が狭いとチャンネル名が読めなくなるので、共通画面は
     従来どおり下の固定タブバーに置く。両方に描いて CSS で出し分ける（画面幅の判定を
     JS に持たせると回転・リサイズのたびに描き直しが要るため）。 */
  $('#systabs').innerHTML = views.filter(v => v.chIndep).map(v =>
    `<button class="chtab sys" role="tab" aria-selected="${state.view === v.key}" data-view="${v.key}"
       title="${esc(v.label)}" aria-label="${esc(v.label)}">
      <span class="cdot" style="background:var(--axis)"></span>${v.icon}<span class="lbl">${v.label}</span></button>`).join('');

  $('#nav').innerHTML = views.map(v => {
    const on = state.view === v.key, n = v.badge ? v.badge() : 0;
    return `<button class="navbtn${v.chIndep ? ' indep' : ''}" role="tab" aria-selected="${on}" data-view="${v.key}">
      <span class="ni" aria-hidden="true">${v.icon}</span>${v.label}${n ? `<span class="badge">${n}</span>` : ''}</button>`;
  }).join('');

  const v = views.find(x => x.key === state.view);
  document.body.dataset.chindep = v && v.chIndep ? '1' : '0';
  document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
  /* 詳細ビューが開いている間は #view-detail を優先表示（一覧は隠す） */
  if (state.detail != null) {
    $('#view-detail').classList.add('active');
    document.body.classList.add('detail-open');
  } else {
    $('#view-' + state.view).classList.add('active');
    document.body.classList.remove('detail-open');
  }

  $('#syncdot').className = 'syncdot' + (state.busy ? ' busy' : '');
  $('#synctext').textContent = state.busy ? '読み込み中…'
    : (state.lastSync ? '最終読込 ' + fmtDT(state.lastSync) : '未読込');
  $('#reloadbtn').classList.toggle('spin', state.busy);
  $('#footer').textContent = `制作ダッシュボード ・ 更新 ${BUILT_AT}`;
}

/* ══ 新版の検知（#205）════════════════════════════════════════════
   GitHub Pages は HTML に Cache-Control: max-age=600 を返すため、デプロイ直後に
   開くと最大10分は古い版が表示される（プライベートモードでも同じ）。設定では
   変えられないので、ページ側で「自分自身を no-store で取り直してビルド時刻を
   比べる」ことで気づけるようにする。違っていればバナーを出して再読込を促す。 */
async function checkForUpdate(){
  if (BUILT_AT === '8/20 22:07') return;          /* ローカルで開いた未デプロイ版 */
  try {
    const res  = await fetch(location.pathname + '?_=' + Date.now(), { cache:'no-store' });
    if (!res.ok) return;
    const text = await res.text();
    const m    = text.match(/const BUILT_AT = '([^']*)'/);
    if (!m || m[1] === BUILT_AT || m[1] === '8/20 22:07') return;
    const bar = document.createElement('div');
    bar.id = 'newver';
    bar.innerHTML = `新しい版があります（${esc(m[1])}）<button type="button">再読み込み</button>`;
    bar.querySelector('button').onclick = () => location.reload();
    document.body.appendChild(bar);
  } catch { /* 通信できないときは黙って諦める（本流を止めない） */ }
}

const errBox = msg => `<div class="errbox"><b>読み込みエラー</b><br>${esc(msg)}</div>`;
const loading = () => `<div class="loadbox">読み込み中…</div>`;

/* ══ ① 在庫 ════════════════════════════════════════════════════ */
function displayIdx(it){
  if (it.stage === 'dropped') return -1;
  let i = Math.max(0, PSTAGES.findIndex(s => s.key === it.stage));
  const rv = it._rv || it._rc;          /* 【AI】修正中もそのゲートの工程で止まっている */
  if (rv && GATE_COL[rv] > i) i = GATE_COL[rv];
  return i;
}
/* 一覧の行／カードに付ける状態クラス（左端の色帯）と状態バッジ。
   バッジは在庫の表・在庫カード・レビュー一覧・詳細で必ずこの2つの関数から作る（表記も寸法も1か所） */
const stateCls = it => it._rv ? 'st-rv' : (it._rc ? 'st-rc' : (it._open ? 'st-open' : ''));
const badgeHTML = b => b ? `<span class="sbadge ${b.cls}">${b.gl} ${esc(b.text)}</span>` : '';
const stateBadgeOf = it =>
    it._rv ? {cls:'rv', gl:'●', text:`${GATE_LABEL[it._rv]}承認待ち`}
  : it._rc ? {cls:'rc', gl:'↺', text:`${AI_TAG}${GATE_LABEL[it._rc]}修正中`} : null;
const openBadgeHTML = it => it._open
  ? `<span class="sbadge open" title="あなたの指摘のうち未対応 ${it._open}件">💬 指摘${it._open}件</span>` : '';
function flagsHTML(it){
  const h = badgeHTML(stateBadgeOf(it)) + openBadgeHTML(it);
  return h ? `<span class="flags">${h}</span>` : '';
}
/* 一覧の行に付けるバッジ一式（#206）。進行中（【AI】台本作成中 等）も含む stageBadge を使うので、
   PC の表とスマホの在庫カードで必ず同じバッジが出る（表だけ無印の行ができない）。
   生成は badgeHTML / openBadgeHTML の2つだけを通す＝表記も寸法も1か所のまま。 */
/* 承認待ちの行には、その場で通せるボタンを出す（オーナー要望 2026-08-20）。
   コメント無しの承認が普通なので、1タップで承認まで行く（数秒だけ取り消せる） */
const quickOkHTML = it => it._rv
  ? `<button class="okbtn" data-act="approve-quick" data-key="${it.id}|${esc(it._rv)}"
      data-label="承認" title="${esc(GATE_LABEL[it._rv] || it._rv)}を承認">承認</button>` : '';
const rowFlagsHTML = it => `<span class="flags">${badgeHTML(stageBadge(it))}${openBadgeHTML(it)}${quickOkHTML(it)}</span>`;
const pKeyOf = it => it.stage === 'dropped' ? 'dropped' : PSTAGES[displayIdx(it)].key;

function progressCells(it){
  const cur = displayIdx(it), done = it.stage === 'posted';
  return PSTAGES.map((s, j) => {
    const pos = j === 0 ? ' first' : (j === PSTAGES.length - 1 ? ' last' : '');
    let cls = 'todo', gl = '·', tt = `${s.name} 未到達`;
    if (cur < 0) { cls = 'todo'; gl = '·'; tt = `${s.name}（没）`; }
    else if (done || j < cur) { cls = 'done'; gl = '✓'; tt = `${s.name} 完了`; }
    else if (j === cur) {
      if (it._rv)      { cls = 'rv'; gl = '●'; tt = `${GATE_LABEL[it._rv]}承認待ち（あなたの番）`; }
      else if (it._rc) { cls = 'rc'; gl = '↺'; tt = `${AI_TAG}${GATE_LABEL[it._rc]}修正中`; }
      else             { cls = 'work'; gl = '●'; tt = `${AI_TAG}${s.work}`; }
    }
    return `<td class="st${pos}"><span class="mark ${cls}" title="${esc(tt)}">${gl}</span></td>`;
  }).join('');
}

/* 工程チップの件数は「チャンネル全体（検索・ジャンル絞り込みを反映）」で数える。
   表示中の100件だけで数えると、ページを送るたびに数字が動いてしまう。
   母数は facets（stage_key / genre_label / search_text の3列だけ）から作る。 */
function filterChips(facets){
  const qs = state.stockQ.trim().toLowerCase(), g = state.stockGenre;
  const rows = (facets || []).filter(f =>
    (!qs || String(f.search_text || '').includes(qs)) && (!g || f.genre_label === g));
  const cnt = {};
  let dropped = 0;
  rows.forEach(f => {
    if (f.stage_key === 'dropped') dropped++;
    else cnt[f.stage_key] = (cnt[f.stage_key] || 0) + 1;
  });
  const all = [{key:null, name:'すべて', n:rows.length - dropped}]
    .concat(PSTAGES.map(s => ({key:s.key, name:s.name, n:cnt[s.key] || 0})))
    .concat([{key:'dropped', name:'没', n:dropped}]);
  return `<div class="chips" role="group" aria-label="工程で絞り込み">${all.map(c => {
    const on = state.stockFilter === c.key, dis = c.key && !c.n ? ' disabled' : '';
    return `<button class="chipf" data-filter="${c.key === null ? '' : c.key}" aria-pressed="${on}"${dis}>${
      c.name}<span class="n">${c.n}</span></button>`;
  }).join('')}</div>`;
}

/* 既定の並び順（#203・2026-08-11 オーナー指定 / #205 で【AI】修正中を追加）
   ① 承認待ち（あなたが動く番）→ ② 【AI】修正中（あなたの指摘をAIが対応中）→ ③ 進行中
   → ④ 投稿済み・予約中 → ⑤ ネタ案
   ネタ案は着手前で見るものが無いので最後に沈める。グループ内は ④ だけ「投稿日時の新しい順」
   （これから公開される予約が上・過去の投稿が下）、それ以外は滞留日数の降順（待たせている順）。
   ⚠️ この並べ替えは **DB 側（v_dashboard_list の sort_rank / sort_key2・M027）** にある
      （#215 Phase 2）。手元で並べ替えると「先に100件取ってから並べる」ことになり、
      承認待ちの動画が2ページ目に隠れて見逃す。列見出しクリックの並べ替えも同じ理由で
      DB へ渡している（listOrder / SORT_DB）。 */

/* ── 一覧のセクション（在庫とレビューの統合・オーナー要望 2026-08-19）────────────
   「あなたの番 →【AI】作業中 → 完了 → ネタ案 → 没」の順に見出しを立てて並べる。
   承認した動画が一覧から消えず【AI】作業中に残り続けるのが主目的（承認＝レビュー一覧から
   消える、だとどこへ行ったのか分からない）。下3つは既定で畳み、件数だけ見せる。
   並びは DB 側の sort_rank（承認待ち→修正中→進行中→投稿済み→ネタ案）そのままなので、
   ここでは見出しを差し込むだけで並べ替えはしない。
   絞り込み・並べ替え中は順番の意味が変わるのでセクションを外し、素直な一覧にする。 */
const SECTIONS = [
  {key:'rv',   label:'あなたの番 — 承認待ち',      hint:'素材を見て、承認するか修正を依頼してください'},
  {key:'ai',   label:AI_TAG + '作業中',            hint:'AIが自動で進めています（差し戻した分の直しもここ）'},
  {key:'done', label:'完了（予約済み・投稿済み）',  fold:true},
  {key:'idea', label:'ネタ案（未着手）',            fold:true},
  {key:'drop', label:'没',                         fold:true}
];
function sectionOf(it){
  if (it.stage === 'dropped') return 'drop';
  if (it._rv) return 'rv';                    /* あなたの番。工程より優先する */
  if (it._rc) return 'ai';                    /* 差し戻しの直し中も AI の番 */
  if (it.stage === 'posted' || it.stage === 'queue') return 'done';
  if (it.stage === 'idea') return 'idea';
  return 'ai';
}
const sectionsOff = () => !!(state.stockSort || state.stockFilter
  || state.stockQ.trim() || state.stockGenre);
const secOpen = s => !s.fold || !!state.secOpen[s.key];
function groupSections(rows){
  const g = {};
  rows.forEach(it => { const k = sectionOf(it); (g[k] = g[k] || []).push(it); });
  return SECTIONS.map(s => Object.assign({}, s, {rows: g[s.key] || []})).filter(s => s.rows.length);
}
/* 見出しの共通部分（表の行とスマホのカード見出しで同じ文言・同じ開閉状態を使う） */
function secHeadInner(s){
  return `<span class="sn">${s.fold ? `<span class="tri">${secOpen(s) ? '▾' : '▸'}</span>` : ''}${esc(s.label)}</span>
    <span class="n">${s.rows.length}件</span>${s.hint ? `<span class="hint">${esc(s.hint)}</span>` : ''}`;
}
const secAttrs = s => s.fold
  ? ` data-secfold="${s.key}" tabindex="0" role="button" aria-expanded="${secOpen(s)}"` : '';

function matrixTable(core){
  const rows = core.items;         /* 絞り込み・並べ替え・ページ切りは DB 側で済んでいる */

  const th = (k, extra = '') => {
    const s = state.stockSort, on = s && s.key === k;
    return `<th class="sortable${extra}" data-sort="${k}">${SORT_LABEL[k]}${
      on ? `<span class="ar">${s.dir === 'asc' ? '▲' : '▼'}</span>` : ''}</th>`;
  };
  const head = `<tr>
      <th class="pad" colspan="3"></th>
      <th class="grp" colspan="${PSTAGES.length}">工程</th>
      <th class="pad" colspan="4"></th></tr>
    <tr>${th('seq')}${th('title')}${th('genre')}${
      PSTAGES.map((s, j) => `<th class="st${j === 0 ? ' first' : (j === PSTAGES.length - 1 ? ' last' : '')}">${s.name}</th>`).join('')
    }${th('days', ' num')}<th>投稿日時</th>${th('plays', ' num')}${th('subs', ' num')}</tr>`;

  const COLS = 7 + PSTAGES.length;
  const tr = it => `<tr data-vid="${it.id}" tabindex="0" class="${
      (it.stage === 'dropped' ? 'dropped ' : '') + stateCls(it)}">
      <td class="seq">${esc(it.seq)}</td>
      <td class="ttl">${esc(it.title)}${rowFlagsHTML(it)}</td>
      <td><span class="genre">${esc(it.genreLabel)}</span></td>
      ${progressCells(it)}
      <td class="num">${it.days == null ? '—' : it.days + '日'}</td>
      <td class="${it.resv || it.pub ? '' : 'dim'}">${it.resv ? `<span class="resv">🗓 ${esc(it.resv)}</span>` : (esc(it.pub) || '—')}</td>
      <td class="num${it.plays == null ? ' dim' : ''}">${it.plays == null ? '—' : nf(it.plays)}</td>
      <td class="num${it.subs == null ? ' dim' : ''}">${it.subs == null ? '—' : (it.subs > 0 ? '+' : '') + it.subs}</td></tr>`;
  const secTR = s => `<tr class="secrow s-${s.key}${s.fold ? ' foldable' : ''}"${secAttrs(s)}>
      <td colspan="${COLS}">${secHeadInner(s)}</td></tr>`;

  const body = !rows.length
    ? `<tr class="emptyrow"><td colspan="${COLS}">条件に一致する動画はありません</td></tr>`
    : sectionsOff() ? rows.map(tr).join('')
    : groupSections(rows).map(s => secTR(s) + (secOpen(s) ? s.rows.map(tr).join('') : '')).join('');

  return `<div class="tblwrap mtx${rows.length > 14 ? ' tall' : ''}">
    <table><thead>${head}</thead><tbody>${body}</tbody></table></div>${stockCards(rows)}`;
}

/* 狭幅（スマホ）用のカード表示。表と同じ rows から描画し CSS で出し分ける */
/* 記号は絵文字を使わず文字グリフにする（バッジの文字色がそのまま乗るので、
   同じ状態なら在庫カードでもレビュー一覧でも完全に同じ見え方になる） */
function stageBadge(it){
  if (it.stage === 'dropped') return {cls:'idea', gl:'○', text:'没'};
  if (it.stage === 'posted')  return {cls:'done', gl:'✓', text:'投稿済'};
  const st = stateBadgeOf(it);
  if (st) return st;
  if (it.stage === 'idea')    return {cls:'idea', gl:'○', text:'ネタ案'};
  /* 投稿待ちは誰も作業していない（公開時刻待ち）ので【AI】は付けない */
  if (it.stage === 'queue')   return {cls:'work', gl:'●', text:'投稿待ち'};
  return {cls:'work', gl:'●', text:`${AI_TAG}${PSTAGES[displayIdx(it)].work}`};
}
function progressDots(it){
  const cur = displayIdx(it), done = it.stage === 'posted';
  return `<div class="dotrow" role="img" aria-label="工程 ${esc(cur < 0 ? '没' : PSTAGES[cur].name)}">` + PSTAGES.map((s, j) => {
    let cls = 'todo', gl = '·';
    if (cur >= 0 && (done || j < cur)) { cls = 'done'; gl = '✓'; }
    else if (cur >= 0 && j === cur) {
      cls = it._rv ? 'rv' : (it._rc ? 'rc' : 'work'); gl = it._rc && !it._rv ? '↺' : '●';
    }
    const here = cur >= 0 && j === cur;
    return `<span class="pstep"><span class="dot ${cls}" title="${esc(s.name)}">${gl}</span>` +
      `<span class="plbl${here ? ' cur' : ''}">${esc(s.short)}</span></span>`;
  }).join('') + `</div>`;
}
function stockCards(rows){
  const card = it => {
    const b = stageBadge(it);
    const extra = it.stage === 'posted'
      ? (it.plays != null ? `<span class="sx">▶ ${nf(it.plays)} 回再生</span>` : '')
      : (it.resv ? `<span class="sx">🗓 ${esc(it.resv)}</span>`
        : (it.pub ? `<span class="sx">📅 ${esc(it.pub)}</span>` : ''));
    return `<article class="scard${it.stage === 'dropped' ? ' dropped' : ''} ${stateCls(it)}" data-vid="${it.id}" tabindex="0">
      <div class="scard-top">
        <span class="scard-seq">${esc(it.seq)}</span>
        <span class="scard-ttl">${esc(it.title)}</span>
        <span class="scard-days${it.days >= 7 ? ' slow' : ''}">${it.days >= 7 ? '⏳ ' : ''}滞留 ${it.days == null ? '—' : it.days + '日'}</span>
      </div>
      <div class="sbadges">${badgeHTML(b)}${openBadgeHTML(it)}${quickOkHTML(it)}</div>
      ${progressDots(it)}
      ${extra ? `<div class="scard-extra">${extra}</div>` : ''}
    </article>`;
  };
  const secHead = s => `<div class="csechead s-${s.key}${s.fold ? ' foldable' : ''}"${secAttrs(s)}>${
    secHeadInner(s)}</div>`;
  const body = !rows.length
    ? `<div class="noitem">条件に一致する動画はありません</div>`
    : sectionsOff() ? rows.map(card).join('')
    : groupSections(rows).map(s => secHead(s) + (secOpen(s) ? s.rows.map(card).join('') : '')).join('');
  return `<div class="stockcards">${body}</div>`;
}

function gateChips(it, slug){
  return chMeta(slug).gates.map(g => {
    const on = !!it[GATE_COLUMN_FIELD[g]];
    return `<span class="gate ${on ? 'on' : ''}">${on ? '✓ ' : ''}${GATE_LABEL[g]}</span>`;

function kanbanView(items, slug){
  const cols = STATUS_COLS.map(s => {
    const list = items.filter(i => i.status === s.st).sort((a, b) => (b.days || 0) - (a.days || 0));
    const shown = list.slice(0, 4), rest = list.length - shown.length;
    const body = !list.length ? `<div class="empty">仕掛かりなし</div>`
      : shown.map(c => `
          <article class="vcard">
            <div class="top"><span class="seq">${esc(c.seq)}</span>
              <span class="days ${c.days >= 7 ? 'slow' : ''}">${c.days >= 7 ? '⏳ ' : ''}滞留 ${c.days == null ? '—' : c.days + '日'}</span></div>
            <div class="ttl">${esc(c.title)}</div>
            <div class="meta">${gateChips(c, slug)}${c.resv ? `<span class="resv">🗓 ${esc(c.resv.slice(5))}</span>` : ''}${
              c._rv ? `<span class="rvflag">● ${GATE_LABEL[c._rv]}承認待ち</span>` : ''}${
              c._rc ? `<span class="rcflag">↺ ${AI_TAG}${GATE_LABEL[c._rc]}修正中</span>` : ''}${
              c._open ? `<span class="rcflag">💬 指摘${c._open}件</span>` : ''}</div>
          </article>`).join('') + (rest > 0 ? `<div class="more">＋${rest}件</div>` : '');
    return `<div class="col">
      <div class="colhead"><span class="sw" style="background:var(${s.sw});margin:0"></span>
        <span class="nm">${s.st}</span><span class="ct tnum">${list.length}</span></div>${body}</div>`;
  }).join('');
  const drop = items.filter(i => i.stage === 'dropped');
  return `<div class="kanban">${cols}</div>
    <details class="dropped-fold">
      <summary><span class="tri">▸</span>没 ${drop.length}件を表示</summary>
      <div class="body">${drop.length ? drop.map(x => `<div class="row"><span class="seq">${esc(x.seq)}</span><span>${esc(x.title)}</span><span class="reason">${esc(x.decision_note || x.note || '')}</span></div>`).join('')
        : '<div class="empty">没はありません</div>'}</div>

}

/* ページ送り（#215 Phase 2）。並び順は DB 側（sort_rank）で付けているので、
   1ページ目に必ず「承認待ち（あなたの番）」が来る。 */
function pagerHTML(core){
  const pages = Math.max(1, Math.ceil(core.total / PAGE_SIZE));
  if (pages <= 1) return '';
  const p = core.page;
  return `<div class="pager">
    <button class="btn" id="pgprev"${p <= 0 ? ' disabled' : ''}>← 前へ</button>
    <span class="pginfo">${p + 1} / ${pages} ページ<span class="pgtot">（全 ${nf(core.total)}件）</span></span>
    <button class="btn" id="pgnext"${p >= pages - 1 ? ' disabled' : ''}>次へ →</button>
  </div>`;
}

/* メモ・没理由は改行なしの長い地の文で保存されていることが多い（リサーチ結果の丸写し等）。
   保存値はそのままに、表示時だけ句点で折り返して読めるようにする。既に改行が入っている
   文字列には触らない（書き手が意図的に整形しているため） */
function sentenceWrap(s){
  const t = String(s || '');
  if (t.includes('\n')) return t;
  return t.replace(/。(?!\s*$)/g, '。\n');
}
function timelineRows(it){
  const cur = displayIdx(it);
  const stamp = {
    1: it.approved_script_at, 2: it.approved_storyboard_at, 4: it.approved_final_at,
    6: it.published_at || it.scheduled_at || it.posted_date
  };
  return PSTAGES.map((s, j) => {
    let dt = '—', cls = ' future', mk = 'todo';
    if (cur < 0) { dt = '—'; }
    else if (it.stage === 'posted' || j < cur) {
      mk = 'done'; cls = '';
      dt = fmtDate(stamp[j]) || '—';
    } else if (j === cur) {
      mk = it._rv ? 'rv' : (it._rc ? 'rc' : 'work'); cls = '';
      const since = fmtDate(it.status_changed_at);
      dt = (it._rv ? '承認待ち' : it._rc ? `${AI_TAG}修正中` : `${AI_TAG}${s.work}`) + (since ? `（${since}〜）` : '');
    }
    return `<div class="row${cls}"><span class="mark ${mk}">${
      mk === 'done' ? '✓' : (mk === 'todo' ? '·' : (mk === 'rc' ? '↺' : '●'))}</span>
      <span class="nm">${s.name}</span><span class="dt">${esc(dt)}</span></div>`;
  }).join('');
}

function detailHTML(it){
  const m = chMeta(it.channel), cur = displayIdx(it);
  const curName = cur < 0 ? '没' : PSTAGES[cur].name;

  const metrics = (it.plays != null || it.avg_view_rate_pct != null || it.subs != null) ? `
    <div class="dsec"><h4>メトリクス${it.measured_date ? `（${esc(fmtDate(it.measured_date) || it.measured_date)} 計測）` : ''}</h4>
      <div class="mgrid">
        <div class="m"><div class="k">再生数</div><div class="v">${it.plays == null ? '—' : nf(it.plays)}</div></div>
        <div class="m"><div class="k">平均視聴率</div><div class="v">${it.avg_view_rate_pct == null ? '—' : Number(it.avg_view_rate_pct).toFixed(1) + '%'}</div></div>
        <div class="m"><div class="k">登録者増</div><div class="v">${it.subs == null ? '—' : (it.subs > 0 ? '+' : '') + it.subs}</div></div>
      </div>
      ${it.youtube_url ? `<a class="ytlink" href="${esc(it.youtube_url)}" target="_blank" rel="noopener noreferrer">${esc(it.youtube_url)}</a>` : ''}
    </div>` : '';

  const dropped = it.stage === 'dropped'
    ? `<div class="dsec dsec-note"><h4>没理由</h4><div class="hook">${esc(sentenceWrap(it.decision_note || it.note || '（記録なし）'))}</div></div>` : '';

  const noteBlk = it.note ? `<div class="dsec dsec-note"><h4>メモ</h4><div class="hook">${esc(sentenceWrap(it.note))}</div></div>` : '';

  /* 【AI】修正中（AIの番）でもレビュー節は出す。素材・履歴を見て追加コメントや承認ができる */
  const rvGate = it._rv || it._rc;
  const stateBar = it._rv
    ? `<div class="dstate rv">● <b>あなたの承認待ち</b>です。素材を確認して、コメントするか承認してください。</div>`
    : (it._rc ? `<div class="dstate rc">↺ <b>${AI_TAG}${GATE_LABEL[it._rc]}修正中</b>です。${
        it._open ? `未対応の指摘 <b>${it._open}件</b>。` : ''}夜間の制作エージェントが対応すると自動で解消されます。</div>` : '');
  /* ── レビュー履歴は常設（#207）────────────────────────────────────
     承認するとゲート状態（_rv/_rc）が消えてレビュー節ごと閉じるため、履歴は
     「記録が1件でもあれば必ず出す」。全ゲートを時系列1本で読ませる。
     開閉: 議論中（承認待ち／【AI】修正中）は開いた状態・それ以外は畳んで件数だけ見せる。
     置き場所（#266 オーナー要望 2026-08-19）: レビュー中は「素材 → レビュー履歴 → コメント欄」
     の順にレビュー節の中へ入れる。スマホは1カラムで上から流れるので、一番下が素材ではなく
     コメントになり、読んだ流れのまま書ける（広い画面では右列＝レビュー列の中に収まる）。
     レビュー節が無い動画（承認済み・投稿済み等）は行き先が無いので従来どおり左のメタ列に置く。 */
  const evs = threadOf(it.id);
  const history = evs.length ? `<details class="dsec dsec-history"${rvGate ? ' open' : ''}>
      <summary class="dsum">レビュー履歴<span class="n">（${evs.length}件）</span></summary>
      <div class="dsum-body">${threadHTML(it.id)}</div>
    </details>` : '';

  const review = rvGate ? `<div class="dsec dsec-review" style="border-top:1px solid var(--border);padding-top:var(--sp-4)">
      <h4>レビュー — ${GATE_LABEL[rvGate]}の承認ポイント</h4>${stateBar}${reviewPanel(it, rvGate, history)}</div>` : '';

  return `<div class="dview">
    <button class="backbtn" data-close="1" aria-label="一覧に戻る">← 一覧に戻る</button>
    <article class="dcard" role="region" aria-label="${esc(it.title)} の詳細">
      <div class="dhead">
        <div style="flex:1 1 auto;min-width:0">
          <div class="seqn">${esc(it.seq)}</div>
          <h3>${esc(it.title)}</h3>
          <div class="meta">
            <span class="chip"><span class="cdot" style="background:${m.accent}"></span>${m.icon} ${esc(m.name)}</span>
            <span class="genre">${esc(it.genreLabel)}</span>
            <span class="gbadge"><i style="background:${it._rv ? 'var(--s1)'
              : (it.stage === 'posted' || it.stage === 'dropped') ? 'var(--done)' : 'var(--fix)'}"></i>${curName}</span>
            <span class="wait">滞留 ${it.days == null ? '—' : it.days + '日'}</span>
            ${flagsHTML(it)}
          </div>
        </div>
        <button class="iconbtn" data-close="1" aria-label="閉じる">✕</button>
      </div>
      <div class="dbody">
        ${dropped}${noteBlk}
        <div class="dcol-meta">
          <div class="dsec"><h4>フック</h4><div class="hook">${esc(it.hook || '（未設定）')}</div></div>
          <div class="dsec"><h4>工程タイムライン</h4><div class="tl">${timelineRows(it)}</div>
            <div class="dhint">日付は承認ポイント・公開時刻の実記録のみ表示（記録が無い工程は —）</div></div>
          ${metrics}${rvGate ? '' : history}
        </div>${review}
      </div>
    </article>
  </div>`;
}

/* ── 履歴付き詳細ビュー（#200）───────────────────────────────────
   在庫カード／レビュー項目クリックで #view-detail を全画面表示し history.pushState で
   履歴を積む。ブラウザの戻る（popstate）／画面内「戻る」ボタン（data-close→history.back）で
   一覧へ戻り、開いた時点のスクロール位置を復元する。URL は同一パス上のハッシュ #detail/… のみ。 */
const BASE_URL = () => location.pathname + location.search;
let _returnScroll = null;

/* 詳細ビューを実際に描画する（履歴は積まない・再描画や popstate から共用）。
   一覧に載っていない動画（別ページ・ディープリンク）でも開けるよう、動画1行と
   その動画のレビュー記録をここで取りに行く（#215 Phase 2 で非同期になった）。 */
async function openDetail(vid, gate){
  const id = Number(vid);
  const dv = $('#view-detail');
  state.detail = id;
  document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
  dv.classList.add('active');
  document.body.classList.add('detail-open');
  document.body.style.overflow = '';
  if (!store.threads[id] || !store.byId.get(id)) dv.innerHTML = loading();

  let it, evs;
  try {
    it = await loadItem(id);
    if (it) evs = await loadThread(id);
  } catch (e) { dv.innerHTML = errBox(e.message); return; }
  if (!it) { closeDetail(); return; }
  if (state.detail !== id) return;             /* 待っている間に別の動画へ移った */

  /* 入口（在庫／レビュー）に依らずレビューパネルが出るよう、保留ゲートを都度算出 */
  annotate(it, evs);

  dv.innerHTML = detailHTML(it);
  window.scrollTo(0, 0);
  dv.querySelector('.backbtn')?.focus();
  mountAllAssets(dv);
}

/* 一覧へ戻す（履歴は操作しない）。scrollY 指定があればそこへ、無ければ開いた時点へ復元 */
function closeDetail(scrollY){
  const wasOpen = state.detail != null;
  state.detail = null;
  const dv = $('#view-detail');
  dv.classList.remove('active');
  dv.innerHTML = '';
  document.body.classList.remove('detail-open');
  document.body.style.overflow = '';
  $('#view-' + state.view)?.classList.add('active');
  if (wasOpen) {
    const y = (scrollY != null) ? scrollY : _returnScroll;
    if (y != null) requestAnimationFrame(() => window.scrollTo(0, y));
  }
  _returnScroll = null;
}

/* クリック起点：現在のスクロールを一覧履歴に刻んでから詳細をプッシュ */
async function pushDetail(vid, gate){
  const y = window.scrollY;
  let it;
  try { it = await loadItem(Number(vid)); } catch { return; }
  if (!it) return;
  _returnScroll = y;
  const base = history.state || {};
  history.replaceState(Object.assign({}, base, { view: state.view, ch: state.ch, scrollY: _returnScroll }), '', BASE_URL());
  const hash = `#detail/${encodeURIComponent(state.ch)}/${encodeURIComponent(it.seq)}` +
    (gate ? '/' + encodeURIComponent(gate) : '');
  history.pushState({ detail: it.id, ch: state.ch, gate: gate || null, view: state.view }, '', hash);
  await openDetail(it.id, gate);
}

function parseHash(){
  const m = /^#detail\/([^/]+)\/([^/]+)(?:\/([^/]+))?$/.exec(location.hash || '');
  if (!m) return null;
  return { ch: decodeURIComponent(m[1]), seq: decodeURIComponent(m[2]),
           gate: m[3] ? decodeURIComponent(m[3]) : null };
}

/* 直リロード／ディープリンク（#detail/…）で開いたときの初期ルーティング。
   無効なハッシュはトップ（一覧）へ落とす。back で一覧へ戻れるよう履歴を [一覧, 詳細] に整える。 */
async function applyInitialRoute(){
  const r = parseHash();
  if (!r) return;
  if (!store.channels.some(c => c.slug === r.ch)) { history.replaceState({}, '', BASE_URL()); return; }
  let it;
  try {
    if (r.ch !== state.ch) { state.ch = r.ch; await render(); }
    /* 一覧のページに載っていない seq でも開けるよう、DB から直接1行引く */
    it = await loadItemBySeq(state.ch, r.seq);
  } catch { history.replaceState({}, '', BASE_URL()); return; }
  if (!it) { history.replaceState({}, '', BASE_URL()); return; }
  history.replaceState({ view: state.view, ch: state.ch, scrollY: 0 }, '', BASE_URL());
  history.pushState({ detail: it.id, ch: state.ch, gate: r.gate, view: state.view }, '',
    `#detail/${encodeURIComponent(state.ch)}/${encodeURIComponent(it.seq)}${r.gate ? '/' + encodeURIComponent(r.gate) : ''}`);
  _returnScroll = 0;
  await openDetail(it.id, r.gate);
}

window.addEventListener('popstate', e => {
  const st = e.state || {};
  /* 一覧に載っていない動画でも openDetail が1行取りに行く（開けなければ閉じる） */
  if (st.detail != null && st.ch === state.ch) openDetail(st.detail, st.gate);
  else closeDetail(st.scrollY);
});

/* ── 素材の描画 ─────────────────────────────────────────────── */
const NO_ASSET = `<div class="noitem">まだ素材がありません
  <span class="s">今夜の制作でここに入ります</span></div>`;

function assetHead(f){
  return `<div class="ahead"><span class="anm">${esc(f.name)}</span>
    ${f.size != null ? `<span class="asz">${esc(fmtSize(f.size))}</span>` : ''}
    ${f.url ? `<a class="alink" href="${esc(f.url)}" target="_blank" rel="noopener noreferrer">別タブで開く</a>` : ''}</div>`;
}

/* 台本(.md)向けの軽量 Markdown レンダラー。
   XSS対策: 本文は必ず esc() でエスケープしてから、既知パターンだけをタグ化する
   （生HTMLは一切通さない）。台本で使う記法（見出し/太字/箇条書き/番号/水平線/【見出し】）に限定。 */
function mdInline(s){
  return esc(s)
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    /* 斜体（*…*）。太字を先に消してから拾い、前後が空白の * は掛け算とみなして触らない */
    .replace(/(^|[^*\w])\*([^\s*][^*\n]*[^\s*]|[^\s*])\*(?!\*)/g, '$1<em>$2</em>')
    .replace(/(【[^】]+】)/g, '<strong class="mdtag">$1</strong>');
}
function mdToHTML(src){
  const lines = String(src == null ? '' : src).replace(/\r\n?/g, '\n').split('\n');
  let out = '', list = null;
  const closeList = () => { if (list) { out += `</${list}>`; list = null; } };
  for (const raw of lines) {
    const line = raw.replace(/\s+$/, '');
    if (!line.trim()) { closeList(); continue; }
    if (/^\s*([-*_]\s*){3,}$/.test(line)) { closeList(); out += '<hr>'; continue; }
    let m = /^(#{1,6})\s+(.*)$/.exec(line);
    if (m) { closeList(); const lv = m[1].length; out += `<h${lv} class="mdh mdh${lv}">${mdInline(m[2])}</h${lv}>`; continue; }
    m = /^\s*\d+[.)]\s+(.*)$/.exec(line);
    if (m) { if (list !== 'ol') { closeList(); out += '<ol>'; list = 'ol'; } out += `<li>${mdInline(m[1])}</li>`; continue; }
    m = /^\s*(?:[-*]\s+|・\s*)(.*)$/.exec(line);
    if (m) { if (list !== 'ul') { closeList(); out += '<ul>'; list = 'ul'; } out += `<li>${mdInline(m[1])}</li>`; continue; }
    closeList(); out += `<p>${mdInline(line)}</p>`;
  }
  closeList();
  return out;
}

/* ── 素材のバージョン（#209）──────────────────────────────────────
   差し戻して再提出するたび `…_v02.pdf` のように版が増え、古い版も Storage に残る
   （例: storyboard_v01.pdf / storyboard_v02.pdf / storyboard_v02_p01〜p17.jpg）。
   全部を縦に並べるとスマホで延々スクロールになるので、既定では最新版だけを開き、
   古い版は畳んで残す（消さない）。`_vNN` を持たないファイルは版の概念が無いので常に出す。 */
const assetVer = name => { const m = /_v(\d+)/i.exec(String(name)); return m ? m[1] : null; };
const verNum = v => Number(v);

function assetsHTML(files){
  if (!files.length) return NO_ASSET;
  /* 版の一覧（新しい順）。同じ番号は表記のばらつき（v1/v01）を避けて数値で束ねる */
  const vs = [...new Set(files.map(f => assetVer(f.name)).filter(v => v != null))]
    .sort((a, b) => verNum(b) - verNum(a));
  if (!vs.length) return assetBlocksHTML(files);          /* 版なし＝従来どおり全部表示 */

  const latest = vs[0];
  const isLatest = f => { const v = assetVer(f.name); return v == null || verNum(v) === verNum(latest); };
  /* 最新版は「その版のファイルすべて」（PDF＋ページ画像17枚など）をまとめて出す */
  const head = `<div class="verbar"><span class="vchip">v${esc(latest)}（最新）</span>${
    vs.length > 1 ? `<span class="vnote">以前の版は下に畳んであります</span>` : ''}</div>`;
  const olds = vs.slice(1).map(v => {
    const list = files.filter(f => verNum(assetVer(f.name)) === verNum(v));
    return `<details class="oldver">
      <summary class="dsum">以前の版（v${esc(v)}）<span class="n">（${list.length}件）</span></summary>
      <div class="assets">${assetBlocksHTML(list)}</div></details>`;
  }).join('');
  return head + assetBlocksHTML(files.filter(isLatest)) + olds;
}

function assetBlocksHTML(files){
  if (!files.length) return NO_ASSET;
  /* `…_p01.jpg` 形式は資料の「ページ」（絵コンテの各ページ等）。サムネ格子ではなく
     縦スクロールのビューアで見せる（#203） */
  const pageNo = f => { const m = /_p(\d+)\.(?:jpe?g|png)$/i.exec(f.name); return m ? Number(m[1]) : null; };
  const pages = files.filter(f => f.kind === 'image' && pageNo(f) != null)
                     .sort((a, b) => pageNo(a) - pageNo(b));
  const imgs = files.filter(f => f.kind === 'image' && pageNo(f) == null);
  const rest = files.filter(f => f.kind !== 'image');

  const blocks = rest.map(f => {
    if (f.kind === 'text') {
      if (/\.md$/i.test(f.name) && f.text != null) {
        return `<div class="asset">${assetHead(f)}<div class="mdbody">${mdToHTML(f.text)}</div></div>`;
      }
      return `<div class="asset">${assetHead(f)}<pre class="atext">${
        f.text != null ? esc(f.text) : esc(f.err || '（本文が空です）')}</pre></div>`;
    }
    if (f.kind === 'video') {
      return `<div class="asset">${assetHead(f)}${f.url
        ? `<video class="avid" controls preload="metadata" playsinline src="${esc(f.url)}"></video>`
        : `<div class="afiles">この動画の署名URLを取得できませんでした</div>`}</div>`;
    }
    return null;
  }).filter(Boolean);

  const others = rest.filter(f => f.kind === 'file');
  if (others.length) {
    blocks.push(`<div class="asset"><div class="afiles">${others.map(f =>
      f.url ? `<a href="${esc(f.url)}" target="_blank" rel="noopener noreferrer">${esc(f.name)}</a>${
        f.size != null ? ` <span class="asz">${esc(fmtSize(f.size))}</span>` : ''}`
        : esc(f.name)).join('')}</div></div>`);
  }
  if (pages.length) {
    blocks.unshift(`<div class="asset">
      <div class="ahead"><span class="anm">絵コンテ ${pages.length} ページ</span>
        <span class="asz">箱の中をスクロール・画像クリックで原寸</span></div>
      <div class="pageview">${pages.map((f, i) => f.url
        ? `<figure><a href="${esc(f.url)}" target="_blank" rel="noopener noreferrer">
             <img src="${esc(f.url)}" alt="${esc(f.name)}" loading="lazy" decoding="async"></a>
           <figcaption>${i + 1} / ${pages.length}</figcaption></figure>`
        : `<figure><figcaption>${esc(f.name)}（表示できませんでした）</figcaption></figure>`).join('')}</div></div>`);
  }
  if (imgs.length) {
    blocks.unshift(`<div class="asset">
      <div class="ahead"><span class="anm">画像 ${imgs.length} 点</span>
        <span class="asz">クリックで原寸表示</span></div>
      <div class="thumbs">${imgs.map(f => f.url
        ? `<a class="thumb" href="${esc(f.url)}" target="_blank" rel="noopener noreferrer" title="${esc(f.name)}">
             <img src="${esc(f.url)}" alt="${esc(f.name)}" loading="lazy"><span class="tnm">${esc(f.name)}</span></a>`
        : `<span class="thumb"><span class="tnm">${esc(f.name)}</span></span>`).join('')}</div></div>`);
  }
  return blocks.join('');
}

/* data-assets 付きの箱に非同期で素材を流し込む（再描画で箱が消えたら何もしない） */
async function mountAssets(node){
  if (!node) return;
  const { ch, seq, gate } = node.dataset;
  try {
    const a = await loadAssets(ch, seq, gate);
    if (node.isConnected) node.innerHTML = assetsHTML(a.files);
  } catch (e) {
    if (node.isConnected) node.innerHTML = `<div class="noitem">素材を読み込めませんでした
      <span class="s">${esc(e.message || String(e))}</span></div>`;
  }
}
const mountAllAssets = root => (root || document).querySelectorAll('[data-assets]').forEach(mountAssets);

/* ── 書き込み（コメント・承認・没）───────────────────────────────
   誤タップ防止（#205）: コメント欄・承認・没はそれぞれ別ブロック。コメント欄からは
   承認できず、承認は「承認ボタン → メモ欄と注意書きが開く → 確定ボタン」の2段階でしか
   通らない。没はさらに慎重にする（理由が空のあいだ確定ボタンを押せない）。 */
function reviewPanel(it, gate, historyHTML){
  const key = it.id + '|' + gate;
  const gname = GATE_LABEL[gate] || gate;
  const caution = GATE_CAUTION[gate] || null;
  const pid = `ap-${it.id}-${gate}`;
  const rid = `rj-${it.id}-${gate}`;
  /* 並び順は「素材 → レビュー履歴 → コメント欄 → 没 → 承認バー」（#266）。
     historyHTML は detailHTML から受け取る（無ければ空文字） */
  return `<div class="blk"><h4>レビュー素材</h4>
      <div class="assets" data-assets="${esc(key)}" data-ch="${esc(it.channel)}"
           data-seq="${esc(it.seq)}" data-gate="${esc(gate)}">
        <div class="loadbox">素材を読み込み中…</div></div></div>
    ${historyHTML || ''}
    <div class="wbox" data-wbox="${esc(key)}">
      <h4 class="wh">コメント</h4>
      <textarea class="wta" rows="3" aria-label="コメント"
        placeholder="直してほしい点・気づいたことを入力（Ctrl + Enter で送信）"></textarea>
      <div class="wmsg" data-slot="comment" hidden></div>
      <div class="wact">
        <span class="whint">修正依頼として記録され、AI が直して出し直します</span>
        <button class="btn soft" data-act="comment" data-key="${esc(key)}">コメントする</button>
      </div></div>
    <div class="rjbox" data-rjbox="${esc(key)}">
      <button class="btn rjopen" data-act="reject-open" data-key="${esc(key)}"
        aria-expanded="false" aria-controls="${rid}">このネタを没にする</button>
      <div class="rjpanel" id="${rid}" hidden>
        <div class="rjwarn">⚠ この動画の制作を止めて<b>ネタごと没</b>にします。表現を直したいだけなら、
          上のコメント欄で伝えてください。没の取り消しはダッシュボードからはできません。</div>
        <label class="alb" for="${rid}-reason">没にする理由（必須）</label>
        <textarea class="rta" id="${rid}-reason" rows="2" aria-label="没にする理由（必須）"
          placeholder="例: 検証できないネタだった／類似動画が伸びていない"></textarea>
        <div class="anote">理由は記録され、同じネタが再び提案されたときに参照されます。</div>
        <div class="wmsg" data-slot="reject" hidden></div>
        <div class="aact">
          <button class="btn" data-act="reject-cancel">キャンセル</button>
          <button class="btn danger" data-act="reject-confirm" data-key="${esc(key)}" disabled>この理由で没にする</button>
        </div>
      </div></div>
    <div class="abox" data-abox="${esc(key)}">
      ${caution ? `<div class="acaution">⚠ ${esc(caution)}</div>` : ''}
      <details class="afold"><summary class="dsum">メモを付ける（任意）</summary>
        <textarea class="ata" id="${pid}-note" rows="2" aria-label="承認メモ（任意）"
          placeholder="残したいメモがあれば入力（空欄のままで構いません）"></textarea></details>
      <div class="arow">
        <span class="ainfo"><span class="ahd">承認</span>
          <span class="atx">${esc(gname)}の承認ポイントを通すと、この工程は完了して次へ進みます。</span></span>
        <button class="btn primary" data-act="approve-quick" data-key="${esc(key)}"
          data-label="${esc(gname)}を承認">${esc(gname)}を承認</button>
      </div>
      <div class="wmsg" data-slot="approve" hidden></div></div>`;
}

/* RPC の例外はそのまま出さず、SQLSTATE から日本語の案内に置き換える */
function rpcErrText(error, act){
  const code = error && error.code;
  const raw  = String((error && error.message) || '');
  if (code === '42501' || /permission denied/i.test(raw))
    return 'このアカウントには書き込み権限がありません（ダッシュボードの許可リストを確認してください）';
  if (code === 'P0002' || /video not found/i.test(raw))
    return '対象の動画が見つかりませんでした。再読み込みしてからやり直してください';
  if (code === '22001' || /too long/i.test(raw))
    return '本文が長すぎます（4000文字以内で入力してください）';
  /* 予約済み・投稿済みの動画は没にできない（reject_video の 55000・M023） */
  if (code === '55000' || /already scheduled or published/i.test(raw))
    return '予約済み・投稿済みの動画は没にできません（先に予約の取り消し／公開の取り下げをしてください）';
  if (code === '22023')
    return /reason is empty/i.test(raw) ? '没にする理由を入力してください'
         : /body is empty/i.test(raw)   ? 'コメントを入力してください'
                                        : '対象の承認ポイントが不正です（台本 / 絵コンテ / 完成のいずれか）';
  if (/JWT|token is expired|invalid claim/i.test(raw))
    return 'ログインの有効期限が切れました。再度ログインしてください';
  if (/fetch|network|Failed to send/i.test(raw))
    return '通信に失敗しました。接続を確認して再度お試しください';
  return act === 'approve' ? '承認できませんでした。時間をおいて再度お試しください'
       : act === 'reject'    ? '没にできませんでした。時間をおいて再度お試しください'
                             : 'コメントを送信できませんでした。時間をおいて再度お試しください';
}

/* コメント欄（.wbox）・承認欄（.abox）・没欄（.rjbox）は別ブロックだが、
   二重送信ガードは3つまとめてかける（どれか送信中は全部の操作を止める） */
function writeGroup(box){
  const p = box.parentElement;
  const found = p ? [...p.querySelectorAll('[data-wbox],[data-abox],[data-rjbox]')] : [];
  return found.length ? found : [box];
}
function wboxBusy(box, busy, label){
  const boxes = writeGroup(box);
  boxes.forEach(b => {
    b.dataset.busy = busy ? '1' : '0';
    b.querySelectorAll('button').forEach(btn => { btn.disabled = busy; });
    b.querySelectorAll('.wta,.ata,.rta').forEach(ta => { ta.disabled = busy; });
  });
  const btn = label && boxes.map(b => b.querySelector(`[data-act="${label}"]`)).find(Boolean);
  if (btn) {
    if (busy) { btn.dataset.lbl = btn.textContent; btn.textContent = '送信中…'; }
    else if (btn.dataset.lbl) { btn.textContent = btn.dataset.lbl; delete btn.dataset.lbl; }
  }
  /* 没の確定は理由が入っているときだけ押せる（busy 解除で不用意に有効化しない） */
  if (!busy) boxes.forEach(syncRejectReady);
}
/* 没の確定ボタンの活性を理由の入力状態に同期する */
function syncRejectReady(box){
  const btn = box.querySelector('[data-act="reject-confirm"]');
  const ta  = box.querySelector('.rta');
  if (btn && ta) btn.disabled = !ta.value.trim();
}
function wboxMsg(box, text, isErr, slot){
  const key = slot || 'comment';
  const boxes = writeGroup(box);
  boxes.forEach(b => b.querySelectorAll('.wmsg').forEach(m => {
    if (m.dataset.slot !== key) { m.textContent = ''; m.hidden = true; }
  }));
  const m = boxes.map(b => b.querySelector(`.wmsg[data-slot="${key}"]`)).find(Boolean);
  if (!m) return;
  m.className = 'wmsg' + (isErr ? ' err' : '');
  m.textContent = text || '';
  m.hidden = !text;
}

/* 承認の2段階目を開く／閉じる。1段目のボタンは開いている間は隠して、押し先を1つに絞る */
function openRejectPanel(box){
  if (box.dataset.busy === '1') return;
  const panel = box.querySelector('.rjpanel'), btn = box.querySelector('[data-act="reject-open"]');
  if (!panel) return;
  wboxMsg(box, '', false, 'reject');
  panel.hidden = false;
  if (btn) { btn.hidden = true; btn.setAttribute('aria-expanded', 'true'); }
  syncRejectReady(box);
  panel.querySelector('.rta')?.focus();
}
function closeRejectPanel(box){
  if (box.dataset.busy === '1') return;
  const panel = box.querySelector('.rjpanel'), btn = box.querySelector('[data-act="reject-open"]');
  if (panel) {
    panel.hidden = true;
    const ta = panel.querySelector('.rta'); if (ta) ta.value = '';
  }
  wboxMsg(box, '', false, 'reject');
  syncRejectReady(box);
  if (btn) { btn.hidden = false; btn.setAttribute('aria-expanded', 'false'); btn.focus(); }
}

/* 書き込み後は取り直して描き直す。一覧の状態バッジ・並び順・指摘件数は
   v_dashboard_list（M027）が review_events から作っているので、コメント1件でも
   一覧が変わりうる＝動画側のキャッシュはまとめて捨てる（#215 Phase 2）。 */
async function refreshAfterWrite(approved){
  clearVideoCaches();
  store.assets = {};
  if (approved) store.analytics = {};
  const keep = state.detail;
  await render();
  if (keep) await openDetail(keep);     /* 開けなければ openDetail が閉じる */
}

/* コメント（RPC は従来どおり request_changes。指摘は resolution_status='open' で記録される） */
async function submitComment(box, key){
  if (box.dataset.busy === '1') return;
  const [vid, gate] = key.split('|');
  const ta = box.querySelector('.wta');
  const body = ((ta && ta.value) || '').trim();
  if (!body) { wboxMsg(box, 'コメントを入力してください', true, 'comment'); if (ta) ta.focus(); return; }
  wboxMsg(box, '', false, 'comment');
  wboxBusy(box, true, 'comment');
  const { error } = await sb.rpc('request_changes',
    { p_video_id: Number(vid), p_gate: gate, p_body: body });
  if (error) { wboxBusy(box, false, 'comment'); wboxMsg(box, rpcErrText(error, 'comment'), true, 'comment'); return; }
  ta.value = '';
  await refreshAfterWrite(false);
  toast('修正を依頼しました');
}

/* 承認の2段階目（確定）。パネルが開いていないときは絶対に実行しない＝1タップでは通らない */
/* ── 1クリック承認（オーナー要望 2026-08-20）─────────────────────────────
   一覧の行からも詳細のボタンからも、押した1回で承認まで通す。押した瞬間は DB へ
   書かず、数秒の猶予をおいてから書く（その間は「取り消す」で無かったことにできる）。
   詳細でメモを開いて書いてあれば、その内容を添えて承認する。 */
async function approveNow(vid, gate, note){
  const gname = GATE_LABEL[gate] || gate;
  const { data, error } = await sb.rpc('approve_gate',
    { p_video_id: Number(vid), p_gate: gate, p_note: note || null });
  if (error) { toast(rpcErrText(error, 'approve')); await refreshAfterWrite(true); return; }
  await refreshAfterWrite(true);
  toast((data && data.already_approved) ? `${gname}は既に承認済みです` : `${gname}を承認しました`);
}
function quickApprove(key, btn){
  const [vidS, gate] = String(key).split('|');
  const gname = GATE_LABEL[gate] || gate;
  /* 詳細のメモ欄（同じ動画・同じゲートのもの）に書いてあれば添える */
  const box = btn && btn.closest('[data-abox]');
  const ta = box && box.querySelector('.ata');
  const note = ((ta && ta.value) || '').trim();
  const label = btn ? (btn.dataset.label || btn.textContent) : '';
  if (btn) { btn.disabled = true; btn.textContent = '承認しました'; }
  actWithUndo(`${gname}を承認しました`,
    () => approveNow(vidS, gate, note),
    () => { if (btn) { btn.disabled = false; btn.textContent = label; } });
}

/* 没の2段階目（確定）。パネルが開いていて理由が入っているときだけ実行する。
   videos.status が変わるので core も含めて取り直す（refreshAfterWrite(true)）。 */
async function submitReject(box, key){
  if (box.dataset.busy === '1') return;
  const panel = box.querySelector('.rjpanel');
  if (!panel || panel.hidden) return;
  const [vidS, gate] = key.split('|');
  const vid = Number(vidS);
  const ta = panel.querySelector('.rta');
  const reason = ((ta && ta.value) || '').trim();
  if (!reason) { wboxMsg(box, '没にする理由を入力してください', true, 'reject'); if (ta) ta.focus(); return; }

  wboxMsg(box, '', false, 'reject');
  wboxBusy(box, true, 'reject-confirm');
  const { data, error } = await sb.rpc('reject_video',
    { p_video_id: vid, p_gate: gate, p_reason: reason });
  if (error) { wboxBusy(box, false, 'reject-confirm'); wboxMsg(box, rpcErrText(error, 'reject'), true, 'reject'); return; }
  if (ta) ta.value = '';
  const already = !!(data && data.already_dropped);
  await refreshAfterWrite(true);
  toast(already ? 'この動画はすでに没になっています' : '没にしました');
}

  // AI（ai:* — ai:backfill / ai:youtube-produce 等）は Claude アイコン、人間はイニシャルのまま（見分け）
  if (String(author).startsWith('ai:')) {
    return `<img class="av aiav" src="${CLAUDE_ICON_DATAURI}" alt="Claude" role="img" aria-label="Claude">`;
  }
  const init = author === 'koike' ? 'ko' : author === 'kohnosuke' ? 'kh' : author.slice(0, 2);
  const bg = author === 'koike' ? 'var(--s1)' : 'var(--s2)';
  return `<span class="av" style="background:${bg}">${esc(init)}</span>`;
}
/* ── コメント本文の描き方（#266）──────────────────────────────────
   AI の提出コメントは Markdown で書かれている（見出し・箇条書き・太字）ので、素材の台本と
   同じ mdToHTML で組む（記法がそのまま文字として出るのを止める）。XSS は mdToHTML 側で
   担保済み（必ず esc() してから既知パターンだけをタグ化する＝生HTMLは通さない）。
   長さ: AI コメントは平均487文字・最長1159文字（実測46件）で、スマホだと1件で画面2〜3枚に
   なる。既定は冒頭2行だけ見せて畳み、「続きを読む」で開く（人のコメントは平均55文字なので
   しきい値には掛からず、従来どおり全文が出る）。畳みは履歴・旧版と同じ details/summary。 */
const CMT_FOLD_LEN = 220;
function cmtPreview(src, n){
  const t = String(src || '').replace(/\r\n?/g, '\n')
    .replace(/^\s*#{1,6}\s+/gm, '')                   /* 見出しの # */
    .replace(/^\s*([-*_]\s*){3,}\s*$/gm, '')          /* 水平線 */
    .replace(/^\s*(?:[-*]\s+|・\s*|\d+[.)]\s+)/gm, '')/* 箇条書き・番号 */
    .replace(/\*\*([^*]+)\*\*/g, '$1')                /* 太字 */
    .replace(/\s+/g, ' ').trim();
  return t.length > n ? t.slice(0, n) + '…' : t;
}
function cmtBodyHTML(body){
  const src = String(body || '');
  if (!src.trim()) return `<div class="ctxt mdbody"><p>（本文なし）</p></div>`;
  const full = `<div class="ctxt mdbody">${mdToHTML(src)}</div>`;
  if (src.length <= CMT_FOLD_LEN) return full;
  return `<details class="cfold"><summary class="csum">
      <span class="cprev">${esc(cmtPreview(src, 96))}</span>
      <span class="cmore"><span class="ctri">▸</span></span></summary>${full}</details>`;
}

function threadHTML(videoId){
  const evs = threadOf(videoId);
  if (!evs.length) return `<div class="noitem">この動画のレビュー記録はまだありません</div>`;
  return `<div class="thread">${evs.map(e => {
    const ai = String(e.author).startsWith('ai:');
    /* アバターは吹き出しの外（左の列）ではなく名前の行に置く。吹き出しが幅を全部使えるので
       長い提出コメントが読みやすく、スマホでは端から端まで伸びる（#266 オーナー要望） */
    return `<div class="cmt ${ai ? 'ai' : ''}"><div class="bub">
      <div class="who">${avatarOf(e.author)}<b>${ai ? '【AI】' + esc(String(e.author).slice(3)) : esc(e.author)}</b>
        <span class="gatechip">${esc(GATE_LABEL[e.gate] || e.gate || '—')}</span>
        <span class="kindchip ${esc(e.kind)}">${KIND_LABEL[e.kind] || esc(e.kind)}</span>
        <span>${esc(fmtDT(e.created_at) || '')}</span>
        ${e.score != null ? `<span class="kindchip">score ${esc(e.score)}</span>` : ''}</div>
      ${cmtBodyHTML(e.body)}
      ${e.resolution_status ? `<span class="resolved ${e.resolution_status === 'open' ? 'open' : 'closed'}">${
        e.resolution_status === 'open' ? '⏳' : '✓'} ${
        RESOLUTION_LABEL[e.resolution_status] || esc(e.resolution_status)}${
        e.resolution_note ? '：' + esc(e.resolution_note) : ''}</span>` : ''}
    </div></div>`;
  }).join('')}</div>`;
}

/* ══ ③ 分析 ════════════════════════════════════════════════════ */
function sparkline(data, color, W, H, label){
  const P = 10;
  const min = Math.min(...data), max = Math.max(...data), span = (max - min) || 1;
  const X = i => P + (W - 2 * P) * (data.length === 1 ? 0.5 : i / (data.length - 1));
  const Y = v => H - P - (H - 2 * P) * ((v - min) / span);
  const line = data.map((v, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(' ');
  const area = `${line} L${X(data.length - 1).toFixed(1)} ${H - P} L${X(0).toFixed(1)} ${H - P} Z`;
  const last = data.length - 1;
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img"
      aria-label="${esc(label)}。${min}から${max}へ。">
    <line x1="${P}" y1="${H - P}" x2="${W - P}" y2="${H - P}" stroke-width="1" vector-effect="non-scaling-stroke" style="stroke:var(--grid)"/>
    <path d="${area}" style="fill:${color};opacity:.10"/>
    <path d="${line}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"
      vector-effect="non-scaling-stroke" style="fill:none;stroke:${color}"/>
    <circle cx="${X(last).toFixed(1)}" cy="${Y(data[last]).toFixed(1)}" r="4"
      stroke-width="2" vector-effect="non-scaling-stroke" style="fill:${color};stroke:var(--surface-1)"/>
    <g class="hov" style="display:none">
      <line class="hl" y1="${P - 3}" y2="${H - P}" stroke-width="1" vector-effect="non-scaling-stroke" style="stroke:var(--axis)"/>
      <circle class="hd" r="4.5" stroke-width="2" vector-effect="non-scaling-stroke" style="fill:${color};stroke:var(--surface-1)"/>
    </g>
    <rect x="0" y="0" width="${W}" height="${H}" fill="transparent" style="cursor:crosshair"/>
  </svg>`;
}

/* 分布ヒストグラム: 閾値ラインを引き、到達ビンを good 色・未達ビンを accent で塗る。
   values は呼び出し側で NULL 除外済み。fmt はエッジ表示の整形関数、unit は単位文字列。 */
function histogram(values, thr, step, accent, fmt, unit){
  const dmin = Math.min(...values), dmax = Math.max(...values);
  const lo = Math.min(thr, Math.floor(dmin / step + 1e-9) * step);
  const hi = Math.max(thr, Math.ceil(dmax / step - 1e-9) * step);
  const nb = Math.max(1, Math.round((hi - lo) / step));
  const bins = new Array(nb).fill(0);
  values.forEach(v => { let b = Math.floor((v - lo) / step + 1e-9); b = Math.min(nb - 1, Math.max(0, b)); bins[b]++; });
  const maxc = Math.max(1, ...bins);
  const W = 40 + nb * 44, H = 150, PL = 8, PR = 8, PT = 22, PB = 26;
  const plotW = W - PL - PR, plotH = H - PT - PB, x0 = PL, baseY = H - PB, bw = plotW / nb;
  const X = v => x0 + plotW * ((v - lo) / (hi - lo));
  const bars = bins.map((c, i) => {
    if (!c) return '';
    const bx = x0 + bw * i + 1.5, bwid = Math.max(2, bw - 3);
    const bh = Math.max(3, plotH * (c / maxc)), by = baseY - bh;
    const binLo = lo + step * i, hit = binLo >= thr - 1e-9;
    const col = hit ? 'var(--good)' : accent;
    return `<g><rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${bwid.toFixed(1)}" height="${bh.toFixed(1)}" rx="3" style="fill:${col};opacity:.9"><title>${fmt(binLo)}〜${fmt(binLo + step)}${unit}: ${c}本</title></rect>
      <text x="${(bx + bwid / 2).toFixed(1)}" y="${(by - 5).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="700" font-family="system-ui,sans-serif" style="fill:var(--ink-2)">${c}</text></g>`;
  }).join('');
  const stride = Math.ceil(nb / 6);
  let ticks = '';
  for (let i = 0; i <= nb; i++){
    const edge = lo + step * i, tx = X(edge);
    ticks += `<line x1="${tx.toFixed(1)}" y1="${baseY}" x2="${tx.toFixed(1)}" y2="${baseY + 3}" stroke-width="1" vector-effect="non-scaling-stroke" style="stroke:var(--axis)"/>`;
    if (i % stride === 0 || i === nb)
      ticks += `<text x="${tx.toFixed(1)}" y="${baseY + 15}" text-anchor="middle" font-size="9" font-family="system-ui,sans-serif" style="fill:var(--muted)">${fmt(edge)}</text>`;
  }
  const txr = X(thr);
  const thrLine = `<line x1="${txr.toFixed(1)}" y1="${PT - 8}" x2="${txr.toFixed(1)}" y2="${baseY}" stroke-width="1.5" stroke-dasharray="4 3" vector-effect="non-scaling-stroke" style="stroke:var(--crit)"/>
    <text x="${txr.toFixed(1)}" y="${(PT - 11)}" text-anchor="middle" font-size="9.5" font-weight="700" font-family="system-ui,sans-serif" style="fill:var(--crit)">${fmt(thr)}${unit}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img"
      aria-label="分布ヒストグラム。閾値 ${fmt(thr)}${unit}。${values.length}本。">
    <line x1="${x0}" y1="${baseY}" x2="${(x0 + plotW).toFixed(1)}" y2="${baseY}" stroke-width="1" vector-effect="non-scaling-stroke" style="stroke:var(--grid)"/>
    ${bars}${ticks}${thrLine}
  </svg>`;
}

async function renderAnalytics(){
  const el = $('#view-analytics');
  if (!state.ch) { el.innerHTML = `<div class="noitem">動画チャンネルがありません</div>`; return; }
  const m = chMeta(state.ch);
  if (!store.analytics[state.ch]) el.innerHTML = loading();
  let a;
  try { a = await loadAnalytics(state.ch); }
  catch (e) { el.innerHTML = errBox(e.message); return; }

  const subsSeries = a.kpi.filter(r => r.follower_actual != null);
  const latestSubs = subsSeries.length ? subsSeries[subsSeries.length - 1].follower_actual : null;
  const weekAgo = subsSeries.find(r => r.date >= jstDateStr(-7));
  const subsDelta = (latestSubs != null && weekAgo && weekAgo.follower_actual != null && subsSeries.length > 1)
    ? latestSubs - weekAgo.follower_actual : null;

  const posted = a.pubs.filter(p => p.status === '投稿済');
  const totalViews = posted.reduce((s, p) => s + (p.views || 0), 0);
  const rates = posted.map(p => p.avg_view_rate_pct).filter(v => v != null).map(Number);
  const avgRate = rates.length ? rates.reduce((s, v) => s + v, 0) / rates.length : null;
  const since7 = Date.now() - 7 * DAY;
  const weekPosts = posted.filter(p => p.published_at && new Date(p.published_at).getTime() >= since7).length;

  const tiles = [
    {lb:'登録者数', vl: latestSubs == null ? '—' : nf(latestSubs),
     dl: subsDelta == null ? '先週比データ蓄積待ち' : `${subsDelta >= 0 ? '▲ +' : '▼ '}${nf(subsDelta)} 人 先週比`, hero:true},
    {lb:'総再生数（累計）', vl: nf(totalViews), dl: `投稿済 ${posted.length} 本の合計`},
    {lb:'平均視聴率', vl: avgRate == null ? '—' : avgRate.toFixed(1) + '%', dl: avgRate == null ? '未計測' : `計測済 ${rates.length} 本の平均`},
    {lb:'直近7日の投稿', vl: weekPosts + ' 本', dl: '公開日ベース'}
  ].map(t => `<div class="kpi ${t.hero ? 'hero' : ''}" style="--chac:${m.accent}">
      <div class="lb">${t.lb}</div><div class="vl">${t.vl}</div>
      <div class="dl">${esc(t.dl)}</div></div>`).join('');

  /* 登録者の推移 */
  let subsCard;
  if (subsSeries.length >= 2) {
    const first = subsSeries[0].follower_actual, last = latestSubs;
    sparkSeries = { values: subsSeries.map(r => r.follower_actual), labels: subsSeries.map(r => fmtMD(r.date + 'T00:00:00+09:00')), unit:'人' };
    const mini = `<div class="tblwrap"><table><thead><tr><th>日付</th><th class="num">登録者</th></tr></thead><tbody>${
      subsSeries.filter((_, i, arr) => i === 0 || i === arr.length - 1 || i % Math.max(1, Math.ceil(arr.length / 5)) === 0)
        .map(r => `<tr><td>${esc(fmtDate(r.date) || r.date)}</td><td class="num">${nf(r.follower_actual)}</td></tr>`).join('')}</tbody></table></div>`;
    subsCard = `<div class="card">
        <div class="sectionhead" style="margin:0 0 var(--sp-2)"><h2>登録者の推移</h2><span class="hint">daily_kpi（media=${esc(a.mediaKey || '—')}）・直近30日</span></div>
        <div class="spark" id="spark"></div>
        <div class="sparkcap">${esc(fmtDate(subsSeries[0].date) || subsSeries[0].date)} <b>${nf(first)}</b> → ${esc(fmtDate(subsSeries[subsSeries.length - 1].date) || subsSeries[subsSeries.length - 1].date)} <b>${nf(last)}</b>（<span style="color:var(--up);font-weight:700">${last - first >= 0 ? '+' : ''}${nf(last - first)}</span>）</div>
        <button class="tbltoggle" id="tbltoggle">${state.tblOpen ? '表を閉じる' : '表で見る'}</button>
        <div class="minitbl ${state.tblOpen ? 'show' : ''}" id="minitbl">${mini}</div>
      </div>`;
  } else {
    sparkSeries = null;
    subsCard = `<div class="card">
        <div class="sectionhead" style="margin:0 0 var(--sp-2)"><h2>登録者の推移</h2><span class="hint">直近30日</span></div>
        <div class="noitem">データ蓄積待ち（8/11朝から記録開始）<span class="s">daily_kpi の ${esc(a.mediaKey || 'media 未設定')} 行が2日分たまると推移を描画します</span></div>
      </div>`;
  }

  /* 再生数の推移（publication_metrics_daily） */
  const byDate = new Map();
  a.daily.forEach(d => byDate.set(d.date, (byDate.get(d.date) || 0) + (d.views || 0)));
  const dates = [...byDate.keys()].sort();
  const playsCard = dates.length >= 2
    ? `<div class="card">
        <div class="sectionhead" style="margin:0 0 var(--sp-2)"><h2>再生数の推移</h2><span class="hint">全投稿の累計合計・直近30日</span></div>
        <div class="tblwrap"><table><thead><tr><th>日付</th><th class="num">累計再生数</th></tr></thead><tbody>${
          dates.map(d => `<tr><td>${esc(fmtDate(d) || d)}</td><td class="num">${nf(byDate.get(d))}</td></tr>`).join('')}</tbody></table></div>
      </div>`
    : `<div class="card">
        <div class="sectionhead" style="margin:0 0 var(--sp-2)"><h2>再生数の推移</h2><span class="hint">全投稿の累計合計・直近30日</span></div>
        <div class="noitem">データ蓄積待ち（8/11朝から記録開始）<span class="s">publication_metrics_daily に日次スナップショットが積まれると表示されます</span></div>
      </div>`;

  /* 収益化予実メーター（#72・両チャンネル）: 達成率は2条件のうち低い方
     現在値は実データ（登録者=daily_kpi 最新・再生=投稿済 views 合計）。 */
  const subsNow = latestSubs || 0;
  const monet = `<div class="card"><div class="sectionhead" style="margin:0 0 var(--sp-2)">
      <h2>収益化の予実</h2><span class="hint">#72 の2条件・達成率は低い方 / 登録者=daily_kpi 最新・再生=投稿済 views 合計</span></div>
    ${MONETIZE.map(t => {
      const p1 = Math.min(1, subsNow / t.subs), p2 = Math.min(1, totalViews / t.plays), p = Math.min(p1, p2);
      return `<div class="meterblk">
        <div class="mh"><span class="nm">${esc(t.nm)}</span><span class="pc">${(p * 100).toFixed(1)}%</span></div>

      </div>`;
    }).join('')}</div>`;

  /* 完全視聴率（#72 最重要 KPI・70%閾値）: NULL 除外して集計 */
  const avrGe70 = rates.filter(v => v >= 70).length;
  const compCard = rates.length ? `<div class="card">
      <div class="sectionhead" style="margin:0 0 var(--sp-2)"><h2>完全視聴率（70%目標）</h2>
        <span class="hint">v_publications.avg_view_rate_pct・NULL除外</span></div>
      <div class="substats">
        <div class="substat"><span class="k">平均</span><span class="v">${avgRate.toFixed(1)}<small>%</small></span></div>
        <div class="substat"><span class="k">70%到達</span><span class="v">${avrGe70}<small>本（${Math.round(avrGe70 / rates.length * 100)}%）</small></span></div>
        <div class="substat"><span class="k">計測済</span><span class="v">${rates.length}<small>/${posted.length}本</small></span></div>
      </div>
      <div class="distwrap"><div class="dist">${histogram(rates, 70, 10, m.accent, v => Math.round(v), '%')}</div></div>
      <div class="distlegend"><span><i style="background:var(--good)"></i>70%到達</span><span><i style="background:${m.accent}"></i>未達</span><span style="color:var(--crit)">┊ 70%ライン</span></div>
    </div>` : `<div class="card">
      <div class="sectionhead" style="margin:0 0 var(--sp-2)"><h2>完全視聴率（70%目標）</h2><span class="hint">avg_view_rate_pct</span></div>
      <div class="noitem">完全視聴率のデータがまだありません<span class="s">投稿済 ${posted.length} 本中 計測 0 本。retention 計測が daily-log に載ると集計します</span></div>
    </div>`;

  /* フック維持率（hook_awr・目標 ≥1.8）: NULL 除外 */
  const hooks = posted.map(p => p.hook_awr).filter(v => v != null).map(Number);
  const hookAvg = hooks.length ? hooks.reduce((s, v) => s + v, 0) / hooks.length : null;
  const hookGe18 = hooks.filter(v => v >= 1.8).length;
  const hookCard = hooks.length ? `<div class="card">
      <div class="sectionhead" style="margin:0 0 var(--sp-2)"><h2>冒頭の維持（目標 1.8）</h2>
        <span class="hint">v_publications.hook_awr・冒頭の離脱耐性・NULL除外</span></div>

        <div class="substat"><span class="k">計測済</span><span class="v">${hooks.length}<small>/${posted.length}本</small></span></div>
      </div>

      <div class="distlegend"><span><i style="background:var(--good)"></i>1.8到達</span><span><i style="background:${m.accent}"></i>未達</span><span style="color:var(--crit)">┊ 1.8ライン</span></div>
    </div>` : `<div class="card">
      <div class="sectionhead" style="margin:0 0 var(--sp-2)"><h2>冒頭の維持（目標 1.8）</h2><span class="hint">hook_awr</span></div>
      <div class="noitem">冒頭の維持のデータがまだありません<span class="s">投稿済 ${posted.length} 本中 計測 0 本</span></div>
    </div>`;

  /* 48時間初速（枠のみ・空状態）
     設計: publication_metrics_daily（pmd）が publication_id×date で積まれたら、各投稿について
     published_at + 48h に最も近い（date >= 公開+2日 を満たす最初の）pmd スナップショット行を引き、
     その時点の avg_view_rate_pct / views を集計して「投稿後48h時点で完全視聴率70%↑の割合」を出す。
     pmd は現状0行のため、蓄積後に有効化する空状態プレースホルダを表示する。 */
  const velocityCard = `<div class="card">

  /* 動画別成績（列強化: 完全視聴率・フック維持率・エンゲージ率を追加） */

      <td class="num">${v.hook_awr == null ? '—' : Number(v.hook_awr).toFixed(2)}</td>

      <td class="num">${v.subscribers_gained == null ? '—' : (v.subscribers_gained > 0 ? '+' : '') + v.subscribers_gained}</td></tr>`).join('')
    : `<tr class="emptyrow"><td colspan="8">投稿済の動画がありません</td></tr>`;

  el.innerHTML = `

        <div class="tblwrap perftbl"><table>
          <thead><tr><th>seq</th><th>タイトル</th><th>公開日</th><th class="num">再生数</th>
            <th class="num">完全視聴率</th><th class="num">冒頭の維持</th><th class="num">エンゲージ率</th><th class="num">登録者増</th></tr></thead>

/* ok=null（＝閉じられていない）のまま この時間を超えた行は「中断疑い」として赤で出す。
   正規の最長ランは stock keeper の 02:00→06:00 打ち切り＝4時間なので 5時間で線を引く（#219） */
const STALE_RUN_MS = 5 * 60 * 60 * 1000;

function laneChips(lanes){
  if (!lanes || typeof lanes !== 'object') return '';
  return Object.keys(lanes).map(slug => {
    const m = chMeta(slug), v = lanes[slug];
    const cells = Array.isArray(v)
      ? v.map((n, i) => ({ nm: LANE_NAMES[i] || ('L' + (i + 1)), n, low: (i === 0 && n < 15) || (i === 4 && n < 2) }))
      : Object.keys(v || {}).map(k => ({ nm: k, n: v[k], low: false }));
    return `<div class="lanerow"><span class="chip"><span class="cdot" style="background:${m.accent}"></span>${m.icon} ${esc(m.name)}</span>${
      cells.map(c => `<span class="lane ${c.low ? 'low' : ''}">${c.low ? '⚠ ' : ''}${esc(c.nm)} ${esc(c.n)}</span>`).join('')}</div>`;
  }).join('');
}

/* 実行記録の種類をオーナーの言葉にする（画面に内部の名前を出さない・2026-08-20） */
const RUN_KIND_JA = {
  'stock-keeper':'動画の夜間制作', 'daily-log':'数字の記録', 'weekly-review':'週次レビュー',
  'monthly-audit':'月次点検', 'review-poller':'承認・差し戻しの反映',
  'x-reply':'Xのリプ返信', 'x-post-publish':'Xの投稿', 'x-post-propose':'Xの投稿ネタ選び'
};

/* 稼働タブ（オーナー指定 2026-08-20）: 上に「正常終了か・異常があったか」だけを大きく出し、
   1件ずつの詳細（何をしたか・所要時間・チャンネル別の内訳）は畳んで、開いたときだけ見せる。 */
async function renderOps(){
  const el = $('#view-ops');
  if (!store.ops) el.innerHTML = loading();
  let ops;
  try { ops = await loadOps(); }
  catch (e) { el.innerHTML = errBox(e.message); return; }

  const running = ops.runs.find(r => !r.finished_at);
  /* 1件の状態を4つに畳む。ok は「最後まで走ったか」しか表さないので、
     業務上の注意（⚠ 付きの要約）は別に拾う */
  const stateOf = r => {
    const stale = r.ok == null && r.started_at
      && (Date.now() - new Date(r.started_at).getTime()) > STALE_RUN_MS;
    if (r.ok === false || stale) return {key:'err', cls:'err', txt: r.ok === false ? '✕ エラー' : '✕ 途中で止まった'};
    if (r.ok == null) return {key:'run', cls:'run', txt:'● 実行中'};
    return String(r.summary || '').includes('⚠')
      ? {key:'warn', cls:'warn', txt:'⚠ 注意あり'} : {key:'ok', cls:'ok', txt:'✓ 正常終了'};
  };
  const states = ops.runs.map(stateOf);
  const nErr = states.filter(s => s.key === 'err').length;
  const nWarn = states.filter(s => s.key === 'warn').length;

  const head = !ops.runs.length ? {cls:'ok', mark:'—', text:'まだ記録がありません'}
    : nErr ? {cls:'bad', mark:'✕', text:`直近${ops.runs.length}件のうち ${nErr}件でエラーが出ています`}
    : nWarn ? {cls:'warn', mark:'⚠', text:`直近${ops.runs.length}件のうち ${nWarn}件に注意があります`}
    : {cls:'ok', mark:'✓', text:`直近${ops.runs.length}件はすべて正常に終わっています`};

  const runs = ops.runs.map((r, i) => {
    const st = states[i];
    const evs = ops.events.filter(e => e.run_id === r.id);
    const dur = durText(r.started_at, r.finished_at);
    const acts = evs.map(e => {
      const m = e.channel ? chMeta(e.channel) : null;
      const tag = m ? `<span class="cq" style="background:${m.tint}" title="${esc(m.name)}">${m.icon}</span>`
                    : `<span class="cq">共通</span>`;
      const sev = e.severity === 'error' ? 'bad' : (e.severity === 'warn' ? 'warn' : '');
      const mk = e.severity === 'error' ? '✕' : (e.severity === 'warn' ? '⚠' : '✓');
      return `<li class="${sev}">${tag}<span class="mk">${mk}</span><span class="tm">${esc(fmtTime(e.at))}</span><span class="bd">${esc(e.body)}</span></li>`;
    }).join('');
    /* 異常があったものだけ最初から開いておく（見てほしいものを隠さない） */
    const open = st.key === 'err' || st.key === 'warn' || st.key === 'run';
    return `<details class="run ${st.cls === 'run' ? 'run-' : st.cls}"${open ? ' open' : ''}>
      <summary class="runhead"><span class="tri">▸</span>
        <span class="when">${esc(fmtDT(r.started_at) || '—')}</span>
        <span class="kind">${esc(RUN_KIND_JA[r.kind] || r.kind)}</span>
        ${dur ? `<span class="dur">所要 ${esc(dur)}</span>` : ''}
        <span class="stat ${st.cls}">${st.txt}</span></summary>
      <div class="runbody">
        ${r.summary ? `<div class="runsummary">${esc(r.summary)}</div>` : ''}
        ${laneChips(r.lanes)}
        ${evs.length ? `<ul class="acts">${acts}</ul>`
          : `<div class="dhint">この回の細かい記録は残っていません</div>`}
      </div></details>`;
  }).join('');

  el.innerHTML = `
    <div class="pagehead">
      <div class="eyebrow">稼働</div>
      <h1>🌙 自動で動いた記録</h1>
      <p>夜間の制作やXの投稿など、自動で走った仕事の結果です。行を開くと中身が見られます。</p>
    </div>
    <div class="gfhead ${head.cls}"><span class="mk">${head.mark}</span><span>${head.text}</span></div>
    <div class="card now">
      <span class="pulse ${running ? 'live' : ''}"></span>
      <div><b>${running ? `いま実行中: ${esc(RUN_KIND_JA[running.kind] || running.kind)}（${esc(fmtDT(running.started_at) || '')} 開始）`
        : 'いま動いているものはありません'}</b>
        <div style="font-size:var(--fs-xs);color:var(--ink-2)">動画の夜間制作は毎日 2:00（パソコンが起動しているときだけ動きます）</div></div>
    </div>
    ${ops.runs.length ? `<div class="runs">${runs}</div>`
      : `<div class="noitem">まだ記録がありません</div>`}`;
}

/* ══ ⑤ システム ════════════════════════════════════════════════ */
/* system_docs（M029）の3件を描くだけの画面。中身の正本はリポジトリ側にあり、ここは
   同期スクリプト（dashboard/sync-system-docs.py）が入れた写しを表示する。
   JSON は「画面が描きやすい形」で入っている前提だが、壊れていても画面ごと落とさない
   （parse に失敗した文書だけ「読めません」に差し替える）。 */
const RUNNER_CLS = {routine:'routine', task:'task', poller:'poller'};
// 表の領域分け見出し。このダッシュボードの主目的（YouTube制作）を先頭にする
const CHANNEL_ORDER = ['youtube', 'x', 'other'];
const CHANNEL_LABEL = {youtube: 'YouTube制作', x: 'X運用', other: 'その他・共通基盤'};

/* 時間軸の並べ方: entries は既にバックエンド側で時系列ソート済みなので、その順番に
   ①②③…と採番するだけ（軸の丸バッジと表の1列目が同じ番号になる）。
   分類（YouTube/X/その他）は色つきの小さなタグではなく、帯（背景色の帯）を分類ごとに
   分けて縦位置そのもので表す（オーナー指摘: タグは分かりにくい・8/18）。帯の中では
   1件=1段にして名前同士が重ならないようにする（重なり回避のための間引きはしない）。
   帯は表と同じ並び（YouTube制作→X運用→その他）を上から出す。 */
const TL_HOUR_TICKS = Array.from({length: 25}, (_, i) => i);   // 0時〜24時の1時間刻み
const TL_ROW_H = 28;
const TL_PIN = 22;
const TL_BAND_PAD = 8;
const TL_BAND_GAP = 10;
const TL_ALWAYS_H = 26;   // 常時稼働（5分間隔など）の黒帯1本ぶんの高さ

function timeToMinutes(hhmm){
  const m = /^(\d{1,2}):(\d{2})$/.exec(String(hhmm || '').trim());
  return m ? (+m[1]) * 60 + (+m[2]) : null;
}

function buildTimelinePins(entries, numOf){
  const raw = [];
  const alwaysOnByChannel = {};   // 特定の時刻を持たない常時稼働タスク（例: 5分間隔ポーラー）
  entries.forEach(e => {
    const channel = CHANNEL_ORDER.includes(e.channel) ? e.channel : 'other';
    if (e.time) {
      // parse_cron は同一cronが複数時刻にマッチすると "06:00 / 06:30" のように束ねて返す
      String(e.time).split('/').forEach(part => {
        const min = timeToMinutes(part);
        if (min != null) raw.push({e, min, num: numOf.get(e), channel});
      });
    } else if (e.interval_min) {
      (alwaysOnByChannel[channel] = alwaysOnByChannel[channel] || []).push({e, num: numOf.get(e)});
    }
  });
  raw.sort((a, b) => a.min - b.min);

  // 段は帯（チャンネル）ごとに独立して振る＝同じ帯の中だけ重なりを避ければよい
  const laneCounters = {};
  raw.forEach(p => {
    p.lane = laneCounters[p.channel] || 0;
    laneCounters[p.channel] = p.lane + 1;
  });

  // 帯は軸線に近い側（下）から積む。読み順を表と同じ「YouTube→X→その他」を上にしたいので
  // 逆順（その他→X→YouTube）に積む。該当タスクが無い帯は作らない（高さ0で場所を取らない）。
  // 常時稼働タスクがある帯は、通常のピンの上にさらに黒帯ぶんの高さを足す
  // （bottom基準: pad→通常ピン→隙間→常時稼働の黒帯→pad の順に積む）。
  const bandLayout = {};
  let cursor = 0;
  [...CHANNEL_ORDER].reverse().forEach(ch => {
    const laneCount = laneCounters[ch] || 0;
    const always = alwaysOnByChannel[ch] || [];
    if (!laneCount && !always.length) return;
    const pinsInnerH = laneCount > 0 ? (laneCount - 1) * TL_ROW_H + TL_PIN : 0;
    const alwaysInnerH = always.length ? always.length * TL_ALWAYS_H + (always.length - 1) * 4 : 0;
    const midGap = (laneCount > 0 && always.length) ? TL_BAND_PAD : 0;
    const innerH = pinsInnerH + midGap + alwaysInnerH;
    const bandH = innerH + TL_BAND_PAD * 2;
    bandLayout[ch] = {
      bottom: cursor, height: bandH,
      innerBottom: cursor + TL_BAND_PAD,
      alwaysBottom: cursor + TL_BAND_PAD + pinsInnerH + midGap,
    };
    cursor += bandH + TL_BAND_GAP;
  });
  const totalHeight = Math.max(TL_PIN, cursor - TL_BAND_GAP);

  return {pins: raw, alwaysOnByChannel, bandLayout, totalHeight};
}

function parseDoc(doc){
  if (!doc) return null;
  try { return JSON.parse(doc.content); } catch { return null; }
}
/* 中身がまだ入っていないときの表示。理由（同期の仕組み）は画面に出さない
   （オーナー指定 2026-08-20: ダッシュボードには裏側の話を書かない） */

/* 外部リンク集。スマホから GitHub の課題ボード等へ1タップで飛ぶための入口

function glossaryCard(doc){

    ${d.groups.map(g => `<div class="glgroup">

function scheduleCard(doc){
  const d = parseDoc(doc);
  if (!d || !Array.isArray(d.entries)) return notSynced('スケジュール');

  const runnerLabel = {};
  (d.runners || []).forEach(r => { runnerLabel[r.key] = r.label; });

  // 番号は entries の並び順（=バックエンドで時系列ソート済み）にそのまま採番する
  const numOf = new Map();
  d.entries.forEach((e, i) => numOf.set(e, i + 1));

  const {pins, alwaysOnByChannel, bandLayout, totalHeight} = buildTimelinePins(d.entries, numOf);

  const pinsHtml = pins.map(p => {
    const cls = RUNNER_CLS[p.e.runner] || 'routine';
    const off = p.e.enabled === false;
    const title = p.e.title_ja || p.e.id;
    const leftPct = p.min / 1440 * 100;
    const flip = leftPct > 50;   // 時刻が後半(50%超)は名前を左へ伸ばし、右端でのはみ出しを防ぐ
    const L = bandLayout[p.channel];
    const bottom = (L ? L.innerBottom : 0) + p.lane * TL_ROW_H;
    const tip = `${p.e.when || ''}　${title}`;
    const badge = `<span class="tlpin ${cls}" title="${esc(tip)}">${p.num}</span>`;
    const label = `<span class="tlname">${esc(title)}</span>`;
    const pos = flip ? `right:calc(${(100 - leftPct).toFixed(2)}% - 11px)` : `left:calc(${leftPct.toFixed(2)}% - 11px)`;
    const body = flip ? label + badge : badge + label;
    return `<span class="tlrow${off ? ' off' : ''}" style="${pos}; bottom:${bottom}px">${body}</span>
      <i class="tlstem${off ? ' off' : ''}" style="left:${leftPct.toFixed(2)}%; height:${bottom}px"></i>`;
  }).join('');

  // 分類は縦位置（レーン）と区切り線だけで表す。背景色は使わない（色は実行主体のため・
  // オーナー要望 8/19）。ラベルは左に固定表示するカード（横スクロールしても常に見える・8/18）。
  const chBandsHtml = CHANNEL_ORDER.map(ch => {
    const L = bandLayout[ch];
    return L ? `<div class="tlchband ${ch}" style="bottom:${L.bottom}px; height:${L.height}px"></div>` : '';
  }).join('');

  const sidebarHtml = CHANNEL_ORDER.map(ch => {
    const L = bandLayout[ch];
    if (!L) return '';
    const count = d.entries.filter(e => (CHANNEL_ORDER.includes(e.channel) ? e.channel : 'other') === ch).length;
    return `<div class="tlcard ${ch}" style="bottom:${L.bottom}px; height:${L.height}px">
      <span class="tlcardtitle">${esc(CHANNEL_LABEL[ch] || ch)}</span>
      <span class="tlcardcount">${count}件</span></div>`;
  }).join('');

  const ticksHtml = TL_HOUR_TICKS.map(h =>
    `<div class="tltick" style="left:${(h / 24 * 100).toFixed(2)}%"><i></i><b>${h}</b></div>`).join('');

  // 常時稼働（5分間隔など）は特定の時刻を持たないので点は打たず、該当する帯の一番上に
  // 黒帯として全幅で出す（オーナー指摘: 独立したバナーではなく帯の中に置きたい・8/18）。
  const alwaysHtml = CHANNEL_ORDER.map(ch => {
    const L = bandLayout[ch];
    const list = alwaysOnByChannel[ch] || [];
    if (!L || !list.length) return '';
    return list.map((a, i) => {
      const title = a.e.title_ja || a.e.id;
      const bottom = L.alwaysBottom + i * (TL_ALWAYS_H + 4);
      const tip = `${a.e.when || ''}　${title}`;
      const cls = RUNNER_CLS[a.e.runner] || 'poller';   /* 枠線と丸バッジを実行主体の色に揃える */
      return `<div class="tlalways ${cls}" style="bottom:${bottom}px; height:${TL_ALWAYS_H}px">
        <span class="tlpin ${cls}" title="${esc(tip)}">${a.num}</span>

/* ══ gen-farm のいま（システムタブの先頭・オーナー要望 2026-08-19）══════════════
   「実家の生成機に何本たまっていて、いつ終わるか」を1枚で見せる。数え方は
   コマンドラインの genfarm-status（00-config/tools/genfarm-status/）と同じ:
     ・待ち行列＝まだ手元に無いジョブ（materialized_at が空／発注中・実行中・生成済み）
     ・完了見込み＝1件ずつ順に処理される前提で、残り時間を積み上げた概算
     ・「生成済み・未回収」が10分以上続いていたら詰まりを疑う（2026-08-19 の障害と同じ形）
   見込み時間は、発注時に記録した見込み秒（estimated_sec）が近い実測で較正する。
   実測が無い種類は既定値（H3映像 223秒／FLUX画像 76秒）に落とす。 */
const GF_MAX_SANE_SEC = 6 * 3600;
function gfEstimator(recent){
  const byKind = {}, calib = {};
  (recent || []).forEach(m => {
    const dur = (new Date(m.finished_at) - new Date(m.started_at)) / 1000;
    if (!(dur > 0 && dur < GF_MAX_SANE_SEC)) return;
    const k = m.kind || 'unknown';
    (byKind[k] = byKind[k] || []).push(dur);
    const e = Number(m.estimated_sec);
    if (e > 0) (calib[k] = calib[k] || []).push([e, dur]);
  });
  const mean = a => a.reduce((s, v) => s + v, 0) / a.length;
  return (kind, hint) => {
    const pairs = calib[kind] || [];
    if (hint > 0 && pairs.length) {
      const same = pairs.filter(p => Math.abs(p[0] - hint) <= hint * 0.10).map(p => p[1]);
      if (same.length) return mean(same);
      const near = pairs.reduce((b, p) => Math.abs(p[0] - hint) < Math.abs(b[0] - hint) ? p : b);
      return mean(pairs.filter(p => p[0] === near[0]).map(p => p[1])) * hint / near[0];
    }
    if ((byKind[kind] || []).length) return mean(byKind[kind]);
    return hint > 0 ? hint : (GF_FALLBACK_SEC[kind] || 200);
  };
}
function gfState(gf){
  const est = gfEstimator(gf.recent), now = Date.now();
  let cursor = 0;
  const jobs = (gf.open || []).map(r => {
    const kind = r.kind || 'unknown';
    const hint = Number(r.estimated_sec) || 0;
    const e = est(kind, hint);
    /* 実行中なのに開始時刻が記録されていないジョブがある（発注直後に走り出した場合）。
       その場合は発注時刻からの経過で代用する＝「—経過」と出さない */
    const from = r.started_at || (r.status === 'in_flight' ? r.submitted_at : null);
    const elapsed = from ? (now - new Date(from)) / 1000 : null;
    const remaining = r.status === 'done' ? 0
      : (r.status === 'in_flight' && elapsed != null) ? Math.max(0, e - elapsed) : e;
    cursor += remaining;
    return { r, kind, status: r.status, est: e, elapsed, remaining,
             age: (now - new Date(r.submitted_at)) / 1000,
             eta: r.status === 'done' ? null : now + cursor * 1000 };
  });
  return { jobs, now,
    running: jobs.filter(j => j.status === 'in_flight'),
    waiting: jobs.filter(j => j.status === 'submitting'),
    stale:   jobs.filter(j => j.status === 'done'),
    allDoneAt: cursor > 0 ? now + cursor * 1000 : null };
}
/* 秒 → 「3分20秒」「1時間5分」。1分未満は秒だけ（進行中の経過が動いて見える） */
function gfDur(sec){
  if (sec == null || !isFinite(sec)) return '—';
  const s = Math.max(0, Math.round(sec));
  if (s < 60) return `${s}秒`;
  const m = Math.round(s / 60);
  return m < 60 ? `${m}分` : `${Math.floor(m / 60)}時間${m % 60}分`;
}
const gfClock = ms => ms == null ? '—' : fmtTime(new Date(ms).toISOString());
function gfWhat(j){
  const ep = j.r.episode_seq ? `${j.r.episode_seq} ` : '';
  const what = j.r.artifact_key || j.r.purpose || '';
  return `${ep}${GF_KIND_LABEL[j.kind] || j.kind}${what ? `（${what}）` : ''}`;
}

function genfarmCard(gf){
  const s = gfState(gf);
  const stuck = s.stale.filter(j => j.age > GF_STALE_DONE_MIN * 60);
  /* いちばん大きく出す1行。詰まりの疑い＞制作中＞順番待ち＞空き の順で強い方を出す */
  const head = stuck.length
    ? {cls:'bad', mark:'⚠', text:`生成は終わっているのに手元に降りてきていません（${stuck.length}件）`}
    : s.running.length
      ? {cls:'run', mark:'●', text:`制作中 — ${esc(gfWhat(s.running[0]))}`}
      : s.waiting.length
        ? {cls:'warn', mark:'●', text:`${s.waiting.length}件が順番待ち（まだ動き出していません）`}
        : {cls:'ok', mark:'✓', text:'空いています（待ちはありません）'};

  /* 見込みより長く走っているとき「残り0秒」を出さない（終わりそうに見えてしまうため） */
  const overdue = s.running.some(j => j.remaining <= 0);
  const tiles = [
    {k:'実行中', v:s.running.length, s:s.running.length ? gfDur(s.running[0].elapsed) + '経過' : '—'},
    {k:'順番待ち', v:s.waiting.length,
     s:s.allDoneAt ? `全部終わるのは ${gfClock(s.allDoneAt)} ごろ`
       : overdue ? '見込み時間を超えて実行中' : '—'},
    {k:'生成済み・未回収', v:s.stale.length,
     s:stuck.length ? `${gfDur(Math.max(...stuck.map(j => j.age)))}以上そのまま` : (s.stale.length ? '回収待ち' : '—')}
  ].map(t => `<div class="gfm"><div class="k">${esc(t.k)}</div><div class="v">${t.v}</div>
      <div class="s">${esc(t.s)}</div></div>`).join('');

  const rows = s.jobs.slice(0, 10).map(j => `<div class="gfjob is-${esc(j.status)}">
      <span class="st">${esc(GF_STATUS_LABEL[j.status] || j.status)}</span>
      <span class="wt">${esc(gfWhat(j))}</span>
      <span class="tm">${j.status === 'in_flight'
        ? `${gfDur(j.elapsed)}経過・${j.remaining > 0 ? `残り${gfDur(j.remaining)}` : '見込み超過'}`
        : j.status === 'done' ? `${gfDur(j.age)}前に完成` : `${gfClock(j.eta)}ごろ`}</span>
    </div>`).join('');
  const more = s.jobs.length > 10 ? `<div class="gfmore">ほか ${s.jobs.length - 10}件</div>` : '';

  return `<section class="card gfcard">
    <h2>🖥 gen-farm（実家の生成機）のいま</h2>
    <div class="gfhead ${head.cls}"><span class="mk">${head.mark}</span><span>${head.text}</span></div>
    <div class="gfmetrics">${tiles}</div>
    ${s.jobs.length ? `<div class="gfjobs">${rows}${more}</div>`
      : `<div class="noitem">待っている生成はありません</div>`}
    ${stuck.length ? `<div class="note"><span>⚠</span><div>生成機の中では出来上がっているのに、
      手元のパソコンへ降りてきていません。<b>その動画の生成スクリプトを実行し直す</b>と回収されます
      （2026-08-19 に同じ形の詰まりが起きています）。</div></div>` : ''}
    <p class="gfnote">終わる時刻は「1件ずつ順番に処理される」前提の概算です。${
      gf.at ? `${esc(gfClock(gf.at))} 時点・この画面を開いている間は1分ごとに自動更新` : ''}</p>
  </section>`;
}
