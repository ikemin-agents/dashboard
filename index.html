  document.body.classList.toggle('sheetopen', tapMobile());
  /* シーン素材つきの画面では、広い画面のとき一覧の場所を一時的に譲る（#519） */
  document.querySelector('#view-detail [data-sv-secb]')?.classList.add('sheeton');
  /* スマホの1画面（#552 の続き）: 段2「書く」＝全画面の入力画面。段1（場所を選ぶ）は降り、
     止めた場面の静止画を作り、入力欄にすぐ打てるようにする（押した操作の中なので
     iPhone でもキーボードが出る）。入力画面では動画が隠れるので、直すときの時刻合わせは
     静止画をコマ送りのたびに作り直して見せる */
  if (svMobileOn()) {
    tapPickOff();
    sheet.classList.toggle('memo-on', !!tap.draft.memo);
    tapSyncMemoMode();
    tapSheetThumb();
    try { input.focus({ preventScroll: true }); input.setSelectionRange(input.value.length, input.value.length); } catch (_) {}
  }
  else if (!tapMobile()) input.focus({ preventScroll: true });
  /* スマホはシートが下からせり上がるので、動画が画面の外だと何を見て書いているのか分からない。
     シートを開いたら動画を画面の中へ入れる（オーナー指摘 2026-09-22） */
  /* 1画面の作り（#552）では動画は常に見えているので送らない（画面ごとずれる） */
  else if (!svMobileOn()) { try { tap.ctl.box.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (_) {} }
  svPaintBar();
}
/* スマホの入力画面の「全体へのメモとして書く」（#552 の続き。前回の「全体へのメモにする」の
   置き換え）。押すたびに「指摘」と「全体へのメモに足す」を切り替える。打った文はそのまま残る */
function tapToggleMemo(){
  if (!tap || !tap.draft || tap.draft.editId || tap.draft.memo === 'edit') return;
  tap.draft.memo = tap.draft.memo ? null : 'append';
  tapSyncMemoMode();
  tapSheetThumb();
  const input = tapEl('[data-snote]');
  try { input.focus({ preventScroll: true }); } catch (_) {}
}
function tapCloseSheet(){
  const sheet = tapEl('[data-sheet]');
  if (sheet) { sheet.hidden = true; sheet.classList.remove('float'); sheet.classList.remove('memo-on'); }
  const ae = document.activeElement;
  if (ae && sheet && sheet.contains(ae)) { try { ae.blur(); } catch (_) {} }   /* キーボードを下ろす */
  document.body.classList.remove('sheetopen');
  document.querySelector('#view-detail [data-sv-secb]')?.classList.remove('sheeton');
  tap.draft = null;
  tap.ctl.hidePin();
  tapPickOff();                    /* シートを閉じたら「場所を指すモード」も降りる */
  svPaintBar();
}

/* シートの中の −0.5s／+0.5s（スマホの完成レビュー・オーナー指摘 2026-09-22）。
   動画をその分だけ動かし、**足す指摘の時刻もいっしょに動かす**（表示は 0:47.0 の形）。
   直している最中（keep あり）は元の指摘の時刻を保つので、動くのは動画だけ */
function tapNudge(d){
  if (!tap || !tap.draft || !tap.ctl) return;
  const v = tap.ctl.video;
  v.pause();
  const t = Math.min(tap.ctl.dur() || 0, Math.max(0, v.currentTime + d));
  try { v.currentTime = t; } catch (_) {}
  tap.ctl.paint();
  if (tap.draft.keep) return;                 /* 直している最中は時刻を動かさない */
  tap.draft.t = Math.round(t * 100) / 100;
  const sc = tapScene(tap.draft.t);
  tapEl('[data-stime]').textContent = fmtT(tap.draft.t);
  tapEl('[data-stime1]').textContent = fmtT1(tap.draft.t);
  tapEl('[data-sscene]').textContent =
    tapWhere(normKind(tap.draft.kind), tap.draft.t, sc ? sc.n : null, sc ? sc.title : null);
}

/* ── 場所を指すモード（オーナー指示 2026-09-20）──────────────────────────
   ふだん動画の上を押すと再生／一時停止なので、場所つきの指摘は**入口のボタンから始める**。
   押すと動画を止めてこのモードに入り、動画の上に帯を出す（ふだんは案内文を出さない）。
   次のタップ1回でその場所にピンが立ち、入力シートが開く。「足す」「やめる」「Esc」で降りる。 */
const tapPicking = () => !!(tap && tap.picking);
function tapSyncPick(){
  if (!tap || !tap.ctl) return;
  const on = !!tap.picking;
  if (tap.ctl.hitEl) tap.ctl.hitEl.classList.toggle('on', on);
  const band = tap.ctl.el.querySelector('[data-pickband]');
  if (band) band.hidden = !on;
  /* 「場所を指す」は入口の行とシートの中の2か所にあるので、両方の見た目を揃える */
  if (tap.panel) tap.panel.querySelectorAll('[data-tapact="add-pick"]')
    .forEach(btn => btn.setAttribute('aria-pressed', String(on)));
  /* スマホの1画面では、これが段1「場所を選ぶ」（タブと下の帯を案内の1行に替える・#552 の続き） */
  document.body.classList.toggle('sv-pick1', on && svMobileOn());
  svPaintBar();
}
function tapPickOn(){
  if (!tap || tap.mode !== 'edit') return;
  if (tap.items.length >= NOTE_LIM.items) { toast(`指摘は1回に${NOTE_LIM.items}件までです`); return; }
  tap.ctl.video.pause();
  tap.picking = true;
  tapSyncPick();
  /* スマホは入口のボタンが動画より下にある。動画が画面の外だと「どこをタップするのか」が
     見えないので、動画が見える位置まで送る（1画面の作り・#552 では常に見えているので送らない） */
  if (!svMobileOn()) { try { tap.ctl.box.scrollIntoView({ block: 'center', behavior: 'smooth' }); } catch (_) {} }
}
function tapPickOff(){
  if (!tap || !tap.picking) return;
  tap.picking = false;
  tapSyncPick();
}

/* 入口のボタン（場所なし）／場所を指すモードのタップからの下書き開始 */
function tapStart(kind, p){
  if (!tap || tap.mode !== 'edit') return;
  if (tap.items.length >= NOTE_LIM.items && !(tap.draft && tap.draft.editId)) {
    toast(`指摘は1回に${NOTE_LIM.items}件までです`); return;
  }
  if (kind !== 'picture') tapPickOff();       /* 「いまの画面」に切り替えたら場所指しは降りる */
  tap.ctl.video.pause();
  /* 時刻は**シートを開いたこの瞬間**で固定する。開いたまま再生を進めても、足すのはここの時刻 */
  const t = Math.round(tap.ctl.video.currentTime * 100) / 100;
  const keep = tap.draft || {};
  tap.draft = { t, kind, x: p ? p.x : null, y: p ? p.y : null,
                tag: null, note: '', editId: keep.editId || null,
                /* 直している最中なら、元の指摘の場面・時刻・案はそのまま持ち越す（#523 のレビュー指摘2） */
                keep: keep.keep || null };
  if (p) tap.ctl.showPin(p.x, p.y); else tap.ctl.hidePin();
  tapOpenSheet();
}
function tapAdd(){
  if (!tap || !tap.draft) return;
  if (tap.draft.memo) { tapSaveMemo(); return; }       /* スマホの「全体へのメモとして書く」 */
  const mob = svMobileOn(), editing = !!tap.draft.editId;
  const input = tapEl('[data-snote]');
  const sp = tapSplit(input.value);
  if (!sp.tag && !sp.note) return;
  const d = tap.draft, kind = normKind(d.kind);
  /* **直しているときは元の指摘の場面・時刻・案を保つ**（#523 のレビュー指摘2）。
     いまの目録から引き直すと、別の案を見ている最中に直しただけで中身が書き換わってしまう */
  const k = d.keep || null;
  const sc = k ? null : tapScene(d.t);
  const rec = {
    id: d.editId || tap.nextId++,
    t: Math.round((k ? k.t : d.t) * 100) / 100,
    kind,
    scene: k ? (k.scene == null ? null : Number(k.scene)) : (sc ? sc.n : null),
    scene_title: k ? (k.scene_title || null) : (sc ? (sc.title || null) : null),
    pin: kind === 'picture' && d.x != null ? { x: Math.round(d.x * 1000) / 1000, y: Math.round(d.y * 1000) / 1000 } : null,
    tag: sp.tag ? sp.tag.slice(0, NOTE_LIM.tag) : null,
    note: sp.note ? sp.note.slice(0, NOTE_LIM.note) : null,
    /* そのとき見ていた案（#523）。案のタブが無ければ null のまま */
    variant: k ? (k.variant || null) : (tap.variant || null),
    /* 「いまの画面」でも静止画は撮る（赤丸は付けない）——どの場面のことかを一覧で見分けるため */
    thumb: tap.ctl.thumb(kind === 'picture' ? d.x : null, d.y)
  };
  const at = tap.items.findIndex(r => r.id === rec.id);
  if (at >= 0) tap.items[at] = rec; else tap.items.push(rec);
  tap.items.sort((a, b) => a.t - b.t);
  tapCloseSheet();
  tapPaint();
  /* スマホは入力画面が閉じると何が起きたか見えないので、まだ送っていないことを短く言う */
  if (mob) toast(editing ? '指摘を直しました' + tapNotSent()
                         : '指摘を足しました' + tapNotSent());
}
function tapGoto(t, pin){
  if (!tap) return;
  tap.ctl.video.pause();
  try { tap.ctl.video.currentTime = t; } catch (_) {}
  if (pin) tap.ctl.showPin(pin.x, pin.y); else tap.ctl.hidePin();
  tap.ctl.paint();
}
function tapEdit(id){
  const r = tap.items.find(x => x.id === id);
  if (!r) return;
  tapGoto(r.t, r.pin);
  tap.draft = { t:r.t, kind:normKind(r.kind), x:r.pin ? r.pin.x : null, y:r.pin ? r.pin.y : null,
                tag:r.tag, note:r.note, editId:r.id,
                /* 直しても変えないもの（#523 のレビュー指摘2） */
                keep: { t:r.t, scene:r.scene, scene_title:r.scene_title, variant:r.variant || null } };
  tapOpenSheet();
}

/* 一覧・件数・目盛りの印・下端のバーを、いまの指摘の数に合わせて描き直す */
function tapPaint(){
  if (!tap || !tap.panel) return;
  const list = tapEl('[data-nlist]');
  list.textContent = '';
  tapEl('[data-ncount]').textContent = tap.items.length + '件';
  if (!tap.items.length) {
    const e = document.createElement('div');
    e.className = 'tpempty';
    e.textContent = 'まだ指摘はありません。足した指摘がここに並びます';
    list.appendChild(e);
  }
  for (const r of tap.items) {
    const row = document.createElement('div');
    row.className = 'nitem';
    row.dataset.nid = String(r.id);
    if (r.thumb) {
      const img = document.createElement('img');
      img.className = 'th'; img.src = r.thumb; img.alt = fmtT(r.t) + ' の場面';
      row.appendChild(img);
    } else {
      const nt = document.createElement('div');
      nt.className = 'noth';
      nt.textContent = '画なし';
      row.appendChild(nt);
    }
    const meta = document.createElement('div');
    meta.className = 'meta';
    const l1 = document.createElement('div');
    l1.className = 'l1';
    const tt = document.createElement('span'); tt.className = 'tt'; tt.textContent = fmtT(r.t);
    l1.appendChild(tt);
    /* 一覧は「場所を指していない指摘」に印を1つ付けるだけにする（シートの長い札は使わない） */
    if (normKind(r.kind) !== 'picture') {
      const k = document.createElement('span'); k.className = 'sc'; k.textContent = '▣ 画面全体';
      l1.appendChild(k);
    }
    const where = tapWhere('picture', r.t, r.scene, r.scene_title);
    if (where) { const s = document.createElement('span'); s.className = 'sc'; s.textContent = where; l1.appendChild(s); }
    /* どの案を見て書いた指摘かの小さな印（案のタブがあるときだけ・#523） */
    const vl = svVariantLabel(r.variant);
    if (vl) { const s = document.createElement('span'); s.className = 'sc'; s.textContent = vl; l1.appendChild(s); }
    if (r.tag) { const g = document.createElement('span'); g.className = 'gbadge fix'; g.textContent = r.tag; l1.appendChild(g); }
    meta.appendChild(l1);
    if (r.note) { const n = document.createElement('div'); n.className = 'note'; n.textContent = r.note; meta.appendChild(n); }
    row.appendChild(meta);
    const acts = document.createElement('div');
    acts.className = 'rowacts';
    for (const [lbl, act] of [['直す', 'edit'], ['消す', 'del']]) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'btn sm'; b.textContent = lbl;
      b.dataset.tapact = act; b.dataset.nid = String(r.id);
      acts.appendChild(b);
    }
    row.appendChild(acts);
    list.appendChild(row);
  }
  tap.ctl.marks(tap.items);
  tapDraftSave();
  tapPaintMemo();
  tapSyncBar();
  if (sv) svPaintNotesCur();       /* スマホの指摘のタブ: いまのシーンの指摘に印（#552） */
}
/* 下端のバー: 件数つきの「修正を依頼」と、指摘が無いときだけ主役になる「承認」 */
function tapSyncBar(){
  svPaintBar();
  const bar = tap && tap.panel && tap.panel.closest('.decide');
  if (!bar) return;
  const n = tap.items.length, filled = n > 0 || !!tapMemoVal();
  const req = bar.querySelector('.dbar [data-act="comment"]');
  const apv = bar.querySelector('.dbar [data-act="approve-quick"]');
  if (req && !req.dataset.lbl) { req.textContent = actWords(curItem).commentN(n); req.classList.toggle('on', filled); }
  /* スマホの1画面（#552 の続き）: 何も書いていないときは押せない見た目。押せば今までどおり
     案内が出る（誤タップよけの動きは変えない）ので、disabled にはしない */
  if (req) {
    if (svMobileOn() && !filled) req.setAttribute('aria-disabled', 'true');
    else req.removeAttribute('aria-disabled');
  }
  if (apv) apv.classList.toggle('primary', n === 0);
}
function tapMark(id){
  tapEl('[data-nlist]').querySelectorAll('.nitem').forEach(r =>
    r.classList.toggle('cur', r.dataset.nid === String(id)));
}

/* ── 組み立て（素材が届いてから呼ばれる）──────────────────────────────── */
function armTap(node, files, mode){
  const el = node.querySelector('[data-tapvid]');
  if (!el) return null;
  const gate = node.dataset.gate || 'final';
  const ctl = armVideoBar(el);
  if (mode !== 'edit') return ctl;             /* 見るだけの場所は操作バーまで */
  const it = curItem;
  const panel = document.querySelector('#view-detail .decide [data-tapbox]');
  if (!it || !panel) return ctl;
  const box = panel.closest('[data-wbox]');
  const rev = submittedRevOf(it.id, gate);

  tap = { mode:'edit', vid: it.id, gate, rev: rev == null ? 1 : rev,
          key: it.id + '|' + gate + '|' + (rev == null ? 1 : rev),
          asset: el.dataset.vname || null, items: [], nextId: 1, draft: null,
          variant: null, picking: false, tl: null, ctl, panel, box };

  /* 時刻表は動画の尺と突き合わせてから使う。読めるようになるのはメタデータが届いてから */
  const cand = tapTimeline(files, el.dataset.vname);
  const useTL = () => {
    if (!cand) return;
    const d = ctl.dur();
    if (cand.duration != null && d && Math.abs(cand.duration - d) > TL_TOL) { tap.tl = null; return; }
    tap.tl = cand;
  };
  if (ctl.video.readyState >= 1) useTL(); else ctl.onmeta = useTL;

  /* 自由記述の一式を引っ込めてタップ入力に差し替える（mp4 が無ければここへ来ないので、
     そのときは段1の自由記述のまま残る）。素材つきの画面は最初からこの形で描いてある（#637）ので、何も変わらない */
  box.querySelectorAll('[data-freefix]').forEach(n => { if (!n.hidden) n.hidden = true; });
  if (!box.classList.contains('tapon')) box.classList.add('tapon');
  if (panel.hidden) panel.hidden = false;

  /* 動画のタップ。**受けるのは2つの場面だけ**で、それ以外は armVideoBar の再生／一時停止に回る:
       ①「場所を指すモード」のあいだ → その場所にピンを立ててシートを開く
       ②場所つきのシートが開いているあいだ → ピンをそこへ移す（時刻は開いた時点のまま）
     「いまの画面にコメント」のシートが開いているあいだは受けない＝タップは再生／一時停止のまま */
  ctl.onHit = e => {
    if (!tap) return false;
    const onPicSheet = !!(tap.draft && normKind(tap.draft.kind) === 'picture');
    /* スマホの1画面（#552）: 吹き出しで開いた入力欄（いまの画面）のまま絵を触ると、
       その場所に印を付けて「場所つき」の指摘に替える。触らなければ「いまの画面」のまま */
    const onWholeSheet = !!(tap.draft && !onPicSheet && svMobileOn());
    if (!tap.picking && !onPicSheet && !onWholeSheet) return false;
    const p = ctl.point(e);
    if (!p) return true;                       /* 余白（object-fit の黒帯）は無視（再生もしない） */
    if (onPicSheet) { tap.draft.x = p.x; tap.draft.y = p.y; ctl.showPin(p.x, p.y); }
    else if (onWholeSheet) {
      tap.draft.kind = 'picture'; tap.draft.x = p.x; tap.draft.y = p.y;
      ctl.showPin(p.x, p.y);
      tapSheetWhere();
    }
    else tapStart('picture', p);
    return true;
  };
  el.querySelector('[data-pickoff]')?.addEventListener('click', e => {
    e.stopPropagation();
    if (tap && tap.draft) tapCloseSheet(); else tapPickOff();
  });
  let dragging = false;
  ctl.pin.addEventListener('pointerdown', e => {
    dragging = true; ctl.pin.classList.add('drag');
    ctl.pin.setPointerCapture(e.pointerId); e.stopPropagation(); e.preventDefault();
  });
  ctl.pin.addEventListener('pointermove', e => {
    if (!dragging || !tap.draft) return;
    const p = ctl.point(e);
    if (!p) return;
    tap.draft.x = p.x; tap.draft.y = p.y; ctl.showPin(p.x, p.y);
  });
  ctl.pin.addEventListener('pointerup', e => {
    dragging = false; ctl.pin.classList.remove('drag');
    try { ctl.pin.releasePointerCapture(e.pointerId); } catch (_) {}
    e.stopPropagation();
  });
  ctl.pin.addEventListener('click', e => e.stopPropagation());

  /* 右列（押す先はすべてこの中なので、引き当ては1か所にまとめる） */
  panel.addEventListener('click', e => {
    const b = e.target.closest('[data-tapact]');
    if (b) {
      const a = b.dataset.tapact;
      if (a === 'add-pick')       { if (tap.picking) tapPickOff(); else tapPickOn(); }
      else if (a === 'add-whole') tapStart('whole', null);
      else if (a === 'add')       tapAdd();
      else if (a === 'nudge-back') tapNudge(-0.5);
      else if (a === 'nudge-fwd')  tapNudge(0.5);
      else if (a === 'cancel')    tapCloseSheet();
      else if (a === 'memo-toggle') tapToggleMemo();
      else if (a === 'memo-edit') tapOpenMemo();
      else if (a === 'edit')      { e.stopPropagation(); tapEdit(Number(b.dataset.nid)); }
      else if (a === 'del') {
        e.stopPropagation();
        const id = Number(b.dataset.nid);
        tap.items = tap.items.filter(r => r.id !== id);
        if (tap.draft && tap.draft.editId === id) tapCloseSheet();
        tapPaint();
      }
      return;
    }
    const row = e.target.closest('.nitem');
    if (row) {
      const r = tap.items.find(x => x.id === Number(row.dataset.nid));
      if (r) { tapGoto(r.t, r.pin); tapMark(r.id); }
    }
  });
  panel.addEventListener('input', e => {
    if (e.target.matches('[data-snote]')) tapSyncTags();
    if (e.target.matches('[data-memo]'))  { tapDraftSave(); tapPaintMemo(); tapSyncBar(); }
  });
  /* スマホの入力画面では動画が隠れているので、コマ送り・「直す」で時刻が動いたら
     上の小さな静止画を作り直す（#552 の続き） */
  ctl.video.addEventListener('seeked', () => {
    if (tap && tap.draft && !tap.draft.memo && svMobileOn()) tapSheetThumb();
  });

  /* 送る前に閉じた下書きを戻す（静止画は保存していないのでサムネイルは「画なし」になる） */
  const d = tapDraftLoad();
  if (d) {
    tap.items = d.items.filter(r => r && r.t != null).map(r => ({ thumb: null, ...r }))
      .sort((a, b) => a.t - b.t);         /* 足したときと同じ時刻順に並べ直してから出す */
    tap.nextId = Math.max(0, ...tap.items.map(r => Number(r.id) || 0)) + 1;
    const m = tapEl('[data-memo]');
    if (m && d.memo) m.value = d.memo;
  }
  tapSyncPick();                  /* 帯とボタンの見た目を「降りている」状態に揃えてから出す */
  tapPaint();
  return ctl;
}
/* いまこの動画・このゲートでタップ入力が動いているか（下端のバーの送り先を決める） */
const tapActive = key => !!(tap && tap.mode === 'edit' && tap.key.startsWith(String(key) + '|'));

/* ── 送る ────────────────────────────────────────────────────────────
   本文（p_body）は受け口が notes から自動で作るので渡さない。全体へのメモは notes.memo に
   入れる。版は承認と同じ「見ていた版」を添え、裏で新しい版が出ていたら断ってもらう。 */
function tapNotes(){
  const memo = tapMemoVal();
  return {
    v: 1,
    asset: tap.asset,
    memo: memo ? memo.slice(0, NOTE_LIM.memo) : null,
    items: tap.items.slice().sort((a, b) => a.t - b.t).map((r, i) => ({
      id: i + 1,                                  /* 送るときに時刻順で振り直す */
      kind: normKind(r.kind),
      t: Math.round(r.t * 100) / 100,
      scene: r.scene == null ? null : Number(r.scene),
      scene_title: r.scene_title ? String(r.scene_title).slice(0, NOTE_LIM.title) : null,
      pin: normKind(r.kind) === 'picture' && r.pin ? { x: r.pin.x, y: r.pin.y } : null,
      tag: r.tag ? String(r.tag).slice(0, NOTE_LIM.tag) : null,
      note: r.note ? String(r.note).slice(0, NOTE_LIM.note) : null,
      /* 案のタブがあるときだけ、見ていた案の印を添える（受け口は知らないキーを拒まない・#523） */
      ...(r.variant ? { variant: String(r.variant).slice(0, NOTE_LIM.tag) } : {})
    }))
  };
}
async function submitTapChanges(box, key){
  if (box.dataset.busy === '1' || !tapActive(key)) return;
  const [vidS, gate] = String(key).split('|');
  /* 1件も無くメモも空なら送らない（下端のバーの誤タップよけ・自由記述のときと同じ作法） */
  if (!tap.items.length && !tapMemoVal()) {
    /* スマホの1画面にはメモの入力欄が無い（#552 の続き）ので、入口のボタンの名前で案内する */
    wboxMsg(box, svMobileOn() ? '「＋ 指摘」から直してほしいところを書いてください'
                              : '直してほしい場所を動画から選ぶか、下のメモに書いてください', true, 'comment');
    const m = tapEl('[data-memo]');
    if (m) { m.scrollIntoView({ block: 'center' }); m.focus(); }
    return;
  }
  wboxMsg(box, '', false, 'comment');
  wboxBusy(box, true, 'comment');
  const { error } = await sb.rpc('request_changes', {
    p_video_id: Number(vidS), p_gate: gate, p_body: null,
    p_notes: tapNotes(), p_expected_revision: submittedRevOf(vidS, gate)
  });
  if (error) {
    wboxBusy(box, false, 'comment');
    /* 古い版を見ていた: 承認と同じくその場で取り直して描き直す（#506 高1と同じ理由）。
       描き直すと囲みごと作り直されて案内が消えるので、そのときだけ画面の外（トースト）で言う */
    if (error.code === 'P0003') { toast(rpcErrText(error, 'comment')); await refreshAfterWrite(false); return; }
    wboxMsg(box, rpcErrText(error, 'comment'), true, 'comment');
    return;
  }
  tapDraftDrop();
  const pilot = isPilotItem(curItem);
  tap = null;
  document.body.classList.remove('sheetopen');
  await refreshAfterWrite(false);
  toast(pilot ? '指摘を送りました' : '修正を依頼しました');
}

/* ══ 完成の承認画面（シーン素材つき・#519 段2/段3）═══════════════════════════════
   「完成」で mp4 を見ているときだけ、詳細画面を見本（dashboard/scene-mockup.html）の
   3区画の並びに差し替える。台本・絵コンテのゲート、mp4 が無い完成、ネタの仕分けは
   これまでの画面のまま。
     ① 素材・作ったもの … 台本（行の左に開始フレームのサムネ）／完成動画・参照動画／
                          いまのシーンの素材／再生の操作
     ② 私の指摘        … 入口の2ボタン／指摘の一覧／全体へのメモ（承認待ちでなければ現状の1行）
     ③ 前回までの私の指摘 … オーナー自身の指摘だけを新しい順に（押すとその時刻へ飛ぶ）
   ⚠️ 送信の仕組み（approve_gate / request_changes / reject_video の呼び出し、版のずれで
   断られたときの描き直し、没の2段階、下書き、ピンの正規化）は一切動かしていない——
   置き場所と見た目だけを変えている。 */

/* 動画と同じフォルダに置かれるシーンの素材表。内部ファイルなので素材の一覧には出さない */
const RE_MATERIALS = /^materials_v(\d+)\.json$/i;
/* 工程の帯（#570・オーナー決定 2026-09-29）。**全番組で同じ12個**を同じ順に並べ、使わない工程は
   斜線の地＋取り消し線で残す（並びは崩さない）。見本は dashboard/flow-mockup.html。
     name    … 1行目（工程の名前。用語集にある言葉は正式名で書く）
     what    … 2行目（作るもの・道具）。whatOff は進行係を通らない動画（offDispatcherItem）のとき、
               whatBlender は Blender だけで作った動画（svBlenderOnly）のとき
     gate    … 承認ポイント（◆ を付け、承認済みは緑＋承認の日時）
     offOnly … 進行係を通らない動画だけが使う（02・03 の本編では「この番組では なし」）
     still   … Blender だけで作った動画は使わない（「この動画では なし」・#604 中1）
     post    … 公開の側（検証用の動画では「検証は投稿しない」）
     pubTime … 2行目は番組の既定の公開時刻（svPubTime）。ここには書かない
     short   … 一覧の列の見出しとスマホの印の下の名前（用語集の略・#637）。無ければ name
     brk     … その名前を狭い列で折り返してよい所（| の位置・stepLabelHTML）。帯には使わない */
const SV_STEPS = [
  {name:'ネタ案',               what:'候補の登録'},
  {name:'台本',                 what:'文章（md）'},
  {name:'ナレーション',          brk:'ナレー|ション', what:'音声（ElevenLabs）'},
  {name:'シーン割り',            brk:'シーン|割り', what:'設計図（json）'},
  {name:'Blender の仮組み',      short:'仮組み', what:'動きとカメラの確認用の動画', offOnly:true},
  {name:'静止画',               what:'開始フレーム（FLUX.2）', whatOff:'開始フレーム（NB）'},
  {name:'仮組み＋静止画の承認',   brk:'仮組み|＋静止画|の承認', what:'オーナーが見る', gate:'storyboard', offOnly:true},
  /* Blender だけで作った動画の映像は、仮組みを作り込んで Blender で描く（用語集「作り込み」「Blender のコマ計算」。
     作り込みも帯では「映像」に入る）。2行目は短く道具まで（帯を1行に収めるため） */
  {name:'映像',                 what:'テイク（H3）', whatBlender:'コマ計算（Blender）'},
  {name:'完成動画の書き出し',     short:'書き出し', what:'映像・音声・字幕を1本に（Remotion）', whatOff:'映像・注釈・字幕・音を1本に'},
  {name:'完成の承認',            brk:'完成の|承認', what:'オーナーが見る', gate:'final'},
  {name:'予約投稿',              brk:'予約|投稿', what:'YouTube に登録', post:true},
  {name:'公開',                 what:'', post:true, pubTime:true}
];
/* 承認ポイント → 帯の位置 */
const SV_GATE_STEP = {storyboard:6, final:9};
/* 本体が持っている工程（PSTAGES / displayIdx の7つ）→ 帯の位置。1つの工程が帯の何個分にも
   またがるとき（board＝ナレーション〜静止画）は**またがる先頭**を指す。DB の工程からは
   ナレーション・仮組み・静止画の済み・未を細かく判定できないので、無理に済みにしない
   （いまの位置より前は済み、後はこれから）。投稿済は全部済み（12＝帯の外）。
     idea→ネタ案 / script→台本 / board→ナレーション / video→映像 / edit→完成動画の書き出し /
     queue→予約投稿 / posted→（全部済み） */
const SV_FROM_PSTAGE = [0, 1, 2, 7, 8, 10, 12];

/* ── いまの作業の記録（#637）────────────────────────────────────────────
   一覧のビューの末尾の work_* 列。記録が無い動画は全部 NULL（列がまだ無い DB では undefined で、同じく記録なし）。
   work_stage は帯の工程のキーで、帯の位置（SV_STEPS の添字）への写しはここ1か所（WORK_STEP）。
   記録がある動画は帯の位置を work_stage の工程に置き（svFlowAt。承認の記録からの位置より優先）、その工程の
   2行目に作業の中身を出す（svStepState・svFlowHTML）。「いまの工程」の1行（nowLineHTML）は、一覧の行
   （表とカード）と詳細画面の帯のすぐ下で同じ部品を使う */
const WORK_STEP = {idea:0, script:1, narration:2, scenes:3, blocking:4, still:5, video:7, export:8};
/* 数えられる作業で、最後に書いてからこれだけたった行は「止まっているかも」（黄色＋「更新なし N分」） */
const WORK_STALL_MS = 10 * 60 * 1000;
function workOf(r){
  const k = r && r.work_stage;
  if (!k || !Object.prototype.hasOwnProperty.call(WORK_STEP, k)) return null;
  const num = v => (v == null || v === '' || !isFinite(Number(v))) ? null : Number(v);
  const ms = v => { const t = Date.parse(v || ''); return isNaN(t) ? null : t; };
  const txt = v => (v == null ? '' : String(v).trim());
  const done = num(r.work_done), total = num(r.work_total);
  return { step: WORK_STEP[k], activity: txt(r.work_activity), note: txt(r.work_note), unit: txt(r.work_unit),
           machine: txt(r.work_machine), done, total, counted: done != null && total != null && total > 0,
           started: ms(r.work_started_at), updated: ms(r.work_updated_at), eta: ms(r.work_eta_at) };
}
/* 長さ（分に丸める）。1時間を超えたら「1時間15分」 */
const fmtSpan = msec => {
  const m = Math.max(0, Math.round(msec / 60000));
  if (m < 60) return `${m}分`;
  return `${Math.floor(m / 60)}時間${m % 60 ? (m % 60) + '分' : ''}`;
};
/* 「13:32(金)」。6日より前なら日付も付ける（同じ曜日が2回あるため） */
const fmtHMW = (t, now) => {
  const d = new Date(t), iso = d.toISOString();
  return `${(now - t) > 6 * DAY ? fmtMD(iso) + ' ' : ''}${fmtTime(iso)}(${jstWD(d)})`;
};
const actWord = w => !w.activity ? '作業中' : (w.activity.endsWith('中') ? w.activity : w.activity + '中');
/* 札の言葉「映像・コマ計算中」（工程の名前は帯の名前）。作業の中身が空の記録（コマ計算を途中で止めたあとの
   「映像」だけの記録など・#637）は工程の名前だけ（「映像」） */
const workTitle = w => w.activity ? `${SV_STEPS[w.step].name}・${actWord(w)}` : SV_STEPS[w.step].name;
/* 帯の2行目（「コマ計算 812/1852」か「作り込み中」。作業の中身が空なら記録の無いときと同じ「AI作業中」） */
const workLine2 = w => w.counted ? `${w.activity || '作業'} ${w.done}/${w.total}` : (w.activity ? actWord(w) : 'AI作業中');
/* 止まっているかも: 数えられる作業で最後の書き込みから WORK_STALL_MS 以上。たった長さ（ミリ秒）か null */
const workStall = (w, now) => (w && w.counted && w.updated != null && now - w.updated >= WORK_STALL_MS)
  ? now - w.updated : null;
const workPct = w => Math.max(0, Math.min(100, w.done / w.total * 100));
/* 「いまの工程」の1行。数えられる作業は 札・残り（または更新なし）／進みの棒・数・機械と始めた時刻、
   数えられない作業は 札・経過／ひとこと・始めた時刻。記録が無ければ空 */
function nowLineHTML(it, now){
  const w = it && it._work;
  if (!w) return '';
  if (now == null) now = Date.now();
  const stall = workStall(w, now);
  const since = w.started != null ? fmtHMW(w.started, now) + 'から' : '';
  let t1 = '', l2 = '', t2 = since;
  if (w.counted) {
    const pct = workPct(w);
    t1 = stall != null ? `<span class="wk-k">更新なし</span>${fmtSpan(stall)}`
      : w.eta != null ? (w.eta - now >= 60000 ? `<span class="wk-k">残り</span>約${fmtSpan(w.eta - now)}` : 'まもなく')
      : `${Math.floor(pct)}%`;
    l2 = `<span class="wk-bar"><i style="width:${pct.toFixed(1)}%"></i></span>` +
      `<span class="wk-cnt"${w.unit ? ` title="${esc(`${w.done}/${w.total} ${w.unit}`)}"` : ''}>${
        esc(w.done)}<span class="of">/${esc(w.total)}</span></span>`;
    t2 = [w.machine, since].filter(Boolean).join('・');
  } else {
    if (w.started != null) t1 = `<span class="wk-k">経過</span>${fmtSpan(now - w.started)}`;
    if (w.note) l2 = `<span class="txt">${esc(w.note)}</span>`;
  }
  /* 全文はツールチップ（ひとこと・始めた時刻・最後の更新・終わる見込み） */
  const at = t => fmtDT(new Date(t).toISOString());
  const tip = [w.note, w.started != null ? '始めた ' + at(w.started) : '',
               w.updated != null ? '最後の更新 ' + at(w.updated) : '',
               (w.counted && w.eta != null) ? '終わる見込み ' + at(w.eta) : ''].filter(Boolean).join('\n');
  return `<div class="wknow${stall != null ? ' stall' : ''}"${tip ? ` title="${esc(tip)}"` : ''}>` +
    `<span class="wk-pill">● ${esc(workTitle(w))}</span><span class="wk-t1">${t1}</span>` +
    `<span class="wk-l2">${l2}</span><span class="wk-t2">${esc(t2)}</span></div>`;
}

/* 案の索引（同じ検証の複数の案をタブで切り替える・#523）。案のフォルダと索引の json は
   画面の裏方なので、「レビュー素材」の一覧には出さない */
const RE_VARIANTS = /^variants_v(\d+)\.json$/i;

let sv = null;                      /* いま組み立ててあるシーン画面（詳細を閉じると捨てる） */

/* ── 単位の呼び名（#523）──────────────────────────────────────────
   目録の unit（「ショット」など）があればその言葉で出す。無ければ今までどおり「シーン」。
   **画面に出す単位の文言はこの3つの小さな関数だけで作る**（あちこちに直接書かない）。
   工程の名前の「シーン割り」は工程の名前なので替えない。 */
const svUnit = () => (sv && sv.unit) ? sv.unit : 'シーン';
const svUnitN = n => svUnit() + n;               /* 「ショット3」 */
const svUnitCount = n => n + svUnit();           /* 「12ショット」 */
/* 参照画像の欄の呼び名（#574）。目録の refs_label（例「使った素材」）があればその言葉、無ければ「参照画像」。
   拡大表示の題などの短い形は、無ければ今までどおり「参照」（参照①）。使わないと決めた目録の呼び名は引かない */
const svRefWord  = () => (sv && sv.mat && sv.mat.refs_label) || '参照画像';
const svRefShort = () => (sv && sv.mat && sv.mat.refs_label) || '参照';

/* ── シーンの素材表 ─────────────────────────────────────────────────
   動画と同じ版の表だけを使う（時刻表と同じ作法）。尺が 1.0 秒を超えて食い違うときは
   使わない——推測の表は素材を別の場面に結び付けてしまう。 */
/* 目録の本文（JSON の文字列）を画面の形に直す。目録の置き場は2つある——動画と同じフォルダと、
   案ごとのフォルダ（variants/…）——ので、読み取りはこの1つの関数に寄せる。
   ショット方式の目録が足す3つ（unit・ref_video_full・start_kind）もここで読む（#523）:
     unit           … 単位の呼び名（「ショット」。無ければ「シーン」）
     ref_video_full … 通しの参照動画（完成動画がまだ無いときの主画面）
     start_kind     … 'chain' なら前のショットの最後の1コマから続く（開始の絵を作らない） */
function parseMaterials(text){
  try {
    const o = JSON.parse(text);
    const rows = (o && Array.isArray(o.scenes) ? o.scenes : [])
      .filter(s => s && s.start != null && s.end != null)
      .map(s => ({
        n: Number(s.n), title: String(s.title == null ? '' : s.title),
        start: Number(s.start), end: Number(s.end),
        narration: s.narration == null ? '' : String(s.narration),
        start_img: s.start_img || null,
        start_kind: s.start_kind === 'chain' ? 'chain' : 'frame',
        end_img: s.end_img || null,
        end_kind: (s.end_kind === 'still' || s.end_kind === 'free') ? s.end_kind : 'frame',
        refs: Array.isArray(s.refs) ? s.refs.filter(r => r && r.img)
          .map(r => ({ label: String(r.label || ''), img: String(r.img) })) : [],
        ref_videos: Array.isArray(s.ref_videos) ? s.ref_videos.filter(r => r && r.src)
          .map(r => ({ label: String(r.label || ''), src: String(r.src) })) : []
      }))
      .filter(s => isFinite(s.start) && isFinite(s.end) && isFinite(s.n));
    if (!rows.length) return null;
    const full = (o && o.ref_video_full && o.ref_video_full.src)
      ? { label: String(o.ref_video_full.label || '通しの参照動画'), src: String(o.ref_video_full.src) }
      : null;
    const unit = (o && typeof o.unit === 'string' && o.unit.trim()) ? o.unit.trim() : 'シーン';
    /* refs の欄の呼び名（#574）。全部 Blender の動画は「使った素材」。無ければ今までどおり「参照画像」 */
    const refsLabel = (o && typeof o.refs_label === 'string' && o.refs_label.trim()) ? o.refs_label.trim() : null;
    return { duration: Number(o.duration) || null, fps: Number(o.fps) || null,
             unit, refs_label: refsLabel, ref_video_full: full, scenes: rows };
  } catch (_) { return null; }
}
/* 動画と同じ版の目録だけを使う（時刻表と同じ作法）。主画面の動画がまだ無いとき
   （通しの参照動画で見る回）は版を突き合わせられないので、いちばん新しい版を使う。 */
function sceneMaterials(files, videoName){
  const m = /_v(\d+)\./i.exec(String(videoName || ''));
  const want = m ? Number(m[1]) : null;
  let best = null, bestV = -1;
  for (const f of files) {
    const t = RE_MATERIALS.exec(f.name || '');
    if (!t || f.text == null) continue;
    const v = Number(t[1]);
    if (want != null) { if (v !== want) continue; return parseMaterials(f.text); }
    if (v > bestV) { bestV = v; best = f.text; }
  }
  return best == null ? null : parseMaterials(best);
}
/* 素材表の中の相対パスをまとめて署名URLにする（1時間で切れるのは他の素材と同じ扱い）。
   まとめて発行する API を使うので、シーン数ぶんの往復にはならない */
/* dir＝置き場（承認ポイントではない・#569）。sub＝案のフォルダ（variants/a）。案の目録の中のパスは
   「その json と同じフォルダから」なので、署名を出す起点をそこへずらす（#523） */
const svSignBase = (ch, seq, dir, sub) =>
  assetPath(ch, seq, dir) + (sub ? '/' + String(sub).replace(/^\/+|\/+$/g, '') : '');
async function svSign(ch, seq, dir, rels, sub){
  const base = svSignBase(ch, seq, dir, sub);
  const uniq = [...new Set((rels || []).filter(Boolean))];
  const out = {};
  if (!uniq.length) return out;
  /* 署名は控えて 50分使い回す（signPaths・#637）。取れなければ「まだありません」の面になるだけ */
  const m = await signPaths(uniq.map(r => `${base}/${r}`));
  for (const r of uniq) { const u = m[`${base}/${r}`]; if (u) out[r] = u; }
  return out;
}
/* 控えに全部の署名があれば、待たずに使える形（相対パス → URL）で返す。1つでも無ければ null */
function svSignHit(ch, seq, dir, rels, sub){
  const base = svSignBase(ch, seq, dir, sub);
  const uniq = [...new Set((rels || []).filter(Boolean))];
  const m = signedHit(uniq.map(r => `${base}/${r}`));
  if (!m) return null;
  const out = {};
  for (const r of uniq) out[r] = m[`${base}/${r}`];
  return out;
}

/* ── 工程の帯（#570）──────────────────────────────────────────────── */
/* その動画で使わない工程は、**動画の制作方法**（一覧のビューの production_method / production_method_name /
   production_method_skip・#637）で決める。方法ごとの「使わない工程」は DB の制作方法の一覧が持ち、ここには写さない
   （作り方が増えても画面は直さなくてよい）。一覧の行も詳細画面も同じ列を読むので、同じ答えになる。
   番組で決まる「この番組では なし」（02・03 の Blender の仮組みと使わない承認ポイント）が先で、制作方法の分はその上に
   「この動画では なし」として足す（02・03 の「静止画＋H3」は仮組みを使わないが、そこは番組の判定が先に立つので
   今の表示のまま）。
   制作方法が NULL（分からない）の動画だけ、詳細画面は**承認画面が読む素材の目録**で予備の判定をする（#604 中1）——
   Blender だけで作る動画の目録を作る道具（build_blender_materials.py）だけが目録に refs_label（「使った素材」）を書き、
   静止画＋H3 の目録の道具（build_shot_materials.py）と 02・03 の目録の道具は書かないので、目印があれば静止画を使わない。
   予備の判定は進行係を通らない動画だけ。一覧の行は目録を読まないので、制作方法が NULL なら使わない工程を足さない。
   目録の判定は「動画・案・版」ごとに控える（SV_MADE・svMadeKey）。案や版が変われば作り方も変わりうるので、
   **同じ案・同じ版の目録の取り直しが落ちたときだけ**前の判定を使い、別の案・別の版には持ち越さない
   （#604 検収。動画だけを鍵にしていたので、目録を読めなかった別の案・別の版に前の判定が残った）。
   帯は目録より先に描くので、目録が届いた時点で描き直す（svPaintFlow） */
const SV_MADE = new Map();               /* 「動画|案|版」→ true（Blender だけ）／false（目印の無い目録） */
/* いま見ている目録の鍵。版は、案があれば索引の版（案の目録はこの版だけを読む）、無ければ主画面の動画の版
   （目録は動画と同じ版だけを読む）。主画面の動画が無く通しの仮組みを借りている回は置き場のいちばん新しい目録の版 */
/* 鍵の作り方（組み立てる前の画面 svPrepare と、組み立てた画面 svMadeKey で同じ式を使う） */
const svMadeKeyOf = (id, variant, variantsVer, mainLabel, files, videoName) => {
  const ver = variant ? variantsVer
    : (mainLabel ? svNewestMaterialsVer(files || []) : verOfName(videoName));
  return `${id}|${variant || ''}|${ver == null ? '' : ver}`;
};
function svMadeKey(){
  if (!sv || !sv.it) return null;
  return svMadeKeyOf(sv.it.id, sv.variant, sv.variantsVer, sv.mainLabel, sv.files, sv.videoName);
}
const svNoteMade = (key, mat) => {
  if (key && mat) SV_MADE.set(key, !!mat.refs_label);   /* 目録が無い・読めない回は書かない（同じ鍵の前の判定のまま） */
};
/* 組み立てる前の画面の鍵（{ id, key }・#637）。案の無い画面は目録を読んでから最初の帯を描くので、
   画面（sv）ができる前の最初の描画から目録の判定を使う（以前は目録が届いてから帯を描き直していた） */
let svPreMade = null;
/* その動画の制作方法の「使わない工程」（帯の工程のキーの並び。位置へは WORK_STEP で写す）と方法の名前。
   listRow＝一覧の行（制作方法だけで決め、目録の予備の判定をしない） */
const svMethod = (it, listRow) => {
  if (!it) return { skip: [], name: '' };
  if (it.production_method) {
    return { skip: Array.isArray(it.production_method_skip) ? it.production_method_skip : [],
             name: String(it.production_method_name || '') };
  }
  if (!listRow && offDispatcherItem(it)) {
    const key = (sv && sv.it && sv.it.id === it.id && sv.madeKey)
      || (svPreMade && svPreMade.id === it.id ? svPreMade.key : null);
    if (key && SV_MADE.get(key) === true) return { skip: ['still'], name: 'Blender だけ' };
  }
  return { skip: [], name: '' };
};
/* 静止画を使わない作り方（映像を Blender で描く）か。映像の2行目を「コマ計算（Blender）」にするのに使う */
const svBlenderOnly = (it, listRow) => svMethod(it, listRow).skip.includes('still');
/* その動画で使わない工程と、状態の欄に出す言葉（12個ぶん。null＝使う）。
   Blender の仮組みとその承認は進行係を通らない動画（力わざ・からくり・検証用）だけ、公開の側は検証用では使わない。
   承認ポイントは番組の human_gates（chMeta の gates）に無ければ使わない（#572・力わざとからくりは完成だけ）。
   その上に、制作方法の使わない工程（静止画＋H3 の仮組み・Blender だけの静止画など）を「この動画では なし」で足す */
const SV_SKIP_TIP = {'この番組では なし':'この番組ではこの工程を使いません',
  '検証は投稿しない':'検証用の動画は投稿しません'};
/* 「この動画では なし」のツールチップ（制作方法の名前つき） */
const svMethodTip = (it, listRow) => {
  const n = svMethod(it, listRow).name;
  return n ? `この動画は「${n}」で作るので、この工程を使いません` : 'この動画の作り方では、この工程を使いません';
};
const SV_SKIP = (it, listRow) => {
  const skip = svMethod(it, listRow).skip;
  return SV_STEPS.map((s, i) =>
      (s.offOnly && !offDispatcherItem(it)) ? 'この番組では なし'
    : (s.gate && !chMeta(it.channel).gates.includes(s.gate)) ? 'この番組では なし'
    : skip.some(k => WORK_STEP[k] === i)    ? 'この動画では なし'
    : (s.post && isPilotSeq(it.seq))        ? '検証は投稿しない' : null);
};
/* 番組の既定の公開時刻（画面が持っている番組の設定）。無ければ空 */
function svPubTime(it){
  const row = (store.pilotChannels || store.channels || []).find(c => c.slug === it.channel);
  const m = row && /^(\d{1,2}):(\d{2})/.exec(String(row.publish_time_jst || ''));
  return m ? `${m[1].padStart(2, '0')}:${m[2]} に公開` : '';
}
/* いまの位置。作業中の記録があればその工程（#637・承認の記録より優先）、承認待ち・修正中の承認ポイントが
   あればその位置、無ければ本体の工程から写す。listRow は SV_SKIP と同じ（一覧の行） */
function svFlowAt(it, listRow){
  if (it._work) return it._work.step;
  const rv = it._rv || it._rc;
  let i;
  if (rv && SV_GATE_STEP[rv] != null) i = SV_GATE_STEP[rv];
  else if (rv === 'script') i = 1;
  /* 予約済みは「投稿済」の工程に入る（公開の記録がステータスを進める）。公開時刻を待っている */
  else if (it.stage === 'posted' && it.pub_status === '予約済') i = 11;
  else {
    const d = displayIdx(it);
    i = (d < 0 || SV_FROM_PSTAGE[d] == null) ? 0 : SV_FROM_PSTAGE[d];
  }
  /* 承認待ちの承認ポイントをこの動画が使わない（02・03 の古い絵コンテの承認）ときは手前の使う工程に置く
     （Blender だけで作った動画は静止画も使わないので、さらに手前の仮組みへ） */
  const skip = rv ? SV_SKIP(it, listRow) : null;
  while (skip && i > 0 && skip[i]) i -= 1;
  return i;
}
/* 承認ポイントが承認済みか＝承認の記録があり、いま承認待ちでも修正中でもない */
const svGateOk = (it, g) => !!it[GATE_COLUMN_FIELD[g]] && it._rv !== g && it._rc !== g;
/* 帯に出す承認の時刻（#604 E3）。一覧の行の approved_*_at は**最初の**承認の時刻のまま動かないので、
   承認のあとに出し直して承認し直した動画（KR0001 の第2版など）では前の版の時刻が出ていた。
   レビュー記録にある人の承認のうち、いちばん新しいものの時刻を出す。記録が無ければ行の時刻 */
function svGateApprovedAt(it, g){
  let last = null;
  for (const e of threadOf(it.id) || []) {
    if (e.gate !== g || e.kind !== 'approve' || isAiAuthor(e.author)) continue;
    if (!last || evNewer(e, last)) last = e;
  }
  return (last && last.created_at) || it[GATE_COLUMN_FIELD[g]];
}
/* 1つの工程の見た目（クラスと状態の欄）。言葉は一覧の札と同じもの（承認待ち・rcShort・投稿待ち） */
function svStepState(it, i, cur, skipNote){
  const s = SV_STEPS[i];
  if (skipNote) return { cls:'skip', st:'なし' };
  if (i < cur) {
    if (s.gate && svGateOk(it, s.gate)) {
      const at = svGateApprovedAt(it, s.gate);
      return { cls:'ok', st:`✓ 承認済み ${fmtMD(at)} ${fmtTime(at)}` };
    }
    /* 承認ポイントを承認の記録なしで通り過ぎた（その承認ポイントへは出していない）。済みの色に
       すると承認済みに見えるので、色を付けずに言葉で書く（オーナー指摘 2026-09-29 16:27） */
    if (s.gate) return { cls:'nogate', st:'承認の記録なし' };
    return { cls:'done', st:'' };
  }
  if (i > cur) return { cls:'', st:'' };
  /* 作業中の記録がある（#637）: 2行目は作業の中身（「コマ計算 812/1852」か「作り込み中」） */
  if (it._work) return { cls:'cur', st:workLine2(it._work) };
  if (it._rv) return { cls:'cur', st:'承認待ち' };
  if (it._rc) return { cls:'cur', st:rcShort(it) };
  return { cls:'cur', st: it.stage === 'posted' ? '予約済み'
                        : it.stage === 'queue' ? '投稿待ち'
                        : it.stage === 'idea'  ? '着手前' : 'AI作業中' };
}
/* 帯の中身の目印（短い文字列）。描き直す前に中身が同じかを比べる（#637） */
const sigOf = s => {
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return (h >>> 0).toString(36);
};
/* 帯の HTML。帯ぜんたい（data-sig）と工程のマスごと（data-k）に中身の目印を持たせ、描き直すときは中身が
   変わったマスだけを差し替える（svPatchFlow・#637） */
function svFlowHTML(it){
  const cur = svFlowAt(it);
  const skip = SV_SKIP(it), off = offDispatcherItem(it), bl = svBlenderOnly(it);
  /* いまの工程の色は一覧の印と同じ決まり（curTone・#637）。状態の言葉（2行目）は今までどおり */
  const tone = curTone(it);
  const steps = SV_STEPS.map((s, i) => {
    const { cls, st } = svStepState(it, i, cur, skip[i]);
    const what = s.pubTime ? (skip[i] ? '—' : svPubTime(it))
      : ((bl && s.whatBlender) || (off && s.whatOff) || s.what);
    const tip = skip[i] === 'この動画では なし' ? svMethodTip(it) : (skip[i] ? (SV_SKIP_TIP[skip[i]] || '') : '');
    /* 2行だけ（オーナー指摘 2026-09-29 16:24「ごちゃごちゃ・文字を減らして」）。済みは色と ✓ だけで
       示し、2行目は「作るもの・道具」。知らせることがある工程（いまの工程・承認済み・使わない）
       だけ、2行目を状態の言葉に替える */
    const line2 = (cls === 'cur' || cls === 'ok' || cls === 'skip' || cls === 'nogate') ? st : what;
    const mark = s.gate ? '◆ ' : (cls === 'done' ? '✓ ' : '');
    /* 数えられる作業（#637）は、いまの工程の下端に細い進みの棒（止まっているかもなら黄色） */
    const w = cls === 'cur' && it._work && it._work.counted ? it._work : null;
    const pb = w ? `<span class="pb${workStall(w, Date.now()) != null ? ' warn' : ''}"><i style="width:${
      workPct(w).toFixed(1)}%"></i></span>` : '';
    /* 2行目は帯が狭いと「…」で切れる（svFitFlow）ので、全文をツールチップにも持たせる */
    const cls2 = `sv-step${s.gate ? ' gate' : ''}${cls ? ' ' + cls : ''}${cls === 'cur' ? ' ' + tone : ''}${pb ? ' haspb' : ''}`;
    const attrs = `${tip ? ` title="${esc(tip)}"` : ''}${cls === 'cur' ? ' aria-current="step"' : ''}`;
    const body = `<span class="nm">${mark}${esc(s.name)}</span>` +
      `<span class="st"${line2 && !tip ? ` title="${esc(line2)}"` : ''}>${line2 ? esc(line2) : '&nbsp;'}</span>${pb}`;
    return `<span class="${cls2}" role="listitem" data-k="${sigOf(cls2 + attrs + body)}"${attrs}>${body}</span>`;
  });
  return `<div class="sv-flow" data-sig="${sigOf(steps.join(''))}"><div class="sv-steps" role="list" aria-label="工程">${
    steps.join('')}</div></div>`;
}
/* 開いている帯を it の中身に合わせる。中身が同じなら何もしない。変わったマス（いまの工程の2行目・進みの棒など）だけを
   差し替える——帯ごと作り直すと、横に送った位置と幅合わせが毎回やり直しになる（#637）。変えたら true */
function svPatchFlow(root, it){
  const old = root && root.querySelector('.sv-flow');
  if (!old || !it) return false;
  const tpl = document.createElement('template');
  tpl.innerHTML = svFlowHTML(it);
  const nf = tpl.content.firstElementChild;
  if (old.dataset.sig === nf.dataset.sig) return false;
  const os = old.querySelectorAll('.sv-step'), ns = nf.querySelectorAll('.sv-step');
  if (!old.dataset.sig || os.length !== ns.length) { old.replaceWith(nf); return true; }
  os.forEach((o, i) => { if (o.dataset.k !== ns[i].dataset.k) o.replaceWith(ns[i]); });
  old.dataset.sig = nf.dataset.sig;
  return true;
}
/* 目録が届いたら（詳細を組み立てたとき・案を切り替えたとき）、いま見ている「動画・案・版」の鍵で
   Blender だけで作った動画かを控え、帯を合わせる（#604 中1・検収）。描き直すのは中身が変わるときだけ（#637）——
   制作方法がある動画と、組み立てる前に目録を読んだ案の無い画面（svPreMade）は、最初の帯のままで変わらない */
function svPaintFlow(){
  if (!sv || !sv.root.isConnected) return;
  sv.madeKey = svMadeKey();
  svNoteMade(sv.madeKey, sv.matRaw);
  if (svPatchFlow(sv.root, sv.it)) svFitFlow(sv.root);
  svPaintBar();
}

/* ── ③ 前回までの私の指摘（2026-09-21 に作り替え・オーナー指摘）────────────────
   **オーナー自身の指摘だけ**を新しい順にそのまま出す（AI の記録・工程の履歴・フックと、
   詳細への切り替えはこの画面から外した）。絞り込みは「あなたの指摘」（youHTML）と同じで、
   人の author（AI の印が付いていないもの）の修正依頼とコメント。
   対応の記録（今回変えた内容）は②の先頭の「変更」に出ているので、ここには出さない。 */
function svPrevNotes(it, evs, gate){
  const g = gate || 'final';
  const liveRev = it._rv === g ? submittedRevOf(it.id, g) : null;
  const rows = [];
  for (const e of newestFirst(evs.filter(x => !isAiAuthor(x.author)
      && (x.kind === 'request_changes' || x.kind === 'comment')))) {
    const when = fmtDT(e.created_at) || '';
    const rev = e.revision == null ? null : Number(e.revision);
    /* ピンを出せるのは「いま左に出ている完成動画」と同じ版に付いた指摘だけ */
    const live = !!(liveRev != null && e.gate === g && Number(e.revision == null ? 1 : e.revision) === Number(liveRev));
    const o = notesOf(e);
    if (o) {
      for (const r of o.items) {
        rows.push({ t: r.t == null ? null : Number(r.t),
          scene: r.scene == null ? null : Number(r.scene),
          title: r.scene_title || '', tag: r.tag || null,
          /* どの案を見て書いた指摘かは送ったあとも残す（#523 のレビュー指摘2） */
          variant: r.variant ? String(r.variant) : null,
          body: r.note || '', when, rev, live,
          pin: (live && normKind(r.kind) === 'picture' && r.pin) ? r.pin : null });
      }
      if (o.memo) rows.push({ t:null, scene:null, title:'', tag:'全体へのメモ',
        variant:null, body:o.memo, when, rev, live, pin:null });
    } else {
      /* notes を持たない古い依頼は本文のまま */
      rows.push({ t:null, scene:null, title:'', tag:null, variant:null,
        body: String(e.body || '（本文なし）'), when, rev, live, pin:null });
    }
  }
  return rows;
}

                <div class="sv-refempty" data-sv-refempty>

                </div></div>
            </div>
          </div>
          <div class="sv-matcol">
            <div class="sv-colhd"><span data-sv-colhd>いまのシーンの素材</span></div>
            <div class="sv-now" data-sv-now></div>
          </div>
          <div class="sv-ctrls-slot" data-sv-ctrls></div>
        </div>
      </section>
      <section class="sv-sec sb" data-sv-secb aria-label="私の指摘">
        <div class="sv-sechd">私の指摘<span class="facts" data-sv-ncount>—</span></div>
        ${decide}
      </section>
      <section class="sv-sec sc" aria-label="前回までの私の指摘">
        <div class="sv-sechd">前回までの私の指摘<span class="facts" data-sv-prevcount>${
          prev.length}件</span></div>
        <div class="sv-prevlist" data-sv-prevlist></div>
      </section>
    </div>
    <!-- スマホだけのタブ（#552）。最初はどれも開いていない。もう一度押すと閉じる -->
    <div class="sv-mtabs sv-m-only" role="group" aria-label="動画の下に開く中身">
      <button type="button" data-svact="mtab" data-mtab="mat" aria-pressed="false">素材</button>
      <button type="button" data-svact="mtab" data-mtab="script" aria-pressed="false">台本</button>
      <button type="button" data-svact="mtab" data-mtab="notes" aria-pressed="false">指摘</button>
    </div>
    <!-- 「＋ 指摘」の段1（場所を選ぶ）のあいだだけ、タブと下の帯の代わりに出る（#552 の続き） -->
    <div class="sv-mpick sv-m-only" role="group" aria-label="指摘の場所を選ぶ">
      <span class="msg">絵を触ると場所を指せます</span>
      <button class="btn" type="button" data-svact="pick-whole">場所なしで書く</button>
      <button class="btn ghost" type="button" data-svact="pick-cancel">やめる</button>
    </div>
    <div class="assets" data-assets="${esc(it.id + '|' + gate)}" data-sv="1" data-ch="${esc(it.channel)}"
         data-seq="${esc(it.seq)}" data-gate="${esc(gate)}" data-dir="${esc(dir)}" hidden></div>
    <div class="sv-lbox" data-sv-lbox hidden>
      <img data-sv-lboximg alt="">
      <div class="lcap" data-sv-lboxcap>—</div>
      <div class="lnav">
        <button type="button" data-svact="lbox-prev" aria-label="前の画像">←</button>
        <button type="button" data-svact="lbox-close">閉じる</button>
        <button type="button" data-svact="lbox-next" aria-label="次の画像">→</button>
      </div>
      <div class="lhint" data-sv-lhint>動画は止めたままです。←→ で 開始 → 終了 → 参照 を送れます（Esc・背景で閉じる）</div>
    </div>
  </div>`;
}

/* ── ヘッダー・工程の帯・下端バーの実高さを測って CSS に渡す（広い画面の高さ計算に使う）──
   opts.repaint=false … いまのシーンの素材を描き直さない（組み立ての途中・1分ごとの取り直し。描いたばかり・変わらないため）
   opts.fit=false     … 帯の幅合わせをしない（帯が変わっていない取り直し） */
function svRelayout(opts){
  const o = opts || {};
  const root = document.querySelector('#view-detail .sview');
  svMobileLayout();
  if (!root) { document.body.classList.remove('sv-lock'); return; }
  const h = el => (el ? el.offsetHeight : 0);
  /* 帯の下の「いまの工程」の1行（#637）も高さに入れる（無ければ 0） */
  const chrome = h(document.querySelector('.topbar')) + h(root.querySelector('.dtop'))
    + h(root.querySelector('.sv-flow')) + h(root.querySelector('.sv-worknow')) + h(root.querySelector('.dbar')) + 40;
  if (root.style.getPropertyValue('--sv-chrome') !== chrome + 'px') root.style.setProperty('--sv-chrome', chrome + 'px');
  document.body.classList.toggle('sv-lock', window.innerWidth >= 1400);
  if (o.fit !== false) {
    svFitFlow(root);
    /* 狭い画面では工程の帯が横に流れるので、いまの工程を画面の中へ入れておく。入りきっているときは
       送らない（送ると頭の工程が隠れる・#604 E1） */
    const cur = root.querySelector('.sv-step.cur'), box = root.querySelector('.sv-steps');
    if (cur && !tapMobile() && box && box.scrollWidth > box.clientWidth + 1) {
      try { cur.scrollIntoView({ block:'nearest', inline:'center' }); } catch (_) {}
    }
  }
  if (sv && o.repaint !== false) { svPaintNow(); svPaintRefFace(); }
}
/* 工程の帯を1行の幅に収める（#604 E1。1400px でも 12 個で 1500px 前後になり、横に送られて頭の
   「ネタ案」「台本」が隠れ、端の文字が切れていた）。縮めるのは2行目（作るもの・道具／状態）だけで、
   名前（1行目）は切らない。いちばん長い2行目から順に同じ幅までそろえて縮め（足りない分だけ）、
   切れた2行目は「…」で終わる（全文はツールチップ）。名前だけでも入らない幅（狭い画面）では今までどおり
   横に送り、送れる側の端を薄くして続きがあると分かるようにする */
function svFitFlow(root){
  const box = root && root.querySelector('.sv-steps');
  if (!box) return;
  const steps = [...box.querySelectorAll('.sv-step')];
  for (const s of steps) s.style.maxWidth = '';
  const avail = box.clientWidth;
  if (avail && steps.length) {
    /* 隣どうしは矢羽根の分だけ重ねてある（margin-left が負）。重なりの分だけ並べられる幅が増える */
    const lap = steps.length > 1 ? (parseFloat(getComputedStyle(steps[1]).marginLeft) || 0) : 0;
    const room = avail - lap * (steps.length - 1);
    const nat = steps.map(s => s.getBoundingClientRect().width);
    const sum = a => a.reduce((x, y) => x + y, 0);
    if (sum(nat) > room + 0.5) {
      const min = steps.map((s, i) => {
        /* 2行目が状態の言葉（いまの工程・承認の日時・承認の記録なし）の工程は縮めない＝知らせることを切らない */
        if (s.matches('.cur,.ok,.nogate')) return nat[i];
        const cs = getComputedStyle(s), nm = s.querySelector('.nm');
        const w = (nm ? nm.getBoundingClientRect().width : 0) + parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
        return Math.min(nat[i], Math.max(parseFloat(cs.minWidth) || 0, Math.ceil(w)));
      });
      /* 名前だけでも入らない幅や、ほとんどの2行目を数文字まで切らないと入らない幅（1工程 110px＝2行目が
         8文字前後を下回る）では縮めない。今までどおりの幅で横に送る（1200px 前後の画面。測った値） */
      if (sum(min) <= room) {
        const used = c => sum(nat.map((w, i) => Math.max(min[i], Math.min(w, c))));
        let lo = 0, hi = Math.max(...nat);
        for (let k = 0; k < 24; k++) { const mid = (lo + hi) / 2; if (used(mid) > room) hi = mid; else lo = mid; }
        if (lo >= 110) steps.forEach((s, i) => { if (nat[i] > lo) s.style.maxWidth = Math.max(min[i], Math.floor(lo)) + 'px'; });
      }
    }
  }
  const edge = () => {
    box.classList.toggle('more-l', box.scrollLeft > 1);
    box.classList.toggle('more-r', box.scrollLeft + box.clientWidth < box.scrollWidth - 1);
  };
  edge();
  if (!box.dataset.edge) { box.dataset.edge = '1'; box.addEventListener('scroll', edge, { passive: true }); }
}

/* ── スマホの1画面（#552・オーナー確定 2026-09-25）─────────────────────────────
   並べ方は CSS（@media max-width:899px の .sview）。ここは CSS だけでは置けない4つを
   スマホのときだけ移し、広い画面に戻ったら元の場所へ返す（行き来しても何度呼んでも同じ結果）:
     参照動画の枠 → 素材のタブの中 ／ 案のタブ → 上の帯 ／ 前回までの指摘 → 指摘のタブの中
     ／ 承認の注意書き → 指摘のタブの先頭
   どれも中の要素は作り直さず移すだけなので、掴んでいる参照（動画・一覧）はそのまま動く。 */
function svMobileLayout(){
  const root = document.querySelector('#view-detail .sview');
  const mob = !!root && tapMobile();
  document.body.classList.toggle('sv-mobile', mob);
  if (!root) return;
  const q = s => root.querySelector(s);
  const ref = q('.sv-screen.ref'), mat = q('.sv-matcol'), screens = q('.sv-screens');
  const vt = q('[data-sv-vtabs]'), dtop = q('.dtop'), shd = q('.sv-sec.sa>.sv-sechd');
  const sc = q('.sv-sec.sc'), wrap = q('.sv-wrap');
  const tb = q('.decide [data-tapbox]'), abox = q('.decide [data-abox]');
  if (mob) {
    if (ref && mat && ref.parentNode !== mat) mat.appendChild(ref);
    const ttl = dtop && dtop.querySelector('.ttl');
    if (vt && ttl && vt.parentNode !== dtop) ttl.after(vt);
    if (sc && tb && !tb.hidden && sc.parentNode !== tb) tb.appendChild(sc);
    if (abox && tb && !tb.hidden) {
      const cau = [...abox.querySelectorAll(':scope > .acaution')];
      cau.forEach(c => c.classList.add('sv-macau'));
      if (cau.length) tb.prepend(...cau);
    }
    svSyncVV(root);
    if (sv) root.classList.toggle('sv-noref', !(sv.hasRefVideo || (sv.mat && sv.mat.ref_video_full && !sv.mainLabel)));
  } else {
    if (ref && screens && ref.parentNode !== screens) screens.appendChild(ref);
    /* 案のタブの広い画面での置き場所は①の見出し行の中・facts の左（オーナー決定 2026-09-29 案A） */
    if (vt && shd && vt.parentNode !== shd) shd.insertBefore(vt, shd.querySelector(':scope > .facts'));
    if (sc && wrap && sc.parentNode !== wrap) wrap.appendChild(sc);
    if (abox && tb) {
      const fold = abox.querySelector(':scope > .afold');
      tb.querySelectorAll(':scope > .sv-macau').forEach(c => {
        c.classList.remove('sv-macau');
        if (fold) abox.insertBefore(c, fold); else abox.appendChild(c);
      });
    }
    root.style.removeProperty('--sv-vh');
    root.style.removeProperty('--sv-vtop');
  }
}
/* 画面の高さは「いま見えている範囲」（visualViewport）に合わせる。キーボードが出るとこの高さが
   縮み、1画面ごと縮む＝動画は上に残る。100dvh は読めないときの控え（CSS 側） */
function svSyncVV(root){
  root = root || document.querySelector('#view-detail .sview');
  if (!root || !tapMobile()) return;
  const vv = window.visualViewport;
  root.style.setProperty('--sv-vh', Math.round(vv ? vv.height : window.innerHeight) + 'px');
  root.style.setProperty('--sv-vtop', Math.round(vv ? vv.offsetTop : 0) + 'px');
  /* キーボードが出ている（見えている高さが画面より大きく縮んだ）あいだは、入力画面の下の
     余白（ホームバーぶん）を詰める。キーボードの上にホームバーは無い（#552 の続き） */
  root.classList.toggle('sv-kb', !!vv && (window.innerHeight - vv.height) > 120);
}
/* タブ（素材・台本・指摘）。同じタブをもう一度押すと閉じる（'' ＝閉じた状態） */
function svSetTab(t){
  if (!sv) return;
  const root = sv.root;
  if (t) root.dataset.mtab = t; else delete root.dataset.mtab;
  root.querySelectorAll('[data-svact="mtab"]').forEach(x =>
    x.setAttribute('aria-pressed', String(!!t && x.dataset.mtab === t)));
  if (t === 'script') { sv.scriptHold = 0; svPaintScript(); }
  if (t === 'notes') { sv.notesHold = 0; svPaintNotesCur(); }
}
/* 指摘のタブも再生中のシーンに合わせる: 今回の指摘はいまのシーンのものに印、
   前回までの指摘は既存の強調（.cur）を使い、タブが開いていれば最初の1件を中へ入れる */
function svPaintNotesCur(){
  if (!sv || !tapMobile()) return;
  let first = null;
  if (tap && tap.panel) {
    tap.panel.querySelectorAll('.nitem').forEach(r => {
      const it = tap.items.find(x => x.id === Number(r.dataset.nid));
      const on = !!(it && it.scene != null && it.scene === sv.curN);
      r.classList.toggle('sv-scn', on);
      if (on && !first) first = r;
    });
  }
  if (sv.root.dataset.mtab !== 'notes') return;
  if (!first && sv.prevRows) {
    const p = sv.prevRows.find(r => r.scene != null && r.scene === sv.curN);
    if (p) first = p.el;
  }
  const pane = (tap && tap.panel && !tap.panel.hidden) ? tap.panel : sv.q('.sv-sec.sc');
  if (!first || !pane || (Date.now() - (sv.notesHold || 0)) < SV_SCRIPT_HOLD) return;
  const pr = pane.getBoundingClientRect(), r = first.getBoundingClientRect();
  if (r.top < pr.top || r.bottom > pr.bottom) pane.scrollTop += r.top - pr.top - 8;
}

/* ── 台本・いまのシーン ───────────────────────────────────────────── */
const svScenes = () => (sv && sv.scenes) ? sv.scenes : [];
const svSceneByN = n => svScenes().find(s => s.n === n) || svScenes()[0] || null;
function svSceneAt(t){
  const rows = svScenes();
  return rows.find(s => t >= s.start && t < s.end) || rows[rows.length - 1] || null;
}
/* 目録の画像・参照動画の署名URL。組み立てた直後（urlsPending）は、動画が読み始めて画像を入れるまで null（#637） */
const svUrl = rel => (rel && sv && sv.urls && !sv.urlsPending) ? (sv.urls[rel] || null) : null;

/* 「素材なし」の面。**枠を消さずに中へ入れる**（欄が歯抜けになると見落とす・オーナー指摘） */
function svNoMat(sub){
  const e = document.createElement('div');
  e.className = 'sv-nomat';
  e.appendChild(document.createTextNode('素材なし'));
  if (sub) {
    const s = document.createElement('span');
    s.className = 'rsub'; s.textContent = sub;
    e.appendChild(s);
  }
  return e;
}
/* 台本の1行 = 開始フレームのサムネ ｜ シーン番号・時刻・指摘の数 ｜ ナレーション。
   シーンの帯（再生の操作の下のサムネの列）は廃止し、サムネはここに付ける（オーナー指摘 2026-09-21）。 */
function svBuildScript(){
  const box = sv.q('[data-sv-scriptlist]');
  box.textContent = '';
  sv.scriptRows = [];
  const rows = svScenes();
  /* シーンの区切りも分からないときだけ、欄いっぱいの「素材なし」にする（枠は残る） */
  if (!rows.length) {
    box.appendChild(svNoMat('ナレーションも' + svUnit() + 'の区切りもまだありません'));
    sv.q('[data-sv-scriptmeta]').textContent = '—';
    return;
  }
  /* そのシーンに前回の指摘が何件あるか（帯に付けていた印をここへ移した） */
  const byScene = {};
  for (const p of (sv.prev || [])) if (p.scene != null) byScene[p.scene] = (byScene[p.scene] || 0) + 1;
  /* 素材表が無くても、時刻表があれば行の形（番号・時刻・タイトル）は出し、
     ナレーションの場所に「素材なし」と書く（行ごと消さない） */
  let chars = 0;
  for (const s of rows) {
    chars += (s.narration || '').length;
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'sv-sline';
    b.title = svUnitN(s.n) + (s.title ? '「' + s.title + '」' : '');
    /* 開始フレームのサムネ。無ければ同じ大きさの「素材なし」の面
       （前の1コマから続く作りでも、面の大きさは変えない・#523） */
    const u = svUrl(s.start_img);
    if (u) {
      const im = document.createElement('img');
      im.className = 'sth'; im.src = u; im.alt = ''; im.loading = 'lazy';
      b.appendChild(im);
    } else if (sv.urlsPending && s.start_img) {
      /* 署名を待っている間は同じ大きさの空の面（届いたら svFillUrls が画像に替える・#637） */
      const w = document.createElement('span');
      w.className = 'sth'; w.dataset.svRel = s.start_img;
      b.appendChild(w);
    } else {
      const nn = document.createElement('span');
      nn.className = 'sthnone'; nn.textContent = '素材\nなし';
      b.appendChild(nn);
    }
    const meta = document.createElement('span');
    meta.className = 'smeta';
    /* 単位の呼び名は目録の unit に従う（「ショット3」／「シーン3」・README の約束） */
    const n = document.createElement('span'); n.className = 'sn'; n.textContent = svUnitN(s.n);
    const t = document.createElement('span'); t.className = 'stm'; t.textContent = fmtT(s.start);
    meta.append(n, t);
    if (byScene[s.n]) {
      const k = document.createElement('span');
      k.className = 'nmark'; k.textContent = '指摘' + byScene[s.n];
      k.title = 'この' + svUnit() + 'への前回までの指摘 ' + byScene[s.n] + '件';
      meta.appendChild(k);
    }
    const x = document.createElement('span');
    if (sv.mat) {
      x.textContent = s.narration || '（ナレーションなし）';
    } else {
      x.className = 'snone';
      x.textContent = (s.title ? s.title + ' ・ ' : '') + '素材なし';
    }
    b.append(meta, x);
    b.addEventListener('click', () => svGoScene(s.n));
    box.appendChild(b);
    sv.scriptRows.push(b);
  }
  sv.q('[data-sv-scriptmeta]').textContent = svUnitCount(rows.length)
    + (sv.mat ? '・' + chars + '字' : '');
}
/* 台本を手で読み返している間（最後の操作から4秒）は、いまのシーンへ勝手に戻さない */
const SV_SCRIPT_HOLD = 4000;
function svPaintScript(){
  if (!sv.scriptRows || !sv.scriptRows.length) return;
  const rows = svScenes();
  rows.forEach((s, i) => sv.scriptRows[i].setAttribute('aria-current', s.n === sv.curN ? 'true' : 'false'));
  const idx = rows.findIndex(s => s.n === sv.curN);
  const row = sv.scriptRows[idx], box = sv.q('[data-sv-scriptlist]');
  if (!row || !box || (Date.now() - sv.scriptHold) < SV_SCRIPT_HOLD) return;
  const top = row.offsetTop - box.offsetTop, h = box.clientHeight;
  if (top < box.scrollTop || top + row.offsetHeight > box.scrollTop + h) {
    sv.scriptAuto = true;
    box.scrollTop = Math.max(0, top - h / 3);
    setTimeout(() => { sv.scriptAuto = false; }, 150);
  }
}
/* 参照画像の番号（①〜㊿。それより多いときは「(51)」）と、頭に付いた番号だけを外した label（#549） */
function svRefNo(n){
  if (n >= 1 && n <= 20) return String.fromCharCode(0x2460 + n - 1);
  if (n >= 21 && n <= 35) return String.fromCharCode(0x3251 + n - 21);
  if (n >= 36 && n <= 50) return String.fromCharCode(0x32B1 + n - 36);
  return '(' + n + ')';
}
const svRefLabel = lb => String(lb || '').replace(/^[①-⑳㉑-㉟㊱-㊿]\s*/, '').trim();
/* 参照画像の番号は**動画全体の通し番号**（オーナー要望 2026-09-26）。シーンの中の並び順で
   振っていた頃は「S14 の参照②」とシーンまで書かないと特定できなかった。シーン順・並び順に
   1から振り、**同じ画像はどのシーンに出ても同じ番号**（目録は同じ画像を同じ img で指す）。
   目録ごとに1回だけ作って覚える */
function svRefNos(mat){
  if (!mat) return new Map();
  if (mat._refNos) return mat._refNos;
  const m = new Map();
  for (const sc of (mat.scenes || [])) {
    for (const r of (sc.refs || [])) {
      const k = r.img || r.label || '';
      if (!m.has(k)) m.set(k, m.size + 1);
    }
  }
  Object.defineProperty(mat, '_refNos', { value: m, enumerable: false });
  return m;
}
/* いまのシーンの画像。上段＝開始 → 終了、下段＝参照画像の枠 */
function svPaintNow(){
  const now = sv.q('[data-sv-now]');
  if (!now) return;
  const s = svSceneByN(sv.curN);
  now.textContent = '';
  sv.lboxList = [];
  /* 「参照画像は ①② の番号で書けます」は、目録に参照画像が1枚でもある動画だけ出す（#549） */
  const anyRef = !!(sv.mat && (sv.mat.scenes || []).some(x => x.refs && x.refs.length));
  sv.root.querySelectorAll('[data-sv-refnote]').forEach(e => {
    e.hidden = !anyRef; e.textContent = svRefWord() + 'は ①② の番号で書けます'; });
  const lhint = sv.q('[data-sv-lhint]');
  if (lhint) lhint.textContent = '動画は止めたままです。←→ で 開始 → 終了 → ' + svRefShort() + ' を送れます（Esc・背景で閉じる）';
  const l1 = document.createElement('div');
  l1.className = 'l1';
  const nn = document.createElement('span'); nn.className = 'nn';
  nn.textContent = s ? svUnitN(s.n) : svUnit() + ' —';
  const ntt = document.createElement('span'); ntt.className = 'ntt';
  ntt.textContent = s ? (s.title || '') : '';
  const nt = document.createElement('span'); nt.className = 'nt';
  nt.textContent = s ? (fmtT(s.start) + '–' + fmtT(s.end)) : '';
  l1.append(nn, ntt, nt);
  now.appendChild(l1);
  const nar = document.createElement('div');
  nar.className = 'nar';
  if (sv.mat && s) nar.textContent = s.narration || '—';
  else { nar.className = 'nar snone'; nar.textContent = '素材なし'; }
  now.appendChild(nar);
  const shelf = document.createElement('div');
  shelf.className = 'sv-shelf';
  const slotEl = sl => {
    const wrap = document.createElement('div');
    wrap.className = 'sv-slot';
    const cap = document.createElement('div');
    cap.className = 'cap'; cap.textContent = sl.cap; cap.title = sl.full || sl.cap;
    wrap.appendChild(cap);
    const u = svUrl(sl.src);
    /* 署名を待っている間も枠（押す先）は同じ形で置き、画像だけ後から入れる（svFillUrls・#637） */
    const wait = !u && sv.urlsPending && !!sl.src;
    if (u || wait) {
      const idx = sv.lboxList.length;
      sv.lboxList.push({ src: u, rel: sl.src, cap: (s ? svUnitN(s.n) + ' ' : '') + (sl.full || sl.cap) });
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'shot';
      b.setAttribute('aria-label', sl.cap + 'を大きく見る');
      if (u) {
        const im = document.createElement('img');
        im.src = u; im.alt = sl.cap; im.loading = 'lazy';
        b.appendChild(im);
      } else { b.dataset.svRel = sl.src; b.dataset.svAlt = sl.cap; }
      b.addEventListener('click', () => svOpenLbox(idx));
      wrap.appendChild(b);
    } else {
      /* **枠は必ず作る**。中は「素材なし」（作らない設計のときだけ理由を添える）。
         前の1コマから続く作りのときだけ、文言そのものを差し替える（sl.none・#523） */
      const nne = document.createElement('div');
      nne.className = 'none';
      nne.appendChild(document.createTextNode(sl.none || '素材なし'));
      if (sl.why) {
        const w = document.createElement('span');
        w.className = 'rsub'; w.textContent = sl.why;
        nne.appendChild(w);
      }
      wrap.appendChild(nne);
    }
    return wrap;
  };
  /* 素材表が無い／そのシーンに無いときも、上段2枠と下段の参照画像の枠は同じ大きさで出す */
  const kind = (sv.mat && s) ? s.end_kind : 'frame';
  /* 開始の絵を作らない作り（start_kind:'chain'）のときは「素材なし」ではなく、
     前の1コマから続くことを書く。**枠の位置と大きさは変えない**（#523） */
  const startKind = (sv.mat && s) ? s.start_kind : 'frame';
  const top = document.createElement('div');
  top.className = 'sv-shelfrow';
  top.appendChild(slotEl({ cap: kind === 'still' ? '静止（1枚）' : '開始フレーム',
    src: (sv.mat && s) ? s.start_img : null,
    none: startKind === 'chain' ? '前の' + svUnit() + 'の最後の1コマから続きます' : null }));
  const sep = document.createElement('span');
  sep.className = 'sv-sep'; sep.textContent = '→';
  top.appendChild(sep);
  top.appendChild(slotEl(
    kind === 'still' ? { cap:'終了フレーム', src:null, why:'静止の' + svUnit() + 'なので作りません' }
    : kind === 'free' ? { cap:'終了フレーム', src:null, why:'この' + svUnit() + 'は作らない設計です' }
    : { cap:'終了フレーム', src: (sv.mat && s) ? s.end_img : null }));
  shelf.appendChild(top);

  const refs = (sv.mat && s) ? s.refs : [];
  const rbox = document.createElement('div');
  rbox.className = 'sv-refbox';
  const hd = document.createElement('div');
  hd.className = 'refhd'; hd.textContent = svRefWord();
  const cnt = document.createElement('span');
  cnt.className = 'n'; cnt.textContent = refs.length + '枚';
  hd.appendChild(cnt);
  rbox.appendChild(hd);
  const row = document.createElement('div');
  row.className = 'sv-shelfrow';
  if (refs.length) {
    /* 見出しは「①」＋目録の label **そのまま**（番号は動画全体の通し番号・上の svRefNos）。拡大表示の題は
       「参照①」＋label。画面は言葉を足さない——label は提出側が具体的な名前で書く（例
       「アクアラインを横から見た断面図（形の手本）」）。オーナーが「S14 の参照②」と番号で
       指摘できるように、**番号は画面が並び順で振る**（目録の形は変えない・全番組共通・#549
       オーナー指示 2026-09-25）。label の頭に提出側の番号（旧「①閉じた列」）が付いていたら外す */
    const nos = svRefNos(sv.mat);
    refs.forEach((r, i) => {
      const no = svRefNo(nos.get(r.img || r.label || '') || (i + 1));
      const lb = svRefLabel(r.label);
      row.appendChild(slotEl({ cap: lb ? no + ' ' + lb : no, src: r.img,
        full: svRefShort() + no + (lb ? ' ' + lb : '') }));
    });
  } else {
    /* 0枚のシーンも枠を1つ出す（欄ごと消さない） */
    row.appendChild(slotEl({ cap: svRefWord(), src:null }));
  }
  rbox.appendChild(row);
  shelf.appendChild(rbox);
  now.appendChild(shelf);
}

/* ── 大きく表示（ライトボックス）── */
function svOpenLbox(i){
  if (!sv || !sv.lboxList.length) return;
  const x = sv.lboxList[i];
  if (x && !x.src) return;                 /* 署名を待っている枠（届くまでは開かない・#637） */
  svStopBoth();
  sv.lboxI = Math.max(0, Math.min(sv.lboxList.length - 1, i));
  svPaintLbox();
  sv.q('[data-sv-lbox]').hidden = false;
  sv.q('[data-svact="lbox-close"]').focus({ preventScroll: true });
}
function svPaintLbox(){
  const x = sv.lboxList[sv.lboxI];
  if (!x) return;
  sv.q('[data-sv-lboximg]').src = x.src || svUrl(x.rel) || '';
  sv.q('[data-sv-lboximg]').alt = x.cap;
  sv.q('[data-sv-lboxcap]').textContent = x.cap + '（' + (sv.lboxI + 1) + '/' + sv.lboxList.length + '）';
  sv.q('[data-svact="lbox-prev"]').disabled = (sv.lboxI === 0);
  sv.q('[data-svact="lbox-next"]').disabled = (sv.lboxI === sv.lboxList.length - 1);
}
const svLboxOpen = () => !!(sv && sv.q('[data-sv-lbox]') && !sv.q('[data-sv-lbox]').hidden);
function svCloseLbox(){
  if (!sv) return;
  sv.q('[data-sv-lbox]').hidden = true;
  sv.q('[data-sv-lboximg]').src = '';
}
function svStepLbox(d){
  const n = sv.lboxI + d;
  if (n < 0 || n >= sv.lboxList.length) return;
  sv.lboxI = n; svPaintLbox();
}

/* ── 参照動画（完成動画が親・そのシーンの頭＝0秒で常時連動）────────────────
   参照のほうが短ければ末尾で止めて知らせ、長ければシーンが変わった時点で次の参照へ替わる。
   速度は変えない。 */
/* 参照動画の候補。そのシーンに参照動画が無く、主画面が本物の映像（借りていない）で、目録に
   通しの参照動画（ref_video_full）があるなら、通しを候補にする（オーナー指摘 2026-09-23:
   H3 の映像が入った途端に右のモックが消えた）。通しは主画面と同じ時間軸なので `full:true` を付け、
   同期の起点をシーンの頭ではなく 0 秒にする */
const svRefList = () => {
  const s = svSceneByN(sv.curN);
  if (s && s.ref_videos && s.ref_videos.length) return s.ref_videos;
  if (sv.mat && sv.mat.ref_video_full && !sv.mainLabel) return [{ ...sv.mat.ref_video_full, full: true }];
  return [];
};
function svPaintRefFace(){
  if (!sv || !sv.q('[data-sv-refempty]')) return;
  const vids = svRefList();
  let msg = null, sub = '';
  if (!vids.length) {
    /* 列は常に出す（オーナー指摘 2026-09-21）。動画ぜんたいに1本も無いのか、
       このシーンに無いだけなのかで言葉を分ける。
       借りている状態では、この枠は**本来の動画の位置**なので言葉もそちらに合わせる */
    msg = '素材なし';
    sub = svBorrowed() ? '映像はまだありません'
        : sv.hasRefVideo ? 'この' + svUnit() + 'は参照動画なし'
        : 'この動画には参照動画がありません';
  } else if (sv.urlsPending && !svUrl(vids[sv.refIdx] ? vids[sv.refIdx].src : null)) {
    /* 署名を待っている間は言葉を出さない（「まだありません」と出してから動画に替わらないように・#637） */
    msg = null;
  } else if (!svUrl(vids[sv.refIdx] ? vids[sv.refIdx].src : null)) {
    msg = 'まだありません';
    sub = 'この版では参照動画がまだ用意されていません。';
  } else if (!sv.refLoadOK) {
    msg = '読み込めません';
    sub = '参照動画を開けませんでした。';
  }
  const face = sv.q('[data-sv-refempty]');
  if (face.hidden !== !msg) face.hidden = !msg;
  if (msg) {
    setText(sv.q('[data-sv-refemptyt]'), msg);
    setText(sv.q('[data-sv-refemptys]'), sub);
  }
}
/* 目録の画像の署名が届いたら、待っていた枠に画像を入れる（#637）。枠は作り直さないので、並びも大きさも動かない。
   署名が取れなかった画像があれば、今までどおり「素材なし」の面で描き直す。参照動画も署名が要るので合わせ直す */
function svFillUrls(){
  if (!sv) return;
  let miss = false;
  sv.root.querySelectorAll('[data-sv-rel]').forEach(el => {
    const u = svUrl(el.dataset.svRel);
    if (!u) { miss = true; return; }
    const im = document.createElement('img');
    im.loading = 'lazy';
    if (el.classList.contains('sth')) {          /* 台本の行のサムネ */
      im.className = 'sth'; im.alt = ''; im.src = u;
      el.replaceWith(im);
    } else {                                     /* いまのシーンの素材の枠 */
      im.alt = el.dataset.svAlt || ''; im.src = u;
      delete el.dataset.svRel; delete el.dataset.svAlt;
      el.appendChild(im);
    }
  });
  for (const x of sv.lboxList) if (!x.src && x.rel) x.src = svUrl(x.rel);
  if (miss) { svBuildScript(); svSyncScene(true); return; }
  svApplyRef();
}
function svApplyRef(){
  const vids = svRefList();
  if (sv.refIdx >= vids.length) sv.refIdx = 0;
  const pick = sv.q('[data-sv-refpick]');
  pick.textContent = '';
  if (vids.length > 1) {
    vids.forEach((rv, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = String(i + 1);
      b.setAttribute('aria-label', '参照動画 ' + (i + 1) + '/' + vids.length);
      b.setAttribute('aria-pressed', String(i === sv.refIdx));
      b.addEventListener('click', () => { sv.refIdx = i; svApplyRef(); });
      pick.appendChild(b);
    });
    pick.hidden = false;
  } else if (!pick.hidden) { pick.hidden = true; }
  const want = vids.length ? svUrl(vids[sv.refIdx].src) : null;
  setText(sv.q('[data-sv-reflbl]'), vids.length
    ? ((vids[sv.refIdx].label || '動きの手本')
       + (vids.length > 1 ? '（' + (sv.refIdx + 1) + '/' + vids.length + '本目）' : ''))
    : (svBorrowed() ? '' : '—'));
  if (want !== sv.refSrc) {
    sv.refvid.pause();
    sv.refSrc = want;
    sv.refLoadOK = true;
    sv.q('[data-sv-refdone]').hidden = true;
    if (want) { sv.refvid.src = want; sv.refvid.load(); }
    else { sv.refvid.removeAttribute('src'); try { sv.refvid.load(); } catch (_) {} }
  }
  sv.refvid.muted = true;
  svPaintRefFace();
  svLinkRef();
}
function svLinkRef(){
  if (!sv || !sv.refSrc || !sv.refLoadOK || !sv.ctl) return;
  const v = sv.ctl.video, rv = sv.refvid;
  const d = (rv.duration && isFinite(rv.duration)) ? rv.duration : 0;
  const s = svSceneByN(sv.curN);
  if (!d || !s) return;
  const cur = svRefList()[sv.refIdx];
  const target = Math.max(0, v.currentTime - ((cur && cur.full) ? 0 : s.start));
  if (target >= d - 0.04) {
    if (!rv.paused) rv.pause();
    if (Math.abs(rv.currentTime - (d - 0.04)) > 0.12) { try { rv.currentTime = Math.max(0, d - 0.04); } catch (_) {} }
    sv.q('[data-sv-refdone]').hidden = false;
    return;
  }
  sv.q('[data-sv-refdone]').hidden = true;
  if (Math.abs(rv.currentTime - target) > (v.paused ? 0.04 : 0.3)) {
    try { rv.currentTime = target; } catch (_) {}
  }
  if (v.paused) { if (!rv.paused) rv.pause(); }
  else if (rv.paused) rv.play().catch(() => {});
}
function svStopBoth(){
  if (!sv) return;
  if (sv.ctl) sv.ctl.video.pause();
  if (sv.refvid) sv.refvid.pause();
}

/* ── いまのシーン（同じシーンの間は作り直さない＝ちらつかせない）── */
function svCurN(){
  const rows = svScenes();
  if (!rows.length) return null;
  if (sv.ctl && !sv.manual) { const s = svSceneAt(sv.ctl.video.currentTime); return s ? s.n : null; }
  return sv.manualN != null ? sv.manualN : rows[0].n;
}
function svSyncScene(force){
  if (!sv) return;
  const n = svCurN();
  if (!force && n === sv.curN) return;
  sv.curN = n;
  sv.refIdx = 0;
  svPaintNow();
  svPaintScript();
  svPaintPrevCur();
  svPaintNotesCur();
  svApplyRef();
}
function svGoScene(n){
  const s = svSceneByN(n);
  if (!s || !sv) return;
  sv.manualN = n;
  if (sv.ctl) {
    sv.manual = false;
    sv.ctl.video.pause();
    try { sv.ctl.video.currentTime = s.start + 0.05; } catch (_) {}
    sv.ctl.paint();
  }
  svSyncScene(true);
}

/* ── ③ 前回までの私の指摘（新しい順にそのまま出す）── */
function svBuildPrev(){
  const box = sv.q('[data-sv-prevlist]');
  box.textContent = '';
  sv.prevRows = [];
  setText(sv.q('[data-sv-prevcount]'), sv.prev.length + '件');
  if (!sv.prev.length) {
    const e = document.createElement('div');
    e.className = 'sv-prevempty'; e.textContent = '前回までの指摘はありません';
    box.appendChild(e);
    return;
  }
  for (const p of sv.prev) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'sv-prow';
    const m = document.createElement('span'); m.className = 'm';
    if (p.rev != null) {
      const r = document.createElement('span');
      r.className = 'rev'; r.textContent = 'v' + String(p.rev).padStart(2, '0');
      m.appendChild(r);
    }
    const dt = document.createElement('span'); dt.className = 'dt'; dt.textContent = p.when;
    m.appendChild(dt);
    if (p.t != null) {
      const tm = document.createElement('span'); tm.className = 'tm'; tm.textContent = fmtT(p.t);
      m.appendChild(tm);
    }
    if (p.scene != null) {
      const sc = document.createElement('span'); sc.className = 'sc';
      sc.textContent = svUnitN(p.scene) + (p.title ? '「' + p.title + '」' : '');
      m.appendChild(sc);
    }
    /* どの案を見て書いた指摘かの小さな印（いまの索引に載っている案だけ名前が出る） */
    const pvl = svVariantLabel(p.variant);
    if (pvl) {
      const vb = document.createElement('span'); vb.className = 'sc'; vb.textContent = pvl;
      m.appendChild(vb);
    }
    if (p.tag) {
      const g = document.createElement('span'); g.className = 'gbadge fix'; g.textContent = p.tag;
      m.appendChild(g);
    }
    b.appendChild(m);
    if (p.body) {
      const t = document.createElement('span'); t.className = 'b'; t.textContent = p.body;
      b.appendChild(t);
    }
    /* 押すとその時刻へ。ピンが出るのはいま見ている版に付いた指摘だけ */
    b.addEventListener('click', () => {
      if (p.t == null) return;
      if (tap) tapGoto(p.t, p.pin);
      else if (sv.ctl) { sv.ctl.video.pause();
        try { sv.ctl.video.currentTime = p.t; } catch (_) {}
        sv.ctl.paint(); }
      sv.manual = false;
      svSyncScene();
    });
    box.appendChild(b);
    sv.prevRows.push({ el: b, scene: p.scene });
  }
  svPaintPrevCur();
}
/* いま見ているシーンへの指摘の行を強調する（並びは変えない・付け替えるだけ） */
function svPaintPrevCur(){
  if (!sv || !sv.prevRows) return;
  for (const r of sv.prevRows) r.el.classList.toggle('cur', r.scene != null && r.scene === sv.curN);
}

/* ── 下端バーの左（事実だけ・良し悪しは書かない）── */
function svPaintWatch(){
  if (!sv || !sv.ctl) return;
  const d = Math.max(1, Math.ceil(sv.ctl.dur() || 0));
  const bar = sv.q('[data-sv-watchbar]');
  if (!bar) return;
  bar.textContent = '';
  let n = 0, run = -1;
  for (let i = 0; i <= d; i++) {
    const on = (i < d) && sv.watched[i];
    if (on) { n++; if (run < 0) run = i; }
    if (!on && run >= 0) {
      const seg = document.createElement('i');
      seg.style.left = (run / d * 100) + '%';
      seg.style.width = ((i - run) / d * 100) + '%';
      bar.appendChild(seg);
      run = -1;
    }
  }
  const pct = Math.min(100, Math.round(n / d * 100));
  setText(sv.q('[data-sv-watchpct]'), pct >= 100 ? '最後まで見ました' : (pct + '%'));
}
function svPaintBar(){
  if (!sv || !sv.root.isConnected) return;
  const st = sv.q('[data-sv-state]'), cnt = sv.q('[data-sv-ncount]');
  const n = (tap && tap.mode === 'edit' && tap.vid === sv.it.id) ? tap.items.length : null;
  setText(cnt, n == null ? '見るだけ' : (n + '件'));
  setText(st, n == null ? 'この画面では指摘を足せません' : ('指摘 ' + n + '件'));
  const next = sv.q('[data-sv-next]');
  if (next) {
    /* 承認の先＝工程の帯で、いまの位置より後ろの最初の「使う工程」。作業中の記録がある動画（#637）は
       帯の位置が作業の工程なので、承認ポイントの位置から数える */
    const cur = (sv.it._work && SV_GATE_STEP[sv.gate] != null) ? SV_GATE_STEP[sv.gate] : svFlowAt(sv.it);
    const skip = SV_SKIP(sv.it);
    const nx = SV_STEPS.findIndex((_, i) => i > cur && !skip[i]);
    const after = nx < 0 ? null : SV_STEPS[nx].name;
    /* 検証用の動画は先の工程が決まっていない＝承認しても制作は動かない（#523） */
    setText(next, !(sv.it._rv === sv.gate) ? ''
      : isPilotItem(sv.it) ? '記録に残るだけで、制作は自動では動きません。'
      : (after ? (GATE_CAUTION[sv.gate] || `承認すると「${after}」へ進みます`) : ''));
  }
}

/* ── 主画面の動画と案（#523）─────────────────────────────────────────
   主画面に出すのは「その承認ポイントのフォルダの {承認ポイント}_v{NN}.mp4」。無ければ
   目録の「通しの参照動画」（ref_video_full）。どちらも無ければこの画面は使わない。 */
/* dir＝置き場のフォルダ名（動画の名前の頭もこれ: final/final_v01.mp4・storyboard/storyboard_v01.mp4）。
   latest＝進行係を通らない動画（#569）。置き場が1つなので、別の版の提出が同じフォルダに並ぶ——
   **置き場の中でいちばん新しい版**（動画と目録の版の大きい方）の動画だけを主画面にする。
   その版が目録だけ（仮組みだけの提出）なら null を返し、その版の通しの仮組みを主画面に借りる。
   古い版の完成動画を新しい版の仮組みより先に出さないため */
function svMainFile(files, dir, latest){
  const re = new RegExp('^' + dir + '_v(\\d+)\\.[A-Za-z0-9]+$', 'i');
  let best = null, bv = -1;
  for (const f of files) {
    if (f.kind !== 'video' || !f.url) continue;
    const m = re.exec(f.name || '');
    if (m && Number(m[1]) > bv) { bv = Number(m[1]); best = f; }
  }
  if (best) return (latest && svNewestMaterialsVer(files) > bv) ? null : best;
  /* 完成だけは 02・03 の従来どおり「決まりの名前が無ければ最後の動画」を使う。
     絵コンテは決まりの名前だけを候補にする——**関係のない動画が通しの仮組みより先に出る**のを
     防ぐため（#523 のレビュー指摘8）。ここで null を返せば ref_video_full へ落ちる */
  if (dir !== 'final') return null;
  const vids = files.filter(f => f.kind === 'video' && f.url);
  return vids.length ? vids[vids.length - 1] : null;
}
/* 置き場の直下の目録（materials_vNN.json）の最大の版。無ければ -1 */
function svNewestMaterialsVer(files){
  let v = -1;
  for (const f of files) { const m = RE_MATERIALS.exec(f.name || ''); if (m && Number(m[1]) > v) v = Number(m[1]); }
  return v;
}
/* 置き場の直下の「案なしの提出」の最大の版（決まりの名前の動画か目録）。無ければ -1 */
function svNewestTopVer(files, dir){
  const re = new RegExp('^' + dir + '_v(\\d+)\\.[A-Za-z0-9]+$', 'i');
  let v = svNewestMaterialsVer(files);
  for (const f of files) { const m = f.kind === 'video' && re.exec(f.name || ''); if (m && Number(m[1]) > v) v = Number(m[1]); }
  return v;
}
/* ファイル名の中の版（`…_v08.mp4` → 8）。無ければ null */
const verOfName = name => { const m = /_v(\d+)(?:\.|$)/i.exec(String(name || '')); return m ? Number(m[1]) : null; };
/* 案の索引（同じ検証の複数の案）。索引の**版**も返す——案の目録と動画はこの版で揃える。
   無ければ {ver:null, list:[]}＝今までどおりタブは出ない。
   latest（進行係を通らない動画・#569）のときは、索引より新しい版の「案なしの提出」が置き場の
   直下にあれば索引を使わない（同じ版なら、提出の入口が案なしのときに空の索引で上書きする） */
function svVariants(files, latest, dir){
  let best = null, bv = -1;
  for (const f of files) {
    const m = RE_VARIANTS.exec(f.name || '');
    if (!m || f.text == null) continue;
    if (Number(m[1]) > bv) { bv = Number(m[1]); best = f.text; }
  }
  if (best == null) return { ver: null, list: [] };
  if (latest && svNewestTopVer(files, dir || ONE_DIR) > bv) return { ver: null, list: [] };
  try {
    const o = JSON.parse(best);
    if (!o || Number(o.v) !== 1 || !Array.isArray(o.variants)) return { ver: null, list: [] };
    return { ver: bv, list: o.variants.filter(x => x && x.key && x.dir).map(x => ({
      key: String(x.key), label: String(x.label || x.key),
      dir: String(x.dir).replace(/^\/+|\/+$/g, ''),
      video: x.video ? String(x.video) : null
    })) };
  } catch (_) { return { ver: null, list: [] }; }
}
const svVariantLabel = key => {
  if (!key || !sv || !sv.variants) return null;
  const v = sv.variants.find(x => x.key === key);
  return v ? v.label : null;
};

/* 1つの「見せるもの」（目録・署名URL・主画面の動画）をそろえる。
   案のタブが無ければ動画と同じフォルダから、あれば案のフォルダから読む。 */
/* dir＝置き場（承認ポイントではない・#569）。latest＝進行係を通らない動画（置き場の中の最新の版だけ） */
async function svSource(ch, seq, dir, files, v, ver, latest){
  const out = { mat:null, urls:{}, videoUrl:null, videoName:null, mainLabel:null };
  if (!v) {
    const f = svMainFile(files, dir, latest);
    /* 目録は動画と同じ版だけを使う。置き場はいちばん新しい版と主画面の動画の版を先に取ってある（#637）が、
       合わなければここで取る */
    const need = f && ensureVerTexts(files, RE_MATERIALS, f.name, false);
    if (need) await need;
    out.mat = sceneMaterials(files, f ? f.name : '');
    if (f) { out.videoUrl = f.url; out.videoName = f.name; }
  } else {
    /* 案の目録は**索引と同じ版**だけを使う（`variants_v08.json` なら `materials_v08.json`）。
       いちばん新しいものを拾うと、古い動画と新しい目録が組み合わさる（#523 のレビュー指摘3） */
    const base = assetPath(ch, seq, dir) + '/' + v.dir;
    let name = null;
    try {
      const { data } = await sb.storage.from(ASSET_BUCKET)
        .list(base, { limit: 100, sortBy: { column:'name', order:'asc' } });
      for (const f of (data || [])) {
        const m = RE_MATERIALS.exec(f.name || '');
        if (m && ver != null && Number(m[1]) === Number(ver)) { name = f.name; break; }
      }
    } catch (_) { /* 読めなければ目録なしで出す */ }
    if (name) {
      try {
        const { data: blob } = await sb.storage.from(ASSET_BUCKET).download(base + '/' + name);
        if (blob) out.mat = parseMaterials(await blob.text());
      } catch (_) {}
    }
    /* 動画も索引の video だけ。名前に版が入っていて索引の版と違うものは使わない */
    if (v.video && !(verOfName(v.video) != null && ver != null && verOfName(v.video) !== Number(ver))) {
      const u = await svSign(ch, seq, dir, [v.video]);
      out.videoUrl = u[v.video] || null;
      out.videoName = v.video.split('/').pop();
    }
  }
  if (out.mat) {
    out.urls = await svSign(ch, seq, dir, svMatRels(out.mat), v ? v.dir : null);
    /* 主画面の動画がまだ無ければ、通しの参照動画を主画面にする（左の見出しは目録の label） */
    if (!out.videoUrl && out.mat.ref_video_full) {
      out.videoUrl = out.urls[out.mat.ref_video_full.src] || null;
      out.videoName = out.mat.ref_video_full.src.split('/').pop();
      out.mainLabel = out.mat.ref_video_full.label;
    }
  }
  return out;
}
/* 目録が指している画像・動画（署名が要るもの）の相対パス */
function svMatRels(mat){
  const rels = [];
  if (!mat) return rels;
  for (const s of mat.scenes) {
    rels.push(s.start_img, s.end_img);
    for (const r of s.refs) rels.push(r.img);
    for (const r of s.ref_videos) rels.push(r.src);
  }
  if (mat.ref_video_full) rels.push(mat.ref_video_full.src);
  return rels;
}
/* 案の無い画面の「見せるもの」を、画面を組み立てる前にそろえる（#637・svSource の案なしと同じ中身）。
   主画面の動画は置き場を読んだ時点で署名済みなので、それで先に読み始め、目録の画像の署名は待たずに並べて取る
   （urlsP。届いたら svFillUrls が枠に画像を入れる）。控えに全部あれば待たずに使う。待つのは、主画面に出す動画が
   無く目録の通しの仮組みを借りる回（その署名が要る）と、先に取っていない版の目録・時刻表があるときだけ */
async function svPrepare(it, plan){
  const { dir, files } = plan;
  const latest = offDispatcherItem(it);
  const f = svMainFile(files, dir, latest);
  const needM = f && ensureVerTexts(files, RE_MATERIALS, f.name, false);
  if (needM) await needM;
  const mat = sceneMaterials(files, f ? f.name : '');
  const out = { mat, urls: {}, urlsP: null, videoUrl: f ? f.url : null, videoName: f ? f.name : null, mainLabel: null };
  const rels = [...new Set(svMatRels(mat).filter(Boolean))];
  if (rels.length) {
    const hit = svSignHit(it.channel, it.seq, dir, rels, null);
    if (hit) out.urls = hit;
    else {
      const p = svSign(it.channel, it.seq, dir, rels, null);
      if (!out.videoUrl && mat.ref_video_full) out.urls = await p;
      else out.urlsP = p;
    }
  }
  if (!out.videoUrl && mat && mat.ref_video_full) {
    out.videoUrl = out.urls[mat.ref_video_full.src] || null;
    out.videoName = mat.ref_video_full.src.split('/').pop();
    out.mainLabel = mat.ref_video_full.label;
  }
  /* 時刻表も動画と同じ版だけ（版の無い名前なら全部・tapTimeline は先頭の版を使う） */
  const needT = ensureVerTexts(files, RE_TIMELINE, out.videoName, true);
  if (needT) await needT;
