/* ── 素材の描画 ─────────────────────────────────────────────── */
const NO_ASSET = `<div class="noitem">まだ素材がありません
  <span class="s">制作が進むとここに入ります</span></div>`;

function assetHead(f){
  return `<div class="ahead"><span class="anm">${esc(f.name)}</span>
    ${f.size != null ? `<span class="asz">${esc(fmtSize(f.size))}</span>` : ''}
    ${f.url ? `<a class="alink" href="${esc(f.url)}" target="_blank" rel="noopener noreferrer">別タブで開く</a>` : ''}</div>`;
}

/* 台本(.md)向けの軽量 Markdown レンダラー。
   XSS対策: 本文は必ず esc() でエスケープしてから、既知パターンだけをタグ化する
   （生HTMLは一切通さない）。台本で使う記法（見出し/太字/箇条書き/番号/水平線/【見出し】）に限定。 */
function mdInline(s){
  return esc(s)
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    /* 斜体（*…*）。太字を先に消してから拾い、前後が空白の * は掛け算とみなして触らない */
    .replace(/(^|[^*\w])\*([^\s*][^*\n]*[^\s*]|[^\s*])\*(?!\*)/g, '$1<em>$2</em>')
    .replace(/(【[^】]+】)/g, '<strong class="mdtag">$1</strong>');
}
function mdToHTML(src){
  const lines = String(src == null ? '' : src).replace(/\r\n?/g, '\n').split('\n');
  let out = '', list = null;
  const closeList = () => { if (list) { out += `</${list}>`; list = null; } };
  for (const raw of lines) {
    const line = raw.replace(/\s+$/, '');
    if (!line.trim()) { closeList(); continue; }
    if (/^\s*([-*_]\s*){3,}$/.test(line)) { closeList(); out += '<hr>'; continue; }
    let m = /^(#{1,6})\s+(.*)$/.exec(line);
    if (m) { closeList(); const lv = m[1].length; out += `<h${lv} class="mdh mdh${lv}">${mdInline(m[2])}</h${lv}>`; continue; }
    m = /^\s*\d+[.)]\s+(.*)$/.exec(line);
    if (m) { if (list !== 'ol') { closeList(); out += '<ol>'; list = 'ol'; } out += `<li>${mdInline(m[1])}</li>`; continue; }
    m = /^\s*(?:[-*]\s+|・\s*)(.*)$/.exec(line);
    if (m) { if (list !== 'ul') { closeList(); out += '<ul>'; list = 'ul'; } out += `<li>${mdInline(m[1])}</li>`; continue; }
    closeList(); out += `<p>${mdInline(line)}</p>`;
  }
  closeList();
  return out;
}

/* ── 素材のバージョン（#209）──────────────────────────────────────
   差し戻して再提出するたび `…_v02.pdf` のように版が増え、古い版も Storage に残る
   （例: storyboard_v01.pdf / storyboard_v02.pdf / storyboard_v02_p01〜p17.jpg）。
   全部を縦に並べるとスマホで延々スクロールになるので、既定では最新版だけを開き、
   古い版は畳んで残す（消さない）。`_vNN` を持たないファイルは版の概念が無いので常に出す。 */
const assetVer = name => { const m = /_v(\d+)/i.exec(String(name)); return m ? m[1] : null; };
const verNum = v => Number(v);

function assetsHTML(files, tapMode){
  if (!files.length) return NO_ASSET;
  /* 版の一覧（新しい順）。同じ番号は表記のばらつき（v1/v01）を避けて数値で束ねる */
  const vs = [...new Set(files.map(f => assetVer(f.name)).filter(v => v != null))]
    .sort((a, b) => verNum(b) - verNum(a));
  if (!vs.length) return assetBlocksHTML(files, tapMode);  /* 版なし＝従来どおり全部表示 */

  const latest = vs[0];
  const isLatest = f => { const v = assetVer(f.name); return v == null || verNum(v) === verNum(latest); };
  /* 最新版は「その版のファイルすべて」（PDF＋ページ画像17枚など）をまとめて出す */
  const head = `<div class="verbar"><span class="vchip">v${esc(latest)}（最新）</span>${
    vs.length > 1 ? `<span class="vnote">以前の版は下に畳んであります</span>` : ''}</div>`;
  const olds = vs.slice(1).map(v => {
    const list = files.filter(f => verNum(assetVer(f.name)) === verNum(v));
    return `<details class="oldver">
      <summary class="dsum">以前の版（v${esc(v)}）<span class="n">（${list.length}件）</span></summary>
      <div class="assets">${assetBlocksHTML(list)}</div></details>`;
  }).join('');
  /* 自前の操作バー（タップ入力）は最新版の動画にだけ付ける。以前の版は見るだけ */
  return head + assetBlocksHTML(files.filter(isLatest), tapMode) + olds;
}

/* ── 動画の枠（#509 段1 → 段4 でタップ入力）───────────────────────────────
   tapMode が無ければブラウザ既定の操作バー（controls）のまま（台本・絵コンテ・以前の版）。
   'edit'（完成の承認待ち）と 'view'（見るだけ）では自前の操作バーに差し替える——既定の
   操作バーは画面の下半分のタップを吸ってしまい、「気になる場所を指す」ができないため。
   ⚠️ crossorigin はサムネイルの切り出し（canvas）に要るが、これを付けたせいで動画が
   読めなくなる取りこぼしがありうるので、armTap 側に「外して読み直す」退避を置いてある。 */
function videoBlockHTML(f, tapMode){
  if (!f.url) return `<div class="asset">${assetHead(f)}
    <div class="afiles">この動画の署名URLを取得できませんでした</div></div>`;
  if (!tapMode) return `<div class="asset">${assetHead(f)}
    <video class="avid" controls preload="metadata" playsinline src="${esc(f.url)}"></video></div>`;
  return `<div class="asset" data-tapvid="${esc(tapMode)}" data-vname="${esc(f.name)}">
    ${assetHead(f)}
    <div class="vidbox" data-vbox>
      <video preload="metadata" playsinline disablepictureinpicture crossorigin="anonymous"
             src="${esc(f.url)}"></video>
      <div class="hitlayer${tapMode === 'edit' ? ' on' : ''}" data-hit></div>
      <div class="pin" data-pin hidden></div>
    </div>
    <div class="ctrls">
      <button class="cbtn play" type="button" data-cbtn="play" aria-label="再生・一時停止">▶</button>
      <button class="cbtn" type="button" data-cbtn="back" aria-label="0.5秒もどる">−0.5s</button>
      <button class="cbtn" type="button" data-cbtn="fwd" aria-label="0.5秒すすむ">+0.5s</button>
      <div class="seek" data-seek role="slider" aria-label="再生位置" tabindex="0"
           aria-valuemin="0" aria-valuenow="0" aria-valuemax="100">
        <div class="tptrack"><div class="tpfill" data-fill></div></div>
        <div data-marks></div>
        <div class="knob" data-knob style="left:0"></div>
      </div>
      <span class="ctime" data-ctime>0:00 / 0:00</span>
      <button class="cbtn" type="button" data-cbtn="mute" aria-label="消音">🔊</button>
    </div></div>`;
}

function assetBlocksHTML(files, tapMode){
  if (!files.length) return NO_ASSET;
  /* `…_p01.jpg` 形式は資料の「ページ」（絵コンテの各ページ等）。サムネ格子ではなく
     縦スクロールのビューアで見せる（#203） */
  const pageNo = f => { const m = /_p(\d+)\.(?:jpe?g|png)$/i.exec(f.name); return m ? Number(m[1]) : null; };
  const pages = files.filter(f => f.kind === 'image' && pageNo(f) != null)
                     .sort((a, b) => pageNo(a) - pageNo(b));
  const imgs = files.filter(f => f.kind === 'image' && pageNo(f) == null);
  const rest = files.filter(f => f.kind !== 'image');

  const blocks = rest.map(f => {
    if (f.kind === 'text') {
      if (/\.md$/i.test(f.name) && f.text != null) {
        return `<div class="asset">${assetHead(f)}<div class="mdbody">${mdToHTML(f.text)}</div></div>`;
      }
      return `<div class="asset">${assetHead(f)}<pre class="atext">${
        f.text != null ? esc(f.text) : esc(f.err || '（本文が空です）')}</pre></div>`;
    }
    if (f.kind === 'video') return videoBlockHTML(f, tapMode);
    return null;
  }).filter(Boolean);

  const others = rest.filter(f => f.kind === 'file');
  if (others.length) {
    blocks.push(`<div class="asset"><div class="afiles">${others.map(f =>
      f.url ? `<a href="${esc(f.url)}" target="_blank" rel="noopener noreferrer">${esc(f.name)}</a>${
        f.size != null ? ` <span class="asz">${esc(fmtSize(f.size))}</span>` : ''}`
        : esc(f.name)).join('')}</div></div>`);
  }
  if (pages.length) {
    blocks.unshift(`<div class="asset">
      <div class="ahead"><span class="anm">絵コンテ ${pages.length} ページ</span>
        <span class="asz">箱の中をスクロール・画像クリックで原寸</span></div>
      <div class="pageview">${pages.map((f, i) => f.url
        ? `<figure><a href="${esc(f.url)}" target="_blank" rel="noopener noreferrer">
             <img src="${esc(f.url)}" alt="${esc(f.name)}" loading="lazy" decoding="async"></a>
           <figcaption>${i + 1} / ${pages.length}</figcaption></figure>`
        : `<figure><figcaption>${esc(f.name)}（表示できませんでした）</figcaption></figure>`).join('')}</div></div>`);
  }
  if (imgs.length) {
    blocks.unshift(`<div class="asset">
      <div class="ahead"><span class="anm">画像 ${imgs.length} 点</span>
        <span class="asz">クリックで原寸表示</span></div>
      <div class="thumbs">${imgs.map(f => f.url
        ? `<a class="thumb" href="${esc(f.url)}" target="_blank" rel="noopener noreferrer" title="${esc(f.name)}">
             <img src="${esc(f.url)}" alt="${esc(f.name)}" loading="lazy"><span class="tnm">${esc(f.name)}</span></a>`
        : `<span class="thumb"><span class="tnm">${esc(f.name)}</span></span>`).join('')}</div></div>`);
  }
  return blocks.join('');
}

/* data-assets 付きの箱に非同期で素材を流し込む（再描画で箱が消えたら何もしない） */
async function mountAssets(node){
  if (!node) return;
  const { ch, seq, gate } = node.dataset;
  try {
    const a = await loadAssets(ch, seq, gate);
    if (!node.isConnected) return;
    /* シーンの時刻表は読む素材ではなく画面の裏方なので、素材の一覧には出さない（#509 段4） */
    const shown = a.files.filter(f => !RE_TIMELINE.test(f.name));
    const tapMode = tapModeFor(node, shown);
    node.innerHTML = assetsHTML(shown, tapMode);
    if (tapMode) armTap(node, a.files, tapMode);
  } catch (e) {
    if (node.isConnected) node.innerHTML = `<div class="noitem">素材を読み込めませんでした
      <span class="s">${esc(e.message || String(e))}</span></div>`;
  }
}
/* data-lazy 付きは畳んだ折りたたみの中身。開かれるまで Storage を見に行かない（#360） */
const mountAllAssets = root =>
  (root || document).querySelectorAll('[data-assets]:not([data-lazy])').forEach(mountAssets);

/* ── 素材を「見るだけ」で開く折りたたみ（#360）────────────────────────
   02（世界のバズ雑学）は絵コンテの承認ポイントを廃止した。レビュー節は承認待ち／
   【AI】修正中の動画にしか出ないので、そのままだと搬出済みの絵コンテがどこからも
   見られない。詳細画面に見るだけの畳みを足して読めるようにする（承認・コメント・没は
   付けない＝書き込みの入口はレビュー節ひとつのまま）。
     ・レビュー節に出ているゲートはここへ出さない（同じ素材を2か所に並べない）
     ・その工程に到達した動画にだけ出す（到達前は Storage にまだ何も無い）
     ・中身は開いたときに初めて読みに行く（畳んだままなら通信しない） */
const MATERIAL_FOLDS = [
  { gate:'storyboard', label:'絵コンテを見る' },
  { gate:'final',      label:'完成した動画を見る' }
];
function materialsHTML(it, rvGate){
  const cur = displayIdx(it);
  if (cur < 0) return '';                 /* 没・ネタの仕分け待ちは工程の並びの外 */
  return MATERIAL_FOLDS
    .filter(g => g.gate !== rvGate && cur >= GATE_COL[g.gate])
    .map(g => {
      const key = it.id + '|view|' + g.gate;
      return `<details class="dsec dsec-history dsec-mat" data-lazyassets="1">
        <summary class="dsum">${esc(g.label)}</summary>
        <div class="dsum-body assets" data-assets="${esc(key)}" data-lazy="1"
             data-ch="${esc(it.channel)}" data-seq="${esc(it.seq)}" data-gate="${esc(g.gate)}">
          <div class="loadbox">素材を読み込み中…</div></div></details>`;
    }).join('');
}
/* toggle は bubble しないので、畳みひとつずつに直接ぶら下げる（詳細を描き直すたびに呼ぶ） */
function armLazyAssets(root){
  (root || document).querySelectorAll('details[data-lazyassets]').forEach(d => {
    d.addEventListener('toggle', () => {
      if (!d.open) return;
      const box = d.querySelector('[data-assets][data-lazy]');
      if (!box) return;
      box.removeAttribute('data-lazy');    /* 二重読み込みを防ぐ（結果は loadAssets 側でキャッシュ） */
      mountAssets(box);
    });
  });
}

/* ══ 完成動画のタップ入力（#509 段4）══════════════════════════════════════════
   「完成」の承認待ちで mp4 を見ているときだけ出る。動画の気になる場所をタップすると、その
   再生位置とシーン名が入った入力シートが開き、定型の言葉＋一言で指摘を1件にする。送るのは
   修正依頼の受け口に添える `p_notes`（**形の正本は DB 側の検証関数**・画面はそれに合わせる）。
   **静止画は送らない**——サムネイルは画面の中で「どの指摘のことか」を見分けるためだけに作る。
   見た目と操作の正本は `dashboard/review-mockup.html`（オーナー承認済みの見本）。 */

/* 定型の言葉。2組をここ1か所に置く（画面の組み立てに直接書かない）。
   入口は「動画をタップして場所を指す」（picture）と「いまの画面にコメント」（whole）の2つだけ
   （オーナー決定 2026-09-20）。**音・ナレーションの入口は廃止**——絵の話も音の話も同じ
   「いまの画面」に書けるよう、whole の言葉に音のぶんを混ぜてある。 */
const NOTE_TAGS = {
  picture: ['文字が読めない', '動きが不自然', 'ナレーションとずれ', 'つなぎ目が変', '絵が弱い'],
  whole:   ['絵が弱い', 'テンポが遅い', 'つなぎ目が変', '話が分かりにくい',
            '読み間違い', '声が不自然', '間が長い', 'BGM・効果音', 'この場面は作り直し']
};
const NOTE_TAGS_ALL = [...new Set([...NOTE_TAGS.picture, ...NOTE_TAGS.whole])];
const NOTE_KIND_LABEL = {picture:'', whole:'▣ いまの画面 ・ '};
/* 廃止した種類（'audio'）が下書きや過去の指摘に残っていたら「いまの画面」として読む。
   **落とさない**——書いた本人には消える理由が無い（受け口は 'audio' を弾くので送る前に直す） */
const normKind = k => (k === 'picture' ? 'picture' : 'whole');
/* 受け口と同じ上限。送ってから断られないよう画面の側でも先に止める（正本は DB の検証関数） */
const NOTE_LIM = {items:50, tag:100, note:500, memo:2000, title:100};
/* 動画と同じフォルダに置かれるシーンの時刻表。内部ファイルなので素材の一覧には出さない */
const RE_TIMELINE = /^scenes_timeline_v(\d+)\.json$/i;
const TL_TOL = 1.0;        /* 表の尺と動画の尺がこれを超えて食い違ったら時刻表は使わない（秒） */
const TAP_DRAFT = 'dash.notes.v1.';   /* 送る前の下書きの置き場（動画＋ゲート＋版ごとに1つ） */

/* いま開いている動画（素材が非同期で届くので、届いた時点の「何を見ているか」をここから引く） */
let curItem = null;
/* 組み立て中の指摘ひとそろい。画面に1つしか出ないので1つだけ持つ */
let tap = null;

const fmtT = t => {
  if (!isFinite(t) || t < 0) t = 0;
  const m = Math.floor(t / 60), s = Math.floor(t % 60);
  return m + ':' + (s < 10 ? '0' : '') + s;
};

/* この素材の箱をタップ入力にするか。完成の mp4 のときだけで、承認待ちの左列なら書ける
   （'edit'）、それ以外の場所（見るだけの畳み・承認待ちでない動画）は操作バーだけ（'view'） */
function tapModeFor(node, files){
  if (node.dataset.gate !== 'final') return null;
  if (!files.some(f => f.kind === 'video' && f.url)) return null;
  const it = curItem;
  return (node.closest('.dstage') && it && it._rv === 'final') ? 'edit' : 'view';
}

/* ── 自前の操作バー ──────────────────────────────────────────────────
   ブラウザ既定の操作バーは画面の下半分のタップを吸うので、再生・0.5秒送り・シーク・消音を
   自前で持つ。ピンの座標は「映像そのものの領域」に対する 0〜1 で、object-fit:contain の
   余白は除く（枠と動画の縦横比が違っても指した場所がずれない）。余白のタップは受け付けない。 */
function armVideoBar(el){
  const $$ = s => el.querySelector(s);
  const v = $$('video'), box = $$('[data-vbox]'), pin = $$('[data-pin]');
  const seek = $$('[data-seek]'), fill = $$('[data-fill]'), knob = $$('[data-knob]');
  const marks = $$('[data-marks]'), lbl = $$('[data-ctime]');
  const play = $$('[data-cbtn="play"]'), mute = $$('[data-cbtn="mute"]');
  const ctl = { el, video: v, box, pin, canvas: true };

  const dur = () => (v.duration && isFinite(v.duration)) ? v.duration : 0;
  const paint = () => {
    const p = dur() ? (v.currentTime / dur()) : 0;
    fill.style.width = (p * 100) + '%';
    knob.style.left = (p * 100) + '%';
    seek.setAttribute('aria-valuenow', String(Math.round(p * 100)));
    lbl.textContent = fmtT(v.currentTime) + ' / ' + fmtT(dur());
  };
  ctl.paint = paint;
  ctl.dur = dur;
  /* crossorigin はサムネイルの切り出しに要るが、これのせいで動画が読めなくなることがある。
     読めなかったら**外して読み直す**（そのぶんサムネイルは作れないので「画なし」になる） */
  v.addEventListener('error', () => {
    if (v.dataset.noco === '1') return;
    v.dataset.noco = '1'; ctl.canvas = false;
    const t = v.currentTime;
    v.removeAttribute('crossorigin');
    v.load();
    v.addEventListener('loadedmetadata', () => { try { v.currentTime = t; } catch (_) {} }, { once: true });
  });
  const syncPlay = () => { play.textContent = v.paused ? '▶' : '❚❚'; };
  play.addEventListener('click', () => { if (v.paused) v.play().catch(() => {}); else v.pause(); });
  v.addEventListener('play', syncPlay);
  v.addEventListener('pause', syncPlay);
  $$('[data-cbtn="back"]').addEventListener('click', () => { v.currentTime = Math.max(0, v.currentTime - 0.5); });
  $$('[data-cbtn="fwd"]').addEventListener('click', () => { v.currentTime = Math.min(dur(), v.currentTime + 0.5); });
  mute.addEventListener('click', () => { v.muted = !v.muted; mute.textContent = v.muted ? '🔇' : '🔊'; });
  v.addEventListener('timeupdate', paint);
  v.addEventListener('loadedmetadata', () => { paint(); ctl.onmeta && ctl.onmeta(); });

  const seekAt = e => {
    const r = seek.getBoundingClientRect();
    const p = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    v.currentTime = p * dur(); paint();
  };
  let seeking = false;
  seek.addEventListener('pointerdown', e => { seeking = true; seek.setPointerCapture(e.pointerId); seekAt(e); e.preventDefault(); });
  seek.addEventListener('pointermove', e => { if (seeking) seekAt(e); });
  seek.addEventListener('pointerup', e => { seeking = false; try { seek.releasePointerCapture(e.pointerId); } catch (_) {} });
  seek.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft')  { v.currentTime = Math.max(0, v.currentTime - 0.5); e.preventDefault(); }
    if (e.key === 'ArrowRight') { v.currentTime = Math.min(dur(), v.currentTime + 0.5); e.preventDefault(); }
  });
  /* 指摘の位置を目盛りの上に赤い印で置く（どこに何件あるかが一目で分かる） */
  ctl.marks = rows => {
    marks.textContent = '';
    for (const r of rows) {
      const d = document.createElement('div');
      d.className = 'tpmark';
      d.style.left = (dur() ? (r.t / dur() * 100) : 0) + '%';
      d.title = fmtT(r.t);
      marks.appendChild(d);
    }
  };
  /* 映像の実領域（余白を除いたところ）。読めないあいだは null */
  const area = () => {
    const r = v.getBoundingClientRect(), vw = v.videoWidth || 0, vh = v.videoHeight || 0;
    if (!vw || !vh || !r.width || !r.height) return null;
    const s = Math.min(r.width / vw, r.height / vh);
    return { r, w: vw * s, h: vh * s };
  };
  ctl.point = e => {
    const a = area();
    if (!a) return null;
    const x = (e.clientX - a.r.left - (a.r.width - a.w) / 2) / a.w;
    const y = (e.clientY - a.r.top  - (a.r.height - a.h) / 2) / a.h;
    return (x < 0 || x > 1 || y < 0 || y > 1) ? null : { x, y };
  };
  ctl.showPin = (x, y) => {
    const a = area(), b = box.getBoundingClientRect();
    if (!a || !b.width || !b.height) { pin.hidden = true; return; }
    const px = (a.r.left - b.left) + (a.r.width - a.w) / 2 + x * a.w;
    const py = (a.r.top  - b.top)  + (a.r.height - a.h) / 2 + y * a.h;
    pin.style.left = (px / b.width * 100) + '%';
    pin.style.top  = (py / b.height * 100) + '%';
    pin.hidden = false;
  };
  ctl.hidePin = () => { pin.hidden = true; };
  /* いまのコマを小さな JPEG に切り出す（画面に出すだけ・送らない）。
     crossorigin を外していたら canvas が汚れて読めないので、その場合は作らない */
  ctl.thumb = (x, y) => {
    if (!ctl.canvas) return null;
    try {
      const vw = v.videoWidth || 0, vh = v.videoHeight || 0;
      if (!vw || !vh) return null;
      const w = 180, h = Math.max(1, Math.round(w * vh / vw));
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      const g = c.getContext('2d');
      g.drawImage(v, 0, 0, w, h);
      if (x != null) {
        g.beginPath();
        g.arc(x * w, y * h, Math.max(8, Math.round(w * 0.075)), 0, Math.PI * 2);
        g.lineWidth = Math.max(2, Math.round(w / 110));
        g.strokeStyle = '#ff3b30'; g.fillStyle = 'rgba(255,59,48,.22)';
        g.fill(); g.stroke();
      }
      return c.toDataURL('image/jpeg', 0.72);
    } catch (_) { ctl.canvas = false; return null; }
  };
  syncPlay(); paint();
  return ctl;
}

/* ── シーンの時刻表 ─────────────────────────────────────────────────
   動画と同じ版の表だけを使う。無い・読めない・尺が動画と 1.0 秒を超えて食い違うときは
   使わない（**推測した時刻表は指摘を別の場面に付けてしまう**）。使わないときは時刻だけ。 */
function tapTimeline(files, videoName){
  const m = /_v(\d+)\./i.exec(String(videoName || ''));
  const want = m ? Number(m[1]) : null;
  for (const f of files) {
    const t = RE_TIMELINE.exec(f.name || '');
    if (!t || f.text == null) continue;
    if (want != null && Number(t[1]) !== want) continue;
    try {
      const o = JSON.parse(f.text);
      const rows = (o && Array.isArray(o.scenes) ? o.scenes : [])
        .filter(s => s && s.start != null && s.end != null)
        .map(s => ({ n: Number(s.n), title: String(s.title == null ? '' : s.title),
                     start: Number(s.start), end: Number(s.end) }))
        .filter(s => isFinite(s.start) && isFinite(s.end));
      if (!rows.length) return null;
      return { duration: Number(o.duration) || null, scenes: rows };
    } catch (_) { return null; }
  }
  return null;
}
const tapScene = t => {
  const tl = tap && tap.tl;
  if (!tl) return null;
  return tl.scenes.find(s => t >= s.start && t < s.end) || tl.scenes[tl.scenes.length - 1] || null;
};
/* シートと一覧に出す「いつ・どこ」の1行 */
function tapWhere(kind, t, scene, title){
  const head = NOTE_KIND_LABEL[kind] || '';
  if (scene == null) return head ? head.replace(/\s*・\s*$/, '') : '';
  return head + 'シーン' + scene + (title ? '「' + title + '」' : '');
}

/* ── 下書き（送る前に画面を閉じても消えない）──────────────────────────────
   動画・ゲート・版をまとめた鍵で localStorage に持つ。**静止画は保存しない**（大きすぎる／
   送りもしない）ので、開き直したサムネイルは「画なし」になる。版が変われば古いぶんは捨てる。 */
const tapDraftKey = () => TAP_DRAFT + tap.key;
function tapDraftSave(){
  if (!tap) return;
  try {
    /* 何も書いていない状態を残さない（送ったあとに空の下書きが生き返って見える） */
    if (!tap.items.length && !tapMemoVal()) { localStorage.removeItem(tapDraftKey()); return; }
    localStorage.setItem(tapDraftKey(), JSON.stringify({
      v: 1, at: Date.now(), memo: tapMemoVal(),
      items: tap.items.map(r => ({ id:r.id, kind:normKind(r.kind), t:r.t, scene:r.scene,
        scene_title:r.scene_title, pin:r.pin, tag:r.tag, note:r.note }))
    }));
  } catch (_) {}                              /* 容量切れ・無効化は黙って諦める（入力は続く） */
}
function tapDraftLoad(){
  try {
    const mine = tapDraftKey(), pre = TAP_DRAFT + tap.vid + '|' + tap.gate + '|';
    for (let i = localStorage.length - 1; i >= 0; i--) {
      const k = localStorage.key(i);
      if (k && k.startsWith(pre) && k !== mine) localStorage.removeItem(k);
    }
    const o = JSON.parse(localStorage.getItem(mine) || 'null');
    return (o && o.v === 1 && Array.isArray(o.items)) ? o : null;
  } catch (_) { return null; }
}
function tapDraftDrop(){ try { localStorage.removeItem(tapDraftKey()); } catch (_) {} }

/* ── 右列の入力（シート・入口の行・指摘の一覧・メモ）────────────────────────
   置き場所は修正依頼の囲み（.wbox）の中。自由記述の一式と入れ替えるだけにしてあるので、
   二重送信の止め方・案内の出し先・下端のバーからの引き当ては段1のまま動く。 */
function tapPanelHTML(it){
  const id = `tp-${it.id}`;
  return `<div class="tapbox" data-tapbox hidden>
    <div class="sheet" data-sheet hidden>
      <div class="at"><span class="t" data-stime>0:00</span>
        <span class="sc" data-sscene></span>
        <span class="gbadge fix" data-smode hidden>直しています</span></div>
      <div class="tagrow" data-tagrow></div>
      <input class="noteinput" type="text" data-snote maxlength="120" aria-label="指摘の一言"
        placeholder="上の言葉を押すとここに入ります。続けて書き足せます（マイクで話しても可）">
      <div class="sacts">
        <button class="btn primary" type="button" data-tapact="add">この指摘を足す</button>
        <button class="btn ghost" type="button" data-tapact="cancel">やめる</button>
      </div></div>
    <div class="nhd">指摘<span class="n" data-ncount>0件</span></div>
    <div class="addrow">
      <div class="ahint">場所を指すときは動画をタップ</div>
      <button class="btn" type="button" data-tapact="add-whole">＋ いまの画面にコメント</button>
    </div>
    <div class="nlist" data-nlist></div>
    <div><label class="lbl" for="${id}-memo">全体へのメモ（任意）</label>
      <textarea class="memo" id="${id}-memo" data-memo maxlength="${NOTE_LIM.memo}"
        placeholder="全体を通して気になったことがあれば"></textarea></div>
  </div>`;
}

const tapEl = s => tap && tap.panel ? tap.panel.querySelector(s) : null;
const tapMemoVal = () => { const t = tapEl('[data-memo]'); return ((t && t.value) || '').trim(); };

/* 入力欄の文から、定型の言葉（札）と残りの一言を分ける（見本と同じ分け方） */
function tapSplit(v){
  let rest = v || '';
  const tags = [];
  for (const name of NOTE_TAGS_ALL) {
    if (rest.indexOf(name) >= 0) { tags.push(name); rest = rest.replace(name, ''); }
  }
  rest = rest.replace(/\s{2,}/g, ' ').replace(/^[\s、。・,.]+/, '').trim();
  return { tag: tags.length ? tags.join('・') : null, note: rest };
}

function tapBuildTags(){
  const row = tapEl('[data-tagrow]');
  const input = tapEl('[data-snote]');
  row.textContent = '';
  for (const name of (NOTE_TAGS[normKind(tap.draft.kind)] || NOTE_TAGS.picture)) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'tagbtn'; b.textContent = name;
    b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', () => {
      /* 押した言葉を入力欄に入れる（もう一度押すと外す）。そのまま書き足せる */
      let v = input.value || '';
      if (v.indexOf(name) >= 0) v = v.replace(name, '').replace(/\s{2,}/g, ' ').replace(/^\s+/, '');
      else v = (v && !/\s$/.test(v) ? v + ' ' : v) + name + ' ';
      input.value = v;
      tapSyncTags();
      input.focus({ preventScroll: true });
      try { input.setSelectionRange(v.length, v.length); } catch (_) {}
    });
    row.appendChild(b);
  }
}
function tapSyncTags(){
  const input = tapEl('[data-snote]'), v = (input && input.value) || '';
  tapEl('[data-tagrow]').querySelectorAll('.tagbtn').forEach(b =>
    b.setAttribute('aria-pressed', v.indexOf(b.textContent) >= 0 ? 'true' : 'false'));
  const add = tapEl('[data-tapact="add"]');
  if (add) {
    add.disabled = !v.trim();
    add.textContent = tap.draft && tap.draft.editId ? 'この指摘を直す' : 'この指摘を足す';
  }
}
const tapMobile = () => window.innerWidth < 900;
function tapOpenSheet(){
  const sc = tapScene(tap.draft.t);
  tapBuildTags();
  tapEl('[data-stime]').textContent = fmtT(tap.draft.t);
  tapEl('[data-sscene]').textContent =
    tapWhere(normKind(tap.draft.kind), tap.draft.t, sc ? sc.n : null, sc ? sc.title : null);
  tapEl('[data-smode]').hidden = !tap.draft.editId;
  const input = tapEl('[data-snote]');
  input.value = [tap.draft.tag ? tap.draft.tag.split('・').join(' ') : '', tap.draft.note || '']
    .filter(Boolean).join(' ');
  tapSyncTags();
  const sheet = tapEl('[data-sheet]');
  sheet.hidden = false;
  sheet.classList.toggle('float', tapMobile());
  document.body.classList.toggle('sheetopen', tapMobile());
  if (!tapMobile()) input.focus({ preventScroll: true });
}
function tapCloseSheet(){
  const sheet = tapEl('[data-sheet]');
  if (sheet) { sheet.hidden = true; sheet.classList.remove('float'); }
  document.body.classList.remove('sheetopen');
  tap.draft = null;
  tap.ctl.hidePin();
}
/* 動画のタップ（場所つき）／入口のボタン（場所なし）からの下書き開始 */
function tapStart(kind, p){
  if (!tap || tap.mode !== 'edit') return;
  if (tap.items.length >= NOTE_LIM.items && !(tap.draft && tap.draft.editId)) {
    toast(`指摘は1回に${NOTE_LIM.items}件までです`); return;
  }
  tap.ctl.video.pause();
  const t = Math.round(tap.ctl.video.currentTime * 100) / 100;
  const keep = tap.draft || {};
  tap.draft = { t, kind, x: p ? p.x : null, y: p ? p.y : null,
                tag: null, note: '', editId: keep.editId || null };
  if (p) tap.ctl.showPin(p.x, p.y); else tap.ctl.hidePin();
  tapOpenSheet();
}
function tapAdd(){
  if (!tap || !tap.draft) return;
  const input = tapEl('[data-snote]');
  const sp = tapSplit(input.value);
  if (!sp.tag && !sp.note) return;
  const d = tap.draft, sc = tapScene(d.t), kind = normKind(d.kind);
  const rec = {
    id: d.editId || tap.nextId++,
    t: Math.round(d.t * 100) / 100,
    kind,
    scene: sc ? sc.n : null,
    scene_title: sc ? (sc.title || null) : null,
    pin: kind === 'picture' && d.x != null ? { x: Math.round(d.x * 1000) / 1000, y: Math.round(d.y * 1000) / 1000 } : null,
    tag: sp.tag ? sp.tag.slice(0, NOTE_LIM.tag) : null,
    note: sp.note ? sp.note.slice(0, NOTE_LIM.note) : null,
    /* 「いまの画面」でも静止画は撮る（赤丸は付けない）——どの場面のことかを一覧で見分けるため */
    thumb: tap.ctl.thumb(kind === 'picture' ? d.x : null, d.y)
  };
  const at = tap.items.findIndex(r => r.id === rec.id);
  if (at >= 0) tap.items[at] = rec; else tap.items.push(rec);
  tap.items.sort((a, b) => a.t - b.t);
  tapCloseSheet();
  tapPaint();
}
function tapGoto(t, pin){
  if (!tap) return;
  tap.ctl.video.pause();
  try { tap.ctl.video.currentTime = t; } catch (_) {}
  if (pin) tap.ctl.showPin(pin.x, pin.y); else tap.ctl.hidePin();
  tap.ctl.paint();
}
function tapEdit(id){
  const r = tap.items.find(x => x.id === id);
  if (!r) return;
  tapGoto(r.t, r.pin);
  tap.draft = { t:r.t, kind:normKind(r.kind), x:r.pin ? r.pin.x : null, y:r.pin ? r.pin.y : null,
                tag:r.tag, note:r.note, editId:r.id };
  tapOpenSheet();
}

/* 一覧・件数・目盛りの印・下端のバーを、いまの指摘の数に合わせて描き直す */
function tapPaint(){
  if (!tap || !tap.panel) return;
  const list = tapEl('[data-nlist]');
  list.textContent = '';
  tapEl('[data-ncount]').textContent = tap.items.length + '件';
  if (!tap.items.length) {
    const e = document.createElement('div');
    e.className = 'tpempty';
    e.textContent = 'まだ指摘はありません。足した指摘がここに並びます';
    list.appendChild(e);
  }
  for (const r of tap.items) {
    const row = document.createElement('div');
    row.className = 'nitem';
    row.dataset.nid = String(r.id);
    if (r.thumb) {
      const img = document.createElement('img');
      img.className = 'th'; img.src = r.thumb; img.alt = fmtT(r.t) + ' の場面';
      row.appendChild(img);
    } else {
      const nt = document.createElement('div');
      nt.className = 'noth';
      nt.textContent = '画なし';
      row.appendChild(nt);
    }
    const meta = document.createElement('div');
    meta.className = 'meta';
    const l1 = document.createElement('div');
    l1.className = 'l1';
    const tt = document.createElement('span'); tt.className = 'tt'; tt.textContent = fmtT(r.t);
    l1.appendChild(tt);
    /* 一覧は「場所を指していない指摘」に印を1つ付けるだけにする（シートの長い札は使わない） */
    if (normKind(r.kind) !== 'picture') {
      const k = document.createElement('span'); k.className = 'sc'; k.textContent = '▣ 画面全体';
      l1.appendChild(k);
    }
    const where = tapWhere('picture', r.t, r.scene, r.scene_title);
    if (where) { const s = document.createElement('span'); s.className = 'sc'; s.textContent = where; l1.appendChild(s); }
    if (r.tag) { const g = document.createElement('span'); g.className = 'gbadge fix'; g.textContent = r.tag; l1.appendChild(g); }
    meta.appendChild(l1);
    if (r.note) { const n = document.createElement('div'); n.className = 'note'; n.textContent = r.note; meta.appendChild(n); }
    row.appendChild(meta);
    const acts = document.createElement('div');
    acts.className = 'rowacts';
    for (const [lbl, act] of [['直す', 'edit'], ['消す', 'del']]) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'btn sm'; b.textContent = lbl;
      b.dataset.tapact = act; b.dataset.nid = String(r.id);
      acts.appendChild(b);
    }
    row.appendChild(acts);
    list.appendChild(row);
  }
  tap.ctl.marks(tap.items);
  tapDraftSave();
  tapSyncBar();
}
/* 下端のバー: 件数つきの「修正を依頼」と、指摘が無いときだけ主役になる「承認」 */
function tapSyncBar(){
  const bar = tap && tap.panel && tap.panel.closest('.decide');
  if (!bar) return;
  const n = tap.items.length, filled = n > 0 || !!tapMemoVal();
  const req = bar.querySelector('.dbar [data-act="comment"]');
  const apv = bar.querySelector('.dbar [data-act="approve-quick"]');
  if (req && !req.dataset.lbl) { req.textContent = `修正を依頼（${n}件）`; req.classList.toggle('on', filled); }
  if (apv) apv.classList.toggle('primary', n === 0);
}
function tapMark(id){
  tapEl('[data-nlist]').querySelectorAll('.nitem').forEach(r =>
    r.classList.toggle('cur', r.dataset.nid === String(id)));
}

/* ── 組み立て（素材が届いてから呼ばれる）──────────────────────────────── */
function armTap(node, files, mode){
  const el = node.querySelector('[data-tapvid]');
  if (!el) return;
  const ctl = armVideoBar(el);
  if (mode !== 'edit') return;                 /* 見るだけの場所は操作バーまで */
  const it = curItem;
  const panel = document.querySelector('#view-detail .decide [data-tapbox]');
  if (!it || !panel) return;
  const box = panel.closest('[data-wbox]');
  const rev = submittedRevOf(it.id, 'final');

  tap = { mode:'edit', vid: it.id, gate:'final', rev: rev == null ? 1 : rev,
          key: it.id + '|final|' + (rev == null ? 1 : rev),
          asset: el.dataset.vname || null, items: [], nextId: 1, draft: null,
          tl: null, ctl, panel, box };

  /* 時刻表は動画の尺と突き合わせてから使う。読めるようになるのはメタデータが届いてから */
  const cand = tapTimeline(files, el.dataset.vname);
  const useTL = () => {
    if (!cand) return;
    const d = ctl.dur();
    if (cand.duration != null && d && Math.abs(cand.duration - d) > TL_TOL) { tap.tl = null; return; }
    tap.tl = cand;
  };
  if (ctl.video.readyState >= 1) useTL(); else ctl.onmeta = useTL;

  /* 自由記述の一式を引っ込めてタップ入力に差し替える（mp4 が無ければここへ来ないので、
     そのときは段1の自由記述のまま残る） */
  box.querySelectorAll('[data-freefix]').forEach(n => { n.hidden = true; });
  box.classList.add('tapon');
  panel.hidden = false;

  /* 動画のタップ・ピンのドラッグ */
  el.querySelector('[data-hit]').addEventListener('click', e => {
    const p = ctl.point(e);
    if (!p) return;                            /* 余白（object-fit の黒帯）は受け付けない */
    tapStart('picture', p);
  });
  let dragging = false;
  ctl.pin.addEventListener('pointerdown', e => {
    dragging = true; ctl.pin.classList.add('drag');
    ctl.pin.setPointerCapture(e.pointerId); e.stopPropagation(); e.preventDefault();
  });
  ctl.pin.addEventListener('pointermove', e => {
    if (!dragging || !tap.draft) return;
    const p = ctl.point(e);
    if (!p) return;
    tap.draft.x = p.x; tap.draft.y = p.y; ctl.showPin(p.x, p.y);
  });
  ctl.pin.addEventListener('pointerup', e => {
    dragging = false; ctl.pin.classList.remove('drag');
    try { ctl.pin.releasePointerCapture(e.pointerId); } catch (_) {}
    e.stopPropagation();
  });
  ctl.pin.addEventListener('click', e => e.stopPropagation());

  /* 右列（押す先はすべてこの中なので、引き当ては1か所にまとめる） */
  panel.addEventListener('click', e => {
    const b = e.target.closest('[data-tapact]');
    if (b) {
      const a = b.dataset.tapact;
      if (a === 'add-whole')      tapStart('whole', null);
      else if (a === 'add')       tapAdd();
      else if (a === 'cancel')    tapCloseSheet();
      else if (a === 'edit')      { e.stopPropagation(); tapEdit(Number(b.dataset.nid)); }
      else if (a === 'del') {
        e.stopPropagation();
        const id = Number(b.dataset.nid);
        tap.items = tap.items.filter(r => r.id !== id);
        if (tap.draft && tap.draft.editId === id) tapCloseSheet();
        tapPaint();
      }
      return;
    }
    const row = e.target.closest('.nitem');
    if (row) {
      const r = tap.items.find(x => x.id === Number(row.dataset.nid));
      if (r) { tapGoto(r.t, r.pin); tapMark(r.id); }
    }
  });
  panel.addEventListener('input', e => {
    if (e.target.matches('[data-snote]')) tapSyncTags();
    if (e.target.matches('[data-memo]'))  { tapDraftSave(); tapSyncBar(); }
  });

  /* 送る前に閉じた下書きを戻す（静止画は保存していないのでサムネイルは「画なし」になる） */
  const d = tapDraftLoad();
  if (d) {
    tap.items = d.items.filter(r => r && r.t != null).map(r => ({ thumb: null, ...r }))
      .sort((a, b) => a.t - b.t);         /* 足したときと同じ時刻順に並べ直してから出す */
    tap.nextId = Math.max(0, ...tap.items.map(r => Number(r.id) || 0)) + 1;
    const m = tapEl('[data-memo]');
    if (m && d.memo) m.value = d.memo;
  }
  tapPaint();
}
/* いまこの動画・このゲートでタップ入力が動いているか（下端のバーの送り先を決める） */
const tapActive = key => !!(tap && tap.mode === 'edit' && tap.key.startsWith(String(key) + '|'));

/* ── 送る ────────────────────────────────────────────────────────────
   本文（p_body）は受け口が notes から自動で作るので渡さない。全体へのメモは notes.memo に
   入れる。版は承認と同じ「見ていた版」を添え、裏で新しい版が出ていたら断ってもらう。 */
function tapNotes(){
  const memo = tapMemoVal();
  return {
    v: 1,
    asset: tap.asset,
    memo: memo ? memo.slice(0, NOTE_LIM.memo) : null,
    items: tap.items.slice().sort((a, b) => a.t - b.t).map((r, i) => ({
      id: i + 1,                                  /* 送るときに時刻順で振り直す */
      kind: normKind(r.kind),
      t: Math.round(r.t * 100) / 100,
      scene: r.scene == null ? null : Number(r.scene),
      scene_title: r.scene_title ? String(r.scene_title).slice(0, NOTE_LIM.title) : null,
      pin: normKind(r.kind) === 'picture' && r.pin ? { x: r.pin.x, y: r.pin.y } : null,
      tag: r.tag ? String(r.tag).slice(0, NOTE_LIM.tag) : null,
      note: r.note ? String(r.note).slice(0, NOTE_LIM.note) : null
    }))
  };
}
async function submitTapChanges(box, key){
  if (box.dataset.busy === '1' || !tapActive(key)) return;
  const [vidS, gate] = String(key).split('|');
  /* 1件も無くメモも空なら送らない（下端のバーの誤タップよけ・自由記述のときと同じ作法） */
  if (!tap.items.length && !tapMemoVal()) {
    wboxMsg(box, '直してほしい場所を動画から選ぶか、下のメモに書いてください', true, 'comment');
    const m = tapEl('[data-memo]');
    if (m) { m.scrollIntoView({ block: 'center' }); m.focus(); }
    return;
  }
  wboxMsg(box, '', false, 'comment');
  wboxBusy(box, true, 'comment');
  const { error } = await sb.rpc('request_changes', {
    p_video_id: Number(vidS), p_gate: gate, p_body: null,
    p_notes: tapNotes(), p_expected_revision: submittedRevOf(vidS, gate)
  });
  if (error) {
    wboxBusy(box, false, 'comment');
    /* 古い版を見ていた: 承認と同じくその場で取り直して描き直す（#506 高1と同じ理由）。
       描き直すと囲みごと作り直されて案内が消えるので、そのときだけ画面の外（トースト）で言う */
    if (error.code === 'P0003') { toast(rpcErrText(error, 'comment')); await refreshAfterWrite(false); return; }
    wboxMsg(box, rpcErrText(error, 'comment'), true, 'comment');
    return;
  }
  tapDraftDrop();
  tap = null;
  document.body.classList.remove('sheetopen');
  await refreshAfterWrite(false);
  toast('修正を依頼しました');
}

/* ── いま決めること（オーナー決定 2026-09-06 → 並びは 2026-09-20 に見本へ・#509 段1）──────
   右列の先頭に置く枠。中身は**ゲート名＋版**／**この版で変えたこと**／メモ／
   **修正を依頼するときの入力欄（自由記述）**。「承認をお願いします」「決めてほしいこと」
   「そのほか」といった定型文と、動画の番号・素材の置き場は画面に出さない。
   3つのボタン（没にする・修正を依頼・承認）は下端の固定バー（.dbar）に1列で並べる。
   誤タップ防止（#205）:
     ・没は2段階（バーのボタンで理由の欄が開き、理由が空のあいだ確定ボタンを押せない）
     ・修正の依頼は「入力欄に書いてから押す」（空のまま押しても送らず、入力欄に案内を出す）
     ・承認は1タップだが、押したあと数秒は「取り消す」で無かったことにできる（2026-08-20）
   ⚠️ この4つ（.abox / .wbox / .rjbox / .dbar）は必ず同じ .decide の直下に置く——
   バーのボタンは自分の外にある囲みを .decide 経由で引き当てる（actBox / writeGroup）。 */
function decideHTML(it, gate, changes){
  const key = it.id + '|' + gate;
  const gname = GATE_LABEL[gate] || gate;
  const caution = GATE_CAUTION[gate] || null;
  const pid = `ap-${it.id}-${gate}`;
  const rid = `rj-${it.id}-${gate}`;
  const sub = latestSub(threadOf(it.id));
  const ver = subRevLabel(sub);
  const measure = sub ? measureNote(sub.body) : [];
  return `<div class="decide">
    <div class="abox" data-abox="${esc(key)}">
      <div class="dcg">${esc(gname)}${ver ? ' ' + esc(ver) : ''}</div>
      ${changes.length ? `<div class="dcchg"><span class="k">変更</span>${
        changes.length === 1 ? esc(changes[0])
          : `<ul>${changes.map(c => `<li>${esc(c)}</li>`).join('')}</ul>`}</div>` : ''}
      ${measure.length ? `<div class="acaution">⚠ 基準に届かないまま出しています：${
        esc(measure.join('／'))}</div>` : ''}
      ${caution ? `<div class="acaution">⚠ ${esc(caution)}</div>` : ''}
      <details class="afold"><summary class="dsum">承認にメモを付ける（任意）</summary>
        <textarea class="ata" id="${pid}-note" rows="2" aria-label="承認メモ（任意）"
          placeholder="残したいメモがあれば入力（空欄のままで構いません）"></textarea></details>
      <div class="wmsg" data-slot="approve" hidden></div>
    </div>
    <div class="wbox fixbox" data-wbox="${esc(key)}">
      <h4 class="wh" data-freefix>修正を依頼するとき</h4>
      <textarea class="wta" data-freefix rows="3" aria-label="直してほしい点"
        placeholder="直してほしい点を入力（Ctrl + Enter で送信）"></textarea>
      ${gate === 'final' ? tapPanelHTML(it) : ''}
      <div class="wmsg" data-slot="comment" hidden></div>
      <div class="wact" data-freefix>
        <span class="whint">書いてから下の「修正を依頼」を押すと、AI が直して新しい版で出し直します</span>
      </div></div>
    <div class="rjbox" data-rjbox="${esc(key)}">
      <div class="rjpanel" id="${rid}" hidden>
        <div class="rjwarn">⚠ この動画の制作を止めて<b>ネタごと没</b>にします。表現を直したいだけなら、
          上の入力欄に書いて「修正を依頼」で伝えてください。没の取り消しはダッシュボードからはできません。</div>
        <label class="alb" for="${rid}-reason">没にする理由（必須）</label>
        <textarea class="rta" id="${rid}-reason" rows="2" aria-label="没にする理由（必須）"
          placeholder="例: 検証できないネタだった／類似動画が伸びていない"></textarea>
        <div class="anote">理由は記録され、同じネタが再び提案されたときに参照されます。</div>
        <div class="wmsg" data-slot="reject" hidden></div>
        <div class="aact">
          <button class="btn" data-act="reject-cancel">キャンセル</button>
          <button class="btn danger" data-act="reject-confirm" data-key="${esc(key)}" disabled>この理由で没にする</button>
        </div>
      </div></div>
    <div class="dbar" data-dbar="${esc(key)}">
      <button class="btn kill" data-act="reject-open" data-key="${esc(key)}"
        aria-expanded="false" aria-controls="${rid}">没にする</button>
      <button class="btn soft" data-act="comment" data-key="${esc(key)}">修正を依頼</button>
      <button class="btn primary" data-act="approve-quick" data-key="${esc(key)}"
        data-label="${esc(gname)}を承認">${esc(gname)}を承認</button>
    </div></div>`;
}

/* ── ネタの仕分けパネル（#314）──────────────────────────────────────
   台本の型カタログ（3型）に乗らずAIが起草を見送った案に対して、オーナーが
   「切り口を変える／このまま作る／没」を返す。前2つは triage_idea() RPC、
   没は既存の没パネル（reject_video・M023）をそのまま使い回す＝没の作法を
   1か所に集めておく（ゲートは台本より前の判断なので 'script' 固定）。
   囲みは wbox / rjbox の規約に乗せる（wboxBusy / wboxMsg がこの2つを探すため）。 */
function triagePanel(it){
  const rid = `rj-${it.id}-script`;
  const key = `${it.id}|script`;
  const why = it.decision_note
    ? `<div class="dsec dsec-note"><h4>AIが起草を見送った理由</h4>
        <div class="hook">${esc(sentenceWrap(it.decision_note))}</div></div>` : '';
  return `${why}
    <div class="wbox" data-wbox="${esc(key)}">
      <h4 class="wh">どうしますか</h4>
      <textarea class="wta" rows="2" aria-label="仕分けのメモ（任意）"
        placeholder="切り口の指示や、このまま作ってよい理由があれば入力（空欄でも構いません）"></textarea>
      <div class="wmsg" data-slot="comment" hidden></div>
      <div class="wact">
        <span class="whint">${it.approved_script_at
          ? 'この回は台本まで作ってあります。「このまま作る」なら台本以降の工程から再開し、「切り口を変える」なら台本から作り直します'
          : 'どちらを選んでもネタ案に戻り、次の夜にAIが拾います'}</span>
        <button class="btn soft" data-act="triage-retype" data-key="${esc(key)}"
          data-label="切り口を変える">切り口を変えて作り直す</button>
        <button class="btn primary" data-act="triage-produce" data-key="${esc(key)}"
          data-label="このまま作る">型を外してこのまま作る</button>
      </div></div>
    <div class="rjbox" data-rjbox="${esc(key)}">
      <button class="btn rjopen" data-act="reject-open" data-key="${esc(key)}"
        aria-expanded="false" aria-controls="${rid}">このネタを没にする</button>
      <div class="rjpanel" id="${rid}" hidden>
        <div class="rjwarn">⚠ このネタを<b>没</b>にします。切り口を変えれば使えそうなら、
          上の「切り口を変えて作り直す」を選んでください。没の取り消しはダッシュボードからはできません。</div>
        <label class="alb" for="${rid}-reason">没にする理由（必須）</label>
        <textarea class="rta" id="${rid}-reason" rows="2" aria-label="没にする理由（必須）"
          placeholder="例: 出典が取れない／どの型にも直しようがない"></textarea>
        <div class="anote">理由は記録され、同じネタが再び提案されたときに参照されます。</div>
        <div class="wmsg" data-slot="reject" hidden></div>
        <div class="aact">
          <button class="btn" data-act="reject-cancel">キャンセル</button>
          <button class="btn danger" data-act="reject-confirm" data-key="${esc(key)}" disabled>この理由で没にする</button>
        </div>
      </div></div>`;
}

/* 仕分けの「切り口を変える」「このまま作る」を送る。どちらも案に戻す（#314）。
   メモは任意（没だけ理由必須で、そちらは submitReject が担う） */
async function submitTriage(box, key, action){
  const vid = Number(String(key).split('|')[0]);
  const ta  = box.querySelector('.wta');
  const note = ((ta && ta.value) || '').trim();
  const act = action === 'retype' ? 'triage-retype' : 'triage-produce';

  wboxMsg(box, '', false, 'comment');
  wboxBusy(box, true, act);
  const { data, error } = await sb.rpc('triage_idea',
    { p_video_id: vid, p_action: action, p_note: note || null });
  if (error) { wboxBusy(box, false, act); wboxMsg(box, rpcErrText(error, 'triage'), true, 'comment'); return; }
  if (ta) ta.value = '';
  const skipped = !!(data && data.skipped), resumed = !!(data && data.resumed);
  await refreshAfterWrite(true);
  toast(skipped ? 'この動画はすでに仕分け済みです'
      : action === 'retype' ? '切り口を変えて作り直すよう記録しました'
      : resumed             ? '型を外して作ります。台本以降の工程から再開します'
                            : '型を外して作ってよいと記録しました');
}

/* RPC の例外はそのまま出さず、SQLSTATE から日本語の案内に置き換える */
function rpcErrText(error, act){
  const code = error && error.code;
  const raw  = String((error && error.message) || '');
  if (code === '42501' || /permission denied/i.test(raw))
    return 'このアカウントには書き込み権限がありません（ダッシュボードの許可リストを確認してください）';
  if (code === 'P0002' || /video not found/i.test(raw))
    return '対象の動画が見つかりませんでした。再読み込みしてからやり直してください';
  /* 承認が断られる理由は3つあり、次にすることが違うので文言を分ける。
     3つとも同じ P0003 で返る（画面がその場で取り直す仕掛けを共有するため）ので、
     見分けは DB が付けてくる日本語の本文で行う（074）。
     ①作り直しの最中だった: 待つしかない ②見ていた版より新しい提出が来た: 新しい方を見て押し直す
     ③どの版に付けるか分からなかった: 読み込み直せば直る */
  if (code === 'P0003' || /stale review/i.test(raw)) {
    /* 文言は「次にすること」で分ける。承認だけでなく修正の依頼もこの経路を通る（#509 段4） */
    const apv = act === 'approve';
    const cur = raw.match(/いまの版は第(\d+)版/);
    if (cur) return `いま第${cur[1]}版を作り直しています。出来上がるまでお待ちください（この画面は自動で新しくなります）`;
    if (/より新しい版/.test(raw))
      return `見ていたものより新しい版が出来ています。新しい方を見てから${
        apv ? '承認' : 'もう一度指摘'}してください（この画面は自動で新しくなります）`;
    return `どの版${apv ? 'に承認するか' : 'への指摘か'}を確かめられませんでした。画面を新しくしてからもう一度お試しください`;
  }
  if (code === '22001' || /too long/i.test(raw))
    return '本文が長すぎます（4000文字以内で入力してください）';
  /* 予約済み・投稿済みの動画は没にできない（reject_video の 55000・M023） */
  if (code === '55000' || /already scheduled or published/i.test(raw))
    return '予約済み・投稿済みの動画は没にできません（先に予約の取り消し／公開の取り下げをしてください）';
  if (code === '22023')
    return /reason is empty/i.test(raw)  ? '没にする理由を入力してください'
         : /body is empty/i.test(raw)    ? 'コメントを入力してください'
         /* 指摘の形が受け口の決まりに合わなかった（件数・文字数の上限、欠けた項目など） */
         : /invalid notes/i.test(raw)    ? '指摘の中身を受け付けてもらえませんでした。件数や文字数を減らすか、画面を新しくしてやり直してください'
         /* triage_idea の action 不正（#314）。ボタン以外から呼ばれたときだけ出る */
         : /invalid action/i.test(raw)   ? '操作の指定が不正です。画面を再読み込みしてやり直してください'
                                         : '対象の承認ポイントが不正です（台本 / 絵コンテ / 完成のいずれか）';
  if (/JWT|token is expired|invalid claim/i.test(raw))
    return 'ログインの有効期限が切れました。再度ログインしてください';
  if (/fetch|network|Failed to send/i.test(raw))
    return '通信に失敗しました。接続を確認して再度お試しください';
  return act === 'approve' ? '承認できませんでした。時間をおいて再度お試しください'
       : act === 'reject'    ? '没にできませんでした。時間をおいて再度お試しください'
       : act === 'triage'    ? '仕分けを記録できませんでした。時間をおいて再度お試しください'
                             : 'コメントを送信できませんでした。時間をおいて再度お試しください';
}

/* コメント欄（.wbox）・承認欄（.abox）・没欄（.rjbox）・下端の固定バー（.dbar）は
   別ブロックだが、二重送信ガードはまとめてかける（どれか送信中は全部の操作を止める）。
   詳細の決める枠は .decide が器、ネタの仕分け（#314）は器を持たないので親要素で束ねる */
const decideGroup = box => box.closest('.decide') || box.parentElement;
function writeGroup(box){
  const p = decideGroup(box);
  const found = p ? [...p.querySelectorAll('[data-wbox],[data-abox],[data-rjbox],[data-dbar]')] : [];
  return found.length ? found : [box];
}
/* 下端のバーのボタンは囲みの外にあるので、同じ決める枠の中から相手の囲みを引く（#509 段1）。
   囲みの中のボタン（キャンセル・確定）は従来どおり自分の囲みを返す */
function actBox(btn, act){
  const inBox = btn.closest('[data-wbox],[data-abox],[data-rjbox]');
  if (inBox) return inBox;
  const g = btn.closest('.decide');
  if (!g) return null;
  return g.querySelector(
    /^reject-/.test(act) ? '[data-rjbox]' : (act === 'comment') ? '[data-wbox]' : '[data-abox]');
}
function wboxBusy(box, busy, label){
  const boxes = writeGroup(box);
  boxes.forEach(b => {
    b.dataset.busy = busy ? '1' : '0';
    b.querySelectorAll('button').forEach(btn => { btn.disabled = busy; });
    b.querySelectorAll('.wta,.ata,.rta,.memo,.noteinput').forEach(ta => { ta.disabled = busy; });
  });
  const btn = label && boxes.map(b => b.querySelector(`[data-act="${label}"]`)).find(Boolean);
  if (btn) {
    if (busy) { btn.dataset.lbl = btn.textContent; btn.textContent = '送信中…'; }
    else if (btn.dataset.lbl) { btn.textContent = btn.dataset.lbl; delete btn.dataset.lbl; }
  }
  /* 没の確定は理由が入っているときだけ押せる（busy 解除で不用意に有効化しない） */
  if (!busy) boxes.forEach(syncRejectReady);
}
/* 没の確定ボタンの活性を理由の入力状態に同期する */
function syncRejectReady(box){
  const btn = box.querySelector('[data-act="reject-confirm"]');
  const ta  = box.querySelector('.rta');
  if (btn && ta) btn.disabled = !ta.value.trim();
}
function wboxMsg(box, text, isErr, slot){
  const key = slot || 'comment';
  const boxes = writeGroup(box);
  boxes.forEach(b => b.querySelectorAll('.wmsg').forEach(m => {
    if (m.dataset.slot !== key) { m.textContent = ''; m.hidden = true; }
  }));
  const m = boxes.map(b => b.querySelector(`.wmsg[data-slot="${key}"]`)).find(Boolean);
  if (!m) return;
  m.className = 'wmsg' + (isErr ? ' err' : '');
  m.textContent = text || '';
  m.hidden = !text;
}

/* 没の2段階目を開く／閉じる。1段目のボタンが囲みの中（ネタの仕分け）なら開いている間は隠して
   押し先を1つに絞る。下端の固定バーにあるとき（レビュー画面）は隠さず、もう一度押すと閉じる */
const rejectOpenBtn = box => (decideGroup(box) || box).querySelector('[data-act="reject-open"]');
function toggleRejectPanel(box){
  const panel = box.querySelector('.rjpanel');
  if (panel && !panel.hidden) closeRejectPanel(box); else openRejectPanel(box);
}
function openRejectPanel(box){
  if (box.dataset.busy === '1') return;
  const panel = box.querySelector('.rjpanel'), btn = rejectOpenBtn(box);
  if (!panel) return;
  wboxMsg(box, '', false, 'reject');
  panel.hidden = false;
  if (btn) { if (box.contains(btn)) btn.hidden = true; btn.setAttribute('aria-expanded', 'true'); }
  syncRejectReady(box);
  panel.scrollIntoView({ block: 'nearest' });
  panel.querySelector('.rta')?.focus();
}
function closeRejectPanel(box){
  if (box.dataset.busy === '1') return;
  const panel = box.querySelector('.rjpanel'), btn = rejectOpenBtn(box);
  if (panel) {
    panel.hidden = true;
    const ta = panel.querySelector('.rta'); if (ta) ta.value = '';
  }
  wboxMsg(box, '', false, 'reject');
  syncRejectReady(box);
  if (btn) { btn.hidden = false; btn.setAttribute('aria-expanded', 'false'); btn.focus(); }
}

/* 書き込み後は取り直して描き直す。一覧の状態バッジ・並び順・指摘件数は
   v_dashboard_list（M027）が review_events から作っているので、コメント1件でも
   一覧が変わりうる＝動画側のキャッシュはまとめて捨てる（#215 Phase 2）。 */
async function refreshAfterWrite(approved){
  clearVideoCaches();
  store.assets = {};
  if (approved) store.analytics = {};
  const keep = state.detail;
  await render();
  if (keep) await openDetail(keep);     /* 開けなければ openDetail が閉じる */
}

/* コメント（RPC は従来どおり request_changes。指摘は resolution_status='open' で記録される） */
async function submitComment(box, key){
  if (box.dataset.busy === '1') return;
  const [vid, gate] = key.split('|');
  const ta = box.querySelector('.wta');
  const body = ((ta && ta.value) || '').trim();
  /* 空のまま「修正を依頼」を押しても送らない（下端のバーの誤タップよけ）。
     入力欄は画面の上の方にあることがあるので、案内と一緒にそこまで送る */
  if (!body) {
    wboxMsg(box, '直してほしい点を入力してください', true, 'comment');
    if (ta) { ta.scrollIntoView({ block: 'center' }); ta.focus(); }
    return;
  }
  wboxMsg(box, '', false, 'comment');
  wboxBusy(box, true, 'comment');
  const { error } = await sb.rpc('request_changes',
    { p_video_id: Number(vid), p_gate: gate, p_body: body });
  if (error) { wboxBusy(box, false, 'comment'); wboxMsg(box, rpcErrText(error, 'comment'), true, 'comment'); return; }
  ta.value = '';
  await refreshAfterWrite(false);
  toast('修正を依頼しました');
}

/* 承認の2段階目（確定）。パネルが開いていないときは絶対に実行しない＝1タップでは通らない */
/* ── 1クリック承認（オーナー要望 2026-08-20）─────────────────────────────
   一覧の行からも詳細のボタンからも、押した1回で承認まで通す。押した瞬間は DB へ
   書かず、数秒の猶予をおいてから書く（その間は「取り消す」で無かったことにできる）。
   詳細でメモを開いて書いてあれば、その内容を添えて承認する。 */
async function approveNow(vid, gate, note){
  const gname = GATE_LABEL[gate] || gate;
  /* 見ていた提出物の版を添える。裏で新しい版が提出されていたら DB が P0003 で断る（073・#502） */
  const { data, error } = await sb.rpc('approve_gate',
    { p_video_id: Number(vid), p_gate: gate, p_note: note || null,
      p_expected_revision: submittedRevOf(vid, gate) });
  if (error) {
    markApproved(vid, gate, false);              /* ボタンを押せる状態に戻す */
    toast(rpcErrText(error, 'approve'));
    /* 古い版を見ていた: **その場で取り直して描き直す**（#506 高1）。版の記憶だけ捨てて画面を
       そのままにすると、もう一度押したとき版が空で送られ、DB の照合を素通りして
       見ていない新しい版に承認が付く */
    if (error.code === 'P0003') await refreshAfterWrite(false);
    return;
  }
  /* ⚠️ ここで画面を作り直さない（オーナー指定 2026-08-20）。一覧を描き直すと
     スクロールが先頭へ戻ってしまい、続けて承認するときに毎回探し直しになるため。
     代わりに「押した行のボタンだけ」を承認済みに変え、手元の記憶（キャッシュ）を捨てて
     次にこの画面を描き直すとき（タブ切替・再読み込み・⟳）に新しい状態で出るようにする。 */
  store.core = {}; store.facets = {}; store.board = {}; store.byId = new Map();
  store.assets = {}; store.analytics = {};
  delete store.threads[Number(vid)];
  /* 承認待ちバッジだけは今すぐ正しくする（この1件を減らす。一覧は触らない） */
  const p = store.pending[state.ch];
  if (p && Array.isArray(p.rv)) {
    p.rv = p.rv.filter(r => !(r.item && r.item.id === Number(vid) && r.gate === gate));
  }
  markApproved(vid, gate, true);
  renderShell();
  const rev = data && data.target_revision ? `第${data.target_revision}版の` : '';
  toast((data && data.already_approved) ? `${rev}${gname}は既に承認済みです` : `${rev}${gname}を承認しました`);
}
/* 承認した動画のボタンを、画面を作り直さずにその場で書き換える（表の行・スマホのカード・詳細） */
function markApproved(vid, gate, done){
  document.querySelectorAll(`[data-act="approve-quick"][data-key="${vid}|${gate}"]`).forEach(b => {
    b.disabled = done;
    b.textContent = done ? '承認済み' : (b.dataset.label || '承認');
  });
}
function quickApprove(key, btn){
  const [vidS, gate] = String(key).split('|');
  const gname = GATE_LABEL[gate] || gate;
  /* 指摘を書いたまま承認を押したら1回だけ聞く。押し間違いなら戻れるし、
     わざと「送らずに承認」したい回もあるので止めはしない（#509 段4） */
  if (tapActive(key) && tap.items.length
      && !window.confirm(`指摘が ${tap.items.length} 件残っています。送らずに承認しますか`)) return;
  /* 詳細のメモ欄（同じ動画・同じゲートのもの）に書いてあれば添える。
     承認ボタンは下端の固定バー＝承認欄の外にあるので、決める枠（.decide）ごしに引く */
  const box = btn && (btn.closest('[data-abox]')
    || (btn.closest('.decide') || document).querySelector('[data-abox]'));
  const ta = box && box.querySelector('.ata');
  const note = ((ta && ta.value) || '').trim();
  if (btn) { btn.disabled = true; btn.textContent = '承認しました'; }
  actWithUndo(`${gname}を承認しました`,
    () => approveNow(vidS, gate, note),
    () => markApproved(vidS, gate, false));
}

/* 没の2段階目（確定）。パネルが開いていて理由が入っているときだけ実行する。
   videos.status が変わるので core も含めて取り直す（refreshAfterWrite(true)）。 */
async function submitReject(box, key){
  if (box.dataset.busy === '1') return;
  const panel = box.querySelector('.rjpanel');
  if (!panel || panel.hidden) return;
  const [vidS, gate] = key.split('|');
  const vid = Number(vidS);
  const ta = panel.querySelector('.rta');
  const reason = ((ta && ta.value) || '').trim();
  if (!reason) { wboxMsg(box, '没にする理由を入力してください', true, 'reject'); if (ta) ta.focus(); return; }

  wboxMsg(box, '', false, 'reject');
  wboxBusy(box, true, 'reject-confirm');
  const { data, error } = await sb.rpc('reject_video',
    { p_video_id: vid, p_gate: gate, p_reason: reason });
  if (error) { wboxBusy(box, false, 'reject-confirm'); wboxMsg(box, rpcErrText(error, 'reject'), true, 'reject'); return; }
  if (ta) ta.value = '';
  const already = !!(data && data.already_dropped);
  await refreshAfterWrite(true);
  toast(already ? 'この動画はすでに没になっています' : '没にしました');
}

/* ── コメント本文の1行要約（#266 / 2026-09-06）─────────────────────────
   AI の記録は1件1行に畳むので、Markdown の記法（見出し・箇条書き・太字）を落として
   地の文にしてから切り詰める。人の指摘は畳まず全文をそのまま出す。 */
function cmtPreview(src, n){
  const t = String(src || '').replace(/\r\n?/g, '\n')
    .replace(/^\s*#{1,6}\s+/gm, '')                   /* 見出しの # */
    .replace(/^\s*([-*_]\s*){3,}\s*$/gm, '')          /* 水平線 */
    .replace(/^\s*(?:[-*]\s+|・\s*|\d+[.)]\s+)/gm, '')/* 箇条書き・番号 */
    .replace(/\*\*([^*]+)\*\*/g, '$1')                /* 太字 */
    .replace(/\s+/g, ' ').trim();
  return t.length > n ? t.slice(0, n) + '…' : t;
}

/* ── AI の記録の1行要約（オーナー要望 2026-09-02）────────────────────────────
   AI の指摘は JSON で保存されている。**そのまま画面に出さない**——出どころ・直す内容の
   先頭1件・件数・対応結果だけを1行にたたむ。読めない JSON はその旨だけ出す。 */
const AI_UNREADABLE = '（内容を読めない記録）';
/* JSON なら中身・JSON でなければ null・壊れていれば false */
function aiJSON(body){
  const s = String(body || '').trim();
  if (!s.startsWith('{')) return null;

const clip = (s, n) => { const t = String(s || '').replace(/\s+/g, ' ').trim(); return t.length > n ? t.slice(0, n) + '…' : t; };

  let what = '';
  if (o) {
    const items = Array.isArray(o.items) ? o.items : [];
    const first = items.length ? clip(items[0].fix || items[0].note, 60) : '';
    what = first || clip(o.summary, 60);

/* 提出コメントの1行目に入っている版（「完成 v02｜承認をお願いします」） */
const subVer = body => {
  const m = /\bv(\d{1,3})\b/i.exec(String(body || '').split('\n')[0] || '');
  return m ? 'v' + m[1] : '';
};
function aiSummaryLine(e){

  if (e.kind === 'approve')  { const r = aiRoleOf(e.author); return `承認印（${g}${r ? '・' + r : ''}）`; }
  if (e.kind === 'request_review') {
    const v = e.revision != null ? 'v' + String(e.revision).padStart(2, '0') : subVer(e.body);
    return `提出（${g}${v ? ' ' + v : ''}）`;

  if (e.kind === 'reject') return `却下（${g}）${t ? '：' + t : ''}`;

/* 提出コメントの「## 前回からの変更」節だけを抜く（見出しから次の見出しの手前まで）。

const secRe = name => new RegExp(`(?:^|\\n)[ \\t]*#{1,6}[ \\t]*${name}[ \\t]*\\n([\\s\\S]*?)(?=\\n[ \\t]*#{1,6}[ \\t]|$)`);

const changeNote = body => bodySection(body, CHG_RE);

const measureNote = body => bodySection(body, MEAS_RE).split('\n')
  .map(s => s.replace(/^\s*[-*・]\s*/, '').trim()).filter(Boolean);
/* ── この版で変えたこと（オーナー決定 2026-09-06）──────────────────────────
   承認の画面でオーナーが読むのは「前の版から何が変わったか」だけ。指摘の引用も
   「→ 対応:」の前置きも要らない、と決まった（引用は下の「あなたの指摘」に全文があるため）。

   取り方は2段構え。①現行の提出（最新の request_review）と同じ版で片づいた差し戻しの
   `resolution_note`（「第N版で対応（…）」）から包みを外した中身。人の差し戻しも AI の
   差し戻し（機械測定・審査）も同じ扱いにする。②それが1件も取れないときだけ、提出本文の
   「## 前回からの変更」節から前置きを外した残りを使う（旧い版の本文にも効かせるため）。
   初回の提出（v01）で何も取れなければ、変更の行そのものを出さない。 */
function latestSub(evs){
  let sub = null;
  for (const e of (evs || [])) if (e.kind === 'request_review' && (!sub || evNewer(e, sub))) sub = e;
  return sub;
}
/* 提出の版。記録の revision が正、無ければ本文1行目の「v02」で代用する */
const subRevNum = sub => {
  if (!sub) return null;

/* 「第2版で対応（S10 を作り直し）」→ { rev:2, text:'S10 を作り直し' }。包みが無ければ rev:null */
function rezCore(note){
  const s = String(note || '').replace(/\s+/g, ' ').trim();
  const m = /^第\s*(\d{1,3})\s*版で対応[（(]([\s\S]*)[）)]$/.exec(s);
  return m ? { rev: Number(m[1]), text: m[2].trim() } : { rev: null, text: s };

function chgFromBody(body){
  return changeNote(body).split('\n')
    .map(s => s.replace(/^\s*[-*・]\s*/, '').trim())
    .filter(Boolean)
    .map(s => s.replace(/^[\s\S]*→\s*(?:対応|直した内容)\s*[:：]\s*/, '').trim())
    .filter(Boolean);

function changeLines(events){
  const evs = events || [];
  const sub = latestSub(evs);
  if (!sub) return [];
  const rev = subRevNum(sub);
  /* この提出より前の、版がひとつ前までの提出＝作り直しの起点（同じ版の出し直しは跨ぐ） */
  let anchor = null;
  for (const e of evs) {
    if (e.kind !== 'request_review' || !evNewer(sub, e)) continue;
    if (rev != null && !(Number(e.revision) < rev)) continue;
    if (!anchor || evNewer(e, anchor)) anchor = e;
  }
  const picked = [];
  for (const e of evs) {
    if (e.kind !== 'request_changes' || !e.resolved_at) continue;
    const c = rezCore(e.resolution_note);
    const ok = c.rev != null
      ? (rev == null || c.rev === rev)                       /* 「第N版で対応」の N で決める */
      : (rev != null && e.revision != null
          ? Number(e.revision) <= rev - 1                    /* 包みが無ければ版で決める */
          : (evNewer(sub, e) && (!anchor || evNewer(e, anchor))));
    if (ok) picked.push({ e, c });
  }
  picked.sort((a, b) => evNewer(a.e, b.e) ? 1 : -1);

     同じ文を何行も並べない（重複は落とす） */
  const lines = [...new Set(picked
    .map(({ e, c }) => c.text || (isAiAuthor(e.author) ? aiChangesLine(e) : ''))
    .filter(Boolean))];
  return lines.length ? lines : chgFromBody(sub.body);
}

/* ── 履歴は2節に分ける（オーナー決定 2026-09-06）──────────────────────────

function niceTicks(min, max, target){
  if (!(max > min)) max = min + (Math.abs(min) * 0.05 || 1);
  const raw = (max - min) / Math.max(1, target);
  const p = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = ([1, 2, 2.5, 5, 10].find(k => raw <= k * p) || 10) * p;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const ticks = [];
  for (let v = lo; v <= hi + step * 1e-6; v += step) ticks.push(Number(v.toFixed(10)));
  return { lo, hi, ticks };

/* 横軸（日付）: 毎日に目盛りを打つ（オーナー指定 2026-09-03）。ラベルは MM/DD(曜)。

   返り値 { ticks:[{v,lb}], rot:斜めか, pb:横軸に要する下余白 } */
function dateTicks(rows, plotW){
  const n = rows.length;
  if (!n) return { ticks:[], rot:false, pb:26 };
  const d0 = rows[0].d, d1 = rows[n - 1].d, span = Math.max(1, d1 - d0);
  const per = plotW / span;                 /* 1日あたりの幅(px) */
  const rot = per < 62;                     /* 横書きの MM/DD(曜) が並ばない */
  const stride = rot ? Math.max(1, Math.ceil(15 / per)) : 1;
  const lb = t => fmtMDW(t + 'T00:00:00+09:00');
  const ticks = [];
  for (let d = d0; d <= d1; d++){
    const i = d - d0, isLast = d === d1;
    const labeled = isLast || (i % stride === 0 && (d1 - d) >= stride * 0.6);
    const row = rows.find(r => r.d === d);
    const t = row ? row.t : jstAdd(rows[0].t, i);

    Q${x.toFixed(1)} ${y.toFixed(1)} ${(x + r).toFixed(1)} ${y.toFixed(1)}
    L${(x + w - r).toFixed(1)} ${y.toFixed(1)} Q${(x + w).toFixed(1)} ${y.toFixed(1)} ${(x + w).toFixed(1)} ${(y + r).toFixed(1)}
    L${(x + w).toFixed(1)} ${(y + h).toFixed(1)} Z`;
}
/* ホバーの十字線と印。チャンネルの数だけ印を置く（同じ日の全チャンネルを同時に示す） */
const HOVER_G = colors => `<g class="hov" style="display:none">
    <line class="hl" stroke-width="1" vector-effect="non-scaling-stroke" style="stroke:var(--axis)"/>
    ${colors.map(c => `<circle class="hd" r="4.5" stroke-width="2" vector-effect="non-scaling-stroke"
      style="fill:${c};stroke:var(--surface-1)"/>`).join('')}
  </g>`;

/* ── 折れ線（登録者の推移）チャンネルを重ねて描く ─────────────────
   series = [{ch, name, color, rows:[{t, d, v}]}]（rows は日付の昇順） */
function lineChart(series, W, opt){
  const PL = 46, PR = 14, PT = 21;
  const plotW = Math.max(20, W - PL - PR);
  const all = series.reduce((s, x) => s.concat(x.rows), []);
  const ds = all.map(r => r.d);
  let d0 = Math.min(...ds), d1 = Math.max(...ds);
  if (d1 === d0) { d0 -= 1; d1 += 1; }
  const xt = spanTicks(d0, d1, plotW);
  /* 縦は大きめに取り、目盛りは8本ほど。横に伸びるだけで傾きが読めない、との指摘（2026-09-04） */
  const PB = xt.pb, H = (opt.H || (W < 420 ? 260 : 380)) + (PB - 26);
  const plotH = Math.max(20, H - PT - PB);
  /* 縦軸の範囲は「軸を合わせる」チャンネル（opt.axis）の値だけから決める。他のチャンネルは
     薄い線で残し、範囲の外に出た部分は描画領域で切る（案②・2026-09-04）。軸の指定が無ければ全体 */
  const main = series.find(x => x.ch === opt.axis) || null;
  const vs = (main ? main.rows : all).map(r => r.v);
  const yr = niceTicks(opt.yFrom0 ? 0 : Math.min(...vs), Math.max(...vs), W < 420 ? 6 : 8);
  const X = d => PL + plotW * ((d - d0) / (d1 - d0));
  const Y = v => PT + plotH - plotH * ((v - yr.lo) / ((yr.hi - yr.lo) || 1));
  const g = { x0:PL, y0:PT, plotW, plotH, X, Y, yTicks:yr.ticks, xTicks:xt.ticks, xRot:xt.rot, yFmt:axNum };
  const clipId = 'clip-' + (opt.id || 'line');
  /* 面の塗りは1チャンネルのときだけ（重ねると濁って線が読めなくなる） */
  const solo = series.length === 1;
  const body = series.map(s => {
    if (!s.rows.length) return '';
    const faint = main && s.ch !== main.ch;
    const line = s.rows.map((r, i) => `${i ? 'L' : 'M'}${X(r.d).toFixed(1)} ${Y(r.v).toFixed(1)}`).join(' ');
    const last = s.rows[s.rows.length - 1];
    const area = solo ? `<path d="${line} L${X(last.d).toFixed(1)} ${(PT + plotH).toFixed(1)}
      L${X(s.rows[0].d).toFixed(1)} ${(PT + plotH).toFixed(1)} Z" style="fill:${s.color};opacity:.09"/>` : '';
    return `<g clip-path="url(#${clipId})" style="opacity:${faint ? .3 : 1}">${area}<path d="${line}" stroke-width="${faint ? 1.5 : 2}" stroke-linejoin="round" stroke-linecap="round"
        vector-effect="non-scaling-stroke" style="fill:none;stroke:${s.color}"/>
      <circle cx="${X(last.d).toFixed(1)}" cy="${Y(last.v).toFixed(1)}" r="${faint ? 3 : 4}" stroke-width="2"
        vector-effect="non-scaling-stroke" style="fill:${s.color};stroke:var(--surface-1)"/></g>`;
  }).join('');
  const html = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img"
      aria-label="${esc(opt.label || '')}。${series.length}チャンネル。${main ? `縦軸は${esc(main.name)}の範囲。` : ''}">
    <defs><clipPath id="${clipId}"><rect x="${PL - 6}" y="${PT - 6}" width="${plotW + 12}" height="${plotH + 8}"/></clipPath></defs>
    ${axesSvg(g)}${unitSvg(2, PT - 9, opt.unit)}
    ${body}
    ${HOVER_G(series.map(s => s.color)).replace('<line class="hl"', `<line class="hl" y1="${PT - 4}" y2="${PT + plotH}"`)}
    <rect x="0" y="0" width="${W}" height="${H}" fill="transparent" style="cursor:crosshair"/>
  </svg>`;
  /* ホバー: 同じ日の全チャンネルを1つの吹き出しにまとめる */
  const days = [...new Set(ds)].sort((a, b) => a - b);
  const pts = days.map(d => {
    const hit = series.map(s => s.rows.find(r => r.d === d) || null);
    const first = hit.find(Boolean);
    const lines = series.map((s, i) => hit[i]
      ? `${chSw(s.color)}${esc(s.name)}　<b>${nf(hit[i].v)}</b> ${esc(opt.unit || '')}`
      : `${chSw(s.color)}${esc(s.name)}　—`).join('<br>');
    return { x:X(d), y: first ? Y(first.v) : PT + plotH,
             ys: hit.map(r => r ? Y(r.v) : null),
             html:`${esc(fmtMDW((first ? first.t : '2000-01-01') + 'T00:00:00+09:00'))}<br>${lines}` };
  });
  return { html, pts };
}

/* ── 再生数の推移: 上段＝1日の増分（棒）／下段＝累計（折れ線）───────────
   1つの絵に2つの縦軸を入れない（読み違いのもと）。単位の違う2つは上下の段に分け、
   横軸（日付）だけを共有する。棒はチャンネルごとに同じ日の中で横並び（積み上げない）。
   series = [{ch, name, color, rows:[{t, d, inc, cum}]}] */
function playsChart(series, W, opt){
  const PL = 46, PR = 14, PT = 21, GAP = 33;
  const plotW = Math.max(20, W - PL - PR);
  const all = series.reduce((s, x) => s.concat(x.rows), []);
  const ds = all.map(r => r.d);
  let d0 = Math.min(...ds), d1 = Math.max(...ds);
  if (d1 === d0) { d0 -= 1; d1 += 1; }
  const xt = spanTicks(d0, d1, plotW);
  const PB = xt.pb, H = (W < 420 ? 320 : 430) + (PB - 26);
  const hTop = Math.max(24, Math.round((H - PT - GAP - PB) * 0.55));
  const hBot = Math.max(20, H - PT - GAP - PB - hTop);
  const yTop = PT, yBot = PT + hTop + GAP;
  const X = d => PL + plotW * ((d - d0) / (d1 - d0));
  /* 縦軸の範囲は「軸を合わせる」チャンネル（opt.axis）の値だけから決める（案②・2026-09-04） */
  const main = series.find(x => x.ch === opt.axis) || null;
  const base = main ? main.rows : all;
  const incs = base.map(r => r.inc).filter(v => v != null);
  const cums = base.map(r => r.cum);
  const ir = niceTicks(0, Math.max(1, ...incs), W < 420 ? 4 : 6);
  const cr = niceTicks(Math.min(...cums), Math.max(...cums), W < 420 ? 4 : 6);
  const Yi = v => yTop + hTop - hTop * ((v - ir.lo) / ((ir.hi - ir.lo) || 1));
  const Yc = v => yBot + hBot - hBot * ((v - cr.lo) / ((cr.hi - cr.lo) || 1));
  const n = Math.max(1, series.length);
  const days = [...new Set(ds)].sort((a, b) => a - b);
  /* 同じ日の中に n 本を横並びにする（棒どうしは 1.5px の隙間で分ける） */
  const gw = Math.max(2.4, Math.min(22, plotW / Math.max(1, days.length) - 2.5));
  const bw = Math.max(1.2, (gw - (n - 1) * 1.5) / n);
  const faintOf = s => main && s.ch !== main.ch;
  const bars = series.map((s, i) => `<g clip-path="url(#clip-plays-top)" style="opacity:${faintOf(s) ? .3 : .9}">` + s.rows.map(r => r.inc == null ? '' :
    `<path d="${barPath(X(r.d) - gw / 2 + i * (bw + 1.5), Yi(r.inc), bw, (yTop + hTop) - Yi(r.inc), 3)}"
       style="fill:${s.color}"/>`).join('') + '</g>').join('');
  const clines = series.map(s => s.rows.length
    ? `<g clip-path="url(#clip-plays-bot)" style="opacity:${faintOf(s) ? .3 : 1}"><path d="${s.rows.map((r, i) => `${i ? 'L' : 'M'}${X(r.d).toFixed(1)} ${Yc(r.cum).toFixed(1)}`).join(' ')}"
        stroke-width="${faintOf(s) ? 1.5 : 2}" stroke-linejoin="round" stroke-linecap="round"
        vector-effect="non-scaling-stroke" style="fill:none;stroke:${s.color}"/></g>` : '').join('');
  const gTop = { x0:PL, y0:yTop, plotW, plotH:hTop, X, Y:Yi, yTicks:ir.ticks, xTicks:[], yFmt:axNum };
  const gBot = { x0:PL, y0:yBot, plotW, plotH:hBot, X, Y:Yc, yTicks:cr.ticks, xTicks:xt.ticks, xRot:xt.rot, yFmt:axNum };
  const html = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img"
      aria-label="再生数の推移。上段は1日の増分、下段は累計。${series.length}チャンネル。${main ? `縦軸は${esc(main.name)}の範囲。` : ''}">
    <defs><clipPath id="clip-plays-top"><rect x="${PL - 6}" y="${yTop - 6}" width="${plotW + 12}" height="${hTop + 6}"/></clipPath>
      <clipPath id="clip-plays-bot"><rect x="${PL - 6}" y="${yBot - 6}" width="${plotW + 12}" height="${hBot + 8}"/></clipPath></defs>
    ${axesSvg(gTop)}${unitSvg(2, yTop - 9, '回／日')}
    ${bars}
    ${axesSvg(gBot)}${unitSvg(2, yBot - 9, '累計 回')}
    ${clines}
    ${HOVER_G(series.map(s => s.color)).replace('<line class="hl"', `<line class="hl" y1="${yTop - 4}" y2="${yBot + hBot}"`)}
    <rect x="0" y="0" width="${W}" height="${H}" fill="transparent" style="cursor:crosshair"/>
  </svg>`;
  const pts = days.map(d => {
    const hit = series.map(s => s.rows.find(r => r.d === d) || null);
    const first = hit.find(Boolean);
    const lines = series.map((s, i) => hit[i]
      ? `${chSw(s.color)}${esc(s.name)}　この日 <b>${hit[i].inc == null ? '—' : '+' + nf(hit[i].inc)}</b> 回　／　累計 <b>${nf(hit[i].cum)}</b> 回`
      : `${chSw(s.color)}${esc(s.name)}　—`).join('<br>');
    return { x:X(d), y: first ? Yc(first.cum) : yBot + hBot,
             ys: hit.map(r => r ? Yc(r.cum) : null),
             html:`${esc(fmtMDW((first ? first.t : '2000-01-01') + 'T00:00:00+09:00'))}<br>${lines}` };
  });
  return { html, pts };
}

/* ── 公開順に見る平均視聴率（横軸＝公開日の実日付・縦軸＝%）─────────
   点の色＝チャンネル、目安に到達＝塗りつぶし／未達＝白抜き。
   ⚠️ 目安を当てないチャンネル（items[].goal が false）は点を全部塗りつぶしにし、
      そのチャンネルしか映っていないときは破線も描かず、縦軸の範囲にも閾値を混ぜない。
   items = [{d, at, v, seq, title, name, color, goal}] */
function scatterChart(items, W, opt){
  const PL = 46, PR = 14, PT = 21;
  const plotW = Math.max(20, W - PL - PR);
  const ds = items.map(i => i.d);
  let d0 = Math.min(...ds), d1 = Math.max(...ds);
  if (d1 === d0) { d0 -= 1; d1 += 1; }
  /* 横軸は推移グラフと同じ規則（毎日の目盛り・MM/DD(曜)・幅で斜め／間引き）に統一する */
  const xt = spanTicks(d0, d1, plotW);
  const PB = xt.pb, H = (W < 420 ? 250 : 320) + (PB - 26);
  const plotH = Math.max(20, H - PT - PB);
  const vs = items.map(i => i.v);
  const useThr = items.some(i => i.goal);        /* 1本でも対象の動画があれば線を出す */
  const ext = useThr ? [opt.thr] : [];
  const yr = niceTicks(Math.min(...ext, ...vs), Math.max(...ext, ...vs), W < 420 ? 5 : 7);
  const X = d => PL + plotW * ((d - d0) / (d1 - d0));
  const Y = v => PT + plotH - plotH * ((v - yr.lo) / ((yr.hi - yr.lo) || 1));
  const g = { x0:PL, y0:PT, plotW, plotH, X, Y, yTicks:yr.ticks, xTicks:xt.ticks, xRot:xt.rot, yFmt:v => String(Math.round(v)) };
  const ty = Y(opt.thr);
  const thr = !useThr ? '' : `<line x1="${PL}" y1="${ty.toFixed(1)}" x2="${(PL + plotW).toFixed(1)}" y2="${ty.toFixed(1)}"
      stroke-width="1.5" stroke-dasharray="4 3" vector-effect="non-scaling-stroke" style="stroke:var(--crit)"/>
    <text x="${(PL + plotW).toFixed(1)}" y="${(ty - 5).toFixed(1)}" text-anchor="end" font-size="9.5" font-weight="700"
      font-family="system-ui,sans-serif" style="fill:var(--crit)">目安 ${opt.thr}%</text>`;
  const dots = items.map(i => {
    const hit = i.goal ? i.v >= opt.thr : true;   /* 対象外は白抜きにしない（判定していない） */
    return `<circle cx="${X(i.d).toFixed(1)}" cy="${Y(i.v).toFixed(1)}" r="4.5" stroke-width="2"
      vector-effect="non-scaling-stroke"
      style="fill:${hit ? i.color : 'var(--surface-1)'};stroke:${hit ? 'var(--surface-1)' : i.color}"/>`;
  }).join('');
  const html = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img"
      aria-label="公開順に見る平均視聴率。${items.length}本。${useThr ? `目安${opt.thr}%。` : ''}">
    ${axesSvg(g)}${unitSvg(2, PT - 9, '%')}${thr}${dots}
    <rect x="0" y="0" width="${W}" height="${H}" fill="transparent" style="cursor:crosshair"/>
  </svg>`;
  const pts = items.map(i => ({ x:X(i.d), y:Y(i.v),
    html:`${chSw(i.color)}${esc(i.name)}<br><b>${esc(i.seq)}</b> ${esc(i.title)}<br>${esc(fmtMDW(i.at))}　平均視聴率 <b>${i.v.toFixed(1)}</b>%` }));
  return { html, pts, mode:'xy' };
}

/* ── ヒストグラム（チャンネルごとに同じ区分で横並び・積み上げない）─────
   棒の色＝チャンネル。目安に到達した区分は塗りつぶし、未達は白抜き（輪郭だけ）。
   ⚠️ 目安を当てないチャンネル（groups[].goal が false）は棒を全部塗りつぶしにし、
      対象が1つも無いときは破線も描かず、横軸の範囲にも閾値を混ぜない。
   groups = [{ch, name, color, values, goal}]（values は欠測を除いてある） */
function histogram(groups, cfg, W, H){
  const { thr, step, dir, fmt, unit } = cfg;
  const all = groups.reduce((s, g) => s.concat(g.values), []);
  const useThr = groups.some(g => g.goal);
  const dmin = Math.min(...all), dmax = Math.max(...all);
  const lo = Math.min(...(useThr ? [thr] : []), Math.floor(dmin / step + 1e-9) * step);
  const hi = Math.max(...(useThr ? [thr] : []), Math.ceil(dmax / step - 1e-9) * step);
  const nb = Math.max(1, Math.round((hi - lo) / step));
  const binsOf = vals => {
    const b = new Array(nb).fill(0);
    vals.forEach(v => { let i = Math.floor((v - lo) / step + 1e-9); i = Math.min(nb - 1, Math.max(0, i)); b[i]++; });
    return b;
  };
  const gb = groups.map(g => binsOf(g.values));
  const maxc = Math.max(1, ...gb.map(b => Math.max(...b)));
  const PL = 26, PR = 10, PT = 24, PB = 26;
  const plotW = Math.max(20, W - PL - PR), plotH = Math.max(20, H - PT - PB);
  const baseY = PT + plotH, slot = plotW / nb;
  const X = v => PL + plotW * ((v - lo) / ((hi - lo) || 1));
  const yr = niceTicks(0, maxc, 2);
  const Y = c => baseY - plotH * ((c - yr.lo) / ((yr.hi - yr.lo) || 1));
  const g = { x0:PL, y0:PT, plotW, plotH, X, Y, yTicks:yr.ticks, xTicks:[], yFmt:v => String(Math.round(v)) };
  const n = Math.max(1, groups.length);
  /* 区分の中を n 本に割る。区分どうしは 3px、チャンネルどうしは 1.5px あける */
  const inner = Math.max(2, slot - 3);
  const bw = Math.max(1.2, (inner - (n - 1) * 1.5) / n);
  const showNum = bw >= 13;
  let bars = '';
  for (let i = 0; i < nb; i++){
    const binLo = lo + step * i, binHi = binLo + step;
    const inGoal = dir > 0 ? binLo >= thr - 1e-9 : binHi <= thr + 1e-9;
    groups.forEach((grp, k) => {
      const hit = grp.goal ? inGoal : true;      /* 対象外は白抜きにしない（判定していない） */
      const c = gb[k][i];
      if (!c) return;
      const bx = PL + slot * i + 1.5 + k * (bw + 1.5);
      const by = Y(c), bh = Math.max(3, baseY - by);
      bars += `<g><path d="${barPath(bx, baseY - bh, bw, bh, 3)}" stroke-width="1.5"
          vector-effect="non-scaling-stroke"
          style="fill:${hit ? grp.color : 'var(--surface-1)'};opacity:${hit ? '.9' : '1'};stroke:${hit ? 'none' : grp.color}">
          <title>${esc(grp.name)} ${fmt(binLo)}〜${fmt(binHi)}${unit}: ${c}本</title></path>`
        + (showNum ? `<text x="${(bx + bw / 2).toFixed(1)}" y="${(baseY - bh - 5).toFixed(1)}" text-anchor="middle"
          font-size="10" font-weight="700" font-family="system-ui,sans-serif" style="fill:var(--ink-2)">${c}</text>` : '')
        + `</g>`;
    });
  }
  const stride = Math.max(1, Math.ceil(nb / Math.max(2, Math.floor(plotW / 42))));
  let ticks = '';
  for (let i = 0; i <= nb; i++){
    const edge = lo + step * i, tx = X(edge);
    ticks += `<line x1="${tx.toFixed(1)}" y1="${baseY}" x2="${tx.toFixed(1)}" y2="${baseY + 3}"
      stroke-width="1" vector-effect="non-scaling-stroke" style="stroke:var(--axis)"/>`;
    if (i % stride === 0 || i === nb)
      ticks += `<text x="${tx.toFixed(1)}" y="${baseY + 15}" text-anchor="middle" font-size="9.5"
        font-family="system-ui,sans-serif" style="fill:var(--muted)">${fmt(edge)}</text>`;
  }
  const txr = X(thr);
  const thrLine = !useThr ? '' : `<line x1="${txr.toFixed(1)}" y1="${PT - 9}" x2="${txr.toFixed(1)}" y2="${baseY}"
      stroke-width="1.5" stroke-dasharray="4 3" vector-effect="non-scaling-stroke" style="stroke:var(--crit)"/>
    <text x="${txr.toFixed(1)}" y="${PT - 12}" text-anchor="middle" font-size="9.5" font-weight="700"
      font-family="system-ui,sans-serif" style="fill:var(--crit)">目安 ${fmt(thr)}${unit}</text>`;
  const html = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img"
      aria-label="分布。${useThr ? `目安 ${fmt(thr)}${unit}。` : ''}${all.length}本。">
    ${axesSvg(g)}${unitSvg(1, PT - 8, '本')}${bars}${ticks}${thrLine}
  </svg>`;
  return { html, pts:[] };
}

/* ── ここから画面 ───────────────────────────────────────────── */
const anaRangeLabel = () => state.anaRange ? `直近${state.anaRange}日` : '記録の全部';

/* 到達までの見込み。伸びが0以下なら見込みは出さない（言い切らない） */
function paceLine(name, now, goal, gain30, unit){
  if (now >= goal) return `${name}は目標に到達しています。`;
  if (gain30 == null) return `${name}の直近30日の伸びは、まだ記録が足りず出せません。`;
  if (gain30 <= 0) return `${name}は直近30日は増えていないため見込みは出せません。`;
  const months = (goal - now) / gain30;
  const span = months >= 24 ? `約${(months / 12).toFixed(1)}年` : `約${Math.max(1, Math.round(months))}か月`;
  return `${name}は直近30日で+${nf(Math.round(gain30))}${unit}。このペースなら${nf(goal)}${unit}まで${span}。`;
}

/* 千再生あたり登録（登録者増 ÷ 再生数 × 1000）。再生0・欠測は出さない */
function subsPerK(p){
  const v = numOrNull(p.views), s = numOrNull(p.subscribers_gained);
  return (v && v > 0 && s != null) ? s / v * 1000 : null;
}
