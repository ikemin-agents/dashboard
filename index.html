.al.retired>summary .nm{color:var(--ink-2)}
.lstbody{padding:6px 14px 14px}
.lstnone{padding:var(--sp-6); text-align:center; color:var(--ink-2); font-size:var(--fs-sm)}
.kv{display:grid; grid-template-columns:8em minmax(0,1fr); gap:7px var(--sp-3); margin:0; font-size:var(--fs-sm)}
.kv dt{color:var(--muted); font-size:var(--fs-xs); padding-top:1px}
.kv dd{margin:0; white-space:pre-wrap; overflow-wrap:anywhere; line-height:1.55; min-width:0}
.kv .none{color:var(--muted)}
.kv .exl{margin:0; padding-left:1.1em; white-space:normal}
.kv .exl li{margin:0 0 3px}
.kv .exk{font-size:var(--fs-2xs); font-weight:700; color:var(--ink-2)}
.kv .exn{color:var(--muted); font-size:var(--fs-xs)}
.kv .pre{white-space:pre-wrap}
.kv pre.code{margin:0 0 3px; font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:var(--fs-2xs);
  white-space:pre-wrap; overflow-wrap:anywhere; background:var(--surface-2); border-radius:var(--r-sm); padding:5px 8px}
/* 見本の絵。無いときも同じ大きさの「素材なし」の面を置く */
.athumb{width:64px; height:64px; border-radius:var(--r-sm); border:1px solid var(--border); padding:0;
  overflow:hidden; background:var(--surface-3); cursor:zoom-in; display:block}
.athumb img{display:block; width:100%; height:100%; object-fit:cover}
.athumb.none{display:grid; place-items:center; background:var(--surface-2); color:var(--ink-2);
  font-size:var(--fs-2xs); cursor:inherit; text-align:center}
/* 中くらいの幅では、番組の列を短い呼び名に戻し（見出しは「番組」1つ）、本文を2行目へ降ろす（見出しの行は残す）。
   見出しの「本文」の字は消し、工程の絞り込みだけを見出しの行の右端に残す（列の左端は行と同じ位置のまま） */
@media (max-width:899px){
  .rlrow{grid-template-columns:36px 48px 48px 136px minmax(0,1fr) 14px}
  .lsthead.rl{grid-template-columns:36px 48px 48px 136px minmax(0,1fr) auto}
  .lsthead.rl .hbdt,.lsthead.rl .hend,.lsthead.rl .hch,.rlrow .chm{display:none}
  .lsthead.rl .hch1{display:block}
  .rlrow .bd{grid-column:1 / -1; grid-row:2}
}
@media (max-width:640px){
  .lsthead{display:none}
  /* ルール・素材・動画の一覧（.sk・#637）の見出しは列にそろえず、絞り込める見出しだけを横に並べる（押しやすい大きさの札にする） */
  :is(.lsthead.rl,.lsthead.al,.lsthead.sk){display:flex; flex-wrap:wrap; align-items:center; gap:6px; padding:8px 10px}
  .lsthead.rl .hno,.lsthead.al .hnf,.lsthead.al .hend{display:none}
  :is(.lsthead.rl,.lsthead.al,.lsthead.sk) .hf{margin:0; padding:5px 11px; min-height:30px; border:1px solid var(--border); border-radius:var(--r-pill);
    background:var(--surface-1); color:var(--ink-2); font-size:var(--fs-xs); letter-spacing:.02em}
  :is(.lsthead.rl,.lsthead.al,.lsthead.sk) .hf.on{color:var(--ink); font-weight:750}
  :is(.lsthead.rl,.lsthead.al,.lsthead.sk) .hf[aria-expanded="true"]{background:var(--ink); border-color:var(--ink); color:var(--page)}
  /* 番組の列は幅の上限まで（超えたら「・」のあとで折り返す） */
  .rlrow{grid-template-columns:auto auto auto fit-content(80px) minmax(0,1fr) 14px; column-gap:var(--sp-2)}
  .rlrow .chs{font-size:var(--fs-2xs)}
  .rlrow .bd{grid-column:1 / -1; grid-row:2}
  /* 素材の行は 見本｜名前と説明（その下に 種類・番組・使った動画 を1行）｜▸ */
  .alrow{grid-template-columns:56px minmax(0,1fr) 14px; grid-template-rows:auto 1fr; row-gap:6px}
  .alrow .athumb{grid-row:1 / span 2; align-self:start}
  .alrow .nmc{grid-column:2; grid-row:1}
  .alrow .meta{display:flex; grid-column:2; grid-row:2; align-self:start; flex-wrap:wrap; align-items:center;
    gap:4px 10px; min-width:0}
  .alrow .caret{grid-column:3; grid-row:1 / span 2}
  .alrow .cnt{flex-direction:row; align-items:baseline; gap:6px; font-size:var(--fs-xs)}
  .athumb{width:56px; height:56px}
  .kv{grid-template-columns:1fr; gap:2px}
  .kv dd{margin-bottom:6px}
}

/* ═══ 分析 ══════════════════════════════════════════════════════ */
.spark{position:relative}
.spark svg{display:block; overflow:visible}
.sparkcap{font-size:var(--fs-xs); color:var(--ink-2); margin-top:10px; font-variant-numeric:tabular-nums}
.sparkcap b{color:var(--ink); font-weight:680}
.meterblk{display:grid; gap:6px; margin-top:var(--sp-4)}
.meterblk .mh{display:flex; align-items:baseline; gap:9px; font-size:var(--fs-sm); max-width:560px}
.meterblk .mh .nm{font-weight:680}
.meterblk .mh .pc{margin-left:auto; font-variant-numeric:tabular-nums; font-weight:700}
.track{height:9px; border-radius:var(--r-pill); background:var(--meter-track); overflow:hidden;
  max-width:560px; box-shadow:inset 0 0 0 1px var(--border-2)}
.track .fill{height:100%; background:var(--meter-fill); border-radius:var(--r-pill); min-width:5px}
.meterblk .cond{font-size:var(--fs-2xs); color:var(--ink-2); font-variant-numeric:tabular-nums}
.perftbl table{min-width:1000px}
.distwrap{overflow-x:auto; margin-top:var(--sp-2)}
.dist{min-width:340px}
.dist svg{display:block}
.distlegend{display:flex; gap:var(--sp-4); flex-wrap:wrap; font-size:var(--fs-2xs); color:var(--ink-2); margin-top:8px; font-variant-numeric:tabular-nums}
.distlegend i{display:inline-block; width:10px; height:10px; border-radius:2px; vertical-align:-1px; margin-right:5px}
.tbltoggle{background:transparent; border:none; font-family:inherit; font-size:var(--fs-2xs); color:var(--ink-2);
  cursor:pointer; padding:4px 0; text-decoration:underline; text-underline-offset:3px}
.minitbl{display:none; margin-top:10px; max-width:300px}
.minitbl.show{display:block}

/* ── 凡例（チャンネルの色＝押すと表示のオン／オフ・2026-09-04）────────
   色はチャンネル専用にしてあるので、押していない状態は色を抜いた白抜きで表す。 */
.chlegend{display:flex; flex-wrap:wrap; align-items:center; gap:var(--sp-2); margin:0 0 var(--sp-3)}
.chchip{display:inline-flex; align-items:center; gap:8px; cursor:pointer; font-family:inherit;
  font-size:var(--fs-sm); font-weight:650; color:var(--ink); background:var(--surface-1);
  border:1px solid var(--border); border-radius:var(--r-pill); padding:6px 14px; white-space:nowrap}
.chchip:hover{background:var(--surface-2)}
.chchip i{width:11px; height:11px; border-radius:3px; flex:0 0 auto; background:var(--chac);
  box-shadow:inset 0 0 0 1.5px var(--chac)}
.chchip[aria-pressed="false"]{color:var(--muted); background:transparent; border-style:dashed}
.chchip[aria-pressed="false"] i{background:transparent}
.chlegend .hint{font-size:var(--fs-2xs); color:var(--muted); font-weight:400}
/* チャンネルの現在地: 大分類ごとの小さな表を横に並べる。指標名の下に期間・目安を薄字で、
   数字の下の補足（計測済 N 本など）は .sub で1行。幅が足りなければ表が次の段に折り返す */
.nowgrid{display:grid; grid-template-columns:repeat(auto-fit, minmax(340px, 1fr)); gap:var(--sp-3)}
.nowblk{border:1px solid var(--border); border-radius:var(--r-md); overflow:hidden; background:var(--surface-1); min-width:0}
.nowblk table{width:100%; table-layout:auto}
.nowblk th, .nowblk td{padding:7px 10px}
.nowblk thead th{position:static; font-size:var(--fs-2xs); letter-spacing:.05em; text-transform:none; color:var(--ink);
  background:var(--surface-2); border-bottom:1px solid var(--border)}
.nowblk thead th.num{font-size:var(--fs-sm)}
.nowblk tbody th.lb{text-align:left; font-weight:680; color:var(--ink); white-space:normal; vertical-align:top; line-height:1.3}
.nowblk th.lb .subm{display:block; font-size:var(--fs-2xs); color:var(--muted); font-weight:400; white-space:normal; line-height:1.35; margin-top:2px}
.nowblk td.num{vertical-align:top; font-weight:600; white-space:nowrap}
.nowblk td .sub{display:block; font-size:var(--fs-2xs); color:var(--muted); font-weight:400; margin-top:2px; white-space:normal; line-height:1.35}
@media (max-width:640px){
  .nowgrid{grid-template-columns:1fr}
  /* 番組が4つ並ぶと 390px で右端の番組の列が枠に切られていた（表 343px／枠 322px・#604 E5）。
     セルの左右の余白を詰めて枠に収める */
  .nowblk th, .nowblk td{padding:7px 5px}
  .nowblk td .sub{white-space:normal}
  .nowblk td .sub.subw{display:none}   /* 「登録者 433/500・再生 74万/300万」は幅が足りないので畳む */
}
.chcell{display:inline-flex; align-items:center; gap:2px; white-space:nowrap}
/* 視聴の質: チャンネルごとの小さな表（旧 .substats の置き換え） */
.qtbl{font-size:var(--fs-2xs); margin:6px 0 2px}
.qtbl th,.qtbl td{padding:3px 8px 3px 0; border-bottom:none; white-space:nowrap}
.qtbl thead th{position:static; background:transparent; color:var(--muted); font-size:var(--fs-2xs);
  letter-spacing:.03em; text-transform:none; font-weight:600; padding-bottom:1px}
.qtbl td{color:var(--ink); font-variant-numeric:tabular-nums}
.qtbl tbody tr:hover td{background:transparent}
.qtbl td:first-child{font-weight:650}
/* 収益化の予実: チャンネルごとにひとかたまり */
.monetch + .monetch{margin-top:var(--sp-5); padding-top:var(--sp-4); border-top:1px solid var(--border-2)}
.monethd{font-size:var(--fs-sm); font-weight:680; display:flex; align-items:center; gap:2px}

/* ── 分析タブのレイアウト（2026-09-03 作り直し / 09-04 横断化）──────
   PC は2列。表・分布・全件テーブルなど横幅の要るものは .span2 で2列ぶんを使う。 */
.anagrid{display:grid; grid-template-columns:1fr 1fr; gap:var(--sp-4); margin-top:var(--sp-3)}
.anagrid>*{min-width:0}
.anagrid .span2{grid-column:1 / -1}
.anahead{display:flex; align-items:center; gap:var(--sp-3); flex-wrap:wrap; margin-top:var(--sp-4)}
.anahead .chips{margin:0}
.anarange{font-size:var(--fs-2xs); color:var(--muted)}
.anarange.axlbl{margin-left:var(--sp-3)}
.rgbtn .axsw{width:9px; height:9px; border-radius:3px; background:var(--chac); flex:0 0 auto}
/* グラフは幅が決まってから中身を描く（drawSpark）。高さは SVG 側が決める */
.chartwrap{position:relative; margin-top:var(--sp-2); min-width:0}
.chartwrap svg{display:block; width:100%; height:auto; overflow:visible}
/* 軸の説明と指標の1行定義。グラフの上に必ず置く */
.axnote{font-size:var(--fs-2xs); color:var(--muted); margin:0 0 4px; line-height:1.6}
/* 軸の説明をタイトルの横に置く（縦の場所をグラフに回す・2026-09-04）。.hint は全画面で隠す約束なので別クラス */
.sectionhead .axh{font-size:var(--fs-2xs); color:var(--muted); line-height:1.5; flex:1 1 320px; min-width:0}
.defline{font-size:var(--fs-xs); color:var(--ink-2); margin:0 0 4px; line-height:1.6}
/* 視聴の質（4つの分布） */
.qgrid{display:grid; grid-template-columns:1fr 1fr; gap:var(--sp-5) var(--sp-6)}
.qgrid>*{min-width:0}
.qblk h3{font-size:var(--fs-sm); font-weight:680; margin:0 0 3px; display:flex; align-items:baseline;
  gap:8px; flex-wrap:wrap}
.qblk h3 .goal{font-size:var(--fs-2xs); font-weight:600; color:var(--muted)}
/* 収益化の到達見込み */
.meterblk .pace{font-size:var(--fs-2xs); color:var(--ink-2); line-height:1.6; max-width:560px}
/* 公開後7日の初速（横棒）。SVG ではなく素の要素なので幅にそのまま追従する */
.hbars{display:grid; gap:5px; margin-top:var(--sp-2); max-height:340px; overflow-y:auto}
.hbar{display:grid; grid-template-columns:minmax(96px,1.1fr) minmax(60px,2fr) auto; align-items:center;
  gap:9px; font-size:var(--fs-xs)}
.hbar .hlb{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink-2)}
.hbar .hlb b{color:var(--ink); font-weight:700; font-variant-numeric:tabular-nums}
.hbar .htrack{height:11px; border-radius:var(--r-pill); background:var(--surface-2);
  box-shadow:inset 0 0 0 1px var(--border-2); overflow:hidden}
.hbar .hfill{display:block; height:100%; border-radius:var(--r-pill)}
.hbar .hval{font-variant-numeric:tabular-nums; font-weight:680; text-align:right; min-width:56px}
.hbar .hval.dim{font-weight:500; color:var(--muted)}
/* 動画別の成績: 並べ替えできる列見出しと、目安を割った値 */
th.sortable{cursor:pointer; user-select:none}
th.sortable:hover{color:var(--ink)}
th.sortable.on{color:var(--ink)}
td.num.under{color:var(--crit)}
.perftbl td.wrap, .guide td.wrap{white-space:normal; min-width:220px; line-height:1.5}
/* 指標の読み方（既定で閉じる） */
details.guide{padding:var(--sp-4) var(--sp-5)}
details.guide>summary{cursor:pointer; font-size:var(--fs-md); font-weight:680; list-style:none}
details.guide>summary::-webkit-details-marker{display:none}
details.guide>summary::before{content:'▸ '; color:var(--muted)}
details.guide[open]>summary::before{content:'▾ '}
details.guide[open]>summary{margin-bottom:var(--sp-3)}
details.guide .axnote{margin-top:var(--sp-2)}
.minitbl.wide{max-width:420px}
@media (max-width:980px){
  .anagrid{grid-template-columns:1fr}
  .qgrid{grid-template-columns:1fr}
}
@media (max-width:640px){
  .chlegend .hint{flex:1 0 100%}
  .hbar{grid-template-columns:minmax(80px,1fr) minmax(40px,1.2fr) auto; font-size:var(--fs-2xs)}
  .hbar .hval{min-width:44px}
}

/* ═══ ツールチップ / トースト ═══════════════════════════════════ */
#tip{position:fixed; z-index:90; pointer-events:none; opacity:0; transition:opacity .1s;
  background:var(--surface-1); border:1px solid var(--border); border-radius:var(--r-sm); padding:6px 11px;
  font-size:var(--fs-xs); box-shadow:0 4px 14px rgba(0,0,0,.18); font-variant-numeric:tabular-nums;
  white-space:nowrap; color:var(--ink)}
#tip.on{opacity:1}
/* 新版の通知バー（#205）。GitHub Pages の10分キャッシュで古い版を掴んだときに出る */
#newver{position:fixed; z-index:96; left:50%; bottom:92px; transform:translateX(-50%);
  display:flex; align-items:center; gap:10px; max-width:min(560px, calc(100vw - 32px));
  background:var(--fix); color:#fff; font-size:var(--fs-xs); font-weight:680;
  padding:9px 14px; border-radius:var(--r-pill); box-shadow:0 8px 28px rgba(0,0,0,.28)}
#newver button{font-family:inherit; font-size:var(--fs-xs); font-weight:700; cursor:pointer;
  background:#fff; color:var(--fix); border:none; border-radius:var(--r-pill); padding:5px 12px;
  flex:0 0 auto; white-space:nowrap}
/* 書きかけの指摘が消えないことを添える（知らせるだけで、勝手には読み込み直さない・#523） */
#newver .s{font-weight:400; opacity:.9; min-width:0}
#toast{position:fixed; z-index:95; left:50%; bottom:92px; transform:translate(-50%,14px);
  background:var(--ink); color:var(--page); border-radius:var(--r-md); padding:12px 20px; font-size:var(--fs-sm);
  opacity:0; pointer-events:none; transition:opacity .18s, transform .18s; text-align:center;
  width:max-content; max-width:min(430px, calc(100vw - 32px)); box-shadow:0 8px 28px rgba(0,0,0,.28)}
#toast.on{opacity:1; transform:translate(-50%,0); pointer-events:auto}

/* フッターは1行に収める（#205 オーナー指摘: やけに長い・空白が多い）。
   下の余白はスマホの固定タブバーを避ける最小限だけ残す */
footer{max-width:none; margin:0 auto; padding:var(--sp-3) var(--sp-5) var(--sp-4);
  color:var(--muted); font-size:var(--fs-2xs); border-top:1px solid var(--border-2);
  letter-spacing:.02em; line-height:1.7}

@media (max-width:980px){
  .kpis{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:680px){
  body{font-size:14.5px}
  main{padding:var(--sp-4) var(--sp-3) 104px}
  .topbar-in{padding:10px var(--sp-3) 0}
  .nav-in{padding:0}
  .brand{font-size:var(--fs-md); line-height:1.15}
  .chrow{margin-top:var(--sp-2); gap:var(--sp-1)}
  /* チャンネルは「いま見ているものだけ」を出し、押して切り替える（オーナー要望 2026-08-20） */
  .chtabs{display:none}
  .chpickwrap{display:block}
  /* 狭い画面でも共通画面（稼働・システム）はチャンネルタブの右に置く（オーナー指定 2026-08-20）。
     チャンネル名の場所を残すため、この2つは記号だけにして文字を畳む（読み上げと長押しの
     ためのラベルは title / aria-label に残す）。チャンネル側は詰めて横スクロールで逃がす */
  .chtab{padding:8px 10px; gap:5px}
  /* 色の点は省く（記号と、選択中タブ上端の色帯でチャンネルは判る）。名前の場所を優先する */
  .chtab .cdot{display:none}
  .chtab.sys{padding:8px 9px; font-size:var(--fs-md)}
  .chtab.sys .lbl{display:none}
  /* いま開いている共通画面だけは名前を出す（どこにいるかが分かる）。この状態では
     チャンネルタブは沈んでいて選べないので、その場所を借りても困らない */
  .chtab.sys[aria-selected="true"]{font-size:var(--fs-sm)}
  .chtab.sys[aria-selected="true"] .lbl{display:inline}
  .syncchip{display:none}
  /* 下の固定タブバーが無い（＝制作1つだけ）ときは、その分の余白も取らない */
  body[data-solonav="1"] main{padding-bottom:var(--sp-6)}
  body[data-solonav="1"] footer{padding-bottom:var(--sp-4)}
  body[data-solonav="1"] #toast{bottom:16px}
  .nav{position:fixed; bottom:0; left:0; right:0; top:auto; border-top:1px solid var(--border);
    border-bottom:none; background:var(--surface-1); z-index:50; padding-bottom:env(safe-area-inset-bottom)}
  /* タブ数は権限で変わる（制限ありユーザーは「稼働」が出ない・#208 / #249 でシステムが増えた）。
     固定列数にすると人によって右端が余る／はみ出すので、あるぶんだけ等分する */
  .nav-in{display:grid; grid-auto-flow:column; grid-auto-columns:minmax(0,1fr)}
  .navbtn{flex-direction:column; gap:3px; font-size:var(--fs-2xs); padding:9px 2px 8px; border-bottom:none;
    border-top:2px solid transparent; justify-content:center}
  .navbtn[aria-selected="true"]{border-bottom-color:transparent; border-top-color:var(--ink)}
  .navbtn .ni{font-size:1.15rem}
  .navbtn .badge{position:absolute; transform:translate(12px,-9px)}
  .tblwrap.tall{max-height:none}
  #toast{bottom:78px}
  footer{padding-bottom:72px}   /* 固定タブバー(≈64px)を避ける最小限 */
}
/* ═══ スマホ: 上部chrome削減・凡例1行（#201/#202。一覧を上から大きく）
   ※ 説明サブテキスト非表示・ブランドサブタイトル非表示・フィルタ折りたたみは
      base CSS で全画面に適用済み（#202）。ここはスマホ固有の圧縮だけ残す ═══ */
@media (max-width:640px){
  /* eyebrow を畳み、見出しを圧縮して一覧を上へ（PC は eyebrow/h1 を残す） */
  .pagehead{margin-bottom:var(--sp-3)}
  .pagehead .eyebrow{display:none}
  .pagehead h1{font-size:var(--fs-lg); margin:0}
  .sectionhead{margin-bottom:var(--sp-2)}
  /* 工程凡例を1行の極小に（囲みを外し・括弧書きを隠す・マークを縮小） */
  .legend2{gap:10px; padding:2px 0; border:none; background:transparent; margin-bottom:var(--sp-2)}
  .legend2 .ex{display:none}
  .legend2 .exs{display:inline; color:var(--muted)}
  .legend2 .mark{width:15px; height:15px; line-height:15px; font-size:10px}
}
/* ═══ スマホ: 説明バナー（.note）は囲みを外して画面端まで（#205）。運営タブ（実行記録の
   .runs/.run）は 2026-09-29 に外した（#574）。.note の行は詳細の指摘の一覧にも効いているので残す ═══ */
@media (max-width:640px){
  .note{margin-left:calc(-1 * var(--sp-3)); margin-right:calc(-1 * var(--sp-3));
    border-radius:0; border-width:0 0 1px 0; box-shadow:none; margin-bottom:0}
}
/* ═══ スマホの詳細まわりの微調整（#207 / #266 / #509 段1）══════════════════
   ⚠️ .dsec-history / .cmt .bub の基本定義はスタイルシートの前方にあり詳細度も同じなので、
      上書きは必ずここ＝基本定義より後ろに置く。
   2026-09-20 に詳細を1枚の器（.dview に --dpad の余白）へ組み替えたので、囲みごとに
   左右の枠線を落とす「端まで1枚」の指定は不要になった（余白は器が持つ）。 ═══ */
@media (max-width:640px){
  /* ── 入力欄をタップしたときに画面が動くのを止める（オーナー要望 2026-08-20）──────
     iPhone は「文字が16pxより小さい入力欄」に合わせて自動で拡大する。これが
     タップした瞬間に画面がグイッと動く正体なので、スマホでは入力欄だけ16pxにする
     （拡大が起きなければ、戻るときの揺れも起きない）。 */
  .wbox .wta,.abox .ata,.rjbox .rta,.toolbar input[type="search"],.toolbar select,.fld input{
    font-size:16px}
  /* ブラウザが入力欄を見せようとして画面を送るとき、下端のバーのぶん余白を残す */
  .wbox .wta{scroll-margin-bottom:calc(var(--dbar-h) + 52px)}
  /* 吹き出しは狭い画面では幅いっぱいに使う（92ch の上限は横長の画面のためのもの） */
  .dside .cmt .bub{max-width:none}
}
/* ═══ PC（広い画面）だけ本文フォントを少し大きく（#203）
   root を 16→17px にして rem ベースの --fs-* を一律 +約1px。スマホ層(≤680px)は
   別メディアクエリで既に確定済み・ここは min-width:681px に隔離するので不変 ═══ */
@media (min-width:681px){
  html{font-size:17px}
  body{font-size:16px}
}
/* 広い画面ではもう一段上げる（#203・2026-08-11 オーナー要望）。--sp-* は px なので
   余白は変わらず文字だけがスケールする */
@media (min-width:1240px){
  html{font-size:18px}
  body{font-size:17px}
}
@media (min-width:1700px){
  html{font-size:19px}
  body{font-size:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ═══ 完成の承認画面（シーン素材つき・#519 段2/段3）════════════════════════════
   見た目と並びの正本は `dashboard/scene-mockup.html`（オーナー確定済みの見本）。ここは
   その CSS を本体のヘッダー・下端バーの高さに合わせて写したもの。**すべて .sview の中だけ**
   に閉じてあるので、一覧・分析の見た目は変わらない。
   区画は3つ: ① 素材・作ったもの ② 私の指摘 ③ 経緯・履歴。
   広い画面ではページ全体を縦に動かさず、②の一覧・③の中・台本だけが内側でスクロールする。
   --sv-chrome（ヘッダー＋工程の帯＋下端バーの実高さ）は JS が測って入れる。 ═══ */
.sview{--sv-flow-h:46px; --sv-chrome:200px; --side-w:0px;
  --script-w:420px; --mat-min:340px;
  /* --pane-full = 欄そのものの高さ。動画はその 80%（2026-09-21 オーナー指摘・参照画像の
     枚数が増える見込みなので、縮めたぶんの幅を素材の欄へ回す） */
  --pane-full:min(calc(100dvh - var(--sv-chrome) - 158px), 720px);
  --pane-h:calc(var(--pane-full) * .8);
  --video-w:calc(var(--pane-h) * 9 / 16)}
.sview .sv-flow{position:sticky; top:calc(var(--stickytop, 0px) + var(--dhdr-h)); z-index:35;
  height:var(--sv-flow-h); display:flex; align-items:center; gap:var(--sp-4);
  padding:0 var(--sp-2); background:var(--surface-1);
  border:1px solid var(--border); border-top:none; border-radius:0 0 var(--r-md) var(--r-md);
  margin:calc(var(--sp-3) * -1) 0 var(--sp-3); min-width:0}
:is(.sview,.dflow) .sv-steps{display:flex; align-items:center; gap:0; min-width:0; overflow-x:auto;
  scrollbar-width:none; flex:0 1 auto}
:is(.sview,.dflow) .sv-steps::-webkit-scrollbar{display:none}
/* 帯が入りきらず横に送れるときの印（#604 E1）。送れる側の端を薄くする（スクロールバーは出さない作りのため） */
:is(.sview,.dflow) .sv-steps.more-r{-webkit-mask-image:linear-gradient(to right, #000 calc(100% - 32px), transparent);
  mask-image:linear-gradient(to right, #000 calc(100% - 32px), transparent)}
:is(.sview,.dflow) .sv-steps.more-l{-webkit-mask-image:linear-gradient(to left, #000 calc(100% - 32px), transparent);
  mask-image:linear-gradient(to left, #000 calc(100% - 32px), transparent)}
:is(.sview,.dflow) .sv-steps.more-l.more-r{
  -webkit-mask-image:linear-gradient(to right, transparent, #000 32px, #000 calc(100% - 32px), transparent);
  mask-image:linear-gradient(to right, transparent, #000 32px, #000 calc(100% - 32px), transparent)}
/* 矢羽根（シェブロン）の帯（#570）。右が尖り、左が同じ形に欠ける。各工程は2行
   （名前／作るもの・道具。知らせることがある工程だけ2行目が状態の言葉）。済みは色と ✓ で示す。
   左右の余白は矢羽根の欠けと尖りに文字が掛からない分だけ（#604 E1 で詰めた。1400px で 12 個を1行に
   収めるため。足りない分は svFitFlow が長い2行目から縮める） */
:is(.sview,.dflow) .sv-step{--ar:10px; position:relative; display:flex; flex-direction:column; justify-content:center;
  flex:0 0 auto; min-width:72px; height:38px; padding:0 calc(var(--ar) + 3px) 0 calc(var(--ar) + 6px);
  margin-left:calc(2px - var(--ar)); font-size:var(--fs-2xs); line-height:1.35; white-space:nowrap;
  color:var(--muted); background:var(--surface-3);
  clip-path:polygon(0 0, calc(100% - var(--ar)) 0, 100% 50%, calc(100% - var(--ar)) 100%, 0 100%, var(--ar) 50%)}
:is(.sview,.dflow) .sv-step:first-child{margin-left:0; padding-left:12px; border-radius:var(--r-sm) 0 0 var(--r-sm);
  clip-path:polygon(0 0, calc(100% - var(--ar)) 0, 100% 50%, calc(100% - var(--ar)) 100%, 0 100%)}
/* 名前は文字の幅のまま（svFitFlow が名前の幅を縮める下限に使う）。2行目は縮めたら「…」で終える */
:is(.sview,.dflow) .sv-step .nm{font-size:var(--fs-xs); font-weight:650; color:var(--ink-2); align-self:flex-start}
:is(.sview,.dflow) .sv-step .st{font-variant-numeric:tabular-nums; min-width:0; overflow:hidden; text-overflow:ellipsis}
:is(.sview,.dflow) .sv-step.done{background:var(--act-soft); color:var(--sub-ink)}
/* いまの工程。色は一覧の印と同じ決まり（curTone・#637）: AI の作業中＝橙・あなたの番（承認待ち・仕分け待ち）＝青・
   AI修正中＝橙の薄い地・作り直し中＝灰・投稿待ちと予約済み＝濃い灰色（下の既定）・ネタ案＝縁だけ */
:is(.sview,.dflow) .sv-step.cur{background:var(--act); color:var(--act-ink)}
:is(.sview,.dflow) .sv-step.cur.work{background:var(--fix); color:#fff}
:is(.sview,.dflow) .sv-step.cur.rv{background:var(--s1); color:#fff}
:is(.sview,.dflow) .sv-step.cur.rc{background:var(--fix-tint); color:var(--fix-ink)}
:is(.sview,.dflow) .sv-step.cur.rcai{background:var(--axis); color:var(--ink)}
:is(.sview,.dflow) .sv-step.cur.idle{background:var(--surface-1); color:var(--ink-2); box-shadow:inset 0 0 0 1.5px var(--axis)}
:is(.sview,.dflow) .sv-step.cur .st{font-weight:700}
/* 承認ポイントの承認済み＝緑＋承認の日時 */
:is(.sview,.dflow) .sv-step.ok{background:var(--good-tint); color:var(--up)}
:is(.sview,.dflow) .sv-step.ok .st{font-weight:700}
/* 承認の記録なしで通り過ぎた承認ポイント。済みの色を付けない */
:is(.sview,.dflow) .sv-step.nogate{background:var(--surface-3); color:var(--muted)}
:is(.sview,.dflow) .sv-step.nogate .nm{color:var(--muted)}
:is(.sview,.dflow) .sv-step.done .nm,:is(.sview,.dflow) .sv-step.cur .nm,:is(.sview,.dflow) .sv-step.ok .nm{color:inherit}
/* この動画では使わない工程。並びは全番組で同じにして、使わない所だけ斜線の地＋取り消し線 */
:is(.sview,.dflow) .sv-step.skip{color:var(--muted);
  background:repeating-linear-gradient(135deg, var(--sv-skip-a) 0 5px, var(--sv-skip-b) 5px 10px)}
:is(.sview,.dflow) .sv-step.skip .nm{color:var(--muted); font-weight:400;
  text-decoration:line-through; text-decoration-color:var(--muted)}
/* 数えられる作業（#637）のいまの工程の下端の細い進みの棒。文字に掛からないよう中身を少し上げる */
:is(.sview,.dflow) .sv-step.haspb{padding-bottom:8px}
:is(.sview,.dflow) .sv-step .pb{position:absolute; left:calc(var(--ar) + 6px); right:calc(var(--ar) + 3px); bottom:4px;
  height:3px; border-radius:2px; overflow:hidden; background:color-mix(in srgb, var(--act-ink) 28%, transparent)}
:is(.sview,.dflow) .sv-step:first-child .pb{left:12px}
:is(.sview,.dflow) .sv-step .pb>i{display:block; height:100%; background:var(--fix)}
/* 橙の地（AI の作業中）の上では、棒を白にする（橙の上の橙は見えない） */
:is(.sview,.dflow) .sv-step.cur.work .pb{background:rgba(255,255,255,.35)}
:is(.sview,.dflow) .sv-step.cur.work .pb>i{background:#fff}
:is(.sview,.dflow) .sv-step .pb.warn>i,:is(.sview,.dflow) .sv-step.cur.work .pb.warn>i{background:var(--warn)}
/* 帯のすぐ下の「いまの工程」の1行（#637）。記録が無いときは枠ごと消す */
.sv-worknow:empty{display:none}
.sview .sv-worknow{margin:calc(var(--sp-3) * -1 + 6px) 0 var(--sp-3)}
/* 広い画面で棒が画面の端まで伸びないよう、一覧の表の中と同じくらいの幅で止める */
.sv-worknow .wknow{max-width:720px}
/* 素材つきでない詳細画面の帯（作業中の記録がある動画だけ・#637）。貼り付けず、ヘッダの下に置く */
.dflow{display:grid; gap:6px; margin:0 0 var(--sp-3); min-width:0}
.dflow .sv-flow{height:46px; display:flex; align-items:center; padding:0 var(--sp-2); min-width:0;
  background:var(--surface-1); border:1px solid var(--border); border-radius:var(--r-md)}

/* ── 骨組み ── */
.sview .sv-wrap{display:flex; flex-direction:column; gap:var(--sp-3); min-width:0}
.sview .sv-sec{display:flex; flex-direction:column; gap:var(--sp-2); min-width:0; min-height:0;
  background:var(--surface-1); border:1px solid var(--border); border-radius:var(--r-lg);
  padding:var(--sp-4); box-shadow:none}
.sview .sv-sec.sb{background:var(--surface-2)}
.sview .sv-sechd{flex:0 0 auto; height:32px; display:flex; align-items:center; gap:var(--sp-3);
  font-size:var(--fs-lg); font-weight:700; text-align:left; min-width:0}
.sview .sv-sechd .facts{margin-left:auto; font-size:var(--fs-xs); font-weight:400; color:var(--muted);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0}
.sview .sv-sechd .facts b{font-weight:700; color:var(--ink-2); font-variant-numeric:tabular-nums}
.sview .sv-stage{display:grid; min-width:0; min-height:0; column-gap:var(--sp-4); row-gap:var(--sp-2)}
.sview .sv-matcol{display:flex; flex-direction:column; gap:var(--sp-2); min-width:0; min-height:0}
.sview .sv-mattabs{display:none; align-items:center; gap:4px; min-width:0}
.sview .sv-mattabs button{font-family:inherit; font-size:var(--fs-2xs); cursor:pointer; height:22px;
  padding:0 12px; border:1px solid var(--border); background:var(--surface-2); color:var(--ink-2);
  border-radius:var(--r-pill)}
.sview .sv-mattabs button[aria-pressed="true"]{background:var(--act-soft); color:var(--sub-ink);
  border-color:var(--act-line); font-weight:680}

/* ── 同じ検証の複数の案のタブ（#523・置き場所と見た目はオーナー決定 2026-09-29 案A）──────
   ①「素材・作ったもの」の見出し行の中（見出しの文字の右・facts の左）に置く下線型のタブ。
   押すと映像と素材と時刻表が入れ替わる（指摘の一覧は共通のまま）。
   見出し行と同じ 32px に収める（行を高くしない＝動画が縮まない）。案が無い動画ではタブ帯は
   hidden のままで、下線も引かれず見出し行は今までと同じ見た目になる。
   スマホ（899px 以下）は svMobileLayout が上の帯へ移す（大きさの調整はスマホの @media の中） */
.sview .sv-sechd .sttl{flex:0 0 auto; white-space:nowrap}   /* 見出しの文字（タブに押されて折り返さない）*/
/* 行の幅いっぱいの下線（box-shadow なので高さは増えない）。タブ帯があるときだけ */
.sview .sv-sechd:has(> .sv-vtabs:not([hidden])){box-shadow:inset 0 -1px 0 var(--border)}
/* 幅が足りないときに縮むのはタブの側（facts は押し出さない・タブは横スクロールになる） */
.sview .sv-sechd:has(> .sv-vtabs:not([hidden]))>.facts{flex-shrink:0}
.sview .sv-vtabs{flex:0 1 auto; align-self:stretch; display:flex; gap:4px; min-width:0;
  overflow-x:auto; overflow-y:hidden; scrollbar-width:none}   /* 収まらなければ横スクロール（バーは隠す）*/
.sview .sv-vtabs::-webkit-scrollbar{display:none}
.sview .sv-vtabs .vtab{flex:0 0 auto; height:32px; padding:0 14px; display:inline-flex;
  flex-direction:column; align-items:center; justify-content:center; white-space:nowrap; cursor:pointer;
  font-family:inherit; font-size:var(--fs-sm); font-weight:400; color:var(--ink-2);
  background:transparent; border:0; border-radius:var(--r-sm) var(--r-sm) 0 0}
.sview .sv-vtabs .vtab:hover{background:var(--surface-2)}   /* 非選択のタブ: ホバーで薄い地 */
.sview .sv-vtabs .vtab[aria-selected="true"]{font-weight:700; color:var(--ink);
  box-shadow:inset 0 -3px 0 var(--act); background:transparent}   /* 選択中: 太字＋下端の線 */
.sview .sv-vtabs .vtab:focus-visible{outline:2px solid var(--act-line); outline-offset:-2px}
/* 太字になっても幅が変わらないよう、太字の幅を先に取っておく（押したときにタブが横にずれない）。
   data-label には svBuildVariantTabs がタブの文字と同じものを入れる */
.sview .sv-vtabs .vtab::after{content:attr(data-label); font-weight:700; height:0; overflow:hidden;
  visibility:hidden}
/* 読めない案は押せない見た目に（「素材なし」の面と同じ流儀の薄い無彩色の文字・ホバーしても地を付けない） */
.sview .sv-vtabs .vtab.none{color:var(--muted); cursor:default; font-weight:400}
.sview .sv-vtabs .vtab.none:hover{background:transparent}

/* ── 動画のかたまり ── */
.sview .sv-screens{display:grid; grid-template-columns:repeat(2, minmax(0, var(--video-w)));
  justify-content:start; gap:var(--sp-3); min-width:0}
/* ⚠️ 参照動画の列は**常に出す**（オーナー指摘 2026-09-21）。番組や動画によって列が消えると
   並びが揃わないので、1本も無い動画でも同じ大きさの枠を置いて中に「素材なし」と書く */
.sview .sv-screen{display:flex; flex-direction:column; gap:var(--sp-2); min-width:0}
/* 主画面に出せる動画がまだ無く、目録の「通しの参照動画」を借りている回だけ、
   借りた通しを**参照動画の列の位置**へ、本来の動画の位置（左）を「素材なし」の面へ入れ替える
   （オーナー決定 2026-09-21）。入れ替えるのは見た目の位置と見出しだけで、連動の親・指摘に付く
   ファイル名・尺の照合は主画面の動画のまま。ショットごとの参照動画がある回は入れ替えない。
   どの幅でも .sv-screens は「左右2つ」なので、order だけで足りる（縦に積む状態は無い） */
.sview .sv-stage[data-borrow="1"] .sv-screen.final{order:2}
.sview .sv-stage[data-borrow="1"] .sv-screen.ref{order:1}
.sview .sv-scrhd{display:flex; align-items:baseline; gap:var(--sp-2); min-width:0; padding:0 2px}
.sview .sv-scrhd .scrttl{font-size:var(--fs-xs); font-weight:700; letter-spacing:.08em;
  color:var(--muted); flex:0 0 auto}
.sview .sv-scrhd .scrsub{font-size:var(--fs-2xs); color:var(--muted); min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.sview .sv-scrhd .scrpick{display:flex; gap:4px; margin-left:auto; flex:0 0 auto}
.sview .sv-scrhd .scrpick button{font-family:inherit; font-size:var(--fs-2xs); cursor:pointer;
  border:1px solid var(--border); background:var(--surface-2); color:var(--ink-2);
  border-radius:var(--r-sm); min-width:28px; height:26px; padding:0 6px}
.sview .sv-scrhd .scrpick button[aria-pressed="true"]{background:var(--act-soft); color:var(--sub-ink);
  border-color:var(--act-line); box-shadow:inset 0 0 0 1px var(--act-line)}
.sview .sv-scrhd .refdone{margin-left:auto; font-size:var(--fs-2xs); color:var(--attn-ink);
  background:var(--attn); border-radius:var(--r-pill); padding:0 8px}
/* 動画の枠は本体の .vidbox をそのまま使い、大きさだけこの画面の寸法に合わせる */
.sview .vidbox{margin:0; width:100%; box-shadow:none; border-radius:var(--r-lg)}
.sview .pin{border-color:var(--mark); background:var(--mark-fill)}
.sview .seek .tpfill,.sview .seek .knob{background:var(--act)}
.sview .seek .tpmark{background:var(--mark)}
/* 止めている間も動画の上に大きな再生ボタンは出さない（絵が隠れて邪魔・オーナー指摘）。
   再生中か止めているかは、下の操作バーの ▶／❚❚ で分かる */
/* ── 「素材なし」の見た目は1種類だけ（オーナー指摘 2026-09-21）────────────────
   **枠は必ず作り、中に「素材なし」と書く**（欄そのものを消さない＝歯抜けにしない）。
   破線は「欠けている」ように見えるので使わず、薄い無彩色の面＋小さな文字に統一する。 */
.sview .sv-refempty,.sview .sv-nomat{display:grid; place-content:center; align-content:center;
  gap:var(--sp-1); padding:var(--sp-3); text-align:center; background:var(--surface-2);
  color:var(--ink-2); font-size:var(--fs-sm); line-height:var(--lh-tight)}
.sview .sv-refempty{position:absolute; inset:0; z-index:3; padding:var(--sp-5)}
.sview .sv-refempty .rsub,.sview .sv-nomat .rsub{font-size:var(--fs-xs); color:var(--muted)}
/* 操作は1つだけ（2本は連動して進む）。動画の下に1行で置く */
.sview .sv-ctrls-slot{display:flex; align-items:center; min-width:0}
.sview .sv-ctrls-slot .ctrls{flex:1 1 auto; margin:0; background:transparent; border:none;
  border-top:1px solid var(--border); border-radius:0; padding:var(--sp-2) 0; flex-wrap:nowrap}
.sview .sv-ctrls-slot .seek{flex:1 1 auto; order:0; min-width:60px}
.sview .sv-ctrls-slot .ctime{margin-left:0}
.sview .sv-ctrls-slot .ctrls.off{opacity:.45; pointer-events:none}
.sview .sv-refctrls{display:flex; align-items:center; gap:var(--sp-2); min-width:0;
  border-top:1px solid var(--border); padding:var(--sp-2) 0}
.sview .sv-refctrls.off{opacity:.45; pointer-events:none}
.sview .sv-refctrls .seek{position:relative; flex:1 1 auto; height:36px; cursor:pointer;
  touch-action:none; min-width:60px; order:0}

/* ── 欄の見出し・台本 ──
   ⚠️ シーンの帯（再生の操作の下のサムネの列）は 2026-09-21 に廃止した（オーナー指摘）。
   開始フレームのサムネは**台本の各行の左**に付いている。空いた高さは動画・台本・素材へ回した。 */
.sview .sv-colhd{font-size:var(--fs-xs); font-weight:700; letter-spacing:.08em; color:var(--muted);
  padding:0 2px; display:flex; align-items:center; gap:var(--sp-2); height:18px; line-height:18px}
.sview .sv-colhd .n{font-weight:400; letter-spacing:0; margin-left:auto}
.sview .sv-scrhd{height:18px; line-height:18px; align-items:center}
.sview .sv-script{min-width:0; min-height:0; display:flex; flex-direction:column; gap:var(--sp-2)}
.sview .sv-script>.shd{display:flex; align-items:center; gap:var(--sp-2); font-size:var(--fs-xs);
  font-family:inherit; background:none; border:none; width:100%; text-align:left;
  font-weight:700; letter-spacing:.08em; color:var(--muted); padding:0 2px; list-style:none;
  cursor:default; height:18px; line-height:18px}
.sview .sv-script>.shd .n{font-weight:400; letter-spacing:0; margin-left:auto}
.sview .sv-script.closed>.sv-scriptlist{display:none}
.sview .sv-scriptlist{max-height:min(38dvh, 340px); overflow-y:auto; scrollbar-width:thin;
  display:flex; flex-direction:column}
/* 台本の1行 = 開始フレームのサムネ ｜ シーン番号・時刻・指摘の数 ｜ ナレーション */
.sview .sv-sline{--sth:56px;
  display:grid; grid-template-columns:calc(var(--sth) * 9 / 16) 46px minmax(0,1fr); gap:var(--sp-2);
  align-items:start; font-family:inherit; text-align:left; background:transparent; border:none;
  border-left:3px solid transparent; border-bottom:1px solid var(--border-2);
  padding:7px 8px 7px 6px; cursor:pointer; color:var(--ink-2); font-size:var(--fs-sm);
  line-height:var(--lh-tight); min-height:calc(var(--sth) + 14px)}
.sview .sv-sline:last-child{border-bottom:none}
.sview .sv-sline:hover{background:var(--surface-2)}
/* サムネと「素材なし」の面は同じ大きさ（前回統一した見た目の小さい版） */
.sview .sv-sline .sth,.sview .sv-sline .sthnone{width:100%; height:var(--sth);
  border-radius:4px; border:1px solid var(--border-2); background:var(--surface-3); display:block}
.sview .sv-sline .sth{object-fit:cover}
.sview .sv-sline .sthnone{background:var(--surface-2); color:var(--muted);
  display:grid; place-items:center; text-align:center; font-size:9px; line-height:1.15;
  white-space:pre-line}
.sview .sv-sline .smeta{display:flex; flex-direction:column; gap:2px; min-width:0}
.sview .sv-sline .sn{font-size:var(--fs-xs); font-weight:700; color:var(--muted);
  font-variant-numeric:tabular-nums}
.sview .sv-sline .stm{font-size:var(--fs-2xs); color:var(--muted); font-variant-numeric:tabular-nums}
/* そのシーンに前回の指摘が何件あるか（帯の印から移した） */
.sview .sv-sline .nmark{align-self:flex-start; font-size:9px; line-height:15px; font-weight:700;
  background:var(--mark); color:#fff; border-radius:var(--r-pill); padding:0 6px; white-space:nowrap}
.sview .sv-sline[aria-current="true"]{background:var(--act-soft); border-left-color:var(--act-line);
  color:var(--ink)}
.sview .sv-sline[aria-current="true"] .sn{color:var(--sub-ink)}
/* 台本の中の「素材なし」（欄いっぱいの面にする＝枠は残る） */
.sview .sv-scriptlist>.sv-nomat{flex:1 1 auto; align-self:stretch;
  border-radius:var(--r-sm); min-height:44px}
/* 素材表が無いときのナレーションの場所（行の形は保ったまま「素材なし」と書く） */
.sview .sv-sline .snone{color:var(--muted); font-size:var(--fs-xs)}

/* ── いまのシーンの素材 ── */
.sview .sv-now{min-width:0; --slot-h:180px; padding:0}
.sview .sv-now .l1{display:flex; align-items:baseline; gap:7px; flex-wrap:wrap; margin-bottom:2px}
.sview .sv-now .nn{font-size:var(--fs-md); font-weight:700}
.sview .sv-now .ntt{font-size:var(--fs-sm); color:var(--ink-2); overflow:hidden;
  text-overflow:ellipsis; white-space:nowrap; min-width:0}
.sview .sv-now .nt{font-size:var(--fs-xs); color:var(--muted); font-variant-numeric:tabular-nums;
  margin-left:auto}
.sview .sv-now .nar{font-size:var(--fs-sm); color:var(--ink-2); line-height:var(--lh-tight);
  margin-bottom:var(--sp-2); overflow-wrap:anywhere}
.sview .sv-shelf{display:flex; flex-direction:column; gap:var(--sp-2); min-width:0}
/* 参照画像が増えたら**横スクロールではなく折り返して複数行**に並べる（オーナー指摘 2026-09-21）。
   入りきらないぶんは素材の欄（.sv-now）の中だけを縦にスクロールする */
.sview .sv-shelfrow{display:flex; flex-wrap:wrap; gap:var(--sp-2); padding-bottom:4px;
  align-items:flex-start; min-width:0}
.sview .sv-refbox{border:none; background:transparent; padding:var(--sp-2) 0 0;
  border-top:1px solid var(--border-2); min-width:0; --ref-h:var(--slot-h)}
.sview .sv-refbox .refhd{display:flex; align-items:baseline; gap:6px; font-size:var(--fs-xs);
  font-weight:700; color:var(--ink-2); margin-bottom:6px}
.sview .sv-refbox .refhd .n{font-weight:400; color:var(--muted); margin-left:auto}
/* 指摘の入力のそばの1行（参照画像の番号で書ける案内・#549） */
.svrefnote{flex:0 0 auto; font-size:var(--fs-2xs); color:var(--muted); margin:2px 0}
.svrefnote[hidden]{display:none}
.sview .sv-refbox .sv-slot{width:calc(var(--ref-h) * 9 / 16)}
.sview .sv-refbox .sv-slot .shot,.sview .sv-refbox .sv-slot .none{height:var(--ref-h)}
.sview .sv-slot{flex:0 0 auto; display:flex; flex-direction:column; gap:3px;
  width:calc(var(--slot-h) * 9 / 16)}
/* 見出しは目録の label をそのまま出すので、枠の幅（9:16）では1行に収まらない
   （「①閉じた列の真上から」で 185px 必要・枠は 72px＝7文字で切れていた・#536 低）。
   枠の大きさは決まりなので**見出しだけ3行まで折り返す**（枠の幅 72px × 3 = 216px ぶん）。
   高さは2行ぶんを下限にして、短い見出しどうしでは画像の上端が揃うようにする */
.sview .sv-slot .cap{font-size:var(--fs-2xs); color:var(--muted); line-height:1.3;
  white-space:normal; overflow-wrap:anywhere; min-height:2.6em; overflow:hidden;
  display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical}
.sview .sv-slot .shot{width:100%; height:var(--slot-h); border-radius:var(--r-sm);
  border:1px solid var(--border); background:var(--surface-3); padding:0; cursor:zoom-in;
  overflow:hidden; display:block}
.sview .sv-slot .shot img{display:block; width:100%; height:100%; object-fit:contain;
  background:var(--surface-3)}
/* 素材が無い枠も**同じ大きさ**で置く（破線にしない・薄い面＋小さな文字） */
.sview .sv-slot .none{width:100%; height:var(--slot-h); border-radius:var(--r-sm);
  border:1px solid var(--border); background:var(--surface-2); display:grid; place-items:center;
  align-content:center; gap:3px; text-align:center; padding:6px;
  font-size:var(--fs-xs); color:var(--ink-2); line-height:1.35}
.sview .sv-slot .none .rsub{font-size:var(--fs-2xs); color:var(--muted)}
.sview .sv-sep{flex:0 0 auto; align-self:center; color:var(--muted); font-size:var(--fs-sm); padding:0 1px}

/* 大きく表示（ライトボックス） */
.sv-lbox{position:fixed; inset:0; z-index:80; background:rgba(0,0,0,.82);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:var(--sp-2); padding:var(--sp-4)}
.sv-lbox img{max-width:min(100%, 62dvh); max-height:76dvh; object-fit:contain;
  border-radius:var(--r-md); background:#000}
.sv-lbox .lcap{color:#fff; font-size:var(--fs-sm); text-align:center; max-width:90vw}
.sv-lbox .lnav{display:flex; align-items:center; gap:var(--sp-3)}
.sv-lbox .lnav button{font-family:inherit; font-size:var(--fs-sm); color:#fff; cursor:pointer;
  background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.34);
  border-radius:var(--r-md); min-width:56px; min-height:44px; padding:0 14px}
.sv-lbox .lnav button:hover{background:rgba(255,255,255,.3)}
.sv-lbox .lnav button:disabled{opacity:.35; cursor:default}
.sv-lbox .lhint{color:rgba(255,255,255,.72); font-size:var(--fs-2xs); text-align:center}

/* ── ②私の指摘（本体の .decide は display:contents で②の直下に並べる）── */
.sview .sv-sec.sb .decide{display:contents}
.sview .sv-sec.sb .abox{order:1; border:none; background:transparent; box-shadow:none; padding:0;
  gap:var(--sp-2)}
.sview .sv-sec.sb .abox .dcg{display:none}       /* 承認ポイント名と版は上のヘッダに出ている */
/* 「この版で変えたこと」と申し送りは見本に無いが、安全に関わるので②の先頭に残す。
   面の色だけこの画面のくすんだ色に合わせる（鮮やかな青は大きな面に使わない） */
.sview .sv-sec.sb .dcchg{background:var(--act-soft)}
.sview .sv-sec.sb .dcchg .k{color:var(--sub-ink)}
.sview .sv-sec.sb .acaution{background:var(--attn); color:var(--attn-ink); border-color:transparent}
.sview .sv-sec.sb .abox .afold>.dsum{color:var(--muted)}
.sview .sv-sec.sb .wbox{order:2; margin:0; background:transparent; border:none; padding:0;
  display:flex; flex-direction:column; flex:1 1 auto; min-height:0; overflow:hidden}
.sview .sv-sec.sb .rjbox{order:3; margin:0; padding:0; border-top:none}
.sview .sv-sec.sb .dstate{order:1; margin:0}
.sview .tapbox{flex:1 1 auto; min-height:0; gap:var(--sp-2)}
.sview .addrow{flex:0 0 auto; display:flex; flex-direction:row; flex-wrap:wrap; gap:var(--sp-2)}
.sview .addrow .btn{flex:0 0 auto; width:auto; min-height:44px; white-space:nowrap}
.sview .addrow .btn[aria-pressed="true"]{background:var(--act-soft); border-color:var(--act-line);
  color:var(--sub-ink); font-weight:650; box-shadow:inset 0 0 0 1px var(--act-line)}
.sview .addrow .btn[aria-pressed="true"]:hover{background:var(--act-soft); filter:none}
.sview .tapbox .nhd{display:none}                /* 件数は②の見出しに出す */
/* 見本の並び: 入口の2ボタン → （入力シート）→ 指摘の一覧 → 全体へのメモ */
.sview .addrow{order:1}
.sview .sheet{order:2}
.sview .nlistwrap{order:3; flex:1 1 auto; min-height:0; overflow-y:auto; scrollbar-width:thin}
.sview .tapbox>.svmemo{order:4; flex:0 0 auto}
.sview .nlist{gap:0}
.sview .nitem{background:transparent; border:none; border-top:1px solid var(--border-2);
  border-radius:0; padding:var(--sp-2) 0}
.sview .nlist .nitem:first-child{border-top:none}
.sview .nitem.cur{background:var(--act-soft); border-color:var(--border-2)}
.sview .tpempty{border:none; background:transparent; text-align:left; padding:2px}
.sview .memo,.sview .noteinput{background:var(--page)}
.sview .memo{height:72px; min-height:72px; max-height:72px; resize:none}
.sview .sheet{border-color:var(--act-line); flex:1 1 auto; min-height:0; overflow-y:auto;
  scrollbar-width:thin; border-radius:var(--r-md)}
.sview .tagbtn[aria-pressed="true"]{background:var(--act-soft); border-color:var(--act-line);
  color:var(--sub-ink); font-weight:650; box-shadow:inset 0 0 0 1px var(--act-line)}
.sview .nrec.jump:hover{background:var(--act-soft)}
.sview .gbadge.fix{background:var(--attn); color:var(--attn-ink)}
/* 入力シートが開いているあいだは一覧の場所を譲る（動画は動かさない） */
.sview .sv-sec.sb.sheeton .nlistwrap{display:none}
/* シートは**中身の高さぶん**取る（枠に合わせて縮めない・監査 #533）。縮めると定型の札の
   3段目・自由記述の欄・「この指摘を足す」「やめる」が内側のスクロールの下に隠れ、そこに
   続きがあるという手がかりが出ない（PC 1400×900 の実測で 291px の中身が 94px に潰れていた）。
   足りないぶんは②の枠ごと動かす（入れ子の内側だけを動かすのはやめる）。
   スマホは下端の固定シート（.sheet.float・position:fixed）で全部見えているので触らない。 */
@media (min-width:900px){
  .sview .sv-sec.sb.sheeton .sheet{flex:0 0 auto; overflow:visible}
  .sview .sv-sec.sb.sheeton .wbox{overflow-y:auto; scrollbar-width:thin}
}

/* ── ③ 前回までの私の指摘（2026-09-21 に「経緯・履歴」から作り替え・オーナー指摘）──
   出すのは**オーナー自身の指摘だけ**。AI の記録・工程の履歴・フックと、詳細への切り替えは
   この画面から外した（対応の記録は②の先頭の「変更」に出ている）。 */
.sview .sv-prevlist{flex:1 1 auto; min-height:0; overflow-y:auto; scrollbar-width:thin;
  display:flex; flex-direction:column}
.sview .sv-prow{display:flex; flex-direction:column; gap:3px; font-family:inherit; text-align:left;
  background:transparent; border:none; border-top:1px solid var(--border-2); border-left:3px solid transparent;
  border-radius:0; padding:7px 6px; cursor:pointer; color:var(--ink-2);
  font-size:var(--fs-sm); line-height:var(--lh-tight)}
.sview .sv-prevlist>.sv-prow:first-child{border-top:none}
.sview .sv-prow:hover{background:var(--surface-1)}
.sview .sv-prow.cur{background:var(--act-soft); border-left-color:var(--act-line); color:var(--ink)}
.sview .sv-prow .m{display:flex; align-items:center; gap:6px; flex-wrap:wrap; min-width:0}
.sview .sv-prow .m .rev{font-size:var(--fs-2xs); font-weight:700; color:var(--sub-ink);
  background:var(--act-soft); border-radius:var(--r-pill); padding:0 7px}
.sview .sv-prow .m .dt,.sview .sv-prow .m .tm,.sview .sv-prow .m .sc{font-size:var(--fs-2xs);
  color:var(--muted); font-variant-numeric:tabular-nums}
.sview .sv-prow .b{overflow-wrap:anywhere; white-space:pre-wrap}
.sview .sv-prevempty{font-size:var(--fs-sm); color:var(--muted); padding:2px}

/* ── 下端の固定バー（左＝事実・右＝3つのボタン）── */
.sview .dbar{gap:var(--sp-6)}
.sview .dbar .sv-barfacts{display:flex; align-items:center; gap:var(--sp-5); min-width:0;
  flex:1 1 auto; font-size:var(--fs-sm); color:var(--ink-2)}
.sview .dbar .sv-barfacts .bf{display:flex; align-items:center; gap:7px; white-space:nowrap; min-width:0}
.sview .dbar .sv-barfacts .bf .k{color:var(--muted); font-size:var(--fs-xs)}
.sview .dbar .sv-barfacts .bf b{color:var(--ink); font-weight:700; font-variant-numeric:tabular-nums}
.sview .sv-watchbar{width:120px; height:6px; border-radius:var(--r-pill); background:var(--surface-3);
  overflow:hidden; position:relative; flex:0 0 auto}
.sview .sv-watchbar i{position:absolute; top:0; bottom:0; background:var(--act)}
.sview .dbar .sv-barfacts .next{color:var(--muted); font-size:var(--fs-xs); overflow:hidden;
  text-overflow:ellipsis}
.sview .dbar .btn{height:48px; min-height:48px; background:var(--surface-1); color:var(--sub-ink);
  border-color:var(--border); padding:0 10px}
.sview .dbar .btn:hover{background:var(--surface-3)}
/* 幅は役目で決め打ちにする（件数が増えても・主役が入れ替わってもボタンは伸び縮みしない） */
.sview .dbar [data-act="comment"]{flex:0 0 152px; width:152px}
.sview .dbar [data-act="approve-quick"]{flex:0 0 144px; width:144px}
.sview .dbar .btn.soft{background:var(--surface-1); color:var(--sub-ink); border-color:var(--border);
  font-weight:680}
.sview .dbar .btn.soft.on{background:var(--attn); color:var(--attn-ink); border-color:var(--attn-ink)}
.sview .dbar .btn.primary{background:var(--act); color:var(--act-ink); border-color:transparent}
.sview .dbar .btn.primary:hover{background:var(--act); filter:brightness(1.1)}
.sview .dbar .btn.kill{flex:0 0 88px; width:88px; background:transparent; color:var(--ink-2)}
.sview .dbar .btn.kill:hover{background:var(--danger-tint); color:var(--danger); border-color:var(--danger)}
@media (max-width:1199px){ .sview .dbar .sv-barfacts .next{display:none} }

/* ── 広い画面: ページ全体を動かさない ── */
@media (min-width:1400px){
  .sview{--side-w:clamp(420px, 21vw, 560px)}
  body.sv-lock{overflow:hidden; height:100dvh}
  body.sv-lock main{padding-top:var(--sp-3); padding-bottom:0}
  body.sv-lock #footer{display:none}
  .sview .sv-wrap{display:grid; overflow:hidden; gap:var(--sp-4);
    height:calc(100dvh - var(--sv-chrome));
    grid-template-columns:minmax(0,1fr) var(--side-w);
    grid-template-rows:minmax(0,1fr) clamp(200px, 26dvh, 296px)}
  .sview .sv-sec{overflow:hidden}
  .sview .sv-sec.sa{grid-column:1; grid-row:1 / span 2}
  .sview .sv-sec.sb{grid-column:2; grid-row:1}
  .sview .sv-sec.sc{grid-column:2; grid-row:2}
  .sview .sv-sec.sa .sv-stage{flex:1 1 auto; overflow:hidden}
  /* 入力シートを開いているあいだだけ②を右の列いっぱいに伸ばし、③の上に重ねる（#533）。
     ①は grid-row 1 / span 2 のままなので**動画と台本の大きさは変わらない**。
     行の高さも変えないので、ページ全体が縦に動くこともない。 */
  .sview .sv-sec.sb.sheeton{grid-row:1 / span 2; position:relative; z-index:2}
  .sview .sv-wrap:has(.sv-sec.sb.sheeton) .sv-sec.sc{visibility:hidden}
}
/* ≧1700px: 台本・動画2本・素材の3列（上下端をそろえる） */
@media (min-width:1700px){
  /* 台本はサムネつきの行になったので少し広く取る（目安 420px 前後） */
  .sview{--script-w:clamp(360px, 17vw, 460px); --mat-min:340px;
    --pane-full:min(calc(100dvh - var(--sv-chrome) - 158px),
      calc((100vw - var(--side-w) - var(--script-w) - var(--mat-min) - 136px) / 2 * 16 / 9 / .8));
    --pane-h:calc(var(--pane-full) * .8);
    --video-w:calc(var(--pane-h) * 9 / 16)}
  /* 真ん中は「動画2本 → そのすぐ下に再生の操作」で上詰め。台本と素材は①の下端まで伸ばす */
  .sview .sv-sec.sa .sv-stage{grid-template-columns:var(--script-w) auto minmax(0,1fr);
    grid-template-rows:18px var(--pane-h) 56px minmax(0,1fr)}
  .sview .sv-sec.sa .sv-script{grid-column:1; grid-row:1 / -1}
  .sview .sv-sec.sa .sv-screens{grid-column:2; grid-row:1 / span 2}
  .sview .sv-sec.sa .sv-matcol{grid-column:3; grid-row:1 / -1}
  .sview .sv-sec.sa .sv-ctrls-slot{grid-column:2; grid-row:3}
}
/* 1200〜1399px: ②③は右に縦積み（ページの縦スクロールは許す） */
@media (min-width:1200px) and (max-width:1399px){
  .sview{--side-w:400px}
  .sview .sv-wrap{display:grid; gap:var(--sp-4); align-items:start;
    grid-template-columns:minmax(0,1fr) var(--side-w)}
  .sview .sv-sec.sa{grid-column:1; grid-row:1 / span 2}
  .sview .sv-sec.sb{grid-column:2; grid-row:1}
  .sview .sv-sec.sc{grid-column:2; grid-row:2}
}
/* 900〜1699px: 台本と素材は同じ場所をタブで入れ替える（3列だと動画が小さくなりすぎる） */
@media (min-width:900px) and (max-width:1699px){
  .sview{--script-w:clamp(300px, 26vw, 420px);
    --pane-full:min(calc(100dvh - var(--sv-chrome) - 162px), 720px,
      calc((100vw - var(--side-w) - var(--script-w) - 120px) / 2 * 16 / 9 / .8));
    --pane-h:calc(var(--pane-full) * .8);
    --video-w:calc(var(--pane-h) * 9 / 16)}
  .sview .sv-sec.sa .sv-stage{grid-template-columns:minmax(0, var(--script-w)) auto;
    grid-template-rows:22px var(--pane-h) 56px minmax(0,1fr)}
  .sview .sv-sec.sa .sv-mattabs{display:flex; grid-column:1; grid-row:1}
  .sview .sv-sec.sa .sv-script,.sview .sv-sec.sa .sv-matcol{grid-column:1; grid-row:2 / -1}
  .sview .sv-sec.sa .sv-screens{grid-column:2; grid-row:1 / span 2}
  .sview .sv-sec.sa .sv-ctrls-slot{grid-column:2; grid-row:3}
  .sview .sv-sec.sa .sv-script>.shd,.sview .sv-sec.sa .sv-matcol>.sv-colhd{display:none}
  .sview .sv-scrhd{height:22px; line-height:22px}
  .sview .sv-stage[data-mat="mat"] .sv-script{display:none}
  .sview .sv-stage[data-mat="script"] .sv-matcol{display:none}
}
/* 900px 以上の共通: 4つの欄の上端をそろえ、台本と素材は①の下端まで伸ばす
   （真ん中＝動画と再生の操作は短くてよい＝上詰め） */
@media (min-width:900px){
  .sview .sv-script,.sview .sv-matcol{min-height:0}
  .sview .sv-scriptlist{flex:1 1 0; height:auto; max-height:none; min-height:0; overflow-y:auto}
  .sview .sv-screens{grid-template-columns:repeat(2, var(--video-w)); gap:12px; align-self:start}
  .sview .vidbox{height:var(--pane-h); width:var(--video-w); aspect-ratio:auto; min-height:0}
  /* 素材の画像も欄の高さの 80%（参照画像が増えても折り返しで収める） */
  .sview .sv-now{flex:1 1 auto; height:auto; min-height:0; overflow-y:auto; scrollbar-width:thin;
    --slot-h:calc((var(--pane-full) - 176px) / 2 * .8)}
  .sview .sv-ctrls-slot{align-self:start}
  .sview .sv-viewswitch{display:none}
}
/* ── スマホ（900px 未満）: スクロールしない1画面（#552・オーナー確定 2026-09-25）──────────
   上から「上の帯・動画・再生の操作・タブ・（タブの中身）・下の帯」を画面の高さぴったりに並べる。
   区画の入れ物（.sv-wrap・①・②・.decide・.abox・.wbox・.rjbox）は display:contents で外し、
   中身をこの画面の格子へ直接置く——送信の仕組みが頼っている親子（.decide の中の4つの囲み・
   .wbox の中の .tapbox）は動かさない。JS で場所を移すのは 参照動画・案のタブ・前回までの指摘・
   注意書き の4つだけ（svMobileLayout。広い画面に戻れば元の場所へ返す）。
   高さは visualViewport の実高さ（--sv-vh）。キーボードが出ると画面ごと縮み、動画は上に残る。 */
@media (min-width:900px){ .sv-m-only{display:none!important} }
@media (max-width:899px){
  body.sv-mobile{overflow:hidden; overscroll-behavior:none}
  .sview{position:fixed; left:0; right:0; top:var(--sv-vtop, 0px); z-index:45;
    height:var(--sv-vh, 100dvh); margin:0; max-width:none; animation:none;
    background:var(--page); overflow:hidden; overflow:clip;
    display:grid; grid-template-columns:minmax(0,1fr);
    grid-template-rows:auto auto minmax(0,1fr) auto auto 0px auto auto;
    grid-template-areas:"top" "now" "video" "ctrls" "tabs" "panel" "msg" "bar";
    padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
  .sview.hasbar,body.sheetopen .sview.hasbar{padding-bottom:0}
  /* タブを開いているあいだは動画と中身で半分ずつ。入力欄・没の理由は中身の高さぶん */
  .sview[data-mtab="mat"],.sview[data-mtab="script"],.sview[data-mtab="notes"]{
    grid-template-rows:auto auto minmax(0,1fr) auto auto minmax(0,1fr) auto auto}
  .sview:has(.rjpanel:not([hidden])){
    grid-template-rows:auto auto minmax(0,1fr) auto auto auto auto auto}
  /* 外す入れ物（中身だけを格子に並べる） */
  .sview .sv-wrap,.sview .sv-sec.sa,.sview .sv-sec.sa .sv-stage,.sview .sv-screens,
  .sview .sv-sec.sb,.sview .sv-sec.sb .decide,.sview .sv-sec.sb .abox,.sview .sv-sec.sb .wbox,
  .sview .sv-sec.sb .rjbox{display:contents}
  /* 出さないもの: 工程の矢印・区画の見出し・PC の切替と入口・見た範囲・定型の言葉・時刻と音 */
  .sview .sv-flow,.sview .sv-sec.sa>.sv-sechd,.sview .sv-sec.sb>.sv-sechd,.sview .sv-viewswitch,
  .sview .sv-mattabs,.sview .sv-screen.final>.sv-scrhd,.sview .sv-colhd,.sview .sv-script>.shd,
  .sview .abox .dcg,.sview .abox .afold,.sview .svrefnote,.sview .addrow,
  .sview .dbar .sv-barfacts,.sview .dbar .btn.kill,.sview .sheet .tagrow,
  .sview .sheet .atnudge .pickbtn,.sview .sv-now .nar,
  .sview .sv-ctrls-slot .ctime,.sview .sv-ctrls-slot [data-cbtn="mute"],
  .sview .sv-ctrls-slot .cvol{display:none}   /* 音量のつまみも 🔊 と一緒に畳む（再生の棒と2本に見えた・#604 E4） */

  /* ── 上の帯（← 一覧／番号と題名／案のタブ／版）── */
  .sview>.dtop{grid-area:top; position:static; margin:0; border-radius:0; border-width:0 0 1px;
    height:auto; min-height:48px; padding:4px 10px 4px 8px; gap:8px}
  .sview .dback{min-height:38px; padding:4px 12px}
  .sview .dtop .tags{display:none}
  .sview .dtop .sv-mver{flex:0 0 auto; font-size:var(--fs-xs); color:var(--muted);
    font-variant-numeric:tabular-nums}
  /* 案のタブ（検証の動画だけ）。両方の案が見える幅を優先し、題名のほうを「…」で縮める。
     見た目は広い画面と同じ下線型。帯は 48px 以上あるので、タブ帯を引き伸ばさず縦の真ん中に置く。
     タブの名前は括弧の前（「案A」）だけにする（括弧の中は .vx・#604 E6）。案が多くて入りきらない
     ときはタブ帯の側が縮んで横に送れる（帯そのものを画面からはみ出させない） */
  .sview .dtop .sv-vtabs{flex:0 1 auto; align-self:center; max-width:58%; min-width:0; gap:3px}
  .sview .dtop .ttl{flex:1 1 0}       /* 題名は残りの幅だけを取る（長い題名がタブ帯を押し縮めない） */
  .sview .dtop .sv-vtabs .vtab{height:32px; padding:0 7px; font-size:11px}
  .sview .dtop .sv-vtabs .vtab .vx{display:none}
  .sview .dtop .sv-vtabs .vtab::after{content:attr(data-short)}
  /* 「いまの工程」の1行（#637）。帯は出さないが、この1行は上の帯のすぐ下に出す（記録が無ければ行ごと 0） */
  .sview .sv-worknow{grid-area:now; margin:0; padding:6px 8px; border-bottom:1px solid var(--border-2)}

  /* ── 動画（切らずに・入るだけ大きく）── */
  .sview .sv-screen.final{grid-area:video; display:flex; flex-direction:column; min-height:0; min-width:0;
    gap:0; background:#000}
  .sview .sv-screen.final>.loadbox{margin:auto}
  .sview .sv-screen.final>.vidbox{flex:1 1 0; width:100%; height:auto; min-height:0; max-width:none;
    aspect-ratio:auto; margin:0; border:none; border-radius:0}
  /* 枠いっぱいに置いて object-fit:contain で「切らずに・入るだけ大きく」（縦長でも横長でも） */
  .sview .sv-screen.final>.vidbox>video{position:absolute; inset:0; width:100%; height:100%}

  /* ── 再生・−0.5秒・+0.5秒・再生バー を1行 ── */
  .sview .sv-ctrls-slot{grid-area:ctrls; padding:4px 8px 2px}
  .sview .sv-ctrls-slot .ctrls{flex-wrap:nowrap; gap:6px; padding:0; margin:0}
  .sview .sv-ctrls-slot .cbtn{height:40px; min-width:48px; padding:0 6px; font-size:var(--fs-xs); flex:0 0 auto}
  .sview .sv-ctrls-slot .cbtn.play{font-size:var(--fs-md)}
  .sview .sv-ctrls-slot .seek{height:40px; flex:1 1 auto; order:0; min-width:60px}
  .sview .sv-ctrls-slot .seek .tptrack{height:4px; margin-top:-2px}

  /* ── タブ（素材・台本・指摘）。もう一度押すと閉じる ── */
  .sview .sv-mtabs{grid-area:tabs; display:flex; gap:6px; padding:4px 8px 6px;
    border-bottom:1px solid var(--border-2)}
  .sview .sv-mtabs button{flex:1 1 0; font-family:inherit; font-size:var(--fs-sm); min-height:40px;
    cursor:pointer; border:1px solid var(--border); background:var(--surface-1); color:var(--ink-2);
    border-radius:var(--r-md)}
  .sview .sv-mtabs button[aria-pressed="true"]{background:var(--act-soft); color:var(--sub-ink);
    border-color:var(--act-line); font-weight:680; box-shadow:inset 0 0 0 1px var(--act-line)}

  /* ── タブの中身（どれか1つだけ・中だけ縦に動く）── */
  .sview .sv-matcol,.sview .sv-script,.sview .tapbox,.sview .sv-sec.sc,.sview .rjpanel{
    grid-area:panel; display:none; min-height:0; min-width:0; overflow-y:auto;
    overscroll-behavior:contain; padding:8px 12px}
  .sview[data-mtab="mat"] .sv-matcol{display:flex; flex-direction:column; gap:10px}
  .sview[data-mtab="script"] .sv-script{display:flex; flex-direction:column; overflow:hidden; padding:0}
  .sview[data-mtab="notes"] .tapbox,.sview[data-mtab="notes"] .sv-sec.sc{display:flex; flex-direction:column}
  /* 素材: いまのシーンの開始／終了 → 参照画像（小さく）→ 参照動画 */
  .sview .sv-now{--slot-h:clamp(110px, 24dvh, 200px); flex:0 0 auto; overflow:visible; height:auto}
  .sview .sv-refbox{--ref-h:84px}
  .sview .sv-matcol .sv-screen.ref{display:flex; flex-direction:column; gap:4px;
    border-top:1px solid var(--border-2); padding-top:8px}
  .sview .sv-matcol .sv-screen.ref .vidbox{--rh:clamp(150px, 30dvh, 260px); height:var(--rh);
    width:calc(var(--rh) * 9 / 16); max-width:100%; aspect-ratio:auto; margin:0}
  .sview.sv-noref .sv-matcol .sv-screen.ref{display:none}
  /* 台本: シーンごとのナレーション（押すとそのシーンへ） */
  .sview .sv-scriptlist{flex:1 1 auto; max-height:none; min-height:0; overflow-y:auto;
    border:none; border-radius:0}
  .sview .sv-script.closed>.sv-scriptlist{display:block}
  /* 指摘: 今回の指摘（直す・消す）→ 全体へのメモ → 前回までの指摘 */
  .sview .tapbox{gap:10px}
  /* 「今回の」は前に足した別の箱なので、間の gap が効いて「今回の　指摘」と空いていた（#604 E7）。
     件数は margin-left:auto で右へ寄るので、gap を外しても離れたまま */
  .sview .tapbox .nhd{display:flex; gap:0; font-size:var(--fs-sm)}
  .sview .tapbox .nhd::before{content:'今回の'}
  .sview .nlistwrap{flex:0 0 auto; min-height:auto; overflow:visible}
  .sview .tapbox>.sv-macau{order:0; margin:0}
  .sview .tapbox>.sv-sec.sc{order:5; padding:0; border:none; background:transparent; box-shadow:none;
    overflow:visible; flex:0 0 auto; min-height:auto}
  .sview .sv-sec.sc>.sv-sechd{display:flex; height:auto; min-height:28px; font-size:var(--fs-sm)}
  .sview .sv-prevlist{flex:0 0 auto; overflow:visible; min-height:auto}
  .sview .nitem.sv-scn,.sview .sv-prow.cur{box-shadow:inset 3px 0 0 var(--act-line)}
  .sview .memo{height:64px; min-height:64px; max-height:none; font-size:16px}
  /* 全体へのメモはスマホでは入力欄を出さない（触るとキーボードが勝手に出る・#552 の続き）。
     書いてあれば1行と「直す」だけ。「直す」で下の入力画面をメモとして開く */
  .sview .tapbox>.svmemo{display:none}
  .sview .tapbox>.sv-mmemo:not([hidden]){display:flex; order:4; align-items:center; gap:8px;
    padding:8px 10px; border:1px solid var(--border-2); border-radius:var(--r-md); background:var(--surface-1)}
  .sview .sv-mmemo .lbl{flex:0 0 auto; margin:0; font-size:var(--fs-xs); color:var(--ink-2)}
  .sview .sv-mmemo .txt{flex:1 1 auto; min-width:0; font-size:var(--fs-sm); overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap}
  .sview .sv-mmemo .btn{flex:0 0 auto}

  /* ── 指摘を足す 段1「場所を選ぶ」（#552 の続き・オーナー指摘 2026-09-25）──────────
     動画は止まったまま大きく残し、タブと下の帯の代わりに案内の1行とボタン2つを出す。
     絵を触るとそこに印が付いて段2へ。動画の上の帯（パソコン用の案内）はスマホでは出さない */
  .sview .pickband{display:none!important}
  body.sv-pick1 .sview.sview{grid-template-rows:auto auto minmax(0,1fr) auto auto 0px auto auto}
  body.sv-pick1 .sview.sview .sv-mtabs,body.sv-pick1 .sview.sview .dbar,
  body.sv-pick1 .sview.sview .sv-matcol,body.sv-pick1 .sview.sview .sv-script,
  body.sv-pick1 .sview.sview .tapbox,body.sv-pick1 .sview.sview .sv-sec.sc{display:none}
  body.sv-pick1 .sview .sv-mpick{grid-area:bar; display:flex; flex-wrap:wrap; align-items:center;
    gap:8px; padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    border-top:2px solid var(--act-line); background:var(--act-soft)}
  .sview .sv-mpick .msg{flex:1 1 100%; font-size:var(--fs-sm); font-weight:650; color:var(--sub-ink)}
  .sview .sv-mpick .btn{flex:1 1 0; height:46px; min-height:46px; font-size:var(--fs-sm)}

  /* ── 指摘を足す 段2「書く」: 動画・タブ・上下の帯を隠した全画面の入力画面 ──────────
     上に「0:14 シーン3『…』」と止めた場面の小さな静止画、その下にキーボードの上まで広がる
     入力欄、いちばん下（＝キーボードのすぐ上）に「この指摘を足す」「やめる」。高さは
     visualViewport（--sv-vh）に合わせ続けるので、ボタンはキーボードに隠れない。
     入力中は送信のボタン（下の帯）が画面に無い＝打っている最中に送ってしまうことがない */
  body.sheetopen .sview.sview{grid-template-rows:0px 0px 0px 0px 0px minmax(0,1fr) auto 0px}
  body.sheetopen .sview.sview>.dtop,body.sheetopen .sview.sview .sv-screen.final,
  body.sheetopen .sview.sview .sv-matcol,body.sheetopen .sview.sview .sv-script,
  body.sheetopen .sview.sview .sv-ctrls-slot,body.sheetopen .sview.sview .sv-mtabs,
  body.sheetopen .sview.sview .sv-sec.sc,body.sheetopen .sview.sview .dbar,
  body.sheetopen .sview.sview .sv-worknow{display:none}

const offDispatcherItem = it => !!it && (isPilotSeq(it.seq) || STORAGE_ONLY_CH.has(it.channel));

const ASSET_BUCKET = 'review-assets';

const DAY = 86400000;

const partsOf = (d, opt) => {
  const o = {};
  for (const p of new Intl.DateTimeFormat('ja-JP', Object.assign({timeZone:'Asia/Tokyo'}, opt)).formatToParts(d)) o[p.type] = p.value;
  return o;

const DT_OPT = {year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', hourCycle:'h23'};
/* JST の曜日1文字（日月火水木金土） */
const jstWD = d => partsOf(d, {weekday:'short'}).weekday;
function fmtDT(iso){
  if (!iso) return null;
  const d = new Date(iso); if (isNaN(d)) return null;
  const p = partsOf(d, DT_OPT);
  return `${p.year}-${p.month}-${p.day}(${jstWD(d)}) ${p.hour}:${p.minute}`;
}
function fmtDate(iso){
  if (!iso) return null;
  const d = new Date(iso); if (isNaN(d)) return null;
  const p = partsOf(d, {year:'numeric', month:'2-digit', day:'2-digit'});
  return `${p.year}-${p.month}-${p.day}(${jstWD(d)})`;
}
function fmtTime(iso){
  if (!iso) return '';
  const d = new Date(iso); if (isNaN(d)) return '';
  const p = partsOf(d, {hour:'2-digit', minute:'2-digit', hourCycle:'h23'});
  return `${p.hour}:${p.minute}`;
}
function fmtMD(iso){
  if (!iso) return '';
  const d = new Date(iso); if (isNaN(d)) return '';
  const p = partsOf(d, {month:'numeric', day:'numeric'});
  return `${p.month}/${p.day}`;
}
/* 分析のグラフの横軸・ツールチップ用: 08/04(火) の形（オーナー指定 2026-09-03） */
function fmtMDW(iso){
  if (!iso) return '';
  const d = new Date(iso); if (isNaN(d)) return '';
  const p = partsOf(d, {month:'2-digit', day:'2-digit'});
  return `${p.month}/${p.day}(${jstWD(d)})`;
}
function daysSince(iso){
  if (!iso) return null;
  const d = new Date(iso); if (isNaN(d)) return null;
  return Math.max(0, Math.floor((Date.now() - d.getTime()) / DAY));
}
function jstDateStr(offsetDays){
  const d = new Date(Date.now() + (offsetDays || 0) * DAY);

}
